# Что GitHub Pages НЕ выкладывает на vahta.razvedchick.ru
#
# Сайт раздаётся прямо из ветки, без сборочного процесса, поэтому по умолчанию
# в публикацию уходит ВЕСЬ корень репозитория. Скрыты только каталоги на «.»
# и «_», то есть .github и .cursor. Всё остальное было доступно по прямой
# ссылке любому, кто её угадает.
#
# Что именно утекало и почему это важно:
#   docs/BACKLOG_SECURITY.md   — буквальный перечень ЕЩЁ НЕ ЗАКРЫТЫХ дыр
#                                с указанием функций и строк. Готовая карта
#                                для того, кто захочет их использовать.
#   docs/RUNBOOK_STOCK_RECOVERY.md, docs/AUDIT_REPORT.md — внутренние
#                                процедуры и разбор слабых мест.
#   supabase/migrations/       — схема базы, политики доступа и тела функций
#                                прав. Живых ключей там нет, но знание модели
#                                прав сильно упрощает поиск обхода.
#   infra/                     — описание инфраструктуры (сами файлы ключей
#                                закрыты .gitignore, но структура видна).
#   native/, native-desktop/   — исходники обёрток, включая мост сохранения
#                                файлов и настройки подписи.
#
# Оговорка, чтобы не было ложного спокойствия: репозиторий ПУБЛИЧНЫЙ, и всё
# перечисленное по-прежнему открыто на самом GitHub. Это правило убирает
# раздачу с домена приложения — не более того. Настоящее решение — закрыть
# репозиторий (см. разговор про Cloudflare Pages) и не хранить перечень
# незакрытых дыр в открытом месте.
#
# ВАЖНО при правке: перечисляем только КАТАЛОГИ и не трогаем корневые файлы.
# vahtahoz.html, sw.js, manifest.webmanifest, supabase.js, xlsx.js, beta/
# обязаны остаться — на них держится приложение. Jekyll копирует файлы без
# заголовка front matter как есть, поэтому разметку он не портит.

exclude:
  - docs/
  - infra/
  - native/
  - native-desktop/
  - supabase/
  - README.md
  - scripts/
