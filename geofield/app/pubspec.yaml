name: geofield
description: GeoField — полевой сбор геологической первички. Прототип экрана сбора пробы (ТЗ 6.5).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0' # Color.withValues и свежий PopScope

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.3.3                 # UUID сущностей и мутаций (офлайн, без коллизий)
  sqflite: ^2.3.0             # SQLite на мобильных
  sqflite_common_ffi: ^2.3.0  # SQLite на десктопе (Windows/macOS/Linux)
  path: ^1.9.0
  qr_flutter: ^4.1.0          # QR штрихкода пробы на экран
  image_picker: ^1.1.2        # фото обнажений/проб: камера и галерея (ТЗ §6.6)
  geolocator: ^13.0.1         # координаты точки с приёмника (ТЗ §6.2)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Нативная сборка sqlite3: использовать системную библиотеку вместо скачивания
# прекомпилированной (в средах за прокси скачивание бьётся о проверку хэша).
hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  uses-material-design: true
  # Прод: сюда добавляются офлайн-шрифты (Manrope, JetBrains Mono) как assets —
  # без сетевой загрузки шрифтов (поле без связи). В прототипе — системный
  # гротеск + системный моноширинный ('monospace').
