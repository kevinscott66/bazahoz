<style>
  html,body{ -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; padding-bottom:env(safe-area-inset-bottom); }

  .safe-bot{ padding-bottom:calc(88px + env(safe-area-inset-bottom)); }
  .btn{ min-height:52px; border-radius:14px; font-weight:600; font-size:17px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 18px; transition:transform .06s ease, background .15s; user-select:none; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:#2563eb; color:#fff; }
  .btn-primary:active{ background:#1d4ed8; }
  .btn-ghost{ background:rgba(255,255,255,.06); color:inherit; }
  .btn-danger{ background:#dc2626; color:#fff; }
  .btn-success{ background:#16a34a; color:#fff; }
  .btn-warn{ background:#d97706; color:#fff; }
  .input{ width:100%; min-height:52px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:inherit; font-size:17px; outline:none; }
  .input:focus{ border-color:#2563eb; }
  .card{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:16px; }
  .light .card{ background:#fff; border-color:#e5e7eb; }
  .light .btn-ghost{ background:#f3f4f6; }
  .light .input{ background:#fff; border-color:#d1d5db; color:#111827; }
  .chip{ padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600; background:rgba(255,255,255,.06); }
  .chip.active{ background:#2563eb; color:#fff; }
  .light .chip{ background:#f3f4f6; color:#111827; }
  .light .chip.active{ background:#2563eb; color:#fff; }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; font-size:11px; color:#9ca3af; }
  .nav-btn.active{ color:#60a5fa; }
  .light .nav-btn{ color:#6b7280; }
  .light .nav-btn.active{ color:#2563eb; }
  .badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; }
  .badge-red{ background:#dc2626; color:#fff; }
  .badge-yellow{ background:#d97706; color:#fff; }
  .badge-green{ background:#16a34a; color:#fff; }
  .badge-gray{ background:#374151; color:#e5e7eb; }
  .sheet{ position:fixed; inset:0; z-index:60; display:none; }
  .sheet.open{ display:flex; }
  .sheet-bg{ position:absolute; inset:0; background:rgba(0,0,0,.6); }
  .sheet-body{ position:relative; margin-top:auto; width:100%; max-width:560px; margin-left:auto; margin-right:auto; background:#0b1220; border-radius:24px 24px 0 0; padding:20px; max-height:92vh; overflow-y:auto; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  .light .sheet-body{ background:#fff; }

  .scroll-x::-webkit-scrollbar{ display:none; }

  .light .divider{ background:#e5e7eb; }

      <div id="dateStr" class="text-sm text-gray-400"></div>

  <!-- Views -->
  <main id="views" class="px-4 pt-2">
    <!-- Dashboard -->
    <section data-view="dashboard" class="space-y-3"></section>
    <!-- Tasks -->
    <section data-view="tasks" class="space-y-3 hidden"></section>
    <!-- Stock -->
    <section data-view="stock" class="space-y-3 hidden"></section>
    <!-- Kitchen -->
    <section data-view="kitchen" class="space-y-3 hidden"></section>
    <!-- More -->

</div>

    <button class="nav-btn active" data-nav="dashboard"><span class="text-xl">🏠</span><span>Дашборд</span></button>

</nav>

</div>

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return structuredClone(defaultState);
    const s = JSON.parse(raw);
    const base = structuredClone(defaultState);
    const merged = { ...base, ...s };
    merged.categories = { ...base.categories, ...(s.categories||{}) };
    merged.checklists = { ...base.checklists, ...(s.checklists||{}) };
    merged.pomodoro = { ...base.pomodoro, ...(s.pomodoro||{}) };
    merged.journals = { ...base.journals, ...(s.journals||{}) };
    return merged;
  }catch(e){ return structuredClone(defaultState); }
}

/* ---------- Utils ---------- */
const uid = () => (crypto?.randomUUID?.() || (Date.now()+"_"+Math.random().toString(16).slice(2)));
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate = (s) => { if(!s) return "—"; const [y,m,d]=s.split("-"); return `${d}.${m}.${y}`; };
const daysLeft = (s) => { if(!s) return null; const a=new Date(s+"T00:00:00"); const b=new Date(todayStr()+"T00:00:00"); return Math.round((a-b)/86400000); };
const esc = (s) => (s??"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.remove("hidden");

}
function logOp(action, detail){

/* ---------- Sheet ---------- */
let _sheetOnClose = null;
function openSheet(html){
  // предыдущий sheet принудительно закрываем с резолвом null, чтобы await не висел
  if(_sheetOnClose){ try{ _sheetOnClose(); }catch(e){} _sheetOnClose = null; }
  const s=document.getElementById("sheet");
  // Заменяем sheetBody на свежий клон, чтобы сбросить все старые addEventListener
  const oldBody = document.getElementById("sheetBody");
  const freshBody = oldBody.cloneNode(false);
  oldBody.replaceWith(freshBody);
  freshBody.innerHTML = html;
  s.classList.add("open");
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  if(_sheetOnClose){ const cb=_sheetOnClose; _sheetOnClose=null; try{ cb(); }catch(e){} }
}

/* промис-обёртки вместо нативных confirm/prompt */
function confirmSheet(msg, opts={}){
  return new Promise(resolve=>{
    openSheet(`
      <div class="font-bold text-lg mb-3">${esc(opts.title||"Подтверждение")}</div>
      <div class="mb-4 opacity-80 whitespace-pre-line">${esc(msg)}</div>
      <div class="flex gap-2">
        <button class="btn btn-ghost flex-1" id="_confNo">${esc(opts.no||"Отмена")}</button>
        <button class="btn ${opts.danger?"btn-danger":"btn-primary"} flex-1" id="_confYes">${esc(opts.yes||"Ок")}</button>
      </div>
    `);
    _sheetOnClose = ()=>resolve(false);
    document.getElementById("_confNo").onclick = ()=>{ closeSheet(); };
    document.getElementById("_confYes").onclick = ()=>{ _sheetOnClose=null; closeSheet(); resolve(true); };
  });
}
function promptSheet(msg, def="", opts={}){
  return new Promise(resolve=>{
    openSheet(`
      <div class="font-bold text-lg mb-3">${esc(opts.title||"Ввод")}</div>
      <div class="mb-2 opacity-80 whitespace-pre-line">${esc(msg)}</div>
      <input class="input mb-3" id="_promptInp" value="${esc(def)}" ${opts.numeric?'type="number" inputmode="decimal"':''} />
      <div class="flex gap-2">
        <button class="btn btn-ghost flex-1" id="_pNo">Отмена</button>
        <button class="btn btn-primary flex-1" id="_pYes">Ок</button>
      </div>
    `);
    const inp = document.getElementById("_promptInp");
    setTimeout(()=>{ inp.focus(); inp.select?.(); },50);
    _sheetOnClose = ()=>resolve(null);
    const ok = ()=>{ const v=inp.value; _sheetOnClose=null; closeSheet(); resolve(v); };
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") ok(); });
    document.getElementById("_pNo").onclick = ()=>{ closeSheet(); };
    document.getElementById("_pYes").onclick = ok;
  });
}
function chooseSheet(msg, options){
  // options: [{label, value, color?}]
  return new Promise(resolve=>{
    openSheet(`
      <div class="font-bold text-lg mb-3">${esc(msg)}</div>
      <div class="space-y-2">
        ${options.map((o,i)=>`<button class="btn ${o.color||"btn-primary"} w-full" data-choice="${i}">${esc(o.label)}</button>`).join("")}
        <button class="btn btn-ghost w-full" data-choice="-1">Отмена</button>
      </div>
    `);

    document.getElementById("sheetBody").addEventListener("click", e=>{
      const t = e.target.closest("[data-choice]"); if(!t) return;
      const i = Number(t.dataset.choice);
      _sheetOnClose = null;
      closeSheet();
      resolve(i<0 ? null : options[i].value);
    });
  });
}

/* ---------- Stock helpers ---------- */
function stockStatus(it){
  const low = (it.qty!==""&&it.minStock!==""&&Number(it.qty) <= Number(it.minStock));
  if(it.type==="product" && it.expiry){
    const d = daysLeft(it.expiry);
    if(d<0) return { color:"red", text:`Просрочено (${-d} дн.)`, rank:0 };
    if(d<=3) return { color:"red", text:`Срок ≤ ${d} дн.`, rank:1 };
    if(d<=14) return { color:"yellow", text:`Срок ${d} дн.`, rank:2 };
  }
  if(low) return { color:"yellow", text:`Низкий запас`, rank:3 };
  return { color:null, text:"", rank:9 };
}
function sortedStock(items){
  return [...items].sort((a,b)=>{
    const ra=stockStatus(a).rank, rb=stockStatus(b).rank;
    if(ra!==rb) return ra-rb;
    const ea=a.expiry||"9999-12-31", eb=b.expiry||"9999-12-31";
    if(ea!==eb) return ea.localeCompare(eb);
    return (a.name||"").localeCompare(b.name||"","ru");
  });
}

/* ---------- Tasks ---------- */
const TASK_CATS = ["Все","Склад","Кухня","База","Общее"];
const TASK_PRIOS = ["Низкий","Средний","Высокий"];
let taskFilter = { cat:"Все", showDone:false };

function renderTasks(){
  const v = document.querySelector('[data-view="tasks"]');
  let list = state.tasks.slice();
  if(taskFilter.cat!=="Все") list = list.filter(t=>t.category===taskFilter.cat);
  if(!taskFilter.showDone) list = list.filter(t=>!t.done);
  list.sort((a,b)=>{
    const da = a.due?daysLeft(a.due):999, db=b.due?daysLeft(b.due):999;
    if(da!==db) return da-db;
    const pa = TASK_PRIOS.indexOf(a.priority), pb = TASK_PRIOS.indexOf(b.priority);
    return pb-pa;
  });

  v.innerHTML = `
    <button class="btn btn-primary w-full" onclick="openTaskEdit()">＋ Новая задача</button>

    <div class="scroll-x flex gap-2 pb-1">
      ${TASK_CATS.map(c=>`<button class="chip ${taskFilter.cat===c?"active":""}" onclick="taskFilter.cat='${c}';render()">${c}</button>`).join("")}
      <button class="chip ${taskFilter.showDone?"active":""}" onclick="taskFilter.showDone=!taskFilter.showDone;render()">Показывать выполненные</button>
    </div>

    ${list.length
      ? `<div class="space-y-2">${list.map(taskRow).join("")}</div>`
      : `<div class="card text-center opacity-70">Задач нет 🎉</div>`}
  `;
}

function taskRow(t){
  const d = t.due?daysLeft(t.due):null;
  let dueBadge="";
  if(t.due){
    if(d<0) dueBadge=`<span class="badge badge-red">Просрочено ${-d} дн.</span>`;
    else if(d===0) dueBadge=`<span class="badge badge-yellow">Сегодня</span>`;
    else dueBadge=`<span class="badge badge-gray">${fmtDate(t.due)}</span>`;
  }
  const prioBadge = t.priority==="Высокий"?`<span class="badge badge-red">!</span>`
                  : t.priority==="Средний"?`<span class="badge badge-yellow">~</span>`:"";
  return `
    <div class="card flex items-start gap-3 ${t.done?"opacity-60":""}">
      <button class="mt-1" onclick="toggleTask('${t.id}')" aria-label="done">
        <span class="inline-block w-8 h-8 rounded-full border-2 ${t.done?"bg-green-600 border-green-600":"border-gray-500"}">
          ${t.done?'<span class="block text-white text-center leading-7">✓</span>':""}
        </span>
      </button>
      <div class="flex-1 min-w-0" onclick="openTaskEdit('${t.id}')">
        <div class="font-semibold ${t.done?"line-through":""}">${esc(t.title)}</div>
        <div class="text-xs opacity-70 mt-1 flex flex-wrap gap-2 items-center">
          <span class="badge badge-gray">${esc(t.category||"Общее")}</span>
          ${prioBadge} ${dueBadge}
          ${t.repeat&&t.repeat!=="Нет"?`<span class="badge badge-gray">🔁 ${esc(t.repeat)}</span>`:""}
        </div>
      </div>
    </div>`;
}

function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.done = !t.done;
  if(t.done){
    logOp("TASK_DONE", t.title);
    if(t.repeat && t.repeat!=="Нет" && t.due){
      const next = new Date(t.due+"T00:00:00");
      if(t.repeat==="День") next.setDate(next.getDate()+1);
      if(t.repeat==="Неделя") next.setDate(next.getDate()+7);
      if(t.repeat==="Месяц") next.setMonth(next.getMonth()+1);
      const nextDue = next.toISOString().slice(0,10);
      // не плодим дубли, если копия уже есть (повторный тоггл)
      const exists = state.tasks.some(x=>x.title===t.title && x.due===nextDue && x.repeat===t.repeat && !x.done);
      if(!exists){
        state.tasks.push({...t, id:uid(), done:false, due:nextDue, createdAt:new Date().toISOString()});
      }
    }
  }
  saveState(); render();
}

      </div>
    </div>

function saveTask(id){
  const body = document.getElementById("sheetBody");
  const title = body.querySelector("#tt").value.trim();
  if(!title){ toast("Название обязательно"); return; }
  const cat = body.querySelector(".chip.active[data-cat]")?.dataset.cat || "Общее";
  const prio = body.querySelector(".chip.active[data-prio]")?.dataset.prio || "Средний";
  const rep = body.querySelector(".chip.active[data-rep]")?.dataset.rep || "Нет";
  const due = body.querySelector("#td").value;
  if(id){
    const t = state.tasks.find(x=>x.id===id);
    Object.assign(t,{title,category:cat,priority:prio,repeat:rep,due});
    logOp("TASK_EDIT", title);
  } else {
    state.tasks.push({id:uid(), title, category:cat, priority:prio, repeat:rep, due, done:false, createdAt:new Date().toISOString()});
    logOp("TASK_ADD", title);
  }
  saveState(); closeSheet(); render();
}
async function deleteTask(id){
  if(!await confirmSheet("Удалить задачу?",{danger:true,yes:"Удалить"})) return;
  const t = state.tasks.find(x=>x.id===id);
  state.tasks = state.tasks.filter(x=>x.id!==id);
  logOp("TASK_DEL", t?.title||"");
  saveState(); closeSheet(); render();
}

    stockSearchT = setTimeout(()=>{
      stockSearch = inp.value;
      stockLimit = 100;
      renderStockList();
    }, 150);
  });
  renderStockList();
}

function renderStockList(){
  const box = document.getElementById("stockListBox");
  if(!box) return;
  let list = state.stock.slice();
  if(stockTab==="product") list = list.filter(s=>s.type==="product");
  if(stockTab==="household") list = list.filter(s=>s.type==="household");
  if(stockCat) list = list.filter(s=>s.category===stockCat);
  if(stockSearch.trim()){
    const q = stockSearch.trim().toLowerCase();
    list = list.filter(s=>(s.name||"").toLowerCase().includes(q));
  }
  list = sortedStock(list);
  const total = list.length;
  const shown = list.slice(0, stockLimit);
  if(!total){
    box.innerHTML = `<div class="card text-center opacity-70">Ничего не найдено</div>`;
    return;
  }
  const more = total > shown.length
    ? `<button class="btn btn-ghost w-full mt-2" id="stockMore">Показать ещё (${total - shown.length})</button>`
    : `<div class="text-center text-xs opacity-60 mt-2">Показано всё: ${total}</div>`;
  box.innerHTML = `<div class="space-y-2">${shown.map(stockRow).join("")}</div>${more}`;
  const moreBtn = document.getElementById("stockMore");
  if(moreBtn) moreBtn.addEventListener("click", ()=>{ stockLimit += 200; renderStockList(); });
}

function renderJournal(kind){
  const m = JOURNAL_META[kind];
  const list = [...(state.journals[kind]||[])].sort((a,b)=> (b.ts||"").localeCompare(a.ts||""));
  const rows = list.map(op=>{
    const when = new Date(op.ts).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    const status = kind==="order"
      ? (op.status==="received"
          ? `<span class="badge badge-green">Принят</span>`
          : `<span class="badge badge-yellow">Ожидает</span>`)
      : "";
    const qtyBadge = `<span class="badge badge-gray">${op.qty} ${esc(op.unit||"")}</span>`;
    const receiveBtn = (kind==="order" && op.status!=="received")
      ? `<button class="btn btn-success" onclick="orderReceive('${op.id}')">Принять на склад</button>`
      : "";
    return `<div class="card">
      <div class="flex items-start gap-2">
        <div class="flex-1 min-w-0">
          <div class="font-semibold">${esc(op.productName)}</div>
          <div class="text-xs opacity-70 mt-1 flex flex-wrap gap-2 items-center">
            ${qtyBadge}
            <span class="badge badge-gray">${when}</span>
            ${status}
          </div>
          ${op.note?`<div class="text-xs opacity-80 mt-1">${esc(op.note)}</div>`:""}
        </div>
        <button class="btn btn-ghost" onclick="deleteOp('${kind}','${op.id}')">🗑</button>
      </div>
      ${receiveBtn?`<div class="mt-2">${receiveBtn}</div>`:""}
    </div>`;
  }).join("") || `<div class="card text-center opacity-70">Записей нет</div>`;

  // группируем суммы по единицам (шт+кг смешивать нельзя)
  const byUnit = {};
  list.forEach(o=>{ const u = o.unit||"—"; byUnit[u] = (byUnit[u]||0) + Number(o.qty||0); });
  const sumStr = Object.entries(byUnit)
    .map(([u,v])=>`${v.toFixed(2).replace(/\.00$/,"")} ${esc(u)}`)
    .join(", ");

  return `
    <button class="btn ${m.color} w-full mt-3" onclick="openOpEdit('${kind}')">＋ ${m.label}</button>
    <div class="text-xs opacity-70 mt-2">Записей: ${list.length}${sumStr?`  ·  сумма по ед.: ${sumStr}`:""}</div>
    <div class="space-y-2 mt-2">${rows}</div>`;
}

function saveOp(kind){
  const m = JOURNAL_META[kind];
  const body = document.getElementById("sheetBody");
  const pid = body.querySelector("#opProdId").value;
  const manualName = body.querySelector("#opName").value.trim();
  const qty = Number((body.querySelector("#opQty").value||"0").replace(",","."));
  const unit = body.querySelector("#opUnit").value;
  const note = body.querySelector("#opNote").value.trim();
  if(!qty || qty<=0){ toast("Укажи количество"); return; }
  const product = pid ? state.stock.find(s=>s.id===pid) : null;
  const name = product ? product.name : manualName;
  if(!name){ toast("Выбери позицию или введи название"); return; }
  if(product && m.sign<0 && Number(product.qty||0) < qty){ toast("Не хватает на складе"); return; }

  const op = {
    id: uid(),
    ts: new Date().toISOString(),
    productId: product?.id || "",
    productName: name,
    qty,
    unit: product?.unit || unit,
    note,
  };
  if(kind==="order") op.status = "pending";

  if(product && m.sign!==0){
    product.qty = Number(product.qty||0) + m.sign*qty;
    product.updatedAt = new Date().toISOString();
  }
  state.journals[kind] = state.journals[kind] || [];
  state.journals[kind].unshift(op);
  logOp(kind.toUpperCase(), `${name} ${m.sign>0?"+":m.sign<0?"-":""}${qty} ${op.unit||""}`);
  saveState(); closeSheet(); render();
  toast(`${m.verb}: ${name}`);
}

function orderReceive(opId){
  const op = state.journals.order.find(o=>o.id===opId); if(!op) return;
  if(op.status==="received") return;
  op.status = "received";
  op.receivedAt = new Date().toISOString();
  let product = op.productId ? state.stock.find(s=>s.id===op.productId) : null;
  if(!product){
    // авто-создание позиции на складе по ручному имени
    product = {
      id: uid(), type:"product", name: op.productName,
      qty: 0, unit: op.unit||"шт", minStock:"", expiry:"", location:"",
      category:"Прочие продукты", note:"", createdAt:new Date().toISOString(),
    };
    state.stock.push(product);
    op.productId = product.id;
  }
  product.qty = Number(product.qty||0) + Number(op.qty||0);
  product.updatedAt = new Date().toISOString();
  state.journals.receipt.unshift({
    id: uid(),
    ts: new Date().toISOString(),
    productId: product?.id || "",
    productName: op.productName,
    qty: op.qty,
    unit: op.unit,
    note: `Из заказа${op.note?": "+op.note:""}`,
  });
  logOp("ORDER_RECEIVE", `${op.productName} +${op.qty} ${op.unit||""}`);
  saveState(); render();
  toast("Принято на склад");
}

async function deleteOp(kind, opId){
  const op = (state.journals[kind]||[]).find(o=>o.id===opId);
  if(!op) return;
  const m = JOURNAL_META[kind];
  // эффективный знак для отката (order влияет на склад только при status==="received", знак +1)
  const effectiveSign = kind==="order"
    ? (op.status==="received" ? +1 : 0)
    : m.sign;
  let revert = false;
  const product = op.productId ? state.stock.find(s=>s.id===op.productId) : null;

  if(effectiveSign!==0 && product){
    const choice = await chooseSheet(
      `Удалить запись?\n${op.productName} — ${op.qty} ${op.unit||""}`,
      [
        { label:"Удалить и ОТКАТИТЬ склад", value:"revert", color:"btn-warn" },
        { label:"Удалить только запись", value:"keep", color:"btn-danger" },
      ]
    );
    if(!choice) return;
    revert = choice==="revert";
    if(revert){
      const next = Number(product.qty||0) - effectiveSign*Number(op.qty||0);
      if(next<0){ toast("Нельзя откатить: на складе меньше"); return; }
      product.qty = next; product.updatedAt = new Date().toISOString();
      // если принятый заказ — удалить и парную запись в Поступлении
      if(kind==="order"){
        state.journals.receipt = (state.journals.receipt||[]).filter(r=>{
          if(r.productId!==product.id) return true;
          if(Number(r.qty)!==Number(op.qty)) return true;
          if(!(r.note||"").startsWith("Из заказа")) return true;
          return false;
        });
      }
      // если позиция была авто-создана (qty=0 и нет других журнальных записей) — предложить удалить
      if(product.qty===0){
        const hasOther = ["receipt","issue","writeoff","order"].some(k=>
          (state.journals[k]||[]).some(r=>r.productId===product.id)
        );
        if(!hasOther && await confirmSheet(`«${product.name}» на складе = 0 и больше не упоминается. Удалить позицию?`,{yes:"Удалить",no:"Оставить"})){
          state.stock = state.stock.filter(s=>s.id!==product.id);
        }
      }
    }
  } else {
    if(!await confirmSheet(`Удалить запись?\n${op.productName} — ${op.qty} ${op.unit||""}`,{danger:true,yes:"Удалить"})) return;
  }
  state.journals[kind] = state.journals[kind].filter(o=>o.id!==opId);
  logOp("OP_DEL", `${kind} ${op.productName} ${op.qty}${revert?" (откат)":""}`);
  saveState(); render();
}

async function quickAdjust(id, sign){
  const it = state.stock.find(s=>s.id===id); if(!it) return;
  const label = sign>0?"Сколько пришло?":"Сколько списать?";
  const val = await promptSheet(`${it.name}\n${label} (сейчас ${it.qty} ${it.unit||""})`, "1", {numeric:true,title: sign>0?"Приход":"Расход"});
  if(val===null) return;
  const n = Number((val||"").replace(",",".")); if(isNaN(n)||n<=0){ toast("Не число"); return; }
  const next = Number(it.qty||0) + sign*n;
  if(next<0){ toast("Не хватает на складе"); return; }
  it.qty = next; it.updatedAt = new Date().toISOString();
  const kind = sign>0?"receipt":"issue";
  state.journals[kind] = state.journals[kind]||[];
  state.journals[kind].unshift({ id:uid(), ts:new Date().toISOString(), productId:it.id, productName:it.name, qty:n, unit:it.unit||"", note:"(быстрая правка)" });
  logOp(sign>0?"IN":"OUT", `${it.name} ${sign>0?"+":"-"}${n} ${it.unit||""}`);
  saveState(); render();
}

function saveStock(id, type){
  const body = document.getElementById("sheetBody");
  const name = body.querySelector("#sn").value.trim();
  if(!name){ toast("Название обязательно"); return; }
  const qty = Number((body.querySelector("#sq").value||"0").replace(",","."));
  const unit = body.querySelector("#su").value;
  const minStock = body.querySelector("#sm").value===""?"":Number(body.querySelector("#sm").value.replace(",","."));
  const expiry = body.querySelector("#se")?.value || "";
  const note = body.querySelector("#sno").value.trim();
  const category = body.querySelector(".chip.active[data-cat]")?.dataset.cat || "";
  let location = "";
  if(type==="product"){
    location = body.querySelector(".chip.active[data-loc]")?.dataset.loc || "";
  } else {
    location = body.querySelector("#sl")?.value.trim() || "";
  }
  if(id){
    const it = state.stock.find(s=>s.id===id);
    Object.assign(it,{name,qty,unit,minStock,expiry,location,category,note,updatedAt:new Date().toISOString()});
    logOp("STOCK_EDIT", name);
  } else {
    state.stock.push({id:uid(),type,name,qty,unit,minStock,expiry,location,category,note,createdAt:new Date().toISOString()});
    logOp("STOCK_ADD", `${name} +${qty} ${unit}`);
  }
  saveState(); closeSheet(); render();
}
async function deleteStock(id){
  const it = state.stock.find(s=>s.id===id);
  if(!await confirmSheet(`Удалить «${it?.name||""}»?`,{danger:true,yes:"Удалить"})) return;
  state.stock = state.stock.filter(s=>s.id!==id);
  logOp("STOCK_DEL", it?.name||"");
  saveState(); closeSheet(); render();
}

  saveState(); openCategoriesEdit(); render();
}
async function renameCategory(type, oldName){
  const next = await promptSheet("Новое название:", oldName, {title:"Переименовать категорию"});
  if(next===null) return;
  const nextT = (next||"").trim(); if(!nextT || nextT===oldName) return;
  const arr = state.categories[type];
  const i = arr.indexOf(oldName); if(i<0) return;
  if(arr.includes(nextT) && nextT!==oldName){ toast("Уже есть"); return; }
  arr[i] = nextT;
  state.stock.forEach(s=>{ if(s.type===type && s.category===oldName) s.category=nextT; });
  logOp("CAT_RENAME", `${oldName} → ${nextT}`);
  saveState(); openCategoriesEdit(); render();
}
async function deleteCategory(type, name){
  const cnt = state.stock.filter(s=>s.type===type && s.category===name).length;
  const msg = cnt>0
    ? `В категории «${name}» ${cnt} позиций. Перенести в «Прочее» и удалить?`
    : `Удалить пустую категорию «${name}»?`;
  if(!await confirmSheet(msg,{danger:true,yes:"Удалить"})) return;
  state.categories[type] = state.categories[type].filter(c=>c!==name);
  const fallback = type==="product" ? "Прочие продукты" : "Прочее";
  if(!state.categories[type].includes(fallback)) state.categories[type].push(fallback);
  state.stock.forEach(s=>{ if(s.type===type && s.category===name) s.category=fallback; });
  if(stockCat===name) stockCat="";
  logOp("CAT_DEL", name);
  saveState(); openCategoriesEdit(); render();
}

/* ---------- Excel / CSV экспорт ---------- */
function ensureXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((resolve,reject)=>{
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = ()=>resolve(window.XLSX);
    s.onerror = ()=>reject(new Error("no network"));
    document.head.appendChild(s);
  });
}
async function exportXlsx(){
  toast("Готовлю файл...");
  let XLSX;
  try{ XLSX = await ensureXlsx(); }
  catch(e){ toast("Нет сети — сохраняю CSV"); exportCsv(); return; }
  const wb = XLSX.utils.book_new();
  const stockRows = sortedStock(state.stock).map(s=>({
    "Тип": s.type==="product"?"Продукт":"Хозка",
    "Категория": s.category||"",
    "Наименование": s.name,
    "Количество": Number(s.qty||0),
    "Ед. изм.": s.unit||"",
    "Мин. запас": s.minStock===""?"":Number(s.minStock),
    "Срок годности": s.expiry||"",
    "Место": s.location||"",
    "Примечание": s.note||"",
  }));
  const ws = XLSX.utils.json_to_sheet(stockRows);
  ws["!cols"] = [{wch:10},{wch:22},{wch:40},{wch:10},{wch:10},{wch:10},{wch:14},{wch:16},{wch:30}];
  XLSX.utils.book_append_sheet(wb, ws, "Остатки");

  const jSheet = (kind, title) => {
    const rows = (state.journals[kind]||[]).slice().sort((a,b)=>(b.ts||"").localeCompare(a.ts||"")).map(op=>{
      const r = {
        "Дата": new Date(op.ts).toLocaleString("ru-RU"),
        "Наименование": op.productName,
        "Количество": Number(op.qty||0),
        "Ед. изм.": op.unit||"",
        "Примечание": op.note||"",
      };
      if(kind==="order") r["Статус"] = op.status==="received"?"Принят":"Ожидает";
      return r;
    });
    const sh = XLSX.utils.json_to_sheet(rows.length?rows:[{"Дата":"","Наименование":"","Количество":"","Ед. изм.":"","Примечание":""}]);
    sh["!cols"] = [{wch:18},{wch:40},{wch:10},{wch:10},{wch:30},{wch:12}];
    XLSX.utils.book_append_sheet(wb, sh, title);
  };
  jSheet("receipt","Поступление");
  jSheet("issue","Выдача");
  jSheet("writeoff","Списание");
  jSheet("order","Заказы");

  XLSX.writeFile(wb, `vahtahoz-${todayStr()}.xlsx`);
  toast("Excel сохранён");
}
function exportCsv(){
  const header = ["Тип","Категория","Наименование","Количество","Ед. изм.","Мин. запас","Срок годности","Место","Примечание"];
  const rows = [header];
  sortedStock(state.stock).forEach(s=>rows.push([
    s.type==="product"?"Продукт":"Хозка",
    s.category||"", s.name, s.qty??0, s.unit||"",
    s.minStock??"", s.expiry||"", s.location||"", s.note||""
  ]));
  const csv = "\uFEFF" + rows.map(r=>r.map(v=>{
    const str = String(v??"");
    return /[;"\n\r]/.test(str) ? `"${str.replace(/"/g,'""')}"` : str;
  }).join(";")).join("\r\n");
  const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `vahtahoz-sklad-${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("CSV сохранён");
}

function importData(ev){
  const f = ev.target.files[0]; if(!f){ return; }
  const inputEl = ev.target;
  const r = new FileReader();
  r.onload = async () => {
    inputEl.value = ""; // чтобы можно было повторно выбрать тот же файл
    try{
      const obj = JSON.parse(r.result);
      const mode = await chooseSheet(
        `Найдено ${(obj.stock||[]).length} поз. Что делать?`,
        [
          { label:"Объединить (без дублей)", value:"merge", color:"btn-primary" },
          { label:"Заменить всё", value:"replace", color:"btn-danger" },
        ]
      );
      if(!mode) return;
      const base = mode==="replace" ? structuredClone(defaultState) : state;
      const merged = mode==="replace" ? { ...base, ...obj } : structuredClone(state);
      // категории
      const catBase = base.categories || structuredClone(defaultState).categories;
      if(obj.categories){
        merged.categories = {
          product: Array.from(new Set([...(catBase.product||[]), ...(obj.categories.product||[])])),
          household: Array.from(new Set([...(catBase.household||[]), ...(obj.categories.household||[])]))
        };
      } else {
        merged.categories = catBase;
      }
      // сток
      const norm = s => (s||"").toString().toLowerCase().replace(/\s+/g," ").trim();
      if(mode==="replace"){
        merged.stock = obj.stock||[];
      } else {
        const idx = new Map(); // key: type|normName → existing item
        (merged.stock||[]).forEach(it=> idx.set(`${it.type}|${norm(it.name)}`, it));
        let added=0, updated=0;
        (obj.stock||[]).forEach(src=>{
          const key = `${src.type||"product"}|${norm(src.name)}`;
          const found = idx.get(key);
          if(found){
            // обновляем количество и поля, которые пусты у существующего
            found.qty = Number(found.qty||0) + Number(src.qty||0);
            if(!found.expiry && src.expiry) found.expiry = src.expiry;
            if(!found.unit && src.unit) found.unit = src.unit;
            if(!found.category && src.category) found.category = src.category;
            if(!found.location && src.location) found.location = src.location;
            if(!found.note && src.note) found.note = src.note;
            found.updatedAt = new Date().toISOString();
            updated++;
          } else {
            merged.stock.push({...src, id: src.id || uid()});
            idx.set(key, merged.stock[merged.stock.length-1]);
            added++;
          }
        });
        toast(`+${added}, обновлено: ${updated}`);
      }
      if(mode==="replace"){
        merged.tasks = obj.tasks||[];
        merged.log = obj.log||[];
        merged.journals = obj.journals || { receipt:[], issue:[], writeoff:[], order:[] };
        merged.checklists = obj.checklists || merged.checklists;
        merged.theme = obj.theme || base.theme;
        merged.pomodoro = obj.pomodoro || merged.pomodoro;
      } else {
        // merge: объединяем по id, без дублей
        const mergeById = (a=[], b=[]) => {
          const ids = new Set((a||[]).map(x=>x.id));
          return [...(a||[]), ...(b||[]).filter(x=>!ids.has(x.id))];
        };
        merged.tasks = mergeById(merged.tasks||[], obj.tasks||[]);
        merged.log   = mergeById(merged.log||[],   obj.log||[]);
        if(obj.journals){
          merged.journals = merged.journals || { receipt:[], issue:[], writeoff:[], order:[] };
          ["receipt","issue","writeoff","order"].forEach(k=>{
            merged.journals[k] = mergeById(merged.journals[k]||[], obj.journals[k]||[]);
          });
        }
      }
      state = merged;
      if(!state.seededAt) state.seededAt = new Date().toISOString(); // больше не сидить встроенные 623
      // сбрасываем фильтры, т.к. категории могли полностью смениться
      stockCat = ""; stockSearch = ""; stockLimit = 100; stockMode = "stock"; stockTab = "all";
      saveState(); applyTheme(); render();
      if(mode==="replace") toast(`Заменено: ${state.stock.length} поз.`);
    }catch(e){ toast("Ошибка импорта"); }
  };
  r.readAsText(f);
}

/* ---------- Pomodoro ---------- */
let pomoTimer = null;
function notify(title, body){
  try{
    if("Notification" in window && Notification.permission==="granted"){
      new Notification(title, { body, icon: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23111827'/><text x='32' y='44' font-size='36' text-anchor='middle'>🍅</text></svg>" });
    }
  }catch(e){}
}
function pomoStart(){
  if(state.pomodoro.phase==="idle" || !state.pomodoro.endAt){
    state.pomodoro.phase = "work";
    state.pomodoro.endAt = Date.now() + 25*60*1000;
  } else if(state.pomodoro.phase==="paused"){
    state.pomodoro.endAt = Date.now() + (state.pomodoro.remaining||0);
    state.pomodoro.phase = state.pomodoro.prevPhase || "work";
  }
  if("Notification" in window && Notification.permission==="default"){
    Notification.requestPermission().catch(()=>{});
  }
  saveState(); pomoTick();
}
function pomoPause(){
  if(!["work","break"].includes(state.pomodoro.phase)) return;
  state.pomodoro.remaining = Math.max(0, state.pomodoro.endAt - Date.now());
  state.pomodoro.prevPhase = state.pomodoro.phase;
  state.pomodoro.phase = "paused";
  saveState(); pomoTick();
}
function pomoReset(){ state.pomodoro = { phase:"idle", endAt:null, cycles:0 }; saveState(); pomoTick(); }
function pomoTick(){
  clearTimeout(pomoTimer);
  const p = state.pomodoro;
  let ms = 0, label = "Готов начать";
  if(p.phase==="work" || p.phase==="break"){
    ms = Math.max(0, p.endAt - Date.now());
    label = p.phase==="work"?"Работа":"Отдых";
    if(ms===0){
      if(p.phase==="work"){
        p.phase="break"; p.endAt=Date.now()+5*60*1000; p.cycles++;
        toast("Перерыв!"); notify("🍅 Pomodoro", "Работа окончена — перерыв 5 мин");
        try{ navigator.vibrate?.(500); }catch(e){}
      } else {
        p.phase="idle"; p.endAt=null;
        toast("Готово!"); notify("🍅 Pomodoro", "Перерыв окончен — новая сессия?");
        try{ navigator.vibrate?.([300,200,300]); }catch(e){}
      }
      saveState();
    }
  } else if(p.phase==="paused"){
    ms = p.remaining||0; label="Пауза";
  }
  const el = document.getElementById("pomoTime");
  const ph = document.getElementById("pomoPhase");
  if(el && ph){
    const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
    el.textContent = (p.phase==="idle"?"25:00":`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`);
    ph.textContent = label + (p.cycles?` · циклов: ${p.cycles}`:"");
  }
  if(["work","break"].includes(p.phase)) pomoTimer = setTimeout(pomoTick, 250);
}

/* ---------- Expiry notice on open ---------- */
function expiryNoticeOnOpen(){
  if(state.lastExpiryNoticeDate===todayStr()) return;
  const urgent = state.stock.filter(s=>{
    if(s.type!=="product"||!s.expiry) return false;
    const d = daysLeft(s.expiry); return d!==null && d<=3;
  });
  if(urgent.length){
    const html = `
      <div class="font-bold text-xl mb-3">⏰ Внимание! Сроки годности</div>
      <div class="space-y-2 mb-3">
        ${sortedStock(urgent).map(s=>{
          const d = daysLeft(s.expiry);
          const txt = d<0?`Просрочено ${-d} дн.`:(d===0?"Сегодня":`${d} дн.`);
          return `<div class="card flex justify-between"><span>${esc(s.name)} (${s.qty} ${esc(s.unit||"")})</span><span class="badge badge-red">${txt}</span></div>`;
        }).join("")}
      </div>
      <button class="btn btn-primary w-full" onclick="closeSheet();nav('stock')">Перейти к складу</button>
      <button class="btn btn-ghost w-full mt-2" data-close>Позже</button>
    `;
    openSheet(html);
  }
  state.lastExpiryNoticeDate = todayStr();
  saveState();
}
