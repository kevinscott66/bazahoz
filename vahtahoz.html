<style>
  html,body{ -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  .safe-top{ padding-top:env(safe-area-inset-top); }
  .safe-bot{ padding-bottom:calc(88px + env(safe-area-inset-bottom)); }
  .btn{ min-height:52px; border-radius:14px; font-weight:600; font-size:17px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 18px; transition:transform .06s ease, background .15s; user-select:none; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:#2563eb; color:#fff; }
  .btn-primary:active{ background:#1d4ed8; }
  .btn-ghost{ background:rgba(255,255,255,.06); color:inherit; }
  .btn-danger{ background:#dc2626; color:#fff; }
  .btn-success{ background:#16a34a; color:#fff; }
  .btn-warn{ background:#d97706; color:#fff; }
  .input{ width:100%; min-height:52px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:inherit; font-size:17px; outline:none; }
  .input:focus{ border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.15); }
  .card{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
  .light .card{ background:#fff; border-color:#e5e7eb; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .light .btn-ghost{ background:#f3f4f6; }
  .light .input{ background:#fff; border-color:#d1d5db; color:#111827; }
  .chip{ padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600; background:rgba(255,255,255,.06); white-space:nowrap; transition:transform .06s ease, background .15s; }
  .chip:active{ transform:scale(.96); }
  .chip.active{ background:#2563eb; color:#fff; }
  .light .chip{ background:#f3f4f6; color:#111827; }
  .light .chip.active{ background:#2563eb; color:#fff; }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; font-size:11px; color:#9ca3af; }
  .nav-btn.active{ color:#60a5fa; }
  .light .nav-btn{ color:#6b7280; }
  .light .nav-btn.active{ color:#2563eb; }
  .badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; }
  .badge-red{ background:#dc2626; color:#fff; }
  .badge-yellow{ background:#b45309; color:#fff; }
  .badge-green{ background:#16a34a; color:#fff; }
  .badge-gray{ background:#374151; color:#e5e7eb; }
  .light .badge-gray{ background:#e5e7eb; color:#374151; }
  .light .badge-gray.opacity-50{ opacity:1; color:#9ca3af; }
  .sheet{ position:fixed; inset:0; z-index:60; display:none; }
  .sheet.open{ display:flex; }
  .sheet-bg{ position:absolute; inset:0; background:rgba(0,0,0,.6); }
  .sheet-body{ position:relative; margin-top:auto; width:100%; max-width:560px; margin-left:auto; margin-right:auto; background:#0b1220; border-radius:24px 24px 0 0; padding:20px; max-height:92vh; overflow-y:auto; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  .light .sheet-body{ background:#fff; }
  .tap{ cursor:pointer; }
  .list-box{ border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:4px; }
  .scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .scroll-x::-webkit-scrollbar{ display:none; }
  .divider{ height:1px; background:rgba(255,255,255,.08); }
  .light .divider{ background:#e5e7eb; }
  @keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{ animation:pop .15s ease-out; }
  /* Утилиты, которые используются в динамической разметке, но не попали в JIT-сборку Tailwind выше */
  .flex-col{ flex-direction:column; }
  .gap-1{ gap:.25rem; }
  .pl-2{ padding-left:.5rem; }
  .pl-10{ padding-left:2.5rem; }
  .px-2{ padding-inline:.5rem; }
  .py-0{ padding-block:0; }
  .mt-0\.5{ margin-top:.125rem; }
  .w-5{ width:1.25rem; }
  .h-5{ height:1.25rem; }
  .leading-4{ line-height:1rem; }
  .border-l-2{ border-left-style:solid; border-left-width:2px; }
  .border-gray-700{ border-color:#374151; }
  .grayscale{ filter:grayscale(1); }
  .uppercase{ text-transform:uppercase; }
  .tracking-wide{ letter-spacing:.025em; }
  .select-none{ user-select:none; -webkit-user-select:none; }
  .break-words{ overflow-wrap:break-word; word-break:break-word; }
  /* видимый фокус только при навигации с клавиатуры — тач/мышь не затрагивает */
  .btn:focus-visible, .chip:focus-visible, .nav-btn:focus-visible, .input:focus-visible{ outline:2px solid #2563eb; outline-offset:2px; }
  /* косметика: кнопки в 3-колоночной сетке (типы склада) — компактнее, чтобы подписи не обрезались на узком iPhone */
  .grid-cols-3 > .btn{ padding:0 6px; font-size:15px; gap:4px; min-width:0; }
  @media (max-width:360px){ .grid-cols-3 > .btn{ font-size:13px; padding:0 4px; } }
  /* активная вкладка нижней навигации — подчёркивание для ясности */
  .nav-btn.active{ position:relative; }
  .nav-btn.active::after{ content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:22px; height:3px; border-radius:0 0 3px 3px; background:currentColor; }
  /* косметика: светлая тема — видимые границы/контраст; disabled-кнопки; тап-зона узких кнопок */
  .light #dateStr{ color:#6b7280; }
  .light #navbar{ border-top-color:#e5e7eb; }
  .light .list-box{ border-color:#e5e7eb; }
  .btn:disabled, .btn[disabled]{ opacity:.45; cursor:default; }
  .btn.px-2{ min-width:40px; }
  /* индикатор активной синхронизации — бегущая полоска снизу sync-бара */
  #syncBar.busy{ overflow:hidden; }

  @keyframes syncslide{ to{ left:100%; } }
  /* косметика: тап-зона у раскрывающихся секций (details/summary) — палец попадает уверенно */

<script>
/* ============================================================
   ВахтаХоз — оффлайн PWA планировщик и склад
   Хранение: localStorage
   ============================================================ */

/* Полифилл structuredClone для старых iOS Safari (<15.4) — иначе loadState()
   падает с ReferenceError на старте и приложение не грузится (белый экран).
   Состояние полностью JSON-сериализуемо (даты — строки), поэтому JSON-клон корректен. */
if(typeof structuredClone!=="function"){
  window.structuredClone = (o)=>(o===undefined?undefined:JSON.parse(JSON.stringify(o)));
}

/* ---------- Storage ---------- */
const STORE_KEY = "vahtahoz:v1";
const JOURNAL_KEYS = ["receipt","issue","writeoff","order"];  // виды журналов движений
// onclick выбора чипа: снять active со всех соседних чипов и подсветить нажатый (был продублирован 7×)
const CHIP_PICK = "this.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));this.classList.add('active');";
// бейдж количества партии (повторялся дословно в stockRow и openStockEdit)
const batchQtyBadge = (b, it) => `<span class="badge badge-green">${fmtQty(b.qty)} ${esc(it.unit||"")}</span>`;
// свежий пустой набор журналов (каждый вызов — новый объект, безопасно для присваивания в state)
function emptyJournals(){ return Object.fromEntries(JOURNAL_KEYS.map(k=>[k,[]])); }
/* Задачи/планы — ОБЩИЕ для всех баз устройства (у хоза одно расписание на обе базы).
   Храним отдельно от per-base состояния и накладываем на state.tasks при загрузке. */
const TASKS_KEY = "vahtahoz:tasks";
function loadGlobalTasks(){
  try{ const raw=localStorage.getItem(TASKS_KEY); if(raw){ const t=JSON.parse(raw); if(Array.isArray(t)) state.tasks=t; } }catch(e){}
}
function saveGlobalTasks(){
  try{ localStorage.setItem(TASKS_KEY, JSON.stringify(Array.isArray(state.tasks)?state.tasks:[])); }catch(e){}
  // задачи изменились → отложенная выгрузка в облако (функция сама проверит, реально ли менялись)
  try{ if(typeof cloudMaybePushTasks==="function") cloudMaybePushTasks(); }catch(e){}
}
const defaultState = {
  theme: "dark",
  stock: [],
  tasks: [],
  log: [],
  categories: {
    product: [
      "Закуски и консервы","Крупы","Макаронные изделия","Молочные продукты",
      "Мясо, рыба и мясные продукты","Напитки и ингредиенты для напитков",
      "Овощи и фрукты","Приправы, специи и кондитерские ингредиенты",
      "Прочие продукты","Сахар, соль, мучное","Сладости и десерты",
      "Соусы и заправки","Сухофрукты и орехи","Колбасные изделия и копчёности","Заморозка"
    ],
    household: ["Химия","Уборка","Расходники","Прочее"],
    tool: ["Электроинструмент","Ручной инструмент","Крепёж и метизы","Сантехника","Электрика","Спецодежда и СИЗ","Прочее"]
  },
  checklists: {
    kitchen: [
      { id:"k1", text:"Проверить температуру холодильников", done:false },
      { id:"k2", text:"Вымыть полы на кухне", done:false },
      { id:"k3", text:"Протереть столы и плиту", done:false },
      { id:"k4", text:"Вынести мусор", done:false },
      { id:"k5", text:"Разморозить морозилку (при необходимости)", done:false }
    ]
  },
  pomodoro: { phase:"idle", endAt:null, cycles:0 },
  journals: emptyJournals(),
  locations: {
    product: ["Склад А","Склад Б","Холодильник","Ларь","Склад В","Кухня"],
    household: ["Красный жилой болк","Склад В","Баня","Кунг","Болк хозрабочего"],
    tool: ["Склад В","Кунг","Болк хозрабочего","Мастерская"]
  },
  lastExpiryNoticeDate: null
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return structuredClone(defaultState);
    const s = JSON.parse(raw);
    const base = structuredClone(defaultState);
    const merged = { ...base, ...s };
    merged.categories = { ...base.categories, ...(s.categories||{}) };
    merged.checklists = { ...base.checklists, ...(s.checklists||{}) };
    merged.pomodoro = { ...base.pomodoro, ...(s.pomodoro||{}) };
    merged.journals = { ...base.journals, ...(s.journals||{}) };
    return merged;
  }catch(e){ return structuredClone(defaultState); }
}
function saveState(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){
    if(e && (e.name==="QuotaExceededError" || e.code===22)){
      if(Array.isArray(state.log) && state.log.length>200) state.log = state.log.slice(0,200);
      if(state.journals){
        for(const k of JOURNAL_KEYS){
          if(Array.isArray(state.journals[k]) && state.journals[k].length>500)
            state.journals[k] = state.journals[k].slice(0,500);   // записи добавляются unshift'ом (новые — в начале) → оставляем СВЕЖИЕ 500, а не старые
        }
      }
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        try{ toast("Хранилище переполнено: журнал урезан"); }catch(_){}
      } catch(e2){
        console.error("saveState retry failed:", e2);
        try{ toast("Не удалось сохранить — переполнение"); }catch(_){}
      }
    } else { console.error("saveState error:", e); }
  }
  // задачи — общие для всех баз: дублируем в отдельный ключ
  try{ if(typeof saveGlobalTasks==="function") saveGlobalTasks(); }catch(_){}
  // если активная база связана с облаком и есть вход — отложенно отправляем изменения
  try{ if(typeof cloudMaybePush==="function") cloudMaybePush(); }catch(_){}
}

let state = loadState();

/* ---------- Облако (Supabase): состояние объявлено рано, до первых saveState ----------
   Реализация функций — единым блоком ниже (hoisted). Без входа всё работает офлайн. */
const CLOUD_CFG = {
  url:  "https://jzxajxwtcemrztfwbdkm.supabase.co",
  anon: "sb_publishable_UxWs9yx1r4fbo4KJJZqYLA_ndNyVgT0",
};
const cloud = {
  sb:null, session:null, profile:null, members:[], bases:{},
  channel:null, subscribedBase:null,
  pushTimer:null, pullTimer:null, applying:false, ready:false, busy:false,
  pushPending:false, retryTimer:null, basesLoaded:false,
  // синк задач (scope по владельцу): отдельные таймеры/канал/флаги
  tasksTimer:null, tasksRetry:null, tasksPullTimer:null, tasksChannel:null, tasksSubUid:null, tasksBusy:false,
};

/* ---------- Utils ---------- */
const uid = () => (crypto?.randomUUID?.() || (Date.now()+"_"+Math.random().toString(16).slice(2)));

/* ============================================================
   ПРОФИЛИ БАЗ (мультибаза)
   ------------------------------------------------------------
   У каждой базы — полностью изолированное состояние: склад, партии,
   журналы, задачи, категории и СВОИ места хранения.

   Модель хранения:
   - STORE_KEY ("vahtahoz:v1") всегда хранит ЖИВЫЕ данные АКТИВНОЙ базы
     (поэтому весь старый код, SW и экспорт работают без изменений,
      а существующие данные автоматически становятся «Базой 1»).
   - PROFILES_KEY хранит метаданные: { activeId, list:[{id,name}] }.
   - Снимок каждой НЕактивной базы лежит в slotKey(id) = "vahtahoz:v1::<id>".
   Переключение: снимок активной → её слот, слот целевой → STORE_KEY, reload.
   ============================================================ */
const PROFILES_KEY = "vahtahoz:profiles";
const slotKey = (id) => `${STORE_KEY}::${id}`;
function loadProfiles(){
  try{
    const raw = localStorage.getItem(PROFILES_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && Array.isArray(p.list) && p.list.length && p.activeId &&
         p.list.some(x=>x.id===p.activeId)) return p;
    }
  }catch(e){ console.warn("loadProfiles", e); }
  return null;
}
function saveProfiles(p){
  try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(p)); }
  catch(e){ console.error("saveProfiles", e); }
}
function ensureProfiles(){
  let p = loadProfiles();
  if(!p){
    // первый запуск с профилями: текущие данные (STORE_KEY) становятся «Базой 1»
    const id = uid();
    p = { activeId: id, list: [{ id, name: "База 1" }] };
    saveProfiles(p);
  }
  return p;
}
let profiles = ensureProfiles();
const activeProfile = () => profiles.list.find(x=>x.id===profiles.activeId) || profiles.list[0];
const activeProfileName = () => (activeProfile()?.name || "База");

/* свежее состояние для новой базы: пустой склад/журналы, но без встроенного seed
   (seededAt выставлен, чтобы новая база НЕ получила зашитые 351 продукт первой базы) */
function freshProfileState(opts){
  const s = structuredClone(defaultState);
  s.seededAt = new Date().toISOString();
  if(opts && opts.copyFrom){
    // копируем КАТЕГОРИИ (универсальны для всех баз), но НЕ места хранения —
    // места физические/базо-специфичные (свой склад/кунг), пусть остаются дефолтными.
    s.categories = structuredClone(opts.copyFrom.categories || defaultState.categories);
  }
  return s;
}
function switchProfile(toId, fromAutoLink){
  if(!toId || toId===profiles.activeId) return;
  if(!profiles.list.some(x=>x.id===toId)) return;
  // авто-привязка к облаку при входе = ИНИЦИАЛИЗАЦИЯ (вход в свою базу), не «смена базы пользователем» → роль-гард не применяем.
  // Пользовательское переключение — под гардом (явно, без завязки на тайминг activeCloudId).
  if(!fromAutoLink && roleBaseLocked()){ toast("Переключение баз недоступно для вашей роли"); return; }
  try{
    // 1) снимок активной базы (самые свежие данные — из памяти) в её слот
    localStorage.setItem(slotKey(profiles.activeId), JSON.stringify(state));
    // 2) целевую базу делаем «живой» (STORE_KEY)
    const raw = localStorage.getItem(slotKey(toId));
    localStorage.setItem(STORE_KEY, raw || JSON.stringify(freshProfileState()));
    // 3) фиксируем активную и перезагружаемся — нормализация прогонится на новых данных
    profiles.activeId = toId;
    saveProfiles(profiles);
    location.reload();
  }catch(e){
    console.error("switchProfile", e);
    try{ toast("Не удалось переключить базу"); }catch(_){}
  }
}
async function addProfile(){
  if(roleBaseLocked()){ toast("Создание баз недоступно для вашей роли"); return; }
  const name = await promptSheet("Название новой базы", "", {title:"Новая база"});
  if(name===null) return;
  const nm = cleanName40(name);
  if(!nm){ toast("Пустое название"); return; }
  if(profiles.list.some(x=>x.name.toLowerCase()===nm.toLowerCase())){ toast("База с таким именем уже есть"); return; }
  const init = await chooseSheet(
    `«${nm}»\nС чего начать?`,
    [
      { label:"Пустая база (свои места и категории)", value:"fresh",  color:"btn-primary" },
      { label:"Скопировать категории и места текущей", value:"copy", color:"btn-ghost"   },
    ]
  );
  if(!init) return;
  const id = uid();
  const newState = init==="copy" ? freshProfileState({copyFrom: state}) : freshProfileState();
  try{ localStorage.setItem(slotKey(id), JSON.stringify(newState)); }
  catch(e){ console.error(e); toast("Не удалось создать базу"); return; }
  profiles.list.push({ id, name: nm });
  saveProfiles(profiles);
  logOp("PROFILE_ADD", `База «${nm}»`);
  const go = await confirmSheet(`База «${nm}» создана. Переключиться на неё сейчас?`, {yes:"Переключиться", no:"Остаться"});
  if(go) switchProfile(id);
  else { saveState(); render(); openProfilesSheet(); }
}
async function renameProfile(id){
  const p = profiles.list.find(x=>x.id===id); if(!p) return;
  const name = await promptSheet(`Переименовать «${p.name}»`, p.name, {title:"Переименовать базу"});
  if(name===null) return;
  const nm = cleanName40(name);
  if(!nm || nm===p.name) return;
  if(profiles.list.some(x=>x.id!==id && x.name.toLowerCase()===nm.toLowerCase())){ toast("Имя занято"); return; }
  p.name = nm;
  saveProfiles(profiles);
  logOp("PROFILE_RENAME", `→ «${nm}»`);
  renderHeader(); openProfilesSheet();
  toast("База переименована");
}
async function deleteProfile(id){
  if(profiles.list.length<=1){ toast("Нельзя удалить единственную базу"); return; }
  if(id===profiles.activeId){ toast("Сначала переключись на другую базу"); return; }
  const p = profiles.list.find(x=>x.id===id); if(!p) return;
  const ok = await confirmSheet(`Удалить базу «${p.name}» со всеми её складами и журналами? Это НЕЛЬЗЯ отменить.`,{danger:true,yes:"Удалить базу"});
  if(!ok) return;
  // двойное подтверждение для необратимого действия
  const ok2 = await confirmSheet(`Точно удалить «${p.name}»? Данные этой базы будут стёрты навсегда.`,{danger:true,yes:"Да, удалить"});
  if(!ok2) return;
  try{ localStorage.removeItem(slotKey(id)); }catch(e){ console.error(e); }
  if(p.cloudId) clearBaseSyncKeys(p.cloudId);   // чистим осиротевшие маркеры синка (dirty + снимки подписей)
  profiles.list = profiles.list.filter(x=>x.id!==id);
  saveProfiles(profiles);
  logOp("PROFILE_DEL", `База «${p.name}»`);
  renderHeader(); openProfilesSheet();
  toast("База удалена");
}
function openProfilesSheet(){
  if(roleBaseLocked()){ toast("Переключение и управление базами недоступно для вашей роли"); return; }   // начальник заперт на своей базе (+ защита от гонки роли)
  const rows = profiles.list.map(p=>{
    const isActive = p.id===profiles.activeId;
    return `<div class="flex items-center gap-2 text-sm py-2 border-b border-gray-800" data-profid="${esc(p.id)}">
      <span class="flex-1 truncate ${isActive?"font-bold":""}">${isActive?"✅ ":""}${esc(p.name)}</span>
      ${isActive
        ? `<span class="badge badge-green">текущая</span>`
        : `<button class="btn btn-primary text-xs" data-profact="switch">Открыть</button>`}
      <button class="btn btn-ghost text-xs" data-profact="rename">✏️</button>
      ${isActive?"":`<button class="btn btn-ghost text-xs" data-profact="delete">🗑</button>`}
    </div>`;
  }).join("");
  openSheet(`
    <div class="font-bold text-xl mb-1">🏠 Базы (профили)</div>
    <div class="text-xs opacity-70 mb-3">У каждой базы свой склад, журналы и места хранения. Переключение сохраняет текущую базу и открывает выбранную.</div>
    <div class="space-y-1 max-h-96 overflow-y-auto" id="profList">${rows}</div>
    <div class="flex gap-2 pt-3">
      <button class="btn btn-primary flex-1" id="profAddBtn">➕ Новая база</button>
      <button class="btn btn-ghost" data-close>Закрыть</button>
    </div>
  `);
  const body = document.getElementById("sheetBody");
  body.querySelector("#profAddBtn").addEventListener("click", ()=>addProfile());
  body.querySelector("#profList").addEventListener("click", e=>{
    const btn = e.target.closest("[data-profact]"); if(!btn) return;
    const row = btn.closest("[data-profid]"); if(!row) return;
    const pid = row.dataset.profid;
    const act = btn.dataset.profact;
    if(act==="switch") switchProfile(pid);
    else if(act==="rename") renameProfile(pid);
    else if(act==="delete") deleteProfile(pid);

const todayStr = () => {
  // локальная дата пользователя в формате YYYY-MM-DD (не UTC: иначе вечером/утром daysLeft ошибается на ±1 день)
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
};
const fmtDate = (s) => { if(!s) return "—"; const [y,m,d]=s.split("-"); return `${d}.${m}.${y}`; };

const byExpiry = (a,b)=>(a.expiry||"9999").localeCompare(b.expiry||"9999");

const parseNum = (v)=> Number(String(v==null?"":v).replace(",","."));

const orderNote = (op, suffix="") => `Из заказа${op&&op.note?": "+op.note:""}`+(suffix?" "+suffix:"");

/* Округление количеств: устраняет накопление ошибок плавающей точки (0.1+0.2=0.30000000000000004).
   3 знака достаточно для кг/л (граммы/мл), для шт/кор/уп/меш — фактически целое число. */
const roundQty = (n) => {
  const x = Number(n);
  if(!Number.isFinite(x)) return 0;
  return Math.round(x*1000)/1000;
};
/* Форматирование qty для UI/экспорта: убирает хвостовые нули, оставляя «человеческое» представление. */
const fmtQty = (n) => {
  const x = roundQty(n);
  return Number.isInteger(x) ? String(x) : x.toFixed(3).replace(/0+$/,"").replace(/\.$/,"");
};

/* ---------- Партии (batches) ----------
   Модель: stockItem.batches = [{id, qty, expiry, location, note, createdAt}]
   - Если batches пуст/нет — карточка работает в legacy режиме (qty/expiry/location напрямую).
   - Если batches непустой — qty/expiry/location становятся ПРОИЗВОДНЫМИ (агрегатами).
   syncItemFromBatches() пересчитывает агрегаты после любой мутации партий. */
function batchesOf(it){ return Array.isArray(it?.batches) ? it.batches : []; }
function hasBatches(it){ return batchesOf(it).length > 0; }
function totalQtyOf(it){
  const b = batchesOf(it);
  if(b.length===0) return roundQty(it?.qty || 0);
  return roundQty(b.reduce((s,x)=> s + roundQty(x.qty||0), 0));
}
function locationsOf(it){
  const b = batchesOf(it);
  if(b.length===0) return it?.location ? [it.location] : [];
  const set = new Set(b.map(x=>x.location||"").filter(Boolean));
  return [...set].sort();
}
function nearestExpiryOf(it){
  const b = batchesOf(it);
  const list = b.length ? b.map(x=>x.expiry).filter(Boolean) : (it?.expiry?[it.expiry]:[]);
  if(!list.length) return "";
  return list.slice().sort()[0]; // YYYY-MM-DD сортируется лексикографически
}
function expiringBatchOf(it){
  // партия с ближайшим сроком — используется для подсветки «срок Y в месте Z»
  const b = batchesOf(it);
  if(!b.length) return null;
  const withExp = b.filter(x=>x.expiry);
  if(!withExp.length) return null;
  return withExp.slice().sort((a,b)=>a.expiry.localeCompare(b.expiry))[0];
}
function syncItemFromBatches(it){
  if(!hasBatches(it)) return; // legacy режим — ничего не делаем
  // нормализуем qty в каждой партии и считаем агрегаты
  for(const x of it.batches){ if(x.qty!=null) x.qty = roundQty(x.qty); }
  it.qty = totalQtyOf(it);
  it.expiry = nearestExpiryOf(it);
  const locs = locationsOf(it);
  it.location = locs.length===1 ? locs[0] : ""; // при нескольких — карточный location пустой, UI показывает «N мест»

}
/* Финализация после мутации партий: если партий не осталось — карточка возвращается
   в legacy-режим с ОБНУЛЁННЫМИ агрегатами (иначе фантомный остаток/просрочка от старых значений). */
function finalizeBatchMutation(it){
  if(!Array.isArray(it.batches)) return;
  if(it.batches.length===0){
    it.qty = 0; it.expiry = ""; it.location = "";
    it.updatedAt = new Date().toISOString();
    delete it.batches;
  } else {
    syncItemFromBatches(it);
  }
}

// нормализуем id у всех записей
function normalizeImportIds(obj){

    for(const t of obj.tasks){

          .map(i=>({ id:safeId(i.id), text:String(i.text||"").slice(0,200), done:!!i.done }))
          .filter(i=>i.text);

      t.due  = (typeof t.due==="string"  && /^\d{4}-\d{2}-\d{2}$/.test(t.due))  ? t.due  : "";
      t.time = (typeof t.time==="string" && /^\d{2}:\d{2}$/.test(t.time))       ? t.time : "";

/* МИГРАЦИЯ ЛЕГАСИ: схлопывание "X (до DATE)"-дубликатов в одну карточку с массивом batches.

    const parent = state.stock.find(x =>
      x.type===members[0].type &&

    ) || members[0];
    if(parent.name!==baseName){ parent.name = baseName; changed = true; }
    parent.batches = parent.batches || [];
    // если у parent был свой qty>0 без батча — превращаем в первую партию.
    // ВАЖНО: и для случая parent===members[0] (имя уже переименовано выше,
    // цикл ниже его пропустит — без этого блока собственный остаток терялся бы)
    if(parent.batches.length===0 && roundQty(parent.qty||0) > 0){
      parent.batches.push({
        id: uid(), qty: roundQty(parent.qty||0),
        expiry: parent.expiry||"", location: parent.location||"",
        note: "Слияние при миграции", createdAt: parent.createdAt||new Date().toISOString(),
      });
      changed = true;
    }
    // переносим все members в parent.batches
    for(const m of members){
      if(m===parent) continue; // parent уже учтён блоком выше
      if(roundQty(m.qty||0) > 0 || m.expiry){
        parent.batches.push({
          id: uid(), qty: roundQty(m.qty||0),
          expiry: m.expiry||"", location: m.location||"",
          note: "Из «(до …)»", createdAt: m.createdAt||new Date().toISOString(),
        });
        merged++;
      }
      // удаляем дубликат и переадресуем productId в журналах на parent.id
      if(state.journals){
        for(const k of JOURNAL_KEYS){
          for(const op of (state.journals[k]||[])){
            if(op && op.productId===m.id){ op.productId = parent.id; op.productName = baseName; changed = true; }
          }
        }
      }
      state.stock = state.stock.filter(x=>x.id!==m.id);
      changed = true;
    }
    if(parent.batches.length===0) delete parent.batches;
    else syncItemFromBatches(parent);
  }
  if(merged>0 || changed){ saveState(); console.info(`Миграция партий: схлопнуто ${merged} партий "(до …)"`); }
})();
for(const k of JOURNAL_KEYS){
  for(const op of state.journals[k]){
    if(op && op.qty!=null) op.qty = roundQty(op.qty);
  }
}

/* ---------- Sheet ---------- */
let _sheetOnClose = null;
function openSheet(html){
  // предыдущий sheet принудительно закрываем с резолвом null, чтобы await не висел
  if(_sheetOnClose){ try{ _sheetOnClose(); }catch(e){} _sheetOnClose = null; }
  const s=document.getElementById("sheet");
  // Заменяем sheetBody на свежий клон, чтобы сбросить все старые addEventListener
  const oldBody = document.getElementById("sheetBody");
  const freshBody = oldBody.cloneNode(false);
  oldBody.replaceWith(freshBody);
  freshBody.innerHTML = html;
  s.classList.add("open");
}
function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  if(_sheetOnClose){ const cb=_sheetOnClose; _sheetOnClose=null; try{ cb(); }catch(e){} }
}

/* ---------- Stock helpers ---------- */
const inStock = (it) => totalQtyOf(it) > 0;
function stockStatus(it){
  // позиции без остатка ("архивные") — отдельный спокойный статус, всегда в конце списка
  if(!inStock(it)) return { color:"gray", text:"Нет в наличии", rank:99, out:true };
  const tq = totalQtyOf(it);
  const low = (it.minStock!==""&&it.minStock!=null && tq <= Number(it.minStock));
  // для подсветки срока — берём «ближайший» по всем партиям; если партий нет — it.expiry
  const expiry = nearestExpiryOf(it);
  const expBatch = expiringBatchOf(it);
  // суффикс «в Морозильной» включается только когда мест ≥ 2 (иначе и так понятно из карточки)
  const locSuffix = (expBatch && locationsOf(it).length>=2 && expBatch.location)
    ? ` · ${expBatch.location}` : "";
  // срок/гарантия подсвечивается у ЛЮБОГО типа, если он указан (хозхимия, гарантия инструмента) —
  // так бейдж карточки согласован с фильтром «Просрочка/Скоро», который тоже идёт по s.expiry
  if(expiry){
    const d = daysLeft(expiry);
    if(d<0)  return { color:"red",    text:`Просрочено (${-d} дн.)${locSuffix}`, rank:0, expiry, expBatch };
    if(d<=3) return { color:"red",    text:`Срок ≤ ${d} дн.${locSuffix}`,         rank:1, expiry, expBatch };
    if(d<=14)return { color:"yellow", text:`Срок ${d} дн.${locSuffix}`,           rank:2, expiry, expBatch };
  }
  if(low) return { color:"yellow", text:`Низкий запас`, rank:3 };
  return { color:null, text:"", rank:9 };
}
function sortedStock(items){
  // мемоизируем rank: stockStatus()→totalQtyOf() делает reduce по партиям, а компаратор
  // вызывал бы его O(n log n) раз. Кешируем по одному вызову на элемент.
  const rankOf = new Map();
  const rank = it => { let r = rankOf.get(it); if(r===undefined){ r = stockStatus(it).rank; rankOf.set(it, r); } return r; };
  return [...items].sort((a,b)=>{
    const ra=rank(a), rb=rank(b);
    if(ra!==rb) return ra-rb;
    const ea=a.expiry||"9999-12-31", eb=b.expiry||"9999-12-31";
    if(ea!==eb) return ea.localeCompare(eb);
    return (a.name||"").localeCompare(b.name||"","ru");
  });
}

/* ---------- Tasks ---------- */
const TASK_CATS = ["Все","Склад","Кухня","База","Баня","Общее"];
const TASK_PRIOS = ["Низкий","Средний","Высокий"];
let taskFilter = { cat:"Все", showDone:false };

// порядок задач: дата (daysLeft) → время-якорь → ручной order (стрелки ↑/↓) → приоритет
function taskCompare(a,b){
  // невалидная/пустая дата → в конец (999), чтобы da-db не давало NaN и сортировка была стабильной
  const da = (a.due && daysLeft(a.due)!=null)?daysLeft(a.due):999, db=(b.due && daysLeft(b.due)!=null)?daysLeft(b.due):999;
  if(da!==db) return da-db;
  const ta = a.time||"99:99", tb = b.time||"99:99";
  if(ta!==tb) return ta<tb?-1:1;
  const oa = Number(a.order||0), ob = Number(b.order||0);
  if(oa!==ob) return oa-ob;
  return TASK_PRIOS.indexOf(b.priority)-TASK_PRIOS.indexOf(a.priority);
}
function renderTasks(){
  const v = document.querySelector('[data-view="tasks"]');
  let list = state.tasks.slice();
  if(taskFilter.cat!=="Все") list = list.filter(t=>t.category===taskFilter.cat);
  if(!taskFilter.showDone) list = list.filter(t=>!t.done);
  list.sort(taskCompare);

  v.innerHTML = `
    <button class="btn btn-primary w-full" onclick="openTaskEdit()">＋ Новая задача</button>

    <div class="scroll-x flex gap-2 pb-1">
      ${TASK_CATS.map(c=>`<button class="chip ${taskFilter.cat===c?"active":""}" onclick="taskFilter.cat='${c}';render()">${c}</button>`).join("")}
      <button class="chip ${taskFilter.showDone?"active":""}" onclick="taskFilter.showDone=!taskFilter.showDone;render()">Показывать выполненные</button>
    </div>

    ${list.length
      ? `<div class="space-y-2">${list.map(taskRow).join("")}</div>`
      : `<div class="card text-center opacity-70">Задач нет 🎉</div>`}
  `;
}

function taskRow(t, opts){

  const timeBadge = t.time?`<span class="badge badge-gray">🕒 ${esc(t.time)}</span>`:"";
  const prioBadge = t.priority==="Высокий"?`<span class="badge badge-red">!</span>`
                  : t.priority==="Средний"?`<span class="badge badge-yellow">~</span>`:"";
  // чек-лист задачи (напр. «что принести со склада») — отдельный блок под карточкой
  const items = Array.isArray(t.items) ? t.items : [];
  const doneCnt = items.filter(i=>i.done).length;
  const listBadge = items.length ? `<span class="badge badge-gray">📋 ${doneCnt}/${items.length}</span>` : "";
  const listBlock = items.length ? `

  return `

            ${t.done?'<span class="block text-white text-center leading-7">✓</span>':""}
          </span>

            <span class="badge badge-gray">${esc(t.category||"Общее")}</span>
            ${prioBadge} ${dueBadge} ${timeBadge}
            ${t.repeat&&t.repeat!=="Нет"?`<span class="badge badge-gray">🔁 ${esc(t.repeat)}</span>`:""}
            ${listBadge}
          </div>
        </div>
        ${showMove?`<div class="flex flex-col gap-1">

function toggleTaskItem(taskId, itemId){
  const t = state.tasks.find(x=>x.id===taskId); if(!t || !Array.isArray(t.items)) return;
  const it = t.items.find(i=>i.id===itemId); if(!it) return;
  it.done = !it.done;
  saveState(); render();
}

function moveTask(id, dir){
  // ручной порядок имеет смысл ТОЛЬКО внутри группы с одинаковыми daysLeft и time —
  // иначе сортировка по дате/времени всё равно перетасует независимо от order.
  let list = state.tasks.slice().filter(t=>!t.done);
  if(taskFilter.cat!=="Все") list = list.filter(t=>t.category===taskFilter.cat);
  list.sort(taskCompare);
  const i = list.findIndex(x=>x.id===id);
  const j = i + (dir<0?-1:1);
  if(i<0 || j<0 || j>=list.length){ toast("Дальше двигать некуда"); return; }
  const a = list[i], b = list[j];
  const dueA = a.due?daysLeft(a.due):999, dueB = b.due?daysLeft(b.due):999;
  const timeA = a.time||"99:99", timeB = b.time||"99:99";
  if(dueA!==dueB || timeA!==timeB){
    toast("Порядок задаётся датой/временем — измени их у задачи");
    return;
  }
  // нормализуем order внутри одной группы, чтобы свап давал детерминированный результат
  const group = list.filter(x=>{
    const dx = x.due?daysLeft(x.due):999;
    const tx = x.time||"99:99";
    return dx===dueA && tx===timeA;
  });
  group.forEach((x,idx)=>{ x.order = idx; });
  const tmp = a.order; a.order = b.order; b.order = tmp;
  saveState(); render();
}

function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.done = !t.done;
  if(t.done){
    logOp("TASK_DONE", t.title);
    if(t.repeat && t.repeat!=="Нет" && t.due){
      const today = todayStr();
      const next = new Date(t.due+"T00:00:00");
      const origDay = next.getDate();
      const step = () => {
        if(t.repeat==="День")   next.setDate(next.getDate()+1);
        if(t.repeat==="Неделя") next.setDate(next.getDate()+7);
        if(t.repeat==="Месяц"){
          // защита от переполнения: 31.01 + 1 мес = 03.03 в JS; нормализуем к последнему дню целевого месяца
          const targetMonth = next.getMonth()+1;
          next.setDate(1);
          next.setMonth(targetMonth);
          // ставим оригинальный день, либо последний день месяца, если оригинального нет (29-31 фев и т.п.)
          const lastDay = new Date(next.getFullYear(), next.getMonth()+1, 0).getDate();
          next.setDate(Math.min(origDay, lastDay));
        }
      };
      step();
      // если задача была сильно просрочена (вплоть до ~10 лет), перематываем строго в будущее
      const localDateStr = (d) => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
      let guard = 0;
      while(localDateStr(next) <= today && guard++ < 3650) step();
      const nextDue = localDateStr(next);
      // корневой id серии: если t уже копия — берём её parentId, чтобы цепочка оставалась плоской
      const rootId = t.parentId || t.id;
      // дубликат — только незавершённая копия с тем же rootId серии.
      // (эвристику по названию/дате убрали: две независимые серии с одинаковым названием
      //  и совпавшей следующей датой ложно подавляли создание копии второй серии)
      const exists = state.tasks.some(x=> !x.done && (x.parentId||x.id)===rootId);
      if(!exists){
        // order сбрасываем — ручной порядок не имеет смысла переносить на новую дату
        // список (items) переносим с обнулёнными галочками и новыми id (чтобы завтра собирать заново)
        const nextItems = Array.isArray(t.items) ? t.items.map(i=>({ id:uid(), text:i.text, done:false })) : undefined;
        const nextTask = {...t, id:uid(), parentId:rootId, order:undefined, done:false, due:nextDue, createdAt:new Date().toISOString()};
        if(nextItems) nextTask.items = nextItems;
        state.tasks.push(nextTask);
        toast(`✓ Готово · следующая ${fmtDate(nextDue)}`);
      } else {
        toast("✓ Готово");
      }
    } else {
      toast("✓ Готово");
    }
  } else {
    // откат: удаляем автоматически созданную следующую копию по корневому id серии (только незавершённую)
    const rootId = t.parentId || t.id;
    state.tasks = state.tasks.filter(x=> !((x.parentId||"")===rootId && x.id!==t.id && !x.done));
    toast("Снято");
  }
  saveState(); render();
}

// парсинг textarea списка → items[], сохраняя галочки по совпадению текста со старым списком
function parseTaskItems(raw, oldItems){
  // каждый старый пункт матчим не более одного раза — иначе дубль-строки получат общий id
  const old = (Array.isArray(oldItems) ? oldItems : []).slice();
  return String(raw||"").split("\n").map(s=>s.trim()).filter(Boolean).slice(0,100).map(text=>{
    const t = text.slice(0,200);
    const idx = old.findIndex(o=>o.text===t);
    if(idx>=0){ const prev = old.splice(idx,1)[0]; return { id: prev.id, text: t, done: !!prev.done }; }
    return { id: uid(), text: t, done: false };
  });
}
function saveTask(id){
  const body = document.getElementById("sheetBody");
  const title = body.querySelector("#tt").value.trim();
  if(!title){ toast("Название обязательно"); return; }
  const cat = body.querySelector(".chip.active[data-cat]")?.dataset.cat || "Общее";
  const prio = body.querySelector(".chip.active[data-prio]")?.dataset.prio || "Средний";
  const rep = body.querySelector(".chip.active[data-rep]")?.dataset.rep || "Нет";
  const due = body.querySelector("#td").value;
  const time = (body.querySelector("#ttime")?.value || "").trim();
  const itemsRaw = body.querySelector("#titems")?.value || "";
  if(id){
    const t = state.tasks.find(x=>x.id===id);
    if(!t){ toast("Задача изменилась в другой вкладке"); closeSheet(); render(); return; }   // удалена/синкнута между открытием формы и сохранением → не падаем на t.due
    // если поменялась дата/время — старый order относится к другой группе, сбросим
    const groupChanged = t.due!==due || (t.time||"")!==time;
    const items = parseTaskItems(itemsRaw, t.items);
    Object.assign(t,{title,category:cat,priority:prio,repeat:rep,due,time});
    if(items.length) t.items = items; else delete t.items;
    if(groupChanged){
      const sameGroup = state.tasks.filter(x=> x!==t && x.due===due && (x.time||"")===time);
      const maxOrder = sameGroup.reduce((m,x)=> Math.max(m, Number(x.order||0)), -1);
      t.order = maxOrder+1;
    }
    logOp("TASK_EDIT", title);
  } else {
    // order = max(существующих в той же дате/времени) + 1, чтобы новая задача попадала в конец группы,
    // а не выше задач, которые пользователь уже ручную опустил вниз
    const sameGroup = state.tasks.filter(x=> x.due===due && (x.time||"")===time);
    const maxOrder = sameGroup.reduce((m,x)=> Math.max(m, Number(x.order||0)), -1);
    const items = parseTaskItems(itemsRaw, []);
    const nt = {id:uid(), title, category:cat, priority:prio, repeat:rep, due, time, order:maxOrder+1, done:false, createdAt:new Date().toISOString()};
    if(items.length) nt.items = items;
    state.tasks.push(nt);
    logOp("TASK_ADD", title);
  }
  saveState(); closeSheet(); render();
}
async function deleteTask(id){
  if(!await confirmSheet("Удалить задачу?",{danger:true,yes:"Удалить"})) return;
  const t = state.tasks.find(x=>x.id===id);
  // удаляем саму задачу + всю forward-цепочку повторов (parentId-наследников), чтобы не оставались зомби-копии
  const toRemove = new Set([id]);
  let grew = true;
  while(grew){
    grew = false;
    for(const x of state.tasks){
      if(x.parentId && toRemove.has(x.parentId) && !toRemove.has(x.id)){
        toRemove.add(x.id); grew = true;
      }
    }
  }
  state.tasks = state.tasks.filter(x=>!toRemove.has(x.id));
  logOp("TASK_DEL", (t?.title||"") + (toRemove.size>1?` (+${toRemove.size-1} повторов)`:""));
  saveState(); closeSheet(); render();
}

/* ---------- Stock ---------- */
let stockTab = "all";
let stockSearch = "";
let stockCat = ""; // фильтр по категории ("" = все)
let stockMode = "stock"; // stock | receipt | issue | writeoff | order
let stockLimit = 100;    // сколько карточек показываем (чанкинг)
let stockSearchT = null; // debounce таймер
let stockExpiryFilter = "all"; // all | expired | soon (≤7дн)

const JOURNAL_META = {
  receipt:  { label:"Поступление", icon:"📥", color:"btn-success", sign:+1, verb:"Пришло" },
  issue:    { label:"Выдача",      icon:"📤", color:"btn-warn",    sign:-1, verb:"Выдано" },
  writeoff: { label:"Списание",    icon:"🗑",  color:"btn-danger",  sign:-1, verb:"Списано" },
  order:    { label:"Заказы",      icon:"🛒", color:"btn-primary", sign: 0, verb:"Заказано" },
};

function renderStock(){
  const v = document.querySelector('[data-view="stock"]');
  const modeTabs = `
    <div class="scroll-x flex gap-2">
      <button class="chip ${stockMode==='stock'?'active':''}" data-stockmode="stock">📦 Остатки</button>
      ${Object.entries(JOURNAL_META).map(([k,m])=>`<button class="chip ${stockMode===k?'active':''}" data-stockmode="${k}">${m.icon} ${m.label} (${(state.journals[k]||[]).length})</button>`).join("")}
    </div>`;
  if(stockMode!=="stock"){
    v.innerHTML = modeTabs + renderJournal(stockMode);
    return;
  }

  // список категорий для фильтра в зависимости от tab
  let cats = [];
  if(STOCK_TYPE_KEYS.includes(stockTab)) cats = state.categories[stockTab] || [];
  else cats = [...new Set(STOCK_TYPE_KEYS.flatMap(k=>state.categories[k]||[]))];

  // подсчёт по категориям для текущего таба (только позиции в наличии)
  const countByCat = {};
  const base = state.stock.filter(s=> stockTab==="all" ? true : s.type===stockTab);
  base.forEach(s=>{ if(s.category && inStock(s)){ countByCat[s.category]=(countByCat[s.category]||0)+1; } });
  // счётчики сроков должны совпадать с видимым списком: учитываем категорию и поиск
  const q = stockSearch.trim().toLowerCase();
  const expScope = base.filter(s=>
    (!stockCat || s.category===stockCat) &&
    (!q || (s.name||"").toLowerCase().includes(q))
  );

  v.innerHTML = `
    ${modeTabs}
    <div class="grid grid-cols-3 gap-2">
      ${STOCK_TYPES.map(t=>`<button class="btn btn-ghost" onclick="openStockEdit(null,'${t.key}')">＋ ${t.addLabel}</button>`).join("")}
    </div>

    <div class="scroll-x flex gap-2">
      <button class="chip ${stockTab==='all'?'active':''}" data-stocktab="all">Все (${state.stock.filter(inStock).length})</button>
      ${STOCK_TYPES.map(t=>`<button class="chip ${stockTab===t.key?'active':''}" data-stocktab="${t.key}">${t.icon} ${t.short} (${state.stock.filter(s=>s.type===t.key&&inStock(s)).length})</button>`).join("")}
    </div>

    <div class="scroll-x flex gap-2">
      <button class="chip ${stockExpiryFilter==='all'?'active':''}" data-expfilter="all">Все сроки</button>
      <button class="chip ${stockExpiryFilter==='expired'?'active':''}" data-expfilter="expired">⛔ Просрочка (${expScope.filter(s=>inStock(s)&&s.expiry&&daysLeft(s.expiry)<0).length})</button>
      <button class="chip ${stockExpiryFilter==='soon'?'active':''}" data-expfilter="soon">⏰ Скоро (${expScope.filter(s=>{if(!inStock(s))return false;const d=s.expiry?daysLeft(s.expiry):null;return d!==null&&d>=0&&d<=14;}).length})</button>
    </div>

    <div class="scroll-x flex gap-2" id="stockCatChips">
      <button class="chip ${stockCat===''?'active':''}" data-stockcat="">Все категории</button>
      ${cats.map(c=>`<button class="chip ${stockCat===c?'active':''}" data-stockcat="${esc(c)}">${esc(c)}${countByCat[c]?` <span class="opacity-70">${countByCat[c]}</span>`:""}</button>`).join("")}
      <button class="chip" onclick="openCategoriesEdit()">⚙️ Категории</button>
      <button class="chip" onclick="openLocationsEdit()">📍 Места</button>
    </div>

    <input class="input" id="stockSearchInp" placeholder="Поиск по складу…" value="${esc(stockSearch)}" autocomplete="off" />

    <div id="stockListBox"></div>
  `;
  // Привязываем поиск с debounce и частичным ререндером (фокус не теряется)
  const inp = document.getElementById("stockSearchInp");
  inp.addEventListener("input", ()=>{
    clearTimeout(stockSearchT);
    stockSearchT = setTimeout(()=>{
      stockSearch = inp.value;
      stockLimit = 100;
      renderStockList();
    }, 150);
  });
  renderStockList();
}

function renderStockList(){
  const box = document.getElementById("stockListBox");
  if(!box) return;
  let list = state.stock.slice();
  if(STOCK_TYPE_KEYS.includes(stockTab)) list = list.filter(s=>s.type===stockTab);
  if(stockCat) list = list.filter(s=>s.category===stockCat);
  if(stockExpiryFilter==="expired") list = list.filter(s=>inStock(s) && s.expiry && daysLeft(s.expiry)<0);
  else if(stockExpiryFilter==="soon") list = list.filter(s=>{ if(!inStock(s)) return false; const d=s.expiry?daysLeft(s.expiry):null; return d!==null && d>=0 && d<=14; });
  if(stockSearch.trim()){
    const q = stockSearch.trim().toLowerCase();
    list = list.filter(s=>{
      if((s.name||"").toLowerCase().includes(q)) return true;
      if((s.location||"").toLowerCase().includes(q)) return true;
      // ищем по местам/примечаниям всех партий
      for(const b of (s.batches||[])){
        if((b.location||"").toLowerCase().includes(q)) return true;
        if((b.note||"").toLowerCase().includes(q)) return true;
      }
      return false;
    });
  }
  list = sortedStock(list);
  const total = list.length;
  const outCount = list.filter(s=>!inStock(s)).length;
  const inCount  = total - outCount;
  const shown = list.slice(0, stockLimit);
  if(!total){
    box.innerHTML = `<div class="card text-center opacity-70">Ничего не найдено</div>`;
    return;
  }
  const more = total > shown.length
    ? `<button class="btn btn-ghost w-full mt-2" id="stockMore">Показать ещё (${total - shown.length})</button>`
    : `<div class="text-center text-xs opacity-60 mt-2">В наличии: ${inCount}${outCount?` · нет в наличии: ${outCount}`:""}</div>`;
  // визуальный разделитель перед блоком «нет в наличии» (только если он попадает в показанный срез)
  let html = "";
  let firstOutSeen = false;
  for(const it of shown){
    if(!firstOutSeen && !inStock(it) && inCount>0){
      firstOutSeen = true;
      html += `<div class="text-xs opacity-60 mt-3 mb-1 uppercase tracking-wide">— Нет в наличии (${outCount}) —</div>`;
    }
    html += stockRow(it);
  }
  box.innerHTML = `<div class="space-y-2">${html}</div>${more}`;
  const moreBtn = document.getElementById("stockMore");
  if(moreBtn) moreBtn.addEventListener("click", ()=>{ stockLimit += 200; renderStockList(); });
}

function renderJournal(kind){
  const m = JOURNAL_META[kind];
  const list = [...(state.journals[kind]||[])].sort((a,b)=> (b.ts||"").localeCompare(a.ts||""));
  const rows = list.map(op=>{
    const _dWhen = new Date(op.ts);
    const when = isNaN(_dWhen) ? "—" : _dWhen.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    const status = kind==="order"
      ? (op.status==="received"
          ? `<span class="badge badge-green">Принят</span>`
          : `<span class="badge badge-yellow">Ожидает</span>`)
      : "";
    const qtyBadge = `<span class="badge badge-gray">${fmtQty(op.qty)} ${esc(op.unit||"")}</span>`;
    const locBadge = op.batchLocation ? `<span class="badge badge-gray">📍 ${esc(op.batchLocation)}</span>` : "";
    const expBadge = op.batchExpiry ? `<span class="badge badge-gray">⏰ ${fmtDate(op.batchExpiry)}</span>` : "";
    // зеркальные записи из принятого заказа: редактировать нельзя — это рассинхронизирует с order; удалять можно (deleteOp умеет)
    const linkedToOrder = kind==="receipt" && (state.journals.order||[]).some(o=>o.receiptId===op.id);
    const receiveBtn = (kind==="order" && op.status!=="received")
      ? `<button class="btn btn-success" onclick="orderReceive('${op.id}')">Принять на склад</button>`
      : "";
    return `<div class="card">

        <div class="flex-1 min-w-0">
          <div class="font-semibold break-words">${esc(op.productName)}</div>

            ${qtyBadge}
            ${locBadge} ${expBadge}
            <span class="badge badge-gray">${when}</span>
            ${status}
          </div>
          ${op.note?`<div class="text-xs opacity-80 mt-1">${esc(op.note)}</div>`:""}

          <button class="btn btn-ghost" onclick="deleteOp('${kind}','${op.id}')" aria-label="Удалить запись">🗑</button>
        </div>

    </div>`;
  }).join("") || `<div class="card text-center opacity-70">Записей нет</div>`;

  // группируем суммы по единицам (шт+кг смешивать нельзя)
  const byUnit = {};

      <div class="grid grid-cols-2 gap-2">
        <input class="input" id="opQty" type="number" inputmode="decimal" placeholder="Количество" />
        <select class="input" id="opUnit">${UNITS.map(u=>`<option>${u}</option>`).join("")}</select>
      </div>
      <textarea class="input" id="opNote" rows="2" placeholder="${kind==='issue'?'Кому выдано':kind==='writeoff'?'Причина списания':kind==='order'?'Поставщик / комментарий':'Комментарий'}"></textarea>
      <div class="flex gap-2 pt-2">
        <button class="btn btn-ghost flex-1" data-close>Отмена</button>
        <button class="btn btn-primary flex-1" onclick="saveOp('${kind}')">Записать</button>
      </div>
    </div>
  `);
  wireStockPicker({ prefix:"op", emptyHint:"Введи 2+ символа для поиска", notFoundText:"Не найдено. Можно ввести вручную.", nameOnPick:false });
}

function saveOp(kind){
  if(!ensureCanEdit()) return;
  const m = JOURNAL_META[kind];
  const body = document.getElementById("sheetBody");
  const pid = body.querySelector("#opProdId").value;
  const manualName = body.querySelector("#opName").value.trim();
  const qty = roundQty(parseNum(body.querySelector("#opQty").value));   // округляем в источнике: op.qty, склад и лог единообразны (иначе float-хвост ломает авто-удаление орфана)
  const unit = body.querySelector("#opUnit").value;
  const note = body.querySelector("#opNote").value.trim();
  if(!qty || qty<=0){ toast("Укажи количество"); return; }
  const product = pid ? state.stock.find(s=>s.id===pid) : null;
  const name = product ? product.name : manualName;
  if(!name){ toast("Выбери позицию или введи название"); return; }
  // Защита от рассинхрона с партиями: для batches-карточек нельзя править qty напрямую
  if(product && hasBatches(product) && m.sign!==0){
    toast("У этой позиции есть партии — используй ＋/− на карточке (выбор партии)");
    return;
  }
  if(product && m.sign<0 && Number(product.qty||0) < qty){ toast("Не хватает на складе"); return; }
  // Защита от «расхода в воздух»: если выбрали ручной ввод имени и это расход — не даём проводить движение
  if(!product && m.sign<0){
    toast("Для расхода выбери позицию со склада (поиск выше)");
    return;
  }

  const op = {
    id: uid(),
    ts: new Date().toISOString(),
    productId: product?.id || "",
    productName: name,
    qty,
    unit: product?.unit || unit,
    note,
  };
  if(kind==="order") op.status = "pending";

  if(product && m.sign!==0){
    product.qty = roundQty(Number(product.qty||0) + m.sign*qty);
    product.updatedAt = new Date().toISOString();
  }
  state.journals[kind] = state.journals[kind] || [];
  state.journals[kind].unshift(op);
  logOp(kind.toUpperCase(), `${name} ${m.sign>0?"+":m.sign<0?"-":""}${qty} ${op.unit||""}`);
  saveState(); closeSheet(); render();
  toast(`${m.verb}: ${name}`);
}

function orderReceive(opId){
  if(!ensureCanEdit()) return;
  const op = state.journals.order.find(o=>o.id===opId); if(!op) return;
  if(op.status==="received") return;
  op.status = "received";
  op.receivedAt = new Date().toISOString();
  let product = op.productId ? state.stock.find(s=>s.id===op.productId) : null;
  if(!product){
    // авто-создание позиции на складе по ручному имени
    product = {
      id: uid(), type:"product", name: op.productName,
      qty: 0, unit: op.unit||"шт", minStock:"", expiry:"", location:"",
      category: ((state.categories.product||[]).includes("Прочие продукты") ? "Прочие продукты" : (state.categories.product||[])[0] || ""),
      note:"", createdAt:new Date().toISOString(),
    };
    state.stock.push(product);
    op.productId = product.id;
  }
  const receiptId = uid();
  op.receiptId = receiptId;
  if(hasBatches(product)){
    // приём в карточку с партиями — добавляем новую партию (без срока/места, можно отредактировать вручную)
    const newB = { id: uid(), qty: roundQty(op.qty||0), expiry:"", location:"", note: orderNote(op), createdAt:new Date().toISOString() };
    product.batches = product.batches || [];
    product.batches.push(newB);
    op.batchId = newB.id; // привязка заказа к созданной партии — иначе откат в deleteOp создаст вторую партию вместо снятия
    syncItemFromBatches(product);
    state.journals.receipt.unshift({
      id: receiptId, ts: new Date().toISOString(),
      productId: product.id, productName: op.productName,
      qty: op.qty, unit: op.unit,
      batchId: newB.id, batchLocation: "", batchExpiry: "",
      note: orderNote(op, "(новая партия)"),
    });
  } else {
    product.qty = roundQty(Number(product.qty||0) + Number(op.qty||0));
    product.updatedAt = new Date().toISOString();
    state.journals.receipt.unshift({
      id: receiptId, ts: new Date().toISOString(),
      productId: product?.id || "", productName: op.productName,
      qty: op.qty, unit: op.unit,
      note: orderNote(op),
    });
  }
  logOp("ORDER_RECEIVE", `${op.productName} +${fmtQty(op.qty)} ${op.unit||""}`);
  saveState(); render();
  toast("Принято на склад");
}

// позиция осиротела (qty=0 и нигде в журналах не упоминается, кроме записи exceptOpId) →
// спрашиваем удалить (тихо не удаляем — может быть каталожной: ценны minStock/категория).
// Был продублирован в deleteOp и saveOpEdit.
async function maybeDropOrphanProduct(prod, exceptOpId){
  if(!prod) return;
  const hasOther = JOURNAL_KEYS.some(k=>
    (state.journals[k]||[]).some(r=>r.productId===prod.id && r.id!==exceptOpId)
  );
  if(!hasOther && await confirmSheet(`«${prod.name}» на складе = 0 и больше не упоминается. Удалить позицию?`,{yes:"Удалить",no:"Оставить"})){
    state.stock = state.stock.filter(s=>s.id!==prod.id);
  }
}

async function deleteOp(kind, opId){
  if(!ensureCanEdit()) return;
  const op = (state.journals[kind]||[]).find(o=>o.id===opId);
  if(!op) return;
  // зеркальная receipt-запись принятого заказа: удалять только через сам заказ,
  // иначе двойной откат склада (здесь и потом при удалении заказа)
  if(kind==="receipt" && (state.journals.order||[]).some(o=>o.receiptId===opId)){
    toast("Эта запись из заказа — удаляйте сам заказ во вкладке «Заказы»");
    return;
  }
  const m = JOURNAL_META[kind];
  // эффективный знак для отката (order влияет на склад только при status==="received", знак +1)
  const effectiveSign = kind==="order"
    ? (op.status==="received" ? +1 : 0)
    : m.sign;
  let revert = false;
  const product = op.productId ? state.stock.find(s=>s.id===op.productId) : null;

  if(effectiveSign!==0 && product){
    const choice = await chooseSheet(
      `Удалить запись?\n${op.productName} — ${fmtQty(op.qty)} ${op.unit||""}`,
      [
        { label:"Удалить и ОТКАТИТЬ склад", value:"revert", color:"btn-warn" },
        { label:"Удалить только запись", value:"keep", color:"btn-danger" },
      ]
    );
    if(!choice) return;
    // другая вкладка могла подменить state во время await — перепроверяем по живым ссылкам,
    // иначе откат мутировал бы осиротевший объект, а saveState() записал бы новый state без него
    if(!(state.journals[kind]||[]).some(o=>o.id===opId)){ toast("Запись изменилась в другой вкладке"); return; }
    const liveProduct = op.productId ? state.stock.find(s=>s.id===op.productId) : null;
    if(liveProduct && liveProduct!==product){ toast("Данные обновились в другой вкладке — повторите"); return; }
    revert = choice==="revert";
    if(revert){
      // batches-режим: пытаемся вернуть/списать в исходную партию по batchId
      if(hasBatches(product)){
        const tb = op.batchId ? (product.batches||[]).find(b=>b.id===op.batchId) : null;
        if(tb){
          const next = roundQty(Number(tb.qty||0) - effectiveSign*Number(op.qty||0));
          if(next<0){ toast("Нельзя откатить: в партии меньше"); return; }
          tb.qty = next;
          // нулевую партию убираем при любом знаке отката — иначе остаётся фантомное место/срок
          if(next===0) product.batches = product.batches.filter(b=>b.id!==tb.id);
          finalizeBatchMutation(product);
        } else {
          // исходной партии нет (удалена/не привязана). Откат прихода = СНЯТЬ qty, но мы не знаем
          // из какой партии — а «восстановить» партию было бы двойным учётом (qty уже учтён где-то).
          toast("Партия этой записи не найдена — точный откат невозможен. Удалите запись без отката.");
          return;
        }
      } else {
        // карточка стала legacy. Если запись отвязана от удалённой партии — откат «в воздух» раздул бы qty
        if(/\[партия удалена\]/.test(op.note||"")){
          toast("Запись отвязана от удалённой партии — откат недоступен. Удали запись без отката.");
          return;
        }
        const next = Number(product.qty||0) - effectiveSign*Number(op.qty||0);
        if(next<0){ toast("Нельзя откатить: на складе меньше"); return; }
        product.qty = roundQty(next); product.updatedAt = new Date().toISOString();
      }
      // если принятый заказ — удалить парную запись в Поступлении по точному id (fallback: по совпадению)
      if(kind==="order"){
        if(op.receiptId){
          state.journals.receipt = (state.journals.receipt||[]).filter(r=>r.id!==op.receiptId);
        } else {
          // старые записи без receiptId — фолбэк на эвристику (снесёт только одну первую совпадающую)
          const arr = state.journals.receipt||[];
          const idx = arr.findIndex(r=>r.productId===product.id && Number(r.qty)===Number(op.qty) && (r.note||"").startsWith("Из заказа"));
          if(idx>=0) arr.splice(idx,1);
        }
      }
      // если позиция была авто-создана (qty=0 и нет других журнальных записей) — предложить удалить.
      // saveState() ДО интерактивного подтверждения фиксирует откат склада и ставит dirty →
      // pull во время диалога заблокирован и не затрёт нашу правку «осиротевшим» объектом.
      if(product.qty===0){ saveState(); await maybeDropOrphanProduct(product, opId); }
    }
  } else {
    if(!await confirmSheet(`Удалить запись?\n${op.productName} — ${fmtQty(op.qty)} ${op.unit||""}`,{danger:true,yes:"Удалить"})) return;
  }
  state.journals[kind] = state.journals[kind].filter(o=>o.id!==opId);
  logOp("OP_DEL", `${kind} ${op.productName} ${fmtQty(op.qty)}${revert?" (откат)":""}`);
  saveState(); render();
}

/* Редактирование записи журнала: дата/время, продукт, количество, примечание.
   Откат старого эффекта на склад → применение нового. Для принятого заказа — синхронизация
   парной записи в receipt по receiptId. */
function editOp(kind, opId){

  if(!op) return;

  // Определяем по связи receiptId (надёжно), а не по тексту примечания (его можно изменить).
  if(kind==="receipt" && (state.journals.order||[]).some(o=>o.receiptId===op.id)){
    toast("Эта запись из заказа — редактируйте сам заказ во вкладке «Заказы»");
    return;
  }
  const m = JOURNAL_META[kind];
  // dt-local: YYYY-MM-DDTHH:MM (без секунд, локальное время)
  let d = new Date(op.ts); if(isNaN(d)) d = new Date();   // битый ts → текущее время, чтобы форма не сломалась
  const pad = n=>String(n).padStart(2,"0");
  const dtLocal = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  openSheet(`
    <div class="font-bold text-xl mb-3">✏️ Изменить запись — ${m.label}</div>
    <div class="space-y-3">
      <div>
        <div class="text-sm opacity-70 mb-1">Дата и время</div>
        <input type="datetime-local" class="input" id="eopTs" value="${dtLocal}" />
      </div>
      <div>
        <div class="text-sm opacity-70 mb-1">Сменить позицию (опц.)</div>
        <input class="input" id="eopSearch" placeholder="Поиск по складу…" autocomplete="off" />
        <div id="eopList" class="mt-2 space-y-1 max-h-48 overflow-y-auto list-box"></div>
        <div class="text-xs opacity-60 mt-1" id="eopSel">Текущая: ${esc(op.productName)}${op.productId?" (привязана к складу)":" (вручную)"}</div>
        <input type="hidden" id="eopProdId" value="${esc(op.productId||"")}" />
      </div>
      <input class="input" id="eopName" placeholder="Название вручную (если нет на складе)" value="${esc(op.productName||"")}" />
      <div class="grid grid-cols-2 gap-2">
        <input class="input" id="eopQty" type="number" inputmode="decimal" value="${esc(fmtQty(op.qty))}" />
        <select class="input" id="eopUnit">${UNITS.map(u=>`<option ${u===op.unit?"selected":""}>${u}</option>`).join("")}</select>
      </div>
      <textarea class="input" id="eopNote" rows="2">${esc(op.note||"")}</textarea>
      <div class="flex gap-2 pt-2">
        <button class="btn btn-ghost flex-1" data-close>Отмена</button>
        <button class="btn btn-primary flex-1" onclick="saveOpEdit('${kind}','${opId}')">Сохранить</button>
      </div>
    </div>
  `);
  wireStockPicker({ prefix:"eop", emptyHint:"Введи 2+ символа", notFoundText:"Не найдено", nameOnPick:true });
}

async function saveOpEdit(kind, opId){
  if(!ensureCanEdit()) return;
  const op = (state.journals[kind]||[]).find(o=>o.id===opId); if(!op) return;
  const m = JOURNAL_META[kind];
  const body = document.getElementById("sheetBody");
  const dtVal = body.querySelector("#eopTs").value;
  const newProdId = body.querySelector("#eopProdId").value;
  const newName = body.querySelector("#eopName").value.trim();
  const newQty = parseNum(body.querySelector("#eopQty").value);
  const newUnit = body.querySelector("#eopUnit").value;
  const newNote = body.querySelector("#eopNote").value.trim();
  if(!Number.isFinite(newQty) || newQty<=0){ toast("Количество должно быть > 0"); return; }
  if(!newName && !newProdId){ toast("Укажи название или выбери позицию"); return; }

  // эффективный знак (order влияет на склад только если received)
  const effSign = kind==="order" ? (op.status==="received" ? +1 : 0) : m.sign;

  const oldProd = op.productId ? state.stock.find(s=>s.id===op.productId) : null;
  const newProd = newProdId ? state.stock.find(s=>s.id===newProdId) : null;

  // если запись имела привязку к складу, но продукт удалён — нельзя корректно откатить старый эффект
  if(effSign!==0 && op.productId && !oldProd){
    toast("Привязанный продукт не найден на складе — откат невозможен");
    return;
  }
  // запрет редактирования количества для batches-карточек (рассинхрон с партиями)
  if(effSign!==0 && ((oldProd && hasBatches(oldProd)) || (newProd && hasBatches(newProd)))){
    toast("У позиции есть партии — отредактируйте/удалите запись и проведите движение через ＋/− на карточке");
    return;
  }
  // запись отвязана от удалённой партии: откат «в воздух» раздул бы qty legacy-карточки
  if(effSign!==0 && /\[партия удалена\]/.test(op.note||"")){
    toast("Запись отвязана от удалённой партии — правка склада недоступна. Удалите запись без отката.");
    return;
  }

  // блок будущей даты для движений склада (нельзя «выдать»/«принять» в будущем)
  const newTs = dtVal ? new Date(dtVal).toISOString() : op.ts;
  if(effSign!==0 && new Date(newTs).getTime() > Date.now() + 60_000){
    toast("Дата не может быть в будущем для движений склада");
    return;
  }

  // расход обязан быть привязан к складской позиции — иначе журнал скажет «выдано»,
  // а склад не уменьшится (рассинхрон)
  if(effSign<0 && !newProd){
    toast("Для расхода выбери позицию со склада");
    return;
  }

  // снимок qty ДО любых мутаций — для надёжного отката при ошибке
  const oldProdQtyBefore = oldProd ? Number(oldProd.qty||0) : null;
  const newProdQtyBefore = (newProd && newProd!==oldProd) ? Number(newProd.qty||0) : null;
  const restore = () => {
    if(oldProd && oldProdQtyBefore!==null) oldProd.qty = oldProdQtyBefore;
    if(newProd && newProd!==oldProd && newProdQtyBefore!==null) newProd.qty = newProdQtyBefore;
  };

  // 1) откатить старый эффект
  if(effSign!==0 && oldProd){
    const reverted = Number(oldProd.qty||0) - effSign*Number(op.qty||0);
    if(reverted < 0){ toast("Нельзя откатить: на складе меньше старого количества"); return; }
    oldProd.qty = roundQty(reverted); oldProd.updatedAt = new Date().toISOString();
  }
  // 2) применить новый эффект
  if(effSign!==0 && newProd){
    if(effSign<0 && Number(newProd.qty||0) < newQty){
      restore();
      toast("Не хватает на складе для нового количества"); return;
    }
    newProd.qty = roundQty(Number(newProd.qty||0) + effSign*newQty);
    newProd.updatedAt = new Date().toISOString();
  }

  // 3) обновить саму запись
  op.ts = newTs;
  op.productId = newProd?.id || "";
  op.productName = newProd?.name || newName;
  op.qty = roundQty(newQty);
  op.unit = newProd?.unit || newUnit;
  op.note = newNote;

  // 4) для принятого заказа — синхронизируем парную запись в receipt
  if(kind==="order" && op.status==="received" && op.receiptId){
    const r = (state.journals.receipt||[]).find(x=>x.id===op.receiptId);
    if(r){
      r.ts = newTs;
      r.productId = op.productId;
      r.productName = op.productName;
      r.qty = op.qty;
      r.unit = op.unit;
      r.note = orderNote(op);
    }
  }

  // если старый продукт после отвязки/перепривязки осиротел (qty=0 и больше нигде не упоминается) —
  // спрашиваем, а не удаляем тихо: позиция может быть каталожной (minStock/категория ценны)
  if(oldProd && oldProd!==newProd && Number(oldProd.qty||0)===0 && !hasBatches(oldProd)){
    saveState();   // фиксируем правки склада ДО интерактивного orphan-подтверждения (dirty блокирует pull в окне диалога)
    await maybeDropOrphanProduct(oldProd, op.id);
  }

  logOp("OP_EDIT", `${kind} ${op.productName} ${fmtQty(op.qty)} ${op.unit||""}`);
  saveState(); closeSheet(); render();
  toast("Запись обновлена");
}

function stockRow(it){
  const st = stockStatus(it);
  const out = !!st.out;
  const badge = out
    ? `<span class="badge badge-gray">${esc(st.text)}</span>`
    : st.color==="red" ? `<span class="badge badge-red">${esc(st.text)}</span>`
    : st.color==="yellow" ? `<span class="badge badge-yellow">${esc(st.text)}</span>` : "";
  const icon = typeMeta(it.type).icon;
  const totalQ = totalQtyOf(it);
  const left = `${fmtQty(totalQ)} ${esc(it.unit||"")}`;
  const qtyBadge = out ? `<span class="badge badge-gray">${left}</span>` : `<span class="badge badge-green">${left}</span>`;
  const locs = locationsOf(it);
  const loc = locs.length===0 ? ""
    : locs.length===1 ? `<span class="badge badge-gray">📍 ${esc(locs[0])}</span>`
    : `<span class="badge badge-gray">📍 ${locs.length} мест</span>`;
  const cat = it.category?`<span class="badge badge-gray">${esc(it.category)}</span>`:"";
  // показываем ближайший срок (агрегат по партиям); при нескольких партиях добавляем "+N"
  const bCnt = batchesOf(it).length;
  const nearestExp = nearestExpiryOf(it);
  const expExtra = bCnt>1 ? ` +${bCnt-1}` : "";
  // срок не показываем у позиции без остатка (qty=0): нет товара — нет срока
  const exp = (nearestExp && inStock(it))?`<span class="badge badge-gray">⏰ ${fmtDate(nearestExp)}${expExtra}</span>`:"";
  // раскрывающаяся панель партий — показывается, если их ≥ 2
  const batchPanel = bCnt>=2 ? `
    <details class="mt-2" onclick="event.stopPropagation()">
      <summary class="text-xs opacity-70 cursor-pointer select-none">Партии (${bCnt}) ▾</summary>
      <div class="mt-2 space-y-1">
        ${batchesOf(it).slice().sort(byExpiry).map(b=>{
          const d = b.expiry?daysLeft(b.expiry):null;
          const cls = d===null?"badge-gray":(d<0?"badge-red":(d<=3?"badge-red":(d<=14?"badge-yellow":"badge-gray")));
          return `<div class="text-xs flex flex-wrap gap-1 items-center pl-2 border-l-2 border-gray-700">
            ${batchQtyBadge(b, it)}
            ${b.location?`<span class="badge badge-gray">📍 ${esc(b.location)}</span>`:""}
            ${b.expiry?`<span class="badge ${cls}">⏰ ${fmtDate(b.expiry)}</span>`:""}
            ${b.note?`<span class="opacity-60">${esc(b.note)}</span>`:""}
          </div>`;
        }).join("")}
      </div>
    </details>` : "";
  return `
    <div class="card${out?" opacity-60":""}">
      <div class="flex items-start gap-3">
        <div class="text-2xl${out?" grayscale":""}">${icon}</div>
        <div class="flex-1 min-w-0" onclick="openStockEdit('${it.id}')">
          <div class="font-semibold break-words${out?" line-through opacity-80":""}">${esc(it.name)}</div>
          <div class="text-xs opacity-70 mt-1 flex flex-wrap gap-2 items-center">
            ${qtyBadge}
            ${cat} ${loc} ${exp} ${badge}
          </div>
          ${batchPanel}
        </div>
      </div>
      <div class="grid grid-cols-${out?"1":"2"} gap-2 mt-3">
        <button class="btn btn-success" onclick="quickAdjust('${it.id}',+1)">＋ Приход${out?" (вернуть в наличие)":""}</button>
        ${out?"":`<button class="btn btn-danger" onclick="quickAdjust('${it.id}',-1)">− Расход…</button>`}
      </div>
    </div>`;
}

async function quickAdjust(id, sign){
  if(!ensureCanEdit()) return;
  const it = state.stock.find(s=>s.id===id); if(!it) return;
  // для расхода — спрашиваем тип движения: выдача персоналу или списание (порча/просрочка/бой)
  let kind, label, title, opNote;
  if(sign>0){
    kind = "receipt"; label = "Сколько пришло?"; title = "Приход"; opNote = "(быстрая правка)";
  } else {
    const choice = await chooseSheet(
      `${it.name}\nКуда списать?`,
      [
        { label:"Выдача (кому-то)",      value:"issue",    color:"btn-danger" },
        { label:"Списание (порча/срок)", value:"writeoff", color:"btn-warn"   },
      ]
    );
    if(!choice) return;
    kind = choice;
    label = kind==="issue" ? "Сколько выдано?" : "Сколько списать?";
    title = kind==="issue" ? "Выдача" : "Списание";
    opNote = kind==="issue" ? "(быстрая выдача)" : "(быстрое списание)";
  }

  // === МНОГО-ПАРТИЙНАЯ ВЕТКА ===
  if(hasBatches(it)){
    const batches = batchesOf(it);
    let targetBatch = null;

    if(sign>0){
      // приход: выбрать существующую партию или создать новую
      const opts = batches.slice().sort(byExpiry).map(b=>({
        label: `${fmtQty(b.qty)} ${it.unit||""}${b.location?" · 📍 "+b.location:""}${b.expiry?" · ⏰ "+fmtDate(b.expiry):""}`,
        value: b.id, color: "btn-success"
      }));
      opts.push({ label: "➕ Новая партия (свой срок/место)", value: "__new__", color: "btn-primary" });
      const choice = await chooseSheet(`${it.name}\nКуда добавить?`, opts);
      if(!choice) return;
      if(choice==="__new__"){
        // спросим срок/место (короткая форма через 2 prompts)
        const expVal = await promptSheet(`${it.name}\nСрок годности новой партии (YYYY-MM-DD, пусто — без срока)`, "", {title:"Новая партия"});
        if(expVal===null) return;
        // кривой формат сломал бы daysLeft() (NaN → партия не подсветится и не спишется по сроку)
        if(expVal.trim() && !/^\d{4}-\d{2}-\d{2}$/.test(expVal.trim())){ toast("Срок: формат ГГГГ-ММ-ДД"); return; }
        const locVal = await promptSheet(`${it.name}\nМесто хранения (пусто — без места)`, locationsOf(it)[0]||"", {title:"Новая партия"});
        if(locVal===null) return;
        const val = await promptSheet(`${it.name}\n${label}`, "1", {numeric:true,title});
        if(val===null) return;
        const n = roundQty(parseNum(val));
        if(!Number.isFinite(n) || n<=0){ toast("Не число"); return; }
        if(state.stock.find(s=>s.id===id)!==it){ toast("Данные обновились — повтори операцию"); render(); return; }   // pull/смена базы во время диалога пересоздал объект → не теряем правку на «осиротевшем»
        const newB = { id:uid(), qty:n, expiry:expVal.trim(), location:cleanName40(locVal), note:"", createdAt:new Date().toISOString() };
        it.batches.push(newB);
        syncItemFromBatches(it);
        state.journals.receipt = state.journals.receipt || [];
        state.journals.receipt.unshift({ id:uid(), ts:new Date().toISOString(), productId:it.id, productName:it.name, qty:n, unit:it.unit||"", batchId:newB.id, batchLocation:newB.location||"", batchExpiry:newB.expiry||"", note:`Новая партия${newB.expiry?` (срок ${fmtDate(newB.expiry)})`:""}${newB.location?` в «${newB.location}»`:""}` });
        logOp("IN", `${it.name} +${fmtQty(n)} ${it.unit||""} [новая партия]`);
        saveState(); render(); return;
      }
      targetBatch = batches.find(b=>b.id===choice);
    } else {
      // расход: обязателен выбор партии
      const opts = batches.filter(b=>roundQty(b.qty||0)>0).slice().sort(byExpiry).map(b=>({
        label: `${fmtQty(b.qty)} ${it.unit||""}${b.location?" · 📍 "+b.location:""}${b.expiry?" · ⏰ "+fmtDate(b.expiry):""}`,
        value: b.id, color: kind==="issue"?"btn-danger":"btn-warn"
      }));
      if(!opts.length){ toast("Нет партий с остатком"); return; }
      const choice = await chooseSheet(`${it.name}\nС какой партии?`, opts);
      if(!choice) return;
      targetBatch = batches.find(b=>b.id===choice);
    }

    if(!targetBatch){ toast("Партия не найдена"); return; }
    const val = await promptSheet(`${it.name}\n${label}\n(в партии ${fmtQty(targetBatch.qty)} ${it.unit||""}${targetBatch.location?", 📍 "+targetBatch.location:""})`, "1", {numeric:true,title});
    if(val===null) return;
    const n = roundQty(parseNum(val));
    if(!Number.isFinite(n) || n<=0){ toast("Не число"); return; }
    if(state.stock.find(s=>s.id===id)!==it){ toast("Данные обновились — повтори операцию"); render(); return; }   // объект пересоздан pull-ом во время диалога → targetBatch тоже устарел, не мутируем
    const nextBatch = roundQty(Number(targetBatch.qty||0) + sign*n);
    if(nextBatch<0){ toast("Не хватает в этой партии"); return; }
    targetBatch.qty = nextBatch;
    // партию с qty=0 убираем (но только при расходе)
    if(sign<0 && nextBatch===0) it.batches = it.batches.filter(b=>b.id!==targetBatch.id);
    finalizeBatchMutation(it);

    state.journals[kind] = state.journals[kind]||[];
    const noteParts = [];
    if(targetBatch.location) noteParts.push(`📍 ${targetBatch.location}`);
    if(targetBatch.expiry)   noteParts.push(`⏰ ${fmtDate(targetBatch.expiry)}`);
    state.journals[kind].unshift({
      id:uid(), ts:new Date().toISOString(), productId:it.id, productName:it.name,
      qty:n, unit:it.unit||"",
      batchId: targetBatch.id, batchLocation: targetBatch.location||"", batchExpiry: targetBatch.expiry||"",
      note: opNote + (noteParts.length?` ${noteParts.join(" · ")}`:"")
    });
    const tag = opTag(kind);
    logOp(tag, `${it.name} ${sign>0?"+":"-"}${fmtQty(n)} ${it.unit||""}${noteParts.length?` [${noteParts.join(" · ")}]`:""}`);
    saveState(); render(); return;
  }

  // === LEGACY ВЕТКА (без партий) ===
  const val = await promptSheet(`${it.name}\n${label} (сейчас ${fmtQty(it.qty)} ${it.unit||""})`, "1", {numeric:true,title});
  if(val===null) return;
  const n = roundQty(parseNum(val));
  if(!Number.isFinite(n) || n<=0){ toast("Не число"); return; }
  if(state.stock.find(s=>s.id===id)!==it){ toast("Данные обновились — повтори операцию"); render(); return; }   // объект пересоздан pull-ом во время диалога → не теряем правку
  const next = roundQty(Number(it.qty||0) + sign*n);
  if(next<0){ toast("Не хватает на складе"); return; }
  it.qty = next; it.updatedAt = new Date().toISOString();
  state.journals[kind] = state.journals[kind]||[];
  state.journals[kind].unshift({ id:uid(), ts:new Date().toISOString(), productId:it.id, productName:it.name, qty:n, unit:it.unit||"", note:opNote });
  const tag = opTag(kind);
  logOp(tag, `${it.name} ${sign>0?"+":"-"}${fmtQty(n)} ${it.unit||""}`);
  saveState(); render();
}

function saveStock(id, type){
  if(!ensureCanEdit()) return;
  const body = document.getElementById("sheetBody");
  const name = body.querySelector("#sn").value.trim();
  if(!name){ toast("Название обязательно"); return; }
  const qty = Math.max(0, roundQty(parseNum(body.querySelector("#sq").value)));   // ручной ввод: отрицательное/мусор → 0 (нет смысла в минусовом остатке)
  const unit = body.querySelector("#su").value;
  const _smRaw = body.querySelector("#sm").value, _smN = parseNum(_smRaw);
  const minStock = (_smRaw===""||!Number.isFinite(_smN)) ? "" : _smN;   // мусор/NaN → "" (иначе сравнение «низкий запас» молча отключалось)
  const expiry = body.querySelector("#se")?.value || "";
  const note = body.querySelector("#sno").value.trim();
  const category = body.querySelector(".chip.active[data-cat]")?.dataset.cat || "";
  const location = body.querySelector(".chip.active[data-loc]")?.dataset.loc || "";
  let propType=type, propOld=null;
  if(id){
    const it = state.stock.find(s=>s.id===id);
    if(!it){ toast("Позиция изменилась в другой вкладке"); closeSheet(); render(); return; }   // удалена/синкнута, пока форма была открыта → не падаем на Object.assign(undefined)
    const oldName = it.name;
    propType = it.type;
    if(hasBatches(it)){
      // в режиме партий qty/expiry/location — производные, перезаписывать вручную нельзя
      Object.assign(it,{name,unit,minStock,category,note,updatedAt:new Date().toISOString()});
      syncItemFromBatches(it);
    } else {
      Object.assign(it,{name,qty:roundQty(qty),unit,minStock,expiry,location,category,note,updatedAt:new Date().toISOString()});
    }
    logOp("STOCK_EDIT", name);
    if(oldName && oldName!==name) propOld = oldName;   // переименование — распространим
  } else {
    state.stock.push({id:uid(),type,name,qty:roundQty(qty),unit,minStock,expiry,location,category,note,createdAt:new Date().toISOString()});
    logOp("STOCK_ADD", `${name} +${qty} ${unit}`);
  }
  // общий каталог: новое имя / переименование → в остальные базы (qty 0)
  try{ propagateName(propType, name, unit, propOld); }catch(e){ console.warn("propagateName", e); }
  saveState(); closeSheet(); render();
}

function saveBatch(id){
  if(!ensureCanEdit()) return;
  const body = document.getElementById("sheetBody");
  const it = state.stock.find(s=>s.id===id); if(!it){ closeSheet(); return; }
  const qty = roundQty(parseNum(body.querySelector("#bq").value));
  const expiry = body.querySelector("#be").value || "";
  const location = body.querySelector(".chip.active[data-loc]")?.dataset.loc || "";
  const note = body.querySelector("#bnote")?.value.trim() || "";
  if(!(qty>0)){ toast("Количество должно быть > 0"); return; }
  it.batches = it.batches || [];
  // если у карточки был legacy qty без партий — конвертируем в первую партию
  if(it.batches.length===0 && roundQty(it.qty||0) > 0){
    it.batches.push({
      id: uid(), qty: roundQty(it.qty||0),
      expiry: it.expiry||"", location: it.location||"",
      note: "Перенос исходного остатка", createdAt: it.createdAt||new Date().toISOString()
    });
  }
  const newB = { id:uid(), qty, expiry, location, note, createdAt:new Date().toISOString() };
  it.batches.push(newB);
  syncItemFromBatches(it);
  state.journals = state.journals || emptyJournals();
  state.journals.receipt = state.journals.receipt || [];
  state.journals.receipt.unshift({
    id: uid(), ts: new Date().toISOString(), productId: it.id, productName: it.name,
    qty, unit: it.unit||"",
    batchId: newB.id, batchLocation: location, batchExpiry: expiry,
    note: `Новая партия${expiry?` (срок ${fmtDate(expiry)})`:""}${location?` в «${location}»`:""}`
  });
  logOp("BATCH_ADD", `${it.name} +${fmtQty(qty)} ${it.unit||""}${location?` в «${location}»`:""}${expiry?` до ${fmtDate(expiry)}`:""}`);
  saveState(); closeSheet(); render();
  toast("Партия добавлена");
}
