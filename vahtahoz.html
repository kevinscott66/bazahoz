function activeCloudId(){ const p=profiles.list.find(x=>x.id===profiles.activeId); return p?(p.cloudId||null):null; }
function memberOf(cid){ return cloud.members.find(m=>m.base_id===cid)||null; }
function activeMember(){
  const cid=activeCloudId(); if(!cid) return null;
  if(cloud.profile && cloud.profile.is_admin) return {can_view_stock:true,can_edit_stock:true,can_view_tasks:true,can_edit_tasks:true};
  return memberOf(cid);
}
// право править склад: вне облака (локальный режим) — всегда да; в облаке — по флагу участника.
// Гард на точках мутации: иначе правка view-only-участника применялась бы локально, не выгружалась
// (cloudPushNow её молча отбрасывает) и затиралась следующим pull — потеря без обратной связи.
function canEditStock(){ const m=activeMember(); return !m || !!m.can_edit_stock; }
function ensureCanEdit(){ if(!canEditStock()){ toast("Нет прав на редактирование склада"); return false; } return true; }
const cloudDirtyKey = (cid)=>`vahtahoz_dirty_${cid}`;
// удалить все sync-маркеры базы (dirty + снимки подписей) — при удалении/замене базы, чтобы не копить мусор
function clearBaseSyncKeys(cid){ if(!cid) return; try{ localStorage.removeItem(cloudDirtyKey(cid)); for(const k of ["stock","jr","settings"]) localStorage.removeItem(`vahtahoz_sig_${k}_${cid}`); }catch(_){} }
function cloudOnline(){ return navigator.onLine!==false; }
/* «ограниченный» пользователь — вошёл в облако и НЕ имеет права на задачи (начальник):
   ему показываем только складскую часть (журнал операций без задач). */
function isRestrictedUser(){ const m = activeMember(); return !!(m && !m.can_view_tasks); }
// блокировка управления базами: либо роль ограничена, либо роль ЕЩЁ НЕ ИЗВЕСТНА (есть сохранённая сессия,
// но cloud.members не загрузились) → fail-safe: до выяснения роли не даём переключать/плодить базы,
// иначе на холодном старте начальник успел бы переключиться на локальную базу в обход ограничений.
function roleBaseLocked(){ try{ return isRestrictedUser() || (!!loadCloudSess() && !cloud.ready); }catch(_){ return isRestrictedUser(); } }
function visibleLog(){
  if(!isRestrictedUser()) return state.log;
  return (state.log||[]).filter(l => !String(l.action||"").toUpperCase().startsWith("TASK"));
}

/* статус-бар синхронизации: syncing | offline | synced | error | hidden */
let _syncHideT = null;
function setSyncStatus(kind, text){
  const bar = document.getElementById("syncBar"); const chip = document.getElementById("syncChip");
  if(!bar || !chip) return;
  clearTimeout(_syncHideT);
  if(kind==="hidden" || !cloud.ready || !activeCloudId()){ bar.classList.add("hidden"); bar.classList.remove("busy"); chip.classList.add("hidden"); return; }
  const M = {
    syncing:{ bg:"#2563eb", icon:"↻", chip:"↻", txt:text||"Синхронизация…" },
    offline:{ bg:"#b45309", icon:"🔴", chip:"⏳", txt:text||"Нет сети — изменения уйдут при подключении" },
    synced: { bg:"#15803d", icon:"✓", chip:"✓", txt:text||"Синхронизировано" },
    error:  { bg:"#b91c1c", icon:"⚠", chip:"⚠", txt:text||"Ошибка синхронизации — повторю" },
  };
  const m = M[kind] || M.syncing;
  bar.style.background = m.bg; bar.textContent = `${m.icon} ${m.txt}`;
  chip.textContent = m.chip; chip.classList.remove("hidden");
  bar.classList.remove("hidden");
  bar.classList.toggle("busy", kind==="syncing");   // анимированный прогресс-бар только при активной синхронизации
  if(kind==="synced"){
    _syncHideT = setTimeout(()=>{ bar.classList.add("hidden"); chip.classList.add("hidden"); }, 1800);
  }
}

async function cloudInit(){
  if(cloud._initDone) return; cloud._initDone = true;   // защита от повторного запуска (дубль listener)
  // авто-пуш/синхронизация при возврате сети
  window.addEventListener("online", async ()=>{
    if((cloud.session || loadCloudSess()) && cloud.basesLoaded!==true){
      // базы не загрузились — продлеваем токен при необходимости и дозагружаем базы
      try{
        let s = loadCloudSess() || cloud.session;
        if(s && s.refresh_token && (!s.expires_at || s.expires_at<=Date.now()+60000)){
          const d = await cloudRefresh(s.refresh_token); saveCloudSess(d); s = loadCloudSess();
        }
        if(s && s.access_token) await cloudOnLogin({ access_token:s.access_token, refresh_token:s.refresh_token, user:s.user });
      }catch(e){ console.warn("online-reload", e); }
      return;
    }
    if(cloud.ready && activeCloudId()){ setSyncStatus("syncing","Сеть появилась — синхронизирую…"); cloudActivate(activeCloudId()); }
    // задачи: до-выгружаем отложенные правки и пере-синкаем (не зависят от базы)
    if(cloud.ready){ if(localStorage.getItem(TASKS_DIRTY)) cloudPushTasksNow().catch(()=>{}); else cloudSyncTasks().catch(()=>{}); }
  });
  window.addEventListener("offline", ()=>{ if(cloud.ready && activeCloudId()) setSyncStatus("offline"); });
  try{
    await ensureSB();   // клиент нужен для realtime/setSession ниже
    let s = loadCloudSess();
    // access-токен живёт ~1ч. Если истёк/истекает в ближайшую минуту — продлеваем ПРЯМЫМ fetch
    // по refresh-токену (не зависим от supabase-клиента, который в standalone мог висеть).
    if(s && s.refresh_token && (!s.expires_at || s.expires_at <= Date.now()+60000)){
      try{
        const d = await Promise.race([ cloudRefresh(s.refresh_token), new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),8000)) ]);
        saveCloudSess(d); s = loadCloudSess();
      }catch(_){ if(cloudOnline()) s = null; }   // онлайн и refresh не прошёл → токен отозван, нужен вход; оффлайн → сессию храним, подтянем при сети
    }
    if(s && s.access_token && s.user && s.user.id){
      hideLoginGate();
      // фоновый setSession — для realtime/autoRefresh; не блокирует восстановление (промис не ждём)
      ensureSB().then(sb=>Promise.race([
        sb.auth.setSession({ access_token:s.access_token, refresh_token:s.refresh_token }),
        new Promise(res=>setTimeout(res,4000))
      ])).catch(()=>{});
      await cloudOnLogin({ access_token:s.access_token, refresh_token:s.refresh_token, user:s.user });
    } else if(!localStorage.getItem("vahtahoz_login_skipped")){
      // нет сохранённой/продлеваемой сессии и не выбрано «без облака» → показываем вход
      showLoginGate();
    } else { hideLoginGate(); }
  }catch(e){ console.warn("cloudInit", e); }
}
/* ---- Полноэкранный логин-гейт ---- */
function showLoginGate(){
  const g = document.getElementById("loginGate"); if(!g) return;
  g.classList.remove("hidden"); g.style.display="flex";  // инлайн display перебивает .hidden — синхронизируем явно
  const go = document.getElementById("lgGo"), skip = document.getElementById("lgSkip"),
        em = document.getElementById("lgEmail"), pw = document.getElementById("lgPwd"),
        err = document.getElementById("lgErr");
  if(!go||!skip) return;
  const doLogin = async ()=>{
    const e=(em.value||"").trim(), p=pw.value||"";
    if(!e||!p){ err.textContent="Введите логин и пароль"; return; }
    go.disabled=true; go.textContent="Вход…"; err.textContent="";
    // бэкенд на бесплатном тарифе может «просыпаться» 20-30с — подсказка, чтобы не выглядело зависшим
    const hint = setTimeout(()=>{ err.textContent="Сервер просыпается, подождите…"; }, 5000);
    const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error("превышено время ожидания сети")),55000));
    try{ await Promise.race([cloudLogin(e,p), timeout]); hideLoginGate(); }
    catch(ex){ go.disabled=false; go.textContent="Войти"; err.textContent="Не удалось войти: "+(ex.message||ex); }
    finally{ clearTimeout(hint); }
  };
  // прямое присваивание (а не addEventListener) — обработчик гарантированно стоит при каждом показе, без дублей
  go.onclick = doLogin;
  pw.onkeydown = ev=>{ if(ev.key==="Enter") doLogin(); };
  skip.onclick = ()=>{ try{ localStorage.setItem("vahtahoz_login_skipped","1"); }catch(_){}; hideLoginGate(); };
  try{ em.focus(); }catch(_){}
}
function hideLoginGate(){
  const g = document.getElementById("loginGate"); if(g){ g.classList.add("hidden"); g.style.display="none"; }  // .hidden не перебьёт инлайн display — гасим явно
}
async function cloudLogin(email, password){
  const sb = await ensureSB();
  // Токен получаем ПРЯМЫМ запросом (быстро, как обычный fetch) — это обходит зависания
  // auth-клиента Supabase на navigator.locks в Safari/standalone-PWA, из-за которых
  // штатный signInWithPassword мог висеть. Таймаут запроса — 35с (бэкенд на free-тарифе
  // может «холодно стартовать» ~20-30с после простоя; короткий таймаут рвал первый вход).
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 35000);
  // логин можно вводить без домена: «worker» → «worker@bazahoz.app»
  let em2 = (email||"").trim();
  if(em2 && !em2.includes("@")) em2 += "@bazahoz.app";
  let d;
  try{
    const r = await fetch(`${CLOUD_CFG.url}/auth/v1/token?grant_type=password`, {
      method:"POST", signal:ctrl.signal,
      headers:{ "apikey":CLOUD_CFG.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ email:em2, password })
    });
    d = await r.json().catch(()=>({}));
    if(!r.ok || !d.access_token) throw new Error(d.error_description || d.msg || "Неверный логин или пароль");
  }catch(e){
    if(e.name==="AbortError") throw new Error("превышено время ожидания сети");
    throw e;
  }finally{ clearTimeout(t); }
  // Токен уже получен — вход СЧИТАЕТСЯ успешным здесь. Дальше идут операции через
  // auth-клиент Supabase (setSession) и PostgREST (sb.from в cloudOnLogin), которые в
  // Safari/standalone-PWA могут подвисать. Их НЕЛЬЗЯ ждать блокирующе, иначе кнопка
  // «Вход…» висит до общего 55-секундного таймаута. Поэтому каждую — со своим таймаутом.
  cloud.session = { access_token:d.access_token, refresh_token:d.refresh_token, user:d.user };
  saveCloudSess(d);   // СИНХРОННО: переживёт reload от cloudAutoLink (один вход, не повторный)
  // setSession (для прав и realtime) — в фоне, не держим кнопку (промис нигде не ждём)
  Promise.race([
    sb.auth.setSession({ access_token:d.access_token, refresh_token:d.refresh_token }),
    new Promise(res=>setTimeout(res,4000))
  ]).catch(e=>console.warn("setSession", e));
  // загрузку профиля/баз ждём, но не дольше 8с — после этого вход всё равно завершается,
  // а cloudOnLogin при необходимости дозагрузит данные в фоне
  await Promise.race([
    cloudOnLogin({ access_token:d.access_token, refresh_token:d.refresh_token, user:d.user }),
    new Promise(res=>setTimeout(res,8000))
  ]);
}
async function cloudOnLogin(session, attempt){
  attempt = attempt||0;
  // SINGLE-FLIGHT загрузки баз: новый цикл (attempt=0 — из online-события, ↻ или повторного входа)
  // НЕ плодит параллельные ретраи поверх уже идущего. Иначе на нестабильной сети online-события
  // множили бы перекрывающиеся цепочки (каждая со сбросом attempt=0) → шторм запросов.
  if(attempt===0){
    if(cloud._basesLoading) return;
    clearTimeout(cloud._basesRetryT);
    cloud._basesLoading = true;
  }
  cloud.session = session;
  await ensureSB(); const uidv = session.user.id;   // клиент нужен для setSession/realtime; запросы ниже — прямым fetch
  try{
    // 3 независимых запроса — ПАРАЛЛЕЛЬНО (последовательно было бы ~3× дольше на медленной сети).
    // Общий таймаут 12с: зависший PostgREST-запрос не должен оставлять загрузку висеть вечно.
    const tok = session.access_token;
    const [prof, mem, bs] = await Promise.race([
      Promise.all([
        cloudRest(`profiles?select=*&id=eq.${encodeURIComponent(uidv)}`, tok),
        cloudRest(`base_members?select=*`, tok),
        cloudRest(`bases?select=id,name`, tok),
      ]),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("превышено время ожидания облака")),25000))   // запас под слабый канал/дальний маршрут
    ]);
    cloud.profile = (Array.isArray(prof) && prof[0]) || { id:uidv, username:session.user.email };
    cloud.members = Array.isArray(mem) ? mem : [];
    cloud.bases = {}; (Array.isArray(bs)?bs:[]).forEach(b=>cloud.bases[b.id]=b.name);
    cloud.ready = true; cloud.basesLoaded = true;   // базы реально получены из облака
    cloud._basesLoading = false; clearTimeout(cloud._basesRetryT);   // цикл загрузки баз завершён успехом
    hideLoginGate();                           // успешный вход — прячем полноэкранный гейт
    try{ localStorage.removeItem("vahtahoz_login_skipped"); }catch(e){}
    const reloaded = await cloudAutoLink();
    if(reloaded) return;                       // switchProfile перезагрузит страницу
    renderHeader(); render();
    toast(`Облако: ${cloud.profile.username||session.user.email}`);
    // Тяжёлую синхронизацию (выгрузка/подтягивание сотен позиций) запускаем В ФОНЕ,
    // НЕ блокируя вход — иначе кнопка «Вход…» висит до конца первой выгрузки.
    const cid = activeCloudId();
    if(cid){ setTimeout(()=>{ cloudActivate(cid).catch(e=>console.warn("bg sync",e)); }, 50); }
    // задачи синкаем отдельно (scope по владельцу, не по базе) — в фоне, не блокируя вход
    setTimeout(()=>{ cloudSyncTasks().catch(e=>console.warn("tasks sync",e)); cloudSubscribeTasks(); }, 80);
  }catch(e){
    console.warn("cloudOnLogin", e);
    // Токен валиден → пользователь АУТЕНТИФИЦИРОВАН, даже если профиль/базы не загрузились
    // (медленная сеть / зависший запрос в standalone-PWA). НЕ показываем «Войти» — помечаем вход
    // состоявшимся с фолбэком и догружаем данные ретраем (4с/8с/12с).
    if(!cloud.profile) cloud.profile = { id:uidv, username:(session.user.email||"").split("@")[0] };
    cloud.ready = true; cloud.basesLoaded = false;   // базы НЕ загрузились
    hideLoginGate();
    try{ localStorage.removeItem("vahtahoz_login_skipped"); }catch(_){}
    renderHeader(); render();
    if(attempt===0) toast("Вход выполнен, загружаю базы…");
    // НАСТОЙЧИВО грузим базы — НЕ оставляем пользователя с «ничего». Пока онлайн — ретраим с backoff,
    // но НЕ бесконечно: после 8 попыток показываем понятный статус с ручным повтором (тап по ↻).
    if(cloudOnline() && attempt < 8){
      setSyncStatus("syncing","Загрузка баз из облака… (попытка "+(attempt+1)+" из 8)");
      const delay = Math.min(3000 + attempt*2000, 20000);   // 3,5,7,… до 20с
      // handle сохраняем → single-flight: новый цикл/online/↻ погасит этот хвост (флаг остаётся — цикл продолжается)
      clearTimeout(cloud._basesRetryT);
      cloud._basesRetryT = setTimeout(()=>{ cloudOnLogin(session, attempt+1).catch(()=>{}); }, delay);
    } else if(cloudOnline()){
      cloud._basesLoading = false;   // 8 попыток исчерпано — цикл закончен, ждём ручной повтор (↻) или online
      setSyncStatus("error","Базы не загрузились (слабая сеть). Нажмите ↻ для повтора");
    } else {
      cloud._basesLoading = false;   // оффлайн — цикл закончен, перезапустится по событию online
      setSyncStatus("offline","Нет сети — базы подтянутся при подключении");
    }
  }
}
async function cloudLogout(){
  try{ if(cloud.channel) await cloud.sb.removeChannel(cloud.channel); }catch(e){}
  try{ if(cloud.tasksChannel) await cloud.sb.removeChannel(cloud.tasksChannel); }catch(e){}   // снимаем и канал задач
  try{ if(cloud.sb) await cloud.sb.auth.signOut(); }catch(e){}   // дожидаемся выхода (был баг приоритета await/&&)
  clearTimeout(cloud.tasksTimer); clearTimeout(cloud.tasksRetry); clearTimeout(cloud.tasksPullTimer);
  // задачи привязаны к аккаунту (owner) — при выходе НЕ оставляем их локально, иначе следующий юзер их увидит/выгрузит
  state.tasks=[]; try{ localStorage.removeItem(TASKS_KEY); localStorage.removeItem(TASKS_DIRTY); }catch(e){}
  cloud.session=null; cloud.profile=null; cloud.members=[]; cloud.channel=null; cloud.subscribedBase=null; cloud.ready=false;
  cloud.tasksChannel=null; cloud.tasksSubUid=null; cloud.tasksBusy=false; cloud.basesLoaded=false;   // сброс задач: иначе после входа другим юзером realtime молчит
  clearCloudSess();   // чистим своё хранилище сессии, иначе при запуске восстановит вход
  // снимаем флаг «без облака» — при следующем запуске снова покажется вход (нет сессии → гейт)
  try{ localStorage.removeItem("vahtahoz_login_skipped"); }catch(e){}
  renderHeader(); render(); toast("Выход из облака");
}
/* привязываем облачные базы к локальным (по имени) или создаём новые; для одной базы — переключаемся */
async function cloudAutoLink(){
  let myBases = cloud.members.map(m=>m.base_id);
  if(cloud.profile && cloud.profile.is_admin){ for(const id in cloud.bases) if(!myBases.includes(id)) myBases.push(id); }
  let changed=false, switchTo=null;
  for(const cid of myBases){
    if(profiles.list.some(x=>x.cloudId===cid)) continue;
    const name = cloud.bases[cid] || "Облачная база";
    const exist = profiles.list.find(x=>!x.cloudId && x.name===name);
    if(exist){
      exist.cloudId=cid; changed=true;
      // НЕ помечаем dirty при авто-привязке: ОБЛАКО — источник истины.
      // Раньше свежезасеянная локальная база метилась «к выгрузке» и при активации
      // ПУШИЛА сид ПОВЕРХ облака (потеря данных после чистки кэша). Теперь:
      //  • облако непусто → cloudActivate сделает PULL (облако победит сид);
      //  • облако пусто → cloudActivate сам выгрузит локальное (cloudEmpty && localHasData);
      //  • реальные офлайн-правки помечаются dirty обычным путём (cloudMaybePush) — не теряются.
    }
    else {
      const id=uid();
      try{ localStorage.setItem(slotKey(id), JSON.stringify(freshProfileState())); }catch(e){}
      profiles.list.push({ id, name, cloudId:cid }); changed=true;
      if(!switchTo) switchTo=id;
    }
  }
  if(changed) saveProfiles(profiles);
  if(switchTo && !activeCloudId()){ switchProfile(switchTo, true); return true; }   // true = автопривязка, в обход роль-гарда
  return false;
}
/* активация облачной базы: первичная выгрузка / подтягивание / разрешение оффлайн-правок */
async function cloudActivate(cid, attempt){
  attempt = attempt||0;
  if(!cid || !cloud.ready) return;
  if(!cloudOnline()){ setSyncStatus("offline"); return; }
  if(cloud.busy) return;          // уже идёт синхронизация/диалог конфликта — второй заход НЕ запускаем
  cloud.busy=true;                // ставим ДО await: иначе pull во время открытого диалога конфликта затёр бы локальное
  await ensureSB(); const perm = activeMember();
  setSyncStatus("syncing","Проверка облака…");
  try{
    const dirty = localStorage.getItem(cloudDirtyKey(cid));
    // count через прямой fetch (не sb.from — он висел в standalone). cloudRest кинет исключение при ошибке.
    const tok = cloud.session && cloud.session.access_token;
    const cIds = await cloudRest(`stock_items?select=id&base_id=eq.${encodeURIComponent(cid)}&limit=1`, tok, {timeout:45000});   // нужно лишь «пусто ли облако» → 1 строка (а не сотни), на слабом интернете не рвётся
    const cloudEmpty = !(Array.isArray(cIds) && cIds.length);
    // решение «выгружать» — по складу/журналам (задачи не синкаются и тут не учитываются)
    const localHasData = (state.stock&&state.stock.length) ||
      JOURNAL_KEYS.some(k=>(state.journals?.[k]||[]).length);
    // КОНФЛИКТ «Войти позже → Войти»: в локальной базе есть данные И в облаке есть данные,
    // и база ещё ни разу не синхронизировалась (нет снимка). Раньше тихо делали PULL —
    // локальная офлайн-работа терялась. Теперь спрашиваем, без молчаливой потери.
    const neverSynced = !Object.keys(loadSyncSig(cid,"stock")).length && !Object.keys(loadSyncSig(cid,"jr")).length;
    cloud._conflictAsked = cloud._conflictAsked || {};
    if(!dirty && !cloudEmpty && localHasData && neverSynced && perm && perm.can_edit_stock && !cloud._conflictAsked[cid]){
      cloud._conflictAsked[cid] = true;
      const choice = await chooseSheet(
        `База «${cloud.bases[cid]||"облачная"}»: есть и локальные данные, и данные в облаке. Что оставить?`,
        [ { label:"Облачные (локальные сохраню копией)", value:"cloud", color:"btn-primary" },
          { label:"Мои локальные (выгрузить в облако)", value:"local", color:"btn-danger" } ]);
      if(choice==="local"){
        saveSyncSig(cid,"stock",{}); saveSyncSig(cid,"jr",{});   // локальное — источник: полная выгрузка поверх облака
        await cloudPushNow();
        return;
      }
      // "Облачные" ИЛИ отмена → НЕ теряем локальное: сохраняем его отдельной локальной базой, затем тянем облако
      try{
        const raw = localStorage.getItem(STORE_KEY);
        if(raw){
          const bkId = uid();
          localStorage.setItem(slotKey(bkId), raw);
          profiles.list.push({ id:bkId, name: cleanName40((cloud.bases[cid]||"База")+" (локальная копия)") });
          saveProfiles(profiles);
          toast("Локальные данные сохранены копией");
        }
      }catch(_){}
      await cloudPull(cid);
      return;
    }
    if((dirty || (cloudEmpty && localHasData)) && perm && perm.can_edit_stock){
      // локальное — источник (первый раз или были оффлайн-правки).
      // dirty снимает САМ cloudPushNow и ТОЛЬКО при успехе — здесь снимать нельзя,
      // иначе при сбое выгрузки маркер «не синхронизировано» потеряется и pull затрёт правки.
      if(cloudEmpty){ saveSyncSig(cid,"stock",{}); saveSyncSig(cid,"jr",{}); }   // облако пусто → ПОЛНАЯ выгрузка (дельта против пустого снимка = всё)
      await cloudPushNow();
    } else {
      await cloudPull(cid);
    }
  }catch(e){
    console.warn("cloudActivate", e); setSyncStatus("error", "Синк: "+(e.message||e).toString().slice(0,60));
    // транзиентная ошибка (сессия не успела зарегистрироваться и т.п.) → повтор с backoff, чтобы синк состоялся
    if(cloudOnline() && attempt < 6) setTimeout(()=>{ cloudActivate(cid, attempt+1).catch(()=>{}); }, Math.min(3000+attempt*2000, 15000));
  }
  finally{ cloud.busy=false; cloudSubscribe(cid); }
}
async function cloudPull(cid){
  if(!cid || !cloudOnline()) return;
  // защита: не затирать НЕсинхронизированные локальные правки облачными данными
  if(cloud.pushPending || localStorage.getItem(cloudDirtyKey(cid))){ cloudMaybePush(); return; }
  const perm = activeMember();
  cloud.applying=true;
  setSyncStatus("syncing","Загрузка из облака…");
  try{
    // ПРЯМОЙ fetch с токеном (cloudRest) — не зависит от регистрации сессии в supabase-клиенте,
    // который в iOS standalone-PWA мог ВИСНУТЬ без таймаута («Загрузка из облака» навсегда).
    // cloudRest кидает исключение при ошибке/таймауте → попадём в catch и НЕ затрём локальное пустым.
    const tok = cloud.session && cloud.session.access_token;
    const items = await cloudRest(`stock_items?select=*&base_id=eq.${encodeURIComponent(cid)}`, tok, {timeout:90000});  // тяжёлый — большой запас под слабую сеть/полевые условия
    const jr    = await cloudRest(`journal_entries?select=*&base_id=eq.${encodeURIComponent(cid)}`, tok, {timeout:60000});
    const baseArr = await cloudRest(`bases?select=settings&id=eq.${encodeURIComponent(cid)}`, tok);
    const base = Array.isArray(baseArr) ? baseArr[0] : null;
    // ЗАЩИТА ОТ ГОНКИ: пока шла загрузка (долгие await выше), пользователь мог
    // успеть отредактировать данные → cloudMaybePush уже выставил dirty. НЕ затираем
    // его правку облачными данными — выходим, finally до-выгрузит локальное (push).
    if(localStorage.getItem(cloudDirtyKey(cid))){
      setSyncStatus("syncing","Локальные правки — выгружаю");
      return;
    }
    // ошибок нет → применяем (только теперь перезаписываем локальные данные)
    // id из БД проходят safeId (защита inline-onclick на случай порчи данных в облаке)
    state.stock = (items||[]).map(rowToStock).map(s=>{
      s.id = safeId(s.id);
      if(Array.isArray(s.batches)) s.batches.forEach(b=>{ if(b) b.id = safeId(b.id); });
      return s;
    });
    const J=emptyJournals();
    (jr||[]).forEach(r=>{ if(J[r.kind]) J[r.kind].push({ ...(r.data||{}), id:safeId(r.id) }); });
    for(const k in J) J[k].sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
    state.journals = J;
    // ЗАДАЧИ НЕ ТЯНЕМ из облака — они общие-локальные (одно расписание на все базы),
    // не зависят от базы и не видны начальнику. state.tasks остаётся как есть (из loadGlobalTasks).
    if(base && base.settings){
      // санитайзим имена из облака (их мог задать любой участник с edit_stock) — как при локальной загрузке
      ensureTomb();
      const clean = uniqClean;
      const cs = base.settings;
      for(const k of STOCK_TYPE_KEYS){
        // надгробия из облака — источник; вычитаем их из применяемых списков (удаление распространилось)
        const tL = Array.isArray(cs.deletedLocations?.[k]) ? clean(cs.deletedLocations[k]) : [];
        const tC = Array.isArray(cs.deletedCategories?.[k]) ? clean(cs.deletedCategories[k]) : [];
        state.delLoc[k]=tL; state.delCat[k]=tC;
        if(Array.isArray(cs.locations?.[k]) && cs.locations[k].length) state.locations[k]=applyTomb(clean(cs.locations[k]), tL);
        else if(tL.length) state.locations[k]=applyTomb(state.locations[k]||[], tL);   // надгробия применяем даже при пустом облачном списке (иначе удаление не вступит в силу в этой сессии)
        if(Array.isArray(cs.categories?.[k]) && cs.categories[k].length) state.categories[k]=applyTomb(clean(cs.categories[k]), tC);
        else if(tC.length) state.categories[k]=applyTomb(state.categories[k]||[], tC);
      }
      // подпись настроек = только что загруженное → не будем зря пере-выгружать на следующем push
      try{ saveSyncSig(cid,"settings",{ v:_sigOf({ locations:state.locations, categories:state.categories, deletedLocations:state.delLoc, deletedCategories:state.delCat }) }); }catch(_){}
    }
    saveState();                              // cloud.applying=true → push не сработает (без эха)
    // снимок подписей = только что загруженное из облака → следующий push пойдёт ДЕЛЬТОЙ (не вся база)
    try{
      const stSig={}; state.stock.forEach(s=>{ stSig[s.id]=_sigOf(stockToRow(s,cid)); });
      saveSyncSig(cid,"stock",stSig);
      const jSig={}; for(const k of JOURNAL_KEYS) for(const op of (state.journals[k]||[])) jSig[op.id]=_sigOf({kind:k,data:op});
      saveSyncSig(cid,"jr",jSig);
    }catch(_){}
    setSyncStatus("synced","Загружено из облака");
  }catch(e){
    console.warn("cloudPull", e);
    setSyncStatus("error", "Не загрузилось: "+(e.message||e).toString().slice(0,60));
    // слабая сеть/таймаут → повторим (мягкий backoff), пока онлайн
    if(cloudOnline()) setTimeout(()=>{ if(!cloud.busy && activeCloudId()===cid) cloudPull(cid).catch(()=>{}); }, 8000);  // не тянуть базу, если за время ожидания сменили профиль
  }
  finally{
    cloud.applying=false;
    // если во время загрузки появилась несинхронизированная правка — до-выгружаем её
    if(localStorage.getItem(cloudDirtyKey(cid))) cloudMaybePush();
    render();
  }
}
function cloudMaybePush(){
  if(!cloud.ready) return;
  const cid = activeCloudId(); if(!cid) return;
  // помечаем «не синхронизировано» СРАЗУ — флаг снимется только после успешной выгрузки.
  // Так переключение базы/перезагрузка не теряет отложенные правки: при возврате
  // cloudActivate увидит dirty и выгрузит локальное, а не затрёт его pull-ом.
  // ВАЖНО: dirty ставим ДО проверки cloud.applying — если прямо сейчас идёт cloudPull,
  // правка пользователя в это окно иначе осталась бы непомеченной и была бы затёрта.
  try{ localStorage.setItem(cloudDirtyKey(cid),"1"); }catch(e){}
  if(cloud.applying) return;   // идёт pull — он сам увидит dirty, НЕ затрёт правку и до-выгрузит её
  if(!cloudOnline()){ setSyncStatus("offline"); return; }   // ждём сеть — уйдёт по событию "online"
  cloud.pushPending = true;                  // есть ожидающая выгрузка — realtime-pull её не затрёт
  setSyncStatus("syncing","Сохранение в облако…");
  clearTimeout(cloud.pushTimer);
  cloud.pushTimer = setTimeout(()=>cloudPushNow(), 600);
}
// --- ДЕЛЬТА-СИНХРОНИЗАЦИЯ: шлём только изменённые/удалённые строки, прямым fetch ---
// стабильная подпись строки (порядок ключей не важен) — для сравнения «изменилось ли»
function _stableStr(o){
  if(Array.isArray(o)) return "["+o.map(_stableStr).join(",")+"]";
  if(o && typeof o==="object") return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+_stableStr(o[k])).join(",")+"}";
  return JSON.stringify(o);
}
function _sigOf(obj){ const s=_stableStr(obj); let h1=0x811c9dc5, h2=0; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=(h1^c)>>>0; h1=Math.imul(h1,0x01000193)>>>0; h2=(h2*131+c)|0; } return h1.toString(36)+h2.toString(36)+":"+s.length; }
function loadSyncSig(cid, kind){ try{ return JSON.parse(localStorage.getItem(`vahtahoz_sig_${kind}_${cid}`)||"{}"); }catch(_){ return {}; } }
function saveSyncSig(cid, kind, map){ try{ localStorage.setItem(`vahtahoz_sig_${kind}_${cid}`, JSON.stringify(map)); }catch(_){} }
// ОБЪЕДИНЕНИЕ настроек (места/категории) с облаком — union списков по каждому типу.
// Так одновременная выгрузка двух устройств НЕ затирает чужие добавления (последний-победил
// заменился бы на сложение). Удаление РАСПРОСТРАНЯЕТСЯ через надгробия (deletedLocations/Categories):
// union имён минус актуальные надгробия. Повторное добавление имени снимает надгробие (revive).
function mergeSettings(cloudSet, localSet){
  const out={ locations:{}, categories:{}, deletedLocations:{}, deletedCategories:{} };
  const u = unionClean;
  for(const k of STOCK_TYPE_KEYS){
    const lLoc=(localSet.locations&&localSet.locations[k])||[], lCat=(localSet.categories&&localSet.categories[k])||[];
    // надгробия объединяем, НО имя, присутствующее в локальном списке (т.е. заново добавленное),
    // из надгробий исключаем — иначе повторное добавление удалённого имени не приживалось бы.
    const tL=u(cloudSet.deletedLocations&&cloudSet.deletedLocations[k], localSet.deletedLocations&&localSet.deletedLocations[k]).filter(n=>!lLoc.includes(n));
    const tC=u(cloudSet.deletedCategories&&cloudSet.deletedCategories[k], localSet.deletedCategories&&localSet.deletedCategories[k]).filter(n=>!lCat.includes(n));
    out.deletedLocations[k]=tL; out.deletedCategories[k]=tC;
    // из union'а имён вычитаем актуальные надгробия → удаление распространяется, имя не воскресает
    out.locations[k]=applyTomb(u(cloudSet.locations&&cloudSet.locations[k], lLoc), tL);
    out.categories[k]=applyTomb(u(cloudSet.categories&&cloudSet.categories[k], lCat), tC);
  }
  return out;
}
// upsert пачками прямым fetch (merge по первичному ключу id)
async function cloudRestUpsert(table, rows, tok, onProgress){
  const size=100;
  for(let i=0;i<rows.length;i+=size){
    await cloudRest(table, tok, { method:"POST", returnResponse:true, timeout:60000,
      headers:{ "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows.slice(i,i+size)) });
    if(onProgress) onProgress(Math.min(i+size,rows.length), rows.length);
  }
}
// удаление пачками прямым fetch (id=in.(...))
async function cloudRestDelete(table, ids, tok){
  const size=100;
  for(let i=0;i<ids.length;i+=size){
    const inList = ids.slice(i,i+size).map(id=>encodeURIComponent(id)).join(",");
    await cloudRest(`${table}?id=in.(${inList})`, tok, { method:"DELETE", returnResponse:true, timeout:45000, headers:{ "Prefer":"return=minimal" } });
  }
}
async function cloudPushNow(){
  const cid = activeCloudId();
  // на раннем выходе снимаем pushPending (dirty остаётся durable-маркером несинхронизации)
  if(!cid || !cloud.ready || cloud.applying || !cloudOnline()){ cloud.pushPending=false; return; }
  const perm = activeMember(); if(!perm){ cloud.pushPending=false; return; }
  await ensureSB(); cloud.busy=true;
  try{
    const tok = cloud.session && cloud.session.access_token;
    if(perm.can_edit_stock){
      // === СКЛАД (ДЕЛЬТА: только изменённые/удалённые позиции, прямым fetch) ===
      const rows = state.stock.map(s=>stockToRow(s,cid));
      const curSig = {}; rows.forEach(r=>{ curSig[r.id]=_sigOf(r); });
      const prevSig = loadSyncSig(cid,"stock");
      const prevCount = Object.keys(prevSig).length;
      // ЗАЩИТА: пустой ИЛИ подозрительно усохший локальный склад НЕ стирает облако.
      // Если осталось <10% от снимка (а снимок крупный) — это похоже на порчу слота,
      // а не на осознанное удаление → пропускаем ВСЮ выгрузку склада (cloud цел, восстановится pull-ом).
      const suspectWipe = prevCount>=20 && rows.length < prevCount*0.1;
      if((rows.length===0 || suspectWipe) && prevCount>0){
        console.warn("cloudPush: склад подозрительно мал ("+rows.length+" из "+prevCount+") — выгрузка склада пропущена (защита от порчи)");
      } else {
        const upsert = rows.filter(r=> curSig[r.id] !== prevSig[r.id]);   // новое/изменённое
        const del = Object.keys(prevSig).filter(id=> !(id in curSig));    // удалённое локально
        if(del.length) await cloudRestDelete("stock_items", del, tok);
        if(upsert.length) await cloudRestUpsert("stock_items", upsert, tok, (d,t)=>{ if(t>20) setSyncStatus("syncing",`Выгрузка ${d}/${t}`); });
        saveSyncSig(cid,"stock",curSig);   // снимок = текущее (следующий push будет дельтой)
        // === НАСТРОЙКИ (места/категории) — СВОЯ дельта, НЕ на каждое изменение склада ===
        // Шлём ТОЛЬКО если списки реально менялись (иначе смена количества зря переписывала
        // блоб и могла затереть чужие правки). При выгрузке ОБЪЕДИНЯЕМ с облаком (union) —
        // одновременная выгрузка двух устройств не теряет добавления ни одного из них.
        ensureTomb();
        const setObj={ locations:state.locations, categories:state.categories, deletedLocations:state.delLoc, deletedCategories:state.delCat };
        const setSig=_sigOf(setObj);
        const prevSet=loadSyncSig(cid,"settings");
        if(setSig !== prevSet.v){
          try{
            const cur=await cloudRest(`bases?select=settings&id=eq.${encodeURIComponent(cid)}`, tok);
            const cloudSet=(Array.isArray(cur)&&cur[0]&&cur[0].settings)||{};
            const merged=mergeSettings(cloudSet, setObj);
            await cloudRest(`bases?id=eq.${encodeURIComponent(cid)}`, tok, { method:"PATCH", returnResponse:true,
              headers:{ "Content-Type":"application/json", "Prefer":"return=minimal" },
              body: JSON.stringify({ settings: merged }) });
            // в облако ушёл merged (объединение). Применяем его И локально, чтобы локальное == облако,
            // и сохраняем подпись MERGED. Иначе локальная подпись (≠ merged) расходится с облаком →
            // следующий push снова считает настройки «изменёнными» и шлёт PATCH каждый раз (лишний трафик).
            state.locations=merged.locations; state.categories=merged.categories;
            state.delLoc=merged.deletedLocations; state.delCat=merged.deletedCategories;
            saveSyncSig(cid,"settings",{ v:_sigOf(merged) });
          }catch(e){ console.warn("settings push", e); }
        }
      }
      // === ЖУРНАЛЫ (дельта upsert; удаление — только явное, под порогом архива) ===
      const jrows=[]; const curJSig={};
      for(const k of JOURNAL_KEYS) for(const op of (state.journals?.[k]||[])){ jrows.push({id:op.id,base_id:cid,kind:k,data:op}); curJSig[op.id]=_sigOf({kind:k,data:op}); }
      const prevJSig = loadSyncSig(cid,"jr");
      if(!(jrows.length===0 && Object.keys(prevJSig).length>0)){
        const jup = jrows.filter(r=> curJSig[r.id]!==prevJSig[r.id]);
        // ЖУРНАЛЫ НЕ УДАЛЯЕМ из облака вообще: облачный журнал — полный архив,
        // а локальный усекается по квоте localStorage (slice(0,500) — свежие 500 — при QuotaExceeded).
        // Любое локальное «исчезновение» записи (усечение ИЛИ ручное удаление) НЕ должно
        // стирать запись из облачного архива. Записи журнала append-only, у каждой уникальный id —
        // повторного появления при pull это не вызовет конфликтов. Только добавляем/обновляем.
        if(jup.length) await cloudRestUpsert("journal_entries", jup, tok);
        saveSyncSig(cid,"jr",curJSig);
      }
    }
    // ЗАДАЧИ НЕ ВЫГРУЖАЕМ — они общие-локальные (одно расписание на все базы устройства).
    try{ localStorage.removeItem(cloudDirtyKey(cid)); }catch(e){}
    setSyncStatus("synced");
  }catch(e){
    console.warn("cloudPushNow", e);
    if(!cloudOnline()){ setSyncStatus("offline"); }   // ждём сеть → событие "online" доpush-ит
    else {
      setSyncStatus("error");
      // транзиентная ошибка — авто-повтор пока есть несинхронизированное и сеть
      clearTimeout(cloud.retryTimer);
      cloud.retryTimer = setTimeout(()=>{ if(localStorage.getItem(cloudDirtyKey(activeCloudId()))) cloudPushNow(); }, 6000);
    }
  }
  finally{ cloud.busy=false; cloud.pushPending=false; }
}
// ===================== ЗАДАЧИ В ОБЛАКЕ (scope по владельцу, не по базе) =====================
// Задачи — ОБЩИЕ для всех баз устройства (одно расписание у хоза). В облаке хранятся
// в таблице tasks, привязанной к owner_id = uid пользователя (RLS: видишь только свои).
// Не зависят от активной базы; синкаются отдельно от склада/журналов. Дельта, как у склада.
const TASKS_DIRTY = "vahtahoz_tasks_dirty";
const TASKS_OWNER = "vahtahoz_tasks_owner";   // uid владельца локальных задач — защита от утечки при смене аккаунта на устройстве
function activeUid(){ return (cloud.session && cloud.session.user && cloud.session.user.id) || null; }
function _tasksSigMap(){ const m={}; for(const t of (state.tasks||[])){ if(t && t.id!=null) m[String(t.id)]=_sigOf({data:t}); } return m; }
function tasksChangedVsCloud(uid){
  const cur=_tasksSigMap(); const prev=loadSyncSig(uid,"tasks");
  const ck=Object.keys(cur), pk=Object.keys(prev);
  if(ck.length!==pk.length) return true;
  for(const k of ck){ if(cur[k]!==prev[k]) return true; }
  return false;
}
// помечаем задачи к выгрузке и планируем push — но ТОЛЬКО при реальном изменении задач
// (saveGlobalTasks зовётся на каждом saveState, в т.ч. при правках склада — там задачи не менялись)
function cloudMaybePushTasks(){
  if(!cloud.ready) return;
  const uid=activeUid(); if(!uid) return;
  if(!tasksChangedVsCloud(uid)) return;       // задачи не изменились — тихо выходим
  try{ localStorage.setItem(TASKS_DIRTY,"1"); }catch(e){}
  if(!cloudOnline()) return;                   // уйдёт по событию online
  clearTimeout(cloud.tasksTimer);
  cloud.tasksTimer=setTimeout(()=>cloudPushTasksNow(), 700);
}
async function cloudPushTasksNow(){
  const uid=activeUid(); if(!uid || !cloud.ready || !cloudOnline()) return;
  cloud.tasksBusy=true;                       // своя выгрузка идёт — realtime-эхо не должно дёргать pull
  try{
    const tok=cloud.session.access_token;
    const rows=(state.tasks||[]).filter(t=>t&&t.id!=null).map(t=>({ id:String(t.id), owner_id:uid, data:t }));
    const curSig={}; rows.forEach(r=>{ curSig[r.id]=_sigOf({data:r.data}); });
    const prevSig=loadSyncSig(uid,"tasks");
    const upsert=rows.filter(r=> curSig[r.id]!==prevSig[r.id]);
    const del=Object.keys(prevSig).filter(id=> !(id in curSig));
    // ЗАЩИТА: пустой локальный список НЕ стирает облако (порча слота / частичная загрузка),
    // как у склада. Если задач реально 0, удаление не шлём — облако переживёт, восстановится pull-ом.
    if(del.length && rows.length>0) await cloudRestDelete("tasks", del, tok);
    if(upsert.length) await cloudRestUpsert("tasks", upsert, tok);
    saveSyncSig(uid,"tasks",curSig);
    try{ localStorage.removeItem(TASKS_DIRTY); localStorage.setItem(TASKS_OWNER, uid); }catch(e){}
  }catch(e){
    console.warn("cloudPushTasks", e);
    if(cloudOnline()){ clearTimeout(cloud.tasksRetry); cloud.tasksRetry=setTimeout(()=>{ if(localStorage.getItem(TASKS_DIRTY)) cloudPushTasksNow(); }, 6000); }
  }
  finally{ cloud.tasksBusy=false; }
}
async function cloudPullTasks(){
  const uid=activeUid(); if(!uid || !cloudOnline()) return;
  if(localStorage.getItem(TASKS_DIRTY)){ cloudMaybePushTasks(); return; }   // есть несинхр. правки — не затираем
  try{
    const tok=cloud.session.access_token;
    const rows=await cloudRest(`tasks?select=*&owner_id=eq.${encodeURIComponent(uid)}`, tok, {timeout:30000});
    if(localStorage.getItem(TASKS_DIRTY)) return;                            // успел отредактировать во время загрузки → не затираем
    // САНИТАЙЗ: id задачи И id пунктов чек-листа — оба идут из облака (jsonb от любого участника)
    // и подставляются в inline-onclick (toggleTaskItem). Без safeId на items[].id — XSS-вектор.
    state.tasks=(rows||[]).map(r=>{
      const t={ ...(r.data||{}), id:safeId(r.id) };
      if(Array.isArray(t.items)) t.items=t.items.map(i=>({ id:safeId(i&&i.id), text:String((i&&i.text)||"").slice(0,200), done:!!(i&&i.done) }));
      return t;
    });
    sanitizeIds(state.tasks);
    try{ localStorage.setItem(TASKS_KEY, JSON.stringify(state.tasks)); }catch(e){}   // прямо в localStorage, БЕЗ повторного push
    saveSyncSig(uid,"tasks",_tasksSigMap());
    try{ localStorage.setItem(TASKS_OWNER, uid); }catch(e){}
    if(currentView==="tasks") render();
  }catch(e){ console.warn("cloudPullTasks", e); }
}
// решает: выгрузить локальные задачи (первая миграция) или подтянуть облачные (восстановление)
async function cloudSyncTasks(){
  const uid=activeUid(); if(!uid || !cloudOnline()) return;
  if(localStorage.getItem(TASKS_DIRTY)){ cloudMaybePushTasks(); return; }
  // ЗАЩИТА ОТ УТЕЧКИ: если локальные задачи принадлежат ДРУГОМУ пользователю (вход другим аккаунтом
  // на этом устройстве) — чистим их, чтобы не выгрузить чужие задачи в облако текущего юзера.
  const owner=localStorage.getItem(TASKS_OWNER);
  if(owner && owner!==uid){
    state.tasks=[]; try{ localStorage.setItem(TASKS_KEY,"[]"); }catch(_){}
    saveSyncSig(uid,"tasks",{});
    if(currentView==="tasks") render();
  }
  try{
    const tok=cloud.session.access_token;
    const ids=await cloudRest(`tasks?select=id&owner_id=eq.${encodeURIComponent(uid)}`, tok);
    const cloudEmpty=!(Array.isArray(ids)&&ids.length);
    const localHas=(state.tasks||[]).length>0;
    const neverSynced=Object.keys(loadSyncSig(uid,"tasks")).length===0;
    if(cloudEmpty && localHas && neverSynced){
      // первый раз: облако пусто, локально есть задачи → выгружаем (НЕ затираем локальное!)
      saveSyncSig(uid,"tasks",{});            // дельта против пустого снимка = всё
      await cloudPushTasksNow();
    } else {
      await cloudPullTasks();                  // облачные задачи — источник (в т.ч. после чистки кэша)
    }
  }catch(e){ console.warn("cloudSyncTasks", e); }
}
/* realtime: на любое изменение в облаке — отложенный пере-pull активной базы */
function cloudSubscribe(cid){
  if(!cid || cloud.subscribedBase===cid) return;
  cloudUnsubscribe();
  try{
    const sb = cloud.sb;
    cloud.channel = sb.channel("base-"+cid)
      .on("postgres_changes",{event:"*",schema:"public",table:"stock_items",filter:"base_id=eq."+cid}, cloudOnRemote)
      .on("postgres_changes",{event:"*",schema:"public",table:"journal_entries",filter:"base_id=eq."+cid}, cloudOnRemote)
      .subscribe();
    cloud.subscribedBase = cid;
  }catch(e){ console.warn("cloudSubscribe", e); }
}
function cloudUnsubscribe(){
  try{ if(cloud.channel) cloud.sb.removeChannel(cloud.channel); }catch(e){}
  cloud.channel=null; cloud.subscribedBase=null;
}
// realtime для задач — отдельный канал по владельцу (не зависит от активной базы, не пересоздаётся при смене базы)
function cloudSubscribeTasks(){
  const uid=activeUid(); if(!uid || cloud.tasksSubUid===uid) return;
  try{
    if(cloud.tasksChannel) cloud.sb.removeChannel(cloud.tasksChannel);
    cloud.tasksChannel = cloud.sb.channel("tasks-"+uid)
      .on("postgres_changes",{event:"*",schema:"public",table:"tasks",filter:"owner_id=eq."+uid}, ()=>{
        clearTimeout(cloud.tasksPullTimer);
        if(cloud.tasksBusy) return;                                              // эхо собственной выгрузки — игнор
        if(localStorage.getItem(TASKS_DIRTY)){ cloudMaybePushTasks(); return; }   // свои правки важнее — не затираем
        cloud.tasksPullTimer=setTimeout(()=>cloudPullTasks(), 400);
      })
      .subscribe();
    cloud.tasksSubUid=uid;
  }catch(e){ console.warn("cloudSubscribeTasks", e); }
}
function cloudOnRemote(){
  clearTimeout(cloud.pullTimer);               // всегда гасим прежний отложенный pull, иначе он сработает после dirty и затрёт правки
  if(cloud.busy || cloud.pushPending) return;  // идёт/ждёт наша выгрузка — pull её не затрёт
  // есть несинхронизированные локальные правки → не тянем (затёрли бы своё); сначала выгрузим их
  const cid0 = activeCloudId();
  if(cid0 && localStorage.getItem(cloudDirtyKey(cid0))){ cloudMaybePush(); return; }
  cloud.pullTimer = setTimeout(()=>{ const cid=activeCloudId(); if(cid) cloudPull(cid); }, 400);
}

(function seedFromEmbedded(){
  if(state.seededAt) return;                 // уже сидили (в т.ч. после wipeAll)
  if(state.stock && state.stock.length) { state.seededAt = new Date().toISOString(); saveState(); return; }
  const el = document.getElementById("seedData");
  if(!el) return;
  try{
    const seed = JSON.parse(el.textContent);
    if(seed.categories){
      for(const k of STOCK_TYPE_KEYS){
        state.categories[k] = Array.from(new Set([...(state.categories[k]||[]), ...(seed.categories[k]||[])]));
      }
    }
    state.stock = (seed.stock||[]).map(s=>({ ...s, id: safeId(s.id) }));
    if(Array.isArray(seed.tasks) && seed.tasks.length && !(state.tasks||[]).length){
      // активным задачам ставим СЕГОДНЯШНЮЮ дату установки — иначе фиксированная дата из seed
      // на свежей установке показалась бы просроченной
      state.tasks = seed.tasks.map(t=>({
        ...t,
        id: safeId(t.id),
        due: (!t.done && t.due) ? todayStr() : t.due,
        items: Array.isArray(t.items) ? t.items.map(i=>({ id: safeId(i.id), text: String(i.text||"").slice(0,200), done: !!i.done })) : undefined,
      }));
    }
    state.seededAt = new Date().toISOString();
    saveState();
    setTimeout(()=>toast(`Загружено ${state.stock.length} позиций`), 300);
  }catch(e){ console.warn("seed failed",e); }
})();

/* Многовкладочность: если другая вкладка сохранила состояние — подтягиваем его,

window.addEventListener("storage", (e)=>{
  // переключение базы в другой вкладке — пересинхронизируем метаданные профилей
  if(e.key===PROFILES_KEY && e.newValue){
    const p = loadProfiles();
    if(p){ profiles = p; renderHeader(); }
    return;
  }
  if(e.key===TASKS_KEY && e.newValue){
    // общие задачи изменились в другой вкладке/базе
    try{ loadGlobalTasks(); if(currentView==="tasks") render(); }catch(err){}
    return;
  }
  if(e.key===STORE_KEY && e.newValue){
    try{
      state = loadState();
      loadGlobalTasks();                 // задачи общие — накладываем поверх per-base
      applyTheme(); render();
      toast("Данные обновлены в другой вкладке");
    }catch(err){ console.warn("storage sync failed", err); }
  }
});
