name: geofield-ipa

permissions:
  contents: read

# Неподписанный .ipa для ручной подписи (ESign/AltStore): iOS собирается
# только на macOS, поэтому отдельный workflow на macos-раннере.
# Запуск: вручную (workflow_dispatch) или пуш, трогающий iOS-каркас.
on:
  workflow_dispatch:
  push:
    paths:
      - 'geofield/app/ios/**'
      - '.github/workflows/geofield-ipa.yml'

jobs:
  ipa:
    name: unsigned .ipa (flutter build ios --no-codesign)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: geofield/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      # .ipa = zip с Payload/Runner.app внутри. Подпись — на стороне
      # пользователя (ESign перезапишет bundle id и подпись своими).
      - name: Package unsigned ipa
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry GeoField-unsigned.ipa Payload
          ls -la GeoField-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: GeoField-unsigned-ipa
          path: geofield/app/build/ios/ipa/GeoField-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
