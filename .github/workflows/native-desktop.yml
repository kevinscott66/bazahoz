name: Build Desktop
on:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
          - platform: ubuntu-22.04
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential file
      - name: Install npm deps
        working-directory: native-desktop
        run: npm install
      - name: Build (Tauri)
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: native-desktop
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: vahtahoz-desktop-${{ matrix.platform }}
          path: |
            native-desktop/src-tauri/target/release/bundle/**/*.dmg
            native-desktop/src-tauri/target/release/bundle/**/*.app
            native-desktop/src-tauri/target/release/bundle/**/*.deb
            native-desktop/src-tauri/target/release/bundle/**/*.AppImage
            native-desktop/src-tauri/target/release/bundle/**/*.rpm
            native-desktop/src-tauri/target/release/bundle/**/*.msi
            native-desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
