name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read

# Собираем ПОДПИСАННЫЙ release-APK — его владелец раздаёт людям на вахту.
# Проект native/android/ лежит в репозитории (там наш MainActivity с обработчиком
# скачивания файлов), поэтому `npx cap add android` больше НЕ вызывается: он бы
# перетёр наш код свежим шаблоном. Достаточно `npx cap sync android` — она
# доносит www/, capacitor.config.json и нативные зависимости плагинов.
#
# Секреты для подписи (владелец добавляет руками в Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   — файл ключа .jks, закодированный в base64
#   ANDROID_KEYSTORE_PASSWORD — пароль хранилища
#   ANDROID_KEY_ALIAS         — псевдоним ключа (например vahtahoz)
#   ANDROID_KEY_PASSWORD      — пароль ключа (обычно тот же, что у хранилища)
# Если их нет — сборка НЕ падает, а выдаёт debug-APK с именем, которое невозможно
# спутать с рабочим.

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Кэш Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('native/android/**/*.gradle', 'native/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Номер версии
        id: version
        run: |
          CODE="${{ github.run_number }}"
          REF="${GITHUB_REF#refs/tags/}"
          if [ "${GITHUB_REF}" != "${REF}" ] && [ -n "$REF" ]; then
            NAME="${REF#v}"
          else
            NAME="1.0.${CODE}"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Версия: $NAME (versionCode $CODE)"

      - name: Ключ подписи
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Все четыре секрета нужны вместе. Раньше ветку «релиз» выбирал ОДИН секрет с ключом,
            # а остальные три проверялись только тем, что gradle на них споткнётся. Проверяем сразу:
            # непонятная ошибка на шаге сборки хуже понятной на шаге подготовки.
            for pair in "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" "ANDROID_KEY_ALIAS=$KEY_ALIAS" "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"; do
              if [ -z "${pair#*=}" ]; then
                echo "::error::Секрет ${pair%%=*} пуст, а ANDROID_KEYSTORE_BASE64 задан — подписать нечем"
                exit 1
              fi
            done
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/vahtahoz.jks"
            if [ ! -s "$RUNNER_TEMP/vahtahoz.jks" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 задан, но раскодировался в пустой файл — проверьте base64"
              exit 1
            fi
            echo "path=$RUNNER_TEMP/vahtahoz.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Ключ подписи получен — собираем release."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секрета ANDROID_KEYSTORE_BASE64 нет — будет собран DEBUG-APK, раздавать его людям нельзя."
          fi

      - name: Зависимости Capacitor
        working-directory: native
        run: npm ci

      # Оболочка едет ВНУТРИ файла: без этого шага в приложении окажется пустой каталог
      # www, и оно не откроется вовсе. Раньше внутри лежала заглушка на 340 байт, а сам
      # рабочий стол грузился с сайта при каждом запуске — отсюда и брался «нет сети —
      # нет запуска». Порядок важен: cap sync копирует www в assets/public, поэтому
      # собрать бандл нужно ДО него. Никаких данных из события сюда не попадает.
      - name: Веб-часть внутрь приложения (офлайн-запуск)
        run: sh scripts/build-native-www.sh

      - name: Синхронизация проекта (без cap add — он бы затёр MainActivity)
        working-directory: native
        run: npx cap sync android

      - name: Сборка APK
        working-directory: native/android
        env:
          VH_VERSION_CODE: ${{ steps.version.outputs.code }}
          VH_VERSION_NAME: ${{ steps.version.outputs.name }}
          VH_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          VH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VH_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            # VH_REQUIRE_SIGNING=1 — договор с build.gradle: если ключ до gradle не доехал,
            # сборка обязана упасть здесь, а не выдать неподписанный APK, который дальше
            # уедет в артефакт под рабочим именем.
            VH_REQUIRE_SIGNING=1 ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # Барьер перед артефактом. Раньше здесь были ПРЕДУПРЕЖДЕНИЯ: неподписанный или отладочный
      # файл спокойно доезжал до артефакта под рабочим именем, а если в образе раннера не
      # оказывалось apksigner — проверка просто не выполнялась. Теперь на рабочем пути каждая
      # проверка — условие выпуска: не сошлось или проверить нечем — сборка падает.
      - name: Переименовать и проверить APK
        id: apk
        working-directory: native/android
        run: |
          set -euo pipefail
          SIGNED="${{ steps.keystore.outputs.signed }}"
          if [ "$SIGNED" = "true" ]; then
            # Имя файла НЕ угадываем через `ls | head -1`: gradle кладёт рядом
            # app-release-unsigned.apk, если подпись не назначена, и раньше именно он мог
            # попасть под рабочее имя. Берём ровно ожидаемый файл и падаем, если его нет.
            SRC="app/build/outputs/apk/release/app-release.apk"
            OUT="vahtahoz-${{ steps.version.outputs.name }}.apk"
          else
            SRC="app/build/outputs/apk/debug/app-debug.apk"
            OUT="vahtahoz-${{ steps.version.outputs.name }}-DEBUG-NE-DLYA-RABOTY.apk"
          fi
          if [ ! -f "$SRC" ]; then
            echo "::error::Ожидался $SRC, но его нет. Что собралось:"
            ls -la app/build/outputs/apk/*/ || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$SRC" "$GITHUB_WORKSPACE/artifacts/$OUT"
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "--- что получилось ---"
          ls -la

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          find_tool() {
            [ -n "$SDK" ] || return 0
            ls "$SDK"/build-tools/*/"$1" 2>/dev/null | sort -V | tail -1 || true
          }
          APKSIGNER=$(find_tool apksigner)
          AAPT2=$(find_tool aapt2)

          if [ "$SIGNED" != "true" ]; then
            # Отладочная ветка: файл и так назван так, что спутать нельзя, ронять сборку
            # из-за отсутствия инструмента незачем — это проверенное рабочее поведение.
            echo "Отладочная сборка, строгие проверки подписи не применяются."
            if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs "$OUT" || true; fi
            exit 0
          fi

          # --- дальше только РАБОЧАЯ сборка, здесь всё строго ---
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner не найден в $SDK — проверить подпись нечем, выпускать нельзя"
            exit 1
          fi
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 не найден в $SDK — проверить манифест нечем, выпускать нельзя"
            exit 1
          fi

          echo "--- подпись ---"
          CERTS=$("$APKSIGNER" verify --verbose --print-certs "$OUT")
          echo "$CERTS"
          # Ключ отладки Android одинаков у всех и лежит на каждой машине разработчика:
          # подписанный им APK — это не рабочая сборка, как бы она ни называлась.
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::APK подписан отладочным ключом Android, а не ключом владельца"
            exit 1
          fi

          echo "--- манифест ---"
          BADGING=$("$AAPT2" dump badging "$OUT")
          echo "$BADGING" | head -5 || true
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::APK помечен как debuggable — хранилище приложения читается через adb"
            exit 1
          fi
          # Отладочная сборка ставится под ru.razvedchick.vahta.debug — под рабочим именем
          # такой файл оказаться не должен ни при каких обстоятельствах.
          if ! echo "$BADGING" | grep -q "package: name='ru.razvedchick.vahta'"; then
            echo "::error::Не тот идентификатор приложения — под рабочим именем это выпускать нельзя"
            exit 1
          fi
          echo "Проверки пройдены: подпись владельца, debuggable выключен, идентификатор рабочий."

      - name: Выгрузить подписанный APK
        if: steps.keystore.outputs.signed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vahtahoz-android-release
          path: |
            artifacts/*.apk
            artifacts/*.sha256
          if-no-files-found: error

      - name: Выгрузить DEBUG-APK (раздавать нельзя)
        if: steps.keystore.outputs.signed != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vahtahoz-android-DEBUG-НЕ-ДЛЯ-РАБОТЫ
          path: |
            artifacts/*.apk
            artifacts/*.sha256
          if-no-files-found: error
