name: РАЗОВО. Достать ключ подписи Android

# ВРЕМЕННЫЙ workflow. Он существует ради одной задачи: вынуть хранилище ключа обратно
# из секретов и отдать владельцу, потому что секреты GitHub НЕ ЧИТАЮТСЯ обратно — ни
# через веб, ни через API. Пока копия одна, потеря репозитория означает, что обновлять
# установленные приложения нечем никогда (сертификат действует до 2053 года).
#
# ЭТО ВЫНОС КЛЮЧА НАРУЖУ. Пока артефакт существует, ключ доступен любому, у кого есть
# чтение репозитория. Поэтому:
#   · срок хранения артефакта — 1 день, а не 90 по умолчанию;
#   · запускать разрешено только владельцу репозитория;
#   · запуск требует ввести слово-подтверждение, случайным нажатием не сработает.
#
# ПОРЯДОК: запустить → скачать артефакт → положить .jks и пароли в надёжное место
# (менеджер паролей, зашифрованный диск) → удалить артефакт на странице запуска →
# удалить этот файл из репозитория. Все четыре шага, включая последние два.
#
# Все значения из контекста подставляются через env, а не внутрь строки run: —
# в run: они стали бы кодом (внедрение команд), в env остаются данными.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Напишите слово  выношу  — подтверждение, что вы понимаете, что ключ окажется в артефакте'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, кто и зачем
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Запускать может только владелец репозитория"
            exit 1
          fi
          if [ "$CONFIRM" != "выношу" ]; then
            echo "::error::Не введено слово подтверждения — ничего не делаю"
            exit 1
          fi

      - name: Собрать хранилище и пароли
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрета ANDROID_KEYSTORE_BASE64 нет — доставать нечего"
            exit 1
          fi
          mkdir -p out
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > out/vahtahoz.jks
          if [ ! -s out/vahtahoz.jks ]; then
            echo "::error::Хранилище раскодировалось в пустой файл"
            exit 1
          fi
          # Пароли отдельным файлом, а не в журнал: журнал GitHub маскирует секреты,
          # и вытащить их оттуда всё равно нельзя.
          {
            echo "Хранилище: vahtahoz.jks"
            echo "Пароль хранилища: $KEYSTORE_PASSWORD"
            echo "Псевдоним ключа: $KEY_ALIAS"
            echo "Пароль ключа: $KEY_PASSWORD"
            echo
            echo "Этими значениями подписан ru.razvedchick.vahta. Другой ключ = другое приложение:"
            echo "обновления поверх установленного ставиться не будут. Хранить бессрочно."
          } > out/ПАРОЛИ.txt
          # Отпечаток — чтобы владелец мог сверить, что достал именно тот ключ,
          # которым подписан розданный APK (см. docs/ANDROID_RELEASE.md).
          echo "--- отпечаток достанного хранилища ---"
          keytool -list -keystore out/vahtahoz.jks \
                  -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -i 'SHA-256' || echo "(не удалось прочитать — проверьте пароль хранилища)"

      - name: Выгрузить
        uses: actions/upload-artifact@v4
        with:
          name: ЗАБРАТЬ-И-УДАЛИТЬ-ключ-подписи
          path: out/*
          retention-days: 1
          if-no-files-found: error
