name: Build iOS (unsigned)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read

# ВНИМАНИЕ. В отличие от Android, проект native/ios/ в репозитории НЕ лежит и создаётся
# заново на каждый прогон (`npx cap add ios`). Пока в нём нет собственного нативного кода —
# это нормально. Как только появится (например WKDownloadDelegate для сохранения экспортов,
# см. отчёт по паритету обёрток), проект нужно будет закоммитить и заменить `cap add` на
# `cap sync`, иначе шаблон будет затирать правки — ровно та же ловушка, что была на Android.

jobs:
  ios:
    runs-on: macos-14
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      - name: Add iOS platform
        run: npx cap add ios
      - name: Sync
        run: npx cap sync ios
      - name: Build unsigned archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath "$PWD/build/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - name: Package unsigned .ipa
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -qr vahtahoz-unsigned.ipa Payload
          ls -la
      - name: Upload .ipa
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vahtahoz-ios-ipa-unsigned
          path: native/ios/App/build/vahtahoz-unsigned.ipa
          if-no-files-found: error
