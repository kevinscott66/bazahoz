/* ---------- Stock helpers ---------- */
const inStock = (it) => totalQtyOf(it) > 0;
function stockStatus(it){
  // позиции без остатка ("архивные") — отдельный спокойный статус, всегда в конце списка
  if(!inStock(it)) return { color:"gray", text:"Нет в наличии", rank:99, out:true };
  const tq = totalQtyOf(it);
  const low = (it.minStock!==""&&it.minStock!=null && tq <= Number(it.minStock));
  // для подсветки срока — берём «ближайший» по всем партиям; если партий нет — it.expiry
  const expiry = nearestExpiryOf(it);
  const expBatch = expiringBatchOf(it);
  // суффикс «в Морозильной» включается только когда мест ≥ 2 (иначе и так понятно из карточки)
  const locSuffix = (expBatch && locationsOf(it).length>=2 && expBatch.location)
    ? ` · ${expBatch.location}` : "";
  // срок/гарантия подсвечивается у ЛЮБОГО типа, если он указан (хозхимия, гарантия инструмента) —
  // так бейдж карточки согласован с фильтром «Просрочка/Скоро», который тоже идёт по s.expiry
  if(expiry){
    const d = daysLeft(expiry);
    if(d<0)  return { color:"red",    text:`Просрочено (${-d} дн.)${locSuffix}`, rank:0, expiry, expBatch };
    if(d<=3) return { color:"red",    text:`Срок ≤ ${d} дн.${locSuffix}`,         rank:1, expiry, expBatch };
    if(d<=14)return { color:"yellow", text:`Срок ${d} дн.${locSuffix}`,           rank:2, expiry, expBatch };
  }
  if(low) return { color:"yellow", text:`Низкий запас`, rank:3 };
  return { color:null, text:"", rank:9 };
}
function sortedStock(items){
  // мемоизируем rank: stockStatus()→totalQtyOf() делает reduce по партиям, а компаратор
  // вызывал бы его O(n log n) раз. Кешируем по одному вызову на элемент.
  const rankOf = new Map();
  const rank = it => { let r = rankOf.get(it); if(r===undefined){ r = stockStatus(it).rank; rankOf.set(it, r); } return r; };
  return [...items].sort((a,b)=>{
    const ra=rank(a), rb=rank(b);
    if(ra!==rb) return ra-rb;
    const ea=a.expiry||"9999-12-31", eb=b.expiry||"9999-12-31";
    if(ea!==eb) return ea.localeCompare(eb);
    return (a.name||"").localeCompare(b.name||"","ru");
  });
}

   На «Задачах» без задач панель стояла на ~130px выше настоящего низа, а на «Складе» с длинным
   списком — вплотную. Само не исправлялось: ни прокруткой, ни уходом в другой раздел и обратно.
   position:fixed привязан к малому вьюпорту, и на экране, который нечего прокручивать, панель
   так и парковалась по его нижнему краю.

   (см. комментарий у правила). Менять высоту вьюпорта ради Android значит вернуть ту болячку.

   смещение накапливается относительно текущего, а не пересчитывается от нуля. Где разницы нет

let _navShift = 0, _navPending = null;

   уходит в резинку (scrollTop < 0 или больше максимума), панель на своём слое композитора уже
   уехала с содержимым, а visualViewport ещё нет. Разовая ложная разница d прибавлялась к

function _navDelta(){

     «быстро листаешь туда-обратно — кнопки прыгают»: правка прилетала прямо под пальцем.
     Ждать конца жеста ничего не стоит: настоящий перекос статичен и никуда не денется. */

  if(vv && (window.innerHeight - vv.height) > 150) return null;

  const max = Math.max(0, se.scrollHeight - se.clientHeight);
  if(se.scrollTop < -1 || se.scrollTop > max + 1) return null;   // резинка/оверскролл
  const visBottom = vv ? (vv.offsetTop + vv.height) : window.innerHeight;

     Отрицательная разница означает противоположное: низ видимой области ВЫШЕ панели, то есть
     панель чем-то накрыта снизу. Это не перекос, а накладка, и сдвигать под неё панель нельзя.

     Именно так «прыгала нижняя панель» в установленном приложении на iPhone (воспроизведено на
     симуляторе, iOS 26.4): в поле ввода поднимается полоса автозаполнения высотой 68 точек,

     панель прыгала обратно — те самые скачки. С проверкой знака _navShift на этом сценарии

  return d > 0 ? d : null;

// а на инерции и на «резинке» Android (там scrollTop остаётся в пределах и прежний
// предохранитель не срабатывает) две подряд ложные разницы легко совпадают.
function _navScrollPos(){ const se = document.scrollingElement || document.documentElement; return Math.round(se.scrollTop); }

function syncNavbarBottom(){
  clearTimeout(_navPending);
  const d1 = _navDelta();
  if(d1 === null || Math.abs(d1) < 1) return;
  const pos1 = _navScrollPos();

     сдвига (панель припаркована по краю малого вьюпорта) статична — устойчивое измерение её
     покажет. Всё, что за 150 мс изменилось, — инерция или дёрганье панели браузера, и трогать
     из-за этого панель нельзя. Повод померить ещё раз придёт со следующим scroll/resize/render. */
  _navPending = setTimeout(()=>{
    const d2 = _navDelta();
    if(d2 === null || Math.abs(d2) < 1) return;
    if(_navScrollPos() !== pos1) return;                         // полотно ехало — измерение не о том
    if(Math.abs(d2 - d1) > 1) return;                            // ещё не устоялось
    const nb = document.getElementById("navbar"); if(!nb) return;
    const next = Math.max(-300, Math.min(300, _navShift + d2));  // предохранитель от разгона при странных вьюпортах
    if(Math.round(next) === Math.round(_navShift)) return;
    _navShift = next;

(function wireNavbarBottom(){

  addEventListener("orientationchange", ()=>setTimeout(run, 250));

     сам движок, и правка на каждом кадре — это ровно те рывки, из-за которых панель вынесена на
     отдельный слой композитора. */
  let t = null;
  addEventListener("scroll", ()=>{ clearTimeout(t); t = setTimeout(run, 200); }, {passive:true});
  addEventListener("load", ()=>setTimeout(run, 60));
  /* Пока палец на экране — измерять нечего (см. _navDelta), а как только он снят, меряем
     обычным порядком: отложенный запуск сам придёт по scroll, плюс один явный на случай
     жеста без прокрутки. touchcancel обязателен — иначе флаг залипнет и панель замрёт. */
  addEventListener("touchstart", ()=>{ _navTouching = true; }, {passive:true});

  addEventListener("touchend", release, {passive:true});

})();

// Короткая надпись базы ТОЛЬКО для кнопки переключения в шапке (полное имя — в шите выбора базы).
// Регион без «отряд/РоГРП/РуГРП» и без скобок: «1 отряд РоГРП «Западная»»→«1 Западная»,
// «2 …«Западная»(Детрин)»→«2 Западная», «1 отряд РуГРП»→«1 Рудная» (РуГРП = рудная ГРП).
function shortBaseName(name){
  const s = String(name||"").trim();
  const num = (s.match(/^\s*(\d+)/)||[])[1] || "";
  let region = "";
  if(/восточн/i.test(s)) region = "Восточная";
  else if(/западн/i.test(s)) region = "Западная";
  else if(/ругрп|рудн/i.test(s)) region = "Рудная";
  if(region) return (num ? num+" " : "") + region;
  const plain = s.replace(/\(.*?\)/g,"").replace(/[«»"]/g,"").trim();   // фолбэк: без скобок/кавычек
  return plain.length>16 ? plain.slice(0,15)+"…" : plain;
}

   чтобы сменить фильтр, приходилось прокручивать наверх, — а часть ленты пряталась за правым краем

   «Складе» таких лент было три подряд, и они съедали экран.

   меняется на акцентный. Иначе человек на смене гадает, почему список короткий.
   Счётчик просрочки со «Склада» не потерян: ради него на чипы и смотрели, поэтому он остался
   видимым без открытия — красным бейджем прямо на кнопке (в том же срезе, что и раньше на чипе).

function stockExpScope(){
  const allowed = allowedTypeKeys();
  const base = state.stock.filter(s=> STOCK_TYPE_KEYS.includes(stockTab) ? s.type===stockTab : allowed.includes(s.type));
  // тот же срез, что считали чипы сроков: категория + ТОТ ЖЕ поиск, что и в renderStockList
  const terms = searchTerms(stockSearch);
  const scope = base.filter(s=> (!stockCat || s.category===stockCat) && stockMatches(s, terms));
  let expired=0, soon=0;
  for(const s of scope){
    if(!inStock(s) || !s.expiry) continue;
    const d = daysLeft(s.expiry);
    if(d===null) continue;
    if(d<0) expired++; else if(d<=14) soon++;

    const parts = [];
    // exp14 — приход с плитки «Сроки истекают»: просрочка И «скоро» одновременно, одно значение
    if(stockExpiryFilter==="expired") parts.push("Просрочка");
    else if(stockExpiryFilter==="soon") parts.push("Скоро");
    else if(stockExpiryFilter==="exp14") parts.push("Сроки ≤14 дн.");
    if(STOCK_TYPE_KEYS.includes(stockTab)){
      const _vt = visibleStockTypes();
      const t = _vt.find(x=>x.key===stockTab);
      if(t && _vt.length>1) parts.push(t.short);   // роль с одним типом — это не «фильтр»
    }
    if(stockCat) parts.push(stockCat);
    return { on:parts.length>0, n:parts.length, red:c.expired,
      aria:`Фильтры склада${parts.length?": "+parts.join(", "):""}${c.expired?`. Просрочено позиций: ${c.expired}`:""}` };

     пропадала — при том что фильтр там есть (месяц), просто был вынесен лентой чипов в тело
     экрана. Теперь месяц и статус заказа живут там же, где остальные фильтры, а лента чипов
     не отъедает высоту у самой истории. «Свежий месяц» — состояние по умолчанию, оно фильтром
     не считается; «весь архив» и выбор старого месяца — считаются. */
  if(currentView==="stock" && JOURNAL_META[stockMode]){
    const months = journalMonths();
    const sel = journalSelMonth(months);
    const parts = [];
    if(sel === null && months.length) parts.push("весь архив");
    else if(sel && months[0] && sel !== months[0]) parts.push(monthLabel(sel));
    if(stockMode==="order" && journalStatus!=="all") parts.push(journalStatus==="received" ? "принятые" : "ожидающие");

      aria:`Фильтр журнала «${JOURNAL_META[stockMode].label}»${parts.length?": "+parts.join(", "):""}` };
  }
  return null;   // дашборд, кухня, «ещё» — фильтровать нечего
}

  fc.style.display = "flex";
  /* Бейдж один, не два: на 44-пиксельной кнопке два кружка сливаются в кашу. Приоритет у красного
     счётчика просрочки — он про товар, который уже нельзя выдавать, и он важнее того, сколько
     условий выбрано. Когда просрочки нет, тот же угол занимает счётчик включённых фильтров;
     сам факт «фильтр включён» дублируется заливкой кнопки, так что при просрочке он не теряется.
     Значок вставляем разметкой (он константа в коде), число — только textContent. */
  fc.replaceChildren();
  fc.insertAdjacentHTML("afterbegin", FUNNEL_SVG);
  const num = st.red || st.n || 0;
  if(num){
    const b = document.createElement("span");
    b.className = "chip-badge" + (st.red ? " red" : "");
    b.textContent = num>99 ? "99+" : String(num);
    fc.appendChild(b);
  }
  fc.className = "btn " + (st.on ? "btn-primary" : "btn-ghost");
  fc.title = st.aria;
  fc.setAttribute("aria-label", st.aria);
}
function openFilterSheet(){
  if(currentView==="tasks") openTaskFilterSheet();
  else if(currentView==="stock" && stockMode==="stock") openStockFilterSheet();
  else if(currentView==="stock" && JOURNAL_META[stockMode]) openJournalFilterSheet();
}
/* ЛИСТ ФИЛЬТРОВ ПОСЛЕ ВЫБОРА. Обработчик перерисовывает экран и открывает лист заново — иначе
   галочка осталась бы на прежнем пункте, а счётчики («Просрочка (N)», числа по категориям) не
   обновились бы. Но openSheet подставляет свежую разметку в свежий #sheetBody (клон нужен, чтобы
   сбросить старые слушатели), и прокрутка обнулялась: замер — 622 → 0 при двенадцати категориях.
   На базе с десятком категорий человек после каждого тапа листал список заново; в v219, где
   обработчик только переключал классы на ленте чипов, прокрутка не трогалась вовсе.
   Возвращаем положение: содержимое листа то же самое, меняются только галочка и числа. Если
   разметка стала короче, браузер сам подрежет scrollTop до максимума. */
function reopenFilterSheet(open){
  const prev = document.getElementById("sheetBody");
  const top = prev ? prev.scrollTop : 0;
  open();
  const now = document.getElementById("sheetBody");
  if(now && top) now.scrollTop = top;
}
/* ПУНКТ ВЫБОРА — ЧИП В СТРОКУ, А НЕ ПОЛОСА ВО ВСЮ ШИРИНУ.
   Полоса на пункт давала лист высотой в экран: двенадцать категорий склада — это двенадцать
   строк по 44px плюс типы и сроки, лист упирался в свои 92svh и закрывал собой ровно тот
   список, ради которого его открыли. Чипы переносятся по строке: то же содержимое занимает
   треть высоты, за листом виден склад, и видно, что фильтр делает с выдачей.
   44px под палец сохранены (min-height), длинные названия категорий не режем — чип просто
   переносится целиком. Галочку у выбранного оставляем: заливка на светлой теме и на цветных
   чипах читается слабее, чем явный знак. */
const _fChip = (active, label, attrs) =>
  `<button class="btn ${active?"btn-primary":"btn-ghost"} text-sm" style="min-height:44px;padding:8px 12px;white-space:normal;text-align:left" ${attrs}>${active?ico("check",15)+" ":""}${label}</button>`;
const _fRow  = (html) => `<div class="flex flex-wrap gap-2">${html}</div>`;
/* Шапка листа фильтров: заголовок, «Сбросить» (когда есть что сбрасывать) и крестик. Липкая —
   см. .sheet-head: до неё не нужно прокручивать список обратно вверх. */
/* Лист фильтров ниже прочих: 92svh — это весь экран, и человек выбирает фильтр вслепую, не видя,
   что происходит со списком. 72svh оставляет сверху пару карточек — видно, что выборка изменилась,
   и понятно, что список никуда не делся. Ставим стилем, а не классом: openSheet каждый раз меняет
   #sheetBody на свежий клон, так что на остальные листы (правка позиции, экспорт) это не налипает. */
function _fCompact(){
  const sb = document.getElementById("sheetBody");
  if(!sb) return;
  sb.style.maxHeight = "72vh";     // запас для движков без svh
  sb.style.maxHeight = "72svh";
}
const _fHead = (title, resetAttr) =>
  `<div class="sheet-head">
     <div class="sh-t">${title}</div>
     ${resetAttr?`<button class="btn btn-ghost text-sm" style="min-height:44px;padding:8px 12px;flex:none" ${resetAttr}>Сбросить</button>`:""}
     <div class="sh-x tap" data-close role="button" tabindex="0" aria-label="Закрыть фильтры">${ico("close",20)}</div>
   </div>`;
function openTaskFilterSheet(){

function openStockFilterSheet(){

  /* СРОКИ. «Просрочка + скоро» (exp14) — это ПОЛНОЦЕННОЕ значение фильтра, а не пара одиночных:
     ровно его включает плитка дашборда «Сроки истекают», и человек, пришедший оттуда, должен
     увидеть и просроченное, и истекающее. Поэтому оба пункта отмечаются ОДНОВРЕМЕННО (как раньше
     подсвечивались оба чипа), а нажатие на любой из них сужает выборку до него одного. */
  const expBad  = stockExpiryFilter==="expired" || stockExpiryFilter==="exp14";

      ${_fRow(
        _fChip(stockTab==="all", `Все (${state.stock.filter(s=>inStock(s)&&c.allowed.includes(s.type)).length})`, `data-ftab="all"`)
        + _vis.map(t=>_fChip(stockTab===t.key, `${ico(t.icon,15)} ${esc(t.short)} (${state.stock.filter(s=>s.type===t.key&&inStock(s)).length})`, `data-ftab="${t.key}"`)).join("")
      )}` : ""}
    <div class="text-sm opacity-70 mt-4 mb-2">Сроки${stockExpiryFilter==="exp14"?' · выбрано «просрочка + скоро»':""}</div>
    ${_fRow(
      _fChip(stockExpiryFilter==="all", "Все сроки", `data-fexp="all"`)
      + _fChip(expBad,  `${ico("ban",15)} Просрочка (${c.expired})`, `data-fexp="expired"`)

    )}
    ${cats.length ? `<div class="text-sm opacity-70 mt-4 mb-2">Категория</div>
    ${_fRow(
      _fChip(stockCat==="", "Все категории", `data-fcat=""`)
      + cats.map(cc=>_fChip(stockCat===cc, `${esc(cc)}${countByCat[cc]?` (${countByCat[cc]})`:""}`, `data-fcat="${esc(cc)}"`)).join("")
    )}` : ""}
    <button class="btn btn-ghost w-full mt-4" data-close>Готово</button>`);

/* ФИЛЬТР ЖУРНАЛА. Месяцы были лентой чипов в теле экрана: на базе с историей за полтора года это
   восемнадцать чипов в горизонтальной прокрутке — и они же занимали строку над каждой записью.
   Здесь они переносятся по строке и не мешают истории. «Весь архив» — новый пункт: до него
   посмотреть историю целиком (и искать по ней) было нельзя вовсе, месяц выбирался всегда. */
function openJournalFilterSheet(){
  const kind = stockMode;
  const m = JOURNAL_META[kind];
  if(!m) return;
  const months = journalMonths();
  const sel = journalSelMonth(months);
  // счётчик записей по месяцам — того же журнала, что открыт: цифра на чипе должна совпасть со
  // списком, а не с суммой по всем четырём журналам (месяцы-то общие)
  const perMonth = {};
  for(const op of (state.journals[kind]||[])){ const mk = monthKeyOf(op.ts); if(mk) perMonth[mk] = (perMonth[mk]||0)+1; }
  const dirty = (sel===null && months.length) || (sel && months[0] && sel!==months[0]) || journalStatus!=="all";
  openSheet(`
    ${_fHead(`${ico(m.icon,17)} ${m.label}`, dirty?`data-jrreset="1"`:"")}
    ${kind==="order" ? `<div class="text-sm opacity-70 mb-2">Статус</div>
      ${_fRow(
        _fChip(journalStatus==="all", "Все", `data-jrstatus="all"`)
        + _fChip(journalStatus==="pending",  "Ожидают", `data-jrstatus="pending"`)
        + _fChip(journalStatus==="received", "Приняты", `data-jrstatus="received"`)
      )}` : ""}
    ${months.length ? `<div class="text-sm opacity-70 ${kind==="order"?"mt-4":""} mb-2">Месяц</div>
      ${_fRow(
        _fChip(sel===null, "Весь архив", `data-jrmonth="all"`)
        + months.map(ym=>_fChip(sel===ym, `${monthLabel(ym)}${perMonth[ym]?` (${perMonth[ym]})`:""}`, `data-jrmonth="${ym}"`)).join("")
      )}` : `<div class="text-sm opacity-70">Записей пока нет — фильтровать нечего.</div>`}
    <button class="btn btn-ghost w-full mt-4" data-close>Готово</button>`);
  _fCompact();
}
/* ПРИВЕТСТВИЕ И ДАТА В ШАПКЕ — ПО ЗАМЕРУ, А НЕ ПО ШИРИНЕ ЭКРАНА.
   Место в шапке отнимает не ширина телефона, а кнопка фильтра (только «Склад» и «Задачи») и длина
   имени базы, поэтому любой порог в media-запросе врал: на 390/412 он прятал приветствие и дату там,
   где до появления кнопки фильтра они помещались целиком, а на 430 возвращал их вместе с обрубком
   «Доб…». Показываем ровно то, что влезает ЦЕЛИКОМ, и по ступеням — вместо «всё или ничего»:
     • приветствие: «Добрый день 👋» → «Добрый день» (машущая рука — чистое украшение) → убрать;
     • дата: «пятница, 31 июля» → «31 июля» → убрать.
   Дата важнее приветствия: приветствие ничего не сообщает, дата сообщает. Поэтому судьба у них
   раздельная — на 430 «Складе» остаётся «31 июля», хотя приветствие уже не влезает. Прежнее
   обоснование «дата и так на дашборде» неверно: текущей даты на дашборде нет.
   Ширина колонки приветствия от её содержимого не зависит (flex:1 1 0% — она получает ОСТАТОК),
   поэтому ступени можно мерить по очереди, не пересчитывая соседей; один принудительный layout
   на перерисовку шапки. */
function headerTexts(){
  const now = new Date(), h = now.getHours();
  return {
    greet: h<5?"Доброй ночи":(h<12?"Доброе утро":(h<18?"Добрый день":"Добрый вечер")),
    dateFull: now.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"}),
    dateShort: now.toLocaleDateString("ru-RU",{day:"numeric",month:"long"})
  };
}
function fitHeaderGreeting(){
  const box = document.getElementById("hdrGreet");
  const g = document.getElementById("greeting"), d = document.getElementById("dateStr");
  if(!box || !g || !d) return;
  const t = headerTexts();
  box.style.display = ""; g.style.display = ""; d.style.display = "";   // меряем в показанном виде
  const fits = el => el.scrollWidth <= el.clientWidth + 1;              // .truncate: не влезло → scrollWidth больше
  // у приветствия короткого варианта нет (в отличие от даты) — не влезло, значит прячем
  g.textContent = t.greet;
  if(!fits(g)) g.style.display = "none";
  d.textContent = t.dateFull;
  if(!fits(d)){ d.textContent = t.dateShort; if(!fits(d)) d.style.display = "none"; }
  if(g.style.display==="none" && d.style.display==="none") box.style.display = "none";
}
function renderHeader(){
  const bc = document.getElementById("baseChip");
  if(bc){
    // показываем чип только когда баз больше одной и роль позволяет переключение (начальник/роль-неизвестна — скрыт)
    if(visibleProfiles().length>1 && !roleBaseLocked()){ bc.innerHTML = ico("home",14) + " " + esc(shortBaseName(activeProfileName())); bc.style.display=""; }
    else { bc.style.display="none"; }
  }
  renderFilterChip();
  // колокольчик рисуем ДО замера приветствия: он занимает 44px строки, и мерить остаток
  // раньше него значит померить не ту ширину (см. fitHeaderGreeting в конце функции)
  try{ renderBell(); }catch(e){ console.warn("bell", e); }
  // статус-бар/чип облака скрываем, если активная база не связана с облаком или нет входа
  if(typeof cloud!=="undefined" && (!cloud.ready || !activeCloudId())){
    const sc=document.getElementById("syncChip"), sb=document.getElementById("syncBar");
    if(sc) sc.classList.add("hidden"); if(sb) sb.classList.add("hidden");
  }
  // ПОСЛЕДНИМ: приветствие занимает остаток строки, поэтому мерить его можно только когда чип базы
  // и кнопка фильтра уже приняли свой окончательный вид.
  try{ fitHeaderGreeting(); }catch(_){}
}
// поворот экрана / изменение окна меняют остаток строки — перемеряем (render() тут звать не нужно)
/* Через rAF: на Android появление экранной клавиатуры сыплет resize пачками, а внутри
   fitHeaderGreeting чередуются запись стилей и чтение scrollWidth — каждый такой замер
   заставляет браузер пересчитывать раскладку. Схлопываем пачку в один замер за кадр. */
let _fitHdrPending = false;
try{ window.addEventListener("resize", ()=>{
  if(_fitHdrPending) return; _fitHdrPending = true;
  requestAnimationFrame(()=>{ _fitHdrPending = false; try{ fitHeaderGreeting(); }catch(_){} });
}); }catch(_){}

/* ---------- Dashboard ---------- */
function dismissOnboarding(){ try{ localStorage.setItem(NS+"vahtahoz_onboarded","1"); }catch(_){} render(); }
/* Четыре набора, по которым живёт дашборд. Вынесены из renderDashboard, потому что ровно эти же
   числа называют уведомления, а расхождение счётчика с экраном тут уже случалось дважды (плитка
   «5», список «3» — см. комментарии про allowedTypeKeys ниже). Одно определение — расходиться нечему. */
function dashSets(){
  const today = todayStr();
  const todayTasks = state.tasks.filter(t=>!t.done && t.due===today);
  const overdueTasks = state.tasks.filter(t=>!t.done && t.due && t.due<today);
  // считаем ОДИН раз до фильтра: allowedTypeKeys() внутри дёргает activeMember() → поиски по
  // profiles.list и cloud.members, а тут это выполнялось на каждую позицию склада (см. _lowAllowed ниже)
  const _expAllowed = allowedTypeKeys();
  const expiringSoon = state.stock.filter(s=>{
    // ВСЕ доступные роли типы, а не только продукты: плитка ведёт на список склада, где чипы
    // «⛔ Просрочка»/«⏰ Скоро» считают все типы, и подсветка срока в stockRow тоже.
    // Просроченная хозхимия давала плитку 0 при чипе «Просрочка (2)» — счётчик противоречил экрану,
    // на который сам же ведёт, и по нему принимают решения.
    if(!_expAllowed.includes(s.type) || !s.expiry) return false;
    if(!inStock(s)) return false; // позиции без остатка не считаем «истекающими»
    // окно ≤14 дней (включая просрочку) — единое со списком склада (фильтры «Просрочка»+«Скоро»)
    const d = daysLeft(s.expiry); return d!==null && d<=14;
  });
  /* Только типы, доступные роли. Повар не видит инструменты нигде на складе, но счётчик «Низкий
     запас» считал их наравне со своими: плитка показывала 5, а в списке находилось 3, и разницу
     объяснить было нечем. Тот же allowedTypeKeys(), что у плитки сроков и у чипов на складе. */
  const _lowAllowed = allowedTypeKeys();
  const lowStock = state.stock.filter(s=> _lowAllowed.includes(s.type) && inStock(s) && s.minStock!=="" && s.minStock!=null && totalQtyOf(s) <= Number(s.minStock));
  return { today, todayTasks, overdueTasks, expiringSoon, lowStock };
}
function renderDashboard(){
  const v = document.querySelector('[data-view="dashboard"]');
  const { today, todayTasks, overdueTasks, expiringSoon, lowStock } = dashSets();
  /* роль: у начальника (нет права на задачи) дашборд складской — задачные блоки скрываем.
     Кнопка «＋ Задача» отдельной проверкой НЕ закрывается, и это не упущение. Прежняя проверка
     `!activeMember() || activeMember().can_edit_tasks` была мёртвой в обе стороны: триггер в БД
     принудительно ставит can_edit_tasks := true всем базовым ролям (false остаётся только у
     бухгалтерии, а её отсекает isRestrictedUser выше), а сами задачи в облаке персональные —
     RLS у них owner_id = auth.uid(), к базе они отношения не имеют. Плюс на самом экране
     «Задачи» такая же кнопка «＋ Новая задача» ничем не закрыта, то есть «запрет» на дашборде
     обходился одним тапом по нижней панели. Убрано целиком, чтобы следующий не потратил час на
     выяснение, что эта проверка значит. */
  const showTasks = !isRestrictedUser();

  const showOnboarding = !state.stock.length && !(state.tasks||[]).length && !localStorage.getItem(NS+"vahtahoz_onboarded");
  v.innerHTML = `
    ${showOnboarding?`<div class="card" style="border:1px solid var(--accent-weak)">
      <div class="font-bold mb-1">${ico("info",18)} С чего начать</div>
      <div class="text-sm opacity-80" style="line-height:1.6">
        1. Откройте <b>«${ico("box",15)} Склад»</b> внизу и нажмите <b>＋</b> — добавьте первую позицию (название, количество, срок годности).<br>
        2. Приход и расход отмечайте кнопками <b>＋ / −</b> на карточке.<br>
        ${showTasks?`3. На вкладке <b>«${ico("check",15)} Задачи»</b> ведите дела по смене.<br>`:""}
        Работает и без интернета — данные сохраняются на телефоне.
      </div>
      <button class="btn btn-ghost w-full mt-2 text-sm" onclick="dismissOnboarding()">Понятно</button>
    </div>`:""}
    <div class="grid grid-cols-2 gap-3">
      ${showTasks?`<button class="card tap text-left" onclick="taskFilter.cat='Все';nav('tasks')">
        <div style="color:#16a34a">${ico("checkCircle",30)}</div>
        <div class="text-2xl font-bold mt-1">${todayTasks.length}</div>
        <div class="text-sm opacity-70">Задачи сегодня</div>
        ${overdueTasks.length?`<div class="mt-1 badge badge-red">Просрочено: ${overdueTasks.length}</div>`:""}
      </button>`:""}
      <button class="card tap text-left" onclick="navStock('exp14')">
        <div style="color:#d97706">${ico("clock",30)}</div>
        <div class="text-2xl font-bold mt-1">${expiringSoon.length}</div>
        <div class="text-sm opacity-70">Сроки истекают</div>
      </button>
      <button class="card tap text-left" onclick="navStock('all')">

const TASK_CATS = ["Все","Склад","Кухня","База","Баня","Общее"];
const TASK_PRIOS = ["Низкий","Средний","Высокий"];
let taskFilter = { cat:"Все", showDone:false };

// порядок задач: дата (daysLeft) → время-якорь → ручной order (стрелки ↑/↓) → приоритет
function taskCompare(a,b){
  // невалидная/пустая дата → в конец (999), чтобы da-db не давало NaN и сортировка была стабильной
  const da = (a.due && daysLeft(a.due)!=null)?daysLeft(a.due):999, db=(b.due && daysLeft(b.due)!=null)?daysLeft(b.due):999;
  if(da!==db) return da-db;
  const ta = a.time||"99:99", tb = b.time||"99:99";
  if(ta!==tb) return ta<tb?-1:1;
  const oa = Number(a.order||0), ob = Number(b.order||0);
  if(oa!==ob) return oa-ob;
  return TASK_PRIOS.indexOf(b.priority)-TASK_PRIOS.indexOf(a.priority);
}
function renderTasks(){
  const v = document.querySelector('[data-view="tasks"]');
  let list = state.tasks.slice();
  if(taskFilter.cat!=="Все") list = list.filter(t=>t.category===taskFilter.cat);
  if(!taskFilter.showDone) list = list.filter(t=>!t.done);
  list.sort(taskCompare);

  // лента фильтров переехала в кнопку шапки (см. renderFilterChip): на полотне её больше нет
  v.innerHTML = `
    <button class="btn btn-primary w-full" onclick="openTaskEdit()">＋ Новая задача</button>

    ${list.length
      ? `<div class="space-y-2">${list.map(taskRow).join("")}</div>`
      : `<div class="card text-center opacity-70">${ico("checkCircle",20)} Задач нет</div>`}
  `;
}

function toggleTaskItem(taskId, itemId){
  const t = state.tasks.find(x=>x.id===taskId); if(!t || !Array.isArray(t.items)) return;

  saveState(); render();
}

function moveTask(id, dir){
  // ручной порядок имеет смысл ТОЛЬКО внутри группы с одинаковыми daysLeft и time —
  // иначе сортировка по дате/времени всё равно перетасует независимо от order.
  let list = state.tasks.slice().filter(t=>!t.done);
  if(taskFilter.cat!=="Все") list = list.filter(t=>t.category===taskFilter.cat);
  list.sort(taskCompare);
  const i = list.findIndex(x=>x.id===id);
  const j = i + (dir<0?-1:1);
  if(i<0 || j<0 || j>=list.length){ toast("Дальше двигать некуда"); return; }
  const a = list[i], b = list[j];
  const dueA = a.due?daysLeft(a.due):999, dueB = b.due?daysLeft(b.due):999;
  const timeA = a.time||"99:99", timeB = b.time||"99:99";
  if(dueA!==dueB || timeA!==timeB){
    toast("Порядок задаётся датой/временем — измените их у задачи");
    return;
  }
  // нормализуем order внутри одной группы, чтобы свап давал детерминированный результат
  const group = list.filter(x=>{
    const dx = x.due?daysLeft(x.due):999;
    const tx = x.time||"99:99";
    return dx===dueA && tx===timeA;
  });
  group.forEach((x,idx)=>{ x.order = idx; });
  const tmp = a.order; a.order = b.order; b.order = tmp;
  saveState(); render();
}

function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.done = !t.done;
  if(t.done){
    logOp("TASK_DONE", t.title);
    if(t.repeat && t.repeat!=="Нет" && t.due){
      const today = todayStr();
      const next = new Date(t.due+"T00:00:00");
      const origDay = next.getDate();
      const step = () => {
        if(t.repeat==="День")   next.setDate(next.getDate()+1);
        if(t.repeat==="Неделя") next.setDate(next.getDate()+7);
        if(t.repeat==="Месяц"){
          // защита от переполнения: 31.01 + 1 мес = 03.03 в JS; нормализуем к последнему дню целевого месяца
          const targetMonth = next.getMonth()+1;
          next.setDate(1);
          next.setMonth(targetMonth);
          // ставим оригинальный день, либо последний день месяца, если оригинального нет (29-31 фев и т.п.)
          const lastDay = new Date(next.getFullYear(), next.getMonth()+1, 0).getDate();
          next.setDate(Math.min(origDay, lastDay));
        }
      };
      step();
      // если задача была сильно просрочена (вплоть до ~10 лет), перематываем строго в будущее
      const localDateStr = (d) => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
      let guard = 0;
      while(localDateStr(next) <= today && guard++ < 3650) step();
      const nextDue = localDateStr(next);
      // корневой id серии: если t уже копия — берём её parentId, чтобы цепочка оставалась плоской
      const rootId = t.parentId || t.id;
      // дубликат — только незавершённая копия с тем же rootId серии.
      // (эвристику по названию/дате убрали: две независимые серии с одинаковым названием
      //  и совпавшей следующей датой ложно подавляли создание копии второй серии)
      const exists = state.tasks.some(x=> !x.done && (x.parentId||x.id)===rootId);
      if(!exists){
        // order сбрасываем — ручной порядок не имеет смысла переносить на новую дату
        // список (items) переносим с обнулёнными галочками и новыми id (чтобы завтра собирать заново)
        const nextItems = Array.isArray(t.items) ? t.items.map(i=>({ id:uid(), text:i.text, done:false })) : undefined;
        const nextTask = {...t, id:uid(), parentId:rootId, order:undefined, done:false, due:nextDue, createdAt:new Date().toISOString()};
        if(nextItems) nextTask.items = nextItems;
        state.tasks.push(nextTask);
        toast(`✓ Готово · следующая ${fmtDate(nextDue)}`);
      } else {
        toast("✓ Готово");
      }
    } else {
      toast("✓ Готово");
    }
  } else {
    // откат: удаляем автоматически созданную следующую копию по корневому id серии (только незавершённую)
    const rootId = t.parentId || t.id;
    const dropped = state.tasks.filter(x=> (x.parentId||"")===rootId && x.id!==t.id && !x.done).map(x=>x.id);
    state.tasks = state.tasks.filter(x=> !((x.parentId||"")===rootId && x.id!==t.id && !x.done));
    tombTask(dropped);   // как и в deleteTask: удаление копии повтора должно доехать до облака
    toast("Снято");
  }
  saveState(); render();
}

// парсинг textarea списка → items[], сохраняя галочки по совпадению текста со старым списком
function parseTaskItems(raw, oldItems){
  // каждый старый пункт матчим не более одного раза — иначе дубль-строки получат общий id
  const old = (Array.isArray(oldItems) ? oldItems : []).slice();
  return String(raw||"").split("\n").map(s=>s.trim()).filter(Boolean).slice(0,100).map(text=>{
    const t = text.slice(0,200);
    const idx = old.findIndex(o=>o.text===t);
    if(idx>=0){ const prev = old.splice(idx,1)[0]; return { id: prev.id, text: t, done: !!prev.done }; }
    return { id: uid(), text: t, done: false };
  });
}
function saveTask(id){
  const body = document.getElementById("sheetBody");
  const title = body.querySelector("#tt").value.trim();
  if(!title){ toast("Название обязательно"); return; }
  const cat = body.querySelector(".chip.active[data-cat]")?.dataset.cat || "Общее";
  const prio = body.querySelector(".chip.active[data-prio]")?.dataset.prio || "Средний";
  const rep = body.querySelector(".chip.active[data-rep]")?.dataset.rep || "Нет";
  const due = body.querySelector("#td").value;
  const time = (body.querySelector("#ttime")?.value || "").trim();
  const itemsRaw = body.querySelector("#titems")?.value || "";
  if(id){
    const t = state.tasks.find(x=>x.id===id);
    if(!t){ toast("Задача изменилась на другом устройстве"); closeSheet(); render(); return; }   // удалена/синкнута между открытием формы и сохранением → не падаем на t.due
    // если поменялась дата/время — старый order относится к другой группе, сбросим
    const groupChanged = t.due!==due || (t.time||"")!==time;
    const items = parseTaskItems(itemsRaw, t.items);
    Object.assign(t,{title,category:cat,priority:prio,repeat:rep,due,time});
    if(items.length) t.items = items; else delete t.items;
    if(groupChanged){
      const sameGroup = state.tasks.filter(x=> x!==t && x.due===due && (x.time||"")===time);
      const maxOrder = sameGroup.reduce((m,x)=> Math.max(m, Number(x.order||0)), -1);
      t.order = maxOrder+1;
    }
    logOp("TASK_EDIT", title);
  } else {
    // order = max(существующих в той же дате/времени) + 1, чтобы новая задача попадала в конец группы,
    // а не выше задач, которые пользователь уже ручную опустил вниз
    const sameGroup = state.tasks.filter(x=> x.due===due && (x.time||"")===time);
    const maxOrder = sameGroup.reduce((m,x)=> Math.max(m, Number(x.order||0)), -1);
    const items = parseTaskItems(itemsRaw, []);
    const nt = {id:uid(), title, category:cat, priority:prio, repeat:rep, due, time, order:maxOrder+1, done:false, createdAt:new Date().toISOString()};
    if(items.length) nt.items = items;
    state.tasks.push(nt);
    logOp("TASK_ADD", title);
  }
  saveState(); closeSheet(); render();
}
async function deleteTask(id){
  if(!await confirmSheet("Удалить задачу?",{danger:true,yes:"Удалить"})) return;
  const t = state.tasks.find(x=>x.id===id);
  // удаляем саму задачу + всю forward-цепочку повторов (parentId-наследников), чтобы не оставались зомби-копии
  const toRemove = new Set([id]);
  let grew = true;
  while(grew){
    grew = false;
    for(const x of state.tasks){
      if(x.parentId && toRemove.has(x.parentId) && !toRemove.has(x.id)){
        toRemove.add(x.id); grew = true;
      }
    }
  }
  state.tasks = state.tasks.filter(x=>!toRemove.has(x.id));
  tombTask([...toRemove]);   // удаление должно доехать до облака, даже если это была последняя задача
  logOp("TASK_DEL", (t?.title||"") + (toRemove.size>1?` (+${toRemove.size-1} повторов)`:""));
  saveState(); closeSheet(); render();
}

/* ПОИСК ПО СКЛАДУ — одна реализация на список и на счётчики чипов сроков. Раньше их было две:
   список искал по имени, месту карточки и местам/примечаниям партий, а счётчик на чипе — только
   по s.name. Цифра на чипе не сходилась с тем, что человек видел, перейдя по нему: ищешь «иванова»
   (примечание партии) — в списке позиция с просроченной партией есть, а чип «⛔ Просрочка» показывает 0.
   Плюс две вещи, которых не было ни там, ни там:
     • ё ≡ е — «Гречневая» и «Гречнёвая» набирают вперемешку, и позиция «пропадала» из поиска;
     • И по словам — «масло слив» и «слив масло» одинаково находят «Масло сливочное» (раньше
       работала только подстрока целиком, то есть строго в порядке написания). */
const searchNorm = (s) => String(s==null?"":s).toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim();
const searchTerms = (q) => searchNorm(q).split(" ").filter(Boolean);
function stockMatches(s, terms){
  if(!terms || !terms.length) return true;
  let hay = searchNorm(s && s.name) + " " + searchNorm(s && s.location);
  for(const b of ((s && s.batches) || [])) hay += " " + searchNorm(b && b.location) + " " + searchNorm(b && b.note);
  return terms.every(t => hay.includes(t));
}

/* Лента режимов («Остатки · Поступление · Выдача · Списание · Заказы») прокручиваемая, и на узком
   экране активный режим оказывался за правым краем: человек нажал «Выдачу», а на виду остались
   «Остатки» и «Поступление» — не видно, где ты. Подтягиваем активный чип к левому краю ленты.
   Двигаем scrollLeft у самой ленты, а не scrollIntoView: тот дёргает и страницу по вертикали. */
function scrollModeTabIntoView(v){
  const act = v.querySelector(".scroll-x .chip.active");
  const lane = act && act.parentElement;
  if(!lane) return;
  // Подвигаем НА МИНИМУМ: если активный чип и так виден целиком, лента не трогается. Иначе
  // подтягиваем его к ближней кромке — соседние режимы остаются на виду, и понятно, что лента
  // прокручивается дальше. Полное «к левому краю» прятало «Остатки» без нужды.
  const right = act.offsetLeft + act.offsetWidth;
  if(right > lane.scrollLeft + lane.clientWidth) lane.scrollLeft = right - lane.clientWidth + 12;
  else if(act.offsetLeft < lane.scrollLeft) lane.scrollLeft = Math.max(0, act.offsetLeft - 12);
}
function renderStock(){
  const v = document.querySelector('[data-view="stock"]');
  if(STOCK_TYPE_KEYS.includes(stockTab) && !allowedTypeKeys().includes(stockTab)) stockTab="all";   // роль потеряла доступ к типу
  const _visTypes = visibleStockTypes();
  if(_visTypes.length===1) stockTab=_visTypes[0].key;   // один тип (Механик/Электрик) → сразу он, без лишнего чипа «Все»
  const modeTabs = `
    <div class="scroll-x flex gap-2">
      <button class="chip ${stockMode==='stock'?'active':''}" data-stockmode="stock">${ico("box",15)} Остатки</button>
      ${Object.entries(JOURNAL_META).map(([k,m])=>`<button class="chip ${stockMode===k?'active':''}" data-stockmode="${k}">${ico(m.icon,15)} ${m.label} (${(state.journals[k]||[]).length})</button>`).join("")}
    </div>`;
  if(stockMode!=="stock"){
    v.innerHTML = modeTabs + renderJournal(stockMode);
    wireJournalSearch();
    renderJournalList();
    scrollModeTabIntoView(v);
    return;
  }

  /* Три ленты чипов (тип, сроки, категории) переехали в кнопку фильтра в шапке — см.
     openStockFilterSheet. Счётчики никуда не делись: они внутри листа, а самый дежурный из них —
     просрочка — виден на самой кнопке красным бейджем. «⚙️ Категории» и «📍 Места» из ряда
     категорий убраны совсем: это не фильтры, а переходы в редакторы, и они уже есть в
     «Ещё» → «Данные» (там же, где ими и пользуются). */
  v.innerHTML = `
    ${modeTabs}
    <div class="grid grid-cols-3 gap-2">
      ${_visTypes.map(t=>`<button class="btn btn-ghost" onclick="openStockEdit(null,'${t.key}')">＋ ${t.addLabel}</button>`).join("")}
    </div>

    <input class="input" id="stockSearchInp" placeholder="Поиск по складу…" value="${esc(stockSearch)}" autocomplete="off" />

    <div id="stockListBox"></div>
  `;
  // Привязываем поиск с debounce и частичным ререндером (фокус не теряется)
  const inp = document.getElementById("stockSearchInp");
  inp.addEventListener("input", ()=>{
    clearTimeout(stockSearchT);
    stockSearchT = setTimeout(()=>{
      stockSearch = inp.value;
      // Начал искать — фильтр сроков снимаем: он выставляется шитом «Сроки» и жил всю сессию,
      // из-за чего позиция В НАЛИЧИИ «пропадала» из поиска (искали по всему складу, а фильтр
      // молча показывал только просрочку). Ищут всегда по всему складу.
      if(stockExpiryFilter!=="all" && inp.value.trim()){
        stockExpiryFilter = "all";
        renderStock(); renderFilterChip();   // кнопку фильтра тоже обновить, иначе она врёт про сроки
        // renderStock пересоздал input — вернуть фокус и каретку, чтобы набор не прервался
        const ni = document.getElementById("stockSearchInp");
        if(ni){ ni.focus(); try{ ni.setSelectionRange(ni.value.length, ni.value.length); }catch(_){} }
        return;
      }
      stockLimit = 100;
      renderStockList();
      renderFilterChip();   // бейдж просрочки считается в срезе с учётом поиска
    }, 150);
  });
  scrollModeTabIntoView(v);
  renderStockList();
}

function renderStockList(){
  const box = document.getElementById("stockListBox");
  if(!box) return;
  let list = state.stock.slice();
  if(STOCK_TYPE_KEYS.includes(stockTab)) list = list.filter(s=>s.type===stockTab);
  // allowedTypeKeys() считаем ДО фильтра: этот рендер идёт на каждый набранный в поиске символ,
  // а внутри функции — аллокация массива и два линейных поиска (профиль + участник базы)
  else { const _at = allowedTypeKeys(); list = list.filter(s=>_at.includes(s.type)); }   // «Все» = только типы, доступные роли
  if(stockCat) list = list.filter(s=>s.category===stockCat);
  if(stockExpiryFilter==="expired") list = list.filter(s=>inStock(s) && s.expiry && daysLeft(s.expiry)<0);
  else if(stockExpiryFilter==="soon") list = list.filter(s=>{ if(!inStock(s)) return false; const d=s.expiry?daysLeft(s.expiry):null; return d!==null && d>=0 && d<=14; });
  // exp14 = ровно то, что считает плитка «Сроки истекают» на дашборде: просрочка И «скоро» одним
  // списком (окно ≤14 дней вместе с минусом). Отдельного чипа не заводим — подсвечиваем оба
  // существующих, а нажатие на любой из них сужает выборку до него одного.
  else if(stockExpiryFilter==="exp14") list = list.filter(s=>{ if(!inStock(s)) return false; const d=s.expiry?daysLeft(s.expiry):null; return d!==null && d<=14; });
  if(stockSearch.trim()){
    const _terms = searchTerms(stockSearch);   // общая с чипами сроков реализация: имя + место карточки + места/примечания партий, ё≡е, И по словам
    list = list.filter(s=> stockMatches(s, _terms));
  }
  list = sortedStock(list);
  const total = list.length;
  const outCount = list.filter(s=>!inStock(s)).length;
  const inCount  = total - outCount;
  const shown = list.slice(0, stockLimit);
  if(!total){
    const noFilters = !stockSearch.trim() && !stockCat && stockExpiryFilter==="all";
    // Пустой список обязан НАЗВАТЬ активные фильтры: «Ничего не найдено» при включённой
    // «Просрочке» читалось как «товары пропали», хотя они просто отфильтрованы.
    const parts = [];
    if(stockExpiryFilter==="expired") parts.push("фильтр «Просрочка»");
    if(stockExpiryFilter==="soon") parts.push("фильтр «Скоро»");
    if(stockExpiryFilter==="exp14") parts.push("фильтр «сроки ≤ 14 дней»");
    if(stockCat) parts.push(`категория «${esc(stockCat)}»`);
    const hint = parts.length ? `<div class="text-xs opacity-60 mt-1">Активен ${parts.join(" и ")} — снимите, чтобы увидеть весь склад</div>` : "";
    box.innerHTML = `<div class="card text-center opacity-70">${noFilters
      ? "Склад пуст. Нажмите «＋» вверху, чтобы добавить первую позицию."
      : "Ничего не найдено"+hint}</div>`;
    return;
  }
  const more = total > shown.length
    ? `<button class="btn btn-ghost w-full mt-2" id="stockMore">Показать ещё (${total - shown.length})</button>`
    : `<div class="text-center text-xs opacity-60 mt-2">В наличии: ${inCount}${outCount?` · нет в наличии: ${outCount}`:""}</div>`;
  // визуальный разделитель перед блоком «нет в наличии» (только если он попадает в показанный срез)
  let html = "";
  let firstOutSeen = false;
  for(const it of shown){
    if(!firstOutSeen && !inStock(it) && inCount>0){
      firstOutSeen = true;
      html += `<div class="text-xs opacity-60 mt-3 mb-1 uppercase tracking-wide">— Нет в наличии (${outCount}) —</div>`;
    }
    html += stockRow(it);
  }
  box.innerHTML = `<div class="space-y-2">${html}</div>${more}`;
  const moreBtn = document.getElementById("stockMore");
  if(moreBtn) moreBtn.addEventListener("click", ()=>{ stockLimit += 200; renderStockList(); });
}

/* ---------- Journals (операции) + помесячный архив ---------- */
let journalMonth = null;   // выбранный месяц архива (YYYY-MM); "all" → все месяцы; null → последний
let journalSearch = "";    // строка поиска по журналу (общая на все четыре — см. renderJournal)
let journalSearchT = null; // debounce таймер
let journalStatus = "all"; // только «Заказы»: all | pending | received
let journalLimit = 200;    // сколько записей показываем (чанкинг, как на складе)

/* ПОИСК ПО ЖУРНАЛУ. Раньше история листалась только глазами: «когда в последний раз выдавали
   сахар» на базе с четырьмя сотнями записей в месяц — это прокрутка вручную, и человек шёл
   за ответом в Excel-выгрузку. Ищем по тому же принципу, что и склад (searchNorm: ё≡е и И по
   словам), но по полям записи: наименование, примечание, место партии, дата операции и срок
   партии. Дата — в том же виде, в каком она в карточке (01.08.2026), чтобы «01.08» находило
   день, а не заставляло вспоминать ISO. */
const opDateText = (ts)=>{
  const d = new Date(String(ts||""));
  if(isNaN(d)) return "";
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
};
function journalMatches(op, terms){
  if(!terms || !terms.length) return true;
  if(!op) return false;
  const hay = searchNorm(op.productName) + " " + searchNorm(op.note) + " " + searchNorm(op.batchLocation)
            + " " + opDateText(op.ts) + " " + (op.batchExpiry ? fmtDate(op.batchExpiry) : "");
  return terms.every(t => hay.includes(t));
}
/* Выбранный месяц: "all" — весь архив, иначе выбранный (если он ещё есть в данных), иначе свежий.
   Отдельная функция, потому что то же самое нужно и кнопке фильтра в шапке, и листу фильтров. */
function journalSelMonth(months){
  if(journalMonth === "all") return null;
  return (journalMonth && months.includes(journalMonth)) ? journalMonth : (months[0] || null);
}
/* Срез журнала после ВСЕХ условий (месяц → статус → поиск), свежие сверху. Один источник и для
   списка, и для итогов, и для подсказки «найдено в других месяцах»: пока их было два, счётчик
   на экране расходился со списком (это уже ловили на складе — см. stockExpScope). */
function journalScope(kind, opts){
  const months = journalMonths();
  const selMonth = (opts && "month" in opts) ? opts.month : journalSelMonth(months);
  let list = [...(state.journals[kind]||[])].sort((a,b)=> (b.ts||"").localeCompare(a.ts||""));
  if(selMonth) list = list.filter(op=>monthKeyOf(op.ts)===selMonth);
  if(kind==="order" && journalStatus!=="all"){
    list = list.filter(op => journalStatus==="received" ? op.status==="received" : op.status!=="received");
  }
  const terms = searchTerms(journalSearch);
  if(terms.length) list = list.filter(op => journalMatches(op, terms));
  return { months, selMonth, list };
}
const RU_MONTHS3=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
/* ISO → YYYY-MM, СТРОГО. Ключ месяца подставляется в data-атрибут чипа и внутрь
   onclick="exportJournalsMonth('...')", а op.ts приходит из облака (journal_entries.data.ts)
   и на pull не валидируется. Сырой slice(0,7) пускал туда произвольную строку → инъекция.
   Невалидное → "" (journalMonths такие отбрасывает, чип не создаётся). */
/* Ключ месяца по ЛОКАЛЬНОМУ времени — тому же, которое показывает toLocaleString в списке.
   ts хранится в UTC, поэтому срез строки давал расхождение: в UTC+7..+11 (Восточная, Рудная —
   Якутия/Магадан) операция «1 августа 05:00 местного» = «2026-07-31T22:00Z» попадала в ИЮЛЬСКИЙ
   чип и июльский экспорт, хотя в журнале на экране стоит 01.08. Каждый месяц первые 7–11 часов
   операций уезжали в отчёт предыдущего месяца, и оба отчёта не сходились с журналом.
   Формат результата остаётся строго ^\d{4}-\d{2}$ — это же защита data-jrmonth и inline-onclick.
   Строка без времени («2026-07-15», legacy/импорт) — берём срез, без сдвига в чужой месяц. */
const monthKeyOf = (ts)=>{
  const s = String(ts||"");
  if(!/^\d{4}-\d{2}/.test(s)) return "";
  if(s.indexOf("T") === -1) return s.slice(0,7);
  const d = new Date(s);
  if(isNaN(d)) return "";
  return String(d.getFullYear()).padStart(4,"0") + "-" + String(d.getMonth()+1).padStart(2,"0");
};
// соседние месяцы по UTC, которые могут содержать записи ЛОКАЛЬНОГО месяца ym (сдвиг ±1 сутки)
function monthKeysToFetch(ym){
  const m = /^(\d{4})-(\d{2})$/.exec(String(ym||"")); if(!m) return [];
  const y=+m[1], mo=+m[2];
  const prev = mo===1  ? `${y-1}-12` : `${y}-${String(mo-1).padStart(2,"0")}`;
  const next = mo===12 ? `${y+1}-01` : `${y}-${String(mo+1).padStart(2,"0")}`;
  return [prev, `${y}-${String(mo).padStart(2,"0")}`, next];
}
function monthLabel(ym){
  if(!/^\d{4}-\d{2}$/.test(String(ym||""))) return "";
  const p=String(ym).split("-");
  return `${RU_MONTHS3[(+p[1])-1]||p[1]} ${p[0]}`;
}
function journalMonths(){   // все месяцы с записями по всем 4 журналам, свежие сверху
  const set=new Set();
  for(const k of JOURNAL_KEYS) for(const op of (state.journals[k]||[])){ const mk=monthKeyOf(op.ts); if(mk) set.add(mk); }
  return [...set].sort().reverse();
}
// экспорт всех журналов за выбранный месяц (архив) — 4 листа
async function exportJournalsMonth(ym){
  toast("Подготовка файла…");
  let XLSX; try{ XLSX=await ensureXlsx(); }catch(e){ toast("Не удалось сделать Excel — сохраняем в простом виде"); return; }
  // Источник: ОБЛАКО (полный архив за месяц), если онлайн и база облачная — локально журнал усечён до 500 на вид,
  // а в облаке архив полный. Фолбэк на локальное при офлайне/сбое/локальной базе.
  let byKind = null; const cid = activeCloudId();
  if(cid && cloud.ready && cloudOnline() && cloud.session && cloud.session.access_token){
    try{
      // Тянем ТРИ месяца по UTC (предыдущий/целевой/следующий) и дорезаем клиентом по локальному
      // ключу: границы локального месяца лежат внутри соседних UTC-месяцев. Форму запроса не меняем —
      // это тот же проверенный like-фильтр, а не непроверенный диапазон по data->>ts.
      const rows = [];
      for(const mk of monthKeysToFetch(ym)){
        const part = await cloudRestAll(`journal_entries?select=kind,data&base_id=eq.${encodeURIComponent(cid)}&data->>ts=like.${encodeURIComponent(mk)}*&order=id`, cloud.session.access_token, {timeout:90000});
        if(Array.isArray(part)) rows.push(...part);
      }
      if(Array.isArray(rows)){
        byKind={}; for(const k of JOURNAL_KEYS) byKind[k]=[];
        rows.forEach(r=>{ if(r && r.data && byKind[r.kind]) byKind[r.kind].push(r.data); });
      }
    }catch(e){ console.warn("export month cloud → фолбэк на локальное", e); byKind=null; }
  }
  const wb=XLSX.utils.book_new();
  let total=0;   // сколько записей реально попало в книгу — пустой файл не сохраняем
  for(const k of JOURNAL_KEYS){
    const meta=JOURNAL_META[k];
    const src = byKind ? byKind[k] : (state.journals[k]||[]);
    const rows=(src||[]).filter(op=>monthKeyOf(op.ts)===ym).sort((a,b)=>(a.ts||"").localeCompare(b.ts||"")).map(op=>{
      const row={ "Дата": op.ts?new Date(op.ts).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"",
        "Наименование": op.productName||"", "Количество": roundQty(op.qty||0), "Ед. изм.": op.unit||"",
        "Место": op.batchLocation||"", "Срок": op.batchExpiry?fmtDate(op.batchExpiry):"" };
      if(k==="order") row["Статус"]=op.status==="received"?"Принят":"Ожидает";
      row["Примечание"]=op.note||""; return row;
    });
    total += rows.length;
    const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"Дата":"","Наименование":""}]);
    ws["!cols"]=[{wch:16},{wch:34},{wch:11},{wch:9},{wch:16},{wch:12},{wch:10},{wch:24}];
    XLSX.utils.book_append_sheet(wb, ws, meta.label.slice(0,28));
  }
  if(!total){ toast(`За ${monthLabel(ym)||ym} записей нет — сохранять нечего`); return; }
  saveXlsx(wb, `vahtahoz-журналы-${ym}-${_fileSafe(activeProfileName())}.xlsx`, `Журналы за ${monthLabel(ym)||ym} сохранены`);
}
/* Оболочка журнала: кнопки, поиск и пустой контейнер списка. Сам список рисует renderJournalList —
   иначе при каждом наборе буквы пересоздавался бы <input>, и фокус с кареткой слетали бы на
   каждой букве (той же болезнью болел поиск по складу, там это уже разведено). */
function renderJournal(kind){
  const m = JOURNAL_META[kind];
  const months = journalMonths();
  const selMonth = journalSelMonth(months);
  return `
    <button class="btn ${m.color} w-full mt-3" onclick="openOpEdit('${kind}')">＋ ${m.label}</button>
    ${kind==="receipt" ? `<button class="btn btn-ghost w-full mt-2" onclick="openReceiptImportSheet()">${ico("inbox",18)} Импорт поступления из Excel</button>` : ""}
    <input class="input mt-2" id="jrSearchInp" placeholder="Поиск по истории…" value="${esc(journalSearch)}" autocomplete="off" />
    ${selMonth
      // подпись в одну строку: «всех журналов» переносило кнопку на две и растягивало шапку раздела
      ? `<button class="btn btn-ghost w-full mt-2" title="Все четыре журнала за месяц одним файлом" onclick="exportJournalsMonth('${selMonth}')">${ico("chart",18)} Экспорт журналов за ${monthLabel(selMonth)}</button>`
      /* Выгрузка всегда помесячная (четыре листа за месяц) — при «всём архиве» экспортировать
         нечего, но и молча прятать кнопку нельзя: человек решит, что выгрузка пропала. Ведём
         в тот же лист фильтров, где месяц и выбирается. */
      : (months.length ? `<button class="btn btn-ghost w-full mt-2" onclick="openFilterSheet()">${ico("chart",18)} Экспорт за месяц — выберите месяц</button>` : "")}
    <div id="jrListBox"></div>`;
}
/* Поиск с задержкой 150 мс и частичной перерисовкой — ровно как на складе. */
function wireJournalSearch(){
  const inp = document.getElementById("jrSearchInp");
  if(!inp) return;
  inp.addEventListener("input", ()=>{
    clearTimeout(journalSearchT);
    journalSearchT = setTimeout(()=>{
      journalSearch = inp.value;
      journalLimit = 200;
      renderJournalList();
    }, 150);
  });
}
function renderJournalList(){
  const box = document.getElementById("jrListBox");
  if(!box) return;
  const kind = stockMode;
  const m = JOURNAL_META[kind];
  if(!m) return;
  const { selMonth, list } = journalScope(kind);
  const shown = list.slice(0, journalLimit);
  const rows = shown.map(op=>{
    const _dWhen = new Date(op.ts);
    const when = isNaN(_dWhen) ? "—" : _dWhen.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    const status = kind==="order"
      ? (op.status==="received"
          ? `<span class="badge badge-green">Принят</span>`
          : `<span class="badge badge-yellow">Ожидает</span>`)
      : "";
    const qtyBadge = `<span class="badge badge-gray">${fmtQty(op.qty)} ${esc(op.unit||"")}</span>`;
    const locBadge = op.batchLocation ? `<span class="badge badge-gray">${ico("pin",13)} ${esc(op.batchLocation)}</span>` : "";
    const expBadge = op.batchExpiry ? `<span class="badge badge-gray">${ico("clock",13)} ${fmtDate(op.batchExpiry)}</span>` : "";
    // зеркальные записи из принятого заказа: редактировать нельзя — это рассинхронизирует с order; удалять можно (deleteOp умеет)
    const linkedToOrder = kind==="receipt" && (state.journals.order||[]).some(o=>o.receiptId===op.id);
    const oid = safeId(op.id);
    const receiveBtn = (kind==="order" && op.status!=="received")
      ? `<button class="btn btn-success" onclick="orderReceive('${oid}')">Принять на склад</button>`
      : "";
    return `<div class="card">
      <div class="flex items-start gap-2">
        <div class="flex-1 min-w-0">
          <div class="font-semibold break-words">${esc(op.productName)}</div>
          <div class="text-xs opacity-70 mt-1 flex flex-wrap gap-2 items-center">
            ${qtyBadge}
            ${locBadge} ${expBadge}
            <span class="badge badge-gray">${when}</span>
            ${status}
          </div>
          ${op.note?`<div class="text-xs opacity-80 mt-1">${esc(op.note)}</div>`:""}
        </div>
        <!-- Кнопки В СТРОКУ, а не столбиком: два блока по 52px растягивали карточку до 110px при
             содержимом в две строки, и на экран влезало пять записей вместо восьми. Прокрутка
             истории — основное занятие в этом разделе. Размер кнопок не тронут (те же 52). -->
        <div class="flex gap-1">
          ${linkedToOrder ? `<button class="btn btn-ghost opacity-40" disabled title="Редактируйте исходный заказ" aria-label="Редактировать (через заказ)">${ico("edit")}</button>` : `<button class="btn btn-ghost" onclick="editOp('${kind}','${oid}')" aria-label="Редактировать запись">${ico("edit")}</button>`}
          <button class="btn btn-ghost" onclick="deleteOp('${kind}','${oid}')" aria-label="Удалить запись">${ico("trash")}</button>
        </div>
      </div>
      ${receiveBtn?`<div class="mt-2">${receiveBtn}</div>`:""}
    </div>`;
  }).join("");

  // группируем суммы по единицам (шт+кг смешивать нельзя). Считаем по ВСЕЙ выборке, а не по
  // показанному куску: иначе после «Показать ещё» итог менялся бы прямо на глазах.
  const byUnit = {};
  list.forEach(o=>{ const u = o.unit||"—"; byUnit[u] = roundQty((byUnit[u]||0) + Number(o.qty||0)); });
  const sumStr = Object.entries(byUnit)
    .map(([u,v])=>`${fmtQty(v)} ${esc(u)}`)
    .join(", ");

  /* ПУСТОЙ СПИСОК ОБЯЗАН НАЗВАТЬ ПРИЧИНУ. «Записей нет» при выбранном месяце и включённом поиске
     читается как «история пропала». Отдельно — самый частый случай: искали в текущем месяце, а
     запись прошлогодняя. Тогда сразу считаем, сколько совпадений во всём архиве, и предлагаем
     раскрыть его одним нажатием, а не подбирать месяц наугад. */
  let body;
  if(!shown.length){
    const hints = [];
    if(journalSearch.trim() && selMonth){
      const all = journalScope(kind, {month:null}).list.length;
      if(all) hints.push(`<button class="btn btn-ghost w-full mt-2" data-jrmonth="all">Найдено во всём архиве: ${all} — показать</button>`);
    }
    const parts = [];
    if(journalSearch.trim()) parts.push(`поиск «${esc(journalSearch.trim())}»`);
    if(selMonth) parts.push(`месяц ${monthLabel(selMonth)}`);
    if(kind==="order" && journalStatus!=="all") parts.push(journalStatus==="received"?"только принятые":"только ожидающие");
    body = `<div class="card text-center opacity-70">Записей нет${
      parts.length?`<div class="text-xs opacity-60 mt-1">Активно: ${parts.join(", ")}</div>`:""}</div>${hints.join("")}`;
  } else {
    const more = list.length > shown.length
      ? `<button class="btn btn-ghost w-full mt-2" id="jrMore">Показать ещё (${list.length - shown.length})</button>`
      : "";
    body = `<div class="space-y-2 mt-2">${rows}</div>${more}`;
  }

  box.innerHTML = `
    <div class="text-xs opacity-70 mt-2">${selMonth?`Месяц ${monthLabel(selMonth)}`:"Весь архив"} · записей: ${list.length}${
      shown.length<list.length?` (показано ${shown.length})`:""}${sumStr?` · сумма по ед.: ${sumStr}`:""}</div>
    ${body}`;
  const moreBtn = document.getElementById("jrMore");
  if(moreBtn) moreBtn.addEventListener("click", ()=>{ journalLimit += 200; renderJournalList(); });
}

// Общий пикер «поиск позиции склада» для форм операций (openOpEdit/editOp).
// prefix — префикс id элементов (op/eop); тексты подсказок и поведение nameI на выборе отличаются → параметры.
function wireStockPicker({prefix, emptyHint, notFoundText, nameOnPick}){
  const input=document.getElementById(prefix+"Search");
  const list =document.getElementById(prefix+"List");
  const sel  =document.getElementById(prefix+"Sel");
  const hid  =document.getElementById(prefix+"ProdId");
  const unit =document.getElementById(prefix+"Unit");
  const nameI=document.getElementById(prefix+"Name");
  if(!input||!list) return;
  const PICK_CAP = 50;   // список прокручиваемый (max-h-60 overflow) — показываем больше, при переполнении подсказываем уточнить
  function renderList(q){
    const Q=q.trim().toLowerCase();
    if(!Q){ list.innerHTML=`<div class="text-xs opacity-60 p-2">${emptyHint}</div>`; return; }
    const matched=state.stock.filter(s=>(s.name||"").toLowerCase().includes(Q));
    const found=matched.slice(0,PICK_CAP);
    if(!found.length){ list.innerHTML=`<div class="text-xs opacity-60 p-2">${notFoundText}</div>`; return; }
    list.innerHTML = found.map(s=>`<button type="button" class="w-full text-left p-2 rounded hover:bg-white/5" data-pick="${esc(s.id)}">${ico(typeMeta(s.type).icon,15)} ${esc(s.name)} <span class="opacity-60 text-xs">· ${fmtQty(s.qty)} ${esc(s.unit||"")}</span></button>`).join("")
      + (matched.length>PICK_CAP ? `<div class="text-xs opacity-60 p-2">Показаны первые ${PICK_CAP} из ${matched.length} — уточните запрос</div>` : "");
  }
  renderList("");
  input.addEventListener("input", ()=>renderList(input.value));
  list.addEventListener("click", e=>{
    const b=e.target.closest("[data-pick]"); if(!b) return;
    const s=state.stock.find(x=>x.id===b.dataset.pick); if(!s) return;
    hid.value=s.id;
    sel.textContent=`Выбрано: ${s.name} (${fmtQty(s.qty)} ${s.unit||""})`;
    if(UNITS.includes(s.unit)) unit.value=s.unit;
    nameI.value = nameOnPick ? s.name : "";
  });
}
