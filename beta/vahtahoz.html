function ensureXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(window._xlsxLoading) return window._xlsxLoading;
  // XLSX вынесен в отдельный файл, грузится ТОЛЬКО при экспорте Excel — главная страница вдвое легче
  window._xlsxLoading = new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="./xlsx.js";
    s.onload=()=>{ window._xlsxLoading=null; window.XLSX ? resolve(window.XLSX) : reject(new Error("XLSX не инициализировался")); };
    s.onerror=()=>{ window._xlsxLoading=null; reject(new Error("Не удалось загрузить библиотеку Excel (нужна сеть)")); };
    document.head.appendChild(s);
  });
  return window._xlsxLoading;
}
// защита от инъекции формул в Excel: строковая ячейка, начинающаяся с = + - @ (tab/CR), исполнилась бы
// как формула при открытии файла (тот же риск, что в CSV). Числа хранятся типом "n" — их не трогаем.
// Данные могли прийти из общей облачной базы от другого участника → экранируем перед отдачей файла.
/* Число для ячейки xlsx или пустая строка. Number(undefined) и Number("нет") дают NaN,
   а json_to_sheet кладёт его как {t:"n"} — в sheet1.xml пишется NaN, что не является
   валидным xsd:double: Excel предлагает «восстановить файл», при обратном чтении «NAN».
   Ловилось на позиции без minStock (старый JSON-бэкап или ручная правка файла —
   validateImport это поле не создаёт). В runFilteredXlsx и _acctRow проверка уже была. */
function _xlNum(v){
  if(v===""||v==null) return "";
  let n = Number(v);
  // legacy-значение вроде "2,5" (ручная правка/старый бэкап): Number даёт NaN, но данные ронять
  // незачем — parseNum понимает и русскую запятую, и пробелы-разделители тысяч.
  // Только для ЧИСЛОВЫХ по виду строк: parseNum на мусоре («нет») возвращает 0, а ноль в колонке
  // «Мин. запас» читается как заданный минимум — это хуже пустой ячейки.
  if(!Number.isFinite(n) && typeof v==="string" && /^\s*-?[\d\s ]+[.,]?\d*\s*$/.test(v)
     && typeof parseNum==="function") n = parseNum(v);
  return Number.isFinite(n) ? n : "";
}
/* Анти-инъекции («формула из ячейки») в XLSX НЕ нужна и была вредна. В xlsx формула — это отдельный
   элемент <f> в XML, строковое значение ячейки формулой не становится ни при каких условиях (в отличие
   от CSV, где Excel парсит текст — там экранирование в exportCsv остаётся). А апостроф, который ставил
   бывший xlsxGuard, в xlsx НЕ съедается при открытии: он часть значения. Реальные данные («-» в
   примечании, «+7…» в телефоне, «=» в наименовании) уезжали в файл как «'-», «'+7…» — испорченный
   экспорт при нулевой пользе. Поэтому листы отдаём как есть. */
/* Флаг «экспорт уже идёт». ensureXlsx() тянет модуль по сети, и повторный тап по кнопке во время
   загрузки запускал ВТОРОЙ экспорт: оба вызова ждали общий промис _xlsxLoading, оба доходили до
   сохранения — получалось два одинаковых файла (а при сбое загрузки — два одинаковых CSV).
   Снимается ТОЛЬКО в finally: иначе одна ошибка залипла бы флагом навсегда и экспорт умер бы до
   перезагрузки страницы. */
let _exportBusy = false;
async function exportXlsx(){
  if(_exportBusy){ toast("Экспорт уже готовится…"); return; }
  _exportBusy = true;
  try{ await _exportXlsxRun(); }
  finally{ _exportBusy = false; }
}
async function _exportXlsxRun(){
  // пустая книга никому не нужна: раньше при пустой базе сохранялся файл из одних шапок листов
  if(!sortedStock(state.stock).length
     && !JOURNAL_KEYS.some(k=>(state.journals[k]||[]).length)
     && !(state.tasks||[]).length){
    toast("Нечего выгружать — склад, журналы и задачи пусты"); return;
  }
  toast("Подготовка файла…");
  let XLSX;
  try{ XLSX = await ensureXlsx(); }
  catch(e){
    /* Раньше тут был МОЛЧАЛИВЫЙ откат на CSV. Предупреждение не доходило: exportCsv в том же
       синхронном тике вызывает toast("CSV сохранён"), а toast — один элемент с textContent,
       поэтому пользователь видел только «CSV сохранён» и не понимал, почему вместо .xlsx
       пришёл текстовый .csv. Формат меняем только с явного согласия. */
    const go = await confirmSheet(
      "Excel недоступен — нужна сеть при первом использовании. Сохранить в простом формате CSV?",
      { title:"Excel недоступен", yes:"Сохранить CSV", no:"Отмена" });
    if(go) exportCsv();
    return;
  }
  const wb = XLSX.utils.book_new();
  const stockRows = sortedStock(state.stock).map(s=>({
    "Тип": typeMeta(s.type).addLabel,
    "Категория": s.category||"",
    "Наименование": s.name,
    /* Количество и срок — ЧЕРЕЗ АГРЕГАТОРЫ, как в exportCsv и runFilteredXlsx. Сырые s.qty/s.expiry
       врали, пока агрегаты карточки не пересчитаны (устаревшие legacy-поля у партийной позиции —
       например, сразу после слияния партий из облака, до полной перезагрузки страницы): позиция
       с партией на 40 шт до 2027-03-03 уходила в лист «Остатки» как «1 шт, 2020-01-01», хотя экран,
       CSV и «Склад (фильтр)» того же склада показывали 40 и 2027-03-03. Бухгалтер, сверяющий Excel
       с экраном, видел 1 вместо 40. */
    "Количество": totalQtyOf(s),
    "Ед. изм.": s.unit||"",
    "Мин. запас": _xlNum(s.minStock),   // NaN в числовой ячейке = «файл повреждён» в Excel
    "Срок годности": nearestExpiryOf(s)||"",
    "Место": locationsOf(s).join("; "),
    "Примечание": s.note||"",
  }));
  const ws = XLSX.utils.json_to_sheet(stockRows);
  ws["!cols"] = [{wch:10},{wch:22},{wch:40},{wch:10},{wch:10},{wch:10},{wch:14},{wch:16},{wch:30}];
  XLSX.utils.book_append_sheet(wb, ws, "Остатки");

  // лист «Партии»: по строке на каждую партию (срок/место/остаток) — полнота для многопартийных позиций
  const batchRows = [];
  for(const s of sortedStock(state.stock)){
    for(const b of (s.batches||[])){
      batchRows.push({
        "Наименование": s.name,
        "Категория": s.category||"",
        "Количество": roundQty(b.qty||0),
        "Ед. изм.": s.unit||"",
        "Срок годности": b.expiry||"",
        "Место": b.location||"",
        "Примечание": b.note||"",
      });
    }
  }
  if(batchRows.length){
    const wsB = XLSX.utils.json_to_sheet(batchRows);
    wsB["!cols"] = [{wch:40},{wch:22},{wch:10},{wch:10},{wch:14},{wch:18},{wch:30}];
    XLSX.utils.book_append_sheet(wb, wsB, "Партии");
  }

  const fmtTs = ts => { const d = ts?new Date(ts):null; return d && !isNaN(d) ? d.toLocaleString("ru-RU") : ""; };
  const jSheet = (kind, title) => {
    const rows = (state.journals[kind]||[]).slice().sort((a,b)=>(b.ts||"").localeCompare(a.ts||"")).map(op=>{
      const r = {
        "Дата": fmtTs(op.ts),
        "Наименование": op.productName,
        "Количество": roundQty(op.qty||0),
        "Ед. изм.": op.unit||"",
        "Примечание": op.note||"",
      };
      if(kind==="order"){
        r["Статус"] = op.status==="received"?"Принят":"Ожидает";
        r["Принят"] = fmtTs(op.receivedAt);
      }
      return r;
    });
    const sh = XLSX.utils.json_to_sheet(rows.length?rows:[{"Дата":"","Наименование":"","Количество":"","Ед. изм.":"","Примечание":""}]);
    sh["!cols"] = [{wch:18},{wch:40},{wch:10},{wch:10},{wch:30},{wch:12},{wch:18}];
    XLSX.utils.book_append_sheet(wb, sh, title);
  };
  jSheet("receipt","Поступление");
  jSheet("issue","Выдача");
  jSheet("writeoff","Списание");
  jSheet("order","Заказы");

  // лист с задачами — НЕ добавляем для ограниченного пользователя (начальник): у него вкладка задач скрыта
  if(!isRestrictedUser()){
    const taskRows = (state.tasks||[]).slice().sort((a,b)=>(a.due||"").localeCompare(b.due||"")).map(t=>({
      "Задача": t.title||"",
      "Категория": t.category||"",
      "Приоритет": t.priority||"",
      "Повтор": t.repeat||"Нет",
      "Срок": t.due||"",
      "Время": t.time||"",
      "Порядок": _xlNum(t.order),
      "Готово": t.done?"✓":"",
    }));
    const tsh = XLSX.utils.json_to_sheet(taskRows.length?taskRows:[{"Задача":"","Категория":"","Приоритет":"","Повтор":"","Срок":"","Время":"","Порядок":"","Готово":""}]);
    tsh["!cols"] = [{wch:40},{wch:16},{wch:12},{wch:10},{wch:12},{wch:8},{wch:8},{wch:10}];
    XLSX.utils.book_append_sheet(wb, tsh, "Задачи");
  }

  saveXlsx(wb, `vahtahoz-${todayStr()}.xlsx`, "Excel сохранён");
}
function exportCsv(){
  // без позиций получался файл из одной шапки (~165 байт) — сохранять его незачем
  const list = sortedStock(state.stock);
  if(!list.length){ toast("Склад пуст — сохранять нечего"); return; }
  const header = ["Тип","Категория","Наименование","Количество","Ед. изм.","Мин. запас","Срок годности","Место","Примечание"];
  const rows = [header];
  /* Десятичный разделитель — ЗАПЯТАЯ: файл открывают в русском Excel, где точка означает дату,
     и «1.5» превращалось в 01.05 (или в текст) — сумма по столбцу «Количество» не считалась.
     Разделитель полей у нас «;», поэтому запятая внутри числа ничего не ломает, а исключение
     анти-инъекции ниже уже допускает и точку, и запятую. XLSX этой проблемы не имеет. */
  const dec = (v) => String(v??"").replace(".", ",");
  list.forEach(s=>rows.push([
    typeMeta(s.type).addLabel,
    s.category||"", s.name, dec(fmtQty(totalQtyOf(s))), s.unit||"",
    /* Срок — ЧЕРЕЗ АГРЕГАТОР, как в exportXlsx и runFilteredXlsx. Сырой s.expiry врёт, пока агрегаты
       карточки не пересчитаны (устаревшее legacy-поле у партийной позиции): CSV показывал 2020-01-01
       там, где Excel того же склада — 2027-03-03, при одинаковом количестве. */
    dec(s.minStock??""), nearestExpiryOf(s)||"", locationsOf(s).join("; "), s.note||""
  ]));
  const csv = "\uFEFF" + rows.map(r=>r.map(v=>{
    let str = String(v??"");
    // Числа НЕ трогаем анти-инъекцией: «-3» — это значение, а не формула, и префикс ' уводил его
    // в Excel текстом (сумма по столбцу ломалась). Формулу опознаём только у НЕчисловых строк.
    if(!/^-?\d+(?:[.,]\d+)?$/.test(str) && /^[=+\-@\t\r]/.test(str)) str = "'" + str;
    return /[;"\n\r]/.test(str) ? `"${str.replace(/"/g,'""')}"` : str;
  }).join(";")).join("\r\n");
  triggerDownload(csv, `vahtahoz-sklad-${todayStr()}.csv`, "text/csv;charset=utf-8", "CSV сохранён");
}

/* ---------- Выгрузка в Excel ПО ФИЛЬТРАМ ---------- */
// статус срока позиции по ближайшей дате: "expired" (есть просрочка) > "soon" (≤14 дн) > "" (норма/без срока)
function _expiryStatus(it){
  const exps = (hasBatches(it) ? batchesOf(it).map(b=>b.expiry) : [it.expiry]).filter(Boolean);
  let st="";
  for(const e of exps){ const d=daysLeft(e); if(d===null) continue; if(d<0) return "expired"; if(d<=14) st="soon"; }
  return st;
}
function _hasAnyExpiry(it){ return (hasBatches(it) ? batchesOf(it).map(b=>b.expiry) : [it.expiry]).filter(Boolean).length>0; }
// пропускает позицию через выбранный фильтр
function _passExportFilter(s, f){
  if(f.type!=="all" && s.type!==f.type) return false;
  if(f.loc!=="all"  && !locationsOf(s).includes(f.loc)) return false;
  if(f.cats && f.cats.length && !f.cats.includes(s.category||"")) return false;
  const tq = totalQtyOf(s);
  if(f.stock==="in"   && !(tq>0)) return false;
  if(f.stock==="zero" && tq>0)    return false;
  if(f.stock==="low"){ const m=(s.minStock===""||s.minStock==null)?null:Number(s.minStock); if(m===null || !(tq<=m)) return false; }
  if(f.exp!=="all"){
    const st=_expiryStatus(s);
    if(f.exp==="expired" && st!=="expired") return false;     // только просрочка
    if(f.exp==="soon"    && st!=="soon")    return false;     // только «скоро» (просрочку не включаем — она в своём фильтре)
    if(f.exp==="valid"   && st==="expired") return false;     // без просрочки
    if(f.exp==="noexp"   && _hasAnyExpiry(s)) return false;   // без срока
  }
  return true;
}
// короткий человекочитаемый хвост для имени файла из выбранных фильтров
function _filterTag(f){
  const p=[];
  if(f.loc!=="all")  p.push(f.loc);
  if(f.type!=="all") p.push(typeMeta(f.type).short);
  if(f.cats && f.cats.length) p.push(f.cats.length<=2 ? f.cats.join(",") : `${f.cats.length} катег.`);
  if(f.exp==="expired") p.push("просрочка");
  else if(f.exp==="soon")  p.push("скоро");
  else if(f.exp==="valid") p.push("без просрочки");
  else if(f.exp==="noexp") p.push("без срока");
  if(f.stock==="in")   p.push("в наличии");
  else if(f.stock==="zero") p.push("нулевые");
  else if(f.stock==="low")  p.push("ниже минимума");
  return (p.join(" · ")||"склад").slice(0,80).replace(/[\/\\:*?"<>|]/g,"-");
}
// диалог выбора фильтров
function exportXlsxFiltered(){
  const locs = [...new Set(state.stock.flatMap(locationsOf))].filter(Boolean).sort((a,b)=>a.localeCompare(b,"ru"));
  const cats = [...new Set(state.stock.map(s=>s.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ru"));
  const opt = (v,l)=>`<option value="${esc(v)}">${esc(l)}</option>`;
  const sel = (id,label,opts)=>`<label class="block text-sm mb-1 opacity-80">${label}</label><select id="${id}" class="input mb-3">${opts}</select>`;
  openSheet(`
    <div class="font-bold text-lg mb-3">${ico("chart",19)} Выгрузка в Excel по фильтрам</div>
    ${sel("_fType","Тип склада", opt("all","Все")+visibleStockTypes().map(t=>opt(t.key,t.label)).join(""))}
    ${sel("_fLoc","Место хранения", opt("all","Все места")+locs.map(l=>opt(l,l)).join(""))}
    <label class="block text-sm mb-1 opacity-80">Категории (можно несколько; пусто = все)</label>
    <div class="flex flex-wrap gap-2 mb-3" id="_fCats">${cats.length?cats.map(c=>`<button class="chip" data-cat="${esc(c)}" onclick="${CHIP_TOGGLE}">${esc(c)}</button>`).join(""):'<span class="text-xs opacity-60">нет категорий</span>'}</div>
    ${sel("_fExp","Срок годности", opt("all","Все сроки")+opt("expired","Только просрочка")+opt("soon","Скоро (≤14 дней)")+opt("valid","Без просрочки")+opt("noexp","Без срока"))}
    ${sel("_fStock","Наличие", opt("all","Любой остаток")+opt("in","Только в наличии")+opt("zero","Только нулевые")+opt("low","Ниже минимума"))}
    <div class="flex gap-2 mt-2">
      <button class="btn btn-ghost flex-1" data-close>Отмена</button>
      <button class="btn btn-success flex-1" id="_fGo">Выгрузить</button>
    </div>
    <div class="text-xs opacity-60 mt-2">Лист со складом текущей базы по выбранным фильтрам. Работает офлайн (после первой загрузки Excel).</div>
  `);
  document.getElementById("_fGo").onclick = ()=>{ runFilteredXlsx(); };
}
// сборка и выгрузка отфильтрованного среза
async function runFilteredXlsx(){
  const val = id=>{ const e=document.getElementById(id); return e?e.value:"all"; };
  const cats = [...document.querySelectorAll("#_fCats .chip.active[data-cat]")].map(x=>x.dataset.cat);
  const f = { type:val("_fType"), loc:val("_fLoc"), cats, exp:val("_fExp"), stock:val("_fStock") };
  const list = sortedStock(state.stock).filter(s=>_passExportFilter(s,f));
  if(!list.length){ toast("Под фильтр ничего не попало"); return; }
  let XLSX;
  try{ XLSX = await ensureXlsx(); }
  catch(e){ toast(e.message||"Excel недоступен (нужна сеть в первый раз)"); return; }
  const rows = list.map(s=>{
    const st=_expiryStatus(s);
    return {
      "Тип": typeMeta(s.type).addLabel,
      "Категория": s.category||"",
      "Наименование": s.name,
      "Количество": totalQtyOf(s),
      "Ед. изм.": s.unit||"",
      "Мин. запас": _xlNum(s.minStock),
      "Срок годности": nearestExpiryOf(s)||"",
      "Состояние": st==="expired"?"просрочено":(st==="soon"?"скоро (≤14 дн)":""),
      "Место": locationsOf(s).join("; "),
      "Примечание": s.note||"",
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [{wch:10},{wch:22},{wch:40},{wch:10},{wch:8},{wch:10},{wch:14},{wch:16},{wch:18},{wch:30}];
  if(ws["!ref"]) ws["!autofilter"] = { ref: ws["!ref"] };   // автофильтр в Excel по шапке
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Склад (фильтр)");
  /* СНАЧАЛА закрываем лист фильтра, ПОТОМ сохраняем. Обратный порядок ломался с v250:
     saveXlsx при истёкшем жесте открывает лист «Файл готов», а идущий следом closeSheet()
     закрывал его же — вместе с _pendingSave (его чистит _sheetOnClose). Выгрузка по фильтру
     не давала ни файла, ни сообщения: человек жмёт «Выгрузить», и не происходит НИЧЕГО.
     Правило для новых вызовов: свой лист закрывать до save*, а не после. */
  closeSheet();
  saveXlsx(wb, `vahtahoz-${_filterTag(f)}-${todayStr()}.xlsx`, `Excel сохранён · ${list.length} поз.`);
}

// Универсальное сохранение файла. В НАТИВНЫХ обёртках (Capacitor iOS/Android WKWebView/WebView) обычный
// <a download>+Blob НЕ срабатывает (нет менеджера загрузок) → сначала пробуем Web Share API с файлом
// («Поделиться» → «Сохранить в Файлы»/отправить), и только затем классическое скачивание (браузеры/десктоп).
// ВАЖНО: вызывать синхронно из обработчика клика (без await до share) — иначе iOS снимет «жест» и share упадёт.
/* okMsg — тост об успехе печатает САМА функция, а не зовущий. Раньше зовущие делали
   `triggerDownload(...); toast("CSV сохранён")` в том же синхронном тике, то есть до того,
   как станет известно, чем кончился «Поделиться». Отмена шита («AbortError») приводила к
   `return true`, и человек читал «сохранён» про файл, которого нет, — а это ровно бэкап,
   на который потом рассчитывают. Теперь отмена говорит, что файл не сохранён.
   Про путь `<a download>` честнее сказать нельзя: браузер не сообщает, дошла ли запись,
   — там тост остаётся оптимистичным, как и был. */
// share нужен на МОБИЛЬНЫХ/тач (там download не работает в обёртках); на десктопе/Tauri оставляем обычное
// скачивание (иначе десктоп-веб получал бы лишний «Поделиться» вместо прямого сохранения).
function _saveMobileLike(){
  return (navigator.maxTouchPoints||0) > 0 || /iphone|ipad|ipod|android/i.test(navigator.userAgent||"");
}
async function saveBlob(blob, filename, okMsg){
  const mobileLike = _saveMobileLike();
  try{
    const file = new File([blob], filename, { type: blob.type || "application/octet-stream" });
    if(mobileLike && navigator.canShare && navigator.canShare({ files:[file] })){
      // Делимся ТОЛЬКО файлом. Вместе с title принимающее приложение получает ДВА объекта —
      // файл и текстовый элемент с заголовком, и «Сохранить в Файлы» кладёт оба: рядом с
      // накладной появлялся второй файл, в русской локали именованный «текст». Имя несёт сам
      // File, оно и так показывается в шите «Поделиться», так что ничего не теряем.
      await navigator.share({ files:[file] });
      if(okMsg) toast(okMsg);
      return true;   // пользователь сохранил/отправил — второй раз НЕ качаем
    }
  }catch(e){
    if(e && e.name==="AbortError"){
      // сам закрыл шит «Поделиться» — скачиванием НЕ дублируем и об успехе НЕ врём
      toast("Отменено — файл не сохранён");
      return false;
    }
    // иначе (не поддержано/не разрешено) — падаем на обычное скачивание
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
    if(okMsg) toast(okMsg);
    return true;
  }catch(e){ toast("Не удалось сохранить файл на этом устройстве"); return false; }
}
function triggerDownload(text, filename, mime, okMsg){
  return saveBlob(new Blob([text],{type:mime||"application/json"}), filename, okMsg);
}
// Excel через универсальный сейв (не XLSX.writeFile — он делает тот же не-работающий в обёртках download)
// ВАЖНО для зовущих: если у вас открыт свой лист — закрывайте его ДО вызова. После вызова нельзя:
// при истёкшем жесте saveXlsx сам открывает лист «Файл готов», и ваш closeSheet() убьёт его вместе
// с отложенным файлом (см. runFilteredXlsx — на этом уже обожглись).
function saveXlsx(wb, filename, okMsg){
  try{
    const X = window.XLSX;   // вызывается ПОСЛЕ ensureXlsx() в экспорт-функции → уже загружен
    if(!X){ toast("Excel ещё грузится — повторите"); return; }
    const buf = X.write(wb, { type:"array", bookType:"xlsx" });
    const blob = new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    /* ЖЕСТ МОГ УЖЕ ИСТЕЧЬ. Каждый экспорт в Excel идёт после `await ensureXlsx()`, и если
       xlsx.js пришлось тянуть по сети, к этому моменту transient user activation кончилась:
       `navigator.share` отвечает NotAllowedError, а фолбэк `<a download>` в Capacitor-обёртке
       молча ничего не делает — и раньше поверх этого печаталось «Excel сохранён». Это ровно
       та беда, которую для JSON-бэкапа уже закрыли шитом «Сохранить файл»: сохранение идёт
       СИНХРОННО из свежего клика по кнопке. Теперь тем же путём идёт и Excel.
       Окно узкое (xlsx.js лежит в PRECACHE сервис-воркера и со второго запуска берётся из
       кэша мгновенно, не теряя жест), поэтому и проверяем по факту, а не «на всякий случай»:
       жест жив — сохраняем сразу, как и прежде. */
    const gestureGone = !!(navigator.userActivation && navigator.userActivation.isActive === false);
    if(gestureGone && _saveMobileLike() && typeof navigator.share === "function"){
      offerFileSaveBlob(blob, filename, "Файл готов",
        "Excel собран. Нажмите «Сохранить файл» — иначе телефон не даст записать его на диск.", okMsg);
      return;
    }
    saveBlob(blob, filename, okMsg);
  }catch(e){ console.warn("saveXlsx", e); toast("Не удалось сформировать Excel"); }
}
/* ПОЛНЫЕ журналы базы из облака для бэкапа. Локальный state.journals после pull урезан до 500
   записей на вид (см. slice(0,500)), поэтому JSON-бэкап содержал лишь хвост истории движений —
   при этом «Все базы» подписан как «главный страховочный бэкап». Возвращает null, если облачного
   архива взять негде (локальная база / офлайн / сбой) — тогда зовущий предупреждает пользователя. */
async function fullCloudJournals(){
  const cid = activeCloudId();
  if(!(cid && cloud.ready && cloudOnline() && cloud.session && cloud.session.access_token)) return null;
  try{
    const rows = await cloudRestAll(`journal_entries?select=kind,data&base_id=eq.${encodeURIComponent(cid)}&order=id`, cloud.session.access_token, {timeout:120000});
    if(!Array.isArray(rows)) return null;
    const out = emptyJournals();
    rows.forEach(r=>{ if(r && r.data && out[r.kind]) out[r.kind].push(r.data); });
    for(const k in out) out[k].sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
    return out;
  }catch(e){ console.warn("fullCloudJournals → фолбэк на локальное", e); return null; }
}
/* Объединение журналов для бэкапа: локальные записи + облачный архив.
   ЗАМЕЩАТЬ облачным нельзя: если устройство неделю работало офлайн (или push упирался в 403),
   несинхронизированные движения в облаке отсутствуют — бэкап терял бы их ровно тогда, когда он нужнее
   всего. Приоритет у локальной версии записи (она может быть свежее), удалённые локально
   (state.delJr) не воскрешаем. */
function mergeJournalsForExport(cloudJ){
  const del = new Set(Array.isArray(state.delJr) ? state.delJr : []);
  const out = emptyJournals();
  for(const k of JOURNAL_KEYS){
    const seen = new Set();
    for(const op of (state.journals[k]||[])){ if(op){ if(op.id) seen.add(op.id); out[k].push(op); } }
    for(const op of (cloudJ[k]||[])){
      if(!op || !op.id || seen.has(op.id) || del.has(op.id)) continue;
      out[k].push(op);
    }
    out[k].sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
  }
  return out;
}
/* Сохранение файла ПОСЛЕ сетевого ожидания: transient user activation к этому моменту истекла,
   поэтому navigator.share даёт NotAllowedError, а фолбэк <a download> в Capacitor-обёртке молча
   ничего не делает — тост при этом говорил «сохранён». Ломался ровно главный страховочный бэкап.
   Решение: показываем шит с кнопкой, и сохранение идёт СИНХРОННО из её onclick — жест свежий. */
let _pendingSave = null;
function offerFileSave(text, filename, title, note){
  // «Файл сохранён», а не заголовок шита: «Бэкап готов» после записи читается как «ещё не записан».
  return offerFileSaveBlob(new Blob([text],{type:"application/json"}), filename, title, note, "Файл сохранён");
}
/* Тот же шит, но для готового Blob: XLSX собирается в двоичный буфер, текстом его не подсунешь.
   okMsg — что сказать, когда файл действительно уйдёт (печатает saveBlob). */
function offerFileSaveBlob(blob, filename, title, note, okMsg){
  _pendingSave = { blob, filename, okMsg: okMsg || title };
  openSheet(`
    <div class="font-bold text-xl mb-2">${esc(title)}</div>
    <div class="text-sm opacity-80 mb-4" style="line-height:1.5">${esc(note)}</div>
    <button class="btn btn-primary w-full" onclick="doPendingSave()">Сохранить файл</button>
    <button class="btn btn-ghost w-full mt-2" onclick="_pendingSave=null;closeSheet()">Отмена</button>`);
  /* Лист мог НЕ открыться: openSheet отказывает поверх экрана входа, а сюда мы приходим после
     ожидания облака (до 120 с) — за это время сессию могли отвергнуть. Тогда кнопки «Сохранить
     файл» нет, _pendingSave висит до конца сессии, файл не пишется и сообщения нет: владелец
     жмёт «Экспорт» и не получает НИЧЕГО. Ломался ровно главный страховочный бэкап (JSON).
     Сохраняем немедленно — жест уже потрачен, но это всё равно лучше молчания. */
  if(_sheetRefused){
    const p = _pendingSave; _pendingSave = null;
    if(p){ saveBlob(p.blob, p.filename, p.okMsg); }
    return false;
  }
  /* Лист закрывают не только кнопкой: тап по фону, Esc, следующий openSheet. Без этого содержимое
     файла висело в памяти до конца сессии, в том числе после АВАРИЙНОГО экспорта «по переполнению
     памяти», где лишние МБ особенно некстати. */
  _sheetOnClose = ()=>{ _pendingSave = null; };
  return true;
}
function doPendingSave(){
  const p = _pendingSave; _pendingSave = null;
  if(!p) return;
  closeSheet();
  // синхронно в обработчике клика → share/download работают; про исход говорит сам saveBlob
  saveBlob(p.blob, p.filename, p.okMsg);
}
/* opts.localOnly — писать файл СРАЗУ, без обращения к облаку. Нужно для аварийного экспорта при
   переполнении памяти: там последняя операция могла не лечь на диск, и откладывать запись файла
   на сетевой запрос (до 120 с) нельзя. */
async function exportData(opts){
  // экспорт ТОЛЬКО текущей базы (для обычного бэкапа/переноса одной базы)
  // у начальника (нет прав на задачи) «Задачи» не выгружаем
  const localOnly = !!(opts && opts.localOnly);
  const cid = activeCloudId();
  /* `_fileSafe`, а не голое имя базы. Локально имя проходит `cleanName40` и при создании, и при
     переименовании, так что практически сюда мусор не доезжает, — но имя базы приходит ещё и
     из облака (её мог назвать другой участник другой сборкой), а имя файла со слэшем или
     двоеточием часть систем режет молча: у человека вместо бэкапа не сохраняется ничего.
     Имена XLSX через `_fileSafe` шли давно, JSON-бэкап оставался единственным исключением. */
  const fname = `vahtahoz-${_fileSafe(activeProfileName())}-${todayStr()}.json`;
  const pack = (journals)=>{
    const base = journals ? { ...state, journals } : state;
    const out = isRestrictedUser() ? { ...base, tasks: [] } : base;
    return JSON.stringify(out,null,2);
  };
  // Локальная база или аварийный режим — жест жив, пишем немедленно.
  if(!cid || localOnly){
    triggerDownload(pack(null), fname, "application/json", localOnly && cid
      ? "Экспортировано БЕЗ облачного архива журнала (аварийный режим) — повторите онлайн для полной истории"
      : "Экспортировано (текущая база)");
    return;
  }
  toast("Подготовка бэкапа…");
  let full = await fullCloudJournals();                // полная история движений, а не хвост 500
  if(activeCloudId() !== cid) full = null;             // база сменилась за время загрузки
  const journals = full ? mergeJournalsForExport(full) : null;
  const cnt = journals ? JOURNAL_KEYS.reduce((n,k)=>n+(journals[k]||[]).length,0) : 0;
  offerFileSave(pack(journals), fname,
    full ? "Бэкап готов" : "Бэкап готов (журнал неполный)",
    full ? `База «${activeProfileName()}», записей журнала: ${cnt}. Нажмите «Сохранить файл».`
         : "Не удалось получить архив журнала из облака — в файле только последние записи. Для полной истории повторите при связи.");
}
function exportAllProfiles(){
  // полная резервная копия ВСЕХ баз в одном файле — главный страховочный бэкап
  // (iOS может очистить localStorage через ~7 дней простоя; этот файл восстанавливает всё)
  const damaged = [];
  const list = profiles.list.map(p=>{
    let st = null;
    if(p.id===profiles.activeId) st = state; // активная — из памяти (самое свежее)
    else {
      const raw = localStorage.getItem(slotKey(p.id));
      if(raw){ try{ st = JSON.parse(raw); }catch(e){ st = null; } }
    }
    if(st===null && p.id!==profiles.activeId) damaged.push(p.name);
    /* cloudId В ФАЙЛЕ. Без него полное восстановление давало базы, оторванные от облака: связь
       угадывалась только совпадением имени (cloudAutoLink), а после переименования не угадывалась
       вовсе — восстановленная база молча оставалась локальной. */
    return { id:p.id, name:p.name, cloudId: p.cloudId || null, state: st };
  });
  /* Признак неполноты теперь ФАКТИЧЕСКИЙ, а не «по виду». Раньше судили по длине (≥500 записей —
     значит, наверняка урезано), потому что pull всегда резал журнал до 500. Теперь pull держит всю
     историю, и «неполный» ставит ровно тот, кто реально что-то выбросил: аварийное сохранение при
     переполнении памяти или упор в JOURNAL_LOCAL_CAP. Ложных тревог на полном бэкапе больше нет,
     а настоящая неполнота по-прежнему названа вслух. */
  const truncNames = list.filter(x => x.state && x.state.journalsTrunc === true).map(x => x.name);
  const truncated = truncNames.length > 0;
  /* Задачи ОБЩИЕ для всех баз устройства (TASKS_KEY) и лежат ВНЕ слотов баз. Поэтому в файле им
     нужно отдельное поле: раньше они попадали в бэкап только «попутно», внутри state активной базы,
     а восстановление их не читало вовсе. version:2 — файл с полями cloudId и tasks; старые файлы
     (version:1) читаются по-прежнему, ветки восстановления это учитывают. */
  const payload = { __vahtahozProfiles:1, version:2, exportedAt:new Date().toISOString(), activeId: profiles.activeId,
    profiles:list, tasks: (isRestrictedUser() ? [] : (Array.isArray(state.tasks) ? state.tasks : [])),
    journalsMayBeTruncated: truncated };
  /* ОДНО сообщение, а не три подряд. #toast в приложении один, и toast() ЗАМЕЩАЕТ текст: прежние
     три вызова гасили друг друга в том же кадре, и предупреждение о неполном журнале не видел никто —
     на экране оставалось бодрое «Сохранены все базы». Здесь же названы КОНКРЕТНЫЕ базы: совет
     «сделайте экспорт текущей базы онлайн» чинил одну из восьми, а какую именно — не говорил.
     Обещания полноты не даём: в файле лежит всё, чего нет в облаке (см. _stateStorageJSON), а
     недостающий облачный архив возвращается сам при первой синхронизации. */
  const parts = [`Сохранены все базы (${list.length})`];
  if(damaged.length){ console.warn("Повреждённые/пустые базы:", damaged); parts.push(`без данных: ${damaged.join(", ")}`); }
  if(truncated) parts.push(`журнал на диске неполный (${truncNames.join(", ")}) — в файле есть всё, чего нет в облаке, а облачный архив вернётся при первой связи`);
  /* Сообщение собирается ДО сохранения и уходит в saveBlob: он печатает его, только если файл
     действительно ушёл. Отменили «Поделиться» — читаем «Отменено», а не «Сохранены все базы». */
  triggerDownload(JSON.stringify(payload,null,2), `vahtahoz-ВСЕ-БАЗЫ-${todayStr()}.json`,
                  "application/json", parts.join(". "));
}
/* ОБЩИЙ КАТАЛОГ: добавить во ВСЕ базы устройства те наименования (тип+имя+ед.), которых там нет,
   с количеством 0. Существующие позиции, остатки, места, сроки, партии НЕ трогаются. */
async function mergeCatalogs(){
  /* Права смотрим по АКТИВНОЙ базе — это приближение (функция дописывает наименования во все базы
     устройства), но совпадает с тем, что видит человек: кнопка живёт в настройках активной базы.
     Серверный рубеж на месте и здесь: каждая база уезжает в облако своим push-ом под RLS
     has_perm(base_id,'edit_stock'), поэтому без прав каталог не станет общим ни в одной базе. */
  if(!ensureCanEdit()) return;
  const bases = profiles.list.map(p=>({
    p, active: p.id===profiles.activeId,
    st: p.id===profiles.activeId ? state : (()=>{ try{ return JSON.parse(localStorage.getItem(slotKey(p.id))||"null"); }catch(_){ return null; } })()
  })).filter(b=> b.st && Array.isArray(b.st.stock));
  if(bases.length<2){ toast("Нужно минимум 2 базы на этом устройстве"); return; }
  const keyOf = s => `${s.type}|${(s.name||"").trim().toLowerCase()}`;
  const catalog = new Map();   // union: type|имя → {type,name,unit}
  for(const b of bases) for(const s of b.st.stock){
    const k = keyOf(s);
    if(s.name && !catalog.has(k)) catalog.set(k, { type:s.type, name:s.name, unit:s.unit||"шт" });
  }
  let willAdd = 0;
  for(const b of bases){
    const have = new Set(b.st.stock.map(keyOf));
    for(const k of catalog.keys()) if(!have.has(k)) willAdd++;
  }
  if(willAdd===0){ toast("Каталоги уже одинаковы"); return; }
  const ok = await confirmSheet(`Объединить наименования: добавить ${willAdd} позиций (с нулём) туда, где их нет? Остатки/места/сроки не меняются.`,{yes:"Объединить"});
  if(!ok) return;
  let added=0; const failed=[]; let quotaHit=false;
  for(const b of bases){
    if(b.active) b.st = state;   // снимок снят ДО await — за время диалога глобальный state мог быть переназначен (storage-событие); берём живой
    const have = new Set(b.st.stock.map(keyOf));
    for(const [k,c] of catalog){
      if(!have.has(k)){ b.st.stock.push(catalogItem(c.type, c.name, c.unit)); added++; }
    }
    /* Записалось ли на самом деле. Раньше сбой записи слота проглатывался пустым catch, а базу
       всё равно помечали dirty: тост рапортовал «добавлено N наименований», в базе не появлялось
       ничего, зато она значилась несинхронизированной и при открытии гнала полный push старых
       данных. Теперь считаем реально записанные и говорим правду. */
    let written = true;
    if(b.active) saveState();
    else {
      try{ localStorage.setItem(slotKey(b.p.id), JSON.stringify(b.st)); }
      catch(e){ written=false; failed.push(b.p.name||"без имени"); if(isQuotaErr(e)) quotaHit=true; }
    }
    if(written && b.p.cloudId){ markDirty(b.p.cloudId); }   // к выгрузке в облако
  }
  render();
  const cid = activeCloudId();
  if(cid && cloud.ready) setTimeout(()=>{ cloudActivate(cid).catch(e=>console.warn(e)); }, 50);   // активную — сразу в облако
  if(failed.length){
    toast(`Добавлено ${added} наименований, но не хватило места — базы не обновлены: ${failed.join(", ")}`);
    if(quotaHit) _quotaBlock("⛔ Не хватило места на телефоне — часть баз не обновлена");
  } else {
    toast(`Готово: добавлено ${added} наименований. Остальные базы обновятся при открытии.`);
  }
}
/* каталожная позиция-«заготовка» (только наименование, без остатка/мест/сроков) */
function catalogItem(type, name, unit){
  return { id:uid(), type, name, qty:0, unit:unit||"шт", minStock:"", expiry:"", location:"", category:"", note:"", createdAt:new Date().toISOString() };
}
/* АВТО-РАСПРОСТРАНЕНИЕ наименования на ОСТАЛЬНЫЕ базы (их слоты), с qty 0.
   add → добавить, если нет; rename (oldName→name) → переименовать совпадение (или добавить).
   Остатки/места/сроки других баз не трогаются. Базы помечаются к выгрузке в облако. */
function propagateName(type, name, unit, oldName){
  const norm = s => (s||"").trim().toLowerCase();
  for(const p of profiles.list){
    if(p.id===profiles.activeId) continue;          // активную уже изменили
    let st; try{ st = JSON.parse(localStorage.getItem(slotKey(p.id))||"null"); }catch(_){ st=null; }
    if(!st || !Array.isArray(st.stock)) continue;
    const exists = st.stock.some(s=>s.type===type && norm(s.name)===norm(name));
    let changed=false;
    if(oldName && norm(oldName)!==norm(name)){
      const it = st.stock.find(s=>s.type===type && norm(s.name)===norm(oldName));
      if(it && !exists){ it.name=name; changed=true; }       // переименовать совпадение
      else if(!exists){ st.stock.push(catalogItem(type,name,unit)); changed=true; }  // не нашли — добавить
    } else if(!exists){
      st.stock.push(catalogItem(type,name,unit)); changed=true;   // новое имя — добавить
    }
    if(changed){
      // dirty ставим ТОЛЬКО если слот действительно записался: иначе база числилась бы
      // несинхронизированной без единой новой правки и гнала бы полный push старых данных
      let ok=true;
      try{ localStorage.setItem(slotKey(p.id), JSON.stringify(st)); }
      catch(e){ ok=false; console.warn("propagateName: слот не записан", p.name, e); if(isQuotaErr(e)) _quotaBlock(); }
      if(ok && p.cloudId) markDirty(p.cloudId);
    }
  }
}
async function importAllProfiles(payload){
  const incoming = (payload.profiles||[]).filter(p=>p && p.state && typeof p.state==="object");
  if(!incoming.length){ toast("В файле нет баз"); return; }
  const mode = await chooseSheet(
    `Резервная копия: ${incoming.length} баз. Что сделать?`,
    [
      { label:"Заменить ВСЕ базы (полное восстановление)", value:"replace", color:"btn-danger" },
      { label:"Добавить как новые базы (к текущим)",        value:"append",  color:"btn-primary" },
    ]
  );
  if(!mode) return;
  // нормализуем (валидируем) состояние каждой базы — кривые пропускаем
  const norm = [];
  for(const p of incoming){
    let st;
    try{ st = validateImport(structuredClone(p.state)); }
    catch(e){ console.warn("Пропущена база", p.name, e); continue; }
    if(isRestrictedUser()) st.tasks = [];   // начальник: «Задачи» из файла не импортируем
    // cloudId несём через нормализацию: без него восстановленная база теряет связь с облаком
    norm.push({ name: cleanName40(p.name||"База") || "База", state: st,
                cloudId: (typeof p.cloudId==="string" && p.cloudId) ? p.cloudId : null });
  }
  if(!norm.length){ toast("Не удалось прочитать базы из файла"); return; }
  /* ЧУЖАЯ СВЯЗЬ С ОБЛАКОМ. Файл бэкапа — обычный JSON, его пришлют в мессенджере, скопируют с
     чужого телефона, подсунут по ошибке. Молча привязывать устройство к базе, которой этот
     пользователь вообще не видит, нельзя: RLS его туда не пустит, а человек получит базу, которая
     «вечно не синхронизируется», без единого объяснения. Сверяем со списком ВИДИМЫХ баз ровно там,
     где он достоверно загружен (cloud.basesLoaded); офлайн-восстановление на чистом телефоне — до
     входа — по-прежнему переносит связь, иначе главный сценарий («телефон утопили») перестанет
     работать. Данные баз при этом не выбрасываются: теряется только привязка. */
  if(cloud.ready && cloud.basesLoaded){
    const _seen = Object.assign({}, cloud.bases||{});
    (cloud.members||[]).forEach(m=>{ if(m && m.base_id) _seen[m.base_id]=_seen[m.base_id]||true; });
    const _dropped = [];
    for(const p of norm){
      if(p.cloudId && !(p.cloudId in _seen)){ _dropped.push(p.name); p.cloudId = null; }
    }
    if(_dropped.length) toast(`Связь с облаком не перенесена (нет доступа к этим базам): ${_dropped.join(", ")}. Данные восстановлены как локальные`);
  }

  if(mode==="replace"){
    /* ПОДТВЕРЖДЕНИЕ ГОВОРИТ ВСЮ ПРАВДУ. Раньше в нём были только «базы», а по факту операция меняет
       ещё и общие для устройства «Задачи» (они живут вне слотов баз) и запускает разговор с облаком.
       Человек нажимал «Заменить всё», думая про склад, и терял список задач без единого слова. */
    const _willTasks = !isRestrictedUser() && (Array.isArray(payload.tasks)
      ? payload.tasks.length > 0
      : incoming.some(p=>p && p.state && Array.isArray(p.state.tasks) && p.state.tasks.length));
    const _anyCloud = norm.some(p=>p.cloudId);
    const ok = await confirmSheet(
      `Заменить все текущие базы на ${norm.length} из файла? Текущие данные будут стёрты.`
      + (_willTasks ? `\n\n«Задачи» — они общие для всего телефона — тоже будут заменены списком из файла. Этот список уедет в облако и заменит задачи на других ваших устройствах.` : "")
      + (_anyCloud ? `\n\nПо общим (облачным) базам приложение спросит отдельно, чьи данные оставить главными — с телефона или из облака.` : ""),
      {danger:true,yes:"Заменить всё"});
    if(!ok) return;
    // АТОМАРНО: сначала пишем ВСЕ новые слоты (id свежие, со старыми не конфликтуют),
    // и только если все записи прошли — удаляем старые и фиксируем. Иначе откатываем
    // частично записанное, старые данные остаются нетронутыми (защита от QuotaExceeded).
    const newList = []; let activeId = null; const writtenKeys = [];
    const _seenCloud = new Set();   // один cloudId — одна база: два слота на одну облачную базу дают гонку push/pull
    try{
      norm.forEach((p,i)=>{
        const id = uid();
        if(i===0) activeId = id;
        const ent = { id, name: p.name };
        if(p.cloudId && !_seenCloud.has(p.cloudId)){ ent.cloudId = p.cloudId; _seenCloud.add(p.cloudId); }
        newList.push(ent);
        const key = slotKey(id);
        localStorage.setItem(key, JSON.stringify(p.state)); // бросит при переполнении
        writtenKeys.push(key);
      });
    }catch(e){
      console.error("importAllProfiles replace failed:", e);
      for(const k of writtenKeys){ try{ localStorage.removeItem(k); }catch(_){} } // откат
      toast("Не хватило места — восстановление отменено, старые базы целы");
      return;
    }
    // все новые слоты на месте — теперь безопасно удалить старые и переключить активную
    const oldProfs = profiles.list.slice();   // старые базы (с cloudId) — для чистки осиротевших sync-маркеров
    const oldIds = oldProfs.map(p=>p.id);
    // ПОРЯДОК ВАЖЕН: сначала перевести «живой» STORE_KEY и список баз, убедиться, что ОБЕ записи
    // прошли, и только потом удалять старые слоты. Раньше сбой записи STORE_KEY лишь печатался в
    // консоль: PROFILES_KEY указывал на восстановленную базу, а STORE_KEY содержал данные СТАРОЙ
    // активной — пользователь видел старую базу под новым именем, восстановленный слот сиротел,
    // а для облачной базы этот чужой state уходил в push под её cloudId (suspectWipe ловит только
    // усыхание >90%, при сопоставимом числе позиций молчит).
    const prevLive = (()=>{ try{ return localStorage.getItem(STORE_KEY); }catch(_){ return null; } })();
    let live = false, listed = false;
    try{
      const raw = localStorage.getItem(slotKey(activeId));
      if(raw != null){ localStorage.setItem(STORE_KEY, raw); live = true; }
    }catch(e){ console.error("restore: STORE_KEY", e); }
    if(live) listed = saveProfiles({ activeId, list: newList });
    if(!live || !listed){
      for(const k of writtenKeys){ try{ localStorage.removeItem(k); }catch(_){} }   // откат новых слотов
      if(prevLive != null){ try{ localStorage.setItem(STORE_KEY, prevLive); }catch(_){} }
      saveProfiles(profiles);                                                        // profiles ещё хранит СТАРЫЙ список
      toast("Не хватило места — восстановление отменено, старые базы целы");
      return;
    }
    for(const id of oldIds){ if(id!==activeId){ try{ localStorage.removeItem(slotKey(id)); }catch(_){} } }
    for(const op of oldProfs){ if(op.cloudId) clearBaseSyncKeys(op.cloudId); }   // dirty + снимки подписей старых баз не нужны
    /* ЗАДАЧИ. Они общие для устройства и живут в TASKS_KEY — вне слотов баз, которые мы только что
       переписали. Раньше их не трогали вообще: «полное восстановление» оставляло на телефоне
       задачи, которые были там ДО восстановления, а задачи из бэкапа исчезали без единого слова.
       Новые файлы (version:2) несут их отдельным полем; в старых берём задачи той базы, которая
       была активной при выгрузке, — именно туда TASKS_KEY попадал попутно. Сбой записи не
       откатывает восстановление склада (он уже успешен), но и не молчит. */
    let _tasks = null;
    if(Array.isArray(payload.tasks)) _tasks = payload.tasks;
    else {
      const _src = incoming.find(p=>p && p.id && payload.activeId && p.id===payload.activeId) || incoming[0];
      if(_src && _src.state && Array.isArray(_src.state.tasks)) _tasks = _src.state.tasks;
    }
    if(isRestrictedUser()) _tasks = null;   // начальник: «Задачи» из файла не восстанавливаем (как и при обычном импорте)
    /* ЧУЖИЕ ЗАДАЧИ — ПЕРВЫЙ РУБЕЖ. Задачи в облаке принадлежат аккаунту (RLS: owner_id=auth.uid()).
       Если на этом телефоне лежат задачи ДРУГОГО работника (TASKS_OWNER), то и файл, скорее всего,
       его — «восстановить» их под собой значит увести чужие задачи в свой аккаунт. Второй рубеж
       (cloudSyncTasks) на месте, но здесь дешевле: чужое просто не попадает в хранилище. */
    let _tasksSkipped = false;
    if(_tasks){
      const _me = (typeof activeUid==="function") ? activeUid() : null;
      let _own = null; try{ _own = localStorage.getItem(TASKS_OWNER); }catch(_){}
      if(_own && _me && _own!==_me){ _tasks = null; _tasksSkipped = true; }
    }
    let _tasksOk = true;
    if(_tasks){
      try{
        localStorage.setItem(TASKS_KEY, JSON.stringify(_tasks));
        /* СНИМОК ПОДПИСЕЙ ЗАДАЧ ОБНУЛЯЕМ. Выгрузка считает УДАЛЁННЫМИ те задачи, что есть в снимке,
           но отсутствуют локально. Снимок описывает облако на момент последнего синка, а в бэкапе
           задач заведомо меньше — он снят раньше. Без обнуления восстановление старого файла
           отправляло в облако `delete tasks` на всё, что появилось после его даты, и стирало это
           на ВСЕХ устройствах владельца. Пустой снимок = «дельта против пустоты»: выгружаем всё из
           файла, не удаляем ничего, остальное вернётся ближайшим pull (объединение, не замена).
           Важно: чиним именно СНИМКОМ, а не новым флагом, — тогда так же безопасно ведёт себя и
           старая версия приложения, если она поднимется из кэша раньше новой. */
        _clearTasksSig();
        /* Помечаем к выгрузке. Без dirty ближайший cloudSyncTasks увидел бы «локально грязного нет»
           и подтянул облачную версию поверх только что восстановленной — восстановление задач
           отменялось бы само собой. */
        try{ localStorage.setItem(TASKS_DIRTY, "1"); }catch(_){}
      }catch(e){ console.error("restore: TASKS_KEY", e); _tasksOk = false; }
    }
    toast(!_tasksOk    ? "Базы восстановлены, но задачи записать не удалось — не хватило места"
        : _tasksSkipped ? "Базы восстановлены. Задачи из файла НЕ восстановлены: на этом телефоне они закреплены за другим работником"
        : "Восстановлено. Перезагрузка…");
    setTimeout(()=>location.reload(), 600);
  } else {
    // Профиль попадает в список ТОЛЬКО после успешной записи слота. Раньше он добавлялся
    // безусловно, а сбой записи лишь печатался в консоль: тост рапортовал «Добавлено баз: N»,
    // а при переключении switchProfile видел отсутствующий слот и подставлял freshProfileState —
    // пустая база без предупреждения, к тому моменту файл бэкапа мог быть уже удалён.
    const failed = []; let added = 0;
    for(const p of norm){
      let nm = p.name, n = 2;
      while(profiles.list.some(x=>x.name.toLowerCase()===nm.toLowerCase())){ nm = `${p.name} (${n++})`; }
      const id = uid();
      try{
        localStorage.setItem(slotKey(id), JSON.stringify(p.state));
        // «Добавить как новые базы» — именно НОВЫЕ, локальные: cloudId из файла тут НЕ переносим,
        // иначе добавленная копия перехватила бы синхронизацию у уже привязанной базы бригады.
        profiles.list.push({ id, name: nm });
        added++;
      }catch(e){ console.error("import: слот базы не записан", e); failed.push(p.name); }
    }
    saveProfiles(profiles);
    if(failed.length) toast(`Добавлено баз: ${added}. НЕ хватило места: ${failed.join(", ")}`);
    else toast(`Добавлено баз: ${added}`);
    render(); openProfilesSheet();
  }
}
function importData(ev){
  /* КЛИЕНТСКАЯ проверка, и она НЕ заменяет серверную. Настоящий рубеж — RLS: stock_items и
     journal_entries принимают запись только под has_perm(base_id,'edit_stock'), а has_perm требует
     ещё и base_members.active — то есть снятый со смены не запишет ничего, даже позвав importData
     из консоли. Проверено по политикам в supabase/migrations (снимок RBAC + тело has_perm).
     Здесь проверка нужна за другим: чтобы не давать простого пути (локальные данные всё равно
     менялись, а участник бригады видел бы у себя чужой импорт до следующего pull) и чтобы поведение
     совпадало с интерфейсом, где у роли без прав правка недоступна. */
  /* ДВЕ РАЗНЫЕ ОПЕРАЦИИ — ДВА РАЗНЫХ ПРАВИЛА, поэтому проверка прав ушла внутрь, после разбора файла.
     • «накладная» (обычный файл) кладётся В АКТИВНУЮ базу и уезжает бригаде → право правки на базе;
     • «Заменить ВСЕ базы» переписывает ЛОКАЛЬНЫЕ базы устройства (в облако при этом ничего не
       выгружается: восстановленные базы не помечаются dirty, cloudActivate тянет облако или явно
       спрашивает). Это операция уровня телефона, а не облачной базы. Гейт по праву правки на
       АКТИВНОЙ облачной базе закрывал её ровно тогда, когда она и нужна: снятому со смены при
       пересменке, когда телефон и переставляют. Обходить его переключением на локальную базу
       человек не обязан. Остаётся ролевое ограничение (isRestrictedUser) — оно про роль, а не про
       смену, — и серверный рубеж RLS, который никуда не девается. */
  const f = ev.target.files[0]; if(!f){ try{ ev.target.value = ""; }catch(_){} return; }
  const inputEl = ev.target;
  const r = new FileReader();
  r.onload = async () => {
    inputEl.value = ""; // чтобы можно было повторно выбрать тот же файл
    try{
      const parsed = JSON.parse(r.result);
      // резервная копия ВСЕХ баз — отдельная ветка восстановления (право уровня телефона)
      if(parsed && parsed.__vahtahozProfiles && Array.isArray(parsed.profiles)){
        if(isRestrictedUser()){ toast("Восстановление всех баз недоступно для вашей роли"); return; }
        await importAllProfiles(parsed);
        return;
      }
      // всё остальное — правка АКТИВНОЙ базы: тут право на базе обязательно
      if(!ensureCanEdit()) return;
      if(!canImportToBase()){ toast("Восстановление из файла в общую базу — только у начальника участка и выше"); return; }
      const obj = validateImport(parsed);
      if(isRestrictedUser()) obj.tasks = [];   // начальник: «Задачи» из файла не импортируем
      /* «Заменить всё» на ОБЛАЧНОЙ базе убрано совсем. Это была единственная кнопка, которая
         молча удаляла у всей бригады позиции, которых нет в файле, — включая приходы, внесённые
         после даты файла, — и отменить это на сервере нечем (следующий push уже уехал). Отдельного
         сценария под неё нет: недостающее добирает «Объединить», лишнее удаляется по позициям, а
         восстановление базы целиком после аварии идёт через облако (см. cloudResolveWipe).
         На ЛОКАЛЬНОЙ базе замена осталась: там файл переписывает только этот телефон. */
      const _cloudBase = !!activeCloudId();
      const _opts = [{ label:"Объединить (без дублей)", value:"merge", color:"btn-primary" }];
      if(!_cloudBase) _opts.push({ label:"Заменить всё", value:"replace", color:"btn-danger" });
      const mode = await chooseSheet(
        _cloudBase
          ? `Найдено ${(obj.stock||[]).length} поз. Позиции из файла будут добавлены в общую базу; ничего не удаляется.`
          : `Найдено ${(obj.stock||[]).length} поз. Что делать?`,
        _opts
      );
      if(!mode) return;
      if(mode==="replace" && _cloudBase) return;   // страховка: в облаке замены нет
      const base = mode==="replace" ? structuredClone(defaultState) : state;
      const merged = mode==="replace" ? { ...base, ...obj } : structuredClone(state);
      // категории
      const catBase = base.categories || structuredClone(defaultState).categories;
      if(obj.categories){
        merged.categories = {};
        for(const k of STOCK_TYPE_KEYS){
          merged.categories[k] = Array.from(new Set([...(catBase[k]||[]), ...(obj.categories[k]||[])]));
        }
      } else {
        merged.categories = catBase;
      }
      // сток
      const norm = s => (s||"").toString().toLowerCase().replace(/\s+/g," ").trim();
      if(mode==="replace"){
        merged.stock = obj.stock||[];
      } else {
        // матчинг с unit: type|cat|name|unit, затем type|name|unit (не сливать кг+шт)
        const unitKey = (u)=> _impUnitKey(u) || "шт";
        const strict = new Map(); // type|cat|name|unit
        const loose  = new Map(); // type|name|unit -> массив кандидатов
        const looseAdd = (lk,it)=>{ if(!loose.has(lk)) loose.set(lk,[]); loose.get(lk).push(it); };
        (merged.stock||[]).forEach(it=>{
          const uk = unitKey(it.unit);
          strict.set(`${it.type}|${norm(it.category)}|${norm(it.name)}|${uk}`, it);
          looseAdd(`${it.type}|${norm(it.name)}|${uk}`, it);
        });
        let added=0, updated=0;
        /* Снимок карточки для ответа «а изменилось ли хоть что-нибудь». Нужен из-за правила
           «берём НАИБОЛЬШЕЕ количество» (см. ниже): попытка скорректировать остаток ВНИЗ стала
           пустой операцией, но всё равно попадала в счётчик — «Объединить» рапортовал
           «+0, обновлено: 1», не изменив ровным счётом ничего, и человек шёл искать несуществующую
           правку. Заодно не переписываем updatedAt впустую: неизменная позиция иначе выглядела
           тронутой и уезжала в облако при каждом импорте одного и того же файла. */
        const _mSnap = it => JSON.stringify([it.qty, it.expiry||"", it.location||"", it.unit||"",
          it.category||"", it.note||"", (it.batches||[]).map(b=>[b.id,b.qty,b.expiry||"",b.location||"",b.note||""])]);
        (obj.stock||[]).forEach(src=>{
          const t = src.type||"product";
          const uk = unitKey(src.unit);
          const key = `${t}|${norm(src.category)}|${norm(src.name)}|${uk}`;
          const looseKey = `${t}|${norm(src.name)}|${uk}`;
          let found = strict.get(key);
          if(!found){
            const cands = loose.get(looseKey) || [];
            found = cands.find(c=> !norm(c.category)) || (norm(src.category) ? null : cands[0]) || null;
          }
          if(found){
            const _mBefore = _mSnap(found);
            // Слияние batches: если у src есть партии — добавляем их к found с новыми id
            // (если у found ещё нет batches, но был qty>0 — остаток переносится партией ПОСЛЕ дедупа, см. ниже)
            if(Array.isArray(src.batches) && src.batches.length){
              if(!Array.isArray(found.batches)) found.batches = [];
              // локальный СКАЛЯРНЫЙ остаток (карточка без партий) — переносим его в партию не здесь, а после дедупа
              const _scalarBefore = found.batches.length===0 ? roundQty(found.qty||0) : 0;
              /* Дедуп партий в ДВА рубежа.
                 (1) по id — нормальный бэкап: id в файле есть и не меняется, повторный импорт узнаёт партию.
                 (2) СЧЁТНЫЙ по подписи (qty|expiry|location|note) — второй рубеж, обязателен.
                     Полагаться на один только id нельзя: validateImport → sanitizeBatches делает
                     id: safeId(b.id), а safeId при отсутствующем/битом id ЧЕКАНИТ НОВЫЙ uid при каждом
                     чтении файла. Значит для руками-правленого/очень старого/битого бэкапа id при
                     каждом импорте разный, дедуп по id мимо — и три «Объединить» подряд давали
                     2→4→6 партий, 50→100→150 кг, то есть склад раздувался без границы.
                     Но и безусловный дедуп по подписи (как было здесь) неверен: он склеивал ДВЕ
                     реально разные партии «25 кг, без срока, Склад А» (два мешка) в одну и молча терял
                     половину остатка. Поэтому СЧЁТ: сколько партий с такой подписью уже лежит
                     локально — ровно столько же одинаковых из файла пропускаем, остальные добавляем.
                     Первый импорт двух одинаковых мешков даёт оба; повторный не добавляет ничего.
                     В счёт идут ТОЛЬКО партии, которых нет в файле по id, иначе одна и та же локальная
                     партия расходует подпись дважды и съедает реально новую (локально два мешка по
                     25 кг, в файле те же два + третий с другого телефона → должно стать 75/3). */
              const sig = b => `${roundQty(b.qty||0)}|${b.expiry||""}|${b.location||""}|${b.note||""}`;
              const existingIds = new Set(found.batches.map(b=>b.id).filter(Boolean));
              const srcIds = new Set(src.batches.map(b=> b && b.id).filter(Boolean));
              const sigLeft = new Map();   // подпись -> сколько таких партий УЖЕ лежит локально и НЕ опознано по id
              found.batches.forEach(b=>{ if(b.id && srcIds.has(b.id)) return; const s=sig(b); sigLeft.set(s, (sigLeft.get(s)||0)+1); });
              for(const b of src.batches){
                if(b.id && existingIds.has(b.id)) continue;
                const s = sig(b);
                const n = sigLeft.get(s)||0;
                if(n>0){ sigLeft.set(s, n-1); continue; }   // такая партия уже есть — не двоим
                // id партии СОХРАНЯЕМ (если он есть) — иначе повторный импорт снова не узнает её
                found.batches.push({
                  id: b.id || uid(), qty: roundQty(b.qty||0),
                  expiry: b.expiry||"", location: b.location||"",
                  note: b.note||"", createdAt: b.createdAt||new Date().toISOString()
                });
                if(b.id) existingIds.add(b.id);
              }
              /* ЛОКАЛЬНЫЙ СКАЛЯР ПРОТИВ ПАРТИЙ ИЗ ФАЙЛА — ТОЖЕ СНИМОК, А НЕ ПРИХОД.
                 Раньше остаток карточки без партий (10 кг «Муки») переносился в партию БЕЗУСЛОВНО,
                 до слияния, и партии из файла добавлялись сверху: локально 10 + в файле партия
                 10 = 20 кг из воздуха. Воспроизведено на v246 (локальная база, «Объединить»):
                 qty 10 → 20, две партии по 10. Сценарий обыденный — на одном телефоне кладовщик
                 завёл партии, на другом та же позиция осталась скаляром, обменялись бэкапом.
                 Правило то же, что в соседних ветках: файл — СНИМОК склада. Партии из файла и есть
                 остаток этой позиции; локальный скаляр добирает только НЕДОСТАЧУ сверх них.
                 10 и 10 → 10; локально 40, в файле 25 → 40 (партии из файла + 15 остатком);
                 локально 5, в файле 25 → 25.
                 Перенос идёт ПОСЛЕ дедупа намеренно: пока он делался до, перенесённая партия
                 попадала в счёт подписей и могла съесть настоящую партию из файла с такой же
                 подписью (после обмена бэкапами «Перенос исходного остатка» лежит и в файле). */
              if(_scalarBefore > 0){
                const _fromFile = found.batches.reduce((a,b)=> a + roundQty(b.qty||0), 0);
                const need = roundQty(_scalarBefore - _fromFile);
                if(need > 0){
                  found.batches.push({
                    id: uid(), qty: need,
                    expiry: found.expiry||"", location: found.location||"",
                    note: "Перенос исходного остатка", createdAt: found.createdAt||new Date().toISOString()
                  });
                }
              }
              syncItemFromBatches(found);
            } else if(hasBatches(found)){
              /* src БЕЗ партий, а found уже партийный: прямая прибавка к qty была бы стёрта
                 syncItemFromBatches, поэтому остаток из файла клали отдельной партией — и он
                 добавлялся на КАЖДОМ импорте одного и того же файла (5 → 12 → 19 → 26 …).
                 Правило то же, что в соседней ветке без партий (см. её комментарий): файл —
                 СНИМОК, а не приход, поэтому добираем только НЕДОСТАЧУ до количества из файла.
                 Первый импорт «локально 5, в файле 7» даёт партию на 2 (итог 7), повторный — ничего. */
              const need = roundQty(roundQty(src.qty||0) - roundQty(totalQtyOf(found)));
              if(need > 0){
                found.batches.push({
                  id: uid(), qty: need,
                  expiry: src.expiry||"", location: src.location||"",
                  note: "Импорт (объединение)", createdAt: new Date().toISOString()
                });
                syncItemFromBatches(found);
              }
            } else {
              /* Обычное слияние. СКЛАДЫВАТЬ количество нельзя: JSON-бэкап — это СНИМОК склада, а не
                 накладная, и один и тот же файл, импортированный трижды, давал 10 → 20 → 30 кг у
                 карточки БЕЗ партий (то есть у всего, что заведено через «＋ Продукт» без «Новой
                 партии», — у основной массы базы). Дедуп выше прикрывает только партии, а тут
                 прикрывать нечем: у скалярного остатка нет ни id, ни подписи, по которым его можно
                 узнать во второй раз. Поэтому берём НАИБОЛЬШЕЕ известное количество: повторный
                 импорт ничего не меняет, «Объединить» по-прежнему ничего не удаляет, а склад не
                 раздувается без границы.
                 Настоящий ПРИХОД товара идёт другим путём — «Импорт накладной» (importReceiptFiles),
                 где сложение и есть правильная семантика; эта правка его не касается.
                 Цена решения: слияние ДВУХ РАЗНЫХ баз с одинаковыми наименованиями (10 кг + 4 кг)
                 даст 10, а не 14 — недосчёт виден на экране сразу, в отличие от тихого раздувания. */
              found.qty = Math.max(roundQty(found.qty||0), roundQty(src.qty||0));
              if(!found.expiry && src.expiry) found.expiry = src.expiry;
              if(!found.location && src.location) found.location = src.location;
            }
            if(!found.unit && src.unit) found.unit = src.unit;
            const catChanged = !found.category && src.category;
            if(catChanged) found.category = src.category;
            if(!found.note && src.note) found.note = src.note;
            // переиндексация strict, если категорию только что заполнили
            if(catChanged) strict.set(`${found.type}|${norm(found.category)}|${norm(found.name)}|${unitKey(found.unit)}`, found);
            if(_mSnap(found) !== _mBefore){ found.updatedAt = new Date().toISOString(); updated++; }
          } else {
            merged.stock.push({...src, id: src.id || uid()});
            const added_it = merged.stock[merged.stock.length-1];
            strict.set(key, added_it);
            looseAdd(looseKey, added_it);
            added++;
          }
        });
        toast(`+${added}, обновлено: ${updated}`);
      }
      if(mode==="replace"){
        // Задачи ОБЩИЕ для всех баз устройства (TASKS_KEY), а импортируется ОДНА база — заменять их
        // файлом нельзя: правки по другим базам исчезли бы локально и ушли в облако как удаление.
        // Диалог «Заменить всё» обещает замену данных БАЗЫ, про задачи в нём ничего нет.
        merged.tasks = Array.isArray(state.tasks) ? state.tasks : [];
        merged.log = obj.log||[];
        merged.journals = obj.journals || emptyJournals();
        merged.checklists = obj.checklists || merged.checklists;
        merged.theme = obj.theme || base.theme;
      } else {
        // merge: объединяем по id, без дублей
        const mergeById = (a=[], b=[]) => {
          const ids = new Set((a||[]).map(x=>x.id));
          return [...(a||[]), ...(b||[]).filter(x=>!ids.has(x.id))];
        };
        merged.tasks = mergeById(merged.tasks||[], obj.tasks||[]);
        merged.log   = mergeById(merged.log||[],   obj.log||[]);
        if(obj.journals){
          ensureTomb();
          /* Надгробия ЯВНО удалённых записей (state.delJr) тут игнорировались: запись, которую вахта
             удалила, возвращалась из старого бэкапа по id, и push делал ей re-upsert в облако —
             удаление отменялось у всех, а ledger снова считал списание/приход. Отсекаем ДО mergeById. */
          const _delJ = new Set(Array.isArray(state.delJr) ? state.delJr : []);
          merged.journals = merged.journals || emptyJournals();
          JOURNAL_KEYS.forEach(k=>{
            merged.journals[k] = mergeById(merged.journals[k]||[], (obj.journals[k]||[]).filter(x=> x && !_delJ.has(x.id)));
          });
        }
        // объединяем пользовательские места хранения (validateImport уже очистил строки)
        if(obj.locations){
          ensureTomb();
          merged.locations = merged.locations || {};
          for(const k of STOCK_TYPE_KEYS){
            // union со старым бэкапом возвращает удалённое место, и оно ушло бы в облако как revive;
            // normalizeState ниже вычитает надгробия вторым рубежом, но полагаться на него как на
            // единственный фильтр нельзя: он про форму состояния, а не про семантику импорта
            merged.locations[k] = applyTomb([...new Set([...(merged.locations[k]||[]), ...(obj.locations[k]||[])])], (state.delLoc&&state.delLoc[k])||[]);
          }
        }
      }
      state = merged; normalizeState();   // приводим форму к инвариантам (массивы/места/категории/партии) после слияния
      // сбрасываем фильтры, т.к. категории могли полностью смениться
      stockCat = ""; stockSearch = ""; stockLimit = 100; stockMode = "stock"; stockTab = "all"; stockExpiryFilter = "all";
      // журнал пришёл из файла целиком: месяцы и статусы теперь другие, старый выбор показал бы пустоту
      journalMonth = null; journalSearch = ""; journalStatus = "all"; journalLimit = 200;
      saveState(); applyTheme(); render();
      if(mode==="replace") toast(`Заменено: ${state.stock.length} поз.`);
    }catch(e){
      console.error("Import error:", e);
      toast("Не удалось прочитать файл — проверьте формат");
    }
  };
  /* Сбой чтения самого файла (файл удалён/переименован после выбора, нет прав, iCloud-файл не
     скачался, ошибка носителя) не вызывает onload вообще: раньше не было ни тоста, ни очистки
     input — экран просто не реагировал на «Импорт», и повторный выбор ТОГО ЖЕ файла тоже молчал
     (значение input не сброшено → событие change не срабатывает). */
  r.onerror = () => {
    inputEl.value = "";
    console.error("importData: FileReader", r.error);
    toast("Не удалось прочитать файл с устройства — скопируйте его в память телефона и повторите");
  };
  r.readAsText(f);
}
async function clearLog(){

  state.log=[]; saveState(); render();
}
async function wipeAll(){
  const cid = activeCloudId();
  if(cid){
    if(!cloudOnline()){ toast("Обновление из облака доступно только онлайн"); return; }   // офлайн: не снимаем dirty и не врём «обновлено»
    // ОБЛАЧНАЯ база: стирать её локально и выгружать пустоту НЕЛЬЗЯ — это снесло бы общие данные
    // в облаке у всех участников (в т.ч. у начальника). «Сброс» здесь = заменить ЛОКАЛЬНУЮ копию
    // свежими данными из облака. Облако не трогаем.
    if(!await confirmSheet(`База «${activeProfileName()}» — облачная. Обновить локальную копию из облака? Несохранённые локальные правки заменятся облачными. Данные в облаке НЕ удаляются.`,{danger:true,yes:"Обновить из облака"})) return;
    /* Брат-близнец уже исправленного места в разборе подозрительного обнуления, и болезнь та же:
       метка несинхронизированного снималась БЕЗУСЛОВНО, потом шла загрузка, потом печатался
       БЕЗУСЛОВНЫЙ тост «Обновлено из облака». cloudPull возвращает true только когда облачные
       данные действительно применены — все ранние выходы (офлайн, снят со смены, гонка с чужой
       правкой, есть своё несинхронизированное) дают undefined и НЕ бросают. Значит человек мог
       увидеть «Обновлено», не получив ничего, и при этом уже лишиться метки своих правок:
       они не выгрузились бы никогда. Теперь метку возвращаем на место, а ответ соответствует факту. */
    const _hadDirty = !!localStorage.getItem(cloudDirtyKey(cid));
    try{ localStorage.removeItem(cloudDirtyKey(cid)); }catch(_){}   // отбрасываем несинхронизированное локальное (но НЕ снимок — иначе ложный конфликт при сбое)
    setSyncStatus("syncing","Обновление из облака…");
    let _ok = false;
    try{ _ok = (await cloudPull(cid)) === true; }
    catch(e){ console.warn("wipeAll pull", e); }
    if(_ok){ toast("Обновлено из облака"); }
    else{
      if(_hadDirty){ try{ markDirty(cid); }catch(_){} }   // загрузки не было — свои правки НЕ выбрасываем
      toast("Не удалось обновить из облака — данные на телефоне не тронуты. Проверьте связь и нажмите значок синхронизации вверху справа");
    }
    nav("dashboard");
    return;
  }
  // ЛОКАЛЬНАЯ база (без облака) — полный сброс именно этой базы (другие базы не затрагиваются)
  if(!await confirmSheet(`Стереть данные базы «${activeProfileName()}»? Другие базы не затрагиваются.`,{danger:true,yes:"Продолжить"})) return;
  if(!await confirmSheet("Точно? Сначала сохраните резервную копию.",{danger:true,yes:"Стереть базу"})) return;
  /* Здесь стоял третий вопрос — «Загрузить встроенный список продуктов (февраль 2026) заново?».
     Обещание было пустым: список грузил блок, который не выполнялся никогда (см. Boot ниже),
     поэтому ответ «Да, загрузить» давал ту же пустую базу, только с лишней перезагрузкой.
     Вопрос убран в v259 — сброс честно оставляет базу пустой, наполняется она импортом
     резервной копии, файлом Excel или вручную. */
  state = structuredClone(defaultState);
  saveState(); applyTheme();
  nav("dashboard");
}
