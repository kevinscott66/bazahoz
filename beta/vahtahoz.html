        if(jup.length){ await cloudRestUpsert("journal_entries", jup, tok); _rememberEcho("journal_entries", jup.map(r=>[r.id, curJSig[r.id]])); }
        if(jrToDel.length){ await cloudRestDelete("journal_entries", jrToDel, tok); dropDeliveredTombstones(jrToDel); }
        // merge: скрытые ops остаются в подписи (не считаются «удалёнными» при следующем push)
        const mergedJ = _typeRestricted ? { ...prevJSig } : {};
        Object.keys(curJSig).forEach(id=>{ mergedJ[id]=curJSig[id]; });
        jrToDel.forEach(id=>{ delete mergedJ[id]; });
        saveSyncSig(cid,"jr",mergedJ);
        saveAllowedSig(cid,"jrAllowed",curJSig,_typeRestricted);
      } else if(jrToDel.length){
        // wipe-защита пропустила выгрузку (журнал локально «опустел»), но ЯВНЫЕ надгробия всё равно
        // доставляем: пользователь удалил последние записи — они должны уйти и из облака.
        await cloudRestDelete("journal_entries", jrToDel, tok);
        dropDeliveredTombstones(jrToDel);
        const trimmed = { ...prevJSig }; jrToDel.forEach(id=>{ delete trimmed[id]; });
        saveSyncSig(cid,"jr",trimmed);
        if(_typeRestricted){
          const ta = { ...prevJrAllowed }; jrToDel.forEach(id=>{ delete ta[id]; });
          saveSyncSig(cid,"jrAllowed",ta);
        }
      }
    }
    // ЗАДАЧИ НЕ ВЫГРУЖАЕМ — они общие-локальные (одно расписание на все базы устройства).
    if(!_suspectWipe && cloud._wipePending===cid) cloud._wipePending=null;   // склад восстановился сам (pull/правки) — снимаем ожидание решения
    if(_suspectWipe){
      /* Склад выглядит повреждённым: НЕ снимаем dirty (чтобы при восстановлении не потерять маркер).
         РАНЬШЕ статус звал «нажать ↻, чтобы восстановить из облака» — а ↻ (cloudSyncNow → cloudActivate)
         видел живой dirty и снова уходил в push, упираясь в тот же отказ; cloudPull при dirty вообще
         не стартует. То есть кнопка НИКОГДА не восстанавливала, и человек жал её по кругу.
         Теперь ↻ открывает явный выбор (cloudResolveWipe): восстановить из облака ИЛИ подтвердить,
         что удаление намеренное. По умолчанию — по-прежнему fail-closed: облако не трогаем. */
      cloud._wipePending = cid;
      setSyncStatus("error","Склад опустел или резко уменьшился, выгрузка остановлена, общая база цела. Нажмите значок синхронизации вверху справа");
    } else if(_dirtyGen !== _genAtStart){
      // пока шла выгрузка, пользователь успел что-то изменить — эта правка НЕ в нашем снимке.
      // dirty НЕ снимаем (иначе при сбое следующей выгрузки retry не запустится, а pull затрёт
      // правку) и сразу планируем добивочный проход. pushPending тут не ставим: его всё равно
      // снимет finally, а от затирания на этот промежуток защищает именно живой dirty.
      setSyncStatus("syncing","Отправка изменений в облако…");
      clearTimeout(cloud.pushTimer);
      cloud.pushTimer = setTimeout(()=>{ cloud.pushPending=false; cloudPushNow(); }, 600);
    } else {
      try{ localStorage.removeItem(cloudDirtyKey(cid)); }catch(e){}
      setSyncStatus("synced");
    }
  }catch(e){
    console.warn("cloudPushNow", e);
    if(!cloudOnline()){ setSyncStatus("offline"); }   // ждём сеть → событие "online" доpush-ит
    else {
      setSyncStatus("error");
      // транзиентная ошибка — авто-повтор пока есть несинхронизированное и сеть
      clearTimeout(cloud.retryTimer);
      cloud.retryTimer = setTimeout(()=>{ if(localStorage.getItem(cloudDirtyKey(activeCloudId()))) cloudPushNow(); }, 6000);
    }
  }
  finally{
    cloud.busy=_outerBusy; cloud.pushPending=false; cloud._pushing=false;   // восстанавливаем прежнее: вложенный вызов оставит busy=true до finally самого cloudActivate
    /* Разрешение «это я удалил намеренно» ОДНОРАЗОВОЕ: если проход не дошёл до успешного upsert
       склада (сеть, RLS, исключение), флаг иначе остался бы включённым до перезагрузки страницы —
       защита для этой базы выключена, и следующая НАСТОЯЩАЯ порча слота уехала бы в общую базу молча. */
    cloud._wipeOverride = null;
    // чужая правка прилетела, пока шла выгрузка → добираем ОДИН pull
    cloudDrainRemoteMissed();
  }
}
// ===================== ЗАДАЧИ В ОБЛАКЕ (scope по владельцу, не по базе) =====================
// Задачи — ОБЩИЕ для всех баз устройства (одно расписание у хоза). В облаке хранятся
// в таблице tasks, привязанной к owner_id = uid пользователя (RLS: видишь только свои).
// Не зависят от активной базы; синкаются отдельно от склада/журналов. Дельта, как у склада.
const TASKS_DIRTY = NS+"vahtahoz_tasks_dirty";
const TASKS_OWNER = NS+"vahtahoz_tasks_owner";   // uid владельца локальных задач — защита от утечки при смене аккаунта на устройстве
/* НАДГРОБИЯ ЗАДАЧ — id, которые человек удалил ЯВНО (кнопкой «Удалить» или откатом галочки у
   повтора). Нужны ровно для одного случая: удалена ПОСЛЕДНЯЯ задача. Тогда локальный список пуст,
   а выгрузка удалений при пустом списке заблокирована защитой от порчи слота (см. cloudPushTasksNow) —
   удаление не уезжало никогда, подпись при этом сохранялась пустой и dirty снимался. В облаке
   задача оставалась жива и ближайший pull её ВОСКРЕШАЛ: «добавил, удалил, после перезахода вернулась».
   Надгробие отличает «человек удалил» от «список пуст, потому что что-то сломалось», и снимается
   сразу после подтверждённого DELETE. Ключ новый — старая сборка из кэша его просто не заметит. */
const TASKS_TOMB = NS+"vahtahoz_tasks_del";
function loadTaskTombs(){
  try{ const a=JSON.parse(localStorage.getItem(TASKS_TOMB)||"[]"); return Array.isArray(a)?a.map(String):[]; }catch(_){ return []; }
}
function _saveTaskTombs(arr){ try{ localStorage.setItem(TASKS_TOMB, JSON.stringify(arr)); }catch(_){} }
function tombTask(ids){
  const add=(Array.isArray(ids)?ids:[ids]).filter(x=>x!=null).map(String);
  if(!add.length) return;
  const set=new Set(loadTaskTombs()); add.forEach(id=>set.add(id));
  // не срезаем хвост: недоставленное надгробие терять нельзя — задача воскреснет на pull.
  // В норме список короткий, доставленные снимает dropTaskTombs.
  const arr=[...set];
  if(arr.length>5000) console.warn("tasks tombstones oversized", arr.length);
  _saveTaskTombs(arr);
}
function dropTaskTombs(ids){
  const done=new Set((ids||[]).map(String)); if(!done.size) return;
  const left=loadTaskTombs().filter(id=>!done.has(id));
  _saveTaskTombs(left);
}
/* Снимок подписей задач хранится ПО КАЖДОМУ uid отдельно. Сбрасываем все: при восстановлении из
   файла uid может быть ещё неизвестен (восстановление до входа в облако), а любой уцелевший снимок
   превращает «задач в файле меньше» в «удалить лишние из облака». Ключи не переименовываем — старая
   версия приложения, поднявшаяся из кэша, прочитает пустой снимок ровно так же и тоже не удалит. */
function _clearTasksSig(){
  try{
    const pre = NS+"vahtahoz_sig_tasks_";
    const kill = [];
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(pre)===0) kill.push(k); }
    kill.forEach(k=>{ try{ localStorage.removeItem(k); }catch(_){} });
  }catch(_){}
}
function activeUid(){ return (cloud.session && cloud.session.user && cloud.session.user.id) || null; }
function _tasksSigMap(){ const m={}; for(const t of (state.tasks||[])){ if(t && t.id!=null) m[String(t.id)]=_sigOf({data:t}); } return m; }
function tasksChangedVsCloud(uid){
  const cur=_tasksSigMap(); const prev=loadSyncSig(uid,"tasks");
  const ck=Object.keys(cur), pk=Object.keys(prev);
  if(ck.length!==pk.length) return true;
  for(const k of ck){ if(cur[k]!==prev[k]) return true; }
  return false;
}
// помечаем задачи к выгрузке и планируем push — но ТОЛЬКО при реальном изменении задач
// (saveGlobalTasks зовётся на каждом saveState, в т.ч. при правках склада — там задачи не менялись)
function cloudMaybePushTasks(){
  if(!cloud.ready) return;
  const uid=activeUid(); if(!uid) return;
  if(!tasksChangedVsCloud(uid)) return;       // задачи не изменились — тихо выходим
  try{ localStorage.setItem(TASKS_DIRTY,"1"); }catch(e){}
  if(!cloudOnline()) return;                   // уйдёт по событию online
  clearTimeout(cloud.tasksTimer);
  cloud.tasksTimer=setTimeout(()=>cloudPushTasksNow(), 700);
}
async function cloudPushTasksNow(){
  const uid=activeUid(); if(!uid || !cloud.ready || !cloudOnline()) return;
  cloud.tasksBusy=true;                       // своя выгрузка идёт — realtime-эхо не должно дёргать pull
  try{
    const tok=cloud.session.access_token;
    const rows=(state.tasks||[]).filter(t=>t&&t.id!=null).map(t=>({ id:String(t.id), owner_id:uid, data:t }));
    const curSig={}; rows.forEach(r=>{ curSig[r.id]=_sigOf({data:r.data}); });
    const prevSig=loadSyncSig(uid,"tasks");
    const upsert=rows.filter(r=> curSig[r.id]!==prevSig[r.id]);
    const del=Object.keys(prevSig).filter(id=> !(id in curSig));
    // ЗАЩИТА: пустой локальный список НЕ стирает облако (порча слота / частичная загрузка), как у склада.
    // Но «удалили последнюю задачу» — это тоже пустой список, и раньше такое удаление не уезжало никогда,
    // а pull возвращал задачу обратно. Поэтому при пустом списке шлём удаление ТОЛЬКО для явных надгробий.
    const tomb=new Set(loadTaskTombs());
    const delSend = rows.length>0 ? del : del.filter(id=>tomb.has(id));
    if(delSend.length) await cloudRestDelete("tasks", delSend, tok);
    if(upsert.length) await cloudRestUpsert("tasks", upsert, tok);
    saveSyncSig(uid,"tasks",curSig);
    // сняли доставленные + те, которых в облаке и не было (создал и удалил, не успев синхронизироваться)
    dropTaskTombs([...delSend, ...[...tomb].filter(id=>!(id in prevSig))]);
    cloud.tasksRetryN = 0;
    try{ localStorage.removeItem(TASKS_DIRTY); localStorage.setItem(TASKS_OWNER, uid); }catch(e){}
  }catch(e){
    console.warn("cloudPushTasks", e);
    // ВЫХОД ИЗ ТУПИКА. Пересменка (handover_shift) переписывает owner_id всех наших задач на
    // заступающего. Наш upsert по тем же id попадает в строки, которые RLS (owner_id = auth.uid())
    // нам больше не отдаёт → 403 при каждой попытке. Раньше это был бесконечный ретрай раз в 6 с,
    // а TASKS_DIRTY блокировал ЛЮБОЙ pull → устройство навсегда показывало переданные задачи
    // и не могло получить актуальный список. Теперь при отказе прав (или после 5 неудач подряд)
    // отдаём приоритет облаку: снимаем dirty, сбрасываем подпись и подтягиваем актуальное.
    // ТОЛЬКО 403. 401 — это штатное истечение access-токена (~1 ч): cloudRest сам пробует refresh,
    // но на слабой сети refresh падает и 401 всплывает наружу. Считать это «задачи больше не наши»
    // означало бы выбрасывать офлайн-правки при каждом обрыве связи.
    const permErr = !!(e && e.status===403);
    // сетевые сбои (нет .status: таймаут/abort/обрыв) в счётчик НЕ идут — на вахте это норма,
    // иначе 5 обрывов за смену стирали бы несинхронизированные задачи.
    if(e && typeof e.status === "number") cloud.tasksRetryN = (cloud.tasksRetryN||0) + 1;
    if(permErr || cloud.tasksRetryN >= 5){
      // sig НЕ обнуляем: пусть его перезапишет успешный pull. Иначе при неудачном pull остаёмся
      // без dirty и с пустой подписью → следующий синк мог ПЕРЕ-выгрузить локальные задачи в облако.
      try{ localStorage.removeItem(TASKS_DIRTY); }catch(_){}
      cloud.tasksRetryN = 0;
      toast(permErr ? "Задачи закреплены за другим работником — список обновлён из облака"
                    : "Не удалось выгрузить задачи — список обновлён из облака");
      cloudPullTasks();
      return;
    }
    if(cloudOnline()){ clearTimeout(cloud.tasksRetry); cloud.tasksRetry=setTimeout(()=>{ if(localStorage.getItem(TASKS_DIRTY)) cloudPushTasksNow(); }, 6000); }
  }
  finally{ cloud.tasksBusy=false; }
}
async function cloudPullTasks(){
  const uid=activeUid(); if(!uid || !cloudOnline()) return;
  if(localStorage.getItem(TASKS_DIRTY)){ cloudMaybePushTasks(); return; }   // есть несинхр. правки — не затираем
  try{
    const tok=cloud.session.access_token;
    const rows=await cloudRestAll(`tasks?select=*&owner_id=eq.${encodeURIComponent(uid)}&order=id`, tok, {timeout:30000});
    if(localStorage.getItem(TASKS_DIRTY)) return;                            // успел отредактировать во время загрузки → не затираем
    // САНИТАЙЗ: id задачи И id пунктов чек-листа — оба идут из облака (jsonb от любого участника)
    // и подставляются в inline-onclick (toggleTaskItem). Без safeId на items[].id — XSS-вектор.
    state.tasks=(rows||[]).map(r=>{
      const t={ ...(r.data||{}), id:safeId(r.id) };
      if(Array.isArray(t.items)) t.items=t.items.map(i=>({ id:safeId(i&&i.id), text:String((i&&i.text)||"").slice(0,200), done:!!(i&&i.done) }));
      return t;
    });
    sanitizeIds(state.tasks);
    try{ localStorage.setItem(TASKS_KEY, JSON.stringify(state.tasks)); }catch(e){}   // прямо в localStorage, БЕЗ повторного push
    saveSyncSig(uid,"tasks",_tasksSigMap());
    try{ localStorage.setItem(TASKS_OWNER, uid); }catch(e){}
    if(currentView==="tasks") render();
  }catch(e){ console.warn("cloudPullTasks", e); }
}
// решает: выгрузить локальные задачи (первая миграция) или подтянуть облачные (восстановление)
async function cloudSyncTasks(){
  const uid=activeUid(); if(!uid || !cloudOnline()) return;
  /* ЗАЩИТА ОТ УТЕЧКИ — ПЕРВОЙ, ДО ЛЮБОЙ ВЫГРУЗКИ. Если локальные задачи принадлежат ДРУГОМУ
     пользователю (вход другим аккаунтом на этом устройстве, восстановление чужого бэкапа) — чистим
     их, чтобы не выгрузить чужие задачи в облако текущего юзера.
     Раньше эта проверка стояла ПОСЛЕ ветки «есть несинхронизированные правки → выгрузить», а
     восстановление всегда взводило признак выгрузки: защита не срабатывала НИКОГДА, и чужие задачи
     после восстановления становились нашими. Признак выгрузки здесь же и снимаем — иначе он остался
     бы навсегда и блокировал любой pull (устройство больше не получало бы свои задачи). */
  const owner=localStorage.getItem(TASKS_OWNER);
  if(owner && owner!==uid){
    state.tasks=[];
    try{ localStorage.setItem(TASKS_KEY,"[]"); localStorage.removeItem(TASKS_DIRTY); }catch(_){}
    saveSyncSig(uid,"tasks",{});
    if(currentView==="tasks") render();
  } else if(localStorage.getItem(TASKS_DIRTY)){ cloudMaybePushTasks(); return; }
  try{
    const tok=cloud.session.access_token;
    const ids=await cloudRest(`tasks?select=id&owner_id=eq.${encodeURIComponent(uid)}`, tok);
    const cloudEmpty=!(Array.isArray(ids)&&ids.length);
    const localHas=(state.tasks||[]).length>0;
    const neverSynced=Object.keys(loadSyncSig(uid,"tasks")).length===0;
    if(cloudEmpty && localHas && neverSynced){
      // первый раз: облако пусто, локально есть задачи → выгружаем (НЕ затираем локальное!)
      saveSyncSig(uid,"tasks",{});            // дельта против пустого снимка = всё
      await cloudPushTasksNow();
    } else {
      await cloudPullTasks();                  // облачные задачи — источник (в т.ч. после чистки кэша)
    }
  }catch(e){ console.warn("cloudSyncTasks", e); }
}
/* realtime: на любое изменение в облаке — отложенный пере-pull активной базы */
function cloudSubscribe(cid){
  if(!cid || cloud.subscribedBase===cid) return;
  cloudUnsubscribe();
  try{
    const sb = cloud.sb;
    cloud.channel = sb.channel("base-"+cid)
      .on("postgres_changes",{event:"*",schema:"public",table:"stock_items",filter:"base_id=eq."+cid}, cloudOnRemote)
      .on("postgres_changes",{event:"*",schema:"public",table:"journal_entries",filter:"base_id=eq."+cid}, cloudOnRemote)
      .subscribe();
    cloud.subscribedBase = cid;
  }catch(e){ console.warn("cloudSubscribe", e); }
}
function cloudUnsubscribe(){
  try{ if(cloud.channel) cloud.sb.removeChannel(cloud.channel); }catch(e){}
  cloud.channel=null; cloud.subscribedBase=null;
}
// realtime для задач — отдельный канал по владельцу (не зависит от активной базы, не пересоздаётся при смене базы)
function cloudSubscribeTasks(){
  const uid=activeUid(); if(!uid || cloud.tasksSubUid===uid) return;
  try{
    if(cloud.tasksChannel) cloud.sb.removeChannel(cloud.tasksChannel);
    cloud.tasksChannel = cloud.sb.channel("tasks-"+uid)
      .on("postgres_changes",{event:"*",schema:"public",table:"tasks",filter:"owner_id=eq."+uid}, ()=>{
        clearTimeout(cloud.tasksPullTimer);
        if(cloud.tasksBusy) return;                                              // эхо собственной выгрузки — игнор
        if(localStorage.getItem(TASKS_DIRTY)){ cloudMaybePushTasks(); return; }   // свои правки важнее — не затираем
        cloud.tasksPullTimer=setTimeout(()=>cloudPullTasks(), 400);
      })
      .subscribe();
    cloud.tasksSubUid=uid;
  }catch(e){ console.warn("cloudSubscribeTasks", e); }
}
/* Догоняющий pull после ЛЮБОЙ занятости. cloudOnRemote при busy/pushPending/applying только ставит
   флаг — снять его обязан тот, кто был занят: и загрузка, и ВЫГРУЗКА (busy/pushPending чаще всего
   означает именно её), поэтому вызов стоит в finally обоих проходов.
   Флаг гасим ВНУТРИ таймера и только когда загрузка действительно стартует. Раньше он снимался
   сразу, до планирования, и событие пропадало НАСОВСЕМ, если через 800 мс условия не сошлись —
   типично при своих несохранённых правках: pull пропускается, перепланировать некому, чужая правка
   на экране так и не появляется. Теперь флаг доживает до следующего drain (его сделает push,
   который эти правки и выгружает). Цикла «pull → pull» по-прежнему нет: к моменту, когда cloudPull
   из своего finally позовёт drain, флаг уже погашен здесь. */
function cloudDrainRemoteMissed(){
  if(!cloud._remoteMissed) return;
  clearTimeout(cloud.pullTimer);
  cloud.pullTimer = setTimeout(()=>{
    cloud.pullTimer = null;   // окно израсходовано — иначе «есть ли запланированный pull» не отличить от «был когда-то»
    const c = activeCloudId();
    if(!(c && cloud.ready && cloud.session && !cloud.busy && !cloud.pushPending && !cloud.applying &&
         !localStorage.getItem(cloudDirtyKey(c)))) return;   // ещё занято / есть свои правки — флаг НЕ гасим, событие живо
    cloud._remoteMissed = false;
    cloudPull(c).catch(()=>{});
  }, 800);
}
/* Подписи строк, которые ТОЛЬКО ЧТО выгрузили мы сами, — чтобы отличить эхо своей записи от чужой
   правки в realtime.

   ЧТО БЫЛО СЛОМАНО (две вещи, обе приводили к молчаливой потере чужой правки):
   1) Срок жизни был у ВСЕЙ КАРТЫ, а не у записи: `_echoSent.at` хранило время ПОСЛЕДНЕГО
      запоминания, и карта очищалась только если между двумя выгрузками прошло больше минуты
      ЦЕЛИКОМ. На смене выгрузки идут чаще минуты — значит карта не очищалась никогда, и подпись,
      выгруженная десять минут назад, всё ещё считалась «нашей».
   2) Подпись НЕ снималась после срабатывания. Отсюда самое дорогое: напарник поставил 4 —
      подтянулось; напарник вернул 10 — а десятку когда-то выгружали мы, значит «эхо», загрузки
      нет. В облаке 10, на экране 4, и следующая наша выгрузка затирала облако четвёркой.
      «Верни как было» — рядовая операция смены, а не редкость.

   КАК СДЕЛАНО СЕЙЧАС: у каждой записи собственная отметка времени и собственный срок (ECHO_TTL),
   а сработавшая подпись СРАЗУ удаляется — эхо на один upsert приходит ровно одно, всё последующее
   с тем же значением это уже чужая правка. Повторная выгрузка той же строки (retry) заново
   взводит подпись, так что законное эхо по-прежнему не тянет полную загрузку. Цена ошибки в
   «другую» сторону — один лишний pull, а не потеря данных. */
const ECHO_TTL = 60000;
const _echoSent = { sig:new Map() };   // "table|id" → { sig, at }
function _rememberEcho(table, pairs){
  const now = Date.now();
  for(const [id, sg] of pairs){ if(id && sg) _echoSent.sig.set(table+"|"+id, { sig:sg, at:now }); }
  // чистка по САМИМ записям, а не «всей картой раз в минуту» — иначе на активной смене не чистится никогда
  if(_echoSent.sig.size > 200){
    for(const [k, v] of _echoSent.sig){ if(!v || now - v.at > ECHO_TTL) _echoSent.sig.delete(k); }
    if(_echoSent.sig.size > 5000) _echoSent.sig.clear();   // разовая массовая выгрузка не должна держать память
  }
}
/* Забыть подпись строки. Нужна ровно там, где облачное значение УШЛО от запомненного нами:
   пришла чужая правка этой же строки (или её удаление). Держать после этого свою подпись нельзя —
   на ней и ломался «верни как было»: напарник ставит 4 (подпись не совпала, загрузка прошла), потом
   возвращает 10 — а десятку когда-то выгружали мы, подпись всё ещё лежала в карте, возврат считался
   эхом и НЕ загружался. В облаке 10, на экране 4, а следующая наша выгрузка затирала облако
   четвёркой. Одного лишь срока жизни и одноразовости мало: своё эхо в этом сценарии не приходило
   вовсе, снимать подпись было некому. */
function _forgetEcho(payload){
  try{
    const tbl = payload && payload.table;
    const id = (payload && payload.new && payload.new.id) || (payload && payload.old && payload.old.id);
    if(tbl && id) _echoSent.sig.delete(tbl+"|"+id);
  }catch(_){}
}
function _isOwnEcho(payload){
  try{
    const rec = payload && payload.new, tbl = payload && payload.table;
    if(!rec || !rec.id || !tbl) return false;                       // DELETE и прочее без строки — не эхо
    const key = tbl+"|"+rec.id;
    const ent = _echoSent.sig.get(key);
    if(!ent) return false;
    if(Date.now() - ent.at > ECHO_TTL){ _echoSent.sig.delete(key); return false; }   // своя протухшая подпись
    const sg = ent.sig;
    // проекция облачной строки на НАШИ колонки — подпись считалась ровно по ним (stockToRow / {kind,data})
    const proj = tbl==="stock_items"
      ? { id:rec.id, base_id:rec.base_id, type:rec.type, name:rec.name, category:rec.category||"",
          unit:rec.unit||"шт", min_stock:(rec.min_stock==null?null:Number(rec.min_stock)), note:rec.note||"",
          qty:roundQty(rec.qty||0), expiry:rec.expiry||"", location:rec.location||"",
          batches:Array.isArray(rec.batches)?rec.batches:[] }
      : tbl==="journal_entries" ? { kind:rec.kind, data:rec.data }
      : null;
    if(!proj || _sigOf(proj)!==sg) return false;
    _echoSent.sig.delete(key);   // ОДНОРАЗОВО: эхо на один upsert приходит один раз, дальше это уже чужая правка (в т.ч. «верни как было»)
    return true;
  }catch(_){ return false; }
}
function cloudOnRemote(payload){

     На канале задач эхо отбрасывается явно (cloud.tasksBusy), а здесь не отбрасывалось: событие
     помечалось _remoteMissed и превращалось в ПОЛНУЮ загрузку базы после каждого push — на вахтовом
     интернете это лишний трафик на каждое сохранение остатка (в v216 эхо просто отбрасывалось).
     Отбрасываем ТОЛЬКО строку, содержимое которой ПОБАЙТОВО совпадает с тем, что мы сами выгрузили

     совпадёт и пойдёт обычным путём — ради неё _remoteMissed и вводили.

     ПОРЯДОК ЗДЕСЬ — ЭТО ПОТЕРЯ ДАННЫХ, А НЕ СТИЛЬ. Раньше первой строкой стоял clearTimeout, и
     только потом проверялось эхо. Значит наше собственное эхо СНИМАЛО загрузку, назначенную
     предыдущим — ЧУЖИМ — событием, и взамен не планировало ничего. Это не редкий угол: одно
     списание пишет и строку склада, и строку журнала, то есть по каналу приходит минимум два эха,
     и второе гарантированно попадало в чужое окно 400 мс. Напарник списал последний мешок муки —
     на вашем экране мешок оставался, до следующего события, своей выгрузки или перезапуска.
     Теперь эхо не трогает чужой таймер вовсе: оно выходит РАНЬШЕ clearTimeout.
     Ради чего clearTimeout ставили — схлопывание пачки чужих событий в один pull — сохранено:
     он остался на пути НЕэха, ровно перед планированием нового окна. Опасение «сработает после
     dirty и затрёт правки» закрыто вторым рубежом: cloudPull при dirty сам не тянет, а уходит
     в push (см. его начало). */
  if(_isOwnEcho(payload)){

       (пришла во время push/pull), а её отложенную загрузку убило эхо, перепланировать флаг было
       некому — слив зовут только завершения выгрузки и загрузки, а они уже прошли. Флаг висел
       истиной, экран — устаревшим. Дотягиваем сами, но только когда никто не занят и своего
       окна загрузки нет: иначе отобрали бы у чужого события уже назначенный pull. */
    if(cloud._remoteMissed && !cloud.busy && !cloud.pushPending && !cloud.applying && !cloud.pullTimer){
      cloudDrainRemoteMissed();
    }
    return;
  }
  _forgetEcho(payload);   // не наше значение → наша подпись по этой строке протухла (см. _forgetEcho)
  clearTimeout(cloud.pullTimer); cloud.pullTimer = null;   // своё же прежнее окно: пачка чужих событий схлопывается в ОДИН pull
  // push/pull в полёте — второй pull не стартуем. НО событие нельзя просто выбросить: чужая правка,
  // прилетевшая во время нашей загрузки, не попадала в этот pull (он уже читал облако ДО неё) и не
  // планировала следующий — экран висел устаревшим до случайного следующего триггера (своя правка,
  // возврат сети, перезапуск). Запоминаем «был remote во время занятости» и добираем ОДИН pull в finally.
  if(cloud.busy || cloud.pushPending || cloud.applying){ cloud._remoteMissed = true; return; }
  // есть несинхронизированные локальные правки → не тянем (затёрли бы своё); сначала выгрузим их
  const cid0 = activeCloudId();
  if(cid0 && localStorage.getItem(cloudDirtyKey(cid0))){
    /* ЧУЖОЕ СОБЫТИЕ НЕЛЬЗЯ ПРОСТО ВЫБРОСИТЬ — ЭТО ПОТЕРЯ ДАННЫХ, А НЕ ЛИШНИЙ ТРАФИК.
       Это была единственная ветка выхода БЕЗ _remoteMissed, хотя окно загрузки строкой выше уже
       снято clearTimeout, а нового здесь не ставится. cloudDrainRemoteMissed в finally у push
       видел флаг ложью и не делал ничего — чужое событие пропадало НАСОВСЕМ.
       Как это выглядит на вахте: у кладовщика А push упал по сети (окно ретрая 6 секунд —
       обычное дело), в эти секунды напарник Б удалил позицию. DELETE эхом не считается (у него
       нет payload.new), приходит сюда, dirty стоит — и загрузка не назначается больше никогда.
       Позиция висит у А на экране; через час он проводит по ней выдачу, push делает upsert —
       и удалённая позиция воскресает в общей базе у всей бригады.
       Флаг доживает до ближайшего drain (его зовёт finally и push, и pull), и pull доберётся
       сразу после того, как наши правки уедут. Затирания своего при этом нет: drain не стартует,
       пока dirty стоит, а cloudPull при dirty сам уходит в push. */
    cloud._remoteMissed = true;
    /* РОЛЬ «ТОЛЬКО ПРОСМОТР» (бухгалтер, снятый со смены) СО СТАРЫМ dirty. cloudMaybePush для неё
       выходит на !canEditStock() ДО markDirty — выгрузки не будет никогда, значит и drain звать
       некому, а сам drain ждёт снятия dirty, которое не снимется. Экран замирал до перезапуска.
       Идём прямо в загрузку: cloudPull такой случай умеет — сохраняет несинхронизированное
       локальной копией-профилем и только после этого снимает метку. */
    if(typeof canEditStock==="function" && !canEditStock()){
      cloud._remoteMissed = false;
      cloud.pullTimer = setTimeout(()=>{ cloud.pullTimer=null; const cid=activeCloudId(); if(cid) cloudPull(cid); }, 400);
      return;
    }
    cloudMaybePush(); return;
  }
  cloud.pullTimer = setTimeout(()=>{ cloud.pullTimer=null; const cid=activeCloudId(); if(cid) cloudPull(cid); }, 400);
}

/* прячем «Задачи», если у пользователя нет права смотреть задачи на активной облачной базе */
function cloudGateTasks(){

     запуска. Иначе на первых кадрах показывались разделы, которых у человека нет, и кнопка потом
     исчезала на глазах. Как только cloud.ready — считаем по настоящим правам и запоминаем. */
  const known = cloud.ready || !loadCloudSess();
  const hints = known ? null : loadGateHints();
  const hideTasks = hints ? hints.t : isRestrictedUser();   // та же проверка прав, единый источник
  const tb = document.querySelector('#navbar .nav-btn[data-nav="tasks"]');
  if(tb) tb.style.display = hideTasks ? "none" : "";
  if(hideTasks && currentView==="tasks") nav("dashboard");
  // Кухня — только повар/управляющие
  const hideKitchen = hints ? hints.k : !canSeeKitchen();
  const kb = document.querySelector('#navbar .nav-btn[data-nav="kitchen"]');
  if(kb) kb.style.display = hideKitchen ? "none" : "";

  if(known) saveGateHints(hideTasks, hideKitchen);
}
// перечитать ТОЛЬКО свои членства (active/права) — чтобы возврат/снятие со смены подхватились без перезахода
async function cloudRefreshMyMembership(){
  try{
    if(cloud.busy) return;   // не переписываем cloud.members посреди идущего синка (push/pull читают права)
    const tok=cloud.session && cloud.session.access_token; const uid=cloud.profile && cloud.profile.id;
    if(!tok || !uid) return;
    // тянем членства + территориальные роли + карту база→партия одним заходом (иначе canManageBase/myRank
    // рассинхронятся: партийный управляющий мог бы «потерять» доступ к базе, отсутствующей в _baseParty).
    const [mem, orgs, bs, orgMgrs] = await Promise.all([
      cloudRest(`base_members?select=*&user_id=eq.${encodeURIComponent(uid)}`, tok, {timeout:20000}),
      cloudRest(`org_roles?select=*&user_id=eq.${encodeURIComponent(uid)}`, tok, {timeout:20000}).catch(()=>null),
      cloudRest(`bases?select=id,name,party_id`, tok, {timeout:20000}).catch(()=>null),
      /* СРЕЗ УПРАВЛЯЮЩИХ ОРГ-РОЛЕЙ — тот же запрос, что при входе. Его тут не было вовсе: после
         выдачи орг-роли (или её снятия) без перезахода cloud.orgManagers оставался прежним, и
         предупреждение «база останется без управляющего» врало в обе стороны — молчало там, где
         управляющего не осталось, и пугало там, где он появился. */
      cloudRest(`org_roles?select=party_id,role,active,can_manage&active=is.true&can_manage=is.true`, tok, {timeout:20000}).catch(()=>null),
    ]);
    // сервер ответил → членство известно, даже если холодный старт уходил в catch (basesLoaded=false)
    if(Array.isArray(mem)){ cloud.members=mem; cloud.membersLoaded=true; }
    if(Array.isArray(orgs)) cloud.orgRoles=orgs;
    if(Array.isArray(orgMgrs)){ cloud.orgManagers=orgMgrs; cloud.orgManagersLoaded=true; }
    if(Array.isArray(bs)){ cloud.bases={}; cloud._baseParty={}; bs.forEach(b=>{ cloud.bases[b.id]=b.name; cloud._baseParty[b.id]=b.party_id||null; }); }
    /* Права поменялись, пока человек сидел в приложении: пересменка, смена роли, выдача или
       отзыв доступа к базе. Раньше об этом узнавали случайно — по исчезнувшей кнопке. Здесь
       (и при входе) — единственные два места, где cloud.members обновляется. */
    try{ notifMemberScan(); }catch(_){}
    // если появились новые видимые базы (выдали орг-роль/добавили в базу пока сидел в приложении) — привяжем их,
    // иначе пользователь не увидит новые базы до перезахода (org_roles/base_members без реалтайма).
    if(Array.isArray(bs)){
      const linked = new Set(profiles.list.filter(x=>x.cloudId).map(x=>x.cloudId));
      // ...и переименование общей базы, сделанное с другого устройства: cloudAutoLink подтянет имя.

      const drift = profiles.list.some(x=>{

        return !!clean && clean!==x.name;
      });
      if(drift || Object.keys(cloud.bases).some(cid=>!linked.has(cid))) await cloudAutoLink();

    let dirtyWas = null;

    try{ pulled = (await cloudPull(cid)) === true; }catch(e){ pulled = false; }

      cloud._wipePending = null;                     // защита снимается ТОЛЬКО после реальной загрузки

    }else{
      cloud._wipePending = cid;                      // диалог по ↻ остаётся доступным — «повторите» исполнимо
      if(dirtyWas!=null){ try{ localStorage.setItem(cloudDirtyKey(cid), dirtyWas); }catch(_){} }
      toast("Не удалось восстановить — проверьте интернет и повторите");
    }
    render();
    return;
  }
  if(choice==="push"){
    // Второе подтверждение: это удаление у ВСЕЙ бригады, а не только на своём телефоне.
    const ok = await confirmSheet(
      "Позиции, которых нет на этом телефоне, будут УДАЛЕНЫ из общей базы у всех участников. Отменить это будет нельзя.",
      { danger:true, yes:"Да, удалить у всех", no:"Отмена", title:"⚠️ Удаление общих данных" });
    if(!ok) return;   // отказ = прежнее поведение: защита в силе, dirty жив, облако цело
    cloud._wipeOverride = cid;   // ОДНОРАЗОВО: cloudPushNow гасит флаг в finally — и после успеха, и после сбоя
    cloud._wipePending = null;
    setSyncStatus("syncing","Отправка в облако…");
    await cloudPushNow();
    // Разрешение уже погашено. Если выгрузка не прошла (сеть/права), человек не должен уйти в
    // уверенности, что удалил у всех: dirty жив, защита снова в силе — говорим прямо.
    if(localStorage.getItem(cloudDirtyKey(cid))) toast("Не отправлено — проверьте интернет и повторите");
    render();
    return;
  }
  // отмена диалога — ничего не меняем (защита остаётся включённой)
}
async function cloudSyncNow(){
  if(!cloud.ready){ toast("Сначала войдите в облако"); return; }
  if(!cloudOnline()){ toast("Нет интернета — попробуйте позже"); return; }
  if(cloud.busy){ return; }   // сохранение уже идёт — двойной тап не плодит второй проход
  // базы не загрузились (слабый интернет) → перезапускаем их загрузку; cloudOnLogin сам активирует базу при успехе
  if(!cloud.basesLoaded && cloud.session){ toast("Загрузка баз…"); await cloudOnLogin(cloud.session, 0).catch(()=>{}); return; }
  /* Членство обновляем ДО проверки активной базы. Пока человек снят со смены (active=false), RLS не
     отдаёт ему НИ ОДНОЙ базы: cloud.bases пуст и activeCloudId() возвращает null. Заступающий,
     которому смену только что передали, жал значок синхронизации и получал «База пока не в облаке» —
     помогал только перезапуск приложения или повторный вход, а это плохая инструкция для вахты.
     cloudRefreshMyMembership перечитывает base_members/org_roles/bases и сам привязывает появившиеся
     базы (cloudAutoLink), поэтому ниже cid уже находится. Первому входу это не мешает: там всё
     отрабатывает cloudOnLogin выше (ветка !basesLoaded). */
  await cloudRefreshMyMembership();
  await cloudRelinkIfNeeded();   // если база ещё не связана с облаком (после сбоя входа) — привяжем по имени
  const cid = activeCloudId();
  if(!cid){ toast("База пока не в облаке. При хорошем интернете нажмите значок синхронизации вверху справа — она привяжется"); return; }
  // Защита от порчи склада остановила выгрузку: обычный cloudActivate тут бесполезен — он увидит
  // живой dirty и снова уйдёт в тот же отказ. Даём пользователю реальный выбор вместо круга.
  if(cloud._wipePending === cid){ await cloudResolveWipe(cid); return; }
  if(isOffShift(cid)){
    setSyncStatus(membershipUnknown()?"offline":"error", membershipUnknown()
      ? "Права не загрузились — работаем локально, синхронизируем при связи"
      : "Вы сейчас не на смене на этой базе — изменения в общую базу не уйдут");
    render(); return;
  }
  toast("Сохранение в облако…"); await cloudActivate(cid);
  if(!isOffShift(cid)) toast("Сохранено в облаке");
}
function cloudCardOffline(){
  return `<div class="card">
      <div class="flex items-center justify-between gap-2">
        <div><div class="font-bold">${ico("cloud",18)} Облако</div><div class="text-xs opacity-70 mt-0.5">Не подключено · работает офлайн</div></div>
        <button class="btn btn-primary" onclick="cloudLoginPrompt()">Войти</button>
      </div>
      <div class="text-xs opacity-70 mt-2">Вход нужен начальнику (просмотр/правка склада своей базы) и для синхронизации между телефонами.</div>
    </div>`;
}
function cloudCardConnected(cid){
  const m = activeMember();
  const linked = cid ? (cloud.bases[cid]||"облачная база") : null;
  const role = (cloud.profile&&cloud.profile.is_admin) ? "полный доступ"
    : m ? [m.can_edit_stock?"склад: правка":(m.can_view_stock?"склад: просмотр":""), m.can_view_tasks?"задачи":""].filter(Boolean).join(" · ")
    : "—";
  return `<div class="card">
    <div class="flex items-center justify-between gap-2">
      <div class="min-w-0">
        <div class="font-bold truncate">${ico("cloud",18)} ${esc(cloud.profile.username||cloud.session.user.email)}</div>
        <div class="text-xs opacity-70 mt-0.5">${cloudOnline()?`<span style="color:#16a34a">${ico("dot",11)}</span> онлайн`:`<span style="color:#dc2626">${ico("dot",11)}</span> офлайн`}${linked?` · база: ${esc(linked)}`:" · база не связана"}</div>
        ${linked?`<div class="text-xs opacity-60 mt-0.5">${esc(role)}</div>`:""}
      </div>
      <button class="btn btn-ghost" onclick="cloudLogout()">Выйти</button>
    </div>
    ${cid?`<button class="btn btn-success w-full mt-2" onclick="cloudSyncNow()">${ico("refresh",18)} Синхронизировать сейчас</button>`:
      `<div class="text-xs opacity-70 mt-2">Активная база не связана с облаком. Откройте «Сменить / базы» и переключитесь на облачную базу.</div>`}
  </div>`;
}
function cloudCardHtml(){
  const cid = activeCloudId();
  if(!cloud.ready){
    return cloudCardOffline();
  }
  return cloudCardConnected(cid);
}

/* ---------- Boot ---------- */
applyTheme();
/* Здесь стоял seedFromEmbedded() — он должен был наполнять свежую базу зашитым списком
   на 362 позиции из острова `id="seedData"` в конце документа. Работать он не мог никогда:
   это IIFE в первом скрипте, а остров с данными шёл НИЖЕ по документу, поэтому в момент
   запуска getElementById возвращал null и загрузка молча не происходила. Убран вместе с самим
   островом (39,6 КБ оболочки, которые каждый телефон качал при каждом обновлении) и с вопросом
   про «встроенный список» в сбросе локальной базы. Если когда-нибудь понадобится стартовый
   каталог — грузить его файлом рядом с оболочкой, а не зашивать в неё. */
nav("dashboard");
// СИНХРОННО на старте: если нет сохранённой сессии — сразу показываем полноэкранный вход
// (интерфейс под ним не виден, без мелькания). Вход обязателен — режима «без облака» больше нет.
(function gateEarly(){
  try{
    if(checkRecoveryLink()){ hideSplash(); return; }   // пришли по ссылке сброса пароля → экран нового пароля, не гейт
    if(!localStorage.getItem(NS+"vahtahoz_sess")) showLoginGate();   // нет своей сессии → гейт (тот же ключ, что и в cloudInit)
  }catch(e){}
})();
setTimeout(expiryNoticeOnOpen, 400);
// восстановление облачной сессии (если был вход) — тихо, не блокирует загрузку
setTimeout(()=>{ try{ cloudInit(); }catch(e){ console.warn(e); } }, 50);

/* ============================================================
   PWA: регистрация service worker (внешний sw.js)
   manifest подключён в <head> отдельным файлом.
   ============================================================ */

if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(e=>console.warn("SW reg failed",e));
  });
  // когда новый SW взял управление — перезагружаем страницу, чтобы подхватить свежие ассеты.
  // ЖДЁМ завершение идущего продления токена: reload посреди ротации refresh-токена терял НОВЫЙ токен
  // (ответ не долетал), после перезагрузки старый токен = «повторно использован» → разлогин при каждом обновлении версии.
  let _swReloaded = false;
  /* БЫЛ ЛИ КОНТРОЛЛЁР ДО НАС. На ПЕРВОМ открытии сайта контроллёра нет: свежий SW встаёт,
     делает skipWaiting + clients.claim() — и controllerchange срабатывает через секунду-другую
     после загрузки. Перезагружать тут нечего (страница и так свежайшая), а вот навредить есть чем:
     человек в этот момент как раз набирает почту и пароль на экране входа, и reload стирает
     набранное. Перезагрузка нужна только когда СМЕНИЛСЯ уже работавший SW — то есть выкачена
     новая версия. */
  const _hadController = !!navigator.serviceWorker.controller;
  // Перезагрузка не должна прилетать посреди ввода: ждём, пока человек уйдёт из поля.
  function _swReloadWhenIdle(tries){
    const ae = document.activeElement;
    const typing = ae && (ae.tagName==="INPUT" || ae.tagName==="TEXTAREA" || ae.isContentEditable);
    if(typing && (tries||0) < 30){ setTimeout(()=>_swReloadWhenIdle((tries||0)+1), 2000); return; }
    location.reload();
  }
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(_swReloaded) return; _swReloaded = true;
    if(!_hadController) return;                      // первый запуск — перезагружать нечего
    try{
      if(cloud && cloud._refreshing){ cloud._refreshing.catch(()=>{}).finally(()=>setTimeout(()=>_swReloadWhenIdle(0),100)); return; }
    }catch(_){}
    _swReloadWhenIdle(0);
  });
}

/* Многовкладочность: если другая вкладка сохранила состояние — подтягиваем его,
   иначе последующий saveState() из этой вкладки молча откатил бы чужие изменения. */
// идемпотентная нормализация формы state — после ПОВТОРНОГО присвоения state (storage-событие с другого
// устройства, импорт). Стартовый блок нормализации выполняется один раз и при переприсвоении не повторяется,
// из-за чего битая/старая схема могла уронить render. Дублирует ключевые shape-гарды + чистку позиций (всё идемпотентно).
function normalizeState(){
  // Второй рубеж после validateImport: не-объект в массиве (null/строка из битого файла или
  // storage-события) валит renderDashboard на старте — приложение не открывается.
  const objOnly = (a)=> Array.isArray(a) ? a.filter(x=>x && typeof x==="object" && !Array.isArray(x)) : [];
  state.stock = objOnly(state.stock);
  state.tasks = objOnly(state.tasks);
  state.log   = objOnly(state.log);
  if(!state.journals || typeof state.journals!=="object" || Array.isArray(state.journals)) state.journals = emptyJournals();
  for(const k of JOURNAL_KEYS) state.journals[k] = objOnly(state.journals[k]);
  if(!state.categories || typeof state.categories!=="object" || Array.isArray(state.categories)) state.categories = { product:[], household:[], tool:[] };
  for(const k of STOCK_TYPE_KEYS) if(!Array.isArray(state.categories[k])) state.categories[k] = (DEFAULT_CATEGORIES[k]||[]).slice();
  if(!state.locations || typeof state.locations!=="object" || Array.isArray(state.locations)){ state.locations={}; for(const k of STOCK_TYPE_KEYS) state.locations[k]=DEFAULT_LOCATIONS[k].slice(); }
  for(const k of STOCK_TYPE_KEYS){ if(!Array.isArray(state.locations[k])) state.locations[k]=[]; state.locations[k]=uniqClean(state.locations[k]); }   // пустой список мест валиден (места у каждой базы свои)
  ensureTomb();
  // вычитаем надгробия после ре-сида дефолтов — иначе ранее удалённые дефолтные места/категории
  // воскресли бы при storage-событии/импорте (как и в стартовом блоке нормализации)
  for(const k of STOCK_TYPE_KEYS){
    if(state.delLoc[k].length) state.locations[k] = applyTomb(state.locations[k], state.delLoc[k]);
    if(state.delCat[k].length && Array.isArray(state.categories[k])) state.categories[k] = applyTomb(state.categories[k], state.delCat[k]);
  }
  sanitizeStateIds();   // тот же рубеж, что и на старте: id из чужого/старого состояния идут в inline-onclick
  for(const s of state.stock) normalizeStockItem(s);
}
window.addEventListener("storage", (e)=>{
  // переключение базы на другом устройстве — пересинхронизируем метаданные профилей
  if(e.key===PROFILES_KEY && e.newValue){
    const p = loadProfiles();
    if(p){ profiles = p; renderHeader(); }
    return;
  }
  if(e.key===TASKS_KEY && e.newValue){
    // общие задачи изменились на другом устройстве/базе
    try{ loadGlobalTasks(); if(currentView==="tasks") render(); }catch(err){}
    return;
  }
  if(e.key===STORE_KEY && e.newValue){
    if(cloud.applying || cloud.busy) return;   // идёт pull/push в этой вкладке — не подменяем state под ногами (своё сохранение перепишет ключ)
    try{
      state = loadState(); normalizeState();   // битая/старая схема с другого устройства не должна ронять render
      loadGlobalTasks();                 // задачи общие — накладываем поверх per-base
      applyTheme(); render();
      toast("Данные обновлены на другом устройстве");
    }catch(err){ console.warn("storage sync failed", err); }
  }
});
</script>
