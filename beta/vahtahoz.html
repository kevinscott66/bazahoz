const stockNormName = s => (s||"").trim().toLowerCase();
function defaultCategoryForType(type){
  if(type!=="product") return "";
  return (state.categories.product||[]).includes("Прочие продукты") ? "Прочие продукты" : ((state.categories.product||[])[0] || "");
}
/* Индекс склада «тип|имя». findStockByName фильтрует ВЕСЬ склад на каждый вызов, а зовут её из
   циклов по журналу и по ledger-ключам: на базе владельца это тысячи проходов по 3082 карточкам
   на КАЖДОМ pull. Порядок внутри корзины — порядок state.stock, поэтому pool[0]/same[0] те же. */
function buildStockNameIndex(){
  const m = new Map();
  for(const s of (state.stock||[])){
    const k = s.type+"|"+stockNormName(s.name);
    if(!m.has(k)) m.set(k, []);
    m.get(k).push(s);
  }
  return m;
}
function stockNameIndexAdd(idx, s){
  if(!idx || !s) return;
  const k = s.type+"|"+stockNormName(s.name);
  if(!idx.has(k)) idx.set(k, []);
  idx.get(k).push(s);
}
// idx (buildStockNameIndex) необязателен и работает только вместе с явным type — без него всё как раньше
function findStockByName(name, type, unit, idx){
  const n = stockNormName(name);
  if(!n) return null;
  const pool = (idx && type) ? (idx.get(type+"|"+n) || [])
    : type
    ? state.stock.filter(s=> s.type===type && stockNormName(s.name)===n)
    : state.stock.filter(s=> allowedTypeKeys().includes(s.type) && stockNormName(s.name)===n);
  if(!pool.length) return null;
  // unit передан (в т.ч. "") → строгий ключ; неизвестная ед. — не приклеиваем к pool[0]
  if(arguments.length >= 3){
    const wantU = _impUnitKey(unit);
    if(wantU==null) return null;
    const same = pool.filter(s=> _impUnitKey(s.unit)===wantU);
    return same[0] || null;
  }
  return pool[0];
}
function createCatalogStockItem(type, name, unit){
  return {
    id: uid(), type: type||"product", name: String(name||"").trim(),
    qty: 0, unit: unit||"шт", minStock:"", expiry:"", location:"",
    category: defaultCategoryForType(type||"product"),
    note:"", createdAt:new Date().toISOString(),
  };
}
// Приход: найти существующую позицию по имени или создать каталожную (qty=0).
// skipPropagate=true — для bulk-импорта (иначе O(N·баз) полных сериализаций localStorage)
function resolveIncomingProduct({ productId, manualName, unit, type, skipPropagate }){
  type = type || "product";
  let product = productId ? state.stock.find(s=>s.id===productId) : null;
  const name = String(product ? product.name : (manualName||"")).trim();
  if(!name) return null;
  if(!product) product = findStockByName(name, type, unit);
  if(!product){
    product = createCatalogStockItem(type, name, unit||"шт");
    state.stock.push(product);
    if(!skipPropagate){ try{ propagateName(type, name, product.unit); }catch(e){ console.warn("propagateName", e); } }
  }
  return product;
}
// Изменение остатка: для партийных карточек приход = новая партия (как при приёме заказа).
function applyStockDelta(product, sign, qty, note, op){
  if(!product || !sign) return;
  if(sign > 0 && hasBatches(product)){
    const newB = { id: uid(), qty: roundQty(qty), expiry:"", location:"", note: note||"Поступление", createdAt:new Date().toISOString() };
    product.batches = product.batches || [];
    product.batches.push(newB);
    if(op){ op.batchId = newB.id; op.batchLocation = ""; op.batchExpiry = ""; }
    syncItemFromBatches(product);
  } else {
    const _was = Number(product.qty||0);
    product.qty = roundQty(_was + sign*qty);
    clearExpiryOnZero(product, _was);   // расход в ноль — срок и место уходят вместе с остатком
  }
  product.updatedAt = new Date().toISOString();
}

function journalEffectSign(kind, op){
  if(kind==="receipt") return 1;
  if(kind==="issue" || kind==="writeoff") return -1;
  // Заказ НЕ учитывается в ledger: приём заказа (orderReceive) создаёт зеркальную запись
  // в "receipt", она и даёт +qty. Иначе принятый заказ считался бы дважды (раздувал остаток).
  return 0;
}
// Тип склада для RLS журнала (data.stockType). Денормализуем при записи — после удаления позиции тип не «сиротеет».
function journalStockType(product, fallback){
  const t = (product && product.type) || fallback || "product";
  return (typeof STOCK_TYPE_KEYS!=="undefined" && STOCK_TYPE_KEYS.includes(t)) ? t : "product";
}
// Сколько записей журнала ссылается на карточку. refs — необязательный готовый счётчик
// (buildJournalRefCounts): без него это полный проход по журналу на КАЖДЫЙ вызов, а вызывают
// из компаратора сортировки — на базе с сотнями дублей это те же миллионы итераций.
function journalRefScore(it, refs){
  if(refs) return refs.get(it.id) || 0;
  let n = 0;
  for(const kind of JOURNAL_KEYS){
    for(const op of (state.journals[kind]||[])) if(op && op.productId===it.id) n++;
  }
  return n;
}
function buildJournalRefCounts(){
  const m = new Map();
  for(const kind of JOURNAL_KEYS){
    for(const op of (state.journals[kind]||[])) if(op && op.productId) m.set(op.productId, (m.get(op.productId)||0) + 1);
  }
  return m;
}
/* Индекс журнала для сверки. Раньше ledgerQtyForProduct прогонял ВЕСЬ журнал по КАЖДОЙ позиции:
   на базе владельца это 3082 × 6000 ≈ 18 млн итераций — секунды на десктопе и замерший экран
   на телефоне. Один проход по журналу даёт те же суммы; правила совпадения ниже — дословно те же:
   - запись с productId и БЕЗ единицы вовсе (legacy-журнал) — совпадение по id авторитетно (byIdAny);
   - запись с productId и с ПОНЯТНОЙ единицей — совпадает, только если единица карточки та же
     (карточку перевели из «шт» в «кор» → 720 шт не должны лечь как 720 кор);
   - запись БЕЗ productId — только по нормализованному имени И совпадающей единице (иначе движение
     с чужим/удалённым productId приписалось бы не той карточке);
   - запись с непонятной единицей (_impUnitKey → null) не учитывается вовсе — fail-closed;
   - «[партия удалена]» пропускаем: qty уже снят с карточки, сверка не должна его поднимать. */
function buildLedgerIndex(){
  const byIdUnit = new Map(), byIdAny = new Map(), byName = new Map();
  for(const kind of JOURNAL_KEYS){
    for(const op of (state.journals[kind]||[])){
      if(!op) continue;
      const sign = journalEffectSign(kind, op);
      if(!sign) continue;
      if(/\[партия удалена\]/.test(op.note||"")) continue;
      const v = sign * Number(op.qty||0);
      const ou = _impUnitKey(op.unit);
      if(op.productId){
        if(!String(op.unit||"").trim()) byIdAny.set(op.productId, (byIdAny.get(op.productId)||0) + v);
        else if(ou){ const k = op.productId+"|"+ou; byIdUnit.set(k, (byIdUnit.get(k)||0) + v); }
      } else if(ou){
        const k = stockNormName(op.productName)+"|"+ou;
        byName.set(k, (byName.get(k)||0) + v);
      }
    }
  }
  return { byIdUnit, byIdAny, byName };
}
// idx необязателен: без него считаем как раньше — один проход на одну позицию.
function ledgerQtyForProduct(product, idx){
  if(!product) return 0;
  idx = idx || buildLedgerIndex();
  const pu = _impUnitKey(product.unit);
  let sum = idx.byIdAny.get(product.id) || 0;
  if(pu){
    sum += idx.byIdUnit.get(product.id+"|"+pu) || 0;
    sum += idx.byName.get(stockNormName(product.name)+"|"+pu) || 0;
  }
  return roundQty(sum);
}
function ledgerByNormName(){
  // ключ type::name — иначе одноимённые orphan product/tool сливаются в один ledger
  const m = new Map();
  const stockIds = new Set((state.stock||[]).map(s=>s.id));
  for(const kind of JOURNAL_KEYS){
    for(const op of (state.journals[kind]||[])){
      const sign = journalEffectSign(kind, op);
      if(!sign) continue;
      // с productId учитываем только orphan (id нет на складе) — иначе чужая живая карточка
      // «по имени» раздувала ledger и ensureProducts перепривязывал чужие ops
      if(op.productId && stockIds.has(op.productId)) continue;
      if(/\[партия удалена\]/.test(op.note||"")) continue;
      const n = stockNormName(op.productName);
      if(!n) continue;
      const typ = (op.stockType && STOCK_TYPE_KEYS.includes(op.stockType)) ? op.stockType : "product";
      const u = _impUnitKey(op.unit);
      if(!u) continue;   // неизвестная ед. — не создаём фантом «шт»
      const key = typ + "::" + n + "::" + u;
      m.set(key, roundQty((m.get(key)||0) + sign * Number(op.qty||0)));
    }
  }
  return m;
}
function relinkJournalOpsToCanonical(){
  let n = 0;
  // индекс по id вместо state.stock.find в цикле по журналу: было произведение «записи × позиции»
  // (на базе владельца — десятки миллионов сравнений), стало один проход по складу
  const byId = new Map();
  for(const s of (state.stock||[])) byId.set(s.id, s);
  const byName = buildStockNameIndex();   // тот же приём для поиска по имени: состав склада здесь не меняется
  for(const kind of JOURNAL_KEYS){
    for(const op of (state.journals[kind]||[])){
      const name = (op.productName||"").trim();
      if(!name) continue;
      let canon = op.productId ? (byId.get(op.productId) || null) : null;
      // без stockType — как ledger/ensure: «product» (не any-type → не цеплять tool и плодить product)
      const preferType = (op.stockType && STOCK_TYPE_KEYS.includes(op.stockType)) ? op.stockType : "product";
      if(!canon) canon = findStockByName(name, preferType, op.unit, byName);
      if(!canon) continue;
      if(op.productId!==canon.id || op.productName!==canon.name){
        op.productId = canon.id;
        op.productName = canon.name;
        if(canon.type) op.stockType = journalStockType(canon, op.stockType);
        n++;
      }
    }
  }
  return n;
}
function mergeDuplicateStockByName(){
  const groups = new Map();
  for(const s of (state.stock||[])){
    // unit в ключе: иначе «кг» и «шт» с одним именем схлопывались и суммировали qty
    const u = _impUnitKey(s.unit) || "шт";
    const key = `${s.type}|${stockNormName(s.name)}|${u}`;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  let merged = 0;
  const _refs = buildJournalRefCounts();   // один проход по журналу на всё слияние, а не на каждое сравнение
  for(const items of groups.values()){
    if(items.length < 2) continue;
    items.sort((a,b)=> (journalRefScore(b,_refs)*1e6 + totalQtyOf(b)) - (journalRefScore(a,_refs)*1e6 + totalQtyOf(a)));
    const primary = items[0];
    for(const dup of items.slice(1)){
      if(hasBatches(dup)){
        // primary БЕЗ партий, но с остатком → сначала превращаем его qty в первую партию.
        // Иначе syncItemFromBatches ниже посчитает qty ТОЛЬКО по партиям дубля, и legacy-остаток
        // primary молча исчезнет (ветка else была недостижима: после push partий дубля
        // primary.batches всегда непуст). Приём тот же, что в зеркальной ветке ниже.
        if(!hasBatches(primary) && roundQty(primary.qty||0) > 0){
          primary.batches = [{ id:uid(), qty:roundQty(primary.qty||0), expiry:primary.expiry||"",
            location:primary.location||"", note:"Слияние дубля", createdAt:new Date().toISOString() }];
        }
        primary.batches = primary.batches || [];
        const usedIds = new Set(primary.batches.map(b=>b.id));
        for(const b of batchesOf(dup)){
          // СОХРАНЯЕМ b.id — иначе op.batchId в журнале осиротеет («партия не найдена»).
          // Новый id только при коллизии, с переносом ссылок в журнале.
          let bid = b.id;
          if(usedIds.has(bid)){
            const nid = uid();
            for(const kind of JOURNAL_KEYS) for(const op of (state.journals[kind]||[])){ if(op && op.batchId===bid && op.productId===dup.id) op.batchId = nid; }
            bid = nid;
          }
          usedIds.add(bid);
          primary.batches.push({ ...b, id: bid });
        }
        syncItemFromBatches(primary);   // qty = сумма ВСЕХ партий (включая перенесённый legacy-остаток)
      } else if(hasBatches(primary)){
        if(roundQty(dup.qty||0) > 0){
          primary.batches.push({ id:uid(), qty:roundQty(dup.qty||0), expiry:dup.expiry||"", location:dup.location||"", note:"Слияние дубля", createdAt:new Date().toISOString() });
          syncItemFromBatches(primary);
        }
      } else {
        primary.qty = roundQty(Number(primary.qty||0) + Number(dup.qty||0));
      }
      for(const kind of JOURNAL_KEYS){
        for(const op of (state.journals[kind]||[])){
          if(op && op.productId===dup.id){ op.productId = primary.id; op.productName = primary.name; }
        }
      }
      state.stock = state.stock.filter(x=>x.id!==dup.id);
      merged++;
    }
    primary.updatedAt = new Date().toISOString();
    if(hasBatches(primary)) syncItemFromBatches(primary);
  }
  return merged;
}
function ensureProductsFromJournalLedger(){
  let created = 0;
  const ledgers = ledgerByNormName();
  const stockIds = new Set((state.stock||[]).map(s=>s.id));
  const byName = buildStockNameIndex();   // созданные ниже карточки докладываем в индекс (stockNameIndexAdd)
  for(const [key, ledger] of ledgers){
    if(!(ledger > 0)) continue;
    // typ::name::unit — name может содержать «::», unit всегда последний сегмент
    const i1 = key.indexOf("::"), i2 = key.lastIndexOf("::");
    const typ = i1>=0 ? key.slice(0,i1) : "product";
    const wantU = (i2>i1) ? key.slice(i2+2) : "шт";
    const n = (i1>=0 && i2>i1) ? key.slice(i1+2, i2) : (i1>=0 ? key.slice(i1+2) : key);
    const type = STOCK_TYPE_KEYS.includes(typ) ? typ : "product";
    if(findStockByName(n, type, wantU, byName)) continue;
    let sampleName = "", sampleUnit = wantU;
    outer: for(const kind of JOURNAL_KEYS){
      for(const op of (state.journals[kind]||[])){
        if(stockNormName(op.productName)!==n) continue;
        const ot = (op.stockType && STOCK_TYPE_KEYS.includes(op.stockType)) ? op.stockType : "product";
        if(ot!==type) continue;
        if((_impUnitKey(op.unit)||"")!==wantU) continue;
        sampleName = op.productName.trim(); sampleUnit = _impUnitKey(op.unit)||wantU; break outer;
      }
    }
    if(!sampleName) continue;
    const p = createCatalogStockItem(type, sampleName, sampleUnit);
    p.qty = ledger;
    state.stock.push(p);
    stockIds.add(p.id);
    stockNameIndexAdd(byName, p);   // следующий ledger-ключ с тем же именем должен видеть созданную карточку
    try{ propagateName(type, p.name, p.unit); }catch(e){}
    for(const kind of JOURNAL_KEYS){
      for(const op of (state.journals[kind]||[])){
        if(stockNormName(op.productName)!==n) continue;
        const ot = (op.stockType && STOCK_TYPE_KEYS.includes(op.stockType)) ? op.stockType : "product";
        if(ot!==type) continue;
        if((_impUnitKey(op.unit)||"")!==wantU) continue;
        if(op.productId && stockIds.has(op.productId)) continue;
        op.productId = p.id; op.productName = p.name; op.stockType = type;
      }
    }
    created++;
  }
  return created;
}
// Сверка остатка с журналом. allowDown=false (по умолчанию) — только повышаем недосчитанные
// (безопасно: журнал мог не попасть в остаток). allowDown=true — приводим и завышенные к журналу
// (только по явному запросу пользователя: журнал не всегда полный, ручное занижение возможно).
function reconcileLegacyQtyFromJournal(allowDown, allowUp){
  if(allowUp==null) allowUp = true;
  /* НИ ВВЕРХ, НИ ВНИЗ — СЧИТАТЬ НЕЧЕГО. Именно так и вызывают на ОБЛАЧНОЙ базе: журнал там всегда
     считается неполным (другие участники дописывают движения между синхронизациями), поэтому обе
     коррекции отключены. А цикл ниже прогонял ВЕСЬ журнал по КАЖДОЙ позиции и выбрасывал результат:
     на базе владельца (3082 позиции × 6000 записей) это десять секунд на десктопе и до полуминуты
     замершего экрана на телефоне — без индикатора и без отмены, при гарантированно нулевом эффекте. */
  if(!allowUp && !allowDown) return { fixed:0, up:[], down:[] };
  const up = [], down = [];
  const _idx = buildLedgerIndex();   // один проход по журналу на всю сверку, а не на каждую позицию
  for(const s of (state.stock||[])){
    if(hasBatches(s)) continue;
    const ledger = ledgerQtyForProduct(s, _idx);
    const cur = totalQtyOf(s);
    if(ledger === cur) continue;
    if(ledger > cur){
      if(!allowUp) continue;   // усечённый/облачный локальный журнал — raise раздувает qty
      s.qty = ledger; s.updatedAt = new Date().toISOString();
      up.push({ name:s.name, was:cur, now:ledger });
    } else if(allowDown && ledger >= 0){
      s.qty = ledger; s.updatedAt = new Date().toISOString();
      down.push({ name:s.name, was:cur, now:ledger });
    }
  }
  return { fixed: up.length + down.length, up, down };
}
/* Можно ли доверять локальному журналу как ПОЛНОМУ ledger-у. Осторожность здесь намеренная: на
   этом ответе завязан рискованный подъём остатков по журналу, и ошибка в сторону «полный» дороже
   ошибки в сторону «неполный». Облачная база остаётся «неполной» даже после честного pull —
   другие участники дописывают движения между синхронизациями. Новое здесь одно: явный флаг
   journalsTrunc, который ставит тот, кто реально выбросил записи (память или JOURNAL_LOCAL_CAP). */
function journalLooksIncomplete(){
  if(state.journalsTrunc === true) return true;
  if(activeCloudId()) return true;
  const jrLen = JOURNAL_KEYS.reduce((n,k)=> n + ((state.journals[k]||[]).length), 0);
  return jrLen >= 500;
}
// список позиций, где остаток БОЛЬШЕ журнала (кандидаты на завышение, напр. старым багом сверки)
function overCountedVsJournal(){
  const over = [];
  const _idx = buildLedgerIndex();   // тот же один проход, что и в сверке
  for(const s of (state.stock||[])){
    if(hasBatches(s)) continue;
    const ledger = ledgerQtyForProduct(s, _idx);
    const cur = totalQtyOf(s);
    if(cur > ledger && ledger >= 0) over.push({ id:s.id, name:s.name, cur, ledger });
  }
  return over;
}
/* КОМУ ЭТО НУЖНО. Пункт стоял под одним лишь правом правки склада, то есть был виден обычному
   хозрабочему и повару. Он не для них: сверка сливает карточки склада и переписывает остатки по
   журналу — это разбор расхождений, работа того, кто за базу отвечает. Оставляем управляющим
   (начальник участка и выше, партийные/глобальные) и владельцу, а на локальной базе без облака —
   всем, кто её правит: там человек сам себе начальник. */
function canReconcileStock(){
  if(!canEditStock()) return false;
  if(!activeCloudId()) return true;
  return canManageBase();
}
function runStockJournalReconcile(allowDown, allowMerge){
  /* ПРАВО — ТО ЖЕ, ЧТО У КНОПКИ. Кнопка «Сверка склада» закрыта canReconcileStock (нач. участка
     и выше на общей базе), а сама функция проверяла лишь canEditStock — то есть повару или
     хозрабочему хватило бы одного вызова из консоли, чтобы слить карточки и переписать остатки
     всей бригады. Ради этого рубеж и вводили (см. комментарий у canReconcileStock).
     Автозапуск при входе от этого не меняется: runAutoStockJournalReconcile выходит раньше, если
     journalLooksIncomplete(), а тот возвращает true для ЛЮБОЙ облачной базы; на локальной же базе
     canReconcileStock() и canEditStock() совпадают по определению. */
  if(!canReconcileStock()) return { merged:0, relinked:0, created:0, fixed:0, up:[], down:[], skippedBatched:0, incomplete:false };
  const incomplete = journalLooksIncomplete();
  // merge дублей — только по явной «Сверке» (allowMerge). Авто/boot не сливает карточки.
  const merged = allowMerge ? mergeDuplicateStockByName() : 0;
  const relinked = relinkJournalOpsToCanonical();
  // create/raise по усечённому журналу раздувают остатки (нет выдач в хвосте) — только relink+merge
  const created = incomplete ? 0 : ensureProductsFromJournalLedger();
  const { fixed, up, down } = reconcileLegacyQtyFromJournal(!!allowDown && !incomplete, !incomplete);
  const skippedBatched = (state.stock||[]).filter(s=>hasBatches(s)).length;
  if(merged || relinked || created || fixed){
    saveState();
    try{ cloudMaybePush(); }catch(_){}
    try{ render(); }catch(_){}
  }
  return { merged, relinked, created, fixed, up, down, skippedBatched, incomplete };
}
function runAutoStockJournalReconcile(){
  // v5: при облаке/усечённом журнале raise отключён (post-pull сверка идёт по полному журналу).
  const key = NS + "vahtahoz_stock_reconcile_v5_" + (profiles.activeId || "default");
  if(localStorage.getItem(key)) return null;
  if(journalLooksIncomplete()){ localStorage.setItem(key, "1"); return null; }
  const r = runStockJournalReconcile(false, false);   // авто — только вверх, без merge; только полный локальный журнал
  localStorage.setItem(key, "1");
  const parts = [];
  if(r.created) parts.push(`новых поз.: ${r.created}`);
  if(r.fixed) parts.push(`остатков исправлено: ${r.fixed}`);
  if(parts.length) setTimeout(()=>toast(`Сверка склада: ${parts.join(", ")}`), 900);
  return r;
}
async function openStockReconcileSheet(){
  if(!ensureCanEdit()) return;
  if(!canReconcileStock()){ toast("Сверка склада доступна начальнику участка и выше"); return; }
  // локальный журнал усечён (pull держит хвост, другие участники дописывают) → и up, и down по нему опасны
  const jrTruncated = journalLooksIncomplete();
  openSheet(`
    <div class="font-bold text-xl mb-2">${jrTruncated?"Объединить дубли склада":"Сверка склада по журналу"}</div>
    ${jrTruncated
      ? `<div class="text-sm opacity-70 mb-3">Склеивает карточки с одинаковым названием и единицей в одну: количества складываются, партии и записи журнала переносятся. Остатки по журналу здесь НЕ правятся.</div>
         <div class="text-xs opacity-70 mb-3">${ico("alert",14)} Почему: журнал на этом телефоне неполный — у общей базы движения дописывают другие участники, и часть истории лежит только в облаке. Считать по нему остатки нельзя. Полный подъём остатков делается при загрузке из облака.</div>`
      : `<div class="text-sm opacity-70 mb-3">Сравнивает остатки с записями «Поступление», «Выдача» и «Списание». По кнопке ниже объединяет дубли по названию+единице. Автозапуск при входе дубли не сливает и не поднимает остатки по усечённому журналу. Заказы не учитываются.</div>
         <label class="flex items-center gap-2 text-sm mb-3"><input type="checkbox" id="reconcileDown" /> Приводить и завышенные остатки к журналу (если остаток больше, чем по движениям)</label>`}
    <div class="text-xs opacity-60 mb-3">Товары с партиями (срок годности) сверяются вручную — автоматом не трогаем.</div>
    <button class="btn btn-primary w-full" id="reconcileGo">${jrTruncated?"Объединить дубли":"Запустить сверку"}</button>
    <div id="reconcileOut" class="text-sm mt-3 whitespace-pre-line opacity-80"></div>
  `);
  document.getElementById("reconcileGo").onclick = ()=>{
    const downEl = document.getElementById("reconcileDown");
    const allowDown = !!(downEl && downEl.checked) && !jrTruncated;
    const r = runStockJournalReconcile(allowDown, true);
    const lines = [];
    if(r.merged) lines.push(`Объединено дублей: ${r.merged}`);
    if(r.relinked) lines.push(`Перепривязано записей журнала: ${r.relinked}`);
    if(r.created) lines.push(`Создано позиций на складе: ${r.created}`);
    if(r.fixed) lines.push(`Исправлено остатков: ${r.fixed}`);
    if(r.incomplete && !lines.length) lines.push("Одинаковых карточек не нашлось — склеивать нечего.");
    else if(r.incomplete) lines.push("", "Остатки по журналу не трогали — журнал на телефоне неполный.");
    const ex = [...(r.up||[]), ...(r.down||[])];
    if(ex.length){
      lines.push("", "Примеры (было → стало):");
      ex.slice(0,12).forEach(x=> lines.push(`• ${x.name}: ${fmtQty(x.was)} → ${fmtQty(x.now)}`));
      if(ex.length>12) lines.push(`… и ещё ${ex.length-12}`);
    }
    if(!allowDown && !jrTruncated){
      const over = overCountedVsJournal();
      if(over.length) lines.push("", `⚠ Остаток больше локального журнала у ${over.length} поз. — включите галочку выше, чтобы привести к журналу.`);
    }
    if(!lines.length) lines.push("Расхождений не найдено — склад совпадает с журналом.");
    document.getElementById("reconcileOut").textContent = lines.join("\n");
    toast(r.merged || r.relinked || r.fixed || r.created
      ? (jrTruncated ? "Готово" : "Сверка выполнена")
      : (jrTruncated ? "Дублей не найдено" : "Расхождений нет"));
  };
}

function saveOp(kind){
  if(!ensureCanEdit()) return;
  const m = JOURNAL_META[kind];
  const body = document.getElementById("sheetBody");
  const pid = body.querySelector("#opProdId").value;
  const manualName = body.querySelector("#opName").value.trim();
  const qty = roundQty(parseNum(body.querySelector("#opQty").value));   // округляем в источнике: op.qty, склад и лог единообразны (иначе float-хвост ломает авто-удаление орфана)
  const unit = body.querySelector("#opUnit").value;
  const note = body.querySelector("#opNote").value.trim();
  if(!qty || qty<=0){ toast("Укажите количество"); return; }
  let product = pid ? state.stock.find(s=>s.id===pid) : null;
  // тип с активной вкладки склада (household/tool), иначе product — не создаём «еду» с вкладки инструмента
  const defType = (STOCK_TYPE_KEYS.includes(stockTab) ? stockTab : "product");
  if(!product && m.sign>0) product = resolveIncomingProduct({ manualName, unit, type: defType });
  const name = product ? product.name : manualName;
  if(!name){ toast("Выберите товар или введите название"); return; }
  // Расход/списание с партиями — только через ＋/− на карточке (выбор партии)
  if(product && hasBatches(product) && m.sign<0){
    toast("У этой позиции есть партии — используйте ＋/− на карточке (выбор партии)");
    return;
  }
  if(product && m.sign<0 && Number(product.qty||0) < qty){ toast("Не хватает на складе"); return; }
  // Защита от «расхода в воздух»: если выбрали ручной ввод имени и это расход — не даём проводить движение
  if(!product && m.sign<0){
    toast("Для расхода выберите позицию со склада (поиск выше)");
    return;
  }

  const op = {
    id: uid(),
    ts: new Date().toISOString(),
    productId: product?.id || "",
    productName: name,
    qty,
    unit: product?.unit || unit,
    note,
    stockType: journalStockType(product, defType),
  };
  if(kind==="order") op.status = "pending";

  if(product && m.sign!==0) applyStockDelta(product, m.sign, qty, note, m.sign>0 ? op : null);
  state.journals[kind] = state.journals[kind] || [];
  state.journals[kind].unshift(op);
  logOp(kind.toUpperCase(), `${name} ${m.sign>0?"+":m.sign<0?"-":""}${qty} ${op.unit||""}`);
  saveState(); closeSheet(); render();
  toast(`${m.verb}: ${name}`);
}

/* ===================== ИМПОРТ ПОСТУПЛЕНИЯ ИЗ EXCEL =====================
   Два формата:
   1) Простой шаблон: первая строка — заголовки (Наименование | Количество | …)
   2) УПД / счёт-фактура (.xlsx от поставщика): строки товаров + дата «от ДД.ММ.ГГГГ»
   Каждая строка = поступление на склад + запись в журнал. */

// убираем из наименования прайс/логистический мусор поставщика
// (\b в JS не видит кириллицу)
function cleanNameImport(s){
  let t = String(s??"").replace(/[<>'"\\\r\n]/g,"").trim();
  t = t.replace(/^\*+\s*/, "").replace(/\s*\*+$/, "");
  // цена / прайс (без \b — иначе кириллица не матчится)
  t = t.replace(/цена\s*за\s*(штуку|шт\.?|блочок|блок|коробку|кор\.?|уп\.?|упаковку|\d+\s*листов?)/gi, " ");
  t = t.replace(/цена\s*[=:]\s*[\d.,]+\s*(руб\.?|₽|р\.?)?/gi, " ");
  t = t.replace(/по\s+цене\s+[\dхxХ]+/gi, " ");
  t = t.replace(/\d+[.,]\d{2}\s*(руб\.?|₽|р\.)(?![0-9A-Za-zА-Яа-яЁё])/gi, " ");
  t = t.replace(/(?<![0-9A-Za-zА-Яа-яЁё])\d+\s*(руб\.?|₽)(?![0-9A-Za-zА-Яа-яЁё])/gi, " ");
  // условия отгрузки / маркетинг (в т.ч. слитно: молочныеТОЛЬКО БЛОЧКАМИ)
  t = t.replace(/только\s+(блочками|местами|коробками|штуками|упаковками)/gi, " ");
  t = t.replace(/промо[- ]?пак/gi, " ");
  t = t.replace(/\(\s*\d+\s*\+\s*\d+\s*в\s+подарок[^)]*\)/gi, " ");
  t = t.replace(/\+\s*\d+\s*гр?\.?\s*в\s+подарок/gi, " ");
  t = t.replace(/\[\s*[дс]\s*\]/gi, " ");
  // хвост даты поставки из УПД: (23.06.2026, РОССИЯ) / * (04.06–06.06.2026, РОССИЯ)
  t = t.replace(/\s*\*?\s*\(\s*\d{1,2}[./]\d{1,2}[./]\d{2,4}(?:\s*[-–]\s*\d{1,2}[./]\d{1,2}[./]\d{2,4})?\s*,\s*[А-ЯA-ZЁ][^)]*\)\s*$/u, "");
  t = t.replace(/\s{2,}/g, " ").replace(/\s+([,.;])/g, "$1").replace(/[,\s.;\-–—*]+$/g, "").trim();
  return t.slice(0, 200);
}
const _impNormHeader = (h) => String(h||"").toLowerCase().replace(/ё/g,"е").replace(/[\s.\-_№#\/]+/g,"").trim();
const _IMP_HEADER_MAP = {
  name:     ["наименование","название","товар","номенклатура","name","item","product"],
  qty:      ["количество","колво","кол","qty","quantity","count","приход","поступило"],
  unit:     ["едизм","ед","единица","единицаизмерения","unit","uom"],
  category: ["категория","группа","category","group"],
  expiry:   ["срокгодности","срок","годендо","expiry","expirydate","bestbefore"],
  location: ["место","локация","склад","ячейка","location","place"],
  note:     ["примечание","коммент","комментарий","note","comment","поставщик","supplier"],
  date:     ["дата","датапоступления","датаприхода","date","receiptdate"],
  /* Тип склада (продукты/хозтовары/инструменты). Раньше колонки не было вовсе, и приход
     хозтовара по файлу заводил карточку в «Продуктах» — см. _impRowType. */
  type:     ["тип","типпозиции","типсклада","раздел","type","kind"],
};
// dict — необязательный словарь заголовков (опись склада читает свой, _INV_HEADER_MAP)
function _impMapHeaders(headerRow, dict){
  dict = dict || _IMP_HEADER_MAP;
  const map = {};
  for(const raw of headerRow){
    const n = _impNormHeader(raw);
    for(const field in dict){
      if(dict[field].includes(n)){ map[raw] = field; break; }
    }
  }
  return map;
}
function _excelSerialToISO(n){
  const ms = Math.round((Number(n) - 25569) * 86400 * 1000);
  const d = new Date(ms);
  return isNaN(d.getTime()) ? "" : d.toISOString().slice(0,10);
}
function _impParseDate(v){
  if(v==null || v==="") return "";
  if(v instanceof Date){
    if(isNaN(v.getTime())) return "";
    return new Date(v.getTime() - v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }
  if(typeof v==="number") return _excelSerialToISO(v);
  const s = String(v).trim();

    if(pu==="шт" && u==="кор") return { qty: roundQty(q*pack), unit:"шт" };
    if(pu==="уп" && u==="шт" && q >= pack && Math.abs(q % pack) < 1e-6) return { qty: roundQty(q/pack), unit:"уп" };
    if(pu==="шт" && u==="уп") return { qty: roundQty(q*pack), unit:"шт" };
  }
  // нельзя молча сменить unit и оставить чужой qty — пропускаем строку
  return null;
}
/* СУХОЙ ПРОГОН ПЕРЕД ДИАЛОГОМ. Диалог обещал число строк, у которых есть наименование и
   количество > 0, а дальше recordReceiptRow молча отбрасывал ещё две категории — с неизвестной
   единицей и с единицей, не сводимой к карточке. Воспроизведено на v247: файл из 4 строк, диалог
   «Импортировать поступлений: 4», после подтверждения — «Импортировано: 3». Строка «Крупа
   гречневая — 4 ящик» стояла в превью как ни в чём не бывало.
   Здесь считаем ровно то же, что сделает боевой цикл, но ничего не меняя: все зовомые помощники
   (_impMapUnit / _impNormalizePackQty / findStockForImport / _impAlignQtyToProduct) — читающие.
   Порядок важен: строки обрабатываются по очереди, и строка, заводящая новую карточку, меняет
   то, что найдут следующие строки с тем же наименованием, — поэтому в pool кладётся заглушка
   (findStockForImport читает у карточки только type/name/unit/qty/batches).

   ОТДЕЛЬНАЯ КАРТОЧКА — не пропуск, а сюрприз. Если на складе «Сахар-песок» в кг, а в накладной
   он в шт, findStockForImport не сведёт их намеренно (кг и шт — разный товар), и строка заведёт
   ВТОРУЮ карточку с тем же именем. Импорт при этом отработает, поэтому в пропуски это не идёт,
   но кладовщик увидит «Сахар-песок» в списке дважды и решит, что приложение задвоило склад.
   Логику не трогаем (сливать кг со шт нельзя), а в диалоге предупреждаем — до подтверждения. */
function _impPreflight(rows){
  const pool = (state.stock||[]).slice();
  const ok = [], skipped = [], dups = [], keys = [];   // keys — ключи принятых строк для проверки «уже загружали» (_impLooksReloaded)
  for(const row of rows){
    const name = cleanNameImport(row.name);
    const qty0 = roundQty(parseNum(row.qty));
    if(!name || !(qty0 > 0)){
      skipped.push({ name: String(row.name||"").trim().slice(0,40) || "(без наименования)",
                     why: !name ? "нет наименования" : "количество не больше нуля" });
      continue;
    }
    const u0 = _impMapUnit(row.unit);
    if(u0 == null){
      skipped.push({ name: name.slice(0,40),
                     why: `непонятная единица «${String(row.unit||"").trim() || "пусто"}»` });
      continue;
    }
    // тип — как в боевом цикле: колонка файла, иначе активная вкладка; чужой роли тип не пройдёт
    const t = _impRowType(row);
    if(t.why){ skipped.push({ name: name.slice(0,40), why: t.why }); continue; }
    const type = t.type;
    const { qty, unit } = _impNormalizePackQty(name, qty0, u0);
    let product = findStockForImport(name, unit, pool, type);
    if(!product){
      const pack = _impPackSize(name);
      if(pack > 1){
        const alts = unit==="шт" ? ["кор","уп"] : (unit==="кор"||unit==="уп") ? ["шт"] : [];
        for(const au of alts){ const cand = findStockForImport(name, au, pool, type); if(cand){ product = cand; break; } }
      }
    }
    if(!product){
      const twin = pool.find(s=> s.type===type && stockNormName(s.name)===stockNormName(name)
                                 && _impUnitKey(s.unit) !== unit);
      if(twin) dups.push({ name: name.slice(0,40), unit, have: twin.unit||"шт" });
      pool.push({ id:"_pre_"+pool.length, type, name, unit, qty:0, batches:[] });
      ok.push(row);
      keys.push(_impRowKey(name, unit, qty));   // новая карточка: имя и единица будут как в файле
      continue;
    }
    const _al = _impAlignQtyToProduct(product, name, qty, unit);
    if(!_al){
      skipped.push({ name: name.slice(0,40),
                     why: `единица «${unit}» не сходится с карточкой «${product.unit||"шт"}»` });
      continue;
    }
    ok.push(row);
    // ключ считаем ПОСЛЕ приведения к карточке — recordReceiptRow пишет в журнал именно эти
    // имя/единицу/количество (2 кор при карточке в шт превращаются в 24 шт)
    keys.push(_impRowKey(product.name, product.unit||_al.unit, _al.qty));
  }
  return { ok, skipped, dups, keys };
}
/* Ключ строки поступления: имя + единица + количество. Один и тот же для файла (после приведения
   к карточке) и для уже лежащей записи журнала — на этом и держится проверка «эту накладную,
   похоже, уже загружали». */
function _impRowKey(name, unit, qty){
  return `${stockNormName(name)}|${_impUnitKey(unit)||String(unit||"").trim()}|${roundQty(qty||0)}`;
}
/* «ПОХОЖЕ, ЭТУ НАКЛАДНУЮ УЖЕ ЗАГРУЖАЛИ». Повторная загрузка одной накладной не ловилась ничем, а
   поводов ровно два и оба рядовые: «файл выбрал, экран не отозвался, выбрал ещё раз» и «один и
   тот же УПД прислали и кладовщику, и начальнику». Приход применяется молча, склад удваивается,
   а разбирать потом нечем — записи журнала выглядят настоящими, потому что они настоящие.
   ПРОВЕРКА ДЕШЁВАЯ: один проход по журналу поступлений, ключи по файлу уже посчитаны сухим
   прогоном. Совпадение по КОЛИЧЕСТВУ обязательно: «Мука 50 кг» и «Мука 3 кг» — разные поставки.
   ПОРОГ. Не меньше трёх позиций и не меньше двух третей файла; у файла из одной-двух строк —
   все строки. Иначе на регулярной поставке одного и того же товара предупреждение срабатывало бы
   каждую неделю и его перестали бы читать.
   ПРЕДУПРЕЖДАЕМ, А НЕ ЗАПРЕЩАЕМ: повторный приход бывает и настоящим — привезли вторую машину с
   тем же товаром. Поэтому это строка в том же диалоге подтверждения, а не отдельный отказ.
   Время берём с самой свежей совпавшей записи журнала: это ровно та отметка, которую человек
   увидит, если пойдёт её искать (у накладной с датой документа это дата документа, и так и надо —
   искать он будет именно там). */
function _impLooksReloaded(keys){
  try{
    if(!Array.isArray(keys) || !keys.length) return null;
    const want = new Set(keys);
    const hit = new Set(); let lastTs = "";
    for(const op of (state.journals?.receipt || [])){
      if(!op) continue;
      const k = _impRowKey(op.productName, op.unit, op.qty);
      if(!want.has(k)) continue;
      hit.add(k);
      if(String(op.ts||"") > lastTs) lastTs = String(op.ts||"");
    }
    const need = want.size <= 2 ? want.size : Math.max(3, Math.ceil(want.size*2/3));
    if(hit.size < need) return null;
    let when = "";
    const d = new Date(lastTs);
    if(lastTs && !isNaN(d.getTime())){
      const p2 = (n)=>String(n).padStart(2,"0");
      when = `${p2(d.getDate())}.${p2(d.getMonth()+1)} в ${p2(d.getHours())}:${p2(d.getMinutes())}`;
    }
    return { matched: hit.size, total: want.size, when };
  }catch(e){ console.warn("_impLooksReloaded", e); return null; }
}
// одна строка импорта → поступление (мутирует склад/журнал; saveState — у вызывающего через logOp/saveState)
// ВАЖНО: любой новый `return null` здесь надо повторить в _impPreflight, иначе диалог снова
// пообещает больше, чем импортируется.
function recordReceiptRow(row){
  const name = cleanNameImport(row.name);
  let qty = roundQty(parseNum(row.qty));
  if(!name || !(qty>0)) return null;
  let unit = _impMapUnit(row.unit);
  if(unit==null){ console.warn("import skip: неизвестная ед.", row.unit, name); return null; }
  ({ qty, unit } = _impNormalizePackQty(name, qty, unit));
  /* ТИП ПОЗИЦИИ. Раньше здесь стояло жёсткое "product": строка с хозтоваром или инструментом
     молча заводила дубль-карточку в «Продуктах», и найти её потом было негде — на вкладке
     хозтоваров её нет, а на продуктах никто не ищет швабру. Теперь тип берётся из колонки
     файла, а если её нет — из активной вкладки склада (_impRowType). */
  const t = _impRowType(row);
  if(t.why){ console.warn("import skip: тип", t.why, name); return null; }
  const type = t.type;
  // только существующие; новое имя — лишь если в каталоге нет похожего
  // сначала same-unit; если нет — карточка с фасовкой (кор/уп↔шт), иначе align мёртв и плодятся дубли
  let product = findStockForImport(name, unit, null, type);
  if(!product){
    const pack = _impPackSize(name);
    if(pack > 1){
      const alts = unit==="шт" ? ["кор","уп"] : (unit==="кор"||unit==="уп") ? ["шт"] : [];
      for(const au of alts){ const cand = findStockForImport(name, au, null, type); if(cand){ product = cand; break; } }
    }
  }
  let created = false;
  if(!product){
    product = createCatalogStockItem(type, name, unit);
    state.stock.push(product);
    created = true;
    if(!row.skipPropagate){ try{ propagateName(type, name, product.unit); }catch(e){} }
  } else {
    const aligned = _impAlignQtyToProduct(product, name, qty, unit);
    if(!aligned){ console.warn("import skip: ед. не сходятся без фасовки", name, unit, "→", product.unit); return null; }
    ({ qty, unit } = aligned);
  }
  /* Категорию ставим только новой карточке или если у старой пусто/«Прочие»/ошибочные макароны
     у бульона. Список категорий — СВОЙ У КАЖДОГО ТИПА (state.categories[type]): угаданная
     «Крупы» в списке хозтоваров — мусор, поэтому эвристика по имени работает только для еды. */
  const catList = product.type || type;
  const guessed = catList==="product" ? guessProductCategory(product.name || name) : "";
  const curCat = String(product.category||"").trim();
  const weakCat = !curCat || /^проч/i.test(curCat) || (/макарон/i.test(curCat) && /бульон/i.test(product.name||name));
  const cat = cleanCatName(row.category) || (created || weakCat ? guessed : "");
  if(cat){
    state.categories[catList] = state.categories[catList] || [];
    if(!state.categories[catList].includes(cat)) state.categories[catList].push(cat);
    if(created || weakCat) product.category = cat;
  }
  const note = (typeof row.note==="string" ? row.note.slice(0,200) : "").trim();
  const expiry = _impParseDate(row.expiry);
  const location = cleanCatName(row.location);
  const day = _impParseDate(row.receiptDate) || "";
  const ts = day ? `${day}T09:00:00.000Z` : new Date().toISOString();
  const op = {
    id:uid(), ts, productId:product.id, productName:product.name, qty,
    unit:product.unit||unit, note: note||"Импорт поступления",
    stockType: journalStockType(product, type),
  };
  applyStockDelta(product, 1, qty, op.note, op);
  if(hasBatches(product) && op.batchId){
    const b = (product.batches||[]).find(x=>x.id===op.batchId);
    if(b){
      if(expiry) b.expiry=expiry;
      if(location) b.location=location;
      if(day) b.createdAt = ts;
      op.batchExpiry=b.expiry||""; op.batchLocation=b.location||"";
      syncItemFromBatches(product);
    }
  } else {
    if(expiry && !product.expiry) product.expiry = expiry;
    if(location && !product.location) product.location = location;
  }
  state.journals.receipt = state.journals.receipt || [];
  state.journals.receipt.unshift(op);
  return op;
}

const IMP_MAX_ROWS = 3000;
const IMP_MAX_BYTES = 8 * 1024 * 1024;
const IMP_MAX_FILES = 20;

// УПД / счёт-фактура: ищем шапку «Наименование товара» + № п/п + количество + ед.изм.
function _impParseUpdAoa(aoa, fileHint){
  let looksUpd = false, receiptDate = "";
  for(let r=0; r<Math.min(30, aoa.length); r++){
    for(const cell of (aoa[r]||[])){
      const s = String(cell||"");
      if(/УПД|счет[\s-]*фактур|счёт[\s-]*фактур/i.test(s)) looksUpd = true;
      if(/фактур|УПД|отгрузк/i.test(s)){
        const d = _impExtractDocDate(s);
        if(d) receiptDate = d;
      }
    }
  }
  if(!looksUpd) return null;
  let hdr = -1, idxName = -1, idxQty = -1, idxUnit = -1, idxNum = -1;
  for(let r=0; r<Math.min(45, aoa.length); r++){
    const row = aoa[r]||[];
    for(let c=0; c<row.length; c++){
      const n = _impNormHeader(row[c]);
      if(n.includes("наименованиетовара") || (n.includes("наименование") && n.includes("товар"))){
        hdr = r; idxName = c; break;
      }
    }
    if(hdr!==r) continue;
    for(let c=0; c<row.length; c++){
      const n = _impNormHeader(row[c]);
      const n2 = _impNormHeader((aoa[r+1]||[])[c]);
      if(n.includes("количество") || n2.includes("количество") || n.includes("объем") || n2.includes("объем")) idxQty = c;
      if(n.includes("условноеобозначение") || n2.includes("условноеобозначение") || n2.includes("национал")) idxUnit = c;
      else if(idxUnit<0 && (n.includes("единицаизмерения") || n2.includes("единица"))) idxUnit = c;
      if(n==="пп" || n.endsWith("пп") || n.includes("пп") && n.length<=4) idxNum = c;
    }
    const row2 = aoa[r+1]||[];
    for(let c=0; c<row2.length; c++){
      const n = _impNormHeader(row2[c]);
      if(idxQty<0 && (n.includes("количество")||n.includes("объем"))) idxQty = c;
      if(n.includes("условноеобозначение") || n.includes("национал")) idxUnit = c;
    }
    break;
  }
  if(idxName<0 || idxQty<0) return { rows:[], error:"Это похоже на УПД, но не найдены колонки «Наименование» / «Количество».", format:"upd" };
  const label = fileHint || "УПД";
  const rows = [];
  for(let r=hdr+1; r<aoa.length; r++){
    const arr = aoa[r]||[];
    const name = String(arr[idxName]??"").trim();
    if(!name || name==="-" || /^итого/i.test(name) || /наименование/i.test(name)) continue;
    if(idxNum>=0){
      const num = arr[idxNum];
      const okNum = typeof num==="number" || /^\d+$/.test(String(num??"").trim());
      if(!okNum) continue;
    }
    const qty = arr[idxQty];
    if(!(roundQty(parseNum(qty))>0)) continue;
    rows.push({
      name, qty, unit: idxUnit>=0 ? String(arr[idxUnit]??"").trim() : "",
      category:"", receiptDate, note:`Импорт УПД ${label}`, skipPropagate:true
    });
  }
  return { rows, format:"upd", receiptDate };
}

function _impParseTemplateAoa(aoa){
  const headerRow = (aoa[0]||[]).map(x=>String(x));
  const hmap = _impMapHeaders(headerRow);
  if(!Object.values(hmap).includes("name")) return { rows:[], error:"Не найден столбец «Наименование». Для УПД загрузите исходный .xlsx поставщика; для своего файла — скачайте шаблон." };
  const idxOf = {};
  headerRow.forEach((h,i)=>{ if(hmap[h]) idxOf[hmap[h]] = i; });
  const rows = [];
  for(let r=1; r<aoa.length; r++){
    const arr = aoa[r]; if(!arr || !arr.length) continue;
    const get = (f)=> idxOf[f]!=null ? arr[idxOf[f]] : "";
    const nm = String(get("name")||"").trim();
    if(!nm) continue;
    rows.push({
      name:nm, qty:get("qty"), unit:get("unit"), category:get("category"),
      // тип: пусто или колонки нет вовсе → решит _impRowType (активная вкладка склада)
      type:get("type"),
      expiry:get("expiry"), location:get("location"), note:get("note"),
      receiptDate:get("date"), skipPropagate:true
    });
  }
  return { rows, format:"template" };
}

/* CSV разбирается ОТДЕЛЬНО от xlsx: парсер CSV в xlsx.js трактует запятую как разделитель
   тысяч ДО того, как значение дойдёт до parseNum, и русская накладная тихо множит количество:
   проверено на нашей же сборке xlsx.js — «0,5» → 5, «1,25» → 125, «12,5» → 125, «10,00» → 1000.
   Повар при этом видел в диалоге подтверждения уже искажённое число, то есть сверить было нечем.
   `raw:true` на ЧТЕНИИ оставляет ячейки строками («0,5» так и остаётся «0,5»), а дальше их
   разбирает parseNum, который русскую запятую понимает правильно. Числа и даты от этого не
   страдают: и УПД-, и шаблонный разбор гоняют значения через parseNum/String. */
// Файл → таблица (массив строк). Отделено от разбора: тем же чтением пользуется опись склада.
function _impReadAoa(XLSX, data, fileName){
  // именно fileName, а не fileHint: _impFileHint срезает расширение (и часто оставляет только цифры)
  const isCsv = /\.(csv|tsv|txt)$/i.test(String(fileName||""));
  let wb;
  if(isCsv){
    let text = "";
    try{ text = new TextDecoder("utf-8").decode(data instanceof Uint8Array ? data : new Uint8Array(data)); }
    catch(_){ text = ""; }
    if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);            // BOM из Excel
    if(!text) return { error:"Не удалось прочитать CSV" };
    wb = XLSX.read(text, { type:"string", raw:true });
  } else {
    wb = XLSX.read(data, { type:"array" });
  }
  const wsName = wb.SheetNames[0];
  if(!wsName) return { error:"Файл пуст" };
  const ws = wb.Sheets[wsName];
  const aoa = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:"" });
  if(!aoa.length) return { error:"Нет строк" };
  if(aoa.length > IMP_MAX_ROWS + 40) return { error:`Слишком много строк (макс. ${IMP_MAX_ROWS}). Разбейте файл на части.` };
  return { aoa };
}
function _impParseWorkbook(XLSX, data, fileHint, fileName){
  const read = _impReadAoa(XLSX, data, fileName);
  if(read.error) return { rows:[], error:read.error };
  const aoa = read.aoa;
  const upd = _impParseUpdAoa(aoa, fileHint);
  if(upd) return upd;
  return _impParseTemplateAoa(aoa);
}
