/* ---------- Системное уведомление телефона (срок годности и т.п.) ---------- */
const NOTIFY_ICON = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='%23111827'/><g transform='translate(24 24) scale(.74) translate(-24 -24)' fill='none' stroke='%235ec8d4' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M9 16.5h30v22a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3z'/><path d='M7 8.5h34a2 2 0 0 1 2 2v6H5v-6a2 2 0 0 1 2-2z'/><path d='M16.5 26.5l5.5 5.5 10-10'/></g></svg>";
function notify(title, body){
  try{
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    const opts = { body, icon:NOTIFY_ICON, badge:NOTIFY_ICON, data:{ url: location.href } };
    /* ДВА ПУТИ, И ПОРЯДОК ВАЖЕН. Chrome на Android запрещает конструктор Notification на
       странице («Illegal constructor») — там уведомление обязан показывать service worker.
       Ровно поэтому напоминание о сроках годности на телефонах не показывалось никогда, а на
       десктопе показывалось: конструктор бросал исключение и молча гасился этим самым catch.
       Пробуем конструктор первым (десктоп — поведение прежнее, без асинхронности), а на
       телефоне ловим отказ и уходим в SW. Ждать navigator.serviceWorker.ready вслепую нельзя:
       без зарегистрированного SW (file://, отвалившаяся регистрация) промис не разрешается
       никогда, и уведомления пропали бы уже везде. */
    try{ new Notification(title, opts); return; }catch(_){}
    if(navigator.serviceWorker) navigator.serviceWorker.ready.then(r=>r.showNotification(title, opts)).catch(()=>{});
  }catch(e){}
}

/* ---------- Expiry notice on open ---------- */
function expiryNoticeOnOpen(){
  // не показываем поверх полноэкранного входа
  const gate=document.getElementById("loginGate"); if(gate && !gate.classList.contains("hidden")) return;
  if(state.lastExpiryNoticeDate===todayStr()) return;
  const expired = state.stock.filter(s=> s.type==="product" && s.expiry && daysLeft(s.expiry)<0 && Number(s.qty||0)>0);
  const soon    = state.stock.filter(s=>{ if(s.type!=="product"||!s.expiry||!inStock(s)) return false; const d=daysLeft(s.expiry); return d!==null && d>=0 && d<=3; });
  // число единиц для списания — по партиям (как в writeoffExpired), чтобы подпись кнопки совпадала с фактом
  const expiredTargets = state.stock.reduce((n,s)=>{
    if(s.type!=="product") return n;
    if(hasBatches(s)) return n + s.batches.filter(b=>b.expiry && daysLeft(b.expiry)<0 && roundQty(b.qty||0)>0).length;
    return n + ((s.expiry && daysLeft(s.expiry)<0 && Number(s.qty||0)>0)?1:0);
  },0);
  const any = expired.length || soon.length;
  if(any){
    // Системное уведомление (если разрешено), иначе запрос разрешения
    if("Notification" in window){
      if(Notification.permission==="granted"){
        const parts = [];
        if(expired.length) parts.push(`Просрочено: ${expired.length}`);
        if(soon.length) parts.push(`Скоро истекает: ${soon.length}`);
        notify("⏰ ВахтаХоз", parts.join(" · "));
      } else if(Notification.permission==="default"){
        Notification.requestPermission().catch(()=>{});
      }
    }
    // qty/место для просрочки/скорых сроков с учётом партий
    const qtyFor = (s, predicate) => hasBatches(s)
      ? roundQty(s.batches.filter(b=>b.expiry && predicate(daysLeft(b.expiry))).reduce((a,x)=>a+roundQty(x.qty||0),0))
      : Number(s.qty||0);
    const locFor = (s, predicate) => {
      if(!hasBatches(s)) return s.location||"";
      const matched = s.batches.filter(b=>b.expiry && predicate(daysLeft(b.expiry)));
      const locs = [...new Set(matched.map(b=>b.location).filter(Boolean))];
      return locs.length===1 ? locs[0] : (locs.length>1 ? `${locs.length} мест` : "");
    };
    const html = `
      <button class="sheet-x" data-close aria-label="Закрыть напоминание о сроках годности">×</button>
      <div class="font-bold text-xl mb-3" style="padding-right:48px">${ico("clock",20)} Внимание! Сроки годности</div>
      ${expired.length?`<div class="text-sm opacity-70 mb-1">Просрочено (${expired.length})</div>
      <div class="space-y-2 mb-3">
        ${sortedStock(expired).map(s=>{const d=daysLeft(s.expiry);const q=qtyFor(s,dd=>dd<0);const loc=locFor(s,dd=>dd<0);return `<div class="card flex items-start justify-between gap-2"><span class="flex-1 min-w-0 break-words">${esc(s.name)} <span class="opacity-70">(${fmtQty(q)} ${esc(s.unit||"")}${loc?` · 📍 ${esc(loc)}`:""})</span></span><span class="badge badge-red">Просрочено ${-d} дн.</span></div>`;}).join("")}
      </div>`:""}
      ${soon.length?`<div class="text-sm opacity-70 mb-1">Истекает в ближайшие 3 дня (${soon.length})</div>
      <div class="space-y-2 mb-3">
        ${sortedStock(soon).map(s=>{const d=daysLeft(s.expiry);const txt=d===0?"Сегодня":`${d} дн.`;const q=qtyFor(s,dd=>dd>=0&&dd<=3);const loc=locFor(s,dd=>dd>=0&&dd<=3);return `<div class="card flex items-start justify-between gap-2"><span class="flex-1 min-w-0 break-words">${esc(s.name)} <span class="opacity-70">(${fmtQty(q)} ${esc(s.unit||"")}${loc?` · 📍 ${esc(loc)}`:""})</span></span><span class="badge badge-yellow">${txt}</span></div>`;}).join("")}
      </div>`:""}
      ${expired.length?`<button class="btn btn-danger w-full" onclick="writeoffExpired()">${ico("trash")} Списать всю просрочку (${expiredTargets})</button>`:""}
      <button class="btn btn-primary w-full mt-2" onclick="openExpiredView()">Перейти к складу</button>
      <button class="btn btn-ghost w-full mt-2" data-close>Позже</button>
    `;
    openSheet(html);
  }
  state.lastExpiryNoticeDate = todayStr();
  saveState();
}

/* ============================================================
   УВЕДОМЛЕНИЯ: колокольчик в шапке, свой раздел и всплывашки
   ------------------------------------------------------------
   ЧТО ЭТО. Единственное место, где видно «что случилось, пока меня не было»: напоминания
   по задачам, срокам годности и остаткам, а также сообщения о смене, роли и доступе к базам.
   Раньше такого места не было вовсе — разовый toast исчезал через 1,8 секунды и не оставлял
   следа, а модалка про сроки годности показывается один раз в сутки и только про продукты.

   ОТКУДА БЕРУТСЯ ЧИСЛА. Из dashSets() — того же расчёта, что рисует плитки на дашборде.
   Ровно поэтому он и вынесен в отдельную функцию: расхождение «в колокольчике 5, на плитке 3»
   объяснить человеку нечем, а в этом приложении такое уже случалось дважды (см. комментарии
   про allowedTypeKeys в dashSets).

   ЧТО ВСПЛЫВАЕТ, А ЧТО ПРОСТО ЛОЖИТСЯ В СПИСОК. Всплывашка — это «произошло прямо сейчас»:
   поставили на смену, сменили роль, открыли базу, наступил новый день с задачами. Разбор при
   запуске идёт МОЛЧА: иначе каждое открытие приложения встречало бы человека пачкой карточек
   поверх шапки, да ещё и вперемешку с модалкой про сроки годности, которая показывается там же.
   Накопленное видно по цифре на колокольчике — за этим он и нужен.

   ЧЕГО ЗДЕСЬ НЕТ. Фоновой доставки (push) нет: сервер уведомлений не поднят, а обещать
   «придёт на телефон» и не прислать — хуже, чем не обещать. Системные уведомления телефона
   поэтому выключены по умолчанию и работают только пока приложение запущено; так и написано
   в самой настройке.

   СОВМЕСТИМОСТЬ. Ключи localStorage НОВЫЕ (vahtahoz_notifs, vahtahoz_notif_mem) и с NS-префиксом
   канала. Старые сборки их не читают и не пишут, в облачную выгрузку и в резервную копию они не
   попадают — уведомления живут на том телефоне, где произошли, и переносить их некуда.
   ============================================================ */
const NOTIF_KEY = NS+"vahtahoz_notifs";
const NOTIF_MEM_KEY = NS+"vahtahoz_notif_mem";
const NOTIF_MAX = 60;          // дальше не листают; хвост занимает место в localStorage без пользы
let _notifs = null;
let _notifBack = "dashboard";  // куда вернуть по «Назад»: раздел открывают из любого места

function notifLoad(){
  if(_notifs) return _notifs;
  let o = null;
  try{ o = JSON.parse(localStorage.getItem(NOTIF_KEY)||"null"); }catch(_){}
  if(!o || typeof o!=="object" || Array.isArray(o)) o = {};
  // Форму восстанавливаем целиком: битый ключ (чужая запись, оборванная запись при нехватке
  // места) не должен ронять шапку — колокольчик рисуется на каждом render.
  _notifs = {
    v: 1,
    uid: typeof o.uid==="string" ? o.uid : "",
    list: Array.isArray(o.list) ? o.list.filter(n=>n && typeof n==="object" && typeof n.id==="string" && typeof n.k==="string").slice(0,NOTIF_MAX) : [],
    cfg: { pop: !(o.cfg && o.cfg.pop===false), sys: !!(o.cfg && o.cfg.sys) },
  };
  return _notifs;
}
function notifSave(){
  try{ localStorage.setItem(NOTIF_KEY, JSON.stringify(notifLoad())); }
  catch(_){ /* переполнение хранилища: уведомления — расходный материал, теряем молча */ }
}
function notifUnread(){ return notifLoad().list.reduce((n,x)=>n+(x.read?0:1),0); }

/* ВЫХОД ИЗ ОБЛАКА УНОСИТ УВЕДОМЛЕНИЯ. cloudLogout чистит с телефона всё чужое — слоты облачных
   баз, задачи, снимки подписей, кэш остатков, — а эти два ключа оставались. notifOwnerCheck
   действительно стирает чужой список, но только когда узнает нового uid, то есть после загрузки
   профиля. Смена кончилась, телефон отдали сменщику, тот вошёл, профиль едет восемь секунд по
   слабой связи — и всё это время колокольчик показывает уведомления прошлой смены с именами баз,
   ролями и позициями. Снимаем сразу при выходе; заодно уходит и снимок членств, по которому
   иначе следующему человеку насчитали бы чужие «доступ открыт / доступ закрыт». */
function notifWipe(){
  _notifs = null;
  try{ localStorage.removeItem(NOTIF_KEY); localStorage.removeItem(NOTIF_MEM_KEY); }catch(_){}
}

/* На телефоне сменился человек — чужие уведомления показывать нельзя (в них имена баз и роли).
   Зовётся перед каждым разбором; пока uid неизвестен (холодный старт, офлайн) не трогаем
   ничего: иначе список стирался бы при каждом запуске без сети. */
function notifOwnerCheck(){
  const u = (typeof cloud!=="undefined" && cloud.profile && cloud.profile.id) || "";
  if(!u) return;
  const s = notifLoad();
  if(s.uid===u) return;
  if(s.uid) s.list = [];
  s.uid = u; notifSave();
}

/* n = {k, t, b, go, ic}. k — ключ повтора: одно и то же событие не должно появляться дважды
   (сводка по задачам за день, повторный разбор через пять минут). Возвращает true, если
   уведомление действительно новое. */
function notifAdd(n, opts){
  opts = opts||{};
  const s = notifLoad();
  if(s.list.some(x=>x.k===n.k)) return false;
  const item = { id: uid(), k: n.k, t: n.t, b: n.b||"", ic: n.ic||"bell", go: n.go||"", ts: new Date().toISOString(), read:false };
  s.list.unshift(item);
  if(s.list.length>NOTIF_MAX) s.list.length = NOTIF_MAX;
  notifSave();
  if(opts.popup){
    // Приложение свёрнуто — карточку внутри него никто не увидит; тогда (и только тогда)
    // отдаём событие системе, если человек это разрешил.
    if(document.hidden){ if(s.cfg.sys) notify("ВахтаХоз · "+item.t, item.b); }
    else if(s.cfg.pop) popupShow(item);
  }
  try{ renderBell(); if(currentView==="notifs") renderNotifs(); }catch(_){}
  return true;
}

/* ---------- колокольчик в шапке ---------- */
function renderBell(){
  const el = document.getElementById("bellChip"); if(!el) return;
  const s = notifLoad();
  const n = notifUnread();
  /* Значок — разметкой (константа в коде), число — только textContent: в счётчик попадает
     произвольная длина, и собирать его склейкой HTML незачем. Тот же приём, что в
     renderFilterChip. */
  el.replaceChildren();
  el.insertAdjacentHTML("afterbegin", ico(s.cfg.pop ? "bell" : "bellOff", 21));
  if(n){
    const b = document.createElement("span");
    b.className = "bell-badge";
    b.textContent = n>99 ? "99+" : String(n);
    el.appendChild(b);
  }
  const open = currentView==="notifs";
  el.className = "btn " + (open ? "btn-primary" : "btn-ghost");
  // Пока раздел открыт, кнопка закрывает его — подпись должна говорить именно это,
  // иначе с озвучкой экрана человек второй раз жмёт «Уведомления» и попадает обратно.
  const aria = open ? "Закрыть уведомления" : (n ? `Уведомления, непрочитанных: ${n}` : "Уведомления");
  el.title = aria; el.setAttribute("aria-label", aria);
}

/* ---------- всплывашки ---------- */
const POPUP_MAX = 3, POPUP_MS = 7000;
function popupShow(item){
  const host = document.getElementById("popups"); if(!host) return;
  if(gateOpen()) return;   // поверх полноэкранного входа всплывашкам делать нечего
  // Больше трёх карточек закрывают собой шапку целиком; старые уходят первыми.
  while(host.children.length >= POPUP_MAX && host.firstElementChild) host.firstElementChild.remove();
  const el = document.createElement("div");
  el.className = "popup";
  // Всё подставляемое — либо константа кода (ico), либо через esc: item.t/item.b собирает
  // только этот файл, но в них попадают имена баз, а их вводит человек.
  el.innerHTML = `<span style="flex:none;margin-top:1px;color:var(--accent)">${ico(item.ic||"bell",18)}</span>`
    + `<span style="flex:1;min-width:0"><span class="pu-t" style="display:block">${esc(item.t)}</span>${item.b?`<span class="pu-b">${esc(item.b)}</span>`:""}</span>`
    + `<button class="pu-x" aria-label="Закрыть уведомление">×</button>`;
  let tid = 0;
  const close = ()=>{ clearTimeout(tid); el.remove(); };
  el.querySelector(".pu-x").addEventListener("click", e=>{ e.stopPropagation(); close(); });
  el.addEventListener("click", ()=>{ close(); notifOpenItem(item.id); });
  host.appendChild(el);
  tid = setTimeout(close, POPUP_MS);
}

/* ---------- раздел «Уведомления» ---------- */
function openNotifs(){
  if(gateOpen()) return;
  if(currentView!=="notifs") _notifBack = currentView;
  nav("notifs");
}
function closeNotifs(){ nav(_notifBack||"dashboard"); }
/* Колокольчик — переключатель, а не только вход: нажали второй раз — вернулись туда, откуда
   пришли. Кнопка в шапке подсвечена, пока раздел открыт, и «нажать на подсвеченную, чтобы
   погасить» — то, чего от неё ждут. Строка в «Ещё» и переходы по самим уведомлениям зовут
   openNotifs() напрямую: там повторного нажатия по той же кнопке не бывает. */
function toggleNotifs(){ if(currentView==="notifs") closeNotifs(); else openNotifs(); }

// Куда ведёт нажатие. Список закрытый и повторяет поведение плиток дашборда один в один:
// «Сроки истекают» → navStock('exp14'), «Низкий запас» → navStock('all'). Открой склад
// как-нибудь иначе — человек попадёт в другой набор позиций, чем обещало уведомление.
function notifGo(go){
  if(go==="tasks"){ taskFilter.cat="Все"; nav("tasks"); return; }
  if(go==="exp14"){ navStock("exp14"); return; }
  if(go==="low"){ navStock("all"); return; }
  if(go==="more"){ nav("more"); return; }
}
function notifOpenItem(id){
  const s = notifLoad();
  const it = s.list.find(x=>x.id===id);
  if(!it){ openNotifs(); return; }
  if(!it.read){ it.read = true; notifSave(); }
  if(!it.go){ openNotifs(); return; }
  notifGo(it.go);
  try{ renderBell(); }catch(_){}
}
/* Кнопки «Прочитать всё» здесь нет намеренно: открытый список и есть прочтение (см. конец
   renderNotifs). Кнопка, которая появляется уже после того, как цифра с колокольчика ушла,
   ничего не меняет — только спрашивает сделать то, что уже сделано. */
function notifToggle(){
  const s = notifLoad();
  s.cfg.pop = !s.cfg.pop; notifSave(); renderBell(); renderNotifs();
}
async function notifToggleSys(){
  const s = notifLoad();
  if(s.cfg.sys){ s.cfg.sys = false; notifSave(); renderNotifs(); return; }
  if(!("Notification" in window)){ toast("Телефон не поддерживает такие уведомления"); return; }
  let p = Notification.permission;
  if(p==="default"){ try{ p = await Notification.requestPermission(); }catch(_){ p = "denied"; } }
  // Отказ уже дан — переспросить нельзя ни из какого кода, только руками в настройках
  // телефона. Так и говорим, иначе переключатель молча не включается и выглядит сломанным.
  if(p!=="granted"){ toast("Уведомления запрещены в настройках телефона"); renderNotifs(); return; }
  s.cfg.sys = true; notifSave(); renderNotifs();
}
async function notifClear(){
  if(!await confirmSheet("Очистить список уведомлений? Сами задачи, сроки и остатки не изменятся.", {title:"Уведомления", yes:"Очистить", danger:true})) return;
  const s = notifLoad();
  s.list = []; notifSave(); renderBell(); renderNotifs();
  toast("Список очищен");
}
// «12:40» сегодня, «вчера, 12:40», дальше — «01.08, 12:40». Год не пишем: список живёт
// 60 записей и до годовалых уведомлений не доживает.
function notifWhen(ts){
  const d = new Date(ts); if(isNaN(d.getTime())) return "";
  const hm = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const dayKey = x => x.getFullYear()+"-"+x.getMonth()+"-"+x.getDate();
  const now = new Date();
  if(dayKey(d)===dayKey(now)) return hm;
  const y = new Date(now.getTime()-86400000);
  if(dayKey(d)===dayKey(y)) return "вчера, "+hm;
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+", "+hm;
}
function renderNotifs(){
  const v = document.querySelector('[data-view="notifs"]'); if(!v) return;
  const s = notifLoad();
  const list = s.list;
  const unread = notifUnread();
  const sysOn = ("Notification" in window) && Notification.permission==="granted" && s.cfg.sys;
  const nRow = (n)=>`<button class="card tap text-left notif ${n.read?"":"unread"}" style="width:100%;display:flex;align-items:flex-start;gap:10px;padding:13px 14px" onclick="notifOpenItem('${safeId(n.id)}')">
      <span style="flex:none;margin-top:1px;color:var(--accent)">${ico(n.ic||"bell",18)}</span>
      <span style="flex:1;min-width:0">
        <span class="font-bold" style="display:block;font-size:14px">${esc(n.t)}</span>
        ${n.b?`<span style="display:block;font-size:13px;opacity:.8;margin-top:2px;overflow-wrap:break-word">${esc(n.b)}</span>`:""}
        <span style="display:block;font-size:12px;opacity:.55;margin-top:4px">${esc(notifWhen(n.ts))}</span>
      </span>
    </button>`;
  v.innerHTML = `
    <div class="flex items-center gap-2">
      <button class="btn btn-ghost" style="padding:8px 12px;flex:0 0 auto" onclick="closeNotifs()" aria-label="Назад">‹</button>
      <div class="font-bold text-xl" style="flex:1;min-width:0">Уведомления</div>
    </div>
    ${list.length
      ? `<div class="space-y-2">${list.map(nRow).join("")}</div>`
      : `<div class="card text-center opacity-70 text-sm" style="padding:26px 16px">Пока пусто.<br>Здесь будут напоминания о задачах, сроках годности и остатках, а также сообщения о смене, роли и доступе к базам.</div>`}
    <div class="set-group">
      <div class="set-head">Настройки</div>
      <div class="set-list">
        <button class="set-row" onclick="notifToggle()"><span class="sr-t"><div>Всплывающие подсказки</div><div class="sr-sub">Карточка вверху экрана, пока приложение открыто</div></span><span class="sr-v">${s.cfg.pop?"Вкл":"Выкл"}</span><span class="sr-ch">›</span></button>
        <button class="set-row" onclick="notifToggleSys()"><span class="sr-t"><div>Уведомления телефона</div><div class="sr-sub">Только пока приложение запущено: фоновой доставки нет</div></span><span class="sr-v">${sysOn?"Вкл":"Выкл"}</span><span class="sr-ch">›</span></button>
        ${list.length?`<button class="set-row danger" onclick="notifClear()"><span class="sr-t"><div>Очистить список</div></span><span class="sr-ch">›</span></button>`:""}
      </div>
    </div>`;
  /* Открыли список — значит прочитали. Пометку ставим ПОСЛЕ отрисовки: полоска «непрочитано»
     остаётся видна на этом экране, а цифра с колокольчика уходит сразу. Так делают почтовые
     клиенты, и это единственный способ не заставлять человека каждый раз жать «Прочитать всё». */
  if(unread){ list.forEach(n=>{ n.read = true; }); notifSave(); }
  try{ renderBell(); }catch(_){}
}

/* ---------- разбор данных: задачи, сроки, остатки ---------- */
/* opts.silent — только положить в список, без всплывашек (запуск приложения; см. шапку блока). */
function notifScan(opts){
  try{
    opts = opts||{};
    if(gateOpen()) return;
    notifOwnerCheck();
    const popup = !opts.silent;
    const d = dashSets();
    const day = d.today;
    /* Права на задачи: пока роли не приехали, берём раскладку прошлого запуска — тот же
       источник, что у cloudGateTasks. Иначе на холодном старте начальник участка, у которого
       задач нет вовсе, получал бы уведомление о чужих задачах. */
    const known = cloud.ready || !loadCloudSess();
    const hints = known ? null : loadGateHints();
    const hideTasks = hints ? !!hints.t : isRestrictedUser();
    if(!hideTasks && (d.todayTasks.length || d.overdueTasks.length)){
      const parts = [];
      if(d.todayTasks.length) parts.push(`на сегодня ${d.todayTasks.length}`);
      if(d.overdueTasks.length) parts.push(`просрочено ${d.overdueTasks.length}`);
      notifAdd({ k:`tasks-${day}`, ic:"checkCircle", t:"Невыполненные задачи", b:parts.join(", "), go:"tasks" }, {popup});
    }
    /* Сводка одна на день, а не по позиции: на складе бывает под четыреста наименований, и
       отдельное уведомление на каждое превратило бы список в стену, которую перестают читать. */
    if(d.expiringSoon.length)
      notifAdd({ k:`exp-${day}`, ic:"clock", t:"Истекают сроки годности", b:`Позиций со сроком 14 дней и меньше: ${d.expiringSoon.length}`, go:"exp14" }, {popup});
    if(d.lowStock.length)
      notifAdd({ k:`low-${day}`, ic:"alert", t:"Низкий запас", b:`Позиций на минимуме или ниже: ${d.lowStock.length}`, go:"low" }, {popup});
  }catch(e){ console.warn("notifScan", e); }
}

/* ---------- разбор членств: смена, роль, доступ к базам ---------- */
/* Зовётся сразу после каждого присвоения cloud.members (вход и обновление членств) — это
   единственные два места, где права меняются, других источников у приложения нет.
   Сравниваем со снимком прошлого раза. Первый заход (и заход другим человеком) — молча
   запоминаем: иначе первое же открытие после обновления выдало бы «вам открыли доступ»
   на каждую базу разом. */
function notifMemberScan(){
  try{
    const u = (cloud.profile && cloud.profile.id) || "";
    if(!u || !cloud.membersLoaded) return;
    notifOwnerCheck();
    const cur = {};
    (cloud.members||[]).forEach(m=>{
      if(!m || !m.base_id) return;
      cur[m.base_id] = { r:m.role||"", a:m.active!==false, c:!!m.can_manage, n:(cloud.bases&&cloud.bases[m.base_id])||"" };
    });
    let prev = null;
    try{ prev = JSON.parse(localStorage.getItem(NOTIF_MEM_KEY)||"null"); }catch(_){}
    const save = ()=>{ try{ localStorage.setItem(NOTIF_MEM_KEY, JSON.stringify({ uid:u, m:cur })); }catch(_){} };
    if(!prev || prev.uid!==u || !prev.m || typeof prev.m!=="object" || Array.isArray(prev.m)){ save(); return; }
    // Метка времени в ключе повтора обязательна: сняли со смены и вернули в тот же день —
    // это два разных события, и второе не должно потеряться как «уже было».
    const stamp = Date.now();
    const nameOf = (bid, snap)=> (cloud.bases&&cloud.bases[bid]) || (snap&&snap.n) || "База";
    for(const bid of Object.keys(cur)){
      const c = cur[bid], p = prev.m[bid];
      const bn = nameOf(bid, c);
      if(!p){
        notifAdd({ k:`m-new-${bid}-${stamp}`, ic:"home", t:"Открыт доступ к базе", b:`«${bn}» · ${roleLabel(c.r)}${c.a?"":" · пока не на смене"}`, go:"more" }, {popup:true});
        continue;
      }
      if(p.a!==c.a)
        notifAdd({ k:`m-shift-${bid}-${stamp}`, ic:c.a?"checkCircle":"alert", t:c.a?"Вы на смене":"Вы сняты со смены", b:`База «${bn}»`, go:"more" }, {popup:true});
      if(p.r!==c.r)
        notifAdd({ k:`m-role-${bid}-${stamp}`, ic:"users", t:"Изменена ваша роль", b:`«${bn}» · ${roleLabel(p.r)} → ${roleLabel(c.r)}`, go:"more" }, {popup:true});
      if(p.c!==c.c)
        notifAdd({ k:`m-mgr-${bid}-${stamp}`, ic:"users", t:c.c?"Вам передано управление базой":"Управление базой снято", b:`«${bn}»`, go:"more" }, {popup:true});
    }
    for(const bid of Object.keys(prev.m)){
      if(cur[bid]) continue;
      notifAdd({ k:`m-off-${bid}-${stamp}`, ic:"alert", t:"Доступ к базе закрыт", b:`«${prev.m[bid].n||"База"}»`, go:"more" }, {popup:true});
    }
    save();
  }catch(e){ console.warn("notifMemberScan", e); }
}

async function writeoffExpired(){
  if(!ensureCanEdit()) return;
  // считаем «единицу для списания» точечно:
  //  — для batches-карточек: каждая просроченная партия списывается отдельно (свежие НЕ трогаем)
  //  — для legacy: вся карточка целиком (как раньше)
  const targets = []; // [{it, batch?: b}]
  for(const it of state.stock){
    if(it.type!=="product") continue;
    if(hasBatches(it)){
      for(const b of it.batches){
        if(b.expiry && daysLeft(b.expiry)<0 && roundQty(b.qty||0)>0) targets.push({it, batch:b});
      }
    } else {
      if(it.expiry && daysLeft(it.expiry)<0 && Number(it.qty||0)>0) targets.push({it, batch:null});
    }
  }
  if(!targets.length){ closeSheet(); return; }
  if(!await confirmSheet(`Списать по сроку ${targets.length} ${targets.some(t=>t.batch)?"партий/позиций":"поз."}? Свежие партии НЕ трогаются.`,{danger:true,yes:"Списать"})) return;
  const now = new Date().toISOString();
  state.journals.writeoff = state.journals.writeoff || [];
  let done = 0;
  for(const t of targets){
    // ПЕРЕРЕЗОЛВ по id: ссылки собраны ДО await confirmSheet — pull/смена базы могли пересоздать
    // объекты склада. Работаем только с актуальными; исчезнувшие/уже списанные пропускаем.
    const it = state.stock.find(s=>s.id===t.it.id); if(!it) continue;
    if(t.batch){
      const batch = (it.batches||[]).find(b=>b.id===t.batch.id);
      if(!batch || roundQty(batch.qty||0)<=0 || !(batch.expiry && daysLeft(batch.expiry)<0)) continue;   // партия изменилась/свежая — не трогаем
      const d = daysLeft(batch.expiry);
      state.journals.writeoff.unshift({
        id: uid(), ts: now, productId: it.id, productName: it.name,
        qty: roundQty(batch.qty||0), unit: it.unit||"", stockType: journalStockType(it),
        batchId: batch.id, batchLocation: batch.location||"", batchExpiry: batch.expiry||"",
        note: `Списано по сроку (просрочено ${-d} дн., ${fmtDate(batch.expiry)}${batch.location?", 📍 "+batch.location:""})`
      });
      logOp("WRITEOFF", `${it.name} -${fmtQty(batch.qty)} ${it.unit||""} [партия: ${batch.location||"—"} ⏰ ${fmtDate(batch.expiry)}]`);
      it.batches = it.batches.filter(b=>b.id!==batch.id);
      finalizeBatchMutation(it);
    } else {
      if(hasBatches(it) || !(it.expiry && daysLeft(it.expiry)<0) || Number(it.qty||0)<=0) continue;   // стала партийной/срок изменился — не трогаем
      const d = daysLeft(it.expiry);
      state.journals.writeoff.unshift({
        id: uid(), ts: now, productId: it.id, productName: it.name,
        qty: Number(it.qty||0), unit: it.unit||"", stockType: journalStockType(it),
        note: `Списано по сроку (просрочено ${-d} дн., ${fmtDate(it.expiry)})`
      });
      logOp("WRITEOFF", `${it.name} -${fmtQty(it.qty)} ${it.unit||""} (срок)`);
      const _wasQty = Number(it.qty||0);
      it.qty = 0; it.updatedAt = now;
      // просроченную дату НЕ оставляем: иначе следующий приход поднимал бы остаток вместе с ней
      clearExpiryOnZero(it, _wasQty);
    }
    done++;
  }
  saveState(); closeSheet(); render();
  toast(`Списано: ${done}`);
}

/* ============================================================
   ОБЛАКО — реализация (Supabase). Загрузка клиента по требованию.
   Активная база может быть «связана» с облачной (profiles.list[i].cloudId).
   Синхронизируется ТОЛЬКО активная база. Без входа — всё локально.
   ============================================================ */
async function ensureSB(){
  if(cloud.sb) return cloud.sb;
  // self-hosted UMD-бандл (script в <head>) даёт глобальный supabase.createClient
  const lib = window.supabase;
  if(!lib || !lib.createClient) throw new Error("Библиотека облака не загрузилась (нет сети при первом запуске?)");
  cloud.sb = lib.createClient(CLOUD_CFG.url, CLOUD_CFG.anon, {
    auth:{
      // autoRefreshToken=false НАМЕРЕННО: refresh-токен продлеваем ТОЛЬКО вручную через cloudDoRefresh
      // (прямым fetch, надёжно в iOS standalone). Если бы supabase-клиент тоже авто-ротировал —
      // два механизма крутили бы ОДНУ цепочку токенов → reuse-detection GoTrue отзывает семью → разлогин + «REST 401».
      persistSession:true, autoRefreshToken:false, storageKey:NS+"vahtahoz_auth",
      // обход зависания navigator.locks в Safari (вход висел до таймаута): сквозная блокировка
      lock: async (_name, _timeout, fn) => await fn()
    }
  });
  return cloud.sb;
}
/* Прямой REST-запрос к PostgREST с пользовательским токеном в заголовке.
   Не зависит от setSession/состояния auth-клиента: в iOS standalone-PWA sb.from
   мог уходить без JWT (сессия ещё не зарегистрирована) или подвисать. */
async function cloudRest(path, token, opts, _retried){
  opts = opts || {};
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), opts.timeout || 30000);   // НЕ виснем вечно; запас под слабый интернет
  try{
    let r;
    try{
      r = await fetch(`${CLOUD_CFG.url}/rest/v1/${path}`, {
        method: opts.method || "GET", signal: ctrl.signal,
        headers: Object.assign({ apikey:CLOUD_CFG.anon, Authorization:`Bearer ${token}` }, opts.headers||{}),
        body: opts.body
      });
    }catch(fe){
      // НАСТОЯЩИЙ сетевой сбой (не наш таймаут-abort) → сеть пропала, хотя navigator.onLine мог остаться
      // ложно-true и событие offline не пришло. Снимаем подтверждение — следующий гейт покажет офлайн быстро.
      if(fe && fe.name!=="AbortError") _netConfirmed = false;
      throw fe;
    }
    _netConfirmed = true;   // ответ долетел → сеть точно есть (снимаем ложный navigator.onLine=false)
    // 401 = access-токен протух ПОСРЕДИ сессии (живёт ~1ч). Обновляем токен и повторяем ОДИН раз —
    // иначе синк падал «REST 401» до перезагрузки. Тело первого ответа не читаем, чтобы повтор был чистым.
    if(r.status===401 && !_retried && cloud.session && cloud.session.refresh_token){
      let perm=false;
      const newTok = await cloudDoRefresh().catch(e=>{ if(e && e.permanent) perm=true; return null; });
      if(newTok) return await cloudRest(path, newTok, opts, true);
      if(perm && cloudOnline()){ cloudSessionExpired("Вход устарел — войдите снова"); }   // разлогин ТОЛЬКО при подтверждённом отказе токена И живой сети (аккаунт удалён/сменили пароль). Офлайн — держим сессию
    }
    if(!r.ok){
      const detail=(await r.text().catch(()=>"")).slice(0,120);
      // пользователю — по-русски; технические детали (статус/тело) — в e.detail/e.status для логов
      const msg = r.status>=500 ? "Сервер недоступен, попробуйте позже"
        : (r.status===401||r.status===403) ? "Нет доступа — войдите снова или обратитесь к начальнику участка"
        : "Не удалось выполнить запрос ("+r.status+")";
      const e=new Error(msg); e.status=r.status; e.detail=detail; throw e;
    }
    if(opts.returnResponse) return r;
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  } finally { clearTimeout(t); }
}
// PostgREST по умолчанию отдаёт ≤1000 строк. Без пагинации pull склада (~3k) был неполным →
// в UI «прыгало» число в наличии, а push мог удалить «пропавшие» id из облака.
async function cloudRestAll(path, token, opts){
  opts = opts || {};
  const page = Math.min(Math.max(Number(opts.pageSize)||1000, 100), 1000);
  const hardCap = Number(opts.hardCap)||50000;
  const all = [];
  let from = 0;
  for(;;){
    const headers = Object.assign({}, opts.headers||{}, {
      Range: `${from}-${from+page-1}`,
      Prefer: "count=exact",
    });
    const r = await cloudRest(path, token, Object.assign({}, opts, { headers, returnResponse:true }));
    const txt = await r.text();
    const chunk = txt ? JSON.parse(txt) : [];
    if(!Array.isArray(chunk)) return chunk;   // неожиданный формат — как есть
    all.push(...chunk);
    if(chunk.length < page) break;
    from += page;
    if(from >= hardCap){
      const e = new Error("Слишком много данных для загрузки — обратитесь к администратору");
      e.code = "hardCap"; e.hardCap = hardCap; e.path = path;
      throw e;
    }
  }
  return all;
}
/* Своё хранилище сессии (синхронное) — переживает reload от cloudAutoLink, в отличие от
   фонового setSession в supabase-клиенте. Восстановление при запуске идёт отсюда, прямым fetch. */
function saveCloudSess(d){
  try{ localStorage.setItem(NS+"vahtahoz_sess", JSON.stringify({
    access_token:d.access_token, refresh_token:d.refresh_token,
    expires_at: Date.now() + ((d.expires_in||3600)*1000), user:d.user
  })); }catch(_){}
}
function loadCloudSess(){ try{ return JSON.parse(localStorage.getItem(NS+"vahtahoz_sess")||"null"); }catch(_){ return null; } }
function clearCloudSess(){ try{ localStorage.removeItem(NS+"vahtahoz_sess"); }catch(_){} }
/* Соседняя вкладка/копия PWA на этом origin ротировала токен → подхватываем свежую сессию в память,
   чтобы не держать протухший refresh-токен и не слать его (иначе reuse → «вход устарел»). Логаут НЕ распространяем. */
try{ window.addEventListener("storage", (e)=>{
  if(e.key===NS+"vahtahoz_sess" && e.newValue && cloud.session){
    try{
      const s=JSON.parse(e.newValue);
      if(!(s && s.access_token && s.refresh_token)) return;
      // ТОЛЬКО ротация токена ТОГО ЖЕ пользователя. Раньше проверки не было, и если на общем
      // устройстве в другой вкладке входил ДРУГОЙ человек, эта вкладка забирала его токен, продолжая
      // держать в памяти данные и задачи первого → выгрузка шла в чужой аккаунт (owner_id нового
      // пользователя), а склад писался его токеном. Не совпал пользователь — не подхватываем.
      const mine = cloud.session.user && cloud.session.user.id;
      const theirs = s.user && s.user.id;
      if(!mine || !theirs || mine !== theirs) return;
      cloud.session = s;
    }catch(_){}
  }
}); }catch(_){}
/* продление по refresh-токену ПРЯМЫМ fetch — не зависит от supabase-клиента (в iOS standalone мог висеть) */
async function cloudRefresh(refresh_token){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 15000);   // НЕ виснем на слабой сети / холодном старте бэкенда
  try{
    const r = await fetch(`${CLOUD_CFG.url}/auth/v1/token?grant_type=refresh_token`, {
      method:"POST", signal: ctrl.signal,
      headers:{ apikey:CLOUD_CFG.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ refresh_token })
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok || !d.access_token){
      const e=new Error("Не удалось продлить сессию"); e.status=r.status;
      // permanent (=единственное основание разлогинить) ТОЛЬКО при НАСТОЯЩЕМ отказе GoTrue по токену:
      // JSON-тело с кодом ошибки об отозванном/несуществующем refresh-токене. На вахте плохой интернет —
      // каптив-порталы, прокси, «глушилки», DPI тоже отдают 400/401/403, но HTML/пусто → d без error_code →
      // это НЕ permanent (сессию НЕ рушим, работаем офлайн, продлимся позже). Ложный permanent = разлогин в
      // поле, где заново войти почти невозможно. 429/5xx/сетевые — тоже временные.
      const errStr = String(d.error_code||d.error||d.msg||d.error_description||"").toLowerCase();
      const genuineTokenReject = !!errStr && /refresh_token|invalid.?grant|invalid.?token|token.?not.?found|revoked|already.?used|user.?not.?found|user.?banned|session.?not.?found|bad_jwt/.test(errStr);
      if((r.status===400 || r.status===401 || r.status===403) && genuineTokenReject) e.permanent=true;
      throw e;
    }
    return d;
  } finally { clearTimeout(t); }
}
// постоянный сбой рефреша → чистый выход на экран входа (аккаунт удалён/токен отозван/сменили пароль)
async function cloudSessionExpired(reason){
  if(!cloud.session && !cloud.ready) return;   // уже разлогинены — не дублируем
  cloud.session=null; cloud.profile=null; cloud.members=[]; cloud.orgRoles=[]; cloud.orgManagers=[]; cloud.orgManagersLoaded=false; cloud.ready=false; cloud.basesLoaded=false; cloud.membersLoaded=false;
  cloud.bases={}; clearAllBasesCache();        // имена баз и снимок остатков протухшей сессии не должны висеть в UI/памяти
  cloud._basesLoading=false; cloud.busy=false; cloud.pushPending=false; cloud.applying=false;   // иначе повторный вход залипнет (cloudOnLogin рано выходит при _basesLoading)
  cloud._conflictAsked={};                      // иначе после входа ДРУГИМ юзером на этом устройстве диалог «какие данные главные» молча пропустится → тихий pull без сохранения копии
  try{ if(cloud.channel && cloud.sb) cloud.sb.removeChannel(cloud.channel); }catch(_){}
  try{ if(cloud.tasksChannel && cloud.sb) cloud.sb.removeChannel(cloud.tasksChannel); }catch(_){}
  cloud.channel=null; cloud.subscribedBase=null; cloud.tasksChannel=null; cloud.tasksSubUid=null; cloud.tasksBusy=false;   // сброс задач: иначе после повторного входа realtime молчит
  clearTimeout(cloud.pushTimer); clearTimeout(cloud.pullTimer); clearTimeout(cloud.retryTimer); clearTimeout(cloud.pullRetryT); clearTimeout(cloud._basesRetryT);
  clearTimeout(cloud.tasksTimer); clearTimeout(cloud.tasksRetry); clearTimeout(cloud.tasksPullTimer);   // не дёргаем задачи на мёртвом токене
  try{ if(cloud.sb) cloud.sb.auth.signOut({ scope:"local" }).catch(()=>{}); }catch(_){}   // ТОЛЬКО локальная сессия: без scope supabase-js делает глобальный logout → отзыв токенов на ВСЕХ устройствах юзера
  clearCloudSess();
  setSyncStatus("error", reason||"Вход устарел — войдите снова");
  try{ renderHeader(); render(); }catch(_){}
  showLoginGate();
  const err=document.getElementById("lgErr"); if(err) err.textContent = reason || "Вход устарел — войдите снова";
}
// обновляет access-токен по refresh-токену; ОДИН общий промис на параллельные 401 (без шторма refresh)
function cloudDoRefresh(){
  if(cloud._refreshing) return cloud._refreshing;
  cloud._refreshing = (async()=>{
    try{
      // Другой контекст на этом origin (вкладка/копия PWA) мог уже ротировать токен и сохранить свежий в localStorage.
      // Берём максимально свежий, чтобы не слать заведомо использованный (reuse-detection → отзыв всей семьи → разлогин).
      const stored = loadCloudSess();
      if(stored && stored.refresh_token) cloud.session = stored;
      const rt = cloud.session && cloud.session.refresh_token;
      if(!rt){ const e=new Error("Вход устарел — войдите снова"); e.permanent=true; throw e; }   // нет refresh-токена → восстановить нельзя: реактивный 401 уйдёт в cloudSessionExpired, не зациклится
      let d;
      try{
        d = await cloudRefresh(rt);
      }catch(err){
        // Токен отвергнут (permanent). Но соседний контекст мог за это время успешно продлить сессию —
        // подхватываем его свежий токен вместо разлогина (частая причина ложного «вход устарел» при 2 вкладках).
        const fresh = loadCloudSess();
        if(err && err.permanent && fresh && fresh.access_token && fresh.refresh_token && fresh.refresh_token!==rt){
          cloud.session = fresh; return fresh.access_token;
        }
        throw err;
      }
      saveCloudSess(d); cloud.session = loadCloudSess();
      // отдаём свежий токен и supabase-клиенту (realtime/auth) — он сам НЕ рефрешит (autoRefreshToken=false),
      // иначе его сессия протухнет. Не блокируем: setSession в standalone может подвисать → race с 4с-таймаутом.
      try{ if(cloud.sb) Promise.race([ cloud.sb.auth.setSession({ access_token:d.access_token, refresh_token:d.refresh_token }).catch(()=>{}), new Promise(r=>setTimeout(r,4000)) ]).catch(()=>{}); }catch(_){}
      return cloud.session && cloud.session.access_token;
    } finally { cloud._refreshing = null; }
  })();
  return cloud._refreshing;
}

/* --- связь активной базы с облаком и права --- */
function activeCloudId(){ const p=profiles.list.find(x=>x.id===profiles.activeId); return p?(p.cloudId||null):null; }
function memberOf(cid){ const uid=cloud.profile&&cloud.profile.id; return cloud.members.find(m=>m.base_id===cid && (!uid || m.user_id===uid))||null; }
function activeMember(){
  const cid=activeCloudId(); if(!cid) return null;
  if(cloud.profile && cloud.profile.is_admin) return {can_view_stock:true,can_edit_stock:true,can_view_tasks:true,can_edit_tasks:true};
  return memberOf(cid);
}
// право править склад: вне облака (локальный режим) — всегда да; в облаке — по флагу участника.
// Гард на точках мутации: иначе правка view-only-участника применялась бы локально, не выгружалась
// (cloudPushNow её молча отбрасывает) и затиралась следующим pull — потеря без обратной связи.
// работник СНЯТ СО СМЕНЫ на активной облачной базе (его base_members.active=false). Владелец(is_admin) — никогда.
// Тогда RLS на сервере режет доступ к складу/журналам → делаем базу read-only локально и не долбим сервер бесполезным push (иначе «REST 403»).
function isOffShift(cid){
  cid=cid||activeCloudId(); if(!cid) return false;
  if(cloud.profile && cloud.profile.is_admin) return false;
  const m=memberOf(cid);
  if(m && m.active===false) return true;   // снят со смены
  // удалён с базы / нет орг-доступа: RLS пустой — как off-shift, не затираем локальное
  if(cloud.ready && !m){
    const partyId=(cloud._baseParty||{})[cid];
    const orgOk=(cloud.orgRoles||[]).some(o=>o.active!==false && (o.party_id==null || o.party_id===partyId));
    if(!orgOk) return true;
  }
  return false;
}
/* «Членство НЕИЗВЕСТНО» ≠ «членства НЕТ». Вход состоялся (токен валиден), но base_members/org_roles
   не загрузились — cloudOnLogin ушёл в catch (офлайн-старт на объекте, главный сценарий продукта).
   Раньше это делало облачную базу read-only для ВСЕХ, включая владельца, и показывало ложное
   «Вы сняты со смены»: ensureCanEdit блокировал ввод в 20+ точках до события online.
   Локально это НЕ повод запрещать работу. В облако при этом всё равно ничего не уходит:
   isOffShift() остаётся fail-closed и блокирует push/pull (защита от wipe пустым RLS), а правки
   копятся под dirty и уедут сами, когда членство загрузится. */
function membershipUnknown(){ return !!cloud.ready && !cloud.membersLoaded; }
function canEditStock(){
  /* Принудительный разлогин (истёк refresh-токен, отозван, сменили пароль): cloudSessionExpired
     обнуляет session/profile/members и ready, но cloudId активной базы остаётся. Дальше все ветви
     ниже промахивались (`cloud.ready` уже false), и функция доходила до финального `return true` —
     облачная база становилась редактируемой с экрана входа. Правки при этом даже не помечались
     dirty (cloudMaybePush выходит при !cloud.ready) и молча гибли при следующем pull.
     Проверяем и память, и хранилище: при офлайн-старте сессия лежит только в localStorage,
     и запрещать работу в этом (главном рабочем) сценарии нельзя. */
  if(activeCloudId() && !cloud.session && !loadCloudSess()) return false;
  const m=activeMember();
  if(m) return !!m.can_edit_stock && m.active!==false;
  if(cloud.profile && cloud.profile.is_admin) return true;   // владелец
  // облачный пользователь без членства базы (территориальная/глобальная роль): право правки — по флагу орг-роли,
  // покрывающей эту базу. Бухгалтер (can_edit_stock=false) → только чтение, не правит склад локально.
  if(cloud.ready && (cloud.orgRoles||[]).some(o=>o.active!==false)){
    const cid=activeCloudId(); const partyId=(cloud._baseParty||{})[cid];
    return (cloud.orgRoles||[]).some(o=>o.active!==false && o.can_edit_stock && (o.party_id==null || o.party_id===partyId));
  }
  // связи не было — правим локально, копим dirty, в облако не пушим (см. membershipUnknown)
  if(membershipUnknown()) return true;
  // облако онлайн + активна облачная база, но членства/орг-роли нет (удалили с базы) — НЕ fail-open «локальный режим»
  if(cloud.ready && activeCloudId()) return false;
  return true;   // локальная/офлайн база без облачных ролей — одиночный режим
}
function ensureCanEdit(){ if(!canEditStock()){ toast(isOffShift()?"Вы сняты со смены — редактирование недоступно":"У вас нет прав на редактирование — обратитесь к начальнику участка"); return false; } return true; }

/* ===================== УПРАВЛЕНИЕ УЧАСТНИКАМИ И РОЛЯМИ =====================
   Роль = пресет прав (источник истины для RLS — флаги). Менеджер (can_manage)
   или владелец (is_admin) управляет участниками СВОЕЙ базы. Создание логина и
   сброс пароля — через Edge Function (service_role); роль/active/удаление — напрямую (RLS). */
// rank — лестница иерархии: назначить/выдать можно только роль СТРОГО НИЖЕ своей (совпадает с сервером role_rank).
// В карточке участников БАЗЫ доступны только базовые роли (rank 1-2); партийные/глобальные назначаются через отдельный поток.
const MEMBER_ROLES = [
  { key:"worker",       label:"Хозрабочий",        rank:1, perm:{can_view_stock:true, can_edit_stock:true,  can_view_tasks:true,  can_edit_tasks:true,  can_manage:false} },
  { key:"cook",         label:"Повар",             rank:1, perm:{can_view_stock:true, can_edit_stock:true,  can_view_tasks:true,  can_edit_tasks:true,  can_manage:false} },
  { key:"mechanic",     label:"Механик/Электрик",  rank:1, perm:{can_view_stock:true, can_edit_stock:true,  can_view_tasks:true,  can_edit_tasks:true,  can_manage:false} },
  { key:"site_manager", label:"Начальник участка", rank:2, perm:{can_view_stock:true, can_edit_stock:true,  can_view_tasks:true,  can_edit_tasks:true,  can_manage:true } },
];
// полная лестница рангов (в т.ч. территориальные/глобальные роли — для подписей и вычисления своего ранга)
const ROLE_RANK = { owner:6, general_director:5, director:4, party_chief:3, site_manager:2, worker:1, cook:1, mechanic:1, accounting:1 };
const ROLE_LABELS = { owner:"Владелец", general_director:"Ген. директор", director:"Директор", party_chief:"Начальник партии", site_manager:"Начальник участка", worker:"Хозрабочий", cook:"Повар", mechanic:"Механик/Электрик", accounting:"Бухгалтерия", custom:"Особая" };
const rankOf = (k)=> ROLE_RANK[k] || 0;
const roleLabel = (k)=> (MEMBER_ROLES.find(r=>r.key===k)||{}).label || ROLE_LABELS[k] || k || "—";
// ранг текущего пользователя: владелец=6, иначе макс по глобальным/партийным (org_roles) и по управляемым базам.
function myRank(){
  if(cloud.profile && cloud.profile.is_admin) return 6;
  let r = 0;
  (cloud.orgRoles||[]).forEach(o=>{ if(o.active!==false) r = Math.max(r, rankOf(o.role)); });
  (cloud.members||[]).forEach(m=>{ if(m.active!==false && m.can_manage) r = Math.max(r, rankOf(m.role)||2); });
  return r;
}
// роли, назначаемые текущим пользователем: СТРОГО ниже своего ранга. keepRole — текущую роль участника
// показываем всегда (чтобы её было видно активной), даже если она равна/выше моего ранга.
function assignableRoles(keepRole){
  const mine = myRank();
  return MEMBER_ROLES.filter(r => r.rank < mine || r.key === keepRole);
}
// территориальные/глобальные роли (живут в org_roles). scope: 'party' → нужна партия; 'global' → все базы.
const ORG_ROLES = [
  { key:"party_chief",      label:"Начальник партии", rank:3, scope:"party"  },
  { key:"director",         label:"Директор",          rank:4, scope:"global" },
  { key:"general_director", label:"Ген. директор",     rank:5, scope:"global" },
  { key:"accounting",       label:"Бухгалтерия",       rank:1, scope:"global" },
];
// глобальный управляющий (может назначать директоров/бухгалтерию/нач.партий): владелец или директор+.
function isGlobalManager(){ return !!(cloud.profile && cloud.profile.is_admin) || (cloud.orgRoles||[]).some(o=>o.active!==false && (o.role==="director"||o.role==="general_director") && o.can_manage); }
function assignableOrgRoles(){ const mine=myRank(); return ORG_ROLES.filter(r=>r.rank<mine); }
// раздел «Роли по регионам» доступен тем, кто может выдать хотя бы одну орг-роль (строго ниже своего ранга).
function canManageOrgRoles(){ return isGlobalManager() && assignableOrgRoles().length>0; }
// бухгалтер: сквозная роль (чтение по всем базам). Сводный экран — бухгалтеру и глобальным управляющим.
function isAccountant(){ return (cloud.orgRoles||[]).some(o=>o.active!==false && o.role==="accounting"); }
function canSeeAllBases(){ return isAccountant() || isGlobalManager(); }
function canManageBase(){
  const cid=activeCloudId(); if(!cid) return false;
  if(cloud.profile && cloud.profile.is_admin) return true;
  const m=memberOf(cid);
  if(m && m.active!==false && m.can_manage) return true;
  // партийный/глобальный управляющий: директор/ген.директор (глобально) или начальник партии своей партии
  const partyId = (cloud._baseParty||{})[cid];
  return (cloud.orgRoles||[]).some(o=> o.active!==false && o.can_manage && (o.party_id==null || o.party_id===partyId));
}
/* Импорт JSON в АКТИВНУЮ базу — единственное действие в приложении, которым один файл переписывает
   общие данные бригады: всё, что импортировано, следующим push уезжает всем. Раньше хватало права
   правки склада (то есть любому повару/хозрабочему). Права правки достаточно для прихода-расхода,
   но не для «залить файл поверх базы»: ошибиться файлом легко, отката нет. Поэтому на ОБЛАЧНОЙ базе
   импорт оставлен управляющим (нач. участка+, партийные/директора, владелец аккаунта), на локальной
   базе — как было, это операция уровня телефона. Восстановление файла «все базы» под это правило НЕ
   попадает: оно ничего не выгружает в облако и нужно как раз при пересменке (см. importData). */
function canImportToBase(){
  if(!activeCloudId()) return true;
  return canManageBase();
}
// вызов Edge Function manage-user (создание логина / сброс пароля — service_role на сервере)
async function cloudCallFn(action, payload){
  const tok = cloud.session && cloud.session.access_token;
  if(!tok) throw new Error("Нет входа в облако");
  const doFetch = (t)=>{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), 35000);   // не виснем на холодном старте free-тарифа
    return fetch(`${CLOUD_CFG.url}/functions/v1/manage-user`, {
      method:"POST", signal:ctrl.signal,
      headers:{ apikey:CLOUD_CFG.anon, Authorization:`Bearer ${t}`, "Content-Type":"application/json" },
      body: JSON.stringify(Object.assign({ action }, payload))
    }).finally(()=>clearTimeout(to));
  };
  let r;
  try{ r = await doFetch(tok); }
  catch(_){ throw new Error("Сервер недоступен. Проверьте интернет и повторите"); }
  if(r.status===401){ const nt=await cloudDoRefresh().catch(()=>null); if(nt){ try{ r=await doFetch(nt); }catch(_){ throw new Error("Сервер недоступен. Проверьте интернет"); } } }   // токен протух — обновить и повторить
  const d = await r.json().catch(()=>({}));
  if(!r.ok || d.error) throw new Error(d.error || ("Ошибка сервера "+r.status));
  return d;
}
// загрузка ВСЕХ участников активной базы (с логинами) — для экрана управления (RLS пустит менеджера)
async function cloudLoadBaseMembers(){
  const cid=activeCloudId(); const tok=cloud.session && cloud.session.access_token;
  if(!cid || !tok) return [];
  const mem = await cloudRest(`base_members?base_id=eq.${encodeURIComponent(cid)}&select=*`, tok);
  const ids = [...new Set((mem||[]).map(m=>m.user_id))];
  const names = {};
  if(ids.length){
    const profs = await cloudRest(`profiles?id=in.(${ids.map(encodeURIComponent).join(",")})&select=id,username`, tok).catch(()=>[]);
    (profs||[]).forEach(p=>{ names[p.id]=p.username; });
  }
  cloud.baseMembers = (mem||[]).map(m=>Object.assign({}, m, { username: names[m.user_id] || String(m.user_id).slice(0,8) }));
  return cloud.baseMembers;
}

  finally{ cloud._membersLoading = false; }
  const myId = cloud.profile && cloud.profile.id;

function _findBM(uid){ return (cloud.baseMembers||[]).find(x=>x.user_id===uid); }

function _wouldOrphan(uid, change){
  if(cloud.profile && cloud.profile.is_admin) return false;

     сервер такую операцию пропустит: без активного can_manage в base_members база сиротой не
     становится. Раньше этой ветки не было, и запрет срабатывал у не-владельца там, где сервер
     разрешает: начальник партии не мог ни снять со смены, ни убрать последнего начальника участка.
     Проверка видит только те орг-роли, которые клиенту отдал сервер (свои, а владельцу — все),
     то есть ошибиться может лишь в сторону ЗАПРЕТА, а не разрешения; полностью слепые случаи

     с нашим, и ложного «нельзя» не возникает. */
  if(_orgManagesBase(activeCloudId())) return false;
  const after = (cloud.baseMembers||[]).filter(m=>{
    let manage=!!m.can_manage, active=(m.active!==false);
    if(m.user_id===uid){
      if(change.remove) return false;
      if(change.role!==undefined){ const r=MEMBER_ROLES.find(x=>x.key===change.role); if(r) manage=!!r.perm.can_manage; }

function canRotateMember(m){

  if(cloud.profile && m.user_id===cloud.profile.id) return true;   // себя снять можно всегда
  const mine = myRank();

/* Может ли передача оставить базу без управляющего — ПО ТОМУ, ЧТО ВИДНО КЛИЕНТУ. Возможны только

function openHandover(fromUid){

  // (проверка «останется ли управляющий» сюда не входит: она приблизительная, см. _handoverMayOrphan)
  if(!canRotateMember(from)){ toast("Нельзя снять со смены того, кто равен вам или выше по должности"); return; }
  if(from.active===false){ toast(`«${from.username}» уже не на смене — обновите список`); return; }
  const others=handoverCandidates(fromUid);
  // единственный отказ, который клиент знает точно: передавать НЕКОМУ (в базе больше никого нет)
  if(!others.length){ toast("Нет заступающего. Сначала добавьте работника кнопкой «＋ Добавить»"); return; }
  /* ...и второй, когда срез орг-управляющих ПОЛОН (владелец): если ни один кандидат не удержит базу

     предупреждение в подтверждении: решает сервер, он знает правду. */
  if(_orgManagersKnown() && others.every(o=>_handoverMayOrphan(fromUid, o.user_id))){
    toast("После передачи база останется без «Начальника участка». Сначала назначьте кого-то начальником участка");

  }

}
async function doHandover(fromUid, toUid){
  const from=_findBM(fromUid), to=_findBM(toUid);
  if(!from || !to){ toast("Список устарел. Закройте и откройте заново"); return; }
  /* Ранг проверяем сами (таблицы клиента и сервера сверены — ложных отказов не даёт), а вот
     «останется ли управляющий» клиент знает лишь приблизительно: чужие орг-роли ему не видны
     (см. _handoverMayOrphan). Поэтому здесь ПРЕДУПРЕЖДЕНИЕ в тексте подтверждения, а не отказ:
     запрет отнимал у людей единственный способ передать смену вместе с задачами там, где сервер
     операцию разрешает. Откажет — сервер, и его причина уже переведена в человеческий текст. */
  if(!canRotateMember(from)){ toast("Нельзя снять со смены того, кто равен вам или выше по должности"); return; }
  const mayOrphan = _handoverMayOrphan(fromUid, toUid);

  // через подтверждение и ожидание сети ради 'orphan'
  if(mayOrphan && _orgManagersKnown()){
    toast(`После передачи база останется без «Начальника участка»: назначьте «${to.username}» начальником участка или выберите другого заступающего`);
    return;
  }
  const orphanWarn = mayOrphan
    ? `\n\n⚠️ Похоже, после передачи на базе не останется «Начальника участка». Если базой управляют из оргструктуры (начальник партии, директор) — передача пройдёт. Если нет — сервер откажет, тогда сначала назначьте управляющего.`
    : "";
  if(!await confirmSheet(`Передать смену от «${from.username}» к «${to.username}»?\nВсе задачи «${from.username}» перейдут к «${to.username}». «${from.username}» уйдёт со смены и потеряет доступ к базе, «${to.username}» заступит и получит доступ.${orphanWarn}`,{ yes:"Передать смену", title:"Передать смену" })) return;
  if(cloud._handoverBusy) return; cloud._handoverBusy=true;
  try{
    const d=await cloudCallFn("handover", { base_id:activeCloudId(), from_user:fromUid, to_user:toUid });
    // если меня самого касается пересменка — синхронизируем свои права/задачи
    if(cloud.profile && (cloud.profile.id===fromUid || cloud.profile.id===toUid)){
      const cid=activeCloudId(); const mine=cloud.members.find(m=>m.user_id===cloud.profile.id && m.base_id===cid);
      if(mine) mine.active = (cloud.profile.id===toUid);
      cloudSyncTasks().catch(()=>{});   // подтянуть переданные задачи
    }
    toast(`Смена передана. Задач перенесено: ${d.tasks_moved||0}`);
    await openMembersSheet();
  }catch(e){ toast("Не удалось. "+(e.message||"Проверьте интернет и повторите")); }
  finally{ cloud._handoverBusy=false; }
}
async function memberRemove(uid){
  const m=_findBM(uid); if(!m) return;
  if(_wouldOrphan(uid,{remove:true})){ toast("База останется без управляющего. Сначала назначьте другого «Начальника участка»"); return; }
  if(!await confirmSheet(`Убрать «${m.username}» из этой базы?\nЕго логин останется, и в других базах он продолжит работать.`,{danger:true,yes:"Убрать из базы"})) return;
  const cid=activeCloudId(); const tok=cloud.session && cloud.session.access_token;
  try{
    await cloudRest(`base_members?base_id=eq.${encodeURIComponent(cid)}&user_id=eq.${encodeURIComponent(uid)}`, tok, { method:"DELETE", headers:{ "Prefer":"return=minimal" } });
    toast("Убран из базы"); await openMembersSheet();
  }catch(e){ toast("Не удалось: "+(e.message||"Проверьте интернет и повторите")); }
}

/* Edge Function отдаёт mail_synced:false, когда пароль почтового ящика <логин>@razvedchick.ru
   разошёлся с паролем приложения (сам логин при этом создан/сменён — операция прошла). Молчать
   нельзя: через ЭТОТ ЖЕ ящик идёт восстановление пароля, то есть сломан и запасной путь. Поле
   приходит на create_member / create_org_member / reset_password, но ни один клиент его не читал —
   предупреждение не доходило до человека вообще. Тоста тут мало: он одной строкой и на 1,8 с. */
/* Возвращает промис, который разрешается ПОСЛЕ закрытия предупреждения. Иначе оно ставилось в тот же
   единственный лист, что и только что открытый список участников, и подменяло его собой: владелец
   видел «Понятно», закрывал — и оказывался вообще без списка. Теперь порядок обратный: сначала
   предупреждение, после «Понятно» — обновлённый список (см. вызовы). */
function warnMailUnsynced(d, username){
  if(!d || d.mail_synced !== false) return Promise.resolve();
  const box = esc(String(username || d.username || "").trim().toLowerCase() + LOGIN_DOMAIN);
  return new Promise(resolve=>{
    openSheet(`<div class="font-bold text-xl mb-2">${ico("alert",20)} Почтовый ящик не обновлён</div>
      <div class="text-sm opacity-80 mb-4" style="line-height:1.5">Пароль приложения задан и работает.
        А вот пароль почтового ящика <b>${box}</b> остался прежним — почтовый сервер не ответил.<br><br>
        Значит через этот ящик НЕ сработает и восстановление пароля. Повторите смену пароля при
        устойчивой связи; если не поможет — сообщите владельцу, нужно проверить почтовый сервер.</div>
      <button class="btn btn-primary w-full" data-close>Понятно</button>`);
    // лист мог не открыться (виден экран входа) — тогда хотя бы строкой, и ждать нечего
    if(_sheetRefused){ toast("Пароль почтового ящика не обновлён — восстановление по почте не сработает"); resolve(); return; }
    _sheetOnClose = ()=>resolve();
  });
}

  const boxes = bases.map(([id,name])=>{

    return `<label class="flex items-start gap-2 text-sm py-1"><input type="checkbox" class="gbBase" value="${esc(id)}" ${west23?"data-west23=1":""}/><span>${esc(name)}</span></label>`;

        <select class="input" id="gbr">${roles}</select></div>
      <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="gbOnShift" checked /> Сразу на смене (active). Снимите галочку — доступ без смены. Несколько баз всё равно блокируют «Передать смену» (задачи личные).</label>
      <div class="flex gap-2 flex-wrap">
        <button type="button" class="btn btn-ghost text-sm px-2" id="gbWest23">Западная 2+3</button>
        <button type="button" class="btn btn-ghost text-sm px-2" id="gbAll">Все</button>
        <button type="button" class="btn btn-ghost text-sm px-2" id="gbNone">Снять выбор</button>
      </div>
      <div class="max-h-56 overflow-y-auto pr-1 border border-white/10 rounded-lg p-2 space-y-0.5">${boxes}</div>
    </div>
    <div class="flex gap-2 mt-3">
      <button class="btn btn-ghost flex-1" data-close>Отмена</button>
      <button class="btn btn-success flex-1" id="gbGrant">Выдать</button>
    </div>
    <button class="btn btn-ghost w-full mt-2" id="gbRevoke">Снять с выбранных баз</button>
    <div class="text-xs opacity-60 mt-2">Выдача: добавить или обновить роль. «На смене» по галочке. Снятие: убрать из базы (последний нач. участка — отказ). Несколько баз → «Передать смену» недоступна.</div>`);
  const mark = (pred)=>{ document.querySelectorAll(".gbBase").forEach(el=>{ el.checked = !!pred(el); }); };
  const w=document.getElementById("gbWest23"); if(w) w.onclick=()=>mark(el=>el.getAttribute("data-west23")==="1");
  const a=document.getElementById("gbAll"); if(a) a.onclick=()=>mark(()=>true);
  const n=document.getElementById("gbNone"); if(n) n.onclick=()=>mark(()=>false);
  document.getElementById("gbGrant").onclick=()=>doGrantBases(false);
  document.getElementById("gbRevoke").onclick=()=>doGrantBases(true);
}
async function doGrantBases(remove){
  if(!(cloud.profile && cloud.profile.is_admin)){ toast("Только владелец"); return; }
  const username=(document.getElementById("gbu")?.value||"").trim().toLowerCase();
  const role=document.getElementById("gbr")?.value||"worker";
  const on_shift = !!(document.getElementById("gbOnShift")?.checked);
  const base_ids=[...document.querySelectorAll(".gbBase:checked")].map(el=>el.value).filter(Boolean);
  if(_badLogin(username)) return;
  if(!base_ids.length){ toast("Выберите хотя бы одну базу"); return; }
  if(!remove && !MEMBER_ROLES.some(r=>r.key===role)){ toast("Выберите роль"); return; }
  const title = remove ? "Снять доступ" : "Выдать доступ";
  const msg = remove
    ? `Снять «${username}» с ${base_ids.length} баз(ы)?`
    : `Выдать «${username}» роль «${roleLabel(role)}» на ${base_ids.length} баз(ы)${on_shift?" (на смене)":" (без смены)"}?`;
  if(!await confirmSheet(msg,{ title, yes: remove?"Снять":"Выдать", danger:!!remove })) return;
  const btn = document.getElementById(remove?"gbRevoke":"gbGrant");
  if(btn){ btn.disabled=true; btn.textContent = remove?"Снятие…":"Выдача…"; }
  try{
    const d=await cloudCallFn("grant_bases", { username, role, base_ids, remove: !!remove, on_shift });
    if(remove){
      toast(`Снято с ${(d.bases||[]).length} баз`);
    } else {
      const n=(d.added||[]).length + (d.updated||[]).length;
      toast(`Готово: ${n} баз (новых ${(d.added||[]).length}, обновлено ${(d.updated||[]).length})`);
    }
    closeSheet();
  }catch(e){
    toast("Не удалось. "+(e.message||"Проверьте логин и интернет"));
    if(btn){ btn.disabled=false; btn.textContent = remove?"Снять с выбранных баз":"Выдать"; }
  }
}

let _allBasesAt = 0;           // время снимка (для «Обновлено в HH:MM»)
function clearAllBasesCache(){ _allBasesCache = null; _allBasesAt = 0; }
// количество считаем КАК В СКЛАДЕ: из батчей, если они есть (колонка qty — производная и может отстать)
function _rowQty(r){ const b=Array.isArray(r.batches)?r.batches:[]; return b.length ? roundQty(b.reduce((s,x)=>s+roundQty((x&&x.qty)||0),0)) : roundQty(Number(r.qty||0)); }
function _fileSafe(s){ return String(s||"база").replace(/[^0-9A-Za-zА-Яа-яёЁ -]/g,"").trim().replace(/\s+/g,"_")||"база"; }
// один запрос in.(...) вместо N параллельных: одна поездка, RLS сама отфильтрует видимое, тянем и batches
async function loadAllBasesStock(){
  const tok=cloud.session && cloud.session.access_token;
  const ids=Object.keys(cloud.bases||{});
  if(!ids.length) return [];
  let rows;
  try{ rows=await cloudRestAll(`stock_items?select=base_id,name,category,qty,unit,min_stock,expiry,location,type,note,batches&base_id=in.(${ids.map(encodeURIComponent).join(",")})&order=id`, tok, {timeout:180000, hardCap:100000}); }
  catch(e){ return ids.map(id=>({ id, name:cloud.bases[id], rows:null })); }   // общий сбой → все базы помечаем «не загружено»
  const byBase={}; (Array.isArray(rows)?rows:[]).forEach(r=>{ (byBase[r.base_id]=byBase[r.base_id]||[]).push(r); });
  return ids.map(id=>({ id, name:cloud.bases[id], rows: byBase[id]||[] }));
}

  let data;
  try{ data=await loadAllBasesStock(); _allBasesCache=data; _allBasesAt=Date.now(); }
  catch(e){ openSheet(`<div class="font-bold text-xl mb-3">${ico("calc",20)} Сводка по всем базам</div><div class="err-text text-sm">Не удалось загрузить: ${esc(e.message||"нет связи")}</div><button class="btn btn-ghost w-full mt-3" data-close>Закрыть</button>`); return; }
  const rowsHtml = data.length ? data.map(b=>{
