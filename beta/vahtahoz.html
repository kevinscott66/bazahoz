const stockNormName = s => (s||"").trim().toLowerCase();
function defaultCategoryForType(type){
  if(type!=="product") return "";
  return (state.categories.product||[]).includes("Прочие продукты") ? "Прочие продукты" : ((state.categories.product||[])[0] || "");
}
function findStockByName(name, type, unit){
  const n = stockNormName(name);
  if(!n) return null;
  const pool = type
    ? state.stock.filter(s=> s.type===type && stockNormName(s.name)===n)
    : state.stock.filter(s=> allowedTypeKeys().includes(s.type) && stockNormName(s.name)===n);
  if(!pool.length) return null;
  // unit передан (в т.ч. "") → строгий ключ; неизвестная ед. — не приклеиваем к pool[0]
  if(arguments.length >= 3){
    const wantU = _impUnitKey(unit);
    if(wantU==null) return null;
    const same = pool.filter(s=> _impUnitKey(s.unit)===wantU);
    return same[0] || null;
  }
  return pool[0];
}
function createCatalogStockItem(type, name, unit){
  return {
    id: uid(), type: type||"product", name: String(name||"").trim(),
    qty: 0, unit: unit||"шт", minStock:"", expiry:"", location:"",
    category: defaultCategoryForType(type||"product"),
    note:"", createdAt:new Date().toISOString(),
  };
}
// Приход: найти существующую позицию по имени или создать каталожную (qty=0).
// skipPropagate=true — для bulk-импорта (иначе O(N·баз) полных сериализаций localStorage)
function resolveIncomingProduct({ productId, manualName, unit, type, skipPropagate }){
  type = type || "product";
  let product = productId ? state.stock.find(s=>s.id===productId) : null;
  const name = String(product ? product.name : (manualName||"")).trim();
  if(!name) return null;
  if(!product) product = findStockByName(name, type, unit);
  if(!product){
    product = createCatalogStockItem(type, name, unit||"шт");
    state.stock.push(product);
    if(!skipPropagate){ try{ propagateName(type, name, product.unit); }catch(e){ console.warn("propagateName", e); } }
  }
  return product;
}
// Изменение остатка: для партийных карточек приход = новая партия (как при приёме заказа).
function applyStockDelta(product, sign, qty, note, op){
  if(!product || !sign) return;
  if(sign > 0 && hasBatches(product)){
    const newB = { id: uid(), qty: roundQty(qty), expiry:"", location:"", note: note||"Поступление", createdAt:new Date().toISOString() };
    product.batches = product.batches || [];
    product.batches.push(newB);
    if(op){ op.batchId = newB.id; op.batchLocation = ""; op.batchExpiry = ""; }
    syncItemFromBatches(product);
  } else {
    product.qty = roundQty(Number(product.qty||0) + sign*qty);
  }
  product.updatedAt = new Date().toISOString();
}

function journalEffectSign(kind, op){
  if(kind==="receipt") return 1;
  if(kind==="issue" || kind==="writeoff") return -1;
  // Заказ НЕ учитывается в ledger: приём заказа (orderReceive) создаёт зеркальную запись
  // в "receipt", она и даёт +qty. Иначе принятый заказ считался бы дважды (раздувал остаток).
  return 0;
}
// Тип склада для RLS журнала (data.stockType). Денормализуем при записи — после удаления позиции тип не «сиротеет».
function journalStockType(product, fallback){
  const t = (product && product.type) || fallback || "product";
  return (typeof STOCK_TYPE_KEYS!=="undefined" && STOCK_TYPE_KEYS.includes(t)) ? t : "product";
}
function journalRefScore(it){
  let n = 0;
  for(const kind of JOURNAL_KEYS){
    for(const op of (state.journals[kind]||[])) if(op && op.productId===it.id) n++;
  }
  return n;
}
function ledgerQtyForProduct(product){
  if(!product) return 0;
  let sum = 0;
  const pid = product.id;
  const pname = stockNormName(product.name);
  for(const kind of JOURNAL_KEYS){
    for(const op of (state.journals[kind]||[])){
      const sign = journalEffectSign(kind, op);
      if(!sign) continue;
      const matchId = op.productId && op.productId===pid;
      // по имени учитываем ТОЛЬКО записи без productId (иначе движение с чужим/удалённым
      // productId, но совпавшим именем, приписалось бы не той карточке)
      const ou = _impUnitKey(op.unit), pu = _impUnitKey(product.unit);
      const matchNameOnly = !op.productId && stockNormName(op.productName)===pname && !!ou && !!pu && ou===pu;
      if(matchId || matchNameOnly)
        sum += sign * Number(op.qty||0);
    }
  }
  return roundQty(sum);
}
function ledgerByNormName(){
  // ключ type::name — иначе одноимённые orphan product/tool сливаются в один ledger
  const m = new Map();
  const stockIds = new Set((state.stock||[]).map(s=>s.id));
  for(const kind of JOURNAL_KEYS){
    for(const op of (state.journals[kind]||[])){
      const sign = journalEffectSign(kind, op);
      if(!sign) continue;
      // с productId учитываем только orphan (id нет на складе) — иначе чужая живая карточка
      // «по имени» раздувала ledger и ensureProducts перепривязывал чужие ops
      if(op.productId && stockIds.has(op.productId)) continue;
      const n = stockNormName(op.productName);
      if(!n) continue;
      const typ = (op.stockType && STOCK_TYPE_KEYS.includes(op.stockType)) ? op.stockType : "product";
      const u = _impUnitKey(op.unit) || "шт";
      const key = typ + "::" + n + "::" + u;
      m.set(key, roundQty((m.get(key)||0) + sign * Number(op.qty||0)));
    }
  }
  return m;
}
function relinkJournalOpsToCanonical(){
  let n = 0;
  for(const kind of JOURNAL_KEYS){
    for(const op of (state.journals[kind]||[])){
      const name = (op.productName||"").trim();
      if(!name) continue;
      let canon = op.productId ? state.stock.find(s=>s.id===op.productId) : null;
      const preferType = (op.stockType && STOCK_TYPE_KEYS.includes(op.stockType)) ? op.stockType : null;
      if(!canon) canon = findStockByName(name, preferType || undefined, op.unit);
      if(!canon) continue;
      if(op.productId!==canon.id || op.productName!==canon.name){
        op.productId = canon.id;
        op.productName = canon.name;
        if(canon.type) op.stockType = journalStockType(canon, op.stockType);
        n++;
      }
    }
  }
  return n;
}
function mergeDuplicateStockByName(){
  const groups = new Map();
  for(const s of (state.stock||[])){
    // unit в ключе: иначе «кг» и «шт» с одним именем схлопывались и суммировали qty
    const u = _impUnitKey(s.unit) || "шт";
    const key = `${s.type}|${stockNormName(s.name)}|${u}`;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  let merged = 0;
  for(const items of groups.values()){
    if(items.length < 2) continue;
    items.sort((a,b)=> (journalRefScore(b)*1e6 + totalQtyOf(b)) - (journalRefScore(a)*1e6 + totalQtyOf(a)));
    const primary = items[0];
    for(const dup of items.slice(1)){
      if(hasBatches(dup)){
        primary.batches = primary.batches || [];
        const usedIds = new Set(primary.batches.map(b=>b.id));
        for(const b of batchesOf(dup)){
          // СОХРАНЯЕМ b.id — иначе op.batchId в журнале осиротеет («партия не найдена»).
          // Новый id только при коллизии, с переносом ссылок в журнале.
          let bid = b.id;
          if(usedIds.has(bid)){
            const nid = uid();
            for(const kind of JOURNAL_KEYS) for(const op of (state.journals[kind]||[])){ if(op && op.batchId===bid && op.productId===dup.id) op.batchId = nid; }
            bid = nid;
          }
          usedIds.add(bid);
          primary.batches.push({ ...b, id: bid });
        }
        if(hasBatches(primary)) syncItemFromBatches(primary);
        else primary.qty = roundQty(Number(primary.qty||0) + totalQtyOf(dup));
      } else if(hasBatches(primary)){
        if(roundQty(dup.qty||0) > 0){
          primary.batches.push({ id:uid(), qty:roundQty(dup.qty||0), expiry:dup.expiry||"", location:dup.location||"", note:"Слияние дубля", createdAt:new Date().toISOString() });
          syncItemFromBatches(primary);
        }
      } else {
        primary.qty = roundQty(Number(primary.qty||0) + Number(dup.qty||0));
      }
      for(const kind of JOURNAL_KEYS){
        for(const op of (state.journals[kind]||[])){
          if(op && op.productId===dup.id){ op.productId = primary.id; op.productName = primary.name; }
        }
      }
      state.stock = state.stock.filter(x=>x.id!==dup.id);
      merged++;
    }
    primary.updatedAt = new Date().toISOString();
    if(hasBatches(primary)) syncItemFromBatches(primary);
  }
  return merged;
}
function ensureProductsFromJournalLedger(){
  let created = 0;
  const ledgers = ledgerByNormName();
  const stockIds = new Set((state.stock||[]).map(s=>s.id));
  for(const [key, ledger] of ledgers){
    if(!(ledger > 0)) continue;
    // typ::name::unit — name может содержать «::», unit всегда последний сегмент
    const i1 = key.indexOf("::"), i2 = key.lastIndexOf("::");
    const typ = i1>=0 ? key.slice(0,i1) : "product";
    const wantU = (i2>i1) ? key.slice(i2+2) : "шт";
    const n = (i1>=0 && i2>i1) ? key.slice(i1+2, i2) : (i1>=0 ? key.slice(i1+2) : key);
    const type = STOCK_TYPE_KEYS.includes(typ) ? typ : "product";
    if(findStockByName(n, type, wantU)) continue;
    let sampleName = "", sampleUnit = wantU;
    outer: for(const kind of JOURNAL_KEYS){
      for(const op of (state.journals[kind]||[])){
        if(stockNormName(op.productName)!==n) continue;
        const ot = (op.stockType && STOCK_TYPE_KEYS.includes(op.stockType)) ? op.stockType : "product";
        if(ot!==type) continue;
        if((_impUnitKey(op.unit)||"шт")!==wantU) continue;
        sampleName = op.productName.trim(); sampleUnit = _impUnitKey(op.unit)||wantU; break outer;
      }
    }
    if(!sampleName) continue;
    const p = createCatalogStockItem(type, sampleName, sampleUnit);
    p.qty = ledger;
    state.stock.push(p);
    stockIds.add(p.id);
    try{ propagateName(type, p.name, p.unit); }catch(e){}
    for(const kind of JOURNAL_KEYS){
      for(const op of (state.journals[kind]||[])){
        if(stockNormName(op.productName)!==n) continue;
        const ot = (op.stockType && STOCK_TYPE_KEYS.includes(op.stockType)) ? op.stockType : "product";
        if(ot!==type) continue;
        if((_impUnitKey(op.unit)||"шт")!==wantU) continue;
        if(op.productId && stockIds.has(op.productId)) continue;
        op.productId = p.id; op.productName = p.name; op.stockType = type;
      }
    }
    created++;
  }
  return created;
}
// Сверка остатка с журналом. allowDown=false (по умолчанию) — только повышаем недосчитанные
// (безопасно: журнал мог не попасть в остаток). allowDown=true — приводим и завышенные к журналу
// (только по явному запросу пользователя: журнал не всегда полный, ручное занижение возможно).
function reconcileLegacyQtyFromJournal(allowDown, allowUp){
  if(allowUp==null) allowUp = true;
  const up = [], down = [];
  for(const s of (state.stock||[])){
    if(hasBatches(s)) continue;
    const ledger = ledgerQtyForProduct(s);
    const cur = totalQtyOf(s);
    if(ledger === cur) continue;
    if(ledger > cur){
      if(!allowUp) continue;   // усечённый/облачный локальный журнал — raise раздувает qty
      s.qty = ledger; s.updatedAt = new Date().toISOString();
      up.push({ name:s.name, was:cur, now:ledger });
    } else if(allowDown && ledger >= 0){
      s.qty = ledger; s.updatedAt = new Date().toISOString();
      down.push({ name:s.name, was:cur, now:ledger });
    }
  }
  return { fixed: up.length + down.length, up, down };
}
// локальный журнал после cloud pull усечён (≤500/kind) → ledger неполный
function journalLooksIncomplete(){
  if(activeCloudId()) return true;
  const jrLen = JOURNAL_KEYS.reduce((n,k)=> n + ((state.journals[k]||[]).length), 0);
  return jrLen >= 500;
}
// список позиций, где остаток БОЛЬШЕ журнала (кандидаты на завышение, напр. старым багом сверки)
function overCountedVsJournal(){
  const over = [];
  for(const s of (state.stock||[])){
    if(hasBatches(s)) continue;
    const ledger = ledgerQtyForProduct(s);
    const cur = totalQtyOf(s);
    if(cur > ledger && ledger >= 0) over.push({ id:s.id, name:s.name, cur, ledger });
  }
  return over;
}
function runStockJournalReconcile(allowDown, allowMerge){
  if(!canEditStock()) return { merged:0, relinked:0, created:0, fixed:0, up:[], down:[], skippedBatched:0, incomplete:false };
  const incomplete = journalLooksIncomplete();
  // merge дублей — только по явной «Сверке» (allowMerge). Авто/boot не сливает карточки.
  const merged = allowMerge ? mergeDuplicateStockByName() : 0;
  const relinked = relinkJournalOpsToCanonical();
  // create/raise по усечённому журналу раздувают остатки (нет выдач в хвосте) — только relink+merge
  const created = incomplete ? 0 : ensureProductsFromJournalLedger();
  const { fixed, up, down } = reconcileLegacyQtyFromJournal(!!allowDown && !incomplete, !incomplete);
  const skippedBatched = (state.stock||[]).filter(s=>hasBatches(s)).length;
  if(merged || relinked || created || fixed){
    saveState();
    try{ cloudMaybePush(); }catch(_){}
    try{ render(); }catch(_){}
  }
  return { merged, relinked, created, fixed, up, down, skippedBatched, incomplete };
}
function runAutoStockJournalReconcile(){
  // v5: при облаке/усечённом журнале raise отключён (post-pull сверка идёт по полному журналу).
  const key = NS + "vahtahoz_stock_reconcile_v5_" + (profiles.activeId || "default");
  if(localStorage.getItem(key)) return null;
  if(journalLooksIncomplete()){ localStorage.setItem(key, "1"); return null; }
  const r = runStockJournalReconcile(false, false);   // авто — только вверх, без merge; только полный локальный журнал
  localStorage.setItem(key, "1");
  const parts = [];
  if(r.created) parts.push(`новых поз.: ${r.created}`);
  if(r.fixed) parts.push(`остатков исправлено: ${r.fixed}`);
  if(parts.length) setTimeout(()=>toast(`Сверка склада: ${parts.join(", ")}`), 900);
  return r;
}

    <button class="btn btn-primary w-full" id="reconcileGo">Запустить сверку</button>
    <div id="reconcileOut" class="text-sm mt-3 whitespace-pre-line opacity-80"></div>
  `);
  document.getElementById("reconcileGo").onclick = ()=>{
    const downEl = document.getElementById("reconcileDown");
    const allowDown = !!(downEl && downEl.checked) && !jrTruncated;
    const r = runStockJournalReconcile(allowDown, true);
    const lines = [];
    if(r.merged) lines.push(`Объединено дублей: ${r.merged}`);
    if(r.relinked) lines.push(`Перепривязано записей журнала: ${r.relinked}`);
    if(r.created) lines.push(`Создано позиций на складе: ${r.created}`);
    if(r.fixed) lines.push(`Исправлено остатков: ${r.fixed}`);
    if(r.incomplete) lines.push("", "⚠ Остатки по журналу не меняли — локальный журнал неполный.");
    const ex = [...(r.up||[]), ...(r.down||[])];
    if(ex.length){
      lines.push("", "Примеры (было → стало):");
      ex.slice(0,12).forEach(x=> lines.push(`• ${x.name}: ${fmtQty(x.was)} → ${fmtQty(x.now)}`));
      if(ex.length>12) lines.push(`… и ещё ${ex.length-12}`);
    }
    if(!allowDown && !jrTruncated){
      const over = overCountedVsJournal();
      if(over.length) lines.push("", `⚠ Остаток больше локального журнала у ${over.length} поз. — включите галочку выше, чтобы привести к журналу.`);
    }
    if(!lines.length) lines.push("Расхождений не найдено — склад совпадает с журналом.");
    document.getElementById("reconcileOut").textContent = lines.join("\n");
    toast(r.fixed || r.created || r.merged || r.relinked ? "Сверка выполнена" : (r.incomplete ? "Дубли/перепривязка: без правок остатков" : "Расхождений нет"));
  };
}

function saveOp(kind){
  if(!ensureCanEdit()) return;
  const m = JOURNAL_META[kind];
  const body = document.getElementById("sheetBody");
  const pid = body.querySelector("#opProdId").value;
  const manualName = body.querySelector("#opName").value.trim();
  const qty = roundQty(parseNum(body.querySelector("#opQty").value));   // округляем в источнике: op.qty, склад и лог единообразны (иначе float-хвост ломает авто-удаление орфана)
  const unit = body.querySelector("#opUnit").value;
  const note = body.querySelector("#opNote").value.trim();
  if(!qty || qty<=0){ toast("Укажите количество"); return; }
  let product = pid ? state.stock.find(s=>s.id===pid) : null;
  // тип с активной вкладки склада (household/tool), иначе product — не создаём «еду» с вкладки инструмента
  const defType = (STOCK_TYPE_KEYS.includes(stockTab) ? stockTab : "product");
  if(!product && m.sign>0) product = resolveIncomingProduct({ manualName, unit, type: defType });
  const name = product ? product.name : manualName;
  if(!name){ toast("Выберите товар или введите название"); return; }
  // Расход/списание с партиями — только через ＋/− на карточке (выбор партии)
  if(product && hasBatches(product) && m.sign<0){
    toast("У этой позиции есть партии — используйте ＋/− на карточке (выбор партии)");
    return;
  }
  if(product && m.sign<0 && Number(product.qty||0) < qty){ toast("Не хватает на складе"); return; }
  // Защита от «расхода в воздух»: если выбрали ручной ввод имени и это расход — не даём проводить движение
  if(!product && m.sign<0){
    toast("Для расхода выберите позицию со склада (поиск выше)");
    return;
  }

  const op = {
    id: uid(),
    ts: new Date().toISOString(),
    productId: product?.id || "",
    productName: name,
    qty,
    unit: product?.unit || unit,
    note,
    stockType: journalStockType(product, defType),
  };
  if(kind==="order") op.status = "pending";

  if(product && m.sign!==0) applyStockDelta(product, m.sign, qty, note, m.sign>0 ? op : null);
  state.journals[kind] = state.journals[kind] || [];
  state.journals[kind].unshift(op);
  logOp(kind.toUpperCase(), `${name} ${m.sign>0?"+":m.sign<0?"-":""}${qty} ${op.unit||""}`);
  saveState(); closeSheet(); render();
  toast(`${m.verb}: ${name}`);
}

/* ===================== ИМПОРТ ПОСТУПЛЕНИЯ ИЗ EXCEL =====================
   Два формата:
   1) Простой шаблон: первая строка — заголовки (Наименование | Количество | …)
   2) УПД / счёт-фактура (.xlsx от поставщика): строки товаров + дата «от ДД.ММ.ГГГГ»
   Каждая строка = поступление на склад + запись в журнал. */

// убираем из наименования прайс/логистический мусор поставщика
// (\b в JS не видит кириллицу)
function cleanNameImport(s){
  let t = String(s??"").replace(/[<>'"\\\r\n]/g,"").trim();
  t = t.replace(/^\*+\s*/, "").replace(/\s*\*+$/, "");
  // цена / прайс (без \b — иначе кириллица не матчится)
  t = t.replace(/цена\s*за\s*(штуку|шт\.?|блочок|блок|коробку|кор\.?|уп\.?|упаковку|\d+\s*листов?)/gi, " ");
  t = t.replace(/цена\s*[=:]\s*[\d.,]+\s*(руб\.?|₽|р\.?)?/gi, " ");
  t = t.replace(/по\s+цене\s+[\dхxХ]+/gi, " ");
  t = t.replace(/\d+[.,]\d{2}\s*(руб\.?|₽|р\.)(?![0-9A-Za-zА-Яа-яЁё])/gi, " ");
  t = t.replace(/(?<![0-9A-Za-zА-Яа-яЁё])\d+\s*(руб\.?|₽)(?![0-9A-Za-zА-Яа-яЁё])/gi, " ");
  // условия отгрузки / маркетинг (в т.ч. слитно: молочныеТОЛЬКО БЛОЧКАМИ)
  t = t.replace(/только\s+(блочками|местами|коробками|штуками|упаковками)/gi, " ");
  t = t.replace(/промо[- ]?пак/gi, " ");
  t = t.replace(/\(\s*\d+\s*\+\s*\d+\s*в\s+подарок[^)]*\)/gi, " ");
  t = t.replace(/\+\s*\d+\s*гр?\.?\s*в\s+подарок/gi, " ");
  t = t.replace(/\[\s*[дс]\s*\]/gi, " ");
  // хвост даты поставки из УПД: (23.06.2026, РОССИЯ) / * (04.06–06.06.2026, РОССИЯ)
  t = t.replace(/\s*\*?\s*\(\s*\d{1,2}[./]\d{1,2}[./]\d{2,4}(?:\s*[-–]\s*\d{1,2}[./]\d{1,2}[./]\d{2,4})?\s*,\s*[А-ЯA-ZЁ][^)]*\)\s*$/u, "");
  t = t.replace(/\s{2,}/g, " ").replace(/\s+([,.;])/g, "$1").replace(/[,\s.;\-–—*]+$/g, "").trim();
  return t.slice(0, 200);
}
const _impNormHeader = (h) => String(h||"").toLowerCase().replace(/ё/g,"е").replace(/[\s.\-_№#\/]+/g,"").trim();
const _IMP_HEADER_MAP = {
  name:     ["наименование","название","товар","номенклатура","name","item","product"],
  qty:      ["количество","колво","кол","qty","quantity","count","приход","поступило"],
  unit:     ["едизм","ед","единица","единицаизмерения","unit","uom"],
  category: ["категория","группа","category","group"],
  expiry:   ["срокгодности","срок","годендо","expiry","expirydate","bestbefore"],
  location: ["место","локация","склад","ячейка","location","place"],
  note:     ["примечание","коммент","комментарий","note","comment","поставщик","supplier"],
  date:     ["дата","датапоступления","датаприхода","date","receiptdate"],
};
function _impMapHeaders(headerRow){
  const map = {};
  for(const raw of headerRow){
    const n = _impNormHeader(raw);
    for(const field in _IMP_HEADER_MAP){
      if(_IMP_HEADER_MAP[field].includes(n)){ map[raw] = field; break; }
    }
  }
  return map;
}
function _excelSerialToISO(n){
  const ms = Math.round((Number(n) - 25569) * 86400 * 1000);
  const d = new Date(ms);
  return isNaN(d.getTime()) ? "" : d.toISOString().slice(0,10);
}
function _impParseDate(v){
  if(v==null || v==="") return "";
  if(v instanceof Date){
    if(isNaN(v.getTime())) return "";
    return new Date(v.getTime() - v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  }
  if(typeof v==="number") return _excelSerialToISO(v);
  const s = String(v).trim();
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m = /^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/.exec(s);
  if(m){
    let [,d,mo,y]=m;
    if(y.length===2){ const yy=+y; y = String((yy>=70?1900:2000)+yy); }
    return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  }
  return "";
}
function _impPad2(n){ return String(n).padStart(2,"0"); }
function _impExtractDocDate(text){
  const s = String(text||"");
  const m = s.match(/от\s+(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/i);
  if(!m) return "";
  let y = m[3];
  if(y.length===2){ const yy=+y; y = String((yy>=70?1900:2000)+yy); }
  return `${y}-${_impPad2(m[2])}-${_impPad2(m[1])}`;
}
function _impMapUnit(u){
  const raw = String(u||"").trim();
  if(!raw) return null;   // пустая из файла — fail-closed (import skip)
  const s = raw.toLowerCase().replace(/\.$/,"");
  const okei = { "796":"шт","778":"уп","625":"шт","168":"т","166":"кг","163":"г","112":"л","111":"мл","055":"м2","006":"метр","004":"шт","018":"метр" };
  if(/^\d{2,4}$/.test(s) && okei[s]) return okei[s];
  if(/^\d{2,4}$/.test(s)) return null;
  // ДО UNITS.includes: иначе «упаковка» из списка остаётся ≠ «уп» из импорта/ОКЕИ
  if(s==="упаковка"||s==="уп"||/^упаков/.test(s)) return "уп";
  if(s==="штука"||s==="штук"||s==="штуки"||s==="шт"||s==="ед"||s==="единица") return "шт";
  if(s==="килограмм"||s==="килограмма"||s==="кг") return "кг";
  if(s==="грамм"||s==="грамма"||s==="гр"||s==="г") return "г";
  if(s==="литр"||s==="литра"||s==="л") return "л";
  if(s==="миллилитр"||s==="мл") return "мл";
  if(/^короб/.test(s)||s==="кор") return "кор";
  if(/^пачк/.test(s)||s==="пачка") return "пачка";
  if(/^рулон/.test(s)||s==="рулон") return "рулон";
  if(/^меш/.test(s)||s==="меш") return "меш";
  if(/^метр/.test(s)||s==="м"||s==="метр") return "метр";
  if(UNITS.includes(s)) return s;
  return null;
}
// ключ ед. для СОПОСТАВЛЕНИЯ карточек: пустая ≈ «шт»; неизвестная → null (fail-closed)
function _impUnitKey(u){
  const m = _impMapUnit(u);
  if(m) return m;
  if(!String(u||"").trim()) return "шт";
  return null;
}
// эвристика категории продукта по имени — только из списка категорий базы

    [/колбас|сардельк|сосиск|шпик|ветчин|карбонад|балык|ребер|рёбер|(?:^|[^а-я])копч/, "Колбасные изделия и копчёности"],
    [/сгущен|молоко|сыр(?:\s|$|,|\.)|творог|творож|сметан|кефир|ряженк|йогурт|масло сливоч|сливк/, "Молочные продукты"],
    [/варенье|джем|конфет|шоколад|вафл|печенье|пряник|зефир|мармелад|халва|торт|кекс|козинак|сушк|батончик|донат|пирожн|чоко\s*пай/, "Сладости и десерты"],
    [/сахар|соль(?:\s|$|,|\.)|мука|крахмал|пудра/, "Сахар, соль, мучное"],
    // соусы раньше мяса: иначе «для курицы» уводит в мясо

    [/бедро|грудк|крыл[оа]|голен|окороч|четвертин|желудк|сердце\s*кур|(?:^|[^а-я])кур(?:иц(?!н)|инн?[аыоея]|очк|ятин)|цыпл|индейк|говядин|свинин|мясо|окорок|сердце|печень(?!е)|фарш|стейк|отруб|минтай|скумбр|корюшк|форел|с[её]мг|горбуш|палтус|пангасиус|тилапи|кальмар|гребешок|филе|стейкбургер|вырезк|грудинк/, "Мясо, рыба и мясные продукты"],
    [/блин|вареник|смесь|замороз|(?<!вы)морож|морковь кубик|крабов/, "Заморозка"],
    [/сок(?:\s|$|,|\.)|чай(?:\s|$|,|\.)|кофе|напит|вода(?:\s|$|,|\.)|лимонад|компот|кисель|какао/, "Напитки и ингредиенты для напитков"],
    [/овощ|фрукт|яблок|капуст|картоф|лук(?:\s|$|,|\.)|чеснок|огурец|помидор|лимон(?!н)/, "Овощи и фрукты"],
    [/орех|изюм|курага|чернослив|сухофрукт|семечк|арахис/, "Сухофрукты и орехи"],

  const allowed = Array.isArray(state.categories?.product) ? state.categories.product : [];
  const pick = (want)=>{

// ключ для сопоставления импорта с каталогом: убираем фасовку/ТМ/кавычки
function stockKeyImport(s){
  let t = String(s||"").toLowerCase().replace(/ё/g,"е");
  t = t.replace(/[«»"'`]/g, " ");
  t = t.replace(/\([^)]*\)/g, " ");
  t = t.replace(/\bт\.?\s*м\.?\b/g, " ");
  t = t.replace(/\b(вес|зам\.?|с\/м|в\/к|в\/уп|ж\/б|ст\/б|м\/уп|полиамид)\b/g, " ");
  t = t.replace(/\b\d+\s*[xх*×]\s*\d+\s*(г|гр|кг|мл|л|шт)?\b/gi, " ");
  t = t.replace(/\b\d+\/\d+\s*(шт|кг|г|гр|мл|л|кор|уп)?\b/gi, " ");
  t = t.replace(/\b\d+([.,]\d+)?\s*(гр|г|кг|мл|л|шт)\b/gi, " ");
  t = t.replace(/[^a-zа-я0-9]+/g, " ");
  t = t.replace(/\b(гр)\b/g, "г");
  return t.replace(/\s+/g, " ").trim();
}
function _impTokens(s){
  return stockKeyImport(s).split(" ").filter(w=> w.length>=3 && !/^\d+$/.test(w));
}
function _impTokenScore(a, b){
  const A = new Set(_impTokens(a)), B = new Set(_impTokens(b));
  if(!A.size || !B.size) return 0;
  let inter = 0;
  for(const x of A) if(B.has(x)) inter++;
  return inter / Math.max(A.size, B.size);
}
// импорт: сначала существующая карточка; новая — только если нет похожей
function findStockForImport(name, unit){
  const types = ["product"];
  const wantUnit = _impMapUnit(unit);   // import: пустая/unknown уже отсеяны в recordReceiptRow
  const exact = stockNormName(name);
  const key = stockKeyImport(name);
  const pool = state.stock.filter(s=> types.includes(s.type));
  const rank = (s)=>{
    const sameU = _impUnitKey(s.unit)===wantUnit ? 1 : 0;
    const inSt = totalQtyOf(s)>0 ? 1 : 0;
    return sameU*50 + inSt*10 + Math.min(totalQtyOf(s), 99)/100;
  };
  let hits = pool.filter(s=> stockNormName(s.name)===exact && (!wantUnit || _impUnitKey(s.unit)===wantUnit));
  if(hits.length) return hits.slice().sort((a,b)=> rank(b)-rank(a))[0];
  if(key.length >= 8){
    hits = pool.filter(s=> stockKeyImport(s.name)===key && (!wantUnit || _impUnitKey(s.unit)===wantUnit));
    if(hits.length) return hits.slice().sort((a,b)=> rank(b)-rank(a))[0];
  }
  let best=null, bestScore=0;
  for(const s of pool){
    if(wantUnit && _impUnitKey(s.unit) !== wantUnit) continue;
    const sk = stockKeyImport(s.name);
    if(sk.length < 8 || key.length < 8) continue;
    let score = _impTokenScore(name, s.name);
    if(key.includes(sk) || sk.includes(key)){
      const cov = Math.min(key.length, sk.length) / Math.max(key.length, sk.length);
      score = Math.max(score, cov);
    }
    if(score > bestScore){ bestScore=score; best=s; }
  }
  // порог высокий: лучше создать новое, чем приклеить к чужой карточке
  if(best && bestScore >= 0.72) return best;
  return null;
}
function stockNormLoose(s){
  return stockKeyImport(s);
}
function findStockByNameLoose(name, type, unit){
  return findStockForImport(name, unit||"шт");
}
// фасовка из имени «1/24шт», «1/360шт»
function _impPackSize(name){
  const m = String(name||"").toLowerCase().replace(/ё/g,"е").match(/1\s*\/\s*(\d+)\s*шт/);
  return m ? (+m[1]||0) : 0;
}
// яйца 1/360шт в УПД — штуки → коробки; иначе qty оставляем в шт
function _impNormalizePackQty(name, qty, unit){
  let q = roundQty(qty), u = _impMapUnit(unit);
  const n = String(name||"").toLowerCase().replace(/ё/g,"е");
  const pack = _impPackSize(n);
  if(/яйц/.test(n) && pack >= 30 && (u==="шт"||u==="штук") && q >= pack && Math.abs(q % pack) < 1e-6){
    q = roundQty(q / pack);
    u = "кор";
  }
  return { qty:q, unit:u };
}
// если карточка в других единицах — привести qty к unit карточки по фасовке
function _impAlignQtyToProduct(product, name, qty, unit){
  let q = roundQty(qty), u = _impMapUnit(unit);
  const pu = _impUnitKey(product?.unit);   // пустая карточка ≈ шт
  if(u==null || pu==null) return null;
  if(pu===u) return { qty:q, unit:pu };
  const pack = _impPackSize(product?.name) || _impPackSize(name);
  if(pack > 1){
    if(pu==="кор" && u==="шт" && q >= pack && Math.abs(q % pack) < 1e-6) return { qty: roundQty(q/pack), unit:"кор" };
    if(pu==="шт" && u==="кор") return { qty: roundQty(q*pack), unit:"шт" };
    if(pu==="уп" && u==="шт" && q >= pack && Math.abs(q % pack) < 1e-6) return { qty: roundQty(q/pack), unit:"уп" };
    if(pu==="шт" && u==="уп") return { qty: roundQty(q*pack), unit:"шт" };
  }
  // нельзя молча сменить unit и оставить чужой qty — пропускаем строку
  return null;
}
// одна строка импорта → поступление (мутирует склад/журнал; saveState — у вызывающего через logOp/saveState)
function recordReceiptRow(row){
  const name = cleanNameImport(row.name);
  let qty = roundQty(parseNum(row.qty));
  if(!name || !(qty>0)) return null;
  let unit = _impMapUnit(row.unit);
  if(unit==null){ console.warn("import skip: неизвестная ед.", row.unit, name); return null; }
  ({ qty, unit } = _impNormalizePackQty(name, qty, unit));
  // только существующие; новое имя — лишь если в каталоге нет похожего
  let product = findStockForImport(name, unit);
  let created = false;
  if(!product){
    product = createCatalogStockItem("product", name, unit);
    state.stock.push(product);
    created = true;
    if(!row.skipPropagate){ try{ propagateName("product", name, product.unit); }catch(e){} }
  } else {
    const aligned = _impAlignQtyToProduct(product, name, qty, unit);
    if(!aligned){ console.warn("import skip: ед. не сходятся без фасовки", name, unit, "→", product.unit); return null; }
    ({ qty, unit } = aligned);
  }
  // категорию ставим только новой карточке или если у старой пусто/«Прочие»/ошибочные макароны у бульона
  const guessed = guessProductCategory(product.name || name);
  const curCat = String(product.category||"").trim();
  const weakCat = !curCat || /^проч/i.test(curCat) || (/макарон/i.test(curCat) && /бульон/i.test(product.name||name));
  const cat = cleanCatName(row.category) || (created || weakCat ? guessed : "");
  if(cat){
    state.categories.product = state.categories.product || [];
    if(!state.categories.product.includes(cat)) state.categories.product.push(cat);
    if(created || weakCat) product.category = cat;
  }
  const note = (typeof row.note==="string" ? row.note.slice(0,200) : "").trim();
  const expiry = _impParseDate(row.expiry);
  const location = cleanCatName(row.location);
  const day = _impParseDate(row.receiptDate) || "";
  const ts = day ? `${day}T09:00:00.000Z` : new Date().toISOString();
  const op = {
    id:uid(), ts, productId:product.id, productName:product.name, qty,
    unit:product.unit||unit, note: note||"Импорт поступления",
    stockType: journalStockType(product, "product"),
  };
  applyStockDelta(product, 1, qty, op.note, op);
  if(hasBatches(product) && op.batchId){
    const b = (product.batches||[]).find(x=>x.id===op.batchId);
    if(b){
      if(expiry) b.expiry=expiry;
      if(location) b.location=location;
      if(day) b.createdAt = ts;
      op.batchExpiry=b.expiry||""; op.batchLocation=b.location||"";
      syncItemFromBatches(product);
    }
  } else {
    if(expiry && !product.expiry) product.expiry = expiry;
    if(location && !product.location) product.location = location;
  }
  state.journals.receipt = state.journals.receipt || [];
  state.journals.receipt.unshift(op);
  return op;
}

const IMP_MAX_ROWS = 3000;
const IMP_MAX_BYTES = 8 * 1024 * 1024;
const IMP_MAX_FILES = 20;

// УПД / счёт-фактура: ищем шапку «Наименование товара» + № п/п + количество + ед.изм.
function _impParseUpdAoa(aoa, fileHint){
  let looksUpd = false, receiptDate = "";
  for(let r=0; r<Math.min(30, aoa.length); r++){
    for(const cell of (aoa[r]||[])){
      const s = String(cell||"");
      if(/УПД|счет[\s-]*фактур|счёт[\s-]*фактур/i.test(s)) looksUpd = true;
      if(/фактур|УПД|отгрузк/i.test(s)){
        const d = _impExtractDocDate(s);
        if(d) receiptDate = d;
      }
    }
  }
  if(!looksUpd) return null;
  let hdr = -1, idxName = -1, idxQty = -1, idxUnit = -1, idxNum = -1;
  for(let r=0; r<Math.min(45, aoa.length); r++){
    const row = aoa[r]||[];
    for(let c=0; c<row.length; c++){
      const n = _impNormHeader(row[c]);
      if(n.includes("наименованиетовара") || (n.includes("наименование") && n.includes("товар"))){
        hdr = r; idxName = c; break;
      }
    }
    if(hdr!==r) continue;
    for(let c=0; c<row.length; c++){
      const n = _impNormHeader(row[c]);
      const n2 = _impNormHeader((aoa[r+1]||[])[c]);
      if(n.includes("количество") || n2.includes("количество") || n.includes("объем") || n2.includes("объем")) idxQty = c;
      if(n.includes("условноеобозначение") || n2.includes("условноеобозначение") || n2.includes("национал")) idxUnit = c;
      else if(idxUnit<0 && (n.includes("единицаизмерения") || n2.includes("единица"))) idxUnit = c;
      if(n==="пп" || n.endsWith("пп") || n.includes("пп") && n.length<=4) idxNum = c;
    }
    const row2 = aoa[r+1]||[];
    for(let c=0; c<row2.length; c++){
      const n = _impNormHeader(row2[c]);
      if(idxQty<0 && (n.includes("количество")||n.includes("объем"))) idxQty = c;
      if(n.includes("условноеобозначение") || n.includes("национал")) idxUnit = c;
    }
    break;
  }
  if(idxName<0 || idxQty<0) return { rows:[], error:"Это похоже на УПД, но не найдены колонки «Наименование» / «Количество».", format:"upd" };
  const label = fileHint || "УПД";
  const rows = [];
  for(let r=hdr+1; r<aoa.length; r++){
    const arr = aoa[r]||[];
    const name = String(arr[idxName]??"").trim();
    if(!name || name==="-" || /^итого/i.test(name) || /наименование/i.test(name)) continue;
    if(idxNum>=0){
      const num = arr[idxNum];
      const okNum = typeof num==="number" || /^\d+$/.test(String(num??"").trim());
      if(!okNum) continue;
    }
    const qty = arr[idxQty];
    if(!(roundQty(parseNum(qty))>0)) continue;
    rows.push({
      name, qty, unit: idxUnit>=0 ? (arr[idxUnit]||"шт") : "шт",
      category:"", receiptDate, note:`Импорт УПД ${label}`, skipPropagate:true
    });
  }
  return { rows, format:"upd", receiptDate };
}

function _impParseTemplateAoa(aoa){
  const headerRow = (aoa[0]||[]).map(x=>String(x));
  const hmap = _impMapHeaders(headerRow);
  if(!Object.values(hmap).includes("name")) return { rows:[], error:"Не найден столбец «Наименование». Для УПД загрузите исходный .xlsx поставщика; для своего файла — скачайте шаблон." };
  const idxOf = {};
  headerRow.forEach((h,i)=>{ if(hmap[h]) idxOf[hmap[h]] = i; });
  const rows = [];
  for(let r=1; r<aoa.length; r++){
    const arr = aoa[r]; if(!arr || !arr.length) continue;
    const get = (f)=> idxOf[f]!=null ? arr[idxOf[f]] : "";
    const nm = String(get("name")||"").trim();
    if(!nm) continue;
    rows.push({
      name:nm, qty:get("qty"), unit:get("unit"), category:get("category"),
      expiry:get("expiry"), location:get("location"), note:get("note"),
      receiptDate:get("date"), skipPropagate:true
    });
  }
  return { rows, format:"template" };
}

function _impParseWorkbook(XLSX, data, fileHint){
  const wb = XLSX.read(data, { type:"array" });
  const wsName = wb.SheetNames[0];
  if(!wsName) return { rows:[], error:"Файл пуст" };
  const ws = wb.Sheets[wsName];
  const aoa = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:"" });
  if(!aoa.length) return { rows:[], error:"Нет строк" };
  if(aoa.length > IMP_MAX_ROWS + 40) return { rows:[], error:`Слишком много строк (макс. ${IMP_MAX_ROWS}). Разбейте файл на части.` };
  const upd = _impParseUpdAoa(aoa, fileHint);
  if(upd) return upd;
  return _impParseTemplateAoa(aoa);
}

function _impFileHint(name){
  const m = String(name||"").match(/(\d{4,})/);
  return m ? m[1] : String(name||"").replace(/\.[^.]+$/,"").slice(0,24);
}

async function importReceiptsExcel(ev){
  const list = ev.target.files ? Array.from(ev.target.files) : [];
  const inputEl = ev.target;
  if(!list.length) return;
  if(!ensureCanEdit()){ inputEl.value=""; return; }
  const out = ()=>document.getElementById("impReceiptOut");
  if(list.length > IMP_MAX_FILES){ if(out()) out().textContent=`Слишком много файлов (макс. ${IMP_MAX_FILES}).`; inputEl.value=""; return; }
  for(const f of list){
    if(f.size > IMP_MAX_BYTES){ if(out()) out().textContent=`«${f.name}» слишком большой (макс. ${Math.round(IMP_MAX_BYTES/1024/1024)} МБ).`; inputEl.value=""; return; }
  }
  if(out()) out().textContent = list.length>1 ? `Чтение ${list.length} файлов…` : "Чтение файла…";
  let XLSX;
  try{ XLSX = await ensureXlsx(); }
  catch(e){ if(out()) out().textContent="Не удалось загрузить Excel-модуль (нужна сеть в первый раз)."; inputEl.value=""; return; }

  const readOne = (f)=> new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(new Uint8Array(reader.result));
    reader.onerror = ()=>reject(new Error("read"));
    reader.readAsArrayBuffer(f);
  });

  const allRows = [];
  const meta = [];
  try{
    for(const f of list){
      const buf = await readOne(f);
      const hint = _impFileHint(f.name);
      let parsed;
      try{ parsed = _impParseWorkbook(XLSX, buf, hint); }
      catch(e){ console.warn("import parse", f.name, e); if(out()) out().textContent=`Не удалось прочитать «${f.name}».`; inputEl.value=""; return; }
      if(parsed.error){ if(out()) out().textContent = `${f.name}: ${parsed.error}`; inputEl.value=""; return; }
      const rows = parsed.rows||[];
      meta.push({ name:f.name, n:rows.length, format:parsed.format||"?", date:parsed.receiptDate||"" });
      allRows.push(...rows);
    }
  }catch(e){
    console.warn("import read", e);
    if(out()) out().textContent="Ошибка чтения файла.";
    inputEl.value=""; return;
  }
  inputEl.value = "";
  if(allRows.length > IMP_MAX_ROWS){ if(out()) out().textContent=`Слишком много строк суммарно (${allRows.length}, макс. ${IMP_MAX_ROWS}).`; return; }

  const valid = allRows.filter(r=> cleanNameImport(r.name) && roundQty(parseNum(r.qty))>0);
  const skipped = allRows.length - valid.length;
  if(!valid.length){ if(out()) out().textContent = `Не найдено строк с наименованием и количеством > 0 (всего: ${allRows.length}).`; return; }

  const filesLine = meta.map(m=>{
    const d = m.date ? m.date.split("-").reverse().join(".") : "";
    const tag = m.format==="upd" ? ` (УПД${d?`, ${d}`:""})` : "";
    return `• ${m.name}: ${m.n} поз.${tag}`;
  }).join("\n");
  const preview = valid.slice(0,8).map(r=>{
    const u = _impMapUnit(r.unit) || (String(r.unit||"").trim() || "?");
    const d = _impParseDate(r.receiptDate);
    return `• ${cleanNameImport(r.name).slice(0,48)} — ${fmtQty(roundQty(parseNum(r.qty)))} ${u}${d?` · ${d.split("-").reverse().join(".")}`:""}`;
  }).join("\n");
  const go = await confirmSheet(
    `Импортировать поступлений: ${valid.length}${skipped?`\nПропущено: ${skipped}`:""}\n\nФайлы:\n${filesLine}\n\n${preview}${valid.length>8?`\n…и ещё ${valid.length-8}`:""}`,
    { yes:"Импортировать", no:"Отмена", title:"Подтверждение импорта" }
  );
  if(!go) return;
  let ok = 0, unitSkip = 0;
  for(const r of valid){
    try{
      const res = recordReceiptRow(r);
      if(res) ok++;
      else unitSkip++;   // имя/qty ок, но ед. неизвестна или не сошлась с карточкой
    }catch(e){ console.warn("recordReceiptRow", e); unitSkip++; }
  }
  if(Array.isArray(state.journals.receipt) && state.journals.receipt.length>3000) state.journals.receipt = state.journals.receipt.slice(0,3000);
  logOp("IMPORT", `Поступление из Excel: ${ok} поз. (${list.length} файл.)`);
  try{ render(); }catch(_){}
  const skipParts = [];
  if(skipped) skipParts.push(`пусто: ${skipped}`);
  if(unitSkip) skipParts.push(`ед.: ${unitSkip}`);
  toast(`Импортировано: ${ok}${skipParts.length?` · пропущено ${skipParts.join(", ")}`:""}`);
}

function orderReceive(opId){
  if(!ensureCanEdit()) return;
  const op = state.journals.order.find(o=>o.id===opId); if(!op) return;
  if(op.status==="received") return;
  // СНАЧАЛА резолвим товар — иначе при сбое заказ останется «Принят» без поступления на склад
  let product = resolveIncomingProduct({ productId: op.productId, manualName: op.productName, unit: op.unit, type:"product" });
  if(!product){ toast("Не удалось определить товар заказа"); return; }
  op.status = "received";
  op.receivedAt = new Date().toISOString();
  op.productId = product.id;
  op.stockType = journalStockType(product, op.stockType || "product");
  const receiptId = uid();
  op.receiptId = receiptId;
  const _st = journalStockType(product, "product");
  if(hasBatches(product)){
    // приём в карточку с партиями — добавляем новую партию (без срока/места, можно отредактировать вручную)
    const newB = { id: uid(), qty: roundQty(op.qty||0), expiry:"", location:"", note: orderNote(op), createdAt:new Date().toISOString() };
    product.batches = product.batches || [];
    product.batches.push(newB);
    op.batchId = newB.id; // привязка заказа к созданной партии — иначе откат в deleteOp создаст вторую партию вместо снятия
    syncItemFromBatches(product);
    state.journals.receipt.unshift({
      id: receiptId, ts: new Date().toISOString(),
      productId: product.id, productName: op.productName,
      qty: op.qty, unit: op.unit, stockType: _st,
      batchId: newB.id, batchLocation: "", batchExpiry: "",
      note: orderNote(op, "(новая партия)"),
    });
  } else {
    product.qty = roundQty(Number(product.qty||0) + Number(op.qty||0));
    product.updatedAt = new Date().toISOString();
    state.journals.receipt.unshift({
      id: receiptId, ts: new Date().toISOString(),
      productId: product?.id || "", productName: op.productName,
      qty: op.qty, unit: op.unit, stockType: _st,
      note: orderNote(op),
    });
  }
  logOp("ORDER_RECEIVE", `${op.productName} +${fmtQty(op.qty)} ${op.unit||""}`);
  saveState(); render();
  toast("Принято на склад");
}

// позиция осиротела (qty=0 и нигде в журналах не упоминается, кроме записи exceptOpId) →
// спрашиваем удалить (тихо не удаляем — может быть каталожной: ценны minStock/категория).
// Был продублирован в deleteOp и saveOpEdit.
async function maybeDropOrphanProduct(prod, exceptOpId){
  if(!prod) return;
  const hasOther = JOURNAL_KEYS.some(k=>
    (state.journals[k]||[]).some(r=>r.productId===prod.id && r.id!==exceptOpId)
  );
  if(!hasOther && await confirmSheet(`«${prod.name}» на складе = 0 и больше не упоминается. Удалить позицию?`,{yes:"Удалить",no:"Оставить"})){
    state.stock = state.stock.filter(s=>s.id!==prod.id);
  }
}

async function deleteOp(kind, opId){
  if(!ensureCanEdit()) return;
  const op = (state.journals[kind]||[]).find(o=>o.id===opId);
  if(!op) return;
  // зеркальная receipt-запись принятого заказа: удалять только через сам заказ,
  // иначе двойной откат склада (здесь и потом при удалении заказа)
  if(kind==="receipt" && (state.journals.order||[]).some(o=>o.receiptId===opId)){
    toast("Эта запись из заказа — удаляйте сам заказ во вкладке «Заказы»");
    return;
  }
  const m = JOURNAL_META[kind];
  // эффективный знак для отката (order влияет на склад только при status==="received", знак +1)
  const effectiveSign = kind==="order"
    ? (op.status==="received" ? +1 : 0)
    : m.sign;
  let revert = false;
  const product = op.productId ? state.stock.find(s=>s.id===op.productId) : null;

  if(effectiveSign!==0 && product){
    const choice = await chooseSheet(
      `Удалить запись?\n${op.productName} — ${fmtQty(op.qty)} ${op.unit||""}`,
      [
        { label:"Удалить и ОТКАТИТЬ склад", value:"revert", color:"btn-warn" },
        { label:"Удалить только запись", value:"keep", color:"btn-danger" },
      ]
    );
    if(!choice) return;
    // другая вкладка могла подменить state во время await — перепроверяем по живым ссылкам,
    // иначе откат мутировал бы осиротевший объект, а saveState() записал бы новый state без него
    if(!(state.journals[kind]||[]).some(o=>o.id===opId)){ toast("Запись изменилась на другом устройстве"); return; }
    const liveProduct = op.productId ? state.stock.find(s=>s.id===op.productId) : null;
    if(liveProduct && liveProduct!==product){ toast("Данные обновились на другом устройстве — повторите"); return; }
    revert = choice==="revert";
    if(revert){
      // batches-режим: пытаемся вернуть/списать в исходную партию по batchId
      if(hasBatches(product)){
        const tb = op.batchId ? (product.batches||[]).find(b=>b.id===op.batchId) : null;
        if(tb){
          const next = roundQty(Number(tb.qty||0) - effectiveSign*Number(op.qty||0));
          if(next<0){ toast("Нельзя откатить: в партии меньше"); return; }
          tb.qty = next;
          // нулевую партию убираем при любом знаке отката — иначе остаётся фантомное место/срок
          if(next===0) product.batches = product.batches.filter(b=>b.id!==tb.id);
          finalizeBatchMutation(product);
        } else {
          // исходной партии нет (удалена/не привязана). Откат прихода = СНЯТЬ qty, но мы не знаем
          // из какой партии — а «восстановить» партию было бы двойным учётом (qty уже учтён где-то).
          toast("Партия этой записи не найдена — точный откат невозможен. Удалите запись без отката.");
          return;
        }
      } else {
        // карточка стала legacy. Если запись отвязана от удалённой партии — откат «в воздух» раздул бы qty
        if(/\[партия удалена\]/.test(op.note||"")){
          toast("Запись отвязана от удалённой партии — откат недоступен. Удалите запись без отката.");
          return;
        }
        const next = Number(product.qty||0) - effectiveSign*Number(op.qty||0);
        if(next<0){ toast("Нельзя откатить: на складе меньше"); return; }
        product.qty = roundQty(next); product.updatedAt = new Date().toISOString();
      }
      // если принятый заказ — удалить парную запись в Поступлении по точному id (fallback: по совпадению)
      if(kind==="order"){
        if(op.receiptId){
          tombJr(op.receiptId);   // надгробие парной записи «Поступление» — чтобы не воскресла pull-ом
          state.journals.receipt = (state.journals.receipt||[]).filter(r=>r.id!==op.receiptId);
        } else {
          // старые записи без receiptId — фолбэк на эвристику (снесёт только одну первую совпадающую)
          const arr = state.journals.receipt||[];
          const idx = arr.findIndex(r=>r.productId===product.id && Number(r.qty)===Number(op.qty) && (r.note||"").startsWith("Из заказа"));
          if(idx>=0){ tombJr(arr[idx].id); arr.splice(idx,1); }
        }
      }
      // если позиция была авто-создана (qty=0 и нет других журнальных записей) — предложить удалить.
      // saveState() ДО интерактивного подтверждения фиксирует откат склада и ставит dirty →
      // pull во время диалога заблокирован и не затрёт нашу правку «осиротевшим» объектом.
      if(product.qty===0){ saveState(); await maybeDropOrphanProduct(product, opId); }
    }
  } else {
    if(!await confirmSheet(`Удалить запись?\n${op.productName} — ${fmtQty(op.qty)} ${op.unit||""}`,{danger:true,yes:"Удалить"})) return;
  }
  tombJr(opId);   // надгробие удаляемой записи — удаление доедет до облака, pull её не вернёт
  state.journals[kind] = state.journals[kind].filter(o=>o.id!==opId);
  logOp("OP_DEL", `${kind} ${op.productName} ${fmtQty(op.qty)}${revert?" (откат)":""}`);
  saveState(); render();
}

/* Редактирование записи журнала: дата/время, продукт, количество, примечание.
   Откат старого эффекта на склад → применение нового. Для принятого заказа — синхронизация
   парной записи в receipt по receiptId. */
function editOp(kind, opId){
  const op = (state.journals[kind]||[]).find(o=>o.id===opId);
  if(!op) return;
  // блок: зеркальная запись принятого заказа — редактировать через order, иначе рассинхрон.
  // Определяем по связи receiptId (надёжно), а не по тексту примечания (его можно изменить).
  if(kind==="receipt" && (state.journals.order||[]).some(o=>o.receiptId===op.id)){
    toast("Эта запись из заказа — редактируйте сам заказ во вкладке «Заказы»");
    return;
  }
  const m = JOURNAL_META[kind];
  // dt-local: YYYY-MM-DDTHH:MM (без секунд, локальное время)
  let d = new Date(op.ts); if(isNaN(d)) d = new Date();   // битый ts → текущее время, чтобы форма не сломалась
  const pad = n=>String(n).padStart(2,"0");
  const dtLocal = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  openSheet(`
    <div class="font-bold text-xl mb-3">✏️ Изменить запись — ${m.label}</div>
    <div class="space-y-3">
      <div>
        <div class="text-sm opacity-70 mb-1">Дата и время</div>
        <input type="datetime-local" class="input" id="eopTs" value="${dtLocal}" />
      </div>
      <div>
        <div class="text-sm opacity-70 mb-1">Сменить позицию (опц.)</div>
        <input class="input" id="eopSearch" placeholder="Поиск по складу…" autocomplete="off" />
        <div id="eopList" class="mt-2 space-y-1 max-h-72 overflow-y-auto list-box"></div>
        <div class="text-xs opacity-60 mt-1" id="eopSel">Текущая: ${esc(op.productName)}${op.productId?" (привязана к складу)":" (вручную)"}</div>
        <input type="hidden" id="eopProdId" value="${esc(op.productId||"")}" />
      </div>
      <input class="input" id="eopName" placeholder="Название вручную (если нет на складе)" value="${esc(op.productName||"")}" />
      <div class="grid grid-cols-2 gap-2">
        <input class="input" id="eopQty" type="number" inputmode="decimal" value="${esc(fmtQty(op.qty))}" />
        <select class="input" id="eopUnit">${UNITS.map(u=>`<option ${u===op.unit?"selected":""}>${u}</option>`).join("")}</select>
      </div>
      <textarea class="input" id="eopNote" rows="2">${esc(op.note||"")}</textarea>
      <div class="flex gap-2 pt-2">
        <button class="btn btn-ghost flex-1" data-close>Отмена</button>
        <button class="btn btn-primary flex-1" onclick="saveOpEdit('${kind}','${opId}')">Сохранить</button>
      </div>
    </div>
  `);
  wireStockPicker({ prefix:"eop", emptyHint:"Введите 2+ символа", notFoundText:"Не найдено", nameOnPick:true });
}

async function saveOpEdit(kind, opId){
  if(!ensureCanEdit()) return;
  const op = (state.journals[kind]||[]).find(o=>o.id===opId); if(!op) return;
  const m = JOURNAL_META[kind];
  const body = document.getElementById("sheetBody");
  const dtVal = body.querySelector("#eopTs").value;
  const newProdId = body.querySelector("#eopProdId").value;
  const newName = body.querySelector("#eopName").value.trim();
  const newQty = parseNum(body.querySelector("#eopQty").value);
  const newUnit = body.querySelector("#eopUnit").value;
  const newNote = body.querySelector("#eopNote").value.trim();
  if(!Number.isFinite(newQty) || newQty<=0){ toast("Количество должно быть > 0"); return; }
  if(!newName && !newProdId){ toast("Укажите название или выберите товар"); return; }

  // эффективный знак (order влияет на склад только если received)
  const effSign = kind==="order" ? (op.status==="received" ? +1 : 0) : m.sign;

  const oldProd = op.productId ? state.stock.find(s=>s.id===op.productId) : null;
  let newProd = newProdId ? state.stock.find(s=>s.id===newProdId) : null;
  // приход по ручному имени без выбранной позиции: создаём/находим карточку, иначе поступление
  // осталось бы «в воздухе» (запись есть, остаток не вырос). Для расхода — нельзя (ниже отдельный гард).
  const _effSignEarly = kind==="order" ? (op.status==="received" ? +1 : 0) : m.sign;
  if(!newProd && _effSignEarly>0 && newName){
    newProd = resolveIncomingProduct({ manualName:newName, unit:newUnit, type:(oldProd?.type||"product") });
  }

  // если запись имела привязку к складу, но продукт удалён — нельзя корректно откатить старый эффект
  if(effSign!==0 && op.productId && !oldProd){
    toast("Привязанный продукт не найден на складе — откат невозможен");
    return;
  }
  // запрет редактирования количества для batches-карточек (рассинхрон с партиями)
  if(effSign!==0 && ((oldProd && hasBatches(oldProd)) || (newProd && hasBatches(newProd)))){
    toast("У позиции есть партии — отредактируйте/удалите запись и проведите движение через ＋/− на карточке");
    return;
  }
  // запись отвязана от удалённой партии: откат «в воздух» раздул бы qty legacy-карточки
  if(effSign!==0 && /\[партия удалена\]/.test(op.note||"")){
    toast("Запись отвязана от удалённой партии — правка склада недоступна. Удалите запись без отката.");
    return;
  }

  // блок будущей даты для движений склада (нельзя «выдать»/«принять» в будущем)
  const newTs = dtVal ? new Date(dtVal).toISOString() : op.ts;
  if(effSign!==0 && new Date(newTs).getTime() > Date.now() + 60_000){
    toast("Дата не может быть в будущем для движений склада");
    return;
  }

  // расход обязан быть привязан к складской позиции — иначе журнал скажет «выдано»,
  // а склад не уменьшится (рассинхрон)
  if(effSign<0 && !newProd){
    toast("Для расхода выберите позицию со склада");
    return;
  }

  // снимок qty ДО любых мутаций — для надёжного отката при ошибке
  const oldProdQtyBefore = oldProd ? Number(oldProd.qty||0) : null;
  const newProdQtyBefore = (newProd && newProd!==oldProd) ? Number(newProd.qty||0) : null;
  const restore = () => {
    if(oldProd && oldProdQtyBefore!==null) oldProd.qty = oldProdQtyBefore;
    if(newProd && newProd!==oldProd && newProdQtyBefore!==null) newProd.qty = newProdQtyBefore;
  };

  // 1) откатить старый эффект
  if(effSign!==0 && oldProd){
    const reverted = Number(oldProd.qty||0) - effSign*Number(op.qty||0);
    if(reverted < 0){ toast("Нельзя откатить: на складе меньше старого количества"); return; }
    oldProd.qty = roundQty(reverted); oldProd.updatedAt = new Date().toISOString();
  }
  // 2) применить новый эффект
  if(effSign!==0 && newProd){
    if(effSign<0 && Number(newProd.qty||0) < newQty){
      restore();
      toast("Не хватает на складе для нового количества"); return;
    }
    newProd.qty = roundQty(Number(newProd.qty||0) + effSign*newQty);
    newProd.updatedAt = new Date().toISOString();
  }

  // 3) обновить саму запись
  op.ts = newTs;
  op.productId = newProd?.id || "";
  op.productName = newProd?.name || newName;
  op.qty = roundQty(newQty);
  op.unit = newProd?.unit || newUnit;
  op.note = newNote;
  op.stockType = journalStockType(newProd, op.stockType || "product");

  // 4) для принятого заказа — синхронизируем парную запись в receipt
  if(kind==="order" && op.status==="received" && op.receiptId){
    const r = (state.journals.receipt||[]).find(x=>x.id===op.receiptId);
    if(r){
      r.ts = newTs;
      r.productId = op.productId;
      r.productName = op.productName;
      r.qty = op.qty;
      r.unit = op.unit;
      r.note = orderNote(op);
      r.stockType = op.stockType;
    }
  }

  // если старый продукт после отвязки/перепривязки осиротел (qty=0 и больше нигде не упоминается) —
  // спрашиваем, а не удаляем тихо: позиция может быть каталожной (minStock/категория ценны)
  if(oldProd && oldProd!==newProd && Number(oldProd.qty||0)===0 && !hasBatches(oldProd)){
    saveState();   // фиксируем правки склада ДО интерактивного orphan-подтверждения (dirty блокирует pull в окне диалога)
    await maybeDropOrphanProduct(oldProd, op.id);
  }

  logOp("OP_EDIT", `${kind} ${op.productName} ${fmtQty(op.qty)} ${op.unit||""}`);
  saveState(); closeSheet(); render();
  toast("Запись обновлена");
}

function stockRow(it){
  const st = stockStatus(it);
  const out = !!st.out;
  const badge = out
    ? `<span class="badge badge-gray">${esc(st.text)}</span>`
    : st.color==="red" ? `<span class="badge badge-red">${esc(st.text)}</span>`
    : st.color==="yellow" ? `<span class="badge badge-yellow">${esc(st.text)}</span>` : "";
  const icon = typeMeta(it.type).icon;
  const totalQ = totalQtyOf(it);
  const left = `${fmtQty(totalQ)} ${esc(it.unit||"")}`;
  const qtyBadge = out ? `<span class="badge badge-gray">${left}</span>` : `<span class="badge badge-green">${left}</span>`;
  const locs = locationsOf(it);
  const loc = locs.length===0 ? ""
    : locs.length===1 ? `<span class="badge badge-gray">📍 ${esc(locs[0])}</span>`
    : `<span class="badge badge-gray">📍 ${locs.length} мест</span>`;
  const cat = it.category?`<span class="badge badge-gray">${esc(it.category)}</span>`:"";
  // показываем ближайший срок (агрегат по партиям); при нескольких партиях добавляем "+N"
  const bCnt = batchesOf(it).length;
  const nearestExp = nearestExpiryOf(it);
  const expExtra = bCnt>1 ? ` +${bCnt-1}` : "";
  // срок не показываем у позиции без остатка (qty=0): нет товара — нет срока
  const exp = (nearestExp && inStock(it))?`<span class="badge badge-gray">⏰ ${fmtDate(nearestExp)}${expExtra}</span>`:"";
  // раскрывающаяся панель партий — показывается, если их ≥ 2
  const batchPanel = bCnt>=2 ? `
    <details class="mt-2" onclick="event.stopPropagation()">
      <summary class="text-xs opacity-70 cursor-pointer select-none">Партии (${bCnt}) ▾</summary>
      <div class="mt-2 space-y-1">
        ${batchesOf(it).slice().sort(byExpiry).map(b=>{
          const d = b.expiry?daysLeft(b.expiry):null;
          const cls = d===null?"badge-gray":(d<0?"badge-red":(d<=3?"badge-red":(d<=14?"badge-yellow":"badge-gray")));
          return `<div class="text-xs flex flex-wrap gap-1 items-center pl-2 border-l-2 border-gray-700">
            ${batchQtyBadge(b, it)}
            ${b.location?`<span class="badge badge-gray">📍 ${esc(b.location)}</span>`:""}
            ${b.expiry?`<span class="badge ${cls}">⏰ ${fmtDate(b.expiry)}</span>`:""}
            ${b.note?`<span class="opacity-60">${esc(b.note)}</span>`:""}
          </div>`;
        }).join("")}
      </div>
    </details>` : "";
  return `
    <div class="card${out?" opacity-60":""}">
      <div class="flex items-start gap-3">
        <div class="text-2xl${out?" grayscale":""}">${icon}</div>
        <div class="flex-1 min-w-0" onclick="openStockEdit('${it.id}')">
          <div class="font-semibold break-words${out?" line-through opacity-80":""}">${esc(it.name)}</div>
          <div class="text-xs opacity-70 mt-1 flex flex-wrap gap-2 items-center">
            ${qtyBadge}
            ${cat} ${loc} ${exp} ${badge}
          </div>
          ${batchPanel}
        </div>
      </div>
      <div class="grid grid-cols-${out?"1":"2"} gap-2 mt-3">
        <button class="btn btn-success" onclick="quickAdjust('${it.id}',+1)">＋ Приход${out?" (вернуть в наличие)":""}</button>
        ${out?"":`<button class="btn btn-danger" onclick="quickAdjust('${it.id}',-1)">− Расход…</button>`}
      </div>
    </div>`;
}

async function quickAdjust(id, sign){
  if(!ensureCanEdit()) return;
  const it = state.stock.find(s=>s.id===id); if(!it) return;
  // для расхода — спрашиваем тип движения: выдача персоналу или списание (порча/просрочка/бой)
  let kind, label, title, opNote;
  if(sign>0){
    kind = "receipt"; label = "Сколько пришло?"; title = "Приход"; opNote = "(быстрая правка)";
  } else {
    const choice = await chooseSheet(
      `${it.name}\nКуда списать?`,
      [
        { label:"Выдача (кому-то)",      value:"issue",    color:"btn-danger" },
        { label:"Списание (порча/срок)", value:"writeoff", color:"btn-warn"   },
      ]
    );
    if(!choice) return;
    kind = choice;
    label = kind==="issue" ? "Сколько выдано?" : "Сколько списать?";
    title = kind==="issue" ? "Выдача" : "Списание";
    opNote = kind==="issue" ? "(быстрая выдача)" : "(быстрое списание)";
  }

  // === МНОГО-ПАРТИЙНАЯ ВЕТКА ===
  if(hasBatches(it)){
    const batches = batchesOf(it);
    let targetBatch = null;

    if(sign>0){
      // приход: выбрать существующую партию или создать новую
      const opts = batches.slice().sort(byExpiry).map(b=>({
        label: `${fmtQty(b.qty)} ${it.unit||""}${b.location?" · 📍 "+b.location:""}${b.expiry?" · ⏰ "+fmtDate(b.expiry):""}`,
        value: b.id, color: "btn-success"
      }));
      opts.push({ label: "➕ Новая партия (свой срок/место)", value: "__new__", color: "btn-primary" });
      const choice = await chooseSheet(`${it.name}\nКуда добавить?`, opts);
      if(!choice) return;
      if(choice==="__new__"){
        // спросим срок/место (короткая форма через 2 prompts)
        const expVal = await promptSheet(`${it.name}\nСрок годности новой партии (ГГГГ-ММ-ДД, пусто — без срока)`, "", {title:"Новая партия"});
        if(expVal===null) return;
        // кривой формат сломал бы daysLeft() (NaN → партия не подсветится и не спишется по сроку)
        if(expVal.trim() && !/^\d{4}-\d{2}-\d{2}$/.test(expVal.trim())){ toast("Срок: формат ГГГГ-ММ-ДД"); return; }
        const locVal = await promptSheet(`${it.name}\nМесто хранения (пусто — без места)`, locationsOf(it)[0]||"", {title:"Новая партия"});
        if(locVal===null) return;
        const val = await promptSheet(`${it.name}\n${label}`, "1", {numeric:true,title});
        if(val===null) return;
        const n = roundQty(parseNum(val));
        if(!Number.isFinite(n) || n<=0){ toast("Не число"); return; }
        if(state.stock.find(s=>s.id===id)!==it){ toast("Данные обновились — повторите операцию"); render(); return; }   // pull/смена базы во время диалога пересоздал объект → не теряем правку на «осиротевшем»
        const newB = { id:uid(), qty:n, expiry:expVal.trim(), location:cleanName40(locVal), note:"", createdAt:new Date().toISOString() };
        it.batches.push(newB);
        syncItemFromBatches(it);
        state.journals.receipt = state.journals.receipt || [];
        state.journals.receipt.unshift({ id:uid(), ts:new Date().toISOString(), productId:it.id, productName:it.name, qty:n, unit:it.unit||"", stockType:journalStockType(it), batchId:newB.id, batchLocation:newB.location||"", batchExpiry:newB.expiry||"", note:`Новая партия${newB.expiry?` (срок ${fmtDate(newB.expiry)})`:""}${newB.location?` в «${newB.location}»`:""}` });
        logOp("IN", `${it.name} +${fmtQty(n)} ${it.unit||""} [новая партия]`);
        saveState(); render(); return;
      }
      targetBatch = batches.find(b=>b.id===choice);
    } else {
      // расход: обязателен выбор партии
      const opts = batches.filter(b=>roundQty(b.qty||0)>0).slice().sort(byExpiry).map(b=>({
        label: `${fmtQty(b.qty)} ${it.unit||""}${b.location?" · 📍 "+b.location:""}${b.expiry?" · ⏰ "+fmtDate(b.expiry):""}`,
        value: b.id, color: kind==="issue"?"btn-danger":"btn-warn"
      }));
      if(!opts.length){ toast("Нет партий с остатком"); return; }
      const choice = await chooseSheet(`${it.name}\nС какой партии?`, opts);
      if(!choice) return;
      targetBatch = batches.find(b=>b.id===choice);
    }

    if(!targetBatch){ toast("Партия не найдена"); return; }
    const val = await promptSheet(`${it.name}\n${label}\n(в партии ${fmtQty(targetBatch.qty)} ${it.unit||""}${targetBatch.location?", 📍 "+targetBatch.location:""})`, "1", {numeric:true,title});
    if(val===null) return;
    const n = roundQty(parseNum(val));
    if(!Number.isFinite(n) || n<=0){ toast("Не число"); return; }
    if(state.stock.find(s=>s.id===id)!==it){ toast("Данные обновились — повторите операцию"); render(); return; }   // объект пересоздан pull-ом во время диалога → targetBatch тоже устарел, не мутируем
    const nextBatch = roundQty(Number(targetBatch.qty||0) + sign*n);
    if(nextBatch<0){ toast("Не хватает в этой партии"); return; }
    targetBatch.qty = nextBatch;
    // партию с qty=0 убираем (но только при расходе)
    if(sign<0 && nextBatch===0) it.batches = it.batches.filter(b=>b.id!==targetBatch.id);
    finalizeBatchMutation(it);

    state.journals[kind] = state.journals[kind]||[];
    const noteParts = [];
    if(targetBatch.location) noteParts.push(`📍 ${targetBatch.location}`);
    if(targetBatch.expiry)   noteParts.push(`⏰ ${fmtDate(targetBatch.expiry)}`);
    state.journals[kind].unshift({
      id:uid(), ts:new Date().toISOString(), productId:it.id, productName:it.name,
      qty:n, unit:it.unit||"", stockType: journalStockType(it),
      batchId: targetBatch.id, batchLocation: targetBatch.location||"", batchExpiry: targetBatch.expiry||"",
      note: opNote + (noteParts.length?` ${noteParts.join(" · ")}`:"")
    });
    const tag = opTag(kind);
    logOp(tag, `${it.name} ${sign>0?"+":"-"}${fmtQty(n)} ${it.unit||""}${noteParts.length?` [${noteParts.join(" · ")}]`:""}`);
    saveState(); render(); return;
  }

  // === LEGACY ВЕТКА (без партий) ===
  const val = await promptSheet(`${it.name}\n${label} (сейчас ${fmtQty(it.qty)} ${it.unit||""})`, "1", {numeric:true,title});
  if(val===null) return;
  const n = roundQty(parseNum(val));
  if(!Number.isFinite(n) || n<=0){ toast("Не число"); return; }
  if(state.stock.find(s=>s.id===id)!==it){ toast("Данные обновились — повторите операцию"); render(); return; }   // объект пересоздан pull-ом во время диалога → не теряем правку
  const next = roundQty(Number(it.qty||0) + sign*n);
  if(next<0){ toast("Не хватает на складе"); return; }
  it.qty = next; it.updatedAt = new Date().toISOString();
  state.journals[kind] = state.journals[kind]||[];
  state.journals[kind].unshift({
    id:uid(), ts:new Date().toISOString(), productId:it.id, productName:it.name,
    qty:n, unit:it.unit||"", stockType: journalStockType(it), note:opNote
  });
  const tag = opTag(kind);
  logOp(tag, `${it.name} ${sign>0?"+":"-"}${fmtQty(n)} ${it.unit||""}`);
  saveState(); render();
}

function saveStock(id, type){
  if(!ensureCanEdit()) return;
  const body = document.getElementById("sheetBody");
  const name = body.querySelector("#sn").value.trim();
  if(!name){ toast("Название обязательно"); return; }
  const qty = Math.max(0, roundQty(parseNum(body.querySelector("#sq").value)));   // ручной ввод: отрицательное/мусор → 0 (нет смысла в минусовом остатке)
  const unit = body.querySelector("#su").value;
  const _smRaw = body.querySelector("#sm").value, _smN = parseNum(_smRaw);
  const minStock = (_smRaw===""||!Number.isFinite(_smN)) ? "" : _smN;   // мусор/NaN → "" (иначе сравнение «низкий запас» молча отключалось)
  const expiry = body.querySelector("#se")?.value || "";
  const note = body.querySelector("#sno").value.trim();
  const category = body.querySelector(".chip.active[data-cat]")?.dataset.cat || "";
  const location = body.querySelector(".chip.active[data-loc]")?.dataset.loc || "";
  let propType=type, propOld=null;
  if(id){
    const it = state.stock.find(s=>s.id===id);
    if(!it){ toast("Позиция изменилась на другом устройстве"); closeSheet(); render(); return; }   // удалена/синкнута, пока форма была открыта → не падаем на Object.assign(undefined)
    const oldName = it.name;
    propType = it.type;
    if(hasBatches(it)){
      // в режиме партий qty/expiry/location — производные, перезаписывать вручную нельзя
      Object.assign(it,{name,unit,minStock,category,note,updatedAt:new Date().toISOString()});
      syncItemFromBatches(it);
    } else {
      Object.assign(it,{name,qty:roundQty(qty),unit,minStock,expiry,location,category,note,updatedAt:new Date().toISOString()});
    }
    logOp("STOCK_EDIT", name);
    if(oldName && oldName!==name) propOld = oldName;   // переименование — распространим
  } else {
    state.stock.push({id:uid(),type,name,qty:roundQty(qty),unit,minStock,expiry,location,category,note,createdAt:new Date().toISOString()});
    logOp("STOCK_ADD", `${name} +${qty} ${unit}`);
  }
  // общий каталог: новое имя / переименование → в остальные базы (qty 0)
  try{ propagateName(propType, name, unit, propOld); }catch(e){ console.warn("propagateName", e); }
  saveState(); closeSheet(); render();
}

function saveBatch(id){
  if(!ensureCanEdit()) return;
  const body = document.getElementById("sheetBody");
  const it = state.stock.find(s=>s.id===id); if(!it){ closeSheet(); return; }
  const qty = roundQty(parseNum(body.querySelector("#bq").value));
  const expiry = body.querySelector("#be").value || "";
  const location = body.querySelector(".chip.active[data-loc]")?.dataset.loc || "";
  const note = body.querySelector("#bnote")?.value.trim() || "";
  if(!(qty>0)){ toast("Количество должно быть > 0"); return; }
  it.batches = it.batches || [];
  // если у карточки был legacy qty без партий — конвертируем в первую партию
  if(it.batches.length===0 && roundQty(it.qty||0) > 0){
    it.batches.push({
      id: uid(), qty: roundQty(it.qty||0),
      expiry: it.expiry||"", location: it.location||"",
      note: "Перенос исходного остатка", createdAt: it.createdAt||new Date().toISOString()
    });
  }
  const newB = { id:uid(), qty, expiry, location, note, createdAt:new Date().toISOString() };
  it.batches.push(newB);
  syncItemFromBatches(it);
  state.journals = state.journals || emptyJournals();
  state.journals.receipt = state.journals.receipt || [];
  state.journals.receipt.unshift({
    id: uid(), ts: new Date().toISOString(), productId: it.id, productName: it.name,
    qty, unit: it.unit||"", stockType: journalStockType(it),
    batchId: newB.id, batchLocation: location, batchExpiry: expiry,
    note: `Новая партия${expiry?` (срок ${fmtDate(expiry)})`:""}${location?` в «${location}»`:""}`
  });
  logOp("BATCH_ADD", `${it.name} +${fmtQty(qty)} ${it.unit||""}${location?` в «${location}»`:""}${expiry?` до ${fmtDate(expiry)}`:""}`);
  saveState(); closeSheet(); render();
  toast("Партия добавлена");
}
