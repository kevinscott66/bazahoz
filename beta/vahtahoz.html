<style>
  /* ВНИМАНИЕ при обновлении набора Tailwind выше: он собран не сборщиком, а вручную, и в нём уже
     не хватало шести классов, которые разметка использует. Классы в HTML при этом ничего не
     подсвечивают — просто молча не работают. Так «Готово» в листах фильтров осталась без .mt-4 и
     прилипла вплотную к последнему чипу (жалоба «кнопка из фильтра наезжает на Готово»), а список
     баз в выдаче доступа — без рамки, скругления и ограничения высоты (.border, .rounded-lg,
     .max-h-56, .space-y-0\.5). Добавлены к своим соседям в @layer utilities. Проверка на такие
     дыры: собрать все class="…" из файла и сверить с правилами в <style> — вручную, глазами это
     не ловится. */
  html,body{ -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
  /* привязываем схему нативных контролов (input[type=date]/checkbox/number, скроллбары) к теме приложения,
     а не к системной — иначе при «тёмный телефон + светлая тема» дата/иконка календаря светлые на белом */
  :root{ color-scheme: dark; }
  .light{ color-scheme: light; }
  /* Фирменный акцент — тил-петроль (инженерно-спокойный, не дефолтный синий). Единый бренд с «Почта Разведчик». */
  :root{ --accent:#2DAEB8; --accent-press:#46C0C9; --accent-weak:rgba(45,174,184,.16); --on-accent:#06282C; --border-strong:rgba(255,255,255,.28); }
  .light{ --accent:#0E7C86; --accent-press:#0A6068; --accent-weak:#E1F0F1; --on-accent:#ffffff; --border-strong:#c9c9c4; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  .safe-top{ padding-top:env(safe-area-inset-top); }
  /* Резерв под «домашнюю» полоску iPhone. Полная безопасная зона там 34 точки, и вся она уходила в
     пустоту под подписями. Оставляем 12 — полоска жеста в них укладывается, а провал под кнопками
     почти исчезает. Где безопасной зоны нет (Android, десктоп) выражение даёт 0, как и было.
     Это про внешний вид панели; за то, что панель вообще стоит внизу экрана, отвечает min-height
     ниже. */
  :root{ --nav-safe: max(env(safe-area-inset-bottom) - 22px, 0px); }
  .safe-bot{ padding-bottom:calc(88px + var(--nav-safe)); }
  /* Динамический вьюпорт iOS. 100vh (класс .min-h-screen на <body>) — это БОЛЬШОЙ вьюпорт, как если бы
     панель браузера была скрыта; когда она видна, 100vh НЕ уменьшается. Из-за этого даже короткий экран
     оказывался на ~100px выше видимой области → появлялась лишняя прокрутка → Safari начинал прятать/
     показывать свою панель и перепозиционировал fixed-элементы с задержкой: нижняя навигация на миг
     вставала по низу «старого» вьюпорта, то есть ПОСЕРЕДИНЕ экрана (жалоба владельца), потом вставала
     на место. 100svh — МАЛЕНЬКИЙ вьюпорт (панель видна): он не меняется при прокрутке, лишней прокрутки
     не создаёт и сам не вызывает пересчёт. Первая строка — запас для движков без svh (они её и оставят).
     Правило вне @layer, поэтому перебивает .min-h-screen из tailwind-слоя. */
  body{ min-height:100vh; min-height:100svh; }
  /* А вот и настоящая причина «кнопки уползают вверх, когда на странице нет данных». В установленном
     приложении на iPhone маленький вьюпорт (svh) равен 873 при экране 932 — ровно на высоту
     статус-бара меньше. Пока документ помещается в эти 873 (пустые «Задачи»), iOS прижимает
     position:fixed к 873, и панель встаёт на 59 точек выше низа экрана. Стоит документу стать хоть
     чуть длиннее (любой «Склад» с наименованиями) — привязка переезжает на полный экран, и панель
     садится вплотную к низу. Со стороны страницы обе картинки НЕразличимы: getBoundingClientRect
     в обоих случаях даёт низ 873, поэтому замеры и врали, а правки по ним ничего не меняли.
     Проверено метками на экране: полосы разъезжались ровно на 59 точек, и min-height:100lvh их
     совмещал. Лечим только установленное приложение: в обычном Safari lvh — это вьюпорт со
     спрятанной панелью браузера, и такое min-height вернуло бы ту самую лишнюю прокрутку, из-за
     которой выше и стоит svh. */
  @media (display-mode: standalone){ body{ min-height:100lvh; } }
  /* Нижняя панель — на отдельный слой композитора. Тогда при инерционной прокрутке и при показе/скрытии
     панели браузера Safari двигает её вместе с вьюпортом на GPU, а не пересчитывает позицию рывками
     (усугублялось backdrop-blur: размытие на fixed-элементе в WebKit перерисовывается с задержкой). */
  #navbar{ transform:translateZ(0); will-change:transform; }
  .btn{ min-height:52px; border-radius:14px; font-weight:600; font-size:17px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 18px; transition:transform .06s ease, background .15s; user-select:none; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:var(--on-accent); }
  .btn-primary:active{ background:var(--accent-press); }
  .btn-ghost{ background:rgba(255,255,255,.06); color:inherit; }
  .btn-danger{ background:#dc2626; color:#fff; }
  .btn-success{ background:#16a34a; color:#fff; }
  .btn-warn{ background:#d97706; color:#fff; }
  .input{ width:100%; min-height:52px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:inherit; font-size:17px; outline:none; }
  .input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak); }
  .card{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
  .light .card{ background:#fff; border-color:#e5e7eb; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .light .btn-ghost{ background:#f3f4f6; }
  .light .input{ background:#fff; border-color:#d1d5db; color:#111827; }
  .light .input::placeholder{ color:#6b7280; opacity:1; }   /* дефолтный плейсхолдер ~3.5:1 на белом — поднимаем до AA */
  /* min-height 44px: чипы — основные тап-цели (фильтры, категория, место), на объекте нажимают в перчатках */
  .chip{ padding:8px 14px; min-height:44px; display:inline-flex; align-items:center; border-radius:999px; font-size:14px; font-weight:600; background:rgba(255,255,255,.06); white-space:nowrap; transition:transform .06s ease, background .15s; }
  .chip:active{ transform:scale(.96); }
  .chip.active{ background:var(--accent); color:var(--on-accent); }
  .light .chip{ background:#f3f4f6; color:#111827; }
  .chip-add{ background:transparent; border:1px dashed var(--border-strong); color:var(--accent); font-weight:600; }
  .chip-add.active{ background:transparent; color:var(--accent); }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; font-size:11px; color:#9ca3af; }
  .nav-icon{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  /* Значки действий — та же линейная манера, что у пяти кнопок снизу (.nav-icon). Эмодзи ✏️/🗑
     рисовал шрифт системы: на Android они цветные и разного веса, рядом со строгой навигацией
     смотрелись наклейками. vertical-align — чтобы значок сидел на строке рядом с текстом. */
  .ico{ display:inline-block; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; vertical-align:middle; }
  .nav-btn.active{ color:var(--accent); position:relative; }
  .light .nav-btn{ color:#6b7280; }
  .badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; flex-shrink:0; }   /* flex-shrink:0 — как флекс-элемент бейдж сжимался и вместе с overflow:hidden резал надпись. Вертикаль НЕ фиксируем здесь (align-self сломал бы контейнеры с items-center) — её лечит items-start на самом контейнере. */
  .badge-red{ background:#dc2626; color:#fff; }
  .badge-yellow{ background:#92400e; color:#fff; }   /* было #b45309 (~4.0:1) → #92400e (~5.9:1) для AA на мелком тексте */
  /* Зелёный «остаток в норме» — главный индикатор на каждой карточке склада. #16a34a на белом тексте
     даёт 3,30:1 при норме AA 4,5:1 для мелкого (11px/700) шрифта: светлую тему уже правили, тёмную
     пропустили, хотя цвет фона бейджа от темы не зависит. #15803d даёт 5,02:1 — одно правило на обе. */
  .badge-green{ background:#15803d; color:#fff; }
  .badge-gray{ background:#374151; color:#e5e7eb; }
  .light .badge-gray{ background:#e5e7eb; color:#374151; }
  /* Сгруппированные секции экрана «Ещё» (iOS inset-list): секция = UPPERCASE-заголовок + строки на приподнятой поверхности */
  .set-group{ margin-bottom:22px; }
  .set-head{ font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#8a8a82; padding:0 6px 8px; }
  .set-list{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:16px; overflow:hidden; }
  .light .set-list{ background:#fff; border-color:#e5e7eb; box-shadow:0 1px 2px rgba(20,20,18,.05); }
  .set-row{ display:flex; align-items:center; gap:10px; width:100%; min-height:54px; padding:13px 16px; background:transparent; color:inherit; text-align:left; border:none; border-top:1px solid rgba(255,255,255,.07); font-size:16px; font-weight:500; }
  .light .set-row{ border-top-color:#ececea; }
  .set-row:first-child{ border-top:none; }
  .set-row:active{ background:rgba(255,255,255,.06); }
  .light .set-row:active{ background:#f4f4f2; }
  .set-row .sr-t{ flex:1; min-width:0; }
  .set-row .sr-sub{ font-size:12px; font-weight:400; color:#8a8a82; margin-top:2px; white-space:normal; }
  .set-row .sr-v{ color:#8a8a82; font-size:14px; white-space:nowrap; }
  .set-row .sr-ch{ color:#8a8a82; opacity:.5; font-size:20px; line-height:1; flex:none; }
  /* на белом фоне .set-list #8a8a82 даёт ~3.5:1 — ниже AA для мелкого текста. Поднимаем до #57534e (~7:1) */
  .light .set-head, .light .set-row .sr-sub, .light .set-row .sr-v{ color:#57534e; }
  .set-row.danger{ color:#f87171; }
  .light .set-row.danger{ color:#c0362c; }
  .set-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .prof-hd{ display:flex; align-items:center; gap:12px; padding:4px 6px 18px; }
  .prof-av{ width:44px; height:44px; border-radius:12px; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:19px; flex:none; }
  @media (max-width:340px){ .set-row{ gap:6px; padding:12px 13px; font-size:15px; } .set-row .sr-v{ font-size:13px; } }
  /* Плашки «без места» / «без срока» на карточках склада: 11px, вес 700 — самый мелкий жирный
     текст в приложении, для него норма AA = 4,5:1. Тёмная тема гасила бейдж классом .opacity-50
     целиком (текст #e5e7eb поверх #374151 через alpha .5 → 4,09:1 по замеру в браузере), светлая
     уже держала opacity:1, но серым #9ca3af по #e5e7eb — 2,05:1. Обе темы: opacity:1 и приглушённый
     цвет, который норму проходит (4,94:1 в тёмной и 4,82:1 в светлой); «блёклость» плашки остаётся
     читаемой разницей с обычным бейджем (8,33:1 и 6,16:1), а не потерей текста. */
  .badge-gray.opacity-50{ opacity:1; color:#adb4bf; }
  .light .badge-gray.opacity-50{ opacity:1; color:#5c6472; }
  /* ===== Уведомления =====
     Счётчик на колокольчике сделан по образцу счётчика на кнопке фильтра (тот же размер и та же
     посадка в угол), чтобы две кнопки в шапке не выглядели из разных приложений. Цифра красная,
     а не акцентная: акцентом в шапке уже помечено «фильтр включён», и одинаковый цвет читался бы
     как одно и то же состояние. */
  .bell-badge{ position:absolute; top:-3px; right:-3px; min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    background:#dc2626; color:#fff; font-size:11px; font-weight:700; line-height:18px; text-align:center;
    box-shadow:0 0 0 2px #0b1220; }
  .light .bell-badge{ box-shadow:0 0 0 2px #f9fafb; }
  /* Всплывашка. pointer-events возвращаем именно карточке: контейнер сквозной, иначе невидимая
     полоса поверх шапки перехватывала бы нажатия по чипу базы и по фильтру. */
  .popup{ pointer-events:auto; width:100%; max-width:520px; display:flex; align-items:flex-start; gap:10px;
    padding:12px 12px 12px 14px; border-radius:16px; background:#1f2937; color:#f3f4f6;
    box-shadow:0 10px 30px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.10);
    animation:popIn .18s ease-out; text-align:left; }
  .light .popup{ background:#fff; color:#111827; border-color:#e5e7eb; box-shadow:0 10px 30px rgba(20,20,18,.18); }
  .popup .pu-t{ font-weight:700; font-size:14px; line-height:1.3; }
  .popup .pu-b{ font-size:13px; line-height:1.4; opacity:.85; margin-top:2px; overflow-wrap:break-word; }
  .popup .pu-x{ flex:none; opacity:.55; padding:2px 4px; margin:-2px -4px 0 0; background:none; border:none; color:inherit; font-size:18px; line-height:1; }
  @keyframes popIn{ from{ opacity:0; transform:translateY(-10px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion:reduce){ .popup{ animation:none; } }
  /* Непрочитанное помечаем полосой слева, а не заливкой: заливка на списке из десяти строк
     превращается в сплошное пятно, и «новое» перестаёт выделяться. */
  .notif.unread{ border-left:3px solid var(--accent); }
  .sheet{ position:fixed; inset:0; z-index:100; display:none; }   /* модалка — поверх всего, включая логин-гейт (z-90): чтобы юр-страницы открывались и до входа */
  .sheet.open{ display:flex; }
  .sheet-bg{ position:absolute; inset:0; background:rgba(0,0,0,.6); }
  .sheet-body{ position:relative; margin-top:auto; width:100%; max-width:560px; margin-left:auto; margin-right:auto; background:#0b1220; border-radius:24px 24px 0 0; padding:20px; max-height:92vh; max-height:92svh; overflow-y:auto; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }   /* 92svh — МАЛЕНЬКИЙ вьюпорт (панель браузера видна). У 92vh (БОЛЬШОЙ вьюпорт) низ модалки на iOS уезжал за экран — та же болезнь, что уже вылечена у body выше. Первая строка — запас для движков без svh. */
  /* ЛИСТ НЕ ДОЛЖЕН ЕЗДИТЬ ВБОК. У .sheet-body задан overflow-y:auto, а по правилам CSS вторая ось
     тогда не может остаться visible — браузер делает её auto. Значит любое содержимое, вылезшее
     хоть на пиксель (ряд «Удалить · Отмена · Сохранить» на узком экране вылезал на 5), превращало
     лист в горизонтально прокручиваемый: под пальцем он уезжал влево-вправо, а вместе с вертикальной
     прокруткой — «хоть в левый нижний угол» (жалоба владельца про «Редактировать продукт»).
     Здесь запрещаем ход вбок как класс явления; конкретное переполнение лечит .sheet-actions ниже. */
  .sheet-body{ overflow-x:hidden; overscroll-behavior:contain; }
  /* Ряд кнопок в конце листа. У .btn padding 0 18px, а flex-элемент не сжимается ниже содержимого:
     три кнопки («Удалить · Отмена · Сохранить») на 360 px не помещались. Уменьшаем боковые поля,
     а на совсем узких экранах ряд переносится — это лучше, чем обрезанная надпись на кнопке
     (min-width:0 давал ровно её). Переполнения листа не будет ни при каком размере экрана. */
  .sheet-actions{ flex-wrap:wrap; }
  .sheet-actions > .btn{ padding:0 12px; }
  .light .sheet-body{ background:#fff; }
  /* «×» листа: та же роль, что и кнопка закрытия в конце длинного списка, но без прокрутки до низа.
     44×44 — минимальная тап-цель (iOS HIG / Material). Лежит в потоке абсолютом, поэтому заголовку
     нужен padding-right, иначе длинный заголовок уедет под крестик. */
  .sheet-x{ position:absolute; top:6px; right:6px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; font-size:26px; line-height:1; border-radius:14px; background:transparent; color:inherit; opacity:.6; cursor:pointer; z-index:2; }
  .sheet-x:hover{ opacity:1; background:rgba(255,255,255,.08); }
  .light .sheet-x:hover{ background:rgba(0,0,0,.06); }
  /* ШАПКА ЛИСТА ФИЛЬТРОВ. Обычный .sheet-x — position:absolute внутри ПРОКРУЧИВАЕМОГО .sheet-body,
     то есть он уезжает вверх вместе с содержимым: на базе с десятком категорий крестика на экране
     уже нет, и закрыть лист можно только тапом по фону (неочевидно) или прокруткой до «Готово».
     Здесь шапка липкая. top = -20px гасит верхний padding .sheet-body, иначе между шапкой и краем
     листа при прокрутке видна полоска содержимого. Отрицательные поля — чтобы фон шапки доходил
     до краёв листа, а не оставлял просветы по 20px. */
  .sheet-head{ position:sticky; top:-20px; z-index:3; margin:-20px -20px 12px; padding:16px 16px 12px; background:#0b1220; border-radius:24px 24px 0 0; display:flex; align-items:center; gap:8px; }
  .light .sheet-head{ background:#fff; }
  .sheet-head .sh-t{ flex:1; min-width:0; font-weight:700; font-size:19px; }
  .sheet-head .sh-x{ width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; font-size:24px; line-height:1; border-radius:14px; opacity:.6; cursor:pointer; }
  .sheet-head .sh-x:hover{ opacity:1; background:rgba(255,255,255,.08); }
  .light .sheet-head .sh-x:hover{ background:rgba(0,0,0,.06); }
  /* Счётчик на кнопке фильтра: текста на ней больше нет (одна воронка), поэтому число — единственный
     способ показать, сколько условий включено, не открывая лист. */
  .chip-badge{ position:absolute; top:-4px; right:-4px; min-width:18px; height:18px; padding:0 4px; border-radius:9px; font-size:11px; font-weight:700; line-height:18px; text-align:center; background:#6b7280; color:#fff; }
  .chip-badge.red{ background:#dc2626; }
  .tap{ cursor:pointer; }
  .list-box{ border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:4px; }
  .scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .scroll-x::-webkit-scrollbar{ display:none; }
  .divider{ height:1px; background:rgba(255,255,255,.08); }
  .light .divider{ background:#e5e7eb; }
  @keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{ animation:pop .15s ease-out; }
  /* Утилиты, которые используются в динамической разметке, но не попали в JIT-сборку Tailwind выше */
  .flex-col{ flex-direction:column; }
  .gap-1{ gap:.25rem; }
  .pl-2{ padding-left:.5rem; }
  .pl-10{ padding-left:2.5rem; }
  .px-2{ padding-inline:.5rem; }
  .py-0{ padding-block:0; }
  .mt-0\.5{ margin-top:.125rem; }
  .w-5{ width:1.25rem; }
  .h-5{ height:1.25rem; }
  .leading-4{ line-height:1rem; }
  .border-l-2{ border-left-style:solid; border-left-width:2px; }
  .border-gray-700{ border-color:#374151; }
  .grayscale{ filter:grayscale(1); }
  .uppercase{ text-transform:uppercase; }
  .tracking-wide{ letter-spacing:.025em; }
  .select-none{ user-select:none; -webkit-user-select:none; }
  .break-words{ overflow-wrap:break-word; word-break:break-word; }
  /* видимый фокус только при навигации с клавиатуры — тач/мышь не затрагивает */
  .btn:focus-visible, .chip:focus-visible, .nav-btn:focus-visible, .input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  /* косметика: кнопки в 3-колоночной сетке (типы склада) — компактнее, чтобы подписи не обрезались на узком iPhone */
  .grid-cols-3 > .btn{ padding:0 6px; font-size:15px; gap:4px; min-width:0; }
  /* Приветствие с датой — украшение, и оно уступает рабочим органам шапки: чипу базы и кнопке
     фильтра. МЕДИА-ЗАПРОСА ЗДЕСЬ БОЛЬШЕ НЕТ, и вот почему. Порог по ширине экрана врал в обе
     стороны: место в шапке съедает не ширина, а КНОПКА ФИЛЬТРА (она есть только на «Складе» и
     «Задачах») и длина имени базы. Порог 359px оставлял «Доб…» на ходовых 390px; поднятый до 429px
     он убрал приветствие И ДАТУ с 390/412 совсем — там, где до кнопки фильтра они помещались
     целиком, — а на 430 вернул вместе с обрубком (156px ужимались до 104). Обрубок просто переехал.
     Теперь решает ЗАМЕР: fitHeaderGreeting() показывает ровно то, что влезает целиком (см. рядом
     с renderHeader). Прежнее обоснование «дата и так на дашборде» было вдобавок неверным —
     текущей даты на дашборде нет, там только сроки задач. */
  @media (max-width:360px){ .grid-cols-3 > .btn{ font-size:13px; padding:0 4px; } }
  /* iPhone SE / очень узкие: подписи в 3-колоночной сетке (типы склада, выбор темы) переносим, а не обрезаем */
  /* min-height 44px, а не 40: height:auto тут снимает базовые 52px от .btn, и «＋ Продукт/Хозтовар/
     Инструмент» на узком экране проваливались под минимальный тап-таргет (WCAG 44×44), которого
     держится весь остальной интерфейс (.chip, summary, стрелки порядка). Перенос строк сохраняем. */
  @media (max-width:340px){ .grid-cols-3 > .btn{ font-size:11px; padding:2px; line-height:1.15; white-space:normal; height:auto; min-height:44px; } }
  /* активная вкладка нижней навигации — подчёркивание для ясности (position:relative задан выше на .nav-btn.active) */
  .nav-btn.active::after{ content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:22px; height:3px; border-radius:0 0 3px 3px; background:currentColor; }
  /* косметика: светлая тема — видимые границы/контраст; disabled-кнопки; тап-зона узких кнопок */
  .light #dateStr{ color:#6b7280; }
  .light #navbar{ border-top-color:#e5e7eb; }
  .light .list-box{ border-color:#e5e7eb; }
  .btn:disabled, .btn[disabled]{ opacity:.45; cursor:default; }
  .btn.px-2{ min-width:44px; }
  /* индикатор активной синхронизации — бегущая полоска снизу sync-бара */
  #syncBar.busy{ overflow:hidden; }
  #syncBar.busy::after{ content:""; position:absolute; bottom:0; left:-35%; height:2px; width:35%; background:rgba(255,255,255,.85); border-radius:2px; animation:syncslide 1.1s ease-in-out infinite; }
  @keyframes syncslide{ to{ left:100%; } }
  /* текст ошибок: читаемый красный на тёмном шите и на белом (светлая тема) */
  .err-text{ color:#f87171; }
  .light .err-text{ color:#dc2626; }
  /* утилиты, не попавшие в JIT-сборку Tailwind (используются в динамической разметке) */
  .border-gray-800{ border-color:var(--color-gray-800,#1f2937); }
  .opacity-40{ opacity:.4; }
  .cursor-pointer{ cursor:pointer; }
  .py-2{ padding-top:.5rem; padding-bottom:.5rem; }
  .pt-3{ padding-top:.75rem; }
  .pt-1{ padding-top:.25rem; }

<script>

/* Полифилл structuredClone для старых iOS Safari (<15.4) — иначе loadState()
   падает с ReferenceError на старте и приложение не грузится (белый экран).
   Состояние полностью JSON-сериализуемо (даты — строки), поэтому JSON-клон корректен. */
if(typeof structuredClone!=="function"){

   не per-path. Без префикса бета и стабильная делили бы ключ сессии (vahtahoz_sess/vahtahoz_auth) и данные →
   ротация refresh-токена в одной копии роняла сессию другой («refresh_token_not_found» → «вход устарел»).
   На стабильной NS="" (ключи не меняются, данные целы); на бете NS="beta_" (полностью отдельный инстанс). */
const NS = (location.pathname.indexOf("/beta/") !== -1) ? "beta_" : "";

// (merged = local + cloud − снимок, CRDT-счётчик). Только для позиций БЕЗ партий (у партийных qty = сумма партий,

   молча меняли поведение: 3-way merge выключался, а авто-сверка, наоборот, впервые включалась
   на данных, которые с журналом никогда не сверялись.

   из orphan-записей + relink) на старте и после каждого pull. На стабильной этого кода
   НИКОГДА не было: накопленное за всю историю расхождение вылилось бы в правку тысяч строк

   «Сверки» владельцем по каждой базе с разбором «было → стало» и при живом stock_history
   (иначе откатывать нечем). Ручная «Сверка» из меню работает в обоих каналах — она под явным
   нажатием и показывает отчёт.

   STOCK_MERGE — 3-way слияние количеств. На стабильной остаётся ВЫКЛЮЧЕННЫМ (как и сейчас):
   это не регрессия, но и аудит бета-пути на прод не переносится. Включать отдельным релизом. */
const AUTO_RECONCILE = (NS === "beta_");

const APP_BUILD = "v262";
const APP_IS_BETA = (NS === "beta_");
const APP_BUILD_LABEL = APP_BUILD + (APP_IS_BETA ? " · БЕТА" : "");

const STORE_KEY = NS+"vahtahoz:v1";
const JOURNAL_KEYS = ["receipt","issue","writeoff","order"];

const JOURNAL_LOCAL_CAP = 5000;

/* Переполнение хранилища у браузеров названо по-разному: WebKit/Blink бросают

   Проверка только по WebKit-именам уводила Firefox в ветку «прочая ошибка»:
   ни усечения, ни тоста, ни модала — полностью молчаливая потеря записи. */
function isQuotaErr(e){
  if(!e) return false;
  return e.name==="QuotaExceededError" || e.name==="NS_ERROR_DOM_QUOTA_REACHED"
      || e.code===22 || e.code===1014;
}
let _quotaBlocked=false;   // показали ли блокирующее предупреждение о переполнении памяти (чтобы не спамить каждым saveState)
function _quotaBlock(msg){
  if(_quotaBlocked) return; _quotaBlocked=true;
  const short = msg || "⛔ Память телефона переполнена — последние записи НЕ сохранены!";
  const long  = msg
    ? (msg + "\n\nСделайте резервную копию (экспорт), пока данные ещё в памяти приложения.")
    : "Память телефона переполнена — последние операции могут НЕ сохраниться при перезагрузке.\n\nСделайте резервную копию (экспорт), затем удалите ненужные базы или очистите старые журналы.";
  try{ toast(short); }catch(_){}
  // блокирующий модал с предложением экспорта — через setTimeout, чтобы не мешать текущему кадру render/сохранения
  setTimeout(async()=>{
    try{
      const go = await confirmSheet(long, { yes:"Экспорт данных", no:"Позже", title:"⛔ Данные не сохранены" });
      // localOnly: память переполнена, последняя операция могла не сохраниться — файл пишем СРАЗУ,
      // не откладывая на загрузку облачного журнала (до 120 с)
      if(go && typeof exportData==="function") exportData({localOnly:true});
    }catch(_){}
  }, 50);
}
/* Уже выгруженные в облако id журнала: их усечение безвозвратной потерей не является

   на раннем старте `profiles` может быть ещё в TDZ, а saveState вызываться уже может.
   КЭШ. Снимок подписей журнала — это объект на все записи базы (на старой базе — десятки тысяч
   ключей, около мегабайта JSON). Теперь его читает КАЖДОЕ сохранение состояния, поэтому парсить
   его каждый раз нельзя. Меняется он ровно в двух местах — saveSyncSig(cid,"jr") и
   clearBaseSyncKeys, — оба сбрасывают кэш. var, а не let: сохранение может случиться раньше
   объявления по ходу верхнего уровня, и TDZ уронил бы старт. */
var _jrSigCache = null;   // {cid, map}
function _uploadedJrIds(){
  try{
    const cid = (typeof activeCloudId==="function") ? activeCloudId() : null;
    if(!cid) return null;
    if(_jrSigCache && _jrSigCache.cid===cid) return _jrSigCache.map;
    const sig = loadSyncSig(cid, "jr");
    const map = (sig && Object.keys(sig).length) ? sig : null;
    _jrSigCache = { cid, map };
    return map;
  }catch(_){ return null; }
}
/* Усечение журнала до `limit`, но НЕ за счёт записей, которых в облаке нет.
   Порядок в журнале — новые в начале (unshift), поэтому «свежие» = меньшие индексы.
   «УЖЕ ВЫГРУЖЕНО» — ЭТО СОВПАДЕНИЕ СОДЕРЖИМОГО, А НЕ ЗНАКОМЫЙ id. Снимок подписей хранит
   id→подпись ровно для этого. Правка записи (количество, дата, примечание, привязка к товару)
   id не меняет, поэтому проверка «id есть в снимке» считала отредактированную запись выгруженной
   и выбрасывала её с диска, хотя в облаке лежала ЕЁ СТАРАЯ ВЕРСИЯ. Работа без связи (норма на
   вахте) плюс перезапуск до первой синхронизации — и правка исчезала молча, а поднятый остаток
   склада оставался: журнал и склад расходились навсегда, поймать это было нечем (для облачной
   базы журнал всегда «неполный», сверка вниз запрещена). Сравниваем подпись: разошлась — значит
   эта версия записи существует только здесь, и трогать её нельзя.
   Если одних таких больше лимита — возвращаем их все: пусть запись упадёт и пользователь получит
   честный отказ с предложением экспорта, а не тихую потерю движений склада, которых нет больше
   нигде (остатки уже подняты applyStockDelta).
   ЦЕНА. Подпись считается только когда журнал ДЛИННЕЕ лимита (иначе выход первой строкой) и только
   у записей, чей id есть в снимке. Это в разы дешевле полной сериализации состояния, ради ухода от
   которой хвост на диске и вводили (замер: 8000 записей — 26 мс против 4 мс без проверки). */
function _trimJournalKeepPending(arr, limit, uploaded, kind){
  if(!Array.isArray(arr) || arr.length<=limit) return arr;
  if(!uploaded) return arr.slice(0, limit);
  const keep = new Set();
  for(let i=0;i<arr.length;i++){
    const r=arr[i]; if(!r) continue;
    const sig = r.id ? uploaded[r.id] : undefined;
    if(sig===undefined){ keep.add(i); continue; }              // в облаке такой записи нет вовсе
    if(kind && sig!==_sigOf({kind, data:r})) keep.add(i);      // выгружалась, но с тех пор изменена
  }
  for(let i=0;i<arr.length && keep.size<limit;i++){ if(arr[i]) keep.add(i); }
  return arr.filter((_,i)=>keep.has(i));
}
/* Аварийное сохранение при переполнении. КЛЮЧЕВОЕ: `state` не мутируется до успешной
   записи. Иначе при провале всех уровней на диске оставался ПОЛНЫЙ журнал (от прошлого
   успешного сохранения), а в памяти — усечённый, и аварийный экспорт, который тут же
   предлагает _quotaBlock(), отдавал бы неполный файл. */
function _saveStateTrimmed(failedBytes){
  if(!(failedBytes > 0)) failedBytes = Infinity;   // длину отказавшего снимка не узнали — пробуем все ступени
  const uploaded = _uploadedJrIds();
  const cut = (logLimit, jrLimit) => {
    const j = { ...(state.journals || {}) };
    let dropped = false;
    for(const k of JOURNAL_KEYS){
      const wasLen = (state.journals?.[k] || []).length;
      j[k] = _trimJournalKeepPending(state.journals?.[k], jrLimit, uploaded, k);
      if((j[k] || []).length < wasLen) dropped = true;   // записи реально выброшены — бэкап больше не полный
    }
    const lg = (Array.isArray(state.log) && state.log.length>logLimit) ? state.log.slice(0,logLimit) : state.log;
    return { ...state, log: lg, journals: j, journalsTrunc: !!(state.journalsTrunc || dropped) };
  };
  const commit = (snap) => { state.log = snap.log; state.journals = snap.journals; state.journalsTrunc = snap.journalsTrunc; _quotaBlocked=false; };
  /* СТУПЕНЬ ОБЯЗАНА БЫТЬ СТРОГО МЕНЬШЕ ТОГО, ЧТО ТОЛЬКО ЧТО НЕ ВЛЕЗЛО. Прежняя лестница этому
     не отвечала и почти ничего не давала. Обычное сохранение (_stateStorageJSON) у облачной базы
     уже пишет JOURNAL_STORE_SOFT_CAP = 500 записей на вид плюс всё невыгруженное, а первым
     аварийным уровнем стояло cut(200, 2000) — при журнале длиннее 500 на вид это ГАРАНТИРОВАННО
     больше отказавшего снимка, то есть заведомо провальная попытка ценой ещё одной полной
     сериализации. Второй уровень cut(50, 500) отличался от отказавшего снимка только урезкой
     state.log — десятки килобайт, которые ничего не решают, если места не хватило из-за склада.
     ЗАМЕР (синтетика: 3000 позиций склада, 3000 записей на вид, всё выгружено, лог 500):
       обычное сохранение, которое отказало . 986 994 Б
       старый уровень 1 (200, 2000) ........ 2 070 695 Б  (+110 % — провал гарантирован)
       старый уровень 2 (50, 500) ...........  948 345 Б  (−3,9 % — почти ничего)
       новая ступень 1 (200, 200) ...........  742 495 Б  (−24,8 %)
       новая ступень 2 (50, 50) .............  621 095 Б  (−37,1 %)
       новая ступень 3 (0, 0) ...............  581 370 Б  (−41,1 %; пол — сам склад, 580 181 Б)
     Ступень 3 не пустая даже при нуле: _trimJournalKeepPending всегда оставляет записи, которых
     в облаке нет вовсе или чья облачная версия устарела, — они существуют в одном экземпляре.
     failedBytes — длина снимка, который только что не поместился: ступень крупнее него мы даже
     не пытаемся записать, чтобы не тратить впустую полную сериализацию (замер в комментарии ниже:
     624 мс против 8-10 мс обычного сохранения). */
  const LADDER = [ {log:200, jr:200}, {log:50, jr:50}, {log:0, jr:0} ];
  const _jrCount = (j)=>{ let n=0; for(const k of JOURNAL_KEYS) n += (j?.[k] || []).length; return n; };
  const jrWas = _jrCount(state.journals), logWas = (state.log || []).length;
  let lastErr = null;
  for(const step of LADDER){
    const snap = cut(step.log, step.jr);
    let json; try{ json = JSON.stringify(snap); }catch(e){ lastErr = e; continue; }
    if(json.length >= failedBytes) continue;   // не меньше отказавшего — писать бессмысленно
    try{ localStorage.setItem(STORE_KEY, json); }catch(e){ lastErr = e; continue; }
    commit(snap);
    /* ЧЕЛОВЕК ДОЛЖЕН ПОНЯТЬ, ЧТО ИМЕННО У НЕГО ЗАБРАЛИ. Прежний текст говорил только про
       «старые записи журнала» — и молчал о том, что уровень 2 навсегда выбрасывал из state.log
       записи 51…500. state.log нигде не синхронизируется: это единственная копия списка
       действий, и уходила она молча. Записи журнала у ОБЛАЧНОЙ базы — другое дело: они лежат в
       общей базе и вернутся первой же загрузкой, об этом и говорим. У базы без облака (uploaded
       пуст) телефон — единственная копия, там потеря настоящая и разговор блокирующий. */
    const jrLost = jrWas - _jrCount(snap.journals);
    const logLost = logWas - (snap.log || []).length;
    const parts = [];
    if(jrLost) parts.push(uploaded
      ? `${jrLost} старых записей журнала убрано с телефона — они есть в общей базе и вернутся при синхронизации`
      : `${jrLost} старых записей журнала удалено НАВСЕГДА — эта база не связана с облаком, копии не осталось`);
    if(logLost) parts.push(`список действий (${logLost} записей) стёрт — он нигде не сохраняется`);
    const what = parts.length ? parts.join("; ") : "освобождено место";
    try{ toast(`Памяти телефона не хватило: ${what}`); }catch(_){}
    if(logLost || (jrLost && !uploaded)){
      // безвозвратная потеря — коротким тостом на 1,8 с тут не отделаться
      setTimeout(async()=>{
        try{
          const go = await confirmSheet(
            `Памяти телефона не хватило, чтобы сохранить базу целиком.\n\nЧтобы текущие остатки склада не потерялись, приложение освободило место:\n• ${parts.join("\n• ")}\n\nСделайте резервную копию и освободите память: удалите ненужные базы или лишние файлы на телефоне.`,
            { yes:"Сохранить копию", no:"Позже", title:"Часть данных удалена с телефона" });
          if(go && typeof exportData==="function") exportData({localOnly:true});
        }catch(_){}
      }, 50);
    }
    return;
  }
  // Ни одна ступень не легла на диск → последняя операция потеряется при перезагрузке. НЕ молчим —
  // блокирующее предупреждение + экспорт. state остался ПОЛНЫМ: экспорт отдаст всё.
  console.error("saveState escalated failure:", lastErr);
  _quotaBlock();
}
/* СКОЛЬКО ХВОСТА ЖУРНАЛА ДЕРЖИМ НА ДИСКЕ у ОБЛАЧНОЙ базы (на вид движения). В памяти журнал полный —

/* ЧТО ИМЕННО ЛОЖИТСЯ НА ДИСК.
   Снятие потолка журнала (было 500 записей на вид, стало 5000) сделали ради полноты резервной
   копии — и это правильно. Но полный журнал попал ещё и в КАЖДОЕ сохранение состояния, а оно
   случается на каждый плюс-минус на карточке: 5000 записей на вид — это 4 МБ строки и 283 мс на
   десктопе, то есть полторы-три секунды замершего экрана на вахтовом телефоне. Когда хранилище

   вторая полная копия в localStorage не даёт ничего: pull вернёт историю при первой связи. Поэтому
   на диск идёт хвост из JOURNAL_STORE_SOFT_CAP свежих записей на вид ПЛЮС ВСЁ, ЧЕГО В ОБЛАКЕ НЕТ, —
   и невыгруженные, и отредактированные после выгрузки (в облаке лежит их старая версия). Такие

   Локальная база без облака не урезается вовсе — там диск и есть единственная копия.
   ЧЕСТНОСТЬ. Урезанный снимок помечается journalsTrunc — он действительно неполон, и после
   перезагрузки приложение об этом знает (бэкап назовёт себя неполным, сверка «вниз» останется
   запрещённой). В ПАМЯТИ не меняется ничего: ни state.journals, ни state.journalsTrunc.

   что берёт базу из памяти» верно ровно до первой перезагрузки: после неё в память читается тот же
   урезанный снимок (замер: посев 3000 записей → после перезагрузки в памяти 500, «Резервная копия
   всех баз» содержит 500). Молчаливой потери тут нет — journalsTrunc переживает перезагрузку, файл
   называет себя неполным и тост об этом говорит, — но обещать полноту нельзя.
   ЧТО В ФАЙЛЕ ЕСТЬ ВСЕГДА: всё, чего нет в облаке (см. выше). Недостающее — это ровно облачный
   архив, и он возвращается сам при первой же синхронизации (cloudPull переписывает журнал целиком
   и снимает journalsTrunc). То есть данные не теряются нигде: файл + облако = вся история.
   СОВМЕСТИМОСТЬ. Ключ тот же (STORE_KEY), поля те же, новых нет. Старая версия, поднятая из кэша,
   читает такой снимок как свой и ведёт себя ровно как раньше. */
function _stateStorageJSON(){
  const uploaded = _uploadedJrIds();
  if(!uploaded) return JSON.stringify(state);        // единственная копия — пишем целиком
  const j = { ...(state.journals || {}) };
  let dropped = false;
  for(const k of JOURNAL_KEYS){
    const arr = state.journals?.[k] || [];
    const cut = _trimJournalKeepPending(arr, JOURNAL_STORE_SOFT_CAP, uploaded, k);
    if(cut.length < arr.length) dropped = true;
    j[k] = cut;
  }
  if(!dropped) return JSON.stringify(state);
  return JSON.stringify({ ...state, journals: j, journalsTrunc: true });
}
function saveState(){

  // что не влезло» — без него ступень крупнее отказавшей стоила бы ещё одной полной сериализации
  let _json = null;
  try { _json = _stateStorageJSON(); localStorage.setItem(STORE_KEY, _json); _quotaBlocked=false; }   // успех — снимаем флаг переполнения (память освободилась)
  catch(e){
    if(isQuotaErr(e)) _saveStateTrimmed(_json ? _json.length : 0);
    else {
      // Любой сбой setItem означает, что данных на диске нет (приватный режим, отключённое
      // хранилище, SecurityError). Молчать здесь нельзя — потеря так же реальна, как при квоте.
      console.error("saveState error:", e);
      _quotaBlock("⛔ Не удалось сохранить данные на устройстве — последние записи НЕ сохранены!");
    }
  }
  // задачи — общие для всех баз: дублируем в отдельный ключ
  try{ if(typeof saveGlobalTasks==="function") saveGlobalTasks(); }catch(_){}
  // если активная база связана с облаком и есть вход — отложенно отправляем изменения
  try{ if(typeof cloudMaybePush==="function") cloudMaybePush(); }catch(_){}
}

const uid = () => (crypto?.randomUUID?.() || (Date.now()+"_"+Math.random().toString(16).slice(2)));

   ПРОФИЛИ БАЗ (мультибаза)
   ------------------------------------------------------------
   У каждой базы — полностью изолированное состояние: склад, партии,
   журналы, задачи, категории и СВОИ места хранения.

   Модель хранения:
   - STORE_KEY ("vahtahoz:v1") всегда хранит ЖИВЫЕ данные АКТИВНОЙ базы
     (поэтому весь старый код, SW и экспорт работают без изменений,
      а существующие данные автоматически становятся «Базой 1»).
   - PROFILES_KEY хранит метаданные: { activeId, list:[{id,name}] }.
   - Снимок каждой НЕактивной базы лежит в slotKey(id) = "vahtahoz:v1::<id>".
   Переключение: снимок активной → её слот, слот целевой → STORE_KEY, reload.
   ============================================================ */
const PROFILES_KEY = NS+"vahtahoz:profiles";
const slotKey = (id) => `${STORE_KEY}::${id}`;
function loadProfiles(){
  try{
    const raw = localStorage.getItem(PROFILES_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && Array.isArray(p.list) && p.list.length && p.activeId &&
         p.list.some(x=>x.id===p.activeId)) return p;
    }
  }catch(e){ console.warn("loadProfiles", e); }
  return null;
}
/* Возвращает УСПЕХ записи. Раньше сбой глотался, а вызывающие продолжали работу:
   переключение баз перезагружало страницу с activeId от одной базы и данными другой,
   а полное восстановление удаляло старые слоты, не зафиксировав новый список. */
function saveProfiles(p){
  try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(p)); return true; }
  catch(e){
    if(isQuotaErr(e)) _quotaBlock();
    else { console.error("saveProfiles", e); _quotaBlock("⛔ Не удалось сохранить список баз на устройстве"); }
    return false;
  }
}
function ensureProfiles(){
  let p = loadProfiles();
  if(!p){
    // первый запуск с профилями: текущие данные (STORE_KEY) становятся «Базой 1»
    const id = uid();
    p = { activeId: id, list: [{ id, name: "База 1" }] };
    saveProfiles(p);
  }
  return p;
}
let profiles = ensureProfiles();
/* Дубликат слота активной базы, оставшийся от прежних сборок, здесь НЕ удаляем: если предыдущее
   переключение оборвалось между записью STORE_KEY и saveProfiles, этот слот — единственная копия
   данных, а STORE_KEY уже содержит чужие. Он рассосётся сам: switchProfile перезапишет его при
   уходе с базы и убирает слот той базы, на которую перешли. */
const activeProfile = () => profiles.list.find(x=>x.id===profiles.activeId) || profiles.list[0];
const activeProfileName = () => (activeProfile()?.name || "База");

/* свежее состояние для новой базы: пустой склад и журналы, категории по умолчанию.
   Раньше здесь выставлялся `seededAt` — оберег от зашитого списка продуктов, чтобы новая
   база не получила позиции первой. Сам список и всё, что его грузило, убраны в v259,
   поэтому оберегать больше не от чего, и поле не выставляется. */
function freshProfileState(opts){
  const s = structuredClone(defaultState);
  if(opts && opts.copyFrom){
    // копируем КАТЕГОРИИ (универсальны для всех баз), но НЕ места хранения —
    // места физические/базо-специфичные (свой склад/кунг), пусть остаются дефолтными.
    s.categories = structuredClone(opts.copyFrom.categories || defaultState.categories);
  }
  return s;
}
function switchProfile(toId, fromAutoLink){
  if(!toId || toId===profiles.activeId) return;
  if(!profiles.list.some(x=>x.id===toId)) return;
  // авто-привязка к облаку при входе = ИНИЦИАЛИЗАЦИЯ (вход в свою базу), не «смена базы пользователем» → роль-гард не применяем.
  // Пользовательское переключение — под гардом (явно, без завязки на тайминг activeCloudId).
  if(!fromAutoLink && roleBaseLocked()){ toast("Переключение баз недоступно для вашей роли"); return; }
  const prevActive = profiles.activeId;
  const prevLive = (()=>{ try{ return localStorage.getItem(STORE_KEY); }catch(_){ return null; } })();
  /* Байты ЦЕЛЕВОЙ базы читаем ПЕРВЫМИ и держим в памяти. Дальше её слот можно временно удалить,
     чтобы освободить место, и в любой момент вернуть на диск. Это и есть лечение жалобы
     «перешёл на 3 Западную, обратно — „Не удалось переключить базу“»: на телефоне localStorage
     обычно 5 МБ на весь origin, а хранили мы каждую базу ДВАЖДЫ — живой STORE_KEY плюс её же
     слот, который прежний код после переключения не убирал. Две базы среднего размера упирались
     в потолок ровно на обратном переключении, quota-ошибка падала в общий catch, и человек
     получал безымянное «Не удалось» без единой подсказки, что делать. */
  let raw = null;
  try{ raw = localStorage.getItem(slotKey(toId)); }catch(_){}
  /* СНИМОК УХОДЯЩЕЙ БАЗЫ — ПО ОБЩЕЙ ПОЛИТИКЕ ХРАНЕНИЯ, а не голым JSON.stringify(state).
     Всё сохранение сведено к _stateStorageJSON() ровно ради экономии места, а переключение баз
     обходило его: в слот уходил ПОЛНЫЙ журнал из памяти (до JOURNAL_LOCAL_CAP на вид), тогда как
     живой STORE_KEY той же базы держал хвост в JOURNAL_STORE_SOFT_CAP. Замер на синтетике
     (600 позиций, 3000 записей на вид, всё выгружено): живой STORE_KEY 395 615 Б, а слот при
     переключении — 2 100 596 Б, в 5,3 раза больше, чем было. Дальше по цепочке
     (setItem(STORE_KEY) → квота → restoreTarget) единственная копия ВТОРОЙ базы могла остаться
     только в переменной raw внутри замыкания, и человеку в этот момент говорят «НЕ закрывайте
     приложение, сделайте экспорт прямо сейчас». На вахте он закроет.
     Урезанный вид слот переживает без потерь: это ровно то, что нормально лежит в STORE_KEY и
     читается обратно loadState-ом, а _trimJournalKeepPending никогда не выбрасывает записи,
     которых в облаке нет или чья облачная версия устарела. У базы БЕЗ облака (_uploadedJrIds
     отдаёт null) _stateStorageJSON и так возвращает полный state — там телефон единственная
     копия, и урезать нечего. activeCloudId() здесь ещё указывает на УХОДЯЩУЮ базу
     (profiles.activeId меняется ниже), то есть снимок подписей берётся её собственный. */
  const snap = (()=>{ try{ return _stateStorageJSON(); }catch(e){ console.error("switchProfile: снимок", e); return null; } })();
  if(snap === null){ toast("Не удалось переключить базу"); return; }

  let freedTarget = false;                                   // сняли ли слот целевой базы ради места
  /* Вернуть снятый слот на место. По байтам это всегда возможно — мы пишем ровно то, что только что
     удалили. Но если запись всё-таки не прошла, единственная копия целевой базы остаётся в памяти
     переменной raw, и молчать тут нельзя: заводим повторные попытки, пока вкладка жива. */
  const restoreTarget = ()=>{
    if(!freedTarget || raw == null) return true;
    for(let i=0;i<3;i++){ try{ localStorage.setItem(slotKey(toId), raw); return true; }catch(_){} }
    const bytes = raw, key = slotKey(toId);
    let left = 20;
    const t = setInterval(()=>{
      try{ localStorage.setItem(key, bytes); clearInterval(t); toast("Данные базы восстановлены в памяти телефона"); }
      catch(_){ if(--left<=0) clearInterval(t); }
    }, 3000);
    _quotaBlock("⛔ На телефоне нет места: данные второй базы держатся только в оперативной памяти. НЕ закрывайте приложение — сделайте экспорт прямо сейчас");
    return false;
  };

  // 1) снимок активной базы (самые свежие данные — из памяти) в её слот
  try{
    localStorage.setItem(slotKey(prevActive), snap);
  }catch(e){
    if(!isQuotaErr(e)){ console.error("switchProfile: слот активной", e); toast("Не удалось переключить базу"); return; }
    // места нет: слот целевой базы всё равно станет живым — освобождаем его и пробуем снова
    try{ localStorage.removeItem(slotKey(toId)); freedTarget = true; }catch(_){}
    try{
      localStorage.setItem(slotKey(prevActive), snap);
    }catch(e2){
      restoreTarget();
      _quotaBlock("⛔ Не хватило места на телефоне — база НЕ переключена, данные обеих баз целы");
      return;
    }
  }
  // 2) целевую базу делаем «живой» (STORE_KEY)
  try{
    localStorage.setItem(STORE_KEY, raw || JSON.stringify(freshProfileState()));
  }catch(e){
    restoreTarget();
    if(isQuotaErr(e)) _quotaBlock("⛔ Не хватило места на телефоне — база НЕ переключена, данные обеих баз целы");
    else { console.error("switchProfile: STORE_KEY", e); toast("Не удалось переключить базу — данные не тронуты"); }
    return;
  }
  // 3) фиксируем активную и перезагружаемся — нормализация прогонится на новых данных
  profiles.activeId = toId;
  if(!saveProfiles(profiles)){
    // PROFILES_KEY не записан: activeId остался СТАРЫМ, а STORE_KEY уже содержит данные
    // ЦЕЛЕВОЙ базы. Без отката после reload старая база показывала бы чужие данные, а если
    // она облачная — отправила бы их в push под своим cloudId. Возвращаем как было.
    profiles.activeId = prevActive;
    if(prevLive != null){ try{ localStorage.setItem(STORE_KEY, prevLive); }catch(_){} }
    restoreTarget();
    try{ toast("Не удалось переключить базу — данные не тронуты"); }catch(_){}
    return;
  }
  /* Слот целевой базы больше не нужен: её данные теперь ЖИВЫЕ в STORE_KEY, а по модели хранения
     слот держит только НЕактивные базы. Убираем дубликат — это половина занимаемого базой места,
     и именно она возвращается человеку на следующем переключении. Делаем последним шагом, после
     удачного saveProfiles: до него слот ещё нужен для отката. */
  try{ localStorage.removeItem(slotKey(toId)); }catch(_){}
  location.reload();
}
async function addProfile(){
  if(roleBaseLocked()){ toast("Создание баз недоступно для вашей роли"); return; }
  const name = await promptSheet("Название новой базы", "", {title:"Новая база"});
  if(name===null) return;
  const nm = cleanName40(name);
  if(!nm){ toast("Пустое название"); return; }
  if(profiles.list.some(x=>x.name.toLowerCase()===nm.toLowerCase())){ toast("База с таким именем уже есть"); return; }
  const init = await chooseSheet(
    `«${nm}»\nС чего начать?`,
    [
      { label:"Пустая база (свои места и категории)", value:"fresh",  color:"btn-primary" },
      { label:"Скопировать категории и места текущей", value:"copy", color:"btn-ghost"   },
    ]
  );
  if(!init) return;
  const id = uid();
  const newState = init==="copy" ? freshProfileState({copyFrom: state}) : freshProfileState();
  try{ localStorage.setItem(slotKey(id), JSON.stringify(newState)); }
  catch(e){ console.error(e); toast("Не удалось создать базу"); return; }
  profiles.list.push({ id, name: nm });
  saveProfiles(profiles);
  logOp("PROFILE_ADD", `База «${nm}»`);
  const go = await confirmSheet(`База «${nm}» создана. Переключиться на неё сейчас?`, {yes:"Переключиться", no:"Остаться"});
  if(go) switchProfile(id);
  else { saveState(); render(); openProfilesSheet(); }
}
/* ПЕРЕИМЕНОВАНИЕ БАЗЫ. Имя ОБЩЕЙ базы живёт в облаке и оттуда же подтягивается (cloudAutoLink):
   это единственный способ, чтобы «открой базу такую-то» значило одно и то же на всех телефонах.
   Отсюда всё остальное:
     • у ОБЩЕЙ базы имя правится ТОЛЬКО в облаке и ТОЛЬКО владельцем (is_admin). Политика
       bases_update в проде — `has_perm(id,'edit_stock')`, то есть сервер пустил бы и повара; это
       как раз случай, когда клиент обязан быть строже сервера: переименование общей базы — не
       «правка склада»;
     • СНАЧАЛА облако, потом телефон. Раньше локальное имя менялось первым, и при отказе сервера
       человек видел тост «повторите при связи», а имя тут же откатывалось ближайшей привязкой к
       облаку — повторять было нечего, объяснения не было. Теперь при отказе имя просто не
       меняется, и тост говорит именно это;
     • не-владельцу кнопка больше не притворяется. Прежний текст обещал «имя изменится только на
       этом телефоне», а первый же вход/возврат сети/обновление членства возвращали облачное имя:
       кнопка была пустышкой, которая ещё и врала. Теперь отказ звучит сразу, до ввода;
     • «вы не владелец» говорим ТОЛЬКО когда это ЗНАЕМ. Права живут в облачном профиле, а на
       холодном старте без связи он пуст — и владелец, открыв приложение на вахте, получал
       «Имя общей базы меняет владелец»: приложение сообщало ему, что он не он. Ветка «нет связи,
       повторите» при этом была недостижима ровно тогда, когда была нужна. Профиль не загружен —
       это не отказ в правах, это отсутствие связи, так и говорим;
     • локальная (не привязанная) база — как была: имя устройства, меняется без облака. */
async function renameProfile(id){

   цифры: «0,532» → 0.532, «1,250» → 1.25, «12,345» → 12.345. Прежняя эвристика считала одну
   группу из трёх цифр тысячами: шаблон ^\d{1,3}(,\d{3})+$ совпадал с «0,532» (начало съедало
   «0», группа — «,532») и давал 532. Выдача мяса 0,532 кг молча не проходила проверку «Не
   хватает на складе» и не применялась вовсе, тогда как 0,53 кг применялась.
   Группировку тысяч признаём только там, где она однозначна:
     • пробел/nbsp — «1 234,5» → 1234.5 (разделитель снимается первой строкой функции);
     • ДВЕ и более групп по три цифры — «1,234,567» / «1.234.567» → 1234567;
     • оба разделителя сразу — «1.234,5» / «1,234.5» → 1234.5 (последний из них десятичный).
   Целая часть у группировки не может начинаться с нуля ([1-9]), поэтому ведущий ноль перед
   разделителем — всегда десятичная дробь.
   КОМПРОМИСС: «1,000» теперь 1, а не 1000. Это осознанно: приложение — склад кухни, где ручной
   ввод веса с тремя знаками (мясо, рыба, сыр) основной сценарий, а настоящая тысяча набирается
   «1000» или «1 000». Разбор накладных не страдает: в xlsx числовые ячейки приходят ЧИСЛАМИ и
   в эту ветку не заходят, а CSV читается с raw:true и здесь как раз нуждается в десятичной

function parseNum(v){
  let s = String(v==null?"":v).replace(/[\s\u00A0]/g,"").trim();
  if(!s) return 0;
  const hasDot = s.includes("."), hasComma = s.includes(",");

    if(s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g,"").replace(",", ".");
    else s = s.replace(/,/g,"");
  } else if(hasComma){
    if(/^[1-9]\d{0,2}(,\d{3}){2,}$/.test(s)) s = s.replace(/,/g,""); // «1,234,567» → 1234567
    else s = s.replace(",", ".");                                    // «0,532» → 0.532, «1,250» → 1.25
  } else if(hasDot){
    if(/^[1-9]\d{0,2}(\.\d{3}){2,}$/.test(s)) s = s.replace(/\./g,""); // EU «1.234.567» → 1234567
  }

}
/* --- per-field валидаторы импорта (структура + нормализация); поведение идентично исходному validateImport --- */
function validateArrayField(obj, field){
  if(obj[field]!==undefined && !Array.isArray(obj[field])) throw new Error(`поле ${field} не массив`);
  // Не-объекты внутри массива ("stock":[null] / ["Мука"]) выбрасываем СРАЗУ: иначе битое
  // состояние успевает записаться в localStorage, а renderDashboard падает на старте —
  // приложение не открывается и само не восстанавливается.
  if(Array.isArray(obj[field])) obj[field] = obj[field].filter(x=>x && typeof x==="object" && !Array.isArray(x));
}
function validateJournalsField(obj){
  if(obj.journals!==undefined){
    if(typeof obj.journals!=="object" || Array.isArray(obj.journals)) throw new Error("journals не объект");
    for(const k of JOURNAL_KEYS){
      if(obj.journals[k]!==undefined && !Array.isArray(obj.journals[k])) throw new Error(`journals.${k} не массив`);
      if(obj.journals[k]===undefined) obj.journals[k] = [];
      obj.journals[k] = obj.journals[k].filter(x=>x && typeof x==="object" && !Array.isArray(x));
    }
  }
}
function validateCategoriesField(obj){
  if(obj.categories!==undefined){
    if(typeof obj.categories!=="object" || Array.isArray(obj.categories)) throw new Error("categories не объект");
    for(const k of STOCK_TYPE_KEYS){
      if(obj.categories[k]!==undefined && !Array.isArray(obj.categories[k])) throw new Error(`categories.${k} не массив`);
      if(Array.isArray(obj.categories[k])) obj.categories[k] = obj.categories[k].map(cleanCatName).filter(Boolean);
    }
  }
}
function validateLocationsField(obj){
  if(obj.locations!==undefined){
    if(typeof obj.locations!=="object" || Array.isArray(obj.locations)) throw new Error("locations не объект");
    for(const k of STOCK_TYPE_KEYS){
      if(obj.locations[k]!==undefined && !Array.isArray(obj.locations[k])) throw new Error(`locations.${k} не массив`);
      if(Array.isArray(obj.locations[k])) obj.locations[k] = uniqClean(obj.locations[k]);
    }
  }
}
function validateChecklistsField(obj){
  if(obj.checklists!==undefined){
    if(typeof obj.checklists!=="object" || Array.isArray(obj.checklists)) throw new Error("checklists не объект");
    if(obj.checklists.kitchen!==undefined && !Array.isArray(obj.checklists.kitchen)) throw new Error("checklists.kitchen не массив");
    if(Array.isArray(obj.checklists.kitchen)){
      obj.checklists.kitchen = obj.checklists.kitchen
        .filter(c=>c && typeof c==="object")
        .map(c=>({ id: safeId(c.id), text: String(c.text||"").slice(0,200), done: !!c.done }));

// нормализуем id у всех записей
function normalizeImportIds(obj){
  if(obj.stock) sanitizeIds(obj.stock);
  if(obj.tasks){
    sanitizeIds(obj.tasks);
    // чек-листы задач: id пунктов идут в inline-onclick → санитизируем при импорте (XSS)
    for(const t of obj.tasks){
      if(!t || typeof t!=="object") continue;
      if(Array.isArray(t.items)){
        t.items = t.items.filter(i=>i&&typeof i==="object")
          .map(i=>({ id:safeId(i.id), text:String(i.text||"").slice(0,200), done:!!i.done }))
          .filter(i=>i.text);
      }
      // поля задачи идут в HTML формы редактирования (due/time — в value атрибута) → валидируем при импорте,
      // иначе мусорная/вредоносная строка в due/time = XSS и ломает daysLeft/сортировку
      t.due  = (typeof t.due==="string"  && /^\d{4}-\d{2}-\d{2}$/.test(t.due))  ? t.due  : "";
      t.time = (typeof t.time==="string" && /^\d{2}:\d{2}$/.test(t.time))       ? t.time : "";
      t.title    = typeof t.title==="string" ? t.title.slice(0,200) : "";
      t.category = typeof t.category==="string" ? cleanCatName(t.category) : "";
      t.priority = TASK_PRIOS.includes(t.priority) ? t.priority : "Средний";
      t.repeat   = ["Нет","День","Неделя","Месяц"].includes(t.repeat) ? t.repeat : "Нет";
    }
  }
  if(obj.log)   sanitizeIds(obj.log);
  if(obj.journals){
    for(const k of JOURNAL_KEYS){
      if(obj.journals[k]) sanitizeIds(obj.journals[k]);
    }
  }

// нормализуем ОДНУ позицию склада. Применяется И при импорте, И при загрузке из облака:
// в облако данные мог записать любой участник с edit_stock, поэтому доверять им нельзя так же, как файлу.
// - type идёт в inline-onclick без esc() → только известные ключи (иначе XSS из облака/импорта);
// - qty/партии гасим от float-эпсилонов и мусора; невалидный srок карточки сбрасываем (иначе ломает fmtDate/daysLeft);
// - после чистки партий пересчитываем qty/срок карточки из партий (иначе остаток и сумма партий расходятся).
/* Санитайз массива партий, пришедшего ИЗ ОБЛАКА (jsonb пишет любой участник с edit_stock).
   Обязателен ВЕЗДЕ, где облачные партии попадают в state.stock: b.id подставляется в
   inline-onclick (deleteBatch/openMove/openBatchEdit), поэтому без safeId это XSS;
   плюс фильтр qty>0 (иначе фантомные место/срок при нулевом остатке) и валидация срока.
   Раньше блок жил только внутри normalizeStockItem, а 3-way merge писал cr.batches сырыми. */
function sanitizeBatches(arr){
  if(!Array.isArray(arr)) return [];
  return arr.filter(b => b && typeof b==="object").map(b => ({
    id: safeId(b.id),
    qty: stockQty(b.qty||0),   // остаток партии из файла/облака: минус — не «долг», а порча данных (ниже отсеивается фильтром qty>0)
    expiry: (typeof b.expiry==="string" && /^\d{4}-\d{2}-\d{2}$/.test(b.expiry)) ? b.expiry : "",
    location: typeof b.location==="string" ? cleanName40(b.location) : "",   // defense-in-depth поверх esc на рендере
    note: typeof b.note==="string" ? b.note.slice(0,200) : "",
    createdAt: typeof b.createdAt==="string" ? b.createdAt : new Date().toISOString(),
  })).filter(b => b.qty>0);
}
function normalizeStockItem(s){
  if(!s || typeof s!=="object") return s;
  if(!STOCK_TYPE_KEYS.includes(s.type)) s.type = "product";
  if(s.qty!=="" && s.qty!=null) s.qty = stockQty(s.qty);   // хранимый остаток карточки: не ниже нуля, «7,5» — не ноль
  // канон ед.: пустая→шт, упаковка→уп (иначе unit-aware match плодит дубли)
  if(typeof _impUnitKey==="function"){
    const uk = _impUnitKey(s.unit);
    if(uk) s.unit = uk;
    else if(!String(s.unit||"").trim()) s.unit = "шт";
  } else if(!String(s.unit||"").trim()) s.unit = "шт";
  /* Срок карточки: гасим не только «строку не того вида». JSON из облака и из файла бэкапа даёт
     и числа, и массивы, а проверка была только для строк — значение уезжало в разметку как есть.
     `["\" onfocus=… x=\""]` в шаблоне `value="${vExp}"` разрывает атрибут: то же самое, что уже
     ловили на fmtDate. Трогаем ТОЛЬКО присутствующее поле — иначе у каждой карточки без срока
     появлялся бы новый ключ и уезжал в облако пустой правкой. */
  if(s.expiry!=null && (typeof s.expiry!=="string" || (s.expiry && !/^\d{4}-\d{2}-\d{2}$/.test(s.expiry)))) s.expiry = "";
  /* Мин. запас не проверялся вообще НИГДЕ, кроме формы: из облака и бэкапа сюда попадала любая
     строка, и она же рисовалась в value="…" без экранирования. Оставляем ровно то, что пишет
     saveStock: пусто или число. «abc» → пусто, а НЕ ноль: ноль зажёг бы «низкий запас» на всём
     складе (та же ловушка описана в saveStock). */
  if(s.minStock!=null && s.minStock!==""){
    const _ms = s.minStock;
    const ok = (typeof _ms==="number" && Number.isFinite(_ms))
            || (typeof _ms==="string" && /^[0-9 \u00A0.,]+$/.test(_ms) && /\d/.test(_ms));
    s.minStock = ok ? Math.max(0, roundQty(_ms)) : "";
  }
  if(Array.isArray(s.batches)){
    /* ПАРТИИ БЫЛИ, А ПОСЛЕ САНИТАЙЗА НЕ ОСТАЛОСЬ НИ ОДНОЙ — АГРЕГАТЫ УХОДЯТ ВМЕСТЕ С НИМИ.
       У карточки с партиями qty/срок/место производны от списка партий, и все соседи это чтут:
       finalizeBatchMutation при пустом списке явно ставит qty=0, expiry="", location="", то же
       делает applyCloudBatchAggregates. Здесь же список просто удалялся, а агрегаты оставались
       старыми: строка вида {qty:12, expiry:"…", batches:[{qty:0,…}]} после загрузки становилась
       legacy-карточкой с остатком 12, хотя по инварианту он 0. Разойдясь один раз, эти цифры уже
       никогда не сходились. Записать такую строку наш клиент не может — но jsonb в облаке пишет
       любой участник с edit_stock, в том числе сборка постарше, так что это защита от чужих
       данных, и она обязана быть здесь.
       ЗАЧЕМ _had. Обнулять по одному лишь «после санитайза пусто» нельзя: stockToRow отдаёт в
       облако batches:[] у КАЖДОЙ legacy-карточки, и rowToStock возвращает тот же пустой массив
       обратно. Без этой проверки обычная загрузка обнулила бы весь склад. Реагируем только на
       случай «партии в исходных данных были, а после чистки исчезли». */
    const _had = s.batches.length;
    s.batches = sanitizeBatches(s.batches);
    if(s.batches.length===0){
      delete s.batches;
      if(_had){ s.qty = 0; s.expiry = ""; s.location = ""; }
    }
    else syncItemFromBatches(s);   // остаток/срок карточки = из партий
  }
  return s;
}
// гасим float-эпсилоны на входе, чтобы не тащить мусор из старых экспортов
function normalizeImportStockQty(obj){
  if(Array.isArray(obj.stock)) for(const s of obj.stock) normalizeStockItem(s);
}
function normalizeImportJournalsQty(obj){
  if(obj.journals){

function validateImport(obj){
  if(!obj || typeof obj!=="object" || Array.isArray(obj)) throw new Error("корневой объект некорректен");

  return obj;
}

/* пост-загрузочная нормализация (loadState() выполнился до объявления хелперов) */
if(!Array.isArray(state.stock)) state.stock = [];
if(!Array.isArray(state.tasks)) state.tasks = [];
if(!Array.isArray(state.log))   state.log   = [];
if(!state.journals || typeof state.journals!=="object" || Array.isArray(state.journals))
  state.journals = emptyJournals();
for(const k of JOURNAL_KEYS){

}
/* Типы склада: продукты / хозтовары / инструменты. Единый источник для UI и данных. */
const STOCK_TYPES = [
  { key:"product",   icon:"leaf", label:"Продукты",   addLabel:"Продукт",    short:"Продукты"   },
  { key:"household", icon:"bottle", label:"Хозтовары",   addLabel:"Хозтовар",   short:"Хозка"      },
  { key:"tool",      icon:"wrench", label:"Инструменты", addLabel:"Инструмент", short:"Инструменты"},
];
const STOCK_TYPE_KEYS = STOCK_TYPES.map(t=>t.key);
const typeMeta = (k) => STOCK_TYPES.find(t=>t.key===k) || STOCK_TYPES[0];
// доступные типы склада для роли: Механик/Электрик — только инструменты; Повар — без инструментов; остальные — все.
// (activeMember определён ниже, но объявления функций подняты — на момент рендера всё готово)
function allowedTypeKeys(){
  // выравнивание с серверным can_see_type: владелец и любая орг-роль (директор/бухгалтер/нач.партии) → все типы.
  if(typeof cloud!=="undefined"){
    if(cloud.profile && cloud.profile.is_admin) return STOCK_TYPE_KEYS.slice();
    if((cloud.orgRoles||[]).some(o=>o.active!==false)) return STOCK_TYPE_KEYS.slice();
  }
  const m = (typeof activeMember==="function") ? activeMember() : null;
  const role = m && m.role;
  if(role==="mechanic") return ["tool"];
  if(role==="cook") return ["product","household"];
  return STOCK_TYPE_KEYS.slice();
}
function visibleStockTypes(){ const a=allowedTypeKeys(); return STOCK_TYPES.filter(t=>a.includes(t.key)); }
const DEFAULT_CATEGORIES = {
  household: ["Химия","Уборка","Расходники","Прочее"],
  tool: ["Электроинструмент","Ручной инструмент","Крепёж и метизы","Сантехника","Электрика","Спецодежда и СИЗ","Прочее"],
};
if(!state.categories || typeof state.categories!=="object"){

}
for(const k of STOCK_TYPE_KEYS){

/* Дефолтные места — seed для state.locations при первом запуске и фолбэк, если массив пуст. */
// Места хранения ПРИВЯЗАНЫ К БАЗЕ и у всех разные — поэтому НЕТ глобальных дефолтов (раньше сюда были зашиты
// реальные места одной базы и засеивались во все → чужие «Серый склад/Морозильная камера» появлялись везде).
// Новая база стартует с пустым списком; пользователь добавляет свои места (в форме позиции есть «＋ Новое место»).
const DEFAULT_LOCATIONS = { product: [], household: [], tool: [] };
function getLocations(type){
  const arr = state.locations?.[type];
  return Array.isArray(arr) ? arr.slice() : [];
}
/* Список мест для формы редактирования — включает orphan-значение (которое есть у записи,
   но было удалено из state.locations), чтобы при сохранении не стереть его молча. */
function getLocationsWithOrphan(type, orphanValues){
  const base = getLocations(type);
  const set = new Set(base);
  const orphans = (Array.isArray(orphanValues) ? orphanValues : [orphanValues])
    .map(v => (v||"").toString().trim())
    .filter(v => v && !set.has(v));
  return [...orphans, ...base];
}
// места для выбора партии: дефолтные места типа + «осиротевшие» (фактически используемые в позиции/её партиях)
function batchLocs(it){ return getLocationsWithOrphan(it.type, (it.batches||[]).map(b=>b.location).concat([it.location])); }
// «Надгробия» (tombstones) удалённых мест/категорий — чтобы удаление РАСПРОСТРАНЯЛОСЬ на устройства,
// а union-слияние настроек не возвращало удалённое имя обратно. Хранятся в settings и синкаются.
function ensureTomb(){
  if(!state.delLoc || typeof state.delLoc!=="object" || Array.isArray(state.delLoc)) state.delLoc={};
  if(!state.delCat || typeof state.delCat!=="object" || Array.isArray(state.delCat)) state.delCat={};
  for(const k of STOCK_TYPE_KEYS){ if(!Array.isArray(state.delLoc[k])) state.delLoc[k]=[]; if(!Array.isArray(state.delCat[k])) state.delCat[k]=[]; }
  if(!Array.isArray(state.delJr)) state.delJr=[];   // надгробия ЯВНО удалённых журнальных записей (id) — чтобы удаление доехало до облака и не воскресало pull-ом
}
// пометить журнальную запись удалённой (append-only облако удаляет только помеченные — усечение квоты надгробий НЕ ставит)
// Кап — АВАРИЙНЫЙ клапан от неограниченного роста (высокий: доставленные надгробия снимаются на синке, см. dropDeliveredTombstones,
// поэтому в норме delJr держит лишь НЕдоставленные — их дропать нельзя, иначе удалённая запись воскреснет на pull).
function tombJr(id){
  if(!id) return; ensureTomb();
  if(!state.delJr.includes(id)) state.delJr.push(id);
  /* Облачная база: НЕ срезаем хвост — недоставленное надгробие терять нельзя, иначе pull
     воскресит запись. Доставленные снимает dropDeliveredTombstones после успешного DELETE.
     ЛОКАЛЬНАЯ база (нет cloudId): тянуть записи неоткуда и воскрешать некому, а снимать
     надгробия тоже некому (dropDeliveredTombstones живёт только на синке) — список рос бы
     вечно и молча съедал квоту телефона у тех, кто облаком не пользуется. Держим хвост. */
  let linked = true;
  try{ linked = !!(typeof activeCloudId==="function" && activeCloudId()); }catch(_){ linked = true; }
  if(!linked){
    if(state.delJr.length>500) state.delJr.splice(0, state.delJr.length-500);
    return;
  }
  if(state.delJr.length>20000) console.warn("delJr oversized", state.delJr.length);
}
// после ПОДТВЕРЖДЁННОГО удаления из облака надгробие больше не нужно (запись там уже мертва и на pull не придёт) —
// убираем из delJr, чтобы он не рос и слепой кап не выбросил ЕЩЁ НЕ доставленные надгробия.
function dropDeliveredTombstones(ids){
  if(!Array.isArray(state.delJr) || !ids || !ids.length) return;
  const done=new Set(ids); const before=state.delJr.length;
  state.delJr = state.delJr.filter(id=>!done.has(id));
  if(state.delJr.length!==before){ const _w=cloud.applying; cloud.applying=true; try{ saveState(); }finally{ cloud.applying=_w; } }
}
function tombAdd(map,type,name){ ensureTomb(); const a=map[type]; if(name && !a.includes(name)) a.push(name); }      // удалили имя → в надгробия
function tombRevive(map,type,name){ ensureTomb(); const i=(map[type]||[]).indexOf(name); if(i>=0) map[type].splice(i,1); } // снова добавили/переименовали в это имя → снимаем надгробие

for(const k of STOCK_TYPE_KEYS){

for(const k of STOCK_TYPE_KEYS){
  if(state.delLoc[k].length) state.locations[k] = applyTomb(state.locations[k], state.delLoc[k]);

sanitizeStateIds();

/* нормализация существующих количеств: схлопывает накопленные float-эпсилоны
   (91.54999999999998 → 91.55, 12.620000000000001 → 12.62) и заполняет пустую категорию у продуктов */
for(const s of state.stock){
  if(s.type==="product" && !s.category){
    s.category = (state.categories.product||[]).includes("Прочие продукты") ? "Прочие продукты" : "";
  }
  // ЕДИНАЯ строгая чистка (как при импорте/загрузке из облака): type-whitelist (иначе битый type из старого
  // слота → XSS/краш рендера), float-эпсилоны qty, валидация срока, выкидывание зомби-партий qty≤0
  // (иначе фантомные «место/срок» при нулевом остатке), пересчёт агрегатов из партий.
  normalizeStockItem(s);
}

/* МИГРАЦИЯ ЛЕГАСИ: схлопывание "X (до DATE)"-дубликатов в одну карточку с массивом batches.
   Старая реализация saveBatch() создавала отдельную позицию с суффиксом — теперь группируем их обратно. */
(function migrateLegacyBatchSuffix(){
  const RE = /^(.+?)\s*\(до\s+([^)]+)\)\s*$/;
  // строим индекс по type|category|baseName
  const groups = new Map();
  for(const s of state.stock){
    const m = (s.name||"").match(RE);
    if(!m) continue;
    const baseName = m[1].trim();
    const key = `${s.type}|${s.category||""}|${baseName.toLowerCase()}`;
    if(!groups.has(key)) groups.set(key, { baseName, members: [] });
    groups.get(key).members.push(s);
  }
  if(groups.size===0) return;
  let merged = 0, changed = false;
  for(const {baseName, members} of groups.values()){
    if(members.length<1) continue;
    // ищем «родительскую» карточку — та, у кого имя без суффикса; если нет — берём первый member
    const parent = state.stock.find(x =>
      x.type===members[0].type &&
      (x.category||"")===(members[0].category||"") &&
      (x.name||"").toLowerCase() === baseName.toLowerCase() &&
      !RE.test(x.name||"")
    ) || members[0];
    if(parent.name!==baseName){ parent.name = baseName; changed = true; }
    parent.batches = parent.batches || [];
    // если у parent был свой qty>0 без батча — превращаем в первую партию.
    // ВАЖНО: и для случая parent===members[0] (имя уже переименовано выше,
    // цикл ниже его пропустит — без этого блока собственный остаток терялся бы)
    if(parent.batches.length===0 && roundQty(parent.qty||0) > 0){
      parent.batches.push({
        id: uid(), qty: roundQty(parent.qty||0),
        expiry: parent.expiry||"", location: parent.location||"",
        note: "Слияние при миграции", createdAt: parent.createdAt||new Date().toISOString(),
      });
      changed = true;
    }
    // переносим все members в parent.batches
    for(const m of members){
      if(m===parent) continue; // parent уже учтён блоком выше
      if(roundQty(m.qty||0) > 0 || m.expiry){
        parent.batches.push({
          id: uid(), qty: roundQty(m.qty||0),
          expiry: m.expiry||"", location: m.location||"",
          note: "Из «(до …)»", createdAt: m.createdAt||new Date().toISOString(),
        });
        merged++;
      }
      // удаляем дубликат и переадресуем productId в журналах на parent.id
      if(state.journals){
        for(const k of JOURNAL_KEYS){
          for(const op of (state.journals[k]||[])){
            if(op && op.productId===m.id){ op.productId = parent.id; op.productName = baseName; changed = true; }
          }
        }
      }
      state.stock = state.stock.filter(x=>x.id!==m.id);
      changed = true;
    }
    if(parent.batches.length===0) delete parent.batches;
    else syncItemFromBatches(parent);
  }
  if(merged>0 || changed){ saveState(); console.info(`Миграция партий: схлопнуто ${merged} партий "(до …)"`); }
})();
for(const k of JOURNAL_KEYS){
  for(const op of state.journals[k]){
    if(op && op.qty!=null) op.qty = roundQty(op.qty);
  }
}

/* ---------- Экран загрузки ----------
   Убирается ровно там, где дальше показывать уже нечего лишнего: либо человек видит вход, либо роли
   с сервера получены и состав кнопок окончателен. Предохранитель на 7 секунд обязателен: на вахте
   интернета может не быть вовсе, а бэкенд на холодную просыпается десятками секунд — без него
   приложение вставало бы намертво на заставке при живых локальных данных. */
let _splashTimer = null;
function hideSplash(){
  const s = document.getElementById("splash"); if(!s) return;

/* Подсказка о составе кнопок с прошлого запуска. Роли живут только в памяти и приезжают по сети,
   поэтому офлайн и на медленной связи их «ещё нет» — а показывать в это время лишние разделы нельзя.
   Это ТОЛЬКО про внешний вид: данные закрыты политиками на сервере, и как только настоящие роли
   приходят, cloudGateTasks пересчитывает всё заново. Помним вместе с id пользователя — телефон
   передают следующей смене, и чужой раскладке тут делать нечего. */
const GATES_KEY = NS+"vahtahoz_gates";
function saveGateHints(t,k){
  try{
    const s = loadCloudSess(); const u = s && s.user && s.user.id; if(!u) return;
    localStorage.setItem(GATES_KEY, JSON.stringify({u, t:!!t, k:!!k}));
  }catch(_){}
}
function loadGateHints(){
  try{
    const h = JSON.parse(localStorage.getItem(GATES_KEY)||"null"); if(!h) return null;
    const s = loadCloudSess(); const u = s && s.user && s.user.id;
    return (u && h.u===u) ? h : null;
  }catch(_){ return null; }
}

/* ---------- Sheet ---------- */
let _sheetOnClose = null;
/* Видим ли экран входа. Разметка гейта несёт инлайновый display:flex И класс hidden,
   поэтому судим по классу — он единственный признак, верный во всех трёх состояниях. */
function gateOpen(){ const g=document.getElementById("loginGate"); return !!g && !g.classList.contains("hidden"); }
let _overGateOnce = false;    // разовое разрешение открыть лист поверх гейта (юр-страницы, смена пароля)
let _sheetRefused = false;    // последний openSheet отказал — промис-обёртки должны разрешиться сразу
function openSheetOverGate(html){ _overGateOnce = true; openSheet(html); }
function openSheet(html){
  /* Лист лежит ВЫШЕ гейта (z-index 100 против 90 — намеренно, ради юр-страниц до входа).
     showLoginGate закрывает уже открытый лист, но не мог помешать листу, который открывается
     ПОЗЖЕ: openMembersSheet и подобные делают openSheet("Загрузка…") → await → openSheet(данные).
     Если во время await сессия отвергнута, завершившийся await показывал логины, роли и «на смене»
     поверх экрана входа. Пускаем поверх гейта только то, что открыто с самого гейта. */
  const over = _overGateOnce; _overGateOnce = false;
  if(gateOpen() && !over){ _sheetRefused = true; return; }
  // предыдущий sheet принудительно закрываем с резолвом null, чтобы await не висел
  // (обнуляем ДО вызова: колбэк может сам звать closeSheet, и тот выполнил бы его повторно)
  if(_sheetOnClose){ const _cb=_sheetOnClose; _sheetOnClose=null; try{ _cb(); }catch(e){} }
  /* Колбэк выше сам может показать экран входа — реальный случай: openSetNewPassword ставит
     _sheetOnClose = exitRecoveryMode. Гейт проверялся ТОЛЬКО до него, поэтому содержимое нового
     листа (склад, логины участников) оказывалось видно ПОВЕРХ логина. Проверяем ещё раз. */
  if(gateOpen() && !over){ _sheetRefused = true; return; }
  _sheetRefused = false;
  const s=document.getElementById("sheet");
  // Заменяем sheetBody на свежий клон, чтобы сбросить все старые addEventListener
  const oldBody = document.getElementById("sheetBody");
  const freshBody = oldBody.cloneNode(false);
  oldBody.replaceWith(freshBody);
  freshBody.innerHTML = html;
  s.classList.add("open");
  // Клавиатура телефона перекрывает нижние поля листа (100vh не уменьшается на iOS) — подтягиваем
  // активный инпут к центру. Задержка: анимация появления клавиатуры.
  freshBody.addEventListener("focusin", (e)=>{
    if(e.target && e.target.matches && e.target.matches("input,select,textarea")){
      setTimeout(()=>{ try{ e.target.scrollIntoView({block:"center"}); }catch(_){} }, 250);
    }
  });
  _sheetOpener = (document.activeElement && document.activeElement !== document.body) ? document.activeElement : null;
  document.addEventListener("keydown", _sheetEsc);
}
let _sheetOpener = null;
function _sheetEsc(e){ if(e.key==="Escape") closeSheet(); }   // лист закрывался только тапом по фону
function closeSheet(){
  document.getElementById("sheet").classList.remove("open");
  document.removeEventListener("keydown", _sheetEsc);
  // возвращаем фокус тому, кто открыл лист (иначе после закрытия фокус улетает в начало документа).
  // НО не под гейт: при принудительном разлогине фокус уезжал на кнопку склада за экраном входа.
  if(_sheetOpener){ const el=_sheetOpener; _sheetOpener=null; if(!gateOpen()){ try{ el.focus({preventScroll:true}); }catch(_){} } }
  if(_sheetOnClose){ const cb=_sheetOnClose; _sheetOnClose=null; try{ cb(); }catch(e){} }
}

function confirmSheet(msg, opts={}){
  return new Promise(resolve=>{
    openSheet(`
      <div class="font-bold text-lg mb-3">${esc(opts.title||"Подтверждение")}</div>
      <div class="mb-4 opacity-80 whitespace-pre-line">${esc(msg)}</div>

        <button class="btn ${opts.danger?"btn-danger":"btn-primary"} flex-1" id="_confYes">${esc(opts.yes||"Ок")}</button>
      </div>
    `);
    // openSheet мог отказать (виден экран входа): элементов в DOM нет, обращение к ним бросило бы
    // TypeError внутрь промиса. Разрешаем тем же исходом, что и закрытие без выбора.
    if(_sheetRefused){ resolve(false); return; }
    _sheetOnClose = ()=>resolve(false);
    document.getElementById("_confNo").onclick = ()=>{ closeSheet(); };
    document.getElementById("_confYes").onclick = ()=>{ _sheetOnClose=null; closeSheet(); resolve(true); };
  });

function promptSheet(msg, def="", opts={}){

    if(_sheetRefused){ resolve(null); return; }   // отказ openSheet (виден гейт) — как отмена

document.getElementById("sheet").addEventListener("click", e=>{
  /* closest, а не сам e.target: крестик в шапке листа фильтров — это <div data-close> с ИКОНКОЙ
     внутри, и палец почти всегда попадает по <svg>/<path>, у которых своего data-close нет.

  if(e.target.closest && e.target.closest("[data-close]")) closeSheet();
