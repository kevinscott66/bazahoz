async function deleteBatch(itemId, batchId){
  if(!ensureCanEdit()) return;
  const it = state.stock.find(s=>s.id===itemId); if(!it) return;
  const b = (it.batches||[]).find(x=>x.id===batchId); if(!b) return;
  if(!await confirmSheet(`Удалить партию ${fmtQty(b.qty)} ${it.unit||""}${b.location?` (📍 ${b.location})`:""}${b.expiry?` (⏰ ${fmtDate(b.expiry)})`:""}?`,{danger:true,yes:"Удалить"})) return;
  // ссылки it/b сняты ДО await — pull во время подтверждения мог пересоздать объекты склада.
  // Без перерезолва мутация легла бы на «осиротевший» объект, а журнал получил бы ложную пометку «[партия удалена]».
  if(state.stock.find(s=>s.id===itemId)!==it || !(it.batches||[]).some(x=>x.id===batchId)){ toast("Данные обновились — повторите операцию"); render(); return; }
  // помечаем осиротевшие журнальные записи — чтобы editOp по ним выдавал предупреждение
  let orphans = 0;
  for(const k of JOURNAL_KEYS){
    for(const op of (state.journals[k]||[])){
      if(op && op.batchId===batchId){
        op.batchId = ""; orphans++;
        if(!String(op.note||"").includes("[партия удалена]")) op.note = (op.note?op.note+" ":"") + "[партия удалена]";
      }
    }
  }
  it.batches = it.batches.filter(x=>x.id!==batchId);
  finalizeBatchMutation(it);
  logOp("BATCH_DEL", `${it.name}: партия ${fmtQty(b.qty)} ${it.unit||""}${orphans?` (отвязано ${orphans} записей)`:""}`);
  saveState(); render();
  toast("Партия удалена");
}

/* ---------- Перенос на другое место хранения (часть/целиком, по партии со своим сроком) ---------- */
// гарантируем партийную модель: legacy-остаток (qty/expiry/location) превращаем в одну партию.
function ensureBatchModel(it){
  if(hasBatches(it)) return;
  const q = roundQty(it.qty||0);
  it.batches = q>0 ? [{ id:uid(), qty:q, expiry:it.expiry||"", location:it.location||"", note:"", createdAt:it.createdAt||new Date().toISOString() }] : [];
}
// диалог переноса. batchId="" → переносим позицию целиком (legacy/одна партия); иначе конкретную партию со своим сроком.
function openMove(itemId, batchId){
  if(!ensureCanEdit()) return;
  const it = state.stock.find(s=>s.id===itemId);
  if(!it){ toast("Позиция изменилась на другом устройстве"); render(); return; }
  let srcQty, srcExpiry, srcLocation;
  if(batchId){
    const b=(it.batches||[]).find(x=>x.id===batchId);
    if(!b){ toast("Партия изменилась — повторите"); render(); return; }
    srcQty=roundQty(b.qty||0); srcExpiry=b.expiry||""; srcLocation=b.location||"";
  } else {
    srcQty=totalQtyOf(it); srcExpiry=it.expiry||""; srcLocation=it.location||"";
  }
  if(!(srcQty>0)){ toast("Нечего переносить — остаток 0"); return; }
  const LOCS = batchLocs(it).filter(l=>l && l!==srcLocation);   // куда переносим (исключаем текущее место)
  const q = fmtQty(srcQty);
  openSheet(`
    <div class="space-y-3">
      <div class="font-bold text-xl">Перенести на другое место</div>
      <div class="text-sm opacity-70">«${esc(it.name)}»${srcExpiry?` · срок ${fmtDate(srcExpiry)}`:""}${srcLocation?` · из «${esc(srcLocation)}»`:" · место не указано"}. Доступно: ${q} ${esc(it.unit||"")}.</div>
      <div>
        <div class="text-sm opacity-70 mb-1">Сколько перенести (${esc(it.unit||"")})</div>
        <input class="input" id="mvq" type="text" inputmode="decimal" value="${q}" />
        <button class="btn btn-ghost w-full mt-1 text-sm" onclick="document.getElementById('mvq').value='${q}'">Перенести всё (${q})</button>
      </div>
      <div>
        <div class="text-sm opacity-70 mb-1">Куда (место хранения)</div>
        <div class="flex flex-wrap gap-2" id="mvLocs">${LOCS.length?LOCS.map(l=>`<button class="chip" data-loc="${esc(l)}" onclick="${CHIP_PICK}">${esc(l)}</button>`).join(""):'<span class="text-xs opacity-60">Других мест нет — добавьте место в «Места и категории»</span>'}</div>
      </div>
      <div class="flex gap-2 pt-2 sheet-actions">
        <button class="btn btn-ghost flex-1" data-close>Отмена</button>
        <button class="btn btn-primary flex-1" onclick="doMove('${itemId}','${batchId||""}')">Перенести</button>
      </div>
    </div>
  `);
}
function doMove(itemId, batchId){
  if(!ensureCanEdit()) return;
  const body = document.getElementById("sheetBody");
  const it = state.stock.find(s=>s.id===itemId);
  if(!it){ closeSheet(); return; }
  const dest = body.querySelector(".chip.active[data-loc]")?.dataset.loc || "";
  if(!dest){ toast("Выберите место назначения"); return; }
  const amount = roundQty(parseNum(body.querySelector("#mvq").value));
  if(!(amount>0)){ toast("Количество должно быть > 0"); return; }
  // источник и доступное — резолвим БЕЗ конвертации, чтобы при отказе legacy-позиция не стала зря «партийной»
  let srcExpiry, srcLocation, available;
  if(batchId){
    const b0=(it.batches||[]).find(x=>x.id===batchId);
    if(!b0){ toast("Партия изменилась — повторите"); render(); return; }
    srcExpiry=b0.expiry||""; srcLocation=b0.location||""; available=roundQty(b0.qty||0);
  } else {
    srcExpiry=it.expiry||""; srcLocation=it.location||""; available=totalQtyOf(it);
  }
  if(dest===srcLocation){ toast("Это то же место хранения"); return; }
  if(amount>available){ toast(`Доступно только ${fmtQty(available)} ${it.unit||""}`); return; }
  // простую (бес-партийную) позицию целиком — просто меняем место, не плодя «партийность»
  if(!batchId && !hasBatches(it) && amount>=available){
    it.location=dest; it.updatedAt=new Date().toISOString();
    logOp("MOVE", `${it.name}: ${fmtQty(amount)} ${it.unit||""} «${srcLocation||"—"}» → «${dest}»${srcExpiry?` (срок ${fmtDate(srcExpiry)})`:""}`);
    saveState(); closeSheet(); render(); toast(`Перенесено в «${dest}»`); return;
  }
  // частичный перенос или партия → переводим в партийную модель и мутируем (резолв источника заново — ссылки могли устареть от pull во время диалога)
  ensureBatchModel(it);
  const b = batchId ? it.batches.find(x=>x.id===batchId) : it.batches[0];
  if(!b){ toast("Источник изменился — повторите"); render(); return; }
  // списываем с источника
  b.qty = roundQty(b.qty - amount);
  // мерджим в партию назначения с ТЕМ ЖЕ сроком (чтобы не плодить дубли), иначе создаём новую
  let dst = it.batches.find(x=>x!==b && (x.location||"")===dest && (x.expiry||"")===srcExpiry);
  if(dst) dst.qty = roundQty(dst.qty + amount);
  else it.batches.push({ id:uid(), qty:amount, expiry:srcExpiry, location:dest, note:"", createdAt:new Date().toISOString() });
  if(roundQty(b.qty)<=0) it.batches = it.batches.filter(x=>x.id!==b.id);
  finalizeBatchMutation(it);   // пересчёт агрегатов; если партий не осталось — вернёт legacy-вид
  logOp("MOVE", `${it.name}: ${fmtQty(amount)} ${it.unit||""} «${srcLocation||"—"}» → «${dest}»${srcExpiry?` (срок ${fmtDate(srcExpiry)})`:""}`);
  saveState(); closeSheet(); render();
  toast(`Перенесено в «${dest}»`);
}

// сколько записей журнала ссылается на карточку (один проход по всем видам журнала)
function journalOpsForProduct(id){
  let n = 0;
  if(!id || !state.journals) return 0;
  for(const k of JOURNAL_KEYS){
    for(const op of (state.journals[k]||[])) if(op && op.productId===id) n++;
  }
  return n;
}

/* Удаление карточки склада.
   Раньше отсюда КАСКАДОМ вычищались записи журнала: tombJr на каждую найденную, а
   cloudPushNow превращает надгробия в настоящие DELETE в облаке. Но локально лежит лишь
   ХВОСТ журнала (см. journalLooksIncomplete: облачная база, усечение по памяти, кап) —
   то есть у ВСЕЙ бригады удалялась случайная его часть, а остальное возвращалось pull-ом
   уже без карточки. Движения — общая запись бригады, они карточку переживают.
   Связка разорвана: журнал по умолчанию остаётся. Удалить его можно, но только отдельным
   явным выбором и только там, где локальный журнал заведомо полон, — иначе выбор означал бы
   «удалить непредсказуемую часть чужих записей».
   Совместимость: ключи localStorage, формат бэкапа и облачный payload не тронуты. */
async function deleteStock(id){
  if(!ensureCanEdit()) return;
  const before = state.stock.find(s=>s.id===id);
  if(!before) return;
  const name = before.name || "";
  const linked = journalOpsForProduct(id);
  let dropJournal = false;
  if(linked > 0 && !journalLooksIncomplete()){
    const choice = await chooseSheet(
      `Удалить «${name}»?\nЗаписей в журналах: ${linked}`,
      [
        { label:"Удалить только карточку", value:"card", color:"btn-danger" },
        { label:`Удалить и записи журнала (${linked})`, value:"all", color:"btn-warn" },
      ]
    );
    if(!choice) return;
    dropJournal = choice==="all";
  } else {
    const tail = linked
      ? `\nЗаписей в журналах: ${linked} — они останутся: это общий учёт движений бригады.`
      : "";
    if(!await confirmSheet(`Удалить «${name}»?${tail}`,{danger:true,yes:"Удалить"})) return;
  }
  // ссылка снята ДО await — pull или другая вкладка могли удалить позицию, пока висел вопрос
  if(!state.stock.some(s=>s.id===id)){ toast("Позиция уже удалена"); closeSheet(); render(); return; }
  state.stock = state.stock.filter(s=>s.id!==id);
  let removed = 0;
  if(dropJournal && state.journals){
    JOURNAL_KEYS.forEach(k=>{
      if(Array.isArray(state.journals[k])){
        state.journals[k].forEach(op=>{ if(op.productId===id){ tombJr(op.id); removed++; } });   // надгробия — чтобы удалённые записи не воскресли pull-ом
        state.journals[k] = state.journals[k].filter(op=> op.productId!==id);
      }
    });
  }
  logOp("STOCK_DEL", name + (removed?` (и ${removed} в журналах)`:""));
  saveState(); closeSheet(); render();
}

/* ---------- Места хранения: управление ---------- */
function locationUsageCount(type, name){
  let n = 0;
  for(const s of state.stock){
    if(s.type!==type) continue;
    if((s.location||"")===name) n++;
    for(const b of (s.batches||[])) if((b.location||"")===name) n++;
  }
  return n;
}
/* Спросить и проверить имя нового места хранения. Возвращает готовое имя или null (отказ/невалидно).
   Пролог был продублирован дословно в addLocation и addLocChip. */
async function askNewLocationName(type){
  if(!ensureCanEdit()) return null;
  const val = await promptSheet(`Новое место хранения (${typeMeta(type).label})`, "", {title:"Добавить место"});
  if(val===null) return null;
  const name = String(val).trim();
  if(!name){ toast("Пустое название"); return null; }
  if(!validShortName(name)) return null;
  return name;
}
async function addLocation(type){
  const name = await askNewLocationName(type);
  if(name===null) return;
  const list = state.locations[type] || [];
  if(list.includes(name)){ toast("Уже есть"); return; }
  state.locations[type] = [...list, name];
  tombRevive(state.delLoc, type, name);   // снова добавили — снимаем надгробие, если было
  logOp("LOC_ADD", `${type}: «${name}»`);
  saveState(); render();
  toast("Место добавлено");
}
// «＋ Место» прямо в форме позиции: добавляет место под ТЕКУЩУЮ базу и выбирает его, НЕ пересобирая форму
// (иначе терялся бы уже введённый текст). Пустой список — норма: места у каждой базы свои, добавляются здесь.
async function addLocChip(btn, type){
  const name = await askNewLocationName(type);
  if(name===null) return;
  const list = state.locations[type] || [];
  if(!list.includes(name)){ state.locations[type] = [...list, name]; tombRevive(state.delLoc, type, name); logOp("LOC_ADD", `${type}: «${name}»`); saveState(); }
  const row = btn.parentNode; if(!row) return;
  let chip=null; row.querySelectorAll(".chip").forEach(c=>{ if(c.getAttribute("data-loc")===name) chip=c; });
  if(!chip){ chip = document.createElement("button"); chip.type="button"; chip.className="chip"; chip.setAttribute("data-loc", name); chip.setAttribute("onclick", CHIP_PICK); chip.textContent = name; row.insertBefore(chip, btn); }
  row.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
  chip.classList.add("active");
}
async function renameLocation(type, oldName){
  if(!ensureCanEdit()) return;
  const val = await promptSheet(`Переименовать «${oldName}»`, oldName, {title:"Переименовать"});
  if(val===null) return;
  const newName = String(val).trim();
  if(!newName || newName===oldName) return;
  if(!validShortName(newName)) return;
  const list = state.locations[type] || [];
  if(list.includes(newName)){ toast("Такое место уже есть"); return; }
  state.locations[type] = list.map(x => x===oldName ? newName : x);
  tombRevive(state.delLoc, type, newName); tombAdd(state.delLoc, type, oldName);   // новое имя живо, старое — в надгробия (распространить переименование)
  // каскад: все карточки нужного типа + их партии + журнальные batchLocation
  let touched = 0;
  for(const s of state.stock){
    if(s.type!==type) continue;
    if((s.location||"")===oldName){ s.location = newName; touched++; }
    for(const b of (s.batches||[])) if((b.location||"")===oldName){ b.location = newName; touched++; }
    if(hasBatches(s)) syncItemFromBatches(s);
  }
  for(const k of JOURNAL_KEYS){
    for(const op of (state.journals[k]||[])){
      if(op && op.batchLocation===oldName){ op.batchLocation = newName; touched++; }
    }
  }
  logOp("LOC_RENAME", `${type}: «${oldName}» → «${newName}» (${touched} связей)`);
  saveState(); render();
  toast(`Переименовано (${touched} ссылок)`);
}
async function deleteLocation(type, name){
  if(!ensureCanEdit()) return;
  const cnt = locationUsageCount(type, name);
  if(cnt>0){
    const ok = await confirmSheet(
      `«${name}» используется в ${cnt} позициях/партиях. Удалить место и очистить ссылки (location станет пустым)?`,
      {danger:true,yes:"Удалить и очистить"}
    );
    if(!ok) return;
    for(const s of state.stock){
      if(s.type!==type) continue;
      if((s.location||"")===name) s.location = "";
      for(const b of (s.batches||[])) if((b.location||"")===name) b.location = "";
      if(hasBatches(s)) syncItemFromBatches(s);
    }
  } else {
    if(!await confirmSheet(`Удалить место «${name}»?`,{danger:true,yes:"Удалить"})) return;
  }
  state.locations[type] = (state.locations[type]||[]).filter(x=>x!==name);
  tombAdd(state.delLoc, type, name);   // надгробие → удаление распространится на устройства, union не вернёт обратно
  logOp("LOC_DEL", `${type}: «${name}» (${cnt} связей очищено)`);
  saveState(); render();
  toast("Место удалено");
}

async function renameCategory(type, oldName){
  if(!ensureCanEdit()) return;
  const next = await promptSheet("Новое название:", oldName, {title:"Переименовать категорию"});
  if(next===null) return;
  const nextT = (next||"").trim(); if(!nextT || nextT===oldName) return;
  const arr = state.categories[type];
  const i = arr.indexOf(oldName); if(i<0) return;
  if(arr.includes(nextT) && nextT!==oldName){ toast("Уже есть"); return; }
  arr[i] = nextT;
  tombRevive(state.delCat, type, nextT); tombAdd(state.delCat, type, oldName);   // распространить переименование категории
  state.stock.forEach(s=>{ if(s.type===type && s.category===oldName) s.category=nextT; });
  logOp("CAT_RENAME", `${oldName} → ${nextT}`);
  saveState(); openCategoriesEdit(); render();
}
async function deleteCategory(type, name){
  if(!ensureCanEdit()) return;
  const cnt = state.stock.filter(s=>s.type===type && s.category===name).length;
  const msg = cnt>0
    ? `В категории «${name}» ${cnt} позиций. Перенести в «Прочее» и удалить?`
    : `Удалить пустую категорию «${name}»?`;
  if(!await confirmSheet(msg,{danger:true,yes:"Удалить"})) return;
  state.categories[type] = state.categories[type].filter(c=>c!==name);
  tombAdd(state.delCat, type, name);   // надгробие → удаление категории распространится, union не вернёт
  const fallback = type==="product" ? "Прочие продукты" : "Прочее";  // household/tool → «Прочее»
  if(!state.categories[type].includes(fallback)){ state.categories[type].push(fallback); tombRevive(state.delCat, type, fallback); }
  state.stock.forEach(s=>{ if(s.type===type && s.category===name) s.category=fallback; });
  if(stockCat===name) stockCat="";
  logOp("CAT_DEL", name);
  saveState(); openCategoriesEdit(); render();
}

function ensureChecklist(){
  if(!state.checklists || typeof state.checklists!=="object") state.checklists = { kitchen: [] };
  if(!Array.isArray(state.checklists.kitchen)) state.checklists.kitchen = [];
  for(const c of state.checklists.kitchen){ if(c && typeof c==="object") c.id = safeId(c.id); }
}
/* Чек-лист кухни правит state и уходит в общий бэкап базы, поэтому запирается тем же ensureCanEdit,
   что и склад. ВАЖНАЯ ОГОВОРКА, чтобы не выдавать желаемое за действительное: у чек-листа НЕТ
   серверной стороны — он не входит в блоб настроек базы (push шлёт только locations/categories и
   надгробия) и не синхронизируется вовсе. Значит, здесь клиентская проверка — единственная, и
   защищает она не общие данные бригады, а совпадение поведения с интерфейсом: ниже, в renderKitchen,
   роль без прав видит чек-лист только для чтения, и вызов из консоли теперь ведёт себя так же. */
function toggleCheck(id, done){
  if(!ensureCanEdit()){ render(); return; }   // render — вернуть галочке фактическое состояние, если её уже перещёлкнул браузер
  ensureChecklist();
  const c = state.checklists.kitchen.find(x=>x.id===id); if(!c) return;
  c.done = done; saveState();
}
function addCheck(){
  if(!ensureCanEdit()) return;
  ensureChecklist();
  const inp = document.getElementById("ckNew");
  const t = inp.value.trim(); if(!t) return;
  state.checklists.kitchen.push({id:uid(),text:t,done:false});
  saveState(); render();
}
function removeCheck(id){
  if(!ensureCanEdit()) return;
  ensureChecklist();
  state.checklists.kitchen = state.checklists.kitchen.filter(x=>x.id!==id);
  saveState(); render();
}
function resetChecklist(){
  if(!ensureCanEdit()) return;
  ensureChecklist();
  state.checklists.kitchen.forEach(c=>c.done=false);
  saveState(); render();
}

  { const _nu = notifUnread(); acc.push(row("Уведомления","openNotifs()",{ val: _nu ? String(_nu) : "" })); }
  if(activeCloudId() && cloud.profile) acc.push(row("Резервная почта","openRecoveryEmailSheet()",{ val: cloud.profile.recovery_email_verified ? "✓ подтв." : (cloud.profile.recovery_email ? "не подтв." : "не задана") }));
  if(canManageBase()) acc.push(row("Работники и роли","openMembersSheet()"));
  if(canManageOrgRoles()) acc.push(row("Роли по регионам","openOrgRolesSheet()"));
  if(canSeeAllBases()) acc.push(row("Сводка по всем базам","openAllBasesSheet()"));
  if(isOwner) acc.push(row("Выдача доступа к базам","openGrantBasesSheet()",{ sub:"несколько баз одному логину" }));
  if(isOwner) acc.push(row("Рассылка уведомлений","openBroadcastSheet()"));

  const data = [];
  if(canReconcileStock()){
    // на облачной базе (журнал заведомо неполный) остаётся ровно одно действие — склейка дублей;
    // называем строку по делу, чтобы человек не искал в ней исправление остатков
    const _jrInc = journalLooksIncomplete();
    data.push(_jrInc
      ? row("Объединить дубли склада","openStockReconcileSheet()",{ sub:"одинаковые карточки: имя + единица" })
      : row("Сверка склада по журналу","openStockReconcileSheet()",{ sub:"дубли и пропущенные поступления" }));
  }
  if(canEditStock()){
    data.push(row("Места хранения","openLocationsEdit()"));
    data.push(row("Категории","openCategoriesEdit()"));
  }
  /* Обе строки ведут в ОДИН раздел «Файлы» — к своей группе внутри него. Названия оставлены
     прежними намеренно: владелец ищет глазами «Резервная копия», и переименовать её в «Файлы»
     значит отобрать у него привычный путь. Двух разных мест с одним смыслом при этом нет:
     прежние листы больше не открываются, openExportSheet/openBackupSheet — переходники сюда же. */
  data.push(row("Экспорт в Excel","openFiles('Export')",{ sub:"выгрузить склад и историю в файл" }));
  data.push(row("Резервная копия","openFiles('Backup')",{ sub:"сохранить базу целиком и восстановить" }));
  if(canEditStock()) data.push(row("Загрузка накладной из Excel","openFiles('Import')",{ sub:"приход по файлу вместо ручного ввода" }));
  // опись — соседняя строка с накладной: оба входа в «Файлы», но операции разные (задать ≠ добавить)
  if(canInventoryStock()) data.push(row("Загрузка описи склада","openFiles('Inventory')",{ sub:"инвентаризация по файлу" }));
  if(profiles.list.length>1 && !restricted && isOwner) data.push(row("Общий каталог баз","mergeCatalogs()"));
  data.push(row("Журнал операций","openJournalSheet()"));

  data.push(row("Память телефона","openStorageSheet()",{ sub:"сколько занимают базы" }));

  const about = [
    row("Проверить обновление","checkForUpdate()",{ sub:"сборка "+APP_BUILD }),
    row("О программе","openAboutSheet()"),
    row("Помощь и частые вопросы","openFaqSheet()"),
    row("Конфиденциальность","openPrivacySheet()"),
    row("Условия использования","openTermsSheet()"),
    activeCloudId() ? row("Обновить базу из облака","wipeAll()") : row("Сбросить все данные","wipeAll()",{cls:"danger"}),
  ];

  v.innerHTML = `
    <div class="prof-hd">
      <div class="prof-av">${esc((bn.trim()[0]||"Б").toUpperCase())}</div>
      <div style="min-width:0"><div class="font-bold text-lg truncate">${esc(bn)}</div>
      <div class="text-xs opacity-70">${baseLocked?"Ваша база":`Баз на устройстве: ${nBases}`}</div></div>
    </div>
    ${group("Аккаунт и база", acc)}
    ${group("Данные", data)}
    <div class="set-group"><div class="set-head">Внешний вид</div>
      <div class="grid grid-cols-3 gap-2">
        <button class="btn ${state.theme==="light"?"btn-primary":"btn-ghost"}" onclick="setTheme('light')">Светлая</button>
        <button class="btn ${state.theme==="dark"?"btn-primary":"btn-ghost"}" onclick="setTheme('dark')">Тёмная</button>
        <button class="btn ${state.theme==="system"?"btn-primary":"btn-ghost"}" onclick="setTheme('system')">Системная</button>
      </div>
    </div>
    ${group("О программе", about)}
    <div class="text-center opacity-50 text-xs py-4">${APP_IS_BETA ? `ВахтаХоз БЕТА · сборка ${APP_BUILD} · тестовый канал` : `ВахтаХоз · офлайн PWA · сборка ${APP_BUILD}`}</div>
  `;
}

/* ---------- Экран «Ещё»: шиты разделов и официальные страницы ---------- */
function openCloudSheet(){ try{ openSheet(`<div class="font-bold text-xl mb-3">Облако и синхронизация</div>${(typeof cloudCardHtml==="function")?cloudCardHtml():""}`); }catch(_){ toast("Недоступно"); } }
/* ---------- Раздел «Файлы»: всё, что приходит файлом и уходит файлом ----------
   БЫЛО ТРИ РАЗНЫХ МЕСТА, и главное из них пряталось. «Импорт накладной» жил ВНУТРИ режима
   «Поступление» на «Складе»: переключи режим, промотай список вниз, нажми «Импорт поступления
   из Excel» — и только там, уже внутри листа, «Скачать шаблон .xlsx». Кто не знал, что импорт
   вообще существует, тот его не находил. «Экспорт в Excel» и «Резервная копия» были двумя
   отдельными листами в «Ещё», и связь между ними («и то и другое — работа с файлами») нигде
   не была видна. Теперь один экран, сгруппированный по смыслу: загрузить → выгрузить → копия.

   ОПЕРАЦИИ НЕ ПЕРЕПИСАНЫ. Экран зовёт ровно те же функции, что и прежние входы:
   downloadReceiptTemplate / importReceiptsExcel / exportXlsx / exportCsv / exportXlsxFiltered /
   exportData / exportAllProfiles / importData. Это новый вход, а не новая реализация.

   ПРАВА повторены с прежних входов один в один, ничего не ослаблено и не ужесточено:
     • группа «Загрузить из файла» рисуется при canEditStock() — это гейт openReceiptImportSheet
       (ensureCanEdit); сам importReceiptsExcel зовёт ensureCanEdit ещё раз, и это остаётся;
     • «Сохранить ВСЕ базы» — при !isRestrictedUser(), как в прежнем openBackupSheet;
     • «Восстановить из файла» показываем всем, как и было: кто что может, решает разбор внутри
       importData (isRestrictedUser для файла «все базы»; ensureCanEdit + canImportToBase для
       файла базы), и решает он там же и так же;
     • выгрузка не гейтится вовсе — как и в прежнем openExportSheet.
   Поэтому у роли без прав экран не пустой: она видит выгрузку и копию, а импорт просто не
   нарисован — заглушки «недоступно» на весь экран здесь нет намеренно.

   ВХОДЫ. Прежний «Импорт поступления из Excel» на «Складе» остался как был (владелец к нему
   привык). Строки в «Ещё» и кнопка в «Памяти телефона» больше не открывают старые листы, а
   ведут сюда — иначе получилось бы два разных места с одним смыслом. Сами openExportSheet /
   openBackupSheet оставлены переходниками: они экспортированы в window и вызываются из
   разметки, и тихо убрать их значит оставить в сборке мёртвые onclick. */
let _filesBack = "more";     // куда вернёт «‹»: откуда пришли, а не всегда на дашборд
let _filesAnchor = null;     // к какой группе подкрутить ПОСЛЕ отрисовки; расходуется один раз
/* anchor — "Import" | "Export" | "Backup" (кусок id группы) либо ничего (тогда наверх).
   Расходуется однократно: render() зовут и пул из облака, и сам импорт по завершении, и
   прокручивать экран под рукой у человека на каждый такой вызов нельзя. */
function openFiles(anchor){
  if(gateOpen()) return;
  if(currentView!=="files") _filesBack = currentView;
  _filesAnchor = anchor || "Top";
  nav("files");
}
function closeFiles(){ nav(_filesBack||"more"); }
/* Переходники со старых имён. Прежние листы удалены, но имена остались в window и в разметке
   («Память телефона» → «Резервная копия»). Ведут туда же, куда строки в «Ещё». */
function openExportSheet(){ openFiles("Export"); }
function openBackupSheet(){ openFiles("Backup"); }

function renderFiles(){
  const v = document.querySelector('[data-view="files"]'); if(!v) return;
  const canEdit    = canEditStock();
  const restricted = isRestrictedUser();
  const canImp     = canImportToBase();
  const cloudBase  = !!activeCloudId();
  const mb = Math.round(IMP_MAX_BYTES/1024/1024);
  const grp = (id, head, body) => `<div class="set-group" id="filesGrp${id}"><div class="set-head">${esc(head)}</div><div class="card space-y-2">${body}</div></div>`;

  /* 1. ЗАГРУЗИТЬ. Тут же и бланк, и выбор файла: раньше бланк лежал внутри листа, который сам

  const gImport = !canEdit ? "" : grp("Import", "Загрузить из файла", `
    <div class="text-sm opacity-80">Приход по накладной или по счёту от поставщика — Excel вместо ручного ввода. Приложение прочитает файл, покажет списком, что нашло, и спросит подтверждение.</div>
    <div class="text-sm"><b>Принятое ДОБАВИТСЯ к остаткам на складе.</b> Ничего не заменяется и не пропадает.</div>

    <label class="btn btn-primary w-full">${ico("outbox",18)} Выбрать файл<input type="file" multiple accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden" onchange="importReceiptsExcel(event)"></label>
    <div id="impReceiptOut" class="text-sm whitespace-pre-line opacity-80"></div>
    <div class="text-xs opacity-70">Файл поставщика (УПД, счёт-фактура) подойдёт как есть, переделывать не нужно: наименование, количество, единицу и дату приложение возьмёт само. Можно выбрать сразу несколько файлов — до ${IMP_MAX_FILES}, всего до ${IMP_MAX_ROWS} строк, каждый до ${mb} МБ.</div>`);

  /* 2. ОПИСЬ. Стоит ОТДЕЛЬНОЙ группой рядом с накладной, а не внутри неё: операции соседние по
     виду («залил файл»), но противоположные по смыслу — накладная ДОБАВЛЯЕТ к остатку, опись
     ЗАДАЁТ остаток. Смешать их в одном блоке значит однажды получить приход вместо пересчёта.
     Группа рисуется только при праве (нач. участка и выше на общей базе) — см. canInventoryStock. */
  const gInv = !canInventoryStock() ? "" : grp("Inventory", "Загрузка описи склада", `
    <div class="text-sm opacity-80">Пересчитали склад руками — внесите результат файлом, а не по одной позиции. Приложение сверит файл с учётом и покажет, что изменится, до того как что-то менять.</div>
    <div class="text-sm"><b>Опись ЗАДАЁТ остаток, а не добавляет.</b> Позиции, которых в файле нет, остаются нетронутыми: пустая строка — это «не проверяли», а не «ноль».</div>
    <button class="btn btn-ghost w-full" onclick="downloadInventoryTemplate()">${ico("inbox",18)} Скачать бланк описи .xlsx</button>
    <div class="text-xs opacity-70">В бланке уже стоит весь ваш склад — остаётся вписать столбец «Фактический остаток». Названия набирать не нужно: от опечатки заводится новая карточка вместо правки старой. Столбцы: Тип · Наименование · Ед. изм. · Фактический остаток · Место · Срок годности · Примечание.</div>
    <label class="btn btn-primary w-full">${ico("outbox",18)} Выбрать файл описи<input type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden" onchange="importInventoryExcel(event)"></label>
    <div id="invOut" class="text-sm"></div>
    <div class="text-xs opacity-70">Ничего не запишется, пока вы не нажмёте «Применить опись» на разборе. Позиции с партиями (срок годности) опись не трогает — их правят вручную. Всё изменённое уйдёт в журнал пачкой с пометкой «Опись» и датой.</div>`);

  /* 3. ВЫГРУЗИТЬ. Прежний openExportSheet: те же три действия и тот же порядок. */
  const gExport = grp("Export", "Выгрузить в файл", `

    <button class="btn btn-ghost w-full" onclick="exportCsv()">Только склад — .csv</button>

    <div class="text-xs opacity-70">«Часть» — срез по месту хранения, категории, сроку годности и наличию: например, только просроченное на складе А.</div>`);

  /* 4. КОПИЯ. Прежний openBackupSheet целиком, вместе с восстановлением и обеими подсказками
     про общую базу; текст переписан на человеческий, состав и права — прежние. */
  const gBackup = grp("Backup", "Резервная копия", `
    <div class="text-sm opacity-80">На случай, если телефон потеряют, разобьют или сбросят. Файл .json открывать не нужно — он только для восстановления. Делайте копию регулярно.</div>
    <button class="btn btn-primary w-full" onclick="exportData()">${ico("inbox",18)} Сохранить эту базу</button>

    <div class="text-xs opacity-70">${restricted

      : "«Эту базу» — только ту, что открыта сейчас. «Все базы» — один файл со всеми базами телефона: это главная страховка, с него восстанавливается всё."}</div>
    <label class="btn btn-ghost w-full">Восстановить из файла<input type="file" accept="application/json" class="hidden" onchange="importData(event)"></label>
    <div class="text-xs opacity-70">${restricted
      ? "Приложение проверит файл и спросит подтверждение, прежде чем что-то менять."
      : "Подходит любой из этих двух файлов — приложение само разберётся, какой из них дали, и спросит подтверждение."}</div>
    ${cloudBase?`<div class="text-xs opacity-70">${canImp
      ? "База общая: то, что вы зальёте из файла, увидит вся бригада. Файл «все базы» остаётся на этом телефоне и в облако не уходит."
      : "Заливать файл поверх общей базы приложение даёт начальнику участка и выше: ошибиться файлом легко, а отката нет. Файл «все базы» на этом телефоне восстановить можно — в облако он не уходит."}</div>`:""}`);

  v.innerHTML = `
    <div class="flex items-center gap-2">
      <!-- min-width:44 — тап-цель. Высоту 52 даёт .btn, а ширину задаёт содержимое: у одного
           знака «‹» с полями 12+12 выходило 30px, и попасть по кнопке большим пальцем в рукавице
           нельзя. Тот же промах есть у кнопки «Назад» в «Уведомлениях» (см. отчёт). -->
      <button class="btn btn-ghost" style="padding:8px 12px;min-width:44px;flex:0 0 auto" onclick="closeFiles()" aria-label="Назад">‹</button>
      <div class="font-bold text-xl" style="flex:1;min-width:0">Файлы</div>
    </div>
    <div class="text-sm opacity-70">Здесь всё, что приходит файлом и уходит файлом.</div>
    ${gImport}${gInv}${gExport}${gBackup}`;

  /* Разобранная, но ещё не подтверждённая опись переживает перерисовку. render() зовут и pull
     из облака, и любая правка склада — без этого предпросмотр, который человек в этот момент
     читает, молча исчезал бы с экрана, а план оставался бы в памяти невидимым. */
  if(_invPending && document.getElementById("invOut")){
    try{ document.getElementById("invOut").innerHTML = _invPreviewHtml(_invPending); }catch(_){}
  }

  /* Подкрутка к нужной группе — только когда пришли по строке, которая её и обещала («Резервная
     копия» лежит ниже сгиба на 320px, и человек, нажавший её, должен увидеть именно её).

  if(_filesAnchor){

    requestAnimationFrame(()=>{
      try{
        const el = a==="Top" ? null : document.getElementById("filesGrp"+a);
        if(el) el.scrollIntoView({ block:"start" }); else scrollTo(0,0);
      }catch(_){}
    });
  }

function openJournalSheet(){ const _log=(typeof visibleLog==="function")?visibleLog():[]; openSheet(`

function openBroadcastSheet(){ openSheet(`
  <div class="font-bold text-xl mb-3">Рассылка уведомлений</div>

  <textarea id="bcBody" class="input mb-2" style="min-height:120px;resize:vertical;padding-top:12px" placeholder="Текст уведомления" maxlength="5000"></textarea>
  <button class="btn btn-primary w-full" onclick="sendBroadcast()">Отправить всем</button>`); }
async function sendBroadcast(){
  const s=(document.getElementById("bcSubj").value||"").trim();
  const b=(document.getElementById("bcBody").value||"").trim();
  if(!s||!b){ toast("Укажите тему и текст"); return; }
  if(!await confirmSheet(`Отправить уведомление «${s}» всем пользователям на почту?`,{yes:"Отправить",title:"Рассылка"})) return;
  toast("Отправка…");
  try{ const d=await cloudCallFn("broadcast",{subject:s,body:b}); toast(`Отправлено: ${d.sent||0} из ${d.total||0}`); }
  catch(e){ toast("Не удалось: "+(e.message||"проверьте интернет")); }
}
/* Сколько места занято на телефоне. Причина появления: у человека на вахте не переключалась база,
   и понять «почему» было нечем — сообщение про память есть, а цифр нет. Считаем по ключам:
   активная база (STORE_KEY), снимки остальных (slotKey), задачи и служебные ключи. */
/* РАЗБИВКА «служебных данных». Раньше это была одна строка с числом — на телефоне владельца
   она показывала 2.3 МБ из 5.5 занятых, и по ней нельзя было понять ни что это, ни что с этим
   делать. Считаем по группам, потому что группы ведут себя по-разному: снимки синхронизации
   восстанавливаются сами, «остатки удалённых баз» не восстанавливаются никогда и никому не
   видны, а сессия весит десятки байт и трогать её бессмысленно. */
function _knownCids(){
  const s = new Set();
  for(const p of profiles.list){ if(p.cloudId) s.add(p.cloudId); if(p.fromCloudId) s.add(p.fromCloudId); }
  return s;
}
function storageReport(){
  const out = { bases:[], groups:{sync:0,tasks:0,session:0,other:0}, junk:{slots:0,sync:0,dupe:0,keys:[]},
                service:0, total:0, live:0 };
  let keys=[]; try{ keys=Object.keys(localStorage); }catch(_){ return out; }
  const sizeOf = k => { try{ const v=localStorage.getItem(k); return v? (k.length+v.length)*2 : 0; }catch(_){ return 0; } };  // UTF-16: 2 байта на символ
  const slotIds = new Set(profiles.list.map(p=>p.id));
  const cids = _knownCids();
  const SIG = NS+"vahtahoz_sig_", DIRTY = NS+"vahtahoz_dirty_", SLOT = STORE_KEY+"::";
  const TASKS_SET = new Set([TASKS_KEY, TASKS_DIRTY, TASKS_OWNER]);
  const SESS_SET  = new Set([NS+"vahtahoz_sess", NS+"vahtahoz_auth", GATES_KEY,
                             NS+"vahtahoz_cloud_owner", NS+"vahtahoz_onboarded"]);
  for(const k of keys){
    const b = sizeOf(k); out.total += b;
    if(k===STORE_KEY) continue;                                  // активная база — отдельной строкой ниже
    if(k.startsWith(SLOT)){
      // Слот базы, которой нет в списке: открыть её нечем, выгрузить нечем — она недостижима.
      if(!slotIds.has(k.slice(SLOT.length))){ out.junk.slots += b; out.junk.keys.push(k); }
      continue;                                                  // свои слоты посчитаны как базы
    }
    if(k.startsWith(SIG) || k.startsWith(DIRTY)){
      const isSig = k.startsWith(SIG);
      const rest = isSig ? k.slice(SIG.length) : k.slice(DIRTY.length);
      const kind = isSig ? rest.slice(0, rest.indexOf("_")) : "";
      const cid  = isSig ? rest.slice(rest.indexOf("_")+1) : rest;
      if(kind==="tasks"){ out.groups.tasks += b; continue; }      // подписи задач — к задачам
      if(!cids.has(cid)){ out.junk.sync += b; out.junk.keys.push(k); continue; }
      if(_dupeAllowedKey(cid, kind)){ out.junk.dupe += b; out.junk.keys.push(k); continue; }
      out.groups.sync += b; continue;
    }
    if(TASKS_SET.has(k)){ out.groups.tasks += b; continue; }
    if(SESS_SET.has(k)){ out.groups.session += b; continue; }
    out.groups.other += b;                                       // список баз, флаги, всё прочее
  }
  out.live = sizeOf(STORE_KEY);
  for(const p of profiles.list){
    const isActive = p.id===profiles.activeId;
    out.bases.push({ name:p.name||"без имени", active:isActive, bytes: isActive ? out.live : sizeOf(slotKey(p.id)) });
  }
  out.service = out.groups.sync+out.groups.tasks+out.groups.session+out.groups.other
              + out.junk.slots+out.junk.sync+out.junk.dupe;
  return out;
}
// allowed-снимок, побайтово равный основному (наследство сборок до v245, см. saveAllowedSig).
// Читается только ограниченной по типам ролью, и там его отсутствие — штатное состояние.
function _dupeAllowedKey(cid, kind){
  const base = kind==="stockAllowed" ? "stock" : kind==="jrAllowed" ? "jr" : null;
  if(!base) return false;
  try{
    const a = localStorage.getItem(`${NS}vahtahoz_sig_${kind}_${cid}`);
    return !!a && a === localStorage.getItem(`${NS}vahtahoz_sig_${base}_${cid}`);
  }catch(_){ return false; }
}
function fmtBytes(n){ return n>=1048576 ? (n/1048576).toFixed(1)+" МБ" : Math.round(n/1024)+" КБ"; }
function openStorageSheet(){
  const r = storageReport();
  // Телефоны дают около 5 МБ на сайт — это не наш выбор, а ограничение браузера, поэтому и порог такой.
  const LIMIT = 5*1024*1024;
  const pct = Math.min(100, Math.round(r.total/LIMIT*100));
  const free = r.junk.slots + r.junk.sync + r.junk.dupe;
  // Строки внутри «служебных»: показываем только заметные (от 20 КБ) — иначе список из десятка
  // строк по 40 байт прячет ту единственную, из-за которой на телефоне кончилось место.
  const svc = [
    ["Снимки синхронизации", r.groups.sync, "нужны, чтобы в облако уходило только изменённое"],
    ["Задачи и расписание",  r.groups.tasks, ""],
    ["Вход и настройки",     r.groups.session + r.groups.other, ""],
    ["Остатки удалённых баз", r.junk.slots, "недоступны из приложения — можно удалить"],
    ["Лишние служебные снимки", r.junk.sync + r.junk.dupe, "восстановятся при синхронизации"],
  ].filter(x=>x[1] >= 20*1024).map(x=>`
    <div class="flex items-start justify-between py-1 pl-3 text-sm opacity-60">
      <div class="truncate">· ${x[0]}${x[2]?`<div class="text-xs opacity-70">${x[2]}</div>`:""}</div>
      <div style="white-space:nowrap">${fmtBytes(x[1])}</div>
    </div>`).join("");
  const rows = r.bases.sort((a,b)=>b.bytes-a.bytes).map(b=>`
    <div class="flex items-center justify-between py-1 border-b border-white/5">
      <div class="truncate">${esc(b.name)}${b.active?' <span class="text-xs opacity-60">(открыта)</span>':""}</div>
      <div class="text-sm opacity-80" style="white-space:nowrap">${fmtBytes(b.bytes)}</div>
    </div>`).join("");
  openSheet(`
    <div class="font-bold text-xl mb-3">Память телефона</div>
    <div class="text-sm opacity-70 mb-2">Занято ${fmtBytes(r.total)} из примерно ${fmtBytes(LIMIT)} — это ${pct}%.
      Когда места не хватает, база не переключается и новые записи не сохраняются.</div>
    <div class="mb-3">${rows}
      <div class="flex items-center justify-between py-1 opacity-70 border-t border-white/10 mt-1 pt-2">
        <div>Служебные данные</div><div class="text-sm" style="white-space:nowrap">${fmtBytes(r.service)}</div>
      </div>
      ${svc}
    </div>
    ${free>0?`<div class="text-sm" style="margin-bottom:10px">Можно освободить <b>${fmtBytes(free)}</b> без потери рабочих данных.</div>
      <button class="btn btn-primary w-full mb-2" onclick="freeStorageJunk()">Освободить ${fmtBytes(free)}</button>`:""}
    ${pct>=80?`<div class="text-sm" style="color:var(--danger);margin-bottom:10px">Места почти нет. Сделайте резервную копию и удалите базы, которые больше не нужны.</div>`:""}
    <div class="grid grid-cols-2 gap-2">
      <button class="btn btn-ghost" onclick="closeSheet();openBackupSheet()">Резервная копия</button>
      <button class="btn btn-ghost" onclick="closeSheet();openProfilesSheet()">Базы на устройстве</button>
    </div>`);
}
/* Уборка. Удаляем ТОЛЬКО то, отсутствие чего доказуемо ничего не стоит:
   — снимки синхронизации баз, которых нет в списке (база удалена, снимки остались);
   — allowed-снимки, побайтово равные основным (см. saveAllowedSig);
   — слоты баз, которых нет в списке: открыть, переключить или выгрузить их нечем,
     они не видны ни в одном экране и не попадают в резервную копию.
   Слоты — единственное здесь, что не восстановится, поэтому про них спрашиваем отдельно
   и называем размер. Рабочие снимки живых баз не трогаем: без них следующая синхронизация
   гонит в облако весь склад и весь журнал — на вахтовом интернете это десятки минут. */
async function freeStorageJunk(){
  const r = storageReport();
  const cache = r.junk.sync + r.junk.dupe;
  if(r.junk.slots > 0){
    const ok = await confirmSheet(
      `Будет удалено ${fmtBytes(r.junk.slots)} остатков баз, которых больше нет в списке на этом телефоне. `+
      `Открыть или выгрузить их приложение не может — они не видны ни на одном экране и не входят в резервную копию. `+
      `Восстановить их после удаления будет нельзя.` +
      (cache ? `\n\nЗаодно уберём ${fmtBytes(cache)} служебных снимков — они восстановятся сами при следующей синхронизации.` : ""),
      { yes:"Удалить", no:"Отмена", title:"Освободить место" });
    if(!ok) return;
  }
  let freed = 0;
  for(const k of r.junk.keys){
    try{ const v = localStorage.getItem(k); localStorage.removeItem(k); freed += v ? (k.length+v.length)*2 : 0; }catch(_){}
  }
  _jrSigCache = null;                       // снимок журнала мог быть среди удалённых
  toast(freed ? `Освобождено ${fmtBytes(freed)}` : "Лишнего не нашлось");
  closeSheet(); openStorageSheet();
}
/* Проверить обновление вручную. Понадобилось после случая на вахте: исправление было выкачено,
   а телефон продолжал работать на старой сборке (слабая сеть — служебный обработчик отдавал
   версию из кэша), и человек упирался в уже исправленную ошибку. */
async function checkForUpdate(){
  if(!cloudOnline()){ toast("Нет интернета — обновление проверим позже"); return; }
  toast("Проверяю обновление…");
  try{
    // Кэш-бастер: без него телефон может получить ту же версию из кэша границы Cloudflare.
    const r = await fetch(location.pathname + "?upd=" + Date.now(), { cache:"no-store" });
    const txt = await r.text();
    const m = txt.match(/const APP_BUILD = "([^"]+)"/);
    const remote = m && m[1];
    if(!remote){ toast("Не удалось проверить обновление"); return; }
    if(remote === APP_BUILD){ toast("Установлена свежая сборка " + APP_BUILD); return; }
    if(!await confirmSheet(`Есть новая сборка ${remote} (сейчас ${APP_BUILD}). Обновить сейчас? Данные на телефоне не пострадают.`,
                           { yes:"Обновить", no:"Позже", title:"Обновление" })) return;
    try{ const reg = await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }catch(_){}
    setTimeout(()=>location.reload(), 400);
  }catch(e){ console.warn("checkForUpdate", e); toast("Не удалось проверить обновление"); }
}
