async function deleteBatch(itemId, batchId){
  if(!ensureCanEdit()) return;
  const it = state.stock.find(s=>s.id===itemId); if(!it) return;
  const b = (it.batches||[]).find(x=>x.id===batchId); if(!b) return;
  if(!await confirmSheet(`Удалить партию ${fmtQty(b.qty)} ${it.unit||""}${b.location?` (📍 ${b.location})`:""}${b.expiry?` (⏰ ${fmtDate(b.expiry)})`:""}?`,{danger:true,yes:"Удалить"})) return;
  // ссылки it/b сняты ДО await — pull во время подтверждения мог пересоздать объекты склада.
  // Без перерезолва мутация легла бы на «осиротевший» объект, а журнал получил бы ложную пометку «[партия удалена]».
  if(state.stock.find(s=>s.id===itemId)!==it || !(it.batches||[]).some(x=>x.id===batchId)){ toast("Данные обновились — повторите операцию"); render(); return; }
  // помечаем осиротевшие журнальные записи — чтобы editOp по ним выдавал предупреждение
  let orphans = 0;
  for(const k of JOURNAL_KEYS){
    for(const op of (state.journals[k]||[])){
      if(op && op.batchId===batchId){
        op.batchId = ""; orphans++;
        if(!String(op.note||"").includes("[партия удалена]")) op.note = (op.note?op.note+" ":"") + "[партия удалена]";
      }
    }
  }
  it.batches = it.batches.filter(x=>x.id!==batchId);
  finalizeBatchMutation(it);
  logOp("BATCH_DEL", `${it.name}: партия ${fmtQty(b.qty)} ${it.unit||""}${orphans?` (отвязано ${orphans} записей)`:""}`);
  saveState(); render();
  toast("Партия удалена");
}

/* ---------- Перенос на другое место хранения (часть/целиком, по партии со своим сроком) ---------- */
// гарантируем партийную модель: legacy-остаток (qty/expiry/location) превращаем в одну партию.
function ensureBatchModel(it){
  if(hasBatches(it)) return;
  const q = roundQty(it.qty||0);
  it.batches = q>0 ? [{ id:uid(), qty:q, expiry:it.expiry||"", location:it.location||"", note:"", createdAt:it.createdAt||new Date().toISOString() }] : [];
}
// диалог переноса. batchId="" → переносим позицию целиком (legacy/одна партия); иначе конкретную партию со своим сроком.
function openMove(itemId, batchId){
  if(!ensureCanEdit()) return;
  const it = state.stock.find(s=>s.id===itemId);
  if(!it){ toast("Позиция изменилась на другом устройстве"); render(); return; }
  let srcQty, srcExpiry, srcLocation;
  if(batchId){
    const b=(it.batches||[]).find(x=>x.id===batchId);
    if(!b){ toast("Партия изменилась — повторите"); render(); return; }
    srcQty=roundQty(b.qty||0); srcExpiry=b.expiry||""; srcLocation=b.location||"";
  } else {
    srcQty=totalQtyOf(it); srcExpiry=it.expiry||""; srcLocation=it.location||"";
  }
  if(!(srcQty>0)){ toast("Нечего переносить — остаток 0"); return; }
  const LOCS = batchLocs(it).filter(l=>l && l!==srcLocation);   // куда переносим (исключаем текущее место)
  const q = fmtQty(srcQty);
  openSheet(`
    <div class="space-y-3">
      <div class="font-bold text-xl">Перенести на другое место</div>
      <div class="text-sm opacity-70">«${esc(it.name)}»${srcExpiry?` · срок ${fmtDate(srcExpiry)}`:""}${srcLocation?` · из «${esc(srcLocation)}»`:" · место не указано"}. Доступно: ${q} ${esc(it.unit||"")}.</div>
      <div>
        <div class="text-sm opacity-70 mb-1">Сколько перенести (${esc(it.unit||"")})</div>
        <input class="input" id="mvq" type="number" inputmode="decimal" value="${q}" />
        <button class="btn btn-ghost w-full mt-1 text-sm" onclick="document.getElementById('mvq').value='${q}'">Перенести всё (${q})</button>
      </div>
      <div>
        <div class="text-sm opacity-70 mb-1">Куда (место хранения)</div>
        <div class="flex flex-wrap gap-2" id="mvLocs">${LOCS.length?LOCS.map(l=>`<button class="chip" data-loc="${esc(l)}" onclick="${CHIP_PICK}">${esc(l)}</button>`).join(""):'<span class="text-xs opacity-60">Других мест нет — добавьте место в «Места и категории»</span>'}</div>
      </div>
      <div class="flex gap-2 pt-2">
        <button class="btn btn-ghost flex-1" data-close>Отмена</button>
        <button class="btn btn-primary flex-1" onclick="doMove('${itemId}','${batchId||""}')">Перенести</button>
      </div>
    </div>
  `);
}
function doMove(itemId, batchId){
  if(!ensureCanEdit()) return;
  const body = document.getElementById("sheetBody");
  const it = state.stock.find(s=>s.id===itemId);
  if(!it){ closeSheet(); return; }
  const dest = body.querySelector(".chip.active[data-loc]")?.dataset.loc || "";
  if(!dest){ toast("Выберите место назначения"); return; }
  const amount = roundQty(parseNum(body.querySelector("#mvq").value));
  if(!(amount>0)){ toast("Количество должно быть > 0"); return; }
  // источник и доступное — резолвим БЕЗ конвертации, чтобы при отказе legacy-позиция не стала зря «партийной»
  let srcExpiry, srcLocation, available;
  if(batchId){
    const b0=(it.batches||[]).find(x=>x.id===batchId);
    if(!b0){ toast("Партия изменилась — повторите"); render(); return; }
    srcExpiry=b0.expiry||""; srcLocation=b0.location||""; available=roundQty(b0.qty||0);
  } else {
    srcExpiry=it.expiry||""; srcLocation=it.location||""; available=totalQtyOf(it);
  }
  if(dest===srcLocation){ toast("Это то же место хранения"); return; }
  if(amount>available){ toast(`Доступно только ${fmtQty(available)} ${it.unit||""}`); return; }
  // простую (бес-партийную) позицию целиком — просто меняем место, не плодя «партийность»
  if(!batchId && !hasBatches(it) && amount>=available){
    it.location=dest; it.updatedAt=new Date().toISOString();
    logOp("MOVE", `${it.name}: ${fmtQty(amount)} ${it.unit||""} «${srcLocation||"—"}» → «${dest}»${srcExpiry?` (срок ${fmtDate(srcExpiry)})`:""}`);
    saveState(); closeSheet(); render(); toast(`Перенесено в «${dest}»`); return;
  }
  // частичный перенос или партия → переводим в партийную модель и мутируем (резолв источника заново — ссылки могли устареть от pull во время диалога)
  ensureBatchModel(it);
  const b = batchId ? it.batches.find(x=>x.id===batchId) : it.batches[0];
  if(!b){ toast("Источник изменился — повторите"); render(); return; }
  // списываем с источника
  b.qty = roundQty(b.qty - amount);
  // мерджим в партию назначения с ТЕМ ЖЕ сроком (чтобы не плодить дубли), иначе создаём новую
  let dst = it.batches.find(x=>x!==b && (x.location||"")===dest && (x.expiry||"")===srcExpiry);
  if(dst) dst.qty = roundQty(dst.qty + amount);
  else it.batches.push({ id:uid(), qty:amount, expiry:srcExpiry, location:dest, note:"", createdAt:new Date().toISOString() });
  if(roundQty(b.qty)<=0) it.batches = it.batches.filter(x=>x.id!==b.id);
  finalizeBatchMutation(it);   // пересчёт агрегатов; если партий не осталось — вернёт legacy-вид
  logOp("MOVE", `${it.name}: ${fmtQty(amount)} ${it.unit||""} «${srcLocation||"—"}» → «${dest}»${srcExpiry?` (срок ${fmtDate(srcExpiry)})`:""}`);
  saveState(); closeSheet(); render();
  toast(`Перенесено в «${dest}»`);
}

async function deleteStock(id){
  if(!ensureCanEdit()) return;
  const it = state.stock.find(s=>s.id===id);
  if(!await confirmSheet(`Удалить «${it?.name||""}»?`,{danger:true,yes:"Удалить"})) return;
  state.stock = state.stock.filter(s=>s.id!==id);
  // каскадом чистим связанные записи в журналах, чтобы не оставалось «висячих» ссылок
  if(state.journals){
    JOURNAL_KEYS.forEach(k=>{
      if(Array.isArray(state.journals[k])){
        state.journals[k].forEach(op=>{ if(op.productId===id) tombJr(op.id); });   // надгробия — чтобы удалённые с товаром записи не воскресли pull-ом
        state.journals[k] = state.journals[k].filter(op=> op.productId!==id);
      }
    });
  }
  logOp("STOCK_DEL", it?.name||"");
  saveState(); closeSheet(); render();
}

/* ---------- Места хранения: управление ---------- */
function locationUsageCount(type, name){
  let n = 0;
  for(const s of state.stock){
    if(s.type!==type) continue;
    if((s.location||"")===name) n++;
    for(const b of (s.batches||[])) if((b.location||"")===name) n++;
  }
  return n;
}
async function addLocation(type){
  if(!ensureCanEdit()) return;
  const val = await promptSheet(`Новое место хранения (${typeMeta(type).label})`, "", {title:"Добавить место"});
  if(val===null) return;
  const name = String(val).trim();
  if(!name){ toast("Пустое название"); return; }
  if(!validShortName(name)) return;
  const list = state.locations[type] || [];
  if(list.includes(name)){ toast("Уже есть"); return; }
  state.locations[type] = [...list, name];
  tombRevive(state.delLoc, type, name);   // снова добавили — снимаем надгробие, если было
  logOp("LOC_ADD", `${type}: «${name}»`);
  saveState(); render();
  toast("Место добавлено");
}
// «＋ Место» прямо в форме позиции: добавляет место под ТЕКУЩУЮ базу и выбирает его, НЕ пересобирая форму
// (иначе терялся бы уже введённый текст). Пустой список — норма: места у каждой базы свои, добавляются здесь.
async function addLocChip(btn, type){
  if(!ensureCanEdit()) return;
  const val = await promptSheet(`Новое место хранения (${typeMeta(type).label})`, "", {title:"Добавить место"});
  if(val===null) return;
  const name = String(val).trim();
  if(!name){ toast("Пустое название"); return; }
  if(!validShortName(name)) return;
  const list = state.locations[type] || [];
  if(!list.includes(name)){ state.locations[type] = [...list, name]; tombRevive(state.delLoc, type, name); logOp("LOC_ADD", `${type}: «${name}»`); saveState(); }
  const row = btn.parentNode; if(!row) return;
  let chip=null; row.querySelectorAll(".chip").forEach(c=>{ if(c.getAttribute("data-loc")===name) chip=c; });
  if(!chip){ chip = document.createElement("button"); chip.type="button"; chip.className="chip"; chip.setAttribute("data-loc", name); chip.setAttribute("onclick", CHIP_PICK); chip.textContent = name; row.insertBefore(chip, btn); }
  row.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
  chip.classList.add("active");
}
async function renameLocation(type, oldName){
  if(!ensureCanEdit()) return;
  const val = await promptSheet(`Переименовать «${oldName}»`, oldName, {title:"Переименовать"});
  if(val===null) return;
  const newName = String(val).trim();
  if(!newName || newName===oldName) return;
  if(!validShortName(newName)) return;
  const list = state.locations[type] || [];
  if(list.includes(newName)){ toast("Такое место уже есть"); return; }
  state.locations[type] = list.map(x => x===oldName ? newName : x);
  tombRevive(state.delLoc, type, newName); tombAdd(state.delLoc, type, oldName);   // новое имя живо, старое — в надгробия (распространить переименование)
  // каскад: все карточки нужного типа + их партии + журнальные batchLocation
  let touched = 0;
  for(const s of state.stock){
    if(s.type!==type) continue;
    if((s.location||"")===oldName){ s.location = newName; touched++; }
    for(const b of (s.batches||[])) if((b.location||"")===oldName){ b.location = newName; touched++; }
    if(hasBatches(s)) syncItemFromBatches(s);
  }
  for(const k of JOURNAL_KEYS){
    for(const op of (state.journals[k]||[])){
      if(op && op.batchLocation===oldName){ op.batchLocation = newName; touched++; }
    }
  }
  logOp("LOC_RENAME", `${type}: «${oldName}» → «${newName}» (${touched} связей)`);
  saveState(); render();
  toast(`Переименовано (${touched} ссылок)`);
}
async function deleteLocation(type, name){
  if(!ensureCanEdit()) return;
  const cnt = locationUsageCount(type, name);
  if(cnt>0){
    const ok = await confirmSheet(
      `«${name}» используется в ${cnt} позициях/партиях. Удалить место и очистить ссылки (location станет пустым)?`,
      {danger:true,yes:"Удалить и очистить"}
    );
    if(!ok) return;
    for(const s of state.stock){
      if(s.type!==type) continue;
      if((s.location||"")===name) s.location = "";
      for(const b of (s.batches||[])) if((b.location||"")===name) b.location = "";
      if(hasBatches(s)) syncItemFromBatches(s);
    }
  } else {
    if(!await confirmSheet(`Удалить место «${name}»?`,{danger:true,yes:"Удалить"})) return;
  }
  state.locations[type] = (state.locations[type]||[]).filter(x=>x!==name);
  tombAdd(state.delLoc, type, name);   // надгробие → удаление распространится на устройства, union не вернёт обратно
  logOp("LOC_DEL", `${type}: «${name}» (${cnt} связей очищено)`);
  saveState(); render();
  toast("Место удалено");
}

function addCategory(type){

  saveState(); openCategoriesEdit(); render();

async function renameCategory(type, oldName){
  if(!ensureCanEdit()) return;
  const next = await promptSheet("Новое название:", oldName, {title:"Переименовать категорию"});
  if(next===null) return;
  const nextT = (next||"").trim(); if(!nextT || nextT===oldName) return;
  const arr = state.categories[type];
  const i = arr.indexOf(oldName); if(i<0) return;
  if(arr.includes(nextT) && nextT!==oldName){ toast("Уже есть"); return; }
  arr[i] = nextT;
  tombRevive(state.delCat, type, nextT); tombAdd(state.delCat, type, oldName);   // распространить переименование категории
  state.stock.forEach(s=>{ if(s.type===type && s.category===oldName) s.category=nextT; });
  logOp("CAT_RENAME", `${oldName} → ${nextT}`);
  saveState(); openCategoriesEdit(); render();
}
async function deleteCategory(type, name){
  if(!ensureCanEdit()) return;
  const cnt = state.stock.filter(s=>s.type===type && s.category===name).length;
  const msg = cnt>0
    ? `В категории «${name}» ${cnt} позиций. Перенести в «Прочее» и удалить?`
    : `Удалить пустую категорию «${name}»?`;
  if(!await confirmSheet(msg,{danger:true,yes:"Удалить"})) return;
  state.categories[type] = state.categories[type].filter(c=>c!==name);
  tombAdd(state.delCat, type, name);   // надгробие → удаление категории распространится, union не вернёт
  const fallback = type==="product" ? "Прочие продукты" : "Прочее";  // household/tool → «Прочее»
  if(!state.categories[type].includes(fallback)){ state.categories[type].push(fallback); tombRevive(state.delCat, type, fallback); }
  state.stock.forEach(s=>{ if(s.type===type && s.category===name) s.category=fallback; });
  if(stockCat===name) stockCat="";
  logOp("CAT_DEL", name);
  saveState(); openCategoriesEdit(); render();
}

  for(const c of state.checklists.kitchen){ if(c && typeof c==="object") c.id = safeId(c.id); }
}
function toggleCheck(id, done){
  ensureChecklist();
  const c = state.checklists.kitchen.find(x=>x.id===id); if(!c) return;
  c.done = done; saveState();
}
function addCheck(){
  ensureChecklist();
  const inp = document.getElementById("ckNew");
  const t = inp.value.trim(); if(!t) return;
  state.checklists.kitchen.push({id:uid(),text:t,done:false});

function removeCheck(id){
  ensureChecklist();
  state.checklists.kitchen = state.checklists.kitchen.filter(x=>x.id!==id);
  saveState(); render();
}
function resetChecklist(){
  ensureChecklist();
  state.checklists.kitchen.forEach(c=>c.done=false);

}

/* ---------- Excel / CSV экспорт ---------- */
function ensureXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(window._xlsxLoading) return window._xlsxLoading;
  // XLSX вынесен в отдельный файл, грузится ТОЛЬКО при экспорте Excel — главная страница вдвое легче
  window._xlsxLoading = new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="./xlsx.js";
    s.onload=()=>{ window._xlsxLoading=null; window.XLSX ? resolve(window.XLSX) : reject(new Error("XLSX не инициализировался")); };
    s.onerror=()=>{ window._xlsxLoading=null; reject(new Error("Не удалось загрузить библиотеку Excel (нужна сеть)")); };
    document.head.appendChild(s);
  });
  return window._xlsxLoading;
}
// защита от инъекции формул в Excel: строковая ячейка, начинающаяся с = + - @ (tab/CR), исполнилась бы
// как формула при открытии файла (тот же риск, что в CSV). Числа хранятся типом "n" — их не трогаем.
// Данные могли прийти из общей облачной базы от другого участника → экранируем перед отдачей файла.
function xlsxGuard(ws){
  for(const addr in ws){
    if(addr[0]==="!") continue;
    const c = ws[addr];
    if(c && c.t==="s" && typeof c.v==="string" && /^[=+\-@\t\r]/.test(c.v)){
      c.v = "'" + c.v; if(c.w!=null) c.w = "'" + c.w;
    }
  }
  return ws;
}

    tsh["!cols"] = [{wch:40},{wch:16},{wch:12},{wch:10},{wch:12},{wch:8},{wch:8},{wch:10}];

  saveXlsx(wb, `vahtahoz-${todayStr()}.xlsx`);

function exportCsv(){
  const header = ["Тип","Категория","Наименование","Количество","Ед. изм.","Мин. запас","Срок годности","Место","Примечание"];
  const rows = [header];
  sortedStock(state.stock).forEach(s=>rows.push([
    typeMeta(s.type).addLabel,
    s.category||"", s.name, fmtQty(s.qty), s.unit||"",
    s.minStock??"", s.expiry||"", locationsOf(s).join("; "), s.note||""
  ]));
  const csv = "\uFEFF" + rows.map(r=>r.map(v=>{
    let str = String(v??"");
    if(/^[=+\-@\t\r]/.test(str)) str = "'" + str;   // защита от CSV-инъекции формул: имя/примечание вида «=…»/«+…» Excel выполнил бы как формулу
    return /[;"\n\r]/.test(str) ? `"${str.replace(/"/g,'""')}"` : str;
  }).join(";")).join("\r\n");
  triggerDownload(csv, `vahtahoz-sklad-${todayStr()}.csv`, "text/csv;charset=utf-8");
  toast("CSV сохранён");
}

/* ---------- Выгрузка в Excel ПО ФИЛЬТРАМ ---------- */
// статус срока позиции по ближайшей дате: "expired" (есть просрочка) > "soon" (≤14 дн) > "" (норма/без срока)
function _expiryStatus(it){
  const exps = (hasBatches(it) ? batchesOf(it).map(b=>b.expiry) : [it.expiry]).filter(Boolean);
  let st="";
  for(const e of exps){ const d=daysLeft(e); if(d===null) continue; if(d<0) return "expired"; if(d<=14) st="soon"; }
  return st;
}
function _hasAnyExpiry(it){ return (hasBatches(it) ? batchesOf(it).map(b=>b.expiry) : [it.expiry]).filter(Boolean).length>0; }
// пропускает позицию через выбранный фильтр
function _passExportFilter(s, f){
  if(f.type!=="all" && s.type!==f.type) return false;
  if(f.loc!=="all"  && !locationsOf(s).includes(f.loc)) return false;
  if(f.cats && f.cats.length && !f.cats.includes(s.category||"")) return false;
  const tq = totalQtyOf(s);
  if(f.stock==="in"   && !(tq>0)) return false;
  if(f.stock==="zero" && tq>0)    return false;
  if(f.stock==="low"){ const m=(s.minStock===""||s.minStock==null)?null:Number(s.minStock); if(m===null || !(tq<=m)) return false; }
  if(f.exp!=="all"){
    const st=_expiryStatus(s);
    if(f.exp==="expired" && st!=="expired") return false;     // только просрочка
    if(f.exp==="soon"    && st!=="soon")    return false;     // только «скоро» (просрочку не включаем — она в своём фильтре)
    if(f.exp==="valid"   && st==="expired") return false;     // без просрочки
    if(f.exp==="noexp"   && _hasAnyExpiry(s)) return false;   // без срока
  }
  return true;
}
// короткий человекочитаемый хвост для имени файла из выбранных фильтров
function _filterTag(f){
  const p=[];
  if(f.loc!=="all")  p.push(f.loc);
  if(f.type!=="all") p.push(typeMeta(f.type).short);
  if(f.cats && f.cats.length) p.push(f.cats.length<=2 ? f.cats.join(",") : `${f.cats.length} катег.`);
  if(f.exp==="expired") p.push("просрочка");
  else if(f.exp==="soon")  p.push("скоро");
  else if(f.exp==="valid") p.push("без просрочки");
  else if(f.exp==="noexp") p.push("без срока");
  if(f.stock==="in")   p.push("в наличии");
  else if(f.stock==="zero") p.push("нулевые");
  else if(f.stock==="low")  p.push("ниже минимума");
  return (p.join(" · ")||"склад").slice(0,80).replace(/[\/\\:*?"<>|]/g,"-");
}

async function runFilteredXlsx(){
  const val = id=>{ const e=document.getElementById(id); return e?e.value:"all"; };
  const cats = [...document.querySelectorAll("#_fCats .chip.active[data-cat]")].map(x=>x.dataset.cat);

  if(!list.length){ toast("Под фильтр ничего не попало"); return; }
  let XLSX;
  try{ XLSX = await ensureXlsx(); }
  catch(e){ toast(e.message||"Excel недоступен (нужна сеть в первый раз)"); return; }
  const rows = list.map(s=>{
    const st=_expiryStatus(s);
    return {
      "Тип": typeMeta(s.type).addLabel,
      "Категория": s.category||"",
      "Наименование": s.name,
      "Количество": totalQtyOf(s),
      "Ед. изм.": s.unit||"",
      "Мин. запас": (s.minStock===""||s.minStock==null)?"":Number(s.minStock),
      "Срок годности": nearestExpiryOf(s)||"",
      "Состояние": st==="expired"?"просрочено":(st==="soon"?"скоро (≤14 дн)":""),
      "Место": locationsOf(s).join("; "),
      "Примечание": s.note||"",
    };
  });
  const ws = xlsxGuard(XLSX.utils.json_to_sheet(rows));
  ws["!cols"] = [{wch:10},{wch:22},{wch:40},{wch:10},{wch:8},{wch:10},{wch:14},{wch:16},{wch:18},{wch:30}];
  if(ws["!ref"]) ws["!autofilter"] = { ref: ws["!ref"] };   // автофильтр в Excel по шапке
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Склад (фильтр)");
  saveXlsx(wb, `vahtahoz-${_filterTag(f)}-${todayStr()}.xlsx`);
  closeSheet();
  toast(`Excel сохранён · ${list.length} поз.`);
}

// Универсальное сохранение файла. В НАТИВНЫХ обёртках (Capacitor iOS/Android WKWebView/WebView) обычный
// <a download>+Blob НЕ срабатывает (нет менеджера загрузок) → сначала пробуем Web Share API с файлом
// («Поделиться» → «Сохранить в Файлы»/отправить), и только затем классическое скачивание (браузеры/десктоп).
// ВАЖНО: вызывать синхронно из обработчика клика (без await до share) — иначе iOS снимет «жест» и share упадёт.
async function saveBlob(blob, filename){
  // share нужен на МОБИЛЬНЫХ/тач (там download не работает в обёртках); на десктопе/Tauri оставляем обычное
  // скачивание (иначе десктоп-веб получал бы лишний «Поделиться» вместо прямого сохранения).
  const mobileLike = (navigator.maxTouchPoints||0) > 0 || /iphone|ipad|ipod|android/i.test(navigator.userAgent||"");
  try{
    const file = new File([blob], filename, { type: blob.type || "application/octet-stream" });
    if(mobileLike && navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title: filename });
      return true;   // пользователь сохранил/отправил (или закрыл шит) — второй раз НЕ качаем
    }
  }catch(e){
    if(e && e.name==="AbortError") return true;   // сам отменил «Поделиться» — не дублируем скачиванием
    // иначе (не поддержано/не разрешено) — падаем на обычное скачивание
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
    return true;
  }catch(e){ toast("Не удалось сохранить файл на этом устройстве"); return false; }
}
function triggerDownload(text, filename, mime){
  saveBlob(new Blob([text],{type:mime||"application/json"}), filename);
}
// Excel через универсальный сейв (не XLSX.writeFile — он делает тот же не-работающий в обёртках download)
function saveXlsx(wb, filename){
  try{
    const X = window.XLSX;   // вызывается ПОСЛЕ ensureXlsx() в экспорт-функции → уже загружен
    if(!X){ toast("Excel ещё грузится — повторите"); return; }
    const buf = X.write(wb, { type:"array", bookType:"xlsx" });
    saveBlob(new Blob([buf], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), filename);
  }catch(e){ console.warn("saveXlsx", e); toast("Не удалось сформировать Excel"); }
}

/* ОБЩИЙ КАТАЛОГ: добавить во ВСЕ базы устройства те наименования (тип+имя+ед.), которых там нет,
   с количеством 0. Существующие позиции, остатки, места, сроки, партии НЕ трогаются. */
async function mergeCatalogs(){
  const bases = profiles.list.map(p=>({
    p, active: p.id===profiles.activeId,
    st: p.id===profiles.activeId ? state : (()=>{ try{ return JSON.parse(localStorage.getItem(slotKey(p.id))||"null"); }catch(_){ return null; } })()
  })).filter(b=> b.st && Array.isArray(b.st.stock));
  if(bases.length<2){ toast("Нужно минимум 2 базы на этом устройстве"); return; }
  const keyOf = s => `${s.type}|${(s.name||"").trim().toLowerCase()}`;
  const catalog = new Map();   // union: type|имя → {type,name,unit}
  for(const b of bases) for(const s of b.st.stock){
    const k = keyOf(s);
    if(s.name && !catalog.has(k)) catalog.set(k, { type:s.type, name:s.name, unit:s.unit||"шт" });
  }
  let willAdd = 0;
  for(const b of bases){
    const have = new Set(b.st.stock.map(keyOf));
    for(const k of catalog.keys()) if(!have.has(k)) willAdd++;
  }
  if(willAdd===0){ toast("Каталоги уже одинаковы"); return; }
  const ok = await confirmSheet(`Объединить наименования: добавить ${willAdd} позиций (с нулём) туда, где их нет? Остатки/места/сроки не меняются.`,{yes:"Объединить"});
  if(!ok) return;
  let added=0;
  for(const b of bases){
    if(b.active) b.st = state;   // снимок снят ДО await — за время диалога глобальный state мог быть переназначен (storage-событие); берём живой
    const have = new Set(b.st.stock.map(keyOf));
    for(const [k,c] of catalog){
      if(!have.has(k)){ b.st.stock.push(catalogItem(c.type, c.name, c.unit)); added++; }
    }
    if(b.active) saveState();
    else { try{ localStorage.setItem(slotKey(b.p.id), JSON.stringify(b.st)); }catch(_){} }
    if(b.p.cloudId){ try{ localStorage.setItem(cloudDirtyKey(b.p.cloudId),"1"); }catch(_){} }   // к выгрузке в облако
  }
  render();
  const cid = activeCloudId();
  if(cid && cloud.ready) setTimeout(()=>{ cloudActivate(cid).catch(e=>console.warn(e)); }, 50);   // активную — сразу в облако
  toast(`Готово: добавлено ${added} наименований. Остальные базы обновятся при открытии.`);
}
/* каталожная позиция-«заготовка» (только наименование, без остатка/мест/сроков) */
function catalogItem(type, name, unit){
  return { id:uid(), type, name, qty:0, unit:unit||"шт", minStock:"", expiry:"", location:"", category:"", note:"", createdAt:new Date().toISOString() };
}
/* АВТО-РАСПРОСТРАНЕНИЕ наименования на ОСТАЛЬНЫЕ базы (их слоты), с qty 0.
   add → добавить, если нет; rename (oldName→name) → переименовать совпадение (или добавить).
   Остатки/места/сроки других баз не трогаются. Базы помечаются к выгрузке в облако. */
function propagateName(type, name, unit, oldName){
  const norm = s => (s||"").trim().toLowerCase();
  for(const p of profiles.list){
    if(p.id===profiles.activeId) continue;          // активную уже изменили
    let st; try{ st = JSON.parse(localStorage.getItem(slotKey(p.id))||"null"); }catch(_){ st=null; }
    if(!st || !Array.isArray(st.stock)) continue;
    const exists = st.stock.some(s=>s.type===type && norm(s.name)===norm(name));
    let changed=false;
    if(oldName && norm(oldName)!==norm(name)){
      const it = st.stock.find(s=>s.type===type && norm(s.name)===norm(oldName));
      if(it && !exists){ it.name=name; changed=true; }       // переименовать совпадение
      else if(!exists){ st.stock.push(catalogItem(type,name,unit)); changed=true; }  // не нашли — добавить
    } else if(!exists){
      st.stock.push(catalogItem(type,name,unit)); changed=true;   // новое имя — добавить
    }
    if(changed){
      try{ localStorage.setItem(slotKey(p.id), JSON.stringify(st)); }catch(_){}
      if(p.cloudId) try{ localStorage.setItem(cloudDirtyKey(p.cloudId),"1"); }catch(_){}
    }
  }
}
async function importAllProfiles(payload){
  const incoming = (payload.profiles||[]).filter(p=>p && p.state && typeof p.state==="object");
  if(!incoming.length){ toast("В файле нет баз"); return; }
  const mode = await chooseSheet(
    `Резервная копия: ${incoming.length} баз. Что сделать?`,
    [
      { label:"Заменить ВСЕ базы (полное восстановление)", value:"replace", color:"btn-danger" },
      { label:"Добавить как новые базы (к текущим)",        value:"append",  color:"btn-primary" },
    ]
  );
  if(!mode) return;
  // нормализуем (валидируем) состояние каждой базы — кривые пропускаем
  const norm = [];
  for(const p of incoming){
    let st;
    try{ st = validateImport(structuredClone(p.state)); }
    catch(e){ console.warn("Пропущена база", p.name, e); continue; }
    if(isRestrictedUser()) st.tasks = [];   // начальник: «Задачи» из файла не импортируем
    norm.push({ name: cleanName40(p.name||"База") || "База", state: st });
  }
  if(!norm.length){ toast("Не удалось прочитать базы из файла"); return; }

  if(mode==="replace"){
    const ok = await confirmSheet(`Заменить все текущие базы на ${norm.length} из файла? Текущие данные будут стёрты.`,{danger:true,yes:"Заменить всё"});
    if(!ok) return;
    // АТОМАРНО: сначала пишем ВСЕ новые слоты (id свежие, со старыми не конфликтуют),
    // и только если все записи прошли — удаляем старые и фиксируем. Иначе откатываем
    // частично записанное, старые данные остаются нетронутыми (защита от QuotaExceeded).
    const newList = []; let activeId = null; const writtenKeys = [];
    try{
      norm.forEach((p,i)=>{
        const id = uid();
        if(i===0) activeId = id;
        newList.push({ id, name: p.name });
        const key = slotKey(id);
        localStorage.setItem(key, JSON.stringify(p.state)); // бросит при переполнении
        writtenKeys.push(key);
      });
    }catch(e){
      console.error("importAllProfiles replace failed:", e);
      for(const k of writtenKeys){ try{ localStorage.removeItem(k); }catch(_){} } // откат
      toast("Не хватило места — восстановление отменено, старые базы целы");
      return;
    }
    // все новые слоты на месте — теперь безопасно удалить старые и переключить активную
    const oldProfs = profiles.list.slice();   // старые базы (с cloudId) — для чистки осиротевших sync-маркеров
    const oldIds = oldProfs.map(p=>p.id);
    try{ localStorage.setItem(STORE_KEY, localStorage.getItem(slotKey(activeId))); }catch(e){ console.error(e); }
    saveProfiles({ activeId, list: newList });
    for(const id of oldIds){ if(id!==activeId){ try{ localStorage.removeItem(slotKey(id)); }catch(_){} } }
    for(const op of oldProfs){ if(op.cloudId) clearBaseSyncKeys(op.cloudId); }   // dirty + снимки подписей старых баз не нужны
    toast("Восстановлено. Перезагрузка…");
    setTimeout(()=>location.reload(), 600);
  } else {
    for(const p of norm){
      let nm = p.name, n = 2;
      while(profiles.list.some(x=>x.name.toLowerCase()===nm.toLowerCase())){ nm = `${p.name} (${n++})`; }
      const id = uid();
      profiles.list.push({ id, name: nm });
      try{ localStorage.setItem(slotKey(id), JSON.stringify(p.state)); }catch(e){ console.error(e); }
    }
    saveProfiles(profiles);
    toast(`Добавлено баз: ${norm.length}`);
    render(); openProfilesSheet();
  }
}
function importData(ev){
  const f = ev.target.files[0]; if(!f){ return; }
  const inputEl = ev.target;
  const r = new FileReader();
  r.onload = async () => {
    inputEl.value = ""; // чтобы можно было повторно выбрать тот же файл
    try{
      const parsed = JSON.parse(r.result);
      // резервная копия ВСЕХ баз — отдельная ветка восстановления
      if(parsed && parsed.__vahtahozProfiles && Array.isArray(parsed.profiles)){
        if(isRestrictedUser()){ toast("Восстановление всех баз недоступно для вашей роли"); return; }
        await importAllProfiles(parsed);
        return;
      }
      const obj = validateImport(parsed);
      if(isRestrictedUser()) obj.tasks = [];   // начальник: «Задачи» из файла не импортируем
      const mode = await chooseSheet(
        `Найдено ${(obj.stock||[]).length} поз. Что делать?`,
        [
          { label:"Объединить (без дублей)", value:"merge", color:"btn-primary" },
          { label:"Заменить всё", value:"replace", color:"btn-danger" },
        ]
      );
      if(!mode) return;
      const base = mode==="replace" ? structuredClone(defaultState) : state;
      const merged = mode==="replace" ? { ...base, ...obj } : structuredClone(state);
      // категории
      const catBase = base.categories || structuredClone(defaultState).categories;
      if(obj.categories){
        merged.categories = {};
        for(const k of STOCK_TYPE_KEYS){
          merged.categories[k] = Array.from(new Set([...(catBase[k]||[]), ...(obj.categories[k]||[])]));
        }
      } else {
        merged.categories = catBase;
      }
      // сток
      const norm = s => (s||"").toString().toLowerCase().replace(/\s+/g," ").trim();
      if(mode==="replace"){
        merged.stock = obj.stock||[];
      } else {
        // матчинг с unit: type|cat|name|unit, затем type|name|unit (не сливать кг+шт)
        const unitKey = (u)=> _impUnitKey(u) || "шт";
        const strict = new Map(); // type|cat|name|unit
        const loose  = new Map(); // type|name|unit -> массив кандидатов
        const looseAdd = (lk,it)=>{ if(!loose.has(lk)) loose.set(lk,[]); loose.get(lk).push(it); };
        (merged.stock||[]).forEach(it=>{
          const uk = unitKey(it.unit);
          strict.set(`${it.type}|${norm(it.category)}|${norm(it.name)}|${uk}`, it);
          looseAdd(`${it.type}|${norm(it.name)}|${uk}`, it);
        });
        let added=0, updated=0;
        (obj.stock||[]).forEach(src=>{
          const t = src.type||"product";
          const uk = unitKey(src.unit);
          const key = `${t}|${norm(src.category)}|${norm(src.name)}|${uk}`;
          const looseKey = `${t}|${norm(src.name)}|${uk}`;
          let found = strict.get(key);
          if(!found){
            const cands = loose.get(looseKey) || [];
            found = cands.find(c=> !norm(c.category)) || (norm(src.category) ? null : cands[0]) || null;
          }
          if(found){
            // Слияние batches: если у src есть партии — добавляем их к found с новыми id
            // (если у found ещё нет batches, но был qty>0 — конвертируем его в первую партию)
            if(Array.isArray(src.batches) && src.batches.length){
              if(!Array.isArray(found.batches)) found.batches = [];
              if(found.batches.length===0 && roundQty(found.qty||0) > 0){
                found.batches.push({
                  id: uid(), qty: roundQty(found.qty||0),
                  expiry: found.expiry||"", location: found.location||"",
                  note: "Перенос исходного остатка", createdAt: found.createdAt||new Date().toISOString()
                });
              }
              // дедуп по (qty, expiry, location, note) — защита от двойного импорта
              const sig = b => `${roundQty(b.qty||0)}|${b.expiry||""}|${b.location||""}|${b.note||""}`;
              const existing = new Set(found.batches.map(sig));
              for(const b of src.batches){
                if(existing.has(sig(b))) continue;
                found.batches.push({
                  id: uid(), qty: roundQty(b.qty||0),
                  expiry: b.expiry||"", location: b.location||"",
                  note: b.note||"", createdAt: b.createdAt||new Date().toISOString()
                });
                existing.add(sig(b));
              }
              syncItemFromBatches(found);
            } else if(hasBatches(found)){
              // src без партий, но found уже партийный — прямая прибавка к qty была бы
              // стёрта syncItemFromBatches; кладём остаток src отдельной партией
              if(roundQty(src.qty||0) > 0){
                found.batches.push({
                  id: uid(), qty: roundQty(src.qty||0),
                  expiry: src.expiry||"", location: src.location||"",
                  note: "Импорт (объединение)", createdAt: new Date().toISOString()
                });
                syncItemFromBatches(found);
              }
            } else {
              // обычное слияние: просто прибавляем qty
              found.qty = roundQty(Number(found.qty||0) + Number(src.qty||0));
              if(!found.expiry && src.expiry) found.expiry = src.expiry;
              if(!found.location && src.location) found.location = src.location;
            }
            if(!found.unit && src.unit) found.unit = src.unit;
            const catChanged = !found.category && src.category;
            if(catChanged) found.category = src.category;
            if(!found.note && src.note) found.note = src.note;
            found.updatedAt = new Date().toISOString();
            // переиндексация strict, если категорию только что заполнили
            if(catChanged) strict.set(`${found.type}|${norm(found.category)}|${norm(found.name)}|${unitKey(found.unit)}`, found);
            updated++;
          } else {
            merged.stock.push({...src, id: src.id || uid()});
            const added_it = merged.stock[merged.stock.length-1];
            strict.set(key, added_it);
            looseAdd(looseKey, added_it);
            added++;
          }
        });
        toast(`+${added}, обновлено: ${updated}`);
      }
      if(mode==="replace"){
        merged.tasks = obj.tasks||[];
        merged.log = obj.log||[];
        merged.journals = obj.journals || emptyJournals();
        merged.checklists = obj.checklists || merged.checklists;
        merged.theme = obj.theme || base.theme;
      } else {
        // merge: объединяем по id, без дублей
        const mergeById = (a=[], b=[]) => {
          const ids = new Set((a||[]).map(x=>x.id));
          return [...(a||[]), ...(b||[]).filter(x=>!ids.has(x.id))];
        };
        merged.tasks = mergeById(merged.tasks||[], obj.tasks||[]);
        merged.log   = mergeById(merged.log||[],   obj.log||[]);
        if(obj.journals){
          merged.journals = merged.journals || emptyJournals();
          JOURNAL_KEYS.forEach(k=>{
            merged.journals[k] = mergeById(merged.journals[k]||[], obj.journals[k]||[]);
          });
        }
        // объединяем пользовательские места хранения (validateImport уже очистил строки)
        if(obj.locations){
          merged.locations = merged.locations || {};
          for(const k of STOCK_TYPE_KEYS){
            merged.locations[k] = [...new Set([...(merged.locations[k]||[]), ...(obj.locations[k]||[])])];
          }
        }
      }
      state = merged; normalizeState();   // приводим форму к инвариантам (массивы/места/категории/партии) после слияния
      // фиксируем, что встроенный seed уже не нужен (после replace stock мог стать пустым умышленно)
      state.seededAt = state.seededAt || new Date().toISOString();
      // сбрасываем фильтры, т.к. категории могли полностью смениться
      stockCat = ""; stockSearch = ""; stockLimit = 100; stockMode = "stock"; stockTab = "all"; stockExpiryFilter = "all";
      saveState(); applyTheme(); render();
      if(mode==="replace") toast(`Заменено: ${state.stock.length} поз.`);
    }catch(e){
      console.error("Import error:", e);
      toast("Не удалось прочитать файл — проверьте формат");
    }
  };
  r.readAsText(f);
}

  state.log=[]; saveState(); render();

async function wipeAll(){
  const cid = activeCloudId();
  if(cid){
    if(!cloudOnline()){ toast("Обновление из облака доступно только онлайн"); return; }   // офлайн: не снимаем dirty и не врём «обновлено»
    // ОБЛАЧНАЯ база: стирать её локально и выгружать пустоту НЕЛЬЗЯ — это снесло бы общие данные
    // в облаке у всех участников (в т.ч. у начальника). «Сброс» здесь = заменить ЛОКАЛЬНУЮ копию
    // свежими данными из облака. Облако не трогаем.
    if(!await confirmSheet(`База «${activeProfileName()}» — облачная. Обновить локальную копию из облака? Несохранённые локальные правки заменятся облачными. Данные в облаке НЕ удаляются.`,{danger:true,yes:"Обновить из облака"})) return;
    try{ localStorage.removeItem(cloudDirtyKey(cid)); }catch(_){}   // отбрасываем несинхронизированное локальное (но НЕ снимок — иначе ложный конфликт при сбое)
    setSyncStatus("syncing","Обновление из облака…");
    try{ await cloudPull(cid); toast("Обновлено из облака"); }catch(e){ toast("Не удалось обновить — проверьте интернет и нажмите ↻ (обновить) вверху"); }
    nav("dashboard");

/* ---------- Expiry notice on open ---------- */
function expiryNoticeOnOpen(){
  // не показываем поверх полноэкранного входа
  const gate=document.getElementById("loginGate"); if(gate && !gate.classList.contains("hidden")) return;
  if(state.lastExpiryNoticeDate===todayStr()) return;
  const expired = state.stock.filter(s=> s.type==="product" && s.expiry && daysLeft(s.expiry)<0 && Number(s.qty||0)>0);
  const soon    = state.stock.filter(s=>{ if(s.type!=="product"||!s.expiry||!inStock(s)) return false; const d=daysLeft(s.expiry); return d!==null && d>=0 && d<=3; });
  // число единиц для списания — по партиям (как в writeoffExpired), чтобы подпись кнопки совпадала с фактом
  const expiredTargets = state.stock.reduce((n,s)=>{
    if(s.type!=="product") return n;
    if(hasBatches(s)) return n + s.batches.filter(b=>b.expiry && daysLeft(b.expiry)<0 && roundQty(b.qty||0)>0).length;
    return n + ((s.expiry && daysLeft(s.expiry)<0 && Number(s.qty||0)>0)?1:0);
  },0);
  const any = expired.length || soon.length;
  if(any){
    // Системное уведомление (если разрешено), иначе запрос разрешения
    if("Notification" in window){
      if(Notification.permission==="granted"){
        const parts = [];
        if(expired.length) parts.push(`Просрочено: ${expired.length}`);
        if(soon.length) parts.push(`Скоро истекает: ${soon.length}`);
        notify("⏰ ВахтаХоз", parts.join(" · "));
      } else if(Notification.permission==="default"){
        Notification.requestPermission().catch(()=>{});
      }
    }
    // qty/место для просрочки/скорых сроков с учётом партий
    const qtyFor = (s, predicate) => hasBatches(s)
      ? roundQty(s.batches.filter(b=>b.expiry && predicate(daysLeft(b.expiry))).reduce((a,x)=>a+roundQty(x.qty||0),0))
      : Number(s.qty||0);
    const locFor = (s, predicate) => {
      if(!hasBatches(s)) return s.location||"";
      const matched = s.batches.filter(b=>b.expiry && predicate(daysLeft(b.expiry)));
      const locs = [...new Set(matched.map(b=>b.location).filter(Boolean))];
      return locs.length===1 ? locs[0] : (locs.length>1 ? `${locs.length} мест` : "");
    };
    const html = `
      <div class="font-bold text-xl mb-3">⏰ Внимание! Сроки годности</div>
      ${expired.length?`<div class="text-sm opacity-70 mb-1">Просрочено (${expired.length})</div>
      <div class="space-y-2 mb-3">
        ${sortedStock(expired).map(s=>{const d=daysLeft(s.expiry);const q=qtyFor(s,dd=>dd<0);const loc=locFor(s,dd=>dd<0);return `<div class="card flex justify-between gap-2"><span class="flex-1">${esc(s.name)} <span class="opacity-70">(${fmtQty(q)} ${esc(s.unit||"")}${loc?` · 📍 ${esc(loc)}`:""})</span></span><span class="badge badge-red">Просрочено ${-d} дн.</span></div>`;}).join("")}
      </div>`:""}
      ${soon.length?`<div class="text-sm opacity-70 mb-1">Истекает в ближайшие 3 дня (${soon.length})</div>
      <div class="space-y-2 mb-3">
        ${sortedStock(soon).map(s=>{const d=daysLeft(s.expiry);const txt=d===0?"Сегодня":`${d} дн.`;const q=qtyFor(s,dd=>dd>=0&&dd<=3);const loc=locFor(s,dd=>dd>=0&&dd<=3);return `<div class="card flex justify-between gap-2"><span class="flex-1">${esc(s.name)} <span class="opacity-70">(${fmtQty(q)} ${esc(s.unit||"")}${loc?` · 📍 ${esc(loc)}`:""})</span></span><span class="badge badge-yellow">${txt}</span></div>`;}).join("")}
      </div>`:""}
      ${expired.length?`<button class="btn btn-danger w-full" onclick="writeoffExpired()">🗑 Списать всю просрочку (${expiredTargets})</button>`:""}
      <button class="btn btn-primary w-full mt-2" onclick="openExpiredView()">Перейти к складу</button>
      <button class="btn btn-ghost w-full mt-2" data-close>Позже</button>
    `;
    openSheet(html);
  }
  state.lastExpiryNoticeDate = todayStr();
  saveState();
}

async function writeoffExpired(){
  if(!ensureCanEdit()) return;
  // считаем «единицу для списания» точечно:
  //  — для batches-карточек: каждая просроченная партия списывается отдельно (свежие НЕ трогаем)
  //  — для legacy: вся карточка целиком (как раньше)
  const targets = []; // [{it, batch?: b}]
  for(const it of state.stock){
    if(it.type!=="product") continue;
    if(hasBatches(it)){
      for(const b of it.batches){
        if(b.expiry && daysLeft(b.expiry)<0 && roundQty(b.qty||0)>0) targets.push({it, batch:b});
      }
    } else {
      if(it.expiry && daysLeft(it.expiry)<0 && Number(it.qty||0)>0) targets.push({it, batch:null});
    }
  }
  if(!targets.length){ closeSheet(); return; }
  if(!await confirmSheet(`Списать по сроку ${targets.length} ${targets.some(t=>t.batch)?"партий/позиций":"поз."}? Свежие партии НЕ трогаются.`,{danger:true,yes:"Списать"})) return;
  const now = new Date().toISOString();
  state.journals.writeoff = state.journals.writeoff || [];
  let done = 0;
  for(const t of targets){
    // ПЕРЕРЕЗОЛВ по id: ссылки собраны ДО await confirmSheet — pull/смена базы могли пересоздать
    // объекты склада. Работаем только с актуальными; исчезнувшие/уже списанные пропускаем.
    const it = state.stock.find(s=>s.id===t.it.id); if(!it) continue;
    if(t.batch){
      const batch = (it.batches||[]).find(b=>b.id===t.batch.id);
      if(!batch || roundQty(batch.qty||0)<=0 || !(batch.expiry && daysLeft(batch.expiry)<0)) continue;   // партия изменилась/свежая — не трогаем
      const d = daysLeft(batch.expiry);
      state.journals.writeoff.unshift({
        id: uid(), ts: now, productId: it.id, productName: it.name,
        qty: roundQty(batch.qty||0), unit: it.unit||"", stockType: journalStockType(it),
        batchId: batch.id, batchLocation: batch.location||"", batchExpiry: batch.expiry||"",
        note: `Списано по сроку (просрочено ${-d} дн., ${fmtDate(batch.expiry)}${batch.location?", 📍 "+batch.location:""})`
      });
      logOp("WRITEOFF", `${it.name} -${fmtQty(batch.qty)} ${it.unit||""} [партия: ${batch.location||"—"} ⏰ ${fmtDate(batch.expiry)}]`);
      it.batches = it.batches.filter(b=>b.id!==batch.id);
      finalizeBatchMutation(it);
    } else {
      if(hasBatches(it) || !(it.expiry && daysLeft(it.expiry)<0) || Number(it.qty||0)<=0) continue;   // стала партийной/срок изменился — не трогаем
      const d = daysLeft(it.expiry);
      state.journals.writeoff.unshift({
        id: uid(), ts: now, productId: it.id, productName: it.name,
        qty: Number(it.qty||0), unit: it.unit||"", stockType: journalStockType(it),
        note: `Списано по сроку (просрочено ${-d} дн., ${fmtDate(it.expiry)})`
      });
      logOp("WRITEOFF", `${it.name} -${fmtQty(it.qty)} ${it.unit||""} (срок)`);
      it.qty = 0; it.updatedAt = now;
    }
    done++;
  }
  saveState(); closeSheet(); render();
  toast(`Списано: ${done}`);
}

/* ============================================================
   ОБЛАКО — реализация (Supabase). Загрузка клиента по требованию.
   Активная база может быть «связана» с облачной (profiles.list[i].cloudId).
   Синхронизируется ТОЛЬКО активная база. Без входа — всё локально.
   ============================================================ */
async function ensureSB(){
  if(cloud.sb) return cloud.sb;
  // self-hosted UMD-бандл (script в <head>) даёт глобальный supabase.createClient
  const lib = window.supabase;
  if(!lib || !lib.createClient) throw new Error("Библиотека облака не загрузилась (нет сети при первом запуске?)");
  cloud.sb = lib.createClient(CLOUD_CFG.url, CLOUD_CFG.anon, {
    auth:{
      // autoRefreshToken=false НАМЕРЕННО: refresh-токен продлеваем ТОЛЬКО вручную через cloudDoRefresh
      // (прямым fetch, надёжно в iOS standalone). Если бы supabase-клиент тоже авто-ротировал —
      // два механизма крутили бы ОДНУ цепочку токенов → reuse-detection GoTrue отзывает семью → разлогин + «REST 401».
      persistSession:true, autoRefreshToken:false, storageKey:NS+"vahtahoz_auth",
      // обход зависания navigator.locks в Safari (вход висел до таймаута): сквозная блокировка
      lock: async (_name, _timeout, fn) => await fn()
    }
  });
  return cloud.sb;
}
/* Прямой REST-запрос к PostgREST с пользовательским токеном в заголовке.
   Не зависит от setSession/состояния auth-клиента: в iOS standalone-PWA sb.from
   мог уходить без JWT (сессия ещё не зарегистрирована) или подвисать. */
async function cloudRest(path, token, opts, _retried){
  opts = opts || {};
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), opts.timeout || 30000);   // НЕ виснем вечно; запас под слабый интернет
  try{
    let r;
    try{
      r = await fetch(`${CLOUD_CFG.url}/rest/v1/${path}`, {
        method: opts.method || "GET", signal: ctrl.signal,
        headers: Object.assign({ apikey:CLOUD_CFG.anon, Authorization:`Bearer ${token}` }, opts.headers||{}),
        body: opts.body
      });
    }catch(fe){
      // НАСТОЯЩИЙ сетевой сбой (не наш таймаут-abort) → сеть пропала, хотя navigator.onLine мог остаться
      // ложно-true и событие offline не пришло. Снимаем подтверждение — следующий гейт покажет оффлайн быстро.
      if(fe && fe.name!=="AbortError") _netConfirmed = false;
      throw fe;
    }
    _netConfirmed = true;   // ответ долетел → сеть точно есть (снимаем ложный navigator.onLine=false)
    // 401 = access-токен протух ПОСРЕДИ сессии (живёт ~1ч). Обновляем токен и повторяем ОДИН раз —
    // иначе синк падал «REST 401» до перезагрузки. Тело первого ответа не читаем, чтобы повтор был чистым.
    if(r.status===401 && !_retried && cloud.session && cloud.session.refresh_token){
      let perm=false;
      const newTok = await cloudDoRefresh().catch(e=>{ if(e && e.permanent) perm=true; return null; });
      if(newTok) return await cloudRest(path, newTok, opts, true);
      if(perm && cloudOnline()){ cloudSessionExpired("Вход устарел — войдите снова"); }   // разлогин ТОЛЬКО при подтверждённом отказе токена И живой сети (аккаунт удалён/сменили пароль). Офлайн — держим сессию
    }
    if(!r.ok){
      const detail=(await r.text().catch(()=>"")).slice(0,120);
      // пользователю — по-русски; технические детали (статус/тело) — в e.detail/e.status для логов
      const msg = r.status>=500 ? "Сервер недоступен, попробуйте позже"
        : (r.status===401||r.status===403) ? "Нет доступа — войдите снова или обратитесь к начальнику участка"
        : "Не удалось выполнить запрос ("+r.status+")";
      const e=new Error(msg); e.status=r.status; e.detail=detail; throw e;
    }
    if(opts.returnResponse) return r;
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  } finally { clearTimeout(t); }
}
// PostgREST по умолчанию отдаёт ≤1000 строк. Без пагинации pull склада (~3k) был неполным →
// в UI «прыгало» число в наличии, а push мог удалить «пропавшие» id из облака.
async function cloudRestAll(path, token, opts){
  opts = opts || {};
  const page = Math.min(Math.max(Number(opts.pageSize)||1000, 100), 1000);
  const hardCap = Number(opts.hardCap)||50000;
  const all = [];
  let from = 0;
  for(;;){
    const headers = Object.assign({}, opts.headers||{}, {
      Range: `${from}-${from+page-1}`,
      Prefer: "count=exact",
    });
    const r = await cloudRest(path, token, Object.assign({}, opts, { headers, returnResponse:true }));
    const txt = await r.text();
    const chunk = txt ? JSON.parse(txt) : [];
    if(!Array.isArray(chunk)) return chunk;   // неожиданный формат — как есть
    all.push(...chunk);
    if(chunk.length < page) break;
    from += page;
    if(from >= hardCap){
      const e = new Error("Слишком много данных для загрузки — обратитесь к администратору");
      e.code = "hardCap"; e.hardCap = hardCap; e.path = path;
      throw e;
    }
  }
  return all;
}
/* Своё хранилище сессии (синхронное) — переживает reload от cloudAutoLink, в отличие от
   фонового setSession в supabase-клиенте. Восстановление при запуске идёт отсюда, прямым fetch. */
function saveCloudSess(d){
  try{ localStorage.setItem(NS+"vahtahoz_sess", JSON.stringify({
    access_token:d.access_token, refresh_token:d.refresh_token,
    expires_at: Date.now() + ((d.expires_in||3600)*1000), user:d.user
  })); }catch(_){}
}
function loadCloudSess(){ try{ return JSON.parse(localStorage.getItem(NS+"vahtahoz_sess")||"null"); }catch(_){ return null; } }
function clearCloudSess(){ try{ localStorage.removeItem(NS+"vahtahoz_sess"); }catch(_){} }
/* Соседняя вкладка/копия PWA на этом origin ротировала токен → подхватываем свежую сессию в память,
   чтобы не держать протухший refresh-токен и не слать его (иначе reuse → «вход устарел»). Логаут НЕ распространяем. */
try{ window.addEventListener("storage", (e)=>{
  if(e.key===NS+"vahtahoz_sess" && e.newValue && cloud.session){
    try{ const s=JSON.parse(e.newValue); if(s && s.access_token && s.refresh_token) cloud.session=s; }catch(_){}
  }
}); }catch(_){}
/* продление по refresh-токену ПРЯМЫМ fetch — не зависит от supabase-клиента (в iOS standalone мог висеть) */
async function cloudRefresh(refresh_token){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 15000);   // НЕ виснем на слабой сети / холодном старте бэкенда
  try{
    const r = await fetch(`${CLOUD_CFG.url}/auth/v1/token?grant_type=refresh_token`, {
      method:"POST", signal: ctrl.signal,
      headers:{ apikey:CLOUD_CFG.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ refresh_token })
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok || !d.access_token){
      const e=new Error("Не удалось продлить сессию"); e.status=r.status;
      // permanent (=единственное основание разлогинить) ТОЛЬКО при НАСТОЯЩЕМ отказе GoTrue по токену:
      // JSON-тело с кодом ошибки об отозванном/несуществующем refresh-токене. На вахте плохой интернет —
      // каптив-порталы, прокси, «глушилки», DPI тоже отдают 400/401/403, но HTML/пусто → d без error_code →
      // это НЕ permanent (сессию НЕ рушим, работаем офлайн, продлимся позже). Ложный permanent = разлогин в
      // поле, где заново войти почти невозможно. 429/5xx/сетевые — тоже временные.
      const errStr = String(d.error_code||d.error||d.msg||d.error_description||"").toLowerCase();
      const genuineTokenReject = !!errStr && /refresh_token|invalid.?grant|invalid.?token|token.?not.?found|revoked|already.?used|user.?not.?found|user.?banned|session.?not.?found|bad_jwt/.test(errStr);
      if((r.status===400 || r.status===401 || r.status===403) && genuineTokenReject) e.permanent=true;
      throw e;
    }
    return d;
  } finally { clearTimeout(t); }
}
// постоянный сбой рефреша → чистый выход на экран входа (аккаунт удалён/токен отозван/сменили пароль)
async function cloudSessionExpired(reason){
  if(!cloud.session && !cloud.ready) return;   // уже разлогинены — не дублируем
  cloud.session=null; cloud.profile=null; cloud.members=[]; cloud.orgRoles=[]; cloud.ready=false; cloud.basesLoaded=false;
  cloud.bases={}; clearAllBasesCache();        // имена баз и снимок остатков протухшей сессии не должны висеть в UI/памяти
  cloud._basesLoading=false; cloud.busy=false; cloud.pushPending=false; cloud.applying=false;   // иначе повторный вход залипнет (cloudOnLogin рано выходит при _basesLoading)

  try{ if(cloud.channel && cloud.sb) cloud.sb.removeChannel(cloud.channel); }catch(_){}

  clearTimeout(cloud.pushTimer); clearTimeout(cloud.pullTimer); clearTimeout(cloud.retryTimer); clearTimeout(cloud.pullRetryT); clearTimeout(cloud._basesRetryT);
  clearTimeout(cloud.tasksTimer); clearTimeout(cloud.tasksRetry); clearTimeout(cloud.tasksPullTimer);   // не дёргаем задачи на мёртвом токене
  try{ if(cloud.sb) cloud.sb.auth.signOut({ scope:"local" }).catch(()=>{}); }catch(_){}   // ТОЛЬКО локальная сессия: без scope supabase-js делает глобальный logout → отзыв токенов на ВСЕХ устройствах юзера
  clearCloudSess();

// обновляет access-токен по refresh-токену; ОДИН общий промис на параллельные 401 (без шторма refresh)
function cloudDoRefresh(){
  if(cloud._refreshing) return cloud._refreshing;
  cloud._refreshing = (async()=>{
    try{
      // Другой контекст на этом origin (вкладка/копия PWA) мог уже ротировать токен и сохранить свежий в localStorage.
      // Берём максимально свежий, чтобы не слать заведомо использованный (reuse-detection → отзыв всей семьи → разлогин).
      const stored = loadCloudSess();
      if(stored && stored.refresh_token) cloud.session = stored;
      const rt = cloud.session && cloud.session.refresh_token;
      if(!rt){ const e=new Error("Вход устарел — войдите снова"); e.permanent=true; throw e; }   // нет refresh-токена → восстановить нельзя: реактивный 401 уйдёт в cloudSessionExpired, не зациклится
      let d;
      try{
        d = await cloudRefresh(rt);
      }catch(err){
        // Токен отвергнут (permanent). Но соседний контекст мог за это время успешно продлить сессию —
        // подхватываем его свежий токен вместо разлогина (частая причина ложного «вход устарел» при 2 вкладках).
        const fresh = loadCloudSess();
        if(err && err.permanent && fresh && fresh.access_token && fresh.refresh_token && fresh.refresh_token!==rt){
          cloud.session = fresh; return fresh.access_token;
        }
        throw err;
      }
      saveCloudSess(d); cloud.session = loadCloudSess();
      // отдаём свежий токен и supabase-клиенту (realtime/auth) — он сам НЕ рефрешит (autoRefreshToken=false),
      // иначе его сессия протухнет. Не блокируем: setSession в standalone может подвисать → race с 4с-таймаутом.
      try{ if(cloud.sb) Promise.race([ cloud.sb.auth.setSession({ access_token:d.access_token, refresh_token:d.refresh_token }).catch(()=>{}), new Promise(r=>setTimeout(r,4000)) ]).catch(()=>{}); }catch(_){}
      return cloud.session && cloud.session.access_token;
    } finally { cloud._refreshing = null; }
  })();
  return cloud._refreshing;
}

const MEMBER_ROLES = [
  { key:"worker",       label:"Хозрабочий",        rank:1, perm:{can_view_stock:true, can_edit_stock:true,  can_view_tasks:true,  can_edit_tasks:true,  can_manage:false} },

  { key:"site_manager", label:"Начальник участка", rank:2, perm:{can_view_stock:true, can_edit_stock:true,  can_view_tasks:true,  can_edit_tasks:true,  can_manage:true } },
];
// полная лестница рангов (в т.ч. территориальные/глобальные роли — для подписей и вычисления своего ранга)
const ROLE_RANK = { owner:6, general_director:5, director:4, party_chief:3, site_manager:2, worker:1, cook:1, mechanic:1, accounting:1 };
const ROLE_LABELS = { owner:"Владелец", general_director:"Ген. директор", director:"Директор", party_chief:"Начальник партии", site_manager:"Начальник участка", worker:"Хозрабочий", cook:"Повар", mechanic:"Механик/Электрик", accounting:"Бухгалтерия", custom:"Особая" };
const rankOf = (k)=> ROLE_RANK[k] || 0;
const roleLabel = (k)=> (MEMBER_ROLES.find(r=>r.key===k)||{}).label || ROLE_LABELS[k] || k || "—";
// ранг текущего пользователя: владелец=6, иначе макс по глобальным/партийным (org_roles) и по управляемым базам.
function myRank(){
  if(cloud.profile && cloud.profile.is_admin) return 6;
  let r = 0;
  (cloud.orgRoles||[]).forEach(o=>{ if(o.active!==false) r = Math.max(r, rankOf(o.role)); });
  (cloud.members||[]).forEach(m=>{ if(m.active!==false && m.can_manage) r = Math.max(r, rankOf(m.role)||2); });

}

function assignableRoles(keepRole){

  return MEMBER_ROLES.filter(r => r.rank < mine || r.key === keepRole);

// вызов Edge Function manage-user (создание логина / сброс пароля — service_role на сервере)
async function cloudCallFn(action, payload){
  const tok = cloud.session && cloud.session.access_token;
  if(!tok) throw new Error("Нет входа в облако");
  const doFetch = (t)=>{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), 35000);   // не виснем на холодном старте free-тарифа
    return fetch(`${CLOUD_CFG.url}/functions/v1/manage-user`, {
      method:"POST", signal:ctrl.signal,
      headers:{ apikey:CLOUD_CFG.anon, Authorization:`Bearer ${t}`, "Content-Type":"application/json" },
      body: JSON.stringify(Object.assign({ action }, payload))
    }).finally(()=>clearTimeout(to));
  };
  let r;
  try{ r = await doFetch(tok); }
  catch(_){ throw new Error("Сервер недоступен. Проверьте интернет и повторите"); }
  if(r.status===401){ const nt=await cloudDoRefresh().catch(()=>null); if(nt){ try{ r=await doFetch(nt); }catch(_){ throw new Error("Сервер недоступен. Проверьте интернет"); } } }   // токен протух — обновить и повторить
  const d = await r.json().catch(()=>({}));
  if(!r.ok || d.error) throw new Error(d.error || ("Ошибка сервера "+r.status));
  return d;
}
// загрузка ВСЕХ участников активной базы (с логинами) — для экрана управления (RLS пустит менеджера)
async function cloudLoadBaseMembers(){
  const cid=activeCloudId(); const tok=cloud.session && cloud.session.access_token;
  if(!cid || !tok) return [];
  const mem = await cloudRest(`base_members?base_id=eq.${encodeURIComponent(cid)}&select=*`, tok);
  const ids = [...new Set((mem||[]).map(m=>m.user_id))];
  const names = {};
  if(ids.length){
    const profs = await cloudRest(`profiles?id=in.(${ids.map(encodeURIComponent).join(",")})&select=id,username`, tok).catch(()=>[]);
    (profs||[]).forEach(p=>{ names[p.id]=p.username; });
  }
  cloud.baseMembers = (mem||[]).map(m=>Object.assign({}, m, { username: names[m.user_id] || String(m.user_id).slice(0,8) }));
  return cloud.baseMembers;
}

function _findBM(uid){ return (cloud.baseMembers||[]).find(x=>x.user_id===uid); }
// защита от само-локаута: изменение НЕ должно оставить базу без активного управляющего
// (глобальный владелец-админ исключение — он восстановит права в любом случае).
function _wouldOrphan(uid, change){
  if(cloud.profile && cloud.profile.is_admin) return false;
  const after = (cloud.baseMembers||[]).filter(m=>{
    let manage=!!m.can_manage, active=(m.active!==false);
    if(m.user_id===uid){
      if(change.remove) return false;
      if(change.role!==undefined){ const r=MEMBER_ROLES.find(x=>x.key===change.role); if(r) manage=!!r.perm.can_manage; }
      if(change.active!==undefined) active=change.active;
    }
    return manage && active;
  }).length;
  return after===0;
}

async function doHandover(fromUid, toUid){
  const from=_findBM(fromUid), to=_findBM(toUid);
  if(!from || !to){ toast("Список устарел. Закройте и откройте заново"); return; }
  // защита: после пересменки в базе должен остаться активный управляющий (если ты не владелец)
  if(!(cloud.profile && cloud.profile.is_admin)){
    const mgrs=(cloud.baseMembers||[]).filter(m=>{ let manage=!!m.can_manage, active=(m.active!==false); if(m.user_id===fromUid) active=false; if(m.user_id===toUid) active=true; return manage&&active; }).length;
    if(mgrs===0){ toast("База останется без управляющего. Сначала назначьте другого «Начальника участка»"); return; }
  }
  if(!await confirmSheet(`Передать смену от «${from.username}» к «${to.username}»?\nВсе задачи «${from.username}» перейдут к «${to.username}». «${from.username}» уйдёт со смены и потеряет доступ к базе, «${to.username}» заступит и получит доступ.`,{ yes:"Передать смену", title:"Передать смену" })) return;
  if(cloud._handoverBusy) return; cloud._handoverBusy=true;
  try{
    const d=await cloudCallFn("handover", { base_id:activeCloudId(), from_user:fromUid, to_user:toUid });
    // если меня самого касается пересменка — синхронизируем свои права/задачи
    if(cloud.profile && (cloud.profile.id===fromUid || cloud.profile.id===toUid)){
      const cid=activeCloudId(); const mine=cloud.members.find(m=>m.user_id===cloud.profile.id && m.base_id===cid);
      if(mine) mine.active = (cloud.profile.id===toUid);
      cloudSyncTasks().catch(()=>{});   // подтянуть переданные задачи
    }
    toast(`Смена передана. Задач перенесено: ${d.tasks_moved||0}`);
    await openMembersSheet();
  }catch(e){ toast("Не удалось. "+(e.message||"Проверьте интернет и повторите")); }
  finally{ cloud._handoverBusy=false; }
}
async function memberRemove(uid){
  const m=_findBM(uid); if(!m) return;
  if(_wouldOrphan(uid,{remove:true})){ toast("База останется без управляющего. Сначала назначьте другого «Начальника участка»"); return; }
  if(!await confirmSheet(`Убрать «${m.username}» из этой базы?\nЕго логин останется, и в других базах он продолжит работать.`,{danger:true,yes:"Убрать из базы"})) return;
  const cid=activeCloudId(); const tok=cloud.session && cloud.session.access_token;
  try{
    await cloudRest(`base_members?base_id=eq.${encodeURIComponent(cid)}&user_id=eq.${encodeURIComponent(uid)}`, tok, { method:"DELETE", headers:{ "Prefer":"return=minimal" } });
    toast("Убран из базы"); await openMembersSheet();
  }catch(e){ toast("Не удалось: "+(e.message||"Проверьте интернет и повторите")); }
}

async function doGrantBases(remove){
  if(!(cloud.profile && cloud.profile.is_admin)){ toast("Только владелец"); return; }
  const username=(document.getElementById("gbu")?.value||"").trim().toLowerCase();
  const role=document.getElementById("gbr")?.value||"worker";
  const on_shift = !!(document.getElementById("gbOnShift")?.checked);
  const base_ids=[...document.querySelectorAll(".gbBase:checked")].map(el=>el.value).filter(Boolean);
  if(_badLogin(username)) return;
  if(!base_ids.length){ toast("Выберите хотя бы одну базу"); return; }
  if(!remove && !MEMBER_ROLES.some(r=>r.key===role)){ toast("Выберите роль"); return; }
  const title = remove ? "Снять доступ" : "Выдать доступ";
  const msg = remove
    ? `Снять «${username}» с ${base_ids.length} баз(ы)?`
    : `Выдать «${username}» роль «${roleLabel(role)}» на ${base_ids.length} баз(ы)${on_shift?" (на смене)":" (без смены)"}?`;
  if(!await confirmSheet(msg,{ title, yes: remove?"Снять":"Выдать", danger:!!remove })) return;
  const btn = document.getElementById(remove?"gbRevoke":"gbGrant");
  if(btn){ btn.disabled=true; btn.textContent = remove?"Снятие…":"Выдача…"; }
  try{
    const d=await cloudCallFn("grant_bases", { username, role, base_ids, remove: !!remove, on_shift });
    if(remove){
      toast(`Снято с ${(d.bases||[]).length} баз`);
    } else {
      const n=(d.added||[]).length + (d.updated||[]).length;
      toast(`Готово: ${n} баз (новых ${(d.added||[]).length}, обновлено ${(d.updated||[]).length})`);
    }
    closeSheet();
  }catch(e){
    toast("Не удалось. "+(e.message||"Проверьте логин и интернет"));
    if(btn){ btn.disabled=false; btn.textContent = remove?"Снять с выбранных баз":"Выдать"; }
  }
}

let _allBasesCache = null;     // [{id,name,rows}] — снимок; чистится при выходе (clearAllBasesCache)
let _allBasesAt = 0;           // время снимка (для «Обновлено в HH:MM»)
function clearAllBasesCache(){ _allBasesCache = null; _allBasesAt = 0; }
// количество считаем КАК В СКЛАДЕ: из батчей, если они есть (колонка qty — производная и может отстать)
function _rowQty(r){ const b=Array.isArray(r.batches)?r.batches:[]; return b.length ? roundQty(b.reduce((s,x)=>s+roundQty((x&&x.qty)||0),0)) : roundQty(Number(r.qty||0)); }
function _fileSafe(s){ return String(s||"база").replace(/[^0-9A-Za-zА-Яа-яёЁ -]/g,"").trim().replace(/\s+/g,"_")||"база"; }
// один запрос in.(...) вместо N параллельных: одна поездка, RLS сама отфильтрует видимое, тянем и batches
async function loadAllBasesStock(){
  const tok=cloud.session && cloud.session.access_token;
  const ids=Object.keys(cloud.bases||{});
  if(!ids.length) return [];
  let rows;
  try{ rows=await cloudRestAll(`stock_items?select=base_id,name,category,qty,unit,min_stock,expiry,location,type,note,batches&base_id=in.(${ids.map(encodeURIComponent).join(",")})&order=id`, tok, {timeout:180000, hardCap:100000}); }
  catch(e){ return ids.map(id=>({ id, name:cloud.bases[id], rows:null })); }   // общий сбой → все базы помечаем «не загружено»
  const byBase={}; (Array.isArray(rows)?rows:[]).forEach(r=>{ (byBase[r.base_id]=byBase[r.base_id]||[]).push(r); });
  return ids.map(id=>({ id, name:cloud.bases[id], rows: byBase[id]||[] }));
}

// бухгалтерский лист: наличие/количество/срок/мин-остаток БЕЗ столбца «Склады»/место. Несколько сроков из
// партий — через «;». Отдельный лист на каждую базу (разделение по базам, не монолит одним листом).
const _ACCT_COLS=[{wch:38},{wch:20},{wch:12},{wch:10},{wch:12},{wch:24}];
function _rowExpiry(r){
  const b=Array.isArray(r.batches)?r.batches:[];
  const ex = b.length ? [...new Set(b.map(x=>(x&&x.expiry)||"").filter(Boolean))].sort() : (r.expiry?[r.expiry]:[]);
  return ex.map(fmtDate).join("; ");
}
function _acctRow(r){ return {
  "Наименование": r.name, "Категория": r.category||"", "Количество": _rowQty(r),
  "Ед. изм.": r.unit||"", "Мин. остаток": (r.min_stock==null?"":Number(r.min_stock)), "Срок годности": _rowExpiry(r) }; }
function _sheetName(name, used){
  let s = String(name||"База").replace(/[\[\]\*\?\/\\:]/g,"").trim().slice(0,28) || "База";
  let bs=s, i=2; while(used.has(s.toLowerCase())){ s=bs.slice(0,25)+" "+i; i++; } used.add(s.toLowerCase()); return s;
}

// navigator.onLine на iOS standalone-PWA часто ЛОЖНО false сразу после загрузки (пока не пошёл первый
// запрос), и событие "online" не срабатывает → статус залипал в «оффлайн» при живой сети. Поэтому online
// считаем подтверждённым, если ЛИБО navigator.onLine!==false, ЛИБО реальный запрос долетел (_netConfirmed).
let _netConfirmed = false;
function cloudOnline(){ return _netConfirmed || navigator.onLine!==false; }
// лёгкая проба сети: любой ДОЛЕТЕВШИЙ ответ (даже 4xx) = сеть есть; только сетевой сбой/таймаут = нет.
async function netProbe(){
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),6000);
    try{ await fetch(`${CLOUD_CFG.url}/rest/v1/`, { method:"GET", headers:{ apikey:CLOUD_CFG.anon }, signal:ctrl.signal }); return true; }
    finally{ clearTimeout(to); }
  }catch(e){ return false; }
}

/* статус-бар синхронизации: syncing | offline | synced | error | hidden */
let _syncHideT = null;
function setSyncStatus(kind, text){
  const bar = document.getElementById("syncBar"); const chip = document.getElementById("syncChip");
  if(!bar || !chip) return;
  clearTimeout(_syncHideT);
  if(kind==="hidden" || !cloud.ready || !activeCloudId()){ bar.classList.add("hidden"); bar.classList.remove("busy"); chip.classList.add("hidden"); return; }
  const M = {
    syncing:{ bg:"#0E7C86", icon:"↻", chip:"↻", txt:text||"Сохранение в облако…" },
    offline:{ bg:"#92400e", icon:"🔴", chip:"⏳", txt:text||"Нет интернета — данные уйдут в облако, когда он появится" },   /* #b45309 (~4.0:1) → #92400e (~5.9:1): AA для мелкого (12px) текста syncBar, как у .badge-yellow */
    synced: { bg:"#15803d", icon:"✓", chip:"✓", txt:text||"Сохранено в облаке" },
    error:  { bg:"#b91c1c", icon:"⚠", chip:"⚠", txt:text||"Не удалось сохранить — пробуем снова" },
  };
  const m = M[kind] || M.syncing;
  bar.style.background = m.bg; bar.textContent = `${m.icon} ${m.txt}`;
  chip.textContent = m.chip; chip.classList.remove("hidden");
  bar.classList.remove("hidden");
  bar.classList.toggle("busy", kind==="syncing");   // анимированный прогресс-бар только при активной синхронизации
  if(kind==="synced"){
    _syncHideT = setTimeout(()=>{ bar.classList.add("hidden"); chip.classList.add("hidden"); }, 1800);
  }
}

async function cloudInit(){
  if(window._recoveryMode) return;   // идёт сброс пароля по ссылке — не трогаем сессию/гейт
  if(cloud._initDone) return; cloud._initDone = true;   // защита от повторного запуска (дубль listener)
  // авто-пуш/синхронизация при возврате сети
  window.addEventListener("online", async ()=>{
    _netConfirmed = true;   // браузер сообщил о сети — снимаем возможный ложный оффлайн
    if((cloud.session || loadCloudSess()) && cloud.basesLoaded!==true){
      // базы не загрузились — продлеваем токен при необходимости и дозагружаем базы
      try{
        let s = loadCloudSess() || cloud.session;
        if(s && s.refresh_token && (!s.expires_at || s.expires_at<=Date.now()+60000)){
          cloud.session = s;   // через cloudDoRefresh (single-flight) — не плодим вторую ротацию параллельно реактивному 401-рефрешу
          if(await cloudDoRefresh()) s = loadCloudSess();
        }
        if(s && s.access_token) await cloudOnLogin({ access_token:s.access_token, refresh_token:s.refresh_token, user:s.user });
      }catch(e){
        console.warn("online-reload", e);
        // постоянный отказ токена (пароль сменили/аккаунт удалён) — иначе вечный тупик «ждём сеть» при живой сети
        if(e && e.permanent && cloudOnline()) cloudSessionExpired("Вход устарел — войдите снова");
      }
      return;
    }
    if(cloud.ready){
      await cloudRelinkIfNeeded();   // дотянуть привязку локальных баз, если вход прошёл, но autolink не отработал
      const acid=activeCloudId();
      if(acid){ await cloudRefreshMyMembership(); setSyncStatus("syncing","Сеть появилась — синхронизация…"); cloudActivate(acid); }
      // задачи: до-выгружаем отложенные правки и пере-синкаем (не зависят от базы)
      if(localStorage.getItem(TASKS_DIRTY)) cloudPushTasksNow().catch(()=>{}); else cloudSyncTasks().catch(()=>{});
    }
  });
  window.addEventListener("offline", ()=>{ _netConfirmed = false; if(cloud.ready && activeCloudId()) setSyncStatus("offline"); });
  try{
    await ensureSB();   // клиент нужен для realtime/setSession ниже
    // iOS ложно-offline при старте: если браузер говорит «нет сети», НЕ блокируем запуск, а фоном пробуем
    // достучаться. Долетело → сеть есть: снимаем оффлайн и до-запускаем синк (как по событию online).
    if(navigator.onLine===false){
      (async()=>{
        for(let i=0;i<3 && !_netConfirmed;i++){   // до 3 попыток: холодный старт бэкенда мог не уложиться в 6с
          if(await netProbe()){ if(!_netConfirmed){ _netConfirmed=true; try{ renderHeader(); }catch(_){}; window.dispatchEvent(new Event("online")); } break; }
          await new Promise(r=>setTimeout(r, 4000));
        }
      })().catch(()=>{});
    }
    let s = loadCloudSess();
    // access-токен живёт ~1ч. Если истёк/истекает в ближайшую минуту — продлеваем ПРЯМЫМ fetch
    // по refresh-токену (не зависим от supabase-клиента, который в standalone мог висеть).
    if(s && s.refresh_token && (!s.expires_at || s.expires_at <= Date.now()+60000)){
      cloud.session = s;   // cloudDoRefresh берёт refresh-токен из cloud.session и идёт под single-flight (без двойной ротации цепочки)
      try{
        if(await cloudDoRefresh()) s = loadCloudSess();   // внутри свой 15с-таймаут; единый путь ротации
      }catch(e){
        // Экран входа — ТОЛЬКО при ПОСТОЯННОМ отказе (токен отозван/аккаунт удалён/пароль сменили).
        // Временный сбой (холодный старт дольше 15с, моргнувшая сеть) сессию НЕ стирает: входим со
        // старым токеном — реактивный 401-рефреш в cloudRest продлит позже. Иначе после одной
        // авторизации людям снова выскакивал логин/пароль без их выхода.
        if(e && e.permanent && cloudOnline()){ s = null; clearCloudSess(); }
      }
    }
    if(s && s.access_token && s.user && s.user.id){
      hideLoginGate();
      // фоновый setSession — для realtime/autoRefresh; не блокирует восстановление (промис не ждём)
      ensureSB().then(sb=>Promise.race([
        sb.auth.setSession({ access_token:s.access_token, refresh_token:s.refresh_token }).catch(()=>{}),   // свой catch: реджект ПОСЛЕ таймаута race не станет unhandled
        new Promise(res=>setTimeout(res,4000))
      ])).catch(()=>{});
      await cloudOnLogin({ access_token:s.access_token, refresh_token:s.refresh_token, user:s.user });
    } else {
      // нет сохранённой/продлеваемой сессии → вход обязателен (режим «без облака» убран).
      // НО cloudInit асинхронный, а gateEarly показал гейт сразу — за время cloudInit пользователь мог УЖЕ войти.
      // Перечитываем сессию (и смотрим cloud.session): иначе повторно перекрыли бы успешный вход панелью логина
      // (баг: окно логина всплывало сразу после входа и исчезало лишь после перезахода).
      const fresh = loadCloudSess();
      if((fresh && fresh.access_token && fresh.user) || (cloud.session && cloud.session.access_token)) hideLoginGate();
      else showLoginGate();
    }
  }catch(e){ console.warn("cloudInit", e); }
}
/* ---- Полноэкранный логин-гейт ---- */
/* ---------- Восстановление пароля по почте (Supabase recovery) ----------
   Работает, когда домен логина (LOGIN_DOMAIN) реально принимает почту (catch-all на своём домене).
   1) «Забыли пароль?» → recover-письмо со ссылкой на приложение;
   2) ссылка открывает приложение с #type=recovery&access_token=… → экран нового пароля. */
// вызов Edge Function БЕЗ токена — только публичные действия восстановления (юзер не залогинен)
async function cloudCallFnPublic(action, payload){
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), 35000);
  let r;
  try{ r = await fetch(`${CLOUD_CFG.url}/functions/v1/manage-user`, { method:"POST", signal:ctrl.signal, headers:{ apikey:CLOUD_CFG.anon, "Content-Type":"application/json" }, body: JSON.stringify(Object.assign({ action }, payload)) }); }
  catch(_){ clearTimeout(to); throw new Error("Сервер недоступен. Проверьте интернет"); }
  clearTimeout(to);
  const d = await r.json().catch(()=>({}));
  if(!r.ok || d.error) throw new Error(d.error || ("Ошибка "+r.status));
  return d;
}
function _recErr(m){ return m==="wrong_code"?"Неверный код":m==="expired"?"Код истёк — запросите заново":m==="too_many"?"Слишком много попыток, подождите":m==="wait"?"Подождите минуту перед повтором":m; }
async function cloudRefreshRecoveryProfile(){
  if(!cloud.session?.access_token || !cloud.profile?.id) return null;
  try{
    // через definer-RPC: колоночный SELECT на recovery_* отозван (чужую резервную почту не видно никому)
    const raw = await cloudRest(`rpc/my_recovery_email`, cloud.session.access_token);
    const prof = Array.isArray(raw) ? raw[0] : raw;   // rpc отдаёт json-объект (страховка и от массива)
    if(prof && typeof prof==="object"){
      cloud.profile.recovery_email = prof.recovery_email;
      cloud.profile.recovery_email_verified = !!prof.recovery_email_verified;
      return prof;
    }
  }catch(e){ console.warn("cloudRefreshRecoveryProfile", e); }
  return null;
}

}

// перехват recovery-ссылки при старте: показать экран нового пароля
function checkRecoveryLink(){
  try{
    const h = location.hash || "";
    if(h.indexOf("type=recovery")<0 || h.indexOf("access_token=")<0) return false;
    const at = new URLSearchParams(h.replace(/^#/,"")).get("access_token");
    if(!at) return false;
    // сразу вычищаем токен из адресной строки и записи истории (не оставляем recovery-токен в URL)
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(_){}

    openSetNewPassword(at);
    return true;
  }catch(_){ return false; }
}

function showLoginGate(){
  const g = document.getElementById("loginGate"); if(!g) return;
  g.classList.remove("hidden"); g.style.display="flex";  // инлайн display перебивает .hidden — синхронизируем явно
  const go = document.getElementById("lgGo"),
        em = document.getElementById("lgEmail"), pw = document.getElementById("lgPwd"),
        err = document.getElementById("lgErr");
  if(!go) return;
  const doLogin = async ()=>{
    const e=(em.value||"").trim(), p=pw.value||"";

    go.disabled=true; go.textContent="Вход…"; err.textContent="";
    // бэкенд на бесплатном тарифе может «просыпаться» 20-30с — подсказка, чтобы не выглядело зависшим
    const hint = setTimeout(()=>{ err.textContent="Подключаемся, это займёт несколько секунд…"; }, 5000);
    const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error("превышено время ожидания сети")),55000));
    try{ await Promise.race([cloudLogin(e,p), timeout]); hideLoginGate(); }
    catch(ex){ go.disabled=false; go.textContent="Войти"; err.textContent="Не удалось войти — проверьте логин, пароль и интернет"; }
    finally{ clearTimeout(hint); }

  go.onclick = doLogin;
  pw.onkeydown = ev=>{ if(ev.key==="Enter") doLogin(); };
  try{ em.focus(); }catch(_){}
}
