<style>
  html,body{ -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none; }
  /* привязываем схему нативных контролов (input[type=date]/checkbox/number, скроллбары) к теме приложения,
     а не к системной — иначе при «тёмный телефон + светлая тема» дата/иконка календаря светлые на белом */
  :root{ color-scheme: dark; }
  .light{ color-scheme: light; }
  /* Фирменный акцент — тил-петроль (инженерно-спокойный, не дефолтный синий). Единый бренд с «Почта Разведчик». */
  :root{ --accent:#2DAEB8; --accent-press:#46C0C9; --accent-weak:rgba(45,174,184,.16); --on-accent:#06282C; --border-strong:rgba(255,255,255,.28); }
  .light{ --accent:#0E7C86; --accent-press:#0A6068; --accent-weak:#E1F0F1; --on-accent:#ffffff; --border-strong:#c9c9c4; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; padding-bottom:env(safe-area-inset-bottom); }
  .safe-top{ padding-top:env(safe-area-inset-top); }
  .safe-bot{ padding-bottom:calc(88px + env(safe-area-inset-bottom)); }
  .btn{ min-height:52px; border-radius:14px; font-weight:600; font-size:17px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 18px; transition:transform .06s ease, background .15s; user-select:none; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--accent); color:var(--on-accent); }
  .btn-primary:active{ background:var(--accent-press); }
  .btn-ghost{ background:rgba(255,255,255,.06); color:inherit; }
  .btn-danger{ background:#dc2626; color:#fff; }
  .btn-success{ background:#16a34a; color:#fff; }
  .btn-warn{ background:#d97706; color:#fff; }
  .input{ width:100%; min-height:52px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:inherit; font-size:17px; outline:none; }
  .input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak); }
  .card{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:16px; box-shadow:0 1px 2px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
  .light .card{ background:#fff; border-color:#e5e7eb; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .light .btn-ghost{ background:#f3f4f6; }
  .light .input{ background:#fff; border-color:#d1d5db; color:#111827; }
  .light .input::placeholder{ color:#6b7280; opacity:1; }   /* дефолтный плейсхолдер ~3.5:1 на белом — поднимаем до AA */
  .chip{ padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600; background:rgba(255,255,255,.06); white-space:nowrap; transition:transform .06s ease, background .15s; }
  .chip:active{ transform:scale(.96); }
  .chip.active{ background:var(--accent); color:var(--on-accent); }
  .light .chip{ background:#f3f4f6; color:#111827; }
  .chip-add{ background:transparent; border:1px dashed var(--border-strong); color:var(--accent); font-weight:600; }
  .chip-add.active{ background:transparent; color:var(--accent); }
  .nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; font-size:11px; color:#9ca3af; }
  .nav-icon{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .nav-btn.active{ color:var(--accent); position:relative; }
  .light .nav-btn{ color:#6b7280; }
  .badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:middle; }
  .badge-red{ background:#dc2626; color:#fff; }
  .badge-yellow{ background:#92400e; color:#fff; }   /* было #b45309 (~4.0:1) → #92400e (~5.9:1) для AA на мелком тексте */
  .badge-green{ background:#16a34a; color:#fff; }
  .light .badge-green{ background:#15803d; }
  .badge-gray{ background:#374151; color:#e5e7eb; }
  .light .badge-gray{ background:#e5e7eb; color:#374151; }
  /* Сгруппированные секции экрана «Ещё» (iOS inset-list): секция = UPPERCASE-заголовок + строки на приподнятой поверхности */
  .set-group{ margin-bottom:22px; }
  .set-head{ font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:#8a8a82; padding:0 6px 8px; }
  .set-list{ background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:16px; overflow:hidden; }
  .light .set-list{ background:#fff; border-color:#e5e7eb; box-shadow:0 1px 2px rgba(20,20,18,.05); }
  .set-row{ display:flex; align-items:center; gap:10px; width:100%; min-height:54px; padding:13px 16px; background:transparent; color:inherit; text-align:left; border:none; border-top:1px solid rgba(255,255,255,.07); font-size:16px; font-weight:500; }
  .light .set-row{ border-top-color:#ececea; }
  .set-row:first-child{ border-top:none; }
  .set-row:active{ background:rgba(255,255,255,.06); }
  .light .set-row:active{ background:#f4f4f2; }
  .set-row .sr-t{ flex:1; min-width:0; }
  .set-row .sr-sub{ font-size:12px; font-weight:400; color:#8a8a82; margin-top:2px; white-space:normal; }
  .set-row .sr-v{ color:#8a8a82; font-size:14px; white-space:nowrap; }
  .set-row .sr-ch{ color:#8a8a82; opacity:.5; font-size:20px; line-height:1; flex:none; }
  .set-row.danger{ color:#f87171; }
  .light .set-row.danger{ color:#c0362c; }
  .set-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .prof-hd{ display:flex; align-items:center; gap:12px; padding:4px 6px 18px; }
  .prof-av{ width:44px; height:44px; border-radius:12px; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:19px; flex:none; }
  @media (max-width:340px){ .set-row{ gap:6px; padding:12px 13px; font-size:15px; } .set-row .sr-v{ font-size:13px; } }
  .light .badge-gray.opacity-50{ opacity:1; color:#9ca3af; }

  /* видимый фокус только при навигации с клавиатуры — тач/мышь не затрагивает */
  .btn:focus-visible, .chip:focus-visible, .nav-btn:focus-visible, .input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* активная вкладка нижней навигации — подчёркивание для ясности (position:relative задан выше на .nav-btn.active) */

<script>
/* ============================================================
   ВахтаХоз — оффлайн PWA планировщик и склад
   Хранение: localStorage
   ============================================================ */

/* Полифилл structuredClone для старых iOS Safari (<15.4) — иначе loadState()
   падает с ReferenceError на старте и приложение не грузится (белый экран).
   Состояние полностью JSON-сериализуемо (даты — строки), поэтому JSON-клон корректен. */
if(typeof structuredClone!=="function"){
  window.structuredClone = (o)=>(o===undefined?undefined:JSON.parse(JSON.stringify(o)));
}

/* ---------- Storage ---------- */
/* Изоляция беты от стабильной: origin у них ОБЩИЙ (vahta.razvedchick.ru), а localStorage — per-origin,
   не per-path. Без префикса бета и стабильная делили бы ключ сессии (vahtahoz_sess/vahtahoz_auth) и данные →
   ротация refresh-токена в одной копии роняла сессию другой («refresh_token_not_found» → «вход устарел»).
   На стабильной NS="" (ключи не меняются, данные целы); на бете NS="beta_" (полностью отдельный инстанс). */
const NS = (location.pathname.indexOf("/beta/") !== -1) ? "beta_" : "";
// 3-стороннее слияние количества склада при конкурентной правке одной позиции с двух устройств
// (merged = local + cloud − снимок, CRDT-счётчик). Только для позиций БЕЗ партий (у партийных qty = сумма партий,
// слепое слияние сломало бы инвариант). ПОКА только на бете — включить в стабильной после теста на двух устройствах.
const STOCK_MERGE = (NS === "beta_");
const STORE_KEY = NS+"vahtahoz:v1";
const JOURNAL_KEYS = ["receipt","issue","writeoff","order"];  // виды журналов движений
// onclick выбора чипа: снять active со всех соседних чипов и подсветить нажатый (был продублирован 7×)
const CHIP_PICK = "this.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));this.classList.add('active');";
const CHIP_TOGGLE = "this.classList.toggle('active');";   // множественный выбор (фильтр по нескольким категориям)
// бейдж количества партии (повторялся дословно в stockRow и openStockEdit)
const batchQtyBadge = (b, it) => `<span class="badge badge-green">${fmtQty(b.qty)} ${esc(it.unit||"")}</span>`;
// свежий пустой набор журналов (каждый вызов — новый объект, безопасно для присваивания в state)
function emptyJournals(){ return Object.fromEntries(JOURNAL_KEYS.map(k=>[k,[]])); }
/* Задачи/планы — ОБЩИЕ для всех баз устройства (у хоза одно расписание на обе базы).
   Храним отдельно от per-base состояния и накладываем на state.tasks при загрузке. */
const TASKS_KEY = NS+"vahtahoz:tasks";
function loadGlobalTasks(){
  try{ const raw=localStorage.getItem(TASKS_KEY); if(raw){ const t=JSON.parse(raw); if(Array.isArray(t)) state.tasks=t; } }catch(e){}
}
function saveGlobalTasks(){
  try{ localStorage.setItem(TASKS_KEY, JSON.stringify(Array.isArray(state.tasks)?state.tasks:[])); }
  catch(e){ if(e && (e.name==="QuotaExceededError" || e.code===22)) _quotaBlock(); else console.error("saveGlobalTasks", e); }
  // задачи изменились → отложенная выгрузка в облако (функция сама проверит, реально ли менялись)
  try{ if(typeof cloudMaybePushTasks==="function") cloudMaybePushTasks(); }catch(e){}
}
const defaultState = {
  theme: "dark",
  stock: [],
  tasks: [],
  log: [],
  categories: {
    product: [
      "Закуски и консервы","Крупы","Макаронные изделия","Молочные продукты",
      "Мясо, рыба и мясные продукты","Напитки и ингредиенты для напитков",
      "Овощи и фрукты","Приправы, специи и кондитерские ингредиенты",
      "Прочие продукты","Сахар, соль, мучное","Сладости и десерты",
      "Соусы и заправки","Сухофрукты и орехи","Колбасные изделия и копчёности","Заморозка"
    ],
    household: ["Химия","Уборка","Расходники","Прочее"],
    tool: ["Электроинструмент","Ручной инструмент","Крепёж и метизы","Сантехника","Электрика","Спецодежда и СИЗ","Прочее"]
  },
  checklists: {
    kitchen: [
      { id:"k1", text:"Проверить температуру холодильников", done:false },
      { id:"k2", text:"Вымыть полы на кухне", done:false },
      { id:"k3", text:"Протереть столы и плиту", done:false },
      { id:"k4", text:"Вынести мусор", done:false },
      { id:"k5", text:"Разморозить морозилку (при необходимости)", done:false }
    ]
  },
  journals: emptyJournals(),
  locations: { product: [], household: [], tool: [] },   // места ПРИВЯЗАНЫ К БАЗЕ и у всех разные — стартуем пусто, добавляет пользователь (форма позиции → «＋ Место»)
  lastExpiryNoticeDate: null
};

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return structuredClone(defaultState);
    const s = JSON.parse(raw);
    const base = structuredClone(defaultState);
    const merged = { ...base, ...s };
    merged.categories = { ...base.categories, ...(s.categories||{}) };
    merged.checklists = { ...base.checklists, ...(s.checklists||{}) };
    merged.journals = { ...base.journals, ...(s.journals||{}) };
    return merged;
  }catch(e){ return structuredClone(defaultState); }
}
let _quotaBlocked=false;   // показали ли блокирующее предупреждение о переполнении памяти (чтобы не спамить каждым saveState)
function _quotaBlock(){
  if(_quotaBlocked) return; _quotaBlocked=true;
  try{ toast("⛔ Память телефона переполнена — последние записи НЕ сохранены!"); }catch(_){}
  // блокирующий модал с предложением экспорта — через setTimeout, чтобы не мешать текущему кадру render/сохранения
  setTimeout(async()=>{
    try{
      const go = await confirmSheet("Память телефона переполнена — последние операции могут НЕ сохраниться при перезагрузке.\n\nСделайте резервную копию (экспорт), затем удалите ненужные базы или очистите старые журналы.", { yes:"Экспорт данных", no:"Позже", title:"⛔ Память переполнена" });
      if(go && typeof exportData==="function") exportData();
    }catch(_){}
  }, 50);
}
function saveState(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); _quotaBlocked=false; }   // успех — снимаем флаг переполнения (память освободилась)
  catch(e){
    if(e && (e.name==="QuotaExceededError" || e.code===22)){
      // Уровень 1: режем лог и журналы до 2000 (архив есть в облаке при синке; новые — в начале)
      if(Array.isArray(state.log) && state.log.length>200) state.log = state.log.slice(0,200);
      if(state.journals){
        for(const k of JOURNAL_KEYS){
          if(Array.isArray(state.journals[k]) && state.journals[k].length>2000) state.journals[k] = state.journals[k].slice(0,2000);
        }
      }
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state)); _quotaBlocked=false;
        try{ toast("Память телефона заполнена — старые записи журнала удалены"); }catch(_){}
      } catch(e2){
        // Уровень 2: режем журналы ЖЁСТКО (до 500) и лог почти полностью — только бы сохранить текущие остатки
        if(state.journals){ for(const k of JOURNAL_KEYS){ if(Array.isArray(state.journals[k]) && state.journals[k].length>500) state.journals[k]=state.journals[k].slice(0,500); } }
        if(Array.isArray(state.log) && state.log.length>50) state.log=state.log.slice(0,50);
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(state)); _quotaBlocked=false;
          try{ toast("Память почти заполнена — часть старых записей удалена. Сделайте экспорт"); }catch(_){}
        } catch(e3){
          // Последняя операция НЕ легла на диск → потеряется при перезагрузке. НЕ молчим — блокирующее предупреждение + экспорт.
          console.error("saveState escalated failure:", e3);
          _quotaBlock();
        }
      }
    } else { console.error("saveState error:", e); }
  }
  // задачи — общие для всех баз: дублируем в отдельный ключ
  try{ if(typeof saveGlobalTasks==="function") saveGlobalTasks(); }catch(_){}
  // если активная база связана с облаком и есть вход — отложенно отправляем изменения
  try{ if(typeof cloudMaybePush==="function") cloudMaybePush(); }catch(_){}
}

let state = loadState();

/* ---------- Облако (Supabase): состояние объявлено рано, до первых saveState ----------
   Реализация функций — единым блоком ниже (hoisted). Без входа всё работает офлайн. */
const CLOUD_CFG = {
  url:  "https://jzxajxwtcemrztfwbdkm.supabase.co",
  anon: "sb_publishable_UxWs9yx1r4fbo4KJJZqYLA_ndNyVgT0",
};
// суффикс логина = домен почты. При переезде на свой домен (razvedchick.online/.ru) меняется ТУТ + миграция email аккаунтов.
const LOGIN_DOMAIN = "@razvedchick.ru";        // домен логина = корпоративный (почта восстановления на своём сервере)

/* ---------- Utils ---------- */
const uid = () => (crypto?.randomUUID?.() || (Date.now()+"_"+Math.random().toString(16).slice(2)));

/* ============================================================
   ПРОФИЛИ БАЗ (мультибаза)
   ------------------------------------------------------------
   У каждой базы — полностью изолированное состояние: склад, партии,
   журналы, задачи, категории и СВОИ места хранения.

   Модель хранения:
   - STORE_KEY ("vahtahoz:v1") всегда хранит ЖИВЫЕ данные АКТИВНОЙ базы
     (поэтому весь старый код, SW и экспорт работают без изменений,
      а существующие данные автоматически становятся «Базой 1»).
   - PROFILES_KEY хранит метаданные: { activeId, list:[{id,name}] }.
   - Снимок каждой НЕактивной базы лежит в slotKey(id) = "vahtahoz:v1::<id>".
   Переключение: снимок активной → её слот, слот целевой → STORE_KEY, reload.
   ============================================================ */
const PROFILES_KEY = NS+"vahtahoz:profiles";
const slotKey = (id) => `${STORE_KEY}::${id}`;
function loadProfiles(){
  try{
    const raw = localStorage.getItem(PROFILES_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && Array.isArray(p.list) && p.list.length && p.activeId &&
         p.list.some(x=>x.id===p.activeId)) return p;
    }
  }catch(e){ console.warn("loadProfiles", e); }
  return null;
}
function saveProfiles(p){
  try{ localStorage.setItem(PROFILES_KEY, JSON.stringify(p)); }
  catch(e){ if(e && (e.name==="QuotaExceededError" || e.code===22)) _quotaBlock(); else console.error("saveProfiles", e); }
}
function ensureProfiles(){
  let p = loadProfiles();
  if(!p){
    // первый запуск с профилями: текущие данные (STORE_KEY) становятся «Базой 1»
    const id = uid();
    p = { activeId: id, list: [{ id, name: "База 1" }] };
    saveProfiles(p);
  }
  return p;
}
let profiles = ensureProfiles();
const activeProfile = () => profiles.list.find(x=>x.id===profiles.activeId) || profiles.list[0];
const activeProfileName = () => (activeProfile()?.name || "База");

/* свежее состояние для новой базы: пустой склад/журналы, но без встроенного seed
   (seededAt выставлен, чтобы новая база НЕ получила зашитые 351 продукт первой базы) */
function freshProfileState(opts){
  const s = structuredClone(defaultState);
  s.seededAt = new Date().toISOString();
  if(opts && opts.copyFrom){
    // копируем КАТЕГОРИИ (универсальны для всех баз), но НЕ места хранения —
    // места физические/базо-специфичные (свой склад/кунг), пусть остаются дефолтными.
    s.categories = structuredClone(opts.copyFrom.categories || defaultState.categories);
  }
  return s;
}
function switchProfile(toId, fromAutoLink){
  if(!toId || toId===profiles.activeId) return;
  if(!profiles.list.some(x=>x.id===toId)) return;
  // авто-привязка к облаку при входе = ИНИЦИАЛИЗАЦИЯ (вход в свою базу), не «смена базы пользователем» → роль-гард не применяем.
  // Пользовательское переключение — под гардом (явно, без завязки на тайминг activeCloudId).
  if(!fromAutoLink && roleBaseLocked()){ toast("Переключение баз недоступно для вашей роли"); return; }
  try{
    // 1) снимок активной базы (самые свежие данные — из памяти) в её слот
    localStorage.setItem(slotKey(profiles.activeId), JSON.stringify(state));
    // 2) целевую базу делаем «живой» (STORE_KEY)
    const raw = localStorage.getItem(slotKey(toId));
    localStorage.setItem(STORE_KEY, raw || JSON.stringify(freshProfileState()));
    // 3) фиксируем активную и перезагружаемся — нормализация прогонится на новых данных
    profiles.activeId = toId;
    saveProfiles(profiles);
    location.reload();
  }catch(e){
    console.error("switchProfile", e);
    try{ toast("Не удалось переключить базу"); }catch(_){}
  }
}
async function addProfile(){
  if(roleBaseLocked()){ toast("Создание баз недоступно для вашей роли"); return; }
  const name = await promptSheet("Название новой базы", "", {title:"Новая база"});
  if(name===null) return;
  const nm = cleanName40(name);
  if(!nm){ toast("Пустое название"); return; }
  if(profiles.list.some(x=>x.name.toLowerCase()===nm.toLowerCase())){ toast("База с таким именем уже есть"); return; }
  const init = await chooseSheet(
    `«${nm}»\nС чего начать?`,
    [
      { label:"Пустая база (свои места и категории)", value:"fresh",  color:"btn-primary" },
      { label:"Скопировать категории и места текущей", value:"copy", color:"btn-ghost"   },
    ]
  );
  if(!init) return;
  const id = uid();
  const newState = init==="copy" ? freshProfileState({copyFrom: state}) : freshProfileState();
  try{ localStorage.setItem(slotKey(id), JSON.stringify(newState)); }
  catch(e){ console.error(e); toast("Не удалось создать базу"); return; }
  profiles.list.push({ id, name: nm });
  saveProfiles(profiles);
  logOp("PROFILE_ADD", `База «${nm}»`);
  const go = await confirmSheet(`База «${nm}» создана. Переключиться на неё сейчас?`, {yes:"Переключиться", no:"Остаться"});
  if(go) switchProfile(id);
  else { saveState(); render(); openProfilesSheet(); }
}
async function renameProfile(id){
  const p = profiles.list.find(x=>x.id===id); if(!p) return;
  const name = await promptSheet(`Переименовать «${p.name}»`, p.name, {title:"Переименовать базу"});
  if(name===null) return;
  const nm = cleanName40(name);
  if(!nm || nm===p.name) return;
  if(profiles.list.some(x=>x.id!==id && x.name.toLowerCase()===nm.toLowerCase())){ toast("Имя занято"); return; }
  p.name = nm;
  saveProfiles(profiles);
  logOp("PROFILE_RENAME", `→ «${nm}»`);
  renderHeader(); openProfilesSheet();
  toast("База переименована");
}
async function deleteProfile(id){
  if(profiles.list.length<=1){ toast("Нельзя удалить единственную базу"); return; }
  if(id===profiles.activeId){ toast("Сначала переключитесь на другую базу"); return; }
  const p = profiles.list.find(x=>x.id===id); if(!p) return;
  const ok = await confirmSheet(`Удалить базу «${p.name}» со всеми её складами и журналами? Это НЕЛЬЗЯ отменить.`,{danger:true,yes:"Удалить базу"});
  if(!ok) return;
  // двойное подтверждение для необратимого действия
  const ok2 = await confirmSheet(`Точно удалить «${p.name}»? Данные этой базы будут стёрты навсегда.`,{danger:true,yes:"Да, удалить"});
  if(!ok2) return;
  try{ localStorage.removeItem(slotKey(id)); }catch(e){ console.error(e); }
  if(p.cloudId) clearBaseSyncKeys(p.cloudId);   // чистим осиротевшие маркеры синка (dirty + снимки подписей)
  profiles.list = profiles.list.filter(x=>x.id!==id);
  saveProfiles(profiles);
  logOp("PROFILE_DEL", `База «${p.name}»`);
  renderHeader(); openProfilesSheet();
  toast("База удалена");
}
// базы, которые ПОКАЗЫВАЕМ пользователю: при входе в облако прячем НЕпривязанные локальные базы
// (фантомный дефолт «База 1» при установке), если есть хотя бы одна облачная — иначе участник одной базы
// видел бы чужой/пустой локальный дефолт. Оффлайн (без облака) — показываем всё как есть.
function visibleProfiles(){
  if(cloud.ready && profiles.list.some(x=>x.cloudId)) return profiles.list.filter(x=>x.cloudId || x.id===profiles.activeId);
  return profiles.list;
}
// Порядок баз в списке «Базы»: регион (Западная→Восточная→Рудная) → номер отряда → имя.
function baseRank(name){
  const s = String(name||"");
  const num = parseInt((s.match(/^\s*(\d+)/)||[])[1] || "999", 10);
  let region = 9;
  if(/западн/i.test(s)) region = 1; else if(/восточн/i.test(s)) region = 2; else if(/ругрп|рудн/i.test(s)) region = 3;
  return { region, num };
}
function sortBases(a, b){
  const ra = baseRank(a.name), rb = baseRank(b.name);
  return (ra.region - rb.region) || (ra.num - rb.num) || String(a.name||"").localeCompare(String(b.name||""), "ru");
}
// «Новая база» = локальная, без синхронизации. Уместна вне облака или у владельца; облачному работнику её прячем,
// иначе он создаст непривязанную базу, которую никто не увидит (и visibleProfiles её потом спрячет).

    <div class="font-bold text-xl mb-1">🏠 Базы</div>
    <div class="text-xs opacity-70 mb-3">У каждой базы свой склад, журналы и места хранения. Переключение сохраняет текущую базу и открывает выбранную.</div>
    <div class="space-y-1 max-h-72 overflow-y-auto" id="profList">${rows||`<div class="opacity-70 text-sm py-2">Баз пока нет</div>`}</div>
    <div class="flex gap-2 pt-3">
      ${canAddLocalBase()?`<button class="btn btn-primary flex-1" id="profAddBtn">➕ Новая база</button>`:""}
      <button class="btn btn-ghost ${canAddLocalBase()?"":"flex-1"}" data-close>Закрыть</button>
    </div>
  `);
  const body = document.getElementById("sheetBody");
  const addBtn = body.querySelector("#profAddBtn"); if(addBtn) addBtn.addEventListener("click", ()=>addProfile());
  body.querySelector("#profList").addEventListener("click", e=>{
    const btn = e.target.closest("[data-profact]"); if(!btn) return;
    const row = btn.closest("[data-profid]"); if(!row) return;
    const pid = row.dataset.profid;
    const act = btn.dataset.profact;
    if(act==="switch") switchProfile(pid);
    else if(act==="rename") renameProfile(pid);
    else if(act==="delete") deleteProfile(pid);
  });
}
const todayStr = () => {
  // локальная дата пользователя в формате YYYY-MM-DD (не UTC: иначе вечером/утром daysLeft ошибается на ±1 день)
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
};
const fmtDate = (s) => { if(!s) return "—"; const [y,m,d]=s.split("-"); return `${d}.${m}.${y}`; };
const daysLeft = (s) => { if(!s) return null; const a=new Date(s+"T00:00:00"); const b=new Date(todayStr()+"T00:00:00"); if(isNaN(a)||isNaN(b)) return null; return Math.round((a-b)/86400000); };
// сортировка партий «по ближайшему сроку»: пустой срок уходит в конец
const byExpiry = (a,b)=>(a.expiry||"9999").localeCompare(b.expiry||"9999");
// разбор числа: пробелы/nbsp тысяч; EU «1.000»/«1.000,5»; RU/US «1,000.5» / «1,5»
function parseNum(v){
  let s = String(v==null?"":v).replace(/[\s\u00A0]/g,"").trim();
  if(!s) return 0;
  const hasDot = s.includes("."), hasComma = s.includes(",");
  if(hasDot && hasComma){
    // последний разделитель — десятичный, остальные — тысячи
    if(s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g,"").replace(",", ".");
    else s = s.replace(/,/g,"");
  } else if(hasComma){
    // «1,5» или «1,000» (тысячи) — если ровно 3 цифры после единственной запятой и целая часть длиннее → тысячи
    if(/^\d{1,3}(,\d{3})+$/.test(s)) s = s.replace(/,/g,"");
    else s = s.replace(",", ".");
  } else if(hasDot){
    if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,""); // EU «1.000» → 1000
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}
// тег движения для журнала операций (logOp)
const opTag = k => k==="receipt"?"IN":(k==="issue"?"OUT":"WRITEOFF");
// примечание для записи/партии, созданной из заказа (было продублировано 4×)
const orderNote = (op, suffix="") => `Из заказа${op&&op.note?": "+op.note:""}`+(suffix?" "+suffix:"");
const esc = (s) =>(s??"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Округление количеств: устраняет накопление ошибок плавающей точки (0.1+0.2=0.30000000000000004).
   3 знака достаточно для кг/л (граммы/мл), для шт/кор/уп/меш — фактически целое число. */
const roundQty = (n) => {
  const x = Number(n);
  if(!Number.isFinite(x)) return 0;
  return Math.round(x*1000)/1000;
};
/* Форматирование qty для UI/экспорта: убирает хвостовые нули, оставляя «человеческое» представление. */
const fmtQty = (n) => {
  const x = roundQty(n);
  return Number.isInteger(x) ? String(x) : x.toFixed(3).replace(/0+$/,"").replace(/\.$/,"");
};

/* ---------- Партии (batches) ----------
   Модель: stockItem.batches = [{id, qty, expiry, location, note, createdAt}]
   - Если batches пуст/нет — карточка работает в legacy режиме (qty/expiry/location напрямую).
   - Если batches непустой — qty/expiry/location становятся ПРОИЗВОДНЫМИ (агрегатами).
   syncItemFromBatches() пересчитывает агрегаты после любой мутации партий. */
function batchesOf(it){ return Array.isArray(it?.batches) ? it.batches : []; }
function hasBatches(it){ return batchesOf(it).length > 0; }
function totalQtyOf(it){
  const b = batchesOf(it);
  if(b.length===0) return roundQty(it?.qty || 0);
  return roundQty(b.reduce((s,x)=> s + roundQty(x.qty||0), 0));
}
function locationsOf(it){
  const b = batchesOf(it);
  if(b.length===0) return it?.location ? [it.location] : [];
  const set = new Set(b.map(x=>x.location||"").filter(Boolean));
  return [...set].sort();
}
function nearestExpiryOf(it){
  const b = batchesOf(it);
  const list = b.length ? b.map(x=>x.expiry).filter(Boolean) : (it?.expiry?[it.expiry]:[]);
  if(!list.length) return "";
  return list.slice().sort()[0]; // YYYY-MM-DD сортируется лексикографически
}
function expiringBatchOf(it){
  // партия с ближайшим сроком — используется для подсветки «срок Y в месте Z»
  const b = batchesOf(it);
  if(!b.length) return null;
  const withExp = b.filter(x=>x.expiry);
  if(!withExp.length) return null;
  return withExp.slice().sort((a,b)=>a.expiry.localeCompare(b.expiry))[0];
}
function syncItemFromBatches(it){
  if(!hasBatches(it)) return; // legacy режим — ничего не делаем
  // нормализуем qty в каждой партии и считаем агрегаты
  for(const x of it.batches){ if(x.qty!=null) x.qty = roundQty(x.qty); }
  it.qty = totalQtyOf(it);
  it.expiry = nearestExpiryOf(it);
  const locs = locationsOf(it);
  it.location = locs.length===1 ? locs[0] : ""; // при нескольких — карточный location пустой, UI показывает «N мест»
  it.updatedAt = new Date().toISOString();
}
/* Финализация после мутации партий: если партий не осталось — карточка возвращается
   в legacy-режим с ОБНУЛЁННЫМИ агрегатами (иначе фантомный остаток/просрочка от старых значений). */
function finalizeBatchMutation(it){
  if(!Array.isArray(it.batches)) return;
  if(it.batches.length===0){
    it.qty = 0; it.expiry = ""; it.location = "";
    it.updatedAt = new Date().toISOString();
    delete it.batches;
  } else {
    syncItemFromBatches(it);
  }
}

/* ---------- Input sanitization ---------- */
const SAFE_ID = /^[A-Za-z0-9_\-]{1,64}$/;
const safeId = (v) => (typeof v==="string" && SAFE_ID.test(v)) ? v : uid();
const cleanCatName = (s) => (typeof s==="string") ? s.replace(/[<>'"\\\r\n]/g,"").slice(0,40).trim() : "";
// единый санитайзер коротких имён (места хранения, имена баз и т.п.): убираем опасные символы, ≤40
function cleanName40(s){ return String(s).replace(/[<>'"\\&\r\n]/g,"").trim().slice(0,40); }
// уникальные очищенные имена (часто повторяющийся паттерн); union-вариант для двух списков
const uniqClean = arr => [...new Set((arr||[]).map(cleanName40).filter(Boolean))];
const unionClean = (a,b) => uniqClean([...(a||[]), ...(b||[])]);
const applyTomb = (names, tomb) => (names||[]).filter(n=>!(tomb||[]).includes(n));   // вычесть надгробия из списка имён
function hasBadChars(s){ return /[<>'"\\&\r\n]/.test(String(s)); }
// проверка короткого имени (место/категория): ≤40 символов и без опасных символов.
// показывает тост и возвращает false, если не прошло; true — если ОК (было продублировано 3×)
function validShortName(s){
  if(String(s).length>40){ toast("Слишком длинно (≤40 символов)"); return false; }
  if(hasBadChars(s)){ toast("Нельзя символы < > ' \" \\ &"); return false; }
  return true;
}
function sanitizeIds(arr){
  if(!Array.isArray(arr)) return [];
  for(const it of arr){ if(it && typeof it==="object") it.id = safeId(it.id); }
  return arr;
}
/* --- per-field валидаторы импорта (структура + нормализация); поведение идентично исходному validateImport --- */
function validateArrayField(obj, field){
  if(obj[field]!==undefined && !Array.isArray(obj[field])) throw new Error(`поле ${field} не массив`);
}
function validateJournalsField(obj){
  if(obj.journals!==undefined){
    if(typeof obj.journals!=="object" || Array.isArray(obj.journals)) throw new Error("journals не объект");
    for(const k of JOURNAL_KEYS){
      if(obj.journals[k]!==undefined && !Array.isArray(obj.journals[k])) throw new Error(`journals.${k} не массив`);
      if(obj.journals[k]===undefined) obj.journals[k] = [];
    }
  }
}
function validateCategoriesField(obj){
  if(obj.categories!==undefined){
    if(typeof obj.categories!=="object" || Array.isArray(obj.categories)) throw new Error("categories не объект");
    for(const k of STOCK_TYPE_KEYS){
      if(obj.categories[k]!==undefined && !Array.isArray(obj.categories[k])) throw new Error(`categories.${k} не массив`);
      if(Array.isArray(obj.categories[k])) obj.categories[k] = obj.categories[k].map(cleanCatName).filter(Boolean);
    }
  }
}
function validateLocationsField(obj){
  if(obj.locations!==undefined){
    if(typeof obj.locations!=="object" || Array.isArray(obj.locations)) throw new Error("locations не объект");
    for(const k of STOCK_TYPE_KEYS){
      if(obj.locations[k]!==undefined && !Array.isArray(obj.locations[k])) throw new Error(`locations.${k} не массив`);
      if(Array.isArray(obj.locations[k])) obj.locations[k] = uniqClean(obj.locations[k]);
    }
  }
}
function validateChecklistsField(obj){
  if(obj.checklists!==undefined){
    if(typeof obj.checklists!=="object" || Array.isArray(obj.checklists)) throw new Error("checklists не объект");
    if(obj.checklists.kitchen!==undefined && !Array.isArray(obj.checklists.kitchen)) throw new Error("checklists.kitchen не массив");
    if(Array.isArray(obj.checklists.kitchen)){
      obj.checklists.kitchen = obj.checklists.kitchen
        .filter(c=>c && typeof c==="object")
        .map(c=>({ id: safeId(c.id), text: String(c.text||"").slice(0,200), done: !!c.done }));
    }
  }
}
// нормализуем id у всех записей
function normalizeImportIds(obj){
  if(obj.stock) sanitizeIds(obj.stock);
  if(obj.tasks){
    sanitizeIds(obj.tasks);
    // чек-листы задач: id пунктов идут в inline-onclick → санитизируем при импорте (XSS)
    for(const t of obj.tasks){
      if(!t || typeof t!=="object") continue;
      if(Array.isArray(t.items)){
        t.items = t.items.filter(i=>i&&typeof i==="object")
          .map(i=>({ id:safeId(i.id), text:String(i.text||"").slice(0,200), done:!!i.done }))
          .filter(i=>i.text);
      }
      // поля задачи идут в HTML формы редактирования (due/time — в value атрибута) → валидируем при импорте,
      // иначе мусорная/вредоносная строка в due/time = XSS и ломает daysLeft/сортировку
      t.due  = (typeof t.due==="string"  && /^\d{4}-\d{2}-\d{2}$/.test(t.due))  ? t.due  : "";
      t.time = (typeof t.time==="string" && /^\d{2}:\d{2}$/.test(t.time))       ? t.time : "";
      t.title    = typeof t.title==="string" ? t.title.slice(0,200) : "";
      t.category = typeof t.category==="string" ? cleanCatName(t.category) : "";
      t.priority = TASK_PRIOS.includes(t.priority) ? t.priority : "Средний";
      t.repeat   = ["Нет","День","Неделя","Месяц"].includes(t.repeat) ? t.repeat : "Нет";
    }
  }
  if(obj.log)   sanitizeIds(obj.log);
  if(obj.journals){
    for(const k of JOURNAL_KEYS){
      if(obj.journals[k]) sanitizeIds(obj.journals[k]);
    }
  }
}
// нормализуем ОДНУ позицию склада. Применяется И при импорте, И при загрузке из облака:
// в облако данные мог записать любой участник с edit_stock, поэтому доверять им нельзя так же, как файлу.
// - type идёт в inline-onclick без esc() → только известные ключи (иначе XSS из облака/импорта);
// - qty/партии гасим от float-эпсилонов и мусора; невалидный srок карточки сбрасываем (иначе ломает fmtDate/daysLeft);
// - после чистки партий пересчитываем qty/срок карточки из партий (иначе остаток и сумма партий расходятся).
function normalizeStockItem(s){
  if(!s || typeof s!=="object") return s;
  if(!STOCK_TYPE_KEYS.includes(s.type)) s.type = "product";
  if(s.qty!=="" && s.qty!=null) s.qty = roundQty(s.qty);
  // канон ед.: пустая→шт, упаковка→уп (иначе unit-aware match плодит дубли)
  if(typeof _impUnitKey==="function"){
    const uk = _impUnitKey(s.unit);
    if(uk) s.unit = uk;
    else if(!String(s.unit||"").trim()) s.unit = "шт";
  } else if(!String(s.unit||"").trim()) s.unit = "шт";
  if(typeof s.expiry==="string" && s.expiry && !/^\d{4}-\d{2}-\d{2}$/.test(s.expiry)) s.expiry = "";   // невалидную дату карточки не держим
  if(Array.isArray(s.batches)){
    s.batches = s.batches.filter(b => b && typeof b==="object").map(b => ({
      id: safeId(b.id),
      qty: roundQty(b.qty||0),
      expiry: (typeof b.expiry==="string" && /^\d{4}-\d{2}-\d{2}$/.test(b.expiry)) ? b.expiry : "",
      location: typeof b.location==="string" ? cleanName40(b.location) : "",   // чистим имя места (defense-in-depth поверх esc на рендере)
      note: typeof b.note==="string" ? b.note.slice(0,200) : "",
      createdAt: typeof b.createdAt==="string" ? b.createdAt : new Date().toISOString(),
    })).filter(b => b.qty>0); // партии с нулём/мусором не держим — иначе фантомные место/срок при totalQty=0
    if(s.batches.length===0) delete s.batches;
    else syncItemFromBatches(s);   // остаток/срок карточки = из партий
  }
  return s;
}
// гасим float-эпсилоны на входе, чтобы не тащить мусор из старых экспортов
function normalizeImportStockQty(obj){
  if(Array.isArray(obj.stock)) for(const s of obj.stock) normalizeStockItem(s);
}
function normalizeImportJournalsQty(obj){
  if(obj.journals){
    for(const k of JOURNAL_KEYS){
      if(Array.isArray(obj.journals[k])){
        for(const op of obj.journals[k]){ if(op && op.qty!=null) op.qty = roundQty(op.qty); }
      }
    }
  }
}
function validateImport(obj){
  if(!obj || typeof obj!=="object" || Array.isArray(obj)) throw new Error("корневой объект некорректен");
  validateArrayField(obj, "stock");
  validateArrayField(obj, "tasks");
  validateArrayField(obj, "log");
  validateJournalsField(obj);
  validateCategoriesField(obj);
  validateLocationsField(obj);
  validateChecklistsField(obj);
  normalizeImportIds(obj);
  normalizeImportStockQty(obj);
  normalizeImportJournalsQty(obj);
  return obj;
}

/* пост-загрузочная нормализация (loadState() выполнился до объявления хелперов) */

if(!Array.isArray(state.tasks)) state.tasks = [];
if(!Array.isArray(state.log))   state.log   = [];

/* Типы склада: продукты / хозтовары / инструменты. Единый источник для UI и данных. */
const STOCK_TYPES = [
  { key:"product",   icon:"🥬", label:"Продукты",   addLabel:"Продукт",    short:"Продукты"   },
  { key:"household", icon:"🧴", label:"Хозтовары",   addLabel:"Хозтовар",   short:"Хозка"      },
  { key:"tool",      icon:"🔧", label:"Инструменты", addLabel:"Инструмент", short:"Инструменты"},
];
const STOCK_TYPE_KEYS = STOCK_TYPES.map(t=>t.key);
const typeMeta = (k) => STOCK_TYPES.find(t=>t.key===k) || STOCK_TYPES[0];
// доступные типы склада для роли: Механик/Электрик — только инструменты; Повар — без инструментов; остальные — все.
// (activeMember определён ниже, но объявления функций подняты — на момент рендера всё готово)
function allowedTypeKeys(){
  // выравнивание с серверным can_see_type: владелец и любая орг-роль (директор/бухгалтер/нач.партии) → все типы.
  if(typeof cloud!=="undefined"){
    if(cloud.profile && cloud.profile.is_admin) return STOCK_TYPE_KEYS.slice();
    if((cloud.orgRoles||[]).some(o=>o.active!==false)) return STOCK_TYPE_KEYS.slice();
  }
  const m = (typeof activeMember==="function") ? activeMember() : null;
  const role = m && m.role;
  if(role==="mechanic") return ["tool"];
  if(role==="cook") return ["product","household"];
  return STOCK_TYPE_KEYS.slice();
}
function visibleStockTypes(){ const a=allowedTypeKeys(); return STOCK_TYPES.filter(t=>a.includes(t.key)); }
const DEFAULT_CATEGORIES = {
  household: ["Химия","Уборка","Расходники","Прочее"],
  tool: ["Электроинструмент","Ручной инструмент","Крепёж и метизы","Сантехника","Электрика","Спецодежда и СИЗ","Прочее"],
};
if(!state.categories || typeof state.categories!=="object"){
  state.categories = { product: [], household: [], tool: [] };
}
for(const k of STOCK_TYPE_KEYS){
  if(!Array.isArray(state.categories[k])){
    state.categories[k] = DEFAULT_CATEGORIES[k] ? DEFAULT_CATEGORIES[k].slice() : [];
  }
}
/* Дефолтные места — seed для state.locations при первом запуске и фолбэк, если массив пуст. */
// Места хранения ПРИВЯЗАНЫ К БАЗЕ и у всех разные — поэтому НЕТ глобальных дефолтов (раньше сюда были зашиты
// реальные места одной базы и засеивались во все → чужие «Серый склад/Морозильная камера» появлялись везде).
// Новая база стартует с пустым списком; пользователь добавляет свои места (в форме позиции есть «＋ Новое место»).
const DEFAULT_LOCATIONS = { product: [], household: [], tool: [] };
function getLocations(type){
  const arr = state.locations?.[type];
  return Array.isArray(arr) ? arr.slice() : [];
}
/* Список мест для формы редактирования — включает orphan-значение (которое есть у записи,
   но было удалено из state.locations), чтобы при сохранении не стереть его молча. */
function getLocationsWithOrphan(type, orphanValues){
  const base = getLocations(type);
  const set = new Set(base);
  const orphans = (Array.isArray(orphanValues) ? orphanValues : [orphanValues])
    .map(v => (v||"").toString().trim())
    .filter(v => v && !set.has(v));
  return [...orphans, ...base];
}
// места для выбора партии: дефолтные места типа + «осиротевшие» (фактически используемые в позиции/её партиях)
function batchLocs(it){ return getLocationsWithOrphan(it.type, (it.batches||[]).map(b=>b.location).concat([it.location])); }
// «Надгробия» (tombstones) удалённых мест/категорий — чтобы удаление РАСПРОСТРАНЯЛОСЬ на устройства,
// а union-слияние настроек не возвращало удалённое имя обратно. Хранятся в settings и синкаются.
function ensureTomb(){
  if(!state.delLoc || typeof state.delLoc!=="object" || Array.isArray(state.delLoc)) state.delLoc={};
  if(!state.delCat || typeof state.delCat!=="object" || Array.isArray(state.delCat)) state.delCat={};
  for(const k of STOCK_TYPE_KEYS){ if(!Array.isArray(state.delLoc[k])) state.delLoc[k]=[]; if(!Array.isArray(state.delCat[k])) state.delCat[k]=[]; }
  if(!Array.isArray(state.delJr)) state.delJr=[];   // надгробия ЯВНО удалённых журнальных записей (id) — чтобы удаление доехало до облака и не воскресало pull-ом
}
// пометить журнальную запись удалённой (append-only облако удаляет только помеченные — усечение квоты надгробий НЕ ставит)
// Кап — АВАРИЙНЫЙ клапан от неограниченного роста (высокий: доставленные надгробия снимаются на синке, см. dropDeliveredTombstones,
// поэтому в норме delJr держит лишь НЕдоставленные — их дропать нельзя, иначе удалённая запись воскреснет на pull).
function tombJr(id){
  if(!id) return; ensureTomb();
  if(!state.delJr.includes(id)) state.delJr.push(id);
  // НЕ срезаем хвост: недоставленное надгробие нельзя терять — иначе pull воскресит запись.
  // Доставленные снимает dropDeliveredTombstones после успешного DELETE.
  if(state.delJr.length>20000) console.warn("delJr oversized", state.delJr.length);
}
// после ПОДТВЕРЖДЁННОГО удаления из облака надгробие больше не нужно (запись там уже мертва и на pull не придёт) —
// убираем из delJr, чтобы он не рос и слепой кап не выбросил ЕЩЁ НЕ доставленные надгробия.
function dropDeliveredTombstones(ids){
  if(!Array.isArray(state.delJr) || !ids || !ids.length) return;
  const done=new Set(ids); const before=state.delJr.length;
  state.delJr = state.delJr.filter(id=>!done.has(id));
  if(state.delJr.length!==before){ const _w=cloud.applying; cloud.applying=true; try{ saveState(); }finally{ cloud.applying=_w; } }
}
function tombAdd(map,type,name){ ensureTomb(); const a=map[type]; if(name && !a.includes(name)) a.push(name); }      // удалили имя → в надгробия
function tombRevive(map,type,name){ ensureTomb(); const i=(map[type]||[]).indexOf(name); if(i>=0) map[type].splice(i,1); } // снова добавили/переименовали в это имя → снимаем надгробие
/* state.locations — пользовательские места хранения. При первом запуске сидим из дефолтов.
   Поля внутри: product[], household[], tool[]. */
if(!state.locations || typeof state.locations!=="object" || Array.isArray(state.locations)){
  state.locations = {};
  for(const k of STOCK_TYPE_KEYS) state.locations[k] = DEFAULT_LOCATIONS[k].slice();
}
for(const k of STOCK_TYPE_KEYS){
  if(!Array.isArray(state.locations[k])) state.locations[k] = [];   // пустой список мест — валиден (места добавляет пользователь под свою базу)
}
// чистим дубликаты, пустоты и опасные символы (XSS-страховка для inline-onclick)
for(const k of STOCK_TYPE_KEYS){
  state.locations[k] = uniqClean(state.locations[k]);
}
ensureTomb();   // инициализируем надгробия удалённых мест/категорий
// если место/категория были удалены (надгробие), не воскрешаем их при ре-сидировании дефолтов выше
for(const k of STOCK_TYPE_KEYS){
  if(state.delLoc[k].length) state.locations[k] = applyTomb(state.locations[k], state.delLoc[k]);
  if(state.delCat[k].length && Array.isArray(state.categories[k])) state.categories[k] = applyTomb(state.categories[k], state.delCat[k]);
}
// общие задачи накладываем ДО санитизации — чтобы их id/чек-листы тоже прошли проверку
loadGlobalTasks();
sanitizeIds(state.stock);
sanitizeIds(state.tasks);
sanitizeIds(state.log);
for(const k of JOURNAL_KEYS) sanitizeIds(state.journals[k]);
// нормализуем чек-листы задач: id пунктов идут в inline-onclick → защита от XSS из импорта
for(const t of state.tasks){
  if(Array.isArray(t.items)){
    t.items = t.items.filter(i=>i && typeof i==="object").map(i=>({
      id: safeId(i.id), text: typeof i.text==="string" ? i.text.slice(0,200) : "", done: !!i.done
    })).filter(i=>i.text);
    if(t.items.length===0) delete t.items;
  }
}

/* нормализация существующих количеств: схлопывает накопленные float-эпсилоны
   (91.54999999999998 → 91.55, 12.620000000000001 → 12.62) и заполняет пустую категорию у продуктов */
for(const s of state.stock){
  if(s.type==="product" && !s.category){
    s.category = (state.categories.product||[]).includes("Прочие продукты") ? "Прочие продукты" : "";
  }
  // ЕДИНАЯ строгая чистка (как при импорте/загрузке из облака): type-whitelist (иначе битый type из старого
  // слота → XSS/краш рендера), float-эпсилоны qty, валидация срока, выкидывание зомби-партий qty≤0
  // (иначе фантомные «место/срок» при нулевом остатке), пересчёт агрегатов из партий.
  normalizeStockItem(s);
}

/* МИГРАЦИЯ ЛЕГАСИ: схлопывание "X (до DATE)"-дубликатов в одну карточку с массивом batches.
   Старая реализация saveBatch() создавала отдельную позицию с суффиксом — теперь группируем их обратно. */
(function migrateLegacyBatchSuffix(){
  const RE = /^(.+?)\s*\(до\s+([^)]+)\)\s*$/;
  // строим индекс по type|category|baseName
  const groups = new Map();
  for(const s of state.stock){
    const m = (s.name||"").match(RE);
    if(!m) continue;
    const baseName = m[1].trim();
    const key = `${s.type}|${s.category||""}|${baseName.toLowerCase()}`;
    if(!groups.has(key)) groups.set(key, { baseName, members: [] });
    groups.get(key).members.push(s);
  }
  if(groups.size===0) return;
  let merged = 0, changed = false;
  for(const {baseName, members} of groups.values()){
    if(members.length<1) continue;
    // ищем «родительскую» карточку — та, у кого имя без суффикса; если нет — берём первый member
    const parent = state.stock.find(x =>
      x.type===members[0].type &&
      (x.category||"")===(members[0].category||"") &&
      (x.name||"").toLowerCase() === baseName.toLowerCase() &&
      !RE.test(x.name||"")
    ) || members[0];
    if(parent.name!==baseName){ parent.name = baseName; changed = true; }
    parent.batches = parent.batches || [];
    // если у parent был свой qty>0 без батча — превращаем в первую партию.
    // ВАЖНО: и для случая parent===members[0] (имя уже переименовано выше,
    // цикл ниже его пропустит — без этого блока собственный остаток терялся бы)
    if(parent.batches.length===0 && roundQty(parent.qty||0) > 0){
      parent.batches.push({
        id: uid(), qty: roundQty(parent.qty||0),
        expiry: parent.expiry||"", location: parent.location||"",
        note: "Слияние при миграции", createdAt: parent.createdAt||new Date().toISOString(),
      });
      changed = true;
    }
    // переносим все members в parent.batches
    for(const m of members){
      if(m===parent) continue; // parent уже учтён блоком выше
      if(roundQty(m.qty||0) > 0 || m.expiry){
        parent.batches.push({
          id: uid(), qty: roundQty(m.qty||0),
          expiry: m.expiry||"", location: m.location||"",
          note: "Из «(до …)»", createdAt: m.createdAt||new Date().toISOString(),
        });
        merged++;
      }
      // удаляем дубликат и переадресуем productId в журналах на parent.id
      if(state.journals){
        for(const k of JOURNAL_KEYS){
          for(const op of (state.journals[k]||[])){
            if(op && op.productId===m.id){ op.productId = parent.id; op.productName = baseName; changed = true; }
          }
        }
      }
      state.stock = state.stock.filter(x=>x.id!==m.id);
      changed = true;
    }
    if(parent.batches.length===0) delete parent.batches;
    else syncItemFromBatches(parent);
  }
  if(merged>0 || changed){ saveState(); console.info(`Миграция партий: схлопнуто ${merged} партий "(до …)"`); }
})();
for(const k of JOURNAL_KEYS){
  for(const op of state.journals[k]){
    if(op && op.qty!=null) op.qty = roundQty(op.qty);
  }
}

/* ---------- Theme ---------- */
// тема индивидуальна у пользователя: 'light' | 'dark' | 'system' (по настройке телефона). Хранится локально.
function themeIsLight(){
  if(state.theme==="light") return true;
  if(state.theme==="dark") return false;
  return !(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);   // system
}
function applyTheme(){
  const light = themeIsLight();
  document.documentElement.classList.toggle("light", light);
  document.body.classList.toggle("bg-gray-950", !light);
  document.body.classList.toggle("text-gray-100", !light);
  document.body.classList.toggle("bg-gray-50", light);
  document.body.classList.toggle("text-gray-900", light);
  document.getElementById("navbar").classList.toggle("bg-gray-950/95", !light);
  document.getElementById("navbar").classList.toggle("bg-white/95", light);
  const _tb=document.getElementById("themeBtn"); if(_tb) _tb.textContent = light ? "☀️" : "🌙";   // кнопка темы убрана из шапки (тема — в «Внешний вид»); гард на случай отсутствия
  document.querySelector('meta[name="theme-color"]').setAttribute("content", light?"#f9fafb":"#111827");
}

/* ---------- Navigation ---------- */
let currentView = "dashboard";
function nav(view){
  currentView = view;
  document.querySelectorAll("#views > section").forEach(s=>{
    s.classList.toggle("hidden", s.dataset.view!==view);
  });
  document.querySelectorAll("#navbar .nav-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.nav===view);
  });
  if(view==="more" && cloud.session?.access_token){
    cloudRefreshRecoveryProfile().finally(()=>render());
  } else render();

/* ---------- Sheet ---------- */
let _sheetOnClose = null;
function openSheet(html){
  // предыдущий sheet принудительно закрываем с резолвом null, чтобы await не висел
  if(_sheetOnClose){ try{ _sheetOnClose(); }catch(e){} _sheetOnClose = null; }
  const s=document.getElementById("sheet");
  // Заменяем sheetBody на свежий клон, чтобы сбросить все старые addEventListener
  const oldBody = document.getElementById("sheetBody");

/* ---------- Stock helpers ---------- */
const inStock = (it) => totalQtyOf(it) > 0;
function stockStatus(it){
  // позиции без остатка ("архивные") — отдельный спокойный статус, всегда в конце списка
  if(!inStock(it)) return { color:"gray", text:"Нет в наличии", rank:99, out:true };
  const tq = totalQtyOf(it);
  const low = (it.minStock!==""&&it.minStock!=null && tq <= Number(it.minStock));
  // для подсветки срока — берём «ближайший» по всем партиям; если партий нет — it.expiry
  const expiry = nearestExpiryOf(it);
  const expBatch = expiringBatchOf(it);
  // суффикс «в Морозильной» включается только когда мест ≥ 2 (иначе и так понятно из карточки)
  const locSuffix = (expBatch && locationsOf(it).length>=2 && expBatch.location)
    ? ` · ${expBatch.location}` : "";
  // срок/гарантия подсвечивается у ЛЮБОГО типа, если он указан (хозхимия, гарантия инструмента) —
  // так бейдж карточки согласован с фильтром «Просрочка/Скоро», который тоже идёт по s.expiry
  if(expiry){
    const d = daysLeft(expiry);
    if(d<0)  return { color:"red",    text:`Просрочено (${-d} дн.)${locSuffix}`, rank:0, expiry, expBatch };
    if(d<=3) return { color:"red",    text:`Срок ≤ ${d} дн.${locSuffix}`,         rank:1, expiry, expBatch };
    if(d<=14)return { color:"yellow", text:`Срок ${d} дн.${locSuffix}`,           rank:2, expiry, expBatch };
  }
  if(low) return { color:"yellow", text:`Низкий запас`, rank:3 };
  return { color:null, text:"", rank:9 };
}
function sortedStock(items){
  // мемоизируем rank: stockStatus()→totalQtyOf() делает reduce по партиям, а компаратор
  // вызывал бы его O(n log n) раз. Кешируем по одному вызову на элемент.
  const rankOf = new Map();
  const rank = it => { let r = rankOf.get(it); if(r===undefined){ r = stockStatus(it).rank; rankOf.set(it, r); } return r; };
  return [...items].sort((a,b)=>{
    const ra=rank(a), rb=rank(b);
    if(ra!==rb) return ra-rb;
    const ea=a.expiry||"9999-12-31", eb=b.expiry||"9999-12-31";
    if(ea!==eb) return ea.localeCompare(eb);
    return (a.name||"").localeCompare(b.name||"","ru");
  });
}

// Короткая надпись базы ТОЛЬКО для кнопки переключения в шапке (полное имя — в шите выбора базы).
// Регион без «отряд/РоГРП/РуГРП» и без скобок: «1 отряд РоГРП «Западная»»→«1 Западная»,
// «2 …«Западная»(Детрин)»→«2 Западная», «1 отряд РуГРП»→«1 Рудная» (РуГРП = рудная ГРП).
function shortBaseName(name){
  const s = String(name||"").trim();
  const num = (s.match(/^\s*(\d+)/)||[])[1] || "";
  let region = "";
  if(/восточн/i.test(s)) region = "Восточная";
  else if(/западн/i.test(s)) region = "Западная";
  else if(/ругрп|рудн/i.test(s)) region = "Рудная";
  if(region) return (num ? num+" " : "") + region;
  const plain = s.replace(/\(.*?\)/g,"").replace(/[«»"]/g,"").trim();   // фолбэк: без скобок/кавычек
  return plain.length>16 ? plain.slice(0,15)+"…" : plain;
}
function renderHeader(){

}

/* ---------- Tasks ---------- */
const TASK_CATS = ["Все","Склад","Кухня","База","Баня","Общее"];
const TASK_PRIOS = ["Низкий","Средний","Высокий"];
let taskFilter = { cat:"Все", showDone:false };

// порядок задач: дата (daysLeft) → время-якорь → ручной order (стрелки ↑/↓) → приоритет
function taskCompare(a,b){
  // невалидная/пустая дата → в конец (999), чтобы da-db не давало NaN и сортировка была стабильной
  const da = (a.due && daysLeft(a.due)!=null)?daysLeft(a.due):999, db=(b.due && daysLeft(b.due)!=null)?daysLeft(b.due):999;
  if(da!==db) return da-db;
  const ta = a.time||"99:99", tb = b.time||"99:99";
  if(ta!==tb) return ta<tb?-1:1;
  const oa = Number(a.order||0), ob = Number(b.order||0);
  if(oa!==ob) return oa-ob;
  return TASK_PRIOS.indexOf(b.priority)-TASK_PRIOS.indexOf(a.priority);
}
function renderTasks(){
  const v = document.querySelector('[data-view="tasks"]');
  let list = state.tasks.slice();
  if(taskFilter.cat!=="Все") list = list.filter(t=>t.category===taskFilter.cat);
  if(!taskFilter.showDone) list = list.filter(t=>!t.done);
  list.sort(taskCompare);

  v.innerHTML = `
    <button class="btn btn-primary w-full" onclick="openTaskEdit()">＋ Новая задача</button>

    <div class="scroll-x flex gap-2 pb-1">
      ${TASK_CATS.map(c=>`<button class="chip ${taskFilter.cat===c?"active":""}" onclick="taskFilter.cat='${c}';render()">${c}</button>`).join("")}
      <button class="chip ${taskFilter.showDone?"active":""}" onclick="taskFilter.showDone=!taskFilter.showDone;render()">Показывать выполненные</button>
    </div>

    ${list.length
      ? `<div class="space-y-2">${list.map(taskRow).join("")}</div>`
      : `<div class="card text-center opacity-70">Задач нет 🎉</div>`}
  `;
}

function taskRow(t, opts){
  const showMove = !opts || opts.showMove!==false;

  let dueBadge="";
  if(t.due){
    if(d<0) dueBadge=`<span class="badge badge-red">Просрочено ${-d} дн.</span>`;

    else dueBadge=`<span class="badge badge-gray">${fmtDate(t.due)}</span>`;

  const timeBadge = t.time?`<span class="badge badge-gray">🕒 ${esc(t.time)}</span>`:"";
  const prioBadge = t.priority==="Высокий"?`<span class="badge badge-red">!</span>`
                  : t.priority==="Средний"?`<span class="badge badge-yellow">~</span>`:"";
  // чек-лист задачи (напр. «что принести со склада») — отдельный блок под карточкой

  const doneCnt = items.filter(i=>i.done).length;

          <span class="${i.done?"line-through opacity-60":""}">${esc(i.text)}</span>

  return `

            ${t.done?'<span class="block text-white text-center leading-7">✓</span>':""}
          </span>

          <div class="font-semibold ${t.done?"line-through":""}">${esc(t.title)}</div>
          <div class="text-xs opacity-70 mt-1 flex flex-wrap gap-2 items-center">
            <span class="badge badge-gray">${esc(t.category||"Общее")}</span>
            ${prioBadge} ${dueBadge} ${timeBadge}
            ${t.repeat&&t.repeat!=="Нет"?`<span class="badge badge-gray">🔁 ${esc(t.repeat)}</span>`:""}
            ${listBadge}
          </div>
        </div>
        ${showMove?`<div class="flex flex-col gap-1">
          <button class="btn btn-ghost px-2 py-0" onclick="moveTask('${t.id}',-1)" aria-label="Поднять выше">▲</button>
          <button class="btn btn-ghost px-2 py-0" onclick="moveTask('${t.id}',1)" aria-label="Опустить ниже">▼</button>
        </div>`:""}

function toggleTaskItem(taskId, itemId){
  const t = state.tasks.find(x=>x.id===taskId); if(!t || !Array.isArray(t.items)) return;
  const it = t.items.find(i=>i.id===itemId); if(!it) return;
  it.done = !it.done;
  saveState(); render();
}

function moveTask(id, dir){
  // ручной порядок имеет смысл ТОЛЬКО внутри группы с одинаковыми daysLeft и time —
  // иначе сортировка по дате/времени всё равно перетасует независимо от order.
  let list = state.tasks.slice().filter(t=>!t.done);
  if(taskFilter.cat!=="Все") list = list.filter(t=>t.category===taskFilter.cat);
  list.sort(taskCompare);
  const i = list.findIndex(x=>x.id===id);
  const j = i + (dir<0?-1:1);
  if(i<0 || j<0 || j>=list.length){ toast("Дальше двигать некуда"); return; }
  const a = list[i], b = list[j];
  const dueA = a.due?daysLeft(a.due):999, dueB = b.due?daysLeft(b.due):999;
  const timeA = a.time||"99:99", timeB = b.time||"99:99";
  if(dueA!==dueB || timeA!==timeB){
    toast("Порядок задаётся датой/временем — измените их у задачи");
    return;
  }
  // нормализуем order внутри одной группы, чтобы свап давал детерминированный результат
  const group = list.filter(x=>{
    const dx = x.due?daysLeft(x.due):999;
    const tx = x.time||"99:99";
    return dx===dueA && tx===timeA;
  });
  group.forEach((x,idx)=>{ x.order = idx; });
  const tmp = a.order; a.order = b.order; b.order = tmp;
  saveState(); render();
}

function toggleTask(id){
  const t = state.tasks.find(x=>x.id===id); if(!t) return;
  t.done = !t.done;
  if(t.done){
    logOp("TASK_DONE", t.title);
    if(t.repeat && t.repeat!=="Нет" && t.due){
      const today = todayStr();
      const next = new Date(t.due+"T00:00:00");
      const origDay = next.getDate();
      const step = () => {
        if(t.repeat==="День")   next.setDate(next.getDate()+1);
        if(t.repeat==="Неделя") next.setDate(next.getDate()+7);
        if(t.repeat==="Месяц"){
          // защита от переполнения: 31.01 + 1 мес = 03.03 в JS; нормализуем к последнему дню целевого месяца
          const targetMonth = next.getMonth()+1;
          next.setDate(1);
          next.setMonth(targetMonth);
          // ставим оригинальный день, либо последний день месяца, если оригинального нет (29-31 фев и т.п.)
          const lastDay = new Date(next.getFullYear(), next.getMonth()+1, 0).getDate();
          next.setDate(Math.min(origDay, lastDay));
        }
      };
      step();
      // если задача была сильно просрочена (вплоть до ~10 лет), перематываем строго в будущее
      const localDateStr = (d) => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
      let guard = 0;
      while(localDateStr(next) <= today && guard++ < 3650) step();
      const nextDue = localDateStr(next);
      // корневой id серии: если t уже копия — берём её parentId, чтобы цепочка оставалась плоской
      const rootId = t.parentId || t.id;
      // дубликат — только незавершённая копия с тем же rootId серии.
      // (эвристику по названию/дате убрали: две независимые серии с одинаковым названием
      //  и совпавшей следующей датой ложно подавляли создание копии второй серии)
      const exists = state.tasks.some(x=> !x.done && (x.parentId||x.id)===rootId);
      if(!exists){
        // order сбрасываем — ручной порядок не имеет смысла переносить на новую дату
        // список (items) переносим с обнулёнными галочками и новыми id (чтобы завтра собирать заново)
        const nextItems = Array.isArray(t.items) ? t.items.map(i=>({ id:uid(), text:i.text, done:false })) : undefined;
        const nextTask = {...t, id:uid(), parentId:rootId, order:undefined, done:false, due:nextDue, createdAt:new Date().toISOString()};
        if(nextItems) nextTask.items = nextItems;
        state.tasks.push(nextTask);
        toast(`✓ Готово · следующая ${fmtDate(nextDue)}`);
      } else {
        toast("✓ Готово");
      }
    } else {
      toast("✓ Готово");
    }
  } else {
    // откат: удаляем автоматически созданную следующую копию по корневому id серии (только незавершённую)
    const rootId = t.parentId || t.id;
    state.tasks = state.tasks.filter(x=> !((x.parentId||"")===rootId && x.id!==t.id && !x.done));
    toast("Снято");
  }
  saveState(); render();
}

// парсинг textarea списка → items[], сохраняя галочки по совпадению текста со старым списком
function parseTaskItems(raw, oldItems){
  // каждый старый пункт матчим не более одного раза — иначе дубль-строки получат общий id
  const old = (Array.isArray(oldItems) ? oldItems : []).slice();
  return String(raw||"").split("\n").map(s=>s.trim()).filter(Boolean).slice(0,100).map(text=>{
    const t = text.slice(0,200);
    const idx = old.findIndex(o=>o.text===t);
    if(idx>=0){ const prev = old.splice(idx,1)[0]; return { id: prev.id, text: t, done: !!prev.done }; }
    return { id: uid(), text: t, done: false };
  });
}
function saveTask(id){
  const body = document.getElementById("sheetBody");
  const title = body.querySelector("#tt").value.trim();
  if(!title){ toast("Название обязательно"); return; }
  const cat = body.querySelector(".chip.active[data-cat]")?.dataset.cat || "Общее";
  const prio = body.querySelector(".chip.active[data-prio]")?.dataset.prio || "Средний";
  const rep = body.querySelector(".chip.active[data-rep]")?.dataset.rep || "Нет";
  const due = body.querySelector("#td").value;
  const time = (body.querySelector("#ttime")?.value || "").trim();
  const itemsRaw = body.querySelector("#titems")?.value || "";
  if(id){
    const t = state.tasks.find(x=>x.id===id);
    if(!t){ toast("Задача изменилась на другом устройстве"); closeSheet(); render(); return; }   // удалена/синкнута между открытием формы и сохранением → не падаем на t.due
    // если поменялась дата/время — старый order относится к другой группе, сбросим
    const groupChanged = t.due!==due || (t.time||"")!==time;
    const items = parseTaskItems(itemsRaw, t.items);
    Object.assign(t,{title,category:cat,priority:prio,repeat:rep,due,time});
    if(items.length) t.items = items; else delete t.items;
    if(groupChanged){
      const sameGroup = state.tasks.filter(x=> x!==t && x.due===due && (x.time||"")===time);
      const maxOrder = sameGroup.reduce((m,x)=> Math.max(m, Number(x.order||0)), -1);
      t.order = maxOrder+1;
    }
    logOp("TASK_EDIT", title);
  } else {
    // order = max(существующих в той же дате/времени) + 1, чтобы новая задача попадала в конец группы,
    // а не выше задач, которые пользователь уже ручную опустил вниз
    const sameGroup = state.tasks.filter(x=> x.due===due && (x.time||"")===time);
    const maxOrder = sameGroup.reduce((m,x)=> Math.max(m, Number(x.order||0)), -1);
    const items = parseTaskItems(itemsRaw, []);
    const nt = {id:uid(), title, category:cat, priority:prio, repeat:rep, due, time, order:maxOrder+1, done:false, createdAt:new Date().toISOString()};
    if(items.length) nt.items = items;
    state.tasks.push(nt);
    logOp("TASK_ADD", title);
  }
  saveState(); closeSheet(); render();
}
async function deleteTask(id){
  if(!await confirmSheet("Удалить задачу?",{danger:true,yes:"Удалить"})) return;
  const t = state.tasks.find(x=>x.id===id);
  // удаляем саму задачу + всю forward-цепочку повторов (parentId-наследников), чтобы не оставались зомби-копии
  const toRemove = new Set([id]);
  let grew = true;
  while(grew){
    grew = false;
    for(const x of state.tasks){
      if(x.parentId && toRemove.has(x.parentId) && !toRemove.has(x.id)){
        toRemove.add(x.id); grew = true;
      }
    }
  }
  state.tasks = state.tasks.filter(x=>!toRemove.has(x.id));
  logOp("TASK_DEL", (t?.title||"") + (toRemove.size>1?` (+${toRemove.size-1} повторов)`:""));
  saveState(); closeSheet(); render();
}

let stockTab = "all";
let stockSearch = "";
let stockCat = ""; // фильтр по категории ("" = все)

let stockExpiryFilter = "all"; // all | expired | soon (≤7дн)

const JOURNAL_META = {

function renderStock(){
  const v = document.querySelector('[data-view="stock"]');

      <button class="chip ${stockMode==='stock'?'active':''}" data-stockmode="stock">📦 Остатки</button>
      ${Object.entries(JOURNAL_META).map(([k,m])=>`<button class="chip ${stockMode===k?'active':''}" data-stockmode="${k}">${m.icon} ${m.label} (${(state.journals[k]||[]).length})</button>`).join("")}

  }

  const allowed = allowedTypeKeys();
  if(STOCK_TYPE_KEYS.includes(stockTab)) cats = state.categories[stockTab] || [];
  else cats = [...new Set(allowed.flatMap(k=>state.categories[k]||[]))];

  // подсчёт по категориям для текущего таба (только позиции в наличии)
  const countByCat = {};
  const base = state.stock.filter(s=> stockTab==="all" ? allowed.includes(s.type) : s.type===stockTab);
  base.forEach(s=>{ if(s.category && inStock(s)){ countByCat[s.category]=(countByCat[s.category]||0)+1; } });
  // счётчики сроков должны совпадать с видимым списком: учитываем категорию и поиск
  const q = stockSearch.trim().toLowerCase();
  const expScope = base.filter(s=>
    (!stockCat || s.category===stockCat) &&
    (!q || (s.name||"").toLowerCase().includes(q))
  );

  v.innerHTML = `
    ${modeTabs}
    <div class="grid grid-cols-3 gap-2">
      ${visibleStockTypes().map(t=>`<button class="btn btn-ghost" onclick="openStockEdit(null,'${t.key}')">＋ ${t.addLabel}</button>`).join("")}
    </div>

    <div class="scroll-x flex gap-2">
      ${_visTypes.length>1?`<button class="chip ${stockTab==='all'?'active':''}" data-stocktab="all">Все (${state.stock.filter(s=>inStock(s)&&allowed.includes(s.type)).length})</button>`:""}
      ${_visTypes.map(t=>`<button class="chip ${stockTab===t.key?'active':''}" data-stocktab="${t.key}">${t.icon} ${t.short} (${state.stock.filter(s=>s.type===t.key&&inStock(s)).length})</button>`).join("")}
    </div>

    <div class="scroll-x flex gap-2">

      <button class="chip ${stockExpiryFilter==='soon'?'active':''}" data-expfilter="soon">⏰ Скоро (${expScope.filter(s=>{if(!inStock(s))return false;const d=s.expiry?daysLeft(s.expiry):null;return d!==null&&d>=0&&d<=14;}).length})</button>
    </div>

    <details class="stock-cat" ${stockCatOpen?"open":""}>
      <summary class="chip" style="display:inline-flex;align-items:center;gap:6px;list-style:none">🏷 ${stockCat?`Категория: ${esc(stockCat)}`:"Все категории"} ▾</summary>
      <div class="scroll-x flex gap-2 mt-2" id="stockCatChips">
        <button class="chip ${stockCat===''?'active':''}" data-stockcat="">Все категории</button>

  `;
  // Привязываем поиск с debounce и частичным ререндером (фокус не теряется)
  const inp = document.getElementById("stockSearchInp");
  inp.addEventListener("input", ()=>{
    clearTimeout(stockSearchT);
    stockSearchT = setTimeout(()=>{

function renderStockList(){
  const box = document.getElementById("stockListBox");
  if(!box) return;
  let list = state.stock.slice();
  if(STOCK_TYPE_KEYS.includes(stockTab)) list = list.filter(s=>s.type===stockTab);
  else list = list.filter(s=>allowedTypeKeys().includes(s.type));   // «Все» = только типы, доступные роли
  if(stockCat) list = list.filter(s=>s.category===stockCat);
  if(stockExpiryFilter==="expired") list = list.filter(s=>inStock(s) && s.expiry && daysLeft(s.expiry)<0);
  else if(stockExpiryFilter==="soon") list = list.filter(s=>{ if(!inStock(s)) return false; const d=s.expiry?daysLeft(s.expiry):null; return d!==null && d>=0 && d<=14; });
  if(stockSearch.trim()){
    const q = stockSearch.trim().toLowerCase();
    list = list.filter(s=>{
      if((s.name||"").toLowerCase().includes(q)) return true;
      if((s.location||"").toLowerCase().includes(q)) return true;
      // ищем по местам/примечаниям всех партий
      for(const b of (s.batches||[])){
        if((b.location||"").toLowerCase().includes(q)) return true;
        if((b.note||"").toLowerCase().includes(q)) return true;
      }
      return false;
    });
  }
  list = sortedStock(list);
  const total = list.length;
  const outCount = list.filter(s=>!inStock(s)).length;
  const inCount  = total - outCount;
  const shown = list.slice(0, stockLimit);
  if(!total){
    const noFilters = !stockSearch.trim() && !stockCat && stockExpiryFilter==="all";
    box.innerHTML = `<div class="card text-center opacity-70">${noFilters
      ? "Склад пуст. Нажмите «＋» вверху, чтобы добавить первую позицию."
      : "Ничего не найдено"}</div>`;
    return;
  }
  const more = total > shown.length
    ? `<button class="btn btn-ghost w-full mt-2" id="stockMore">Показать ещё (${total - shown.length})</button>`
    : `<div class="text-center text-xs opacity-60 mt-2">В наличии: ${inCount}${outCount?` · нет в наличии: ${outCount}`:""}</div>`;
  // визуальный разделитель перед блоком «нет в наличии» (только если он попадает в показанный срез)
  let html = "";
  let firstOutSeen = false;
  for(const it of shown){
    if(!firstOutSeen && !inStock(it) && inCount>0){
      firstOutSeen = true;
      html += `<div class="text-xs opacity-60 mt-3 mb-1 uppercase tracking-wide">— Нет в наличии (${outCount}) —</div>`;
    }
    html += stockRow(it);
  }
  box.innerHTML = `<div class="space-y-2">${html}</div>${more}`;
  const moreBtn = document.getElementById("stockMore");
  if(moreBtn) moreBtn.addEventListener("click", ()=>{ stockLimit += 200; renderStockList(); });
}

/* ---------- Journals (операции) + помесячный архив ---------- */
let journalMonth = null;   // выбранный месяц архива (YYYY-MM); null → последний (текущий)
const RU_MONTHS3=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
const monthKeyOf = (ts)=> (ts||"").slice(0,7);   // ISO → YYYY-MM
function monthLabel(ym){ if(!ym) return ""; const p=ym.split("-"); return `${RU_MONTHS3[(+p[1])-1]||p[1]} ${p[0]}`; }
function journalMonths(){   // все месяцы с записями по всем 4 журналам, свежие сверху
  const set=new Set();
  for(const k of JOURNAL_KEYS) for(const op of (state.journals[k]||[])){ const mk=monthKeyOf(op.ts); if(mk) set.add(mk); }
  return [...set].sort().reverse();
}
// экспорт всех журналов за выбранный месяц (архив) — 4 листа
async function exportJournalsMonth(ym){
  toast("Подготовка файла…");
  let XLSX; try{ XLSX=await ensureXlsx(); }catch(e){ toast("Не удалось сделать Excel — сохраняем в простом виде"); return; }

  let byKind = null; const cid = activeCloudId();

      if(Array.isArray(rows)){

      row["Примечание"]=op.note||""; return row;
    });
    const ws=xlsxGuard(XLSX.utils.json_to_sheet(rows.length?rows:[{"Дата":"","Наименование":""}]));
    ws["!cols"]=[{wch:16},{wch:34},{wch:11},{wch:9},{wch:16},{wch:12},{wch:10},{wch:24}];

// Общий пикер «поиск позиции склада» для форм операций (openOpEdit/editOp).
// prefix — префикс id элементов (op/eop); тексты подсказок и поведение nameI на выборе отличаются → параметры.
function wireStockPicker({prefix, emptyHint, notFoundText, nameOnPick}){
  const input=document.getElementById(prefix+"Search");
  const list =document.getElementById(prefix+"List");
  const sel  =document.getElementById(prefix+"Sel");
  const hid  =document.getElementById(prefix+"ProdId");
  const unit =document.getElementById(prefix+"Unit");
  const nameI=document.getElementById(prefix+"Name");
  if(!input||!list) return;
  const PICK_CAP = 50;   // список прокручиваемый (max-h-60 overflow) — показываем больше, при переполнении подсказываем уточнить
  function renderList(q){
    const Q=q.trim().toLowerCase();
    if(!Q){ list.innerHTML=`<div class="text-xs opacity-60 p-2">${emptyHint}</div>`; return; }
    const matched=state.stock.filter(s=>(s.name||"").toLowerCase().includes(Q));
    const found=matched.slice(0,PICK_CAP);
    if(!found.length){ list.innerHTML=`<div class="text-xs opacity-60 p-2">${notFoundText}</div>`; return; }
    list.innerHTML = found.map(s=>`<button type="button" class="w-full text-left p-2 rounded hover:bg-white/5" data-pick="${esc(s.id)}">${typeMeta(s.type).icon} ${esc(s.name)} <span class="opacity-60 text-xs">· ${fmtQty(s.qty)} ${esc(s.unit||"")}</span></button>`).join("")
      + (matched.length>PICK_CAP ? `<div class="text-xs opacity-60 p-2">Показаны первые ${PICK_CAP} из ${matched.length} — уточните запрос</div>` : "");
  }
  renderList("");
  input.addEventListener("input", ()=>renderList(input.value));
  list.addEventListener("click", e=>{
    const b=e.target.closest("[data-pick]"); if(!b) return;
    const s=state.stock.find(x=>x.id===b.dataset.pick); if(!s) return;
    hid.value=s.id;
    sel.textContent=`Выбрано: ${s.name} (${fmtQty(s.qty)} ${s.unit||""})`;
    if(UNITS.includes(s.unit)) unit.value=s.unit;
    nameI.value = nameOnPick ? s.name : "";
  });
}
