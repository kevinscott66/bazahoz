async function downloadReceiptTemplate(){
  let XLSX; try{ XLSX = await ensureXlsx(); }catch(e){ toast("Не удалось загрузить Excel-модуль (нужна сеть в первый раз)"); return; }
  /* Колонка «Тип» — чтобы одним файлом можно было завезти и еду, и хозку, и инструмент.
     Оставить её пустой можно: тогда тип берётся с той вкладки склада, где человек стоит. */
  const sample = [
    { "Тип":"Продукты", "Наименование":"Манная крупа", "Количество":7, "Ед. изм.":"кг", "Категория":"Крупы", "Срок годности":"", "Место":"Склад А", "Примечание":"", "Дата":"2026-07-22" },
    { "Тип":"Продукты", "Наименование":"Молоко сгущённое", "Количество":24, "Ед. изм.":"шт", "Категория":"Молочные продукты", "Срок годности":"2027-01-15", "Место":"", "Примечание":"Поставщик X", "Дата":"2026-07-24" },
    { "Тип":"Хозтовары", "Наименование":"Перчатки х/б", "Количество":50, "Ед. изм.":"уп", "Категория":"Расходники", "Срок годности":"", "Место":"", "Примечание":"", "Дата":"" },
  ];
  const ws = XLSX.utils.json_to_sheet(sample);
  ws["!cols"] = [{wch:12},{wch:28},{wch:12},{wch:10},{wch:20},{wch:14},{wch:14},{wch:22},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Поступление");
  saveXlsx(wb, `vahtahoz-шаблон-поступление.xlsx`, "Шаблон сохранён");
}

function _impFileHint(name){
  const m = String(name||"").match(/(\d{4,})/);
  return m ? m[1] : String(name||"").replace(/\.[^.]+$/,"").slice(0,24);
}

async function importReceiptsExcel(ev){
  const list = ev.target.files ? Array.from(ev.target.files) : [];
  const inputEl = ev.target;
  if(!list.length) return;
  if(!ensureCanEdit()){ inputEl.value=""; return; }
  /* Точек вывода теперь ДВЕ: лист «Импорт поступления» («Склад» → «Поступление») и раздел
     «Файлы». Обе несут #impReceiptOut, а getElementById отдаёт первый по документу — им всегда
     оказывался бы раздел «Файлы» (он в #views, выше #sheet в разметке), и отчёт об импорте,
     запущенном из листа, уходил бы в скрытый экран. Берём ту, что сейчас на глазах: и лист
     (.sheet без .open), и раздел (.hidden) прячутся через display:none, поэтому offsetParent
     у невидимой копии === null. Сама операция от этого не меняется. */
  const out = ()=>{
    const all = document.querySelectorAll("#impReceiptOut");
    for(const el of all){ if(el.offsetParent !== null) return el; }
    return all[0] || null;
  };
  if(list.length > IMP_MAX_FILES){ if(out()) out().textContent=`Слишком много файлов (макс. ${IMP_MAX_FILES}).`; inputEl.value=""; return; }
  for(const f of list){
    if(f.size > IMP_MAX_BYTES){ if(out()) out().textContent=`«${f.name}» слишком большой (макс. ${Math.round(IMP_MAX_BYTES/1024/1024)} МБ).`; inputEl.value=""; return; }
  }
  if(out()) out().textContent = list.length>1 ? `Чтение ${list.length} файлов…` : "Чтение файла…";
  let XLSX;
  try{ XLSX = await ensureXlsx(); }
  catch(e){ if(out()) out().textContent="Не удалось загрузить Excel-модуль (нужна сеть в первый раз)."; inputEl.value=""; return; }

  const readOne = (f)=> new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(new Uint8Array(reader.result));
    reader.onerror = ()=>reject(new Error("read"));
    reader.readAsArrayBuffer(f);
  });

  const allRows = [];
  const meta = [];
  try{
    for(const f of list){
      const buf = await readOne(f);
      const hint = _impFileHint(f.name);
      let parsed;
      try{ parsed = _impParseWorkbook(XLSX, buf, hint, f.name); }
      catch(e){ console.warn("import parse", f.name, e); if(out()) out().textContent=`Не удалось прочитать «${f.name}».`; inputEl.value=""; return; }
      if(parsed.error){ if(out()) out().textContent = `${f.name}: ${parsed.error}`; inputEl.value=""; return; }
      const rows = parsed.rows||[];
      meta.push({ name:f.name, n:rows.length, format:parsed.format||"?", date:parsed.receiptDate||"" });
      allRows.push(...rows);
    }
  }catch(e){
    console.warn("import read", e);
    if(out()) out().textContent="Ошибка чтения файла.";
    inputEl.value=""; return;
  }
  inputEl.value = "";
  if(allRows.length > IMP_MAX_ROWS){ if(out()) out().textContent=`Слишком много строк суммарно (${allRows.length}, макс. ${IMP_MAX_ROWS}).`; return; }

  /* Число в диалоге считает СУХОЙ ПРОГОН, а не фильтр «есть имя и qty>0». Прежний фильтр знал
     только эти два условия, а recordReceiptRow отбрасывал строки ещё по двум — неизвестная
     единица и единица, не сводимая к карточке, — уже ПОСЛЕ подтверждения. Кладовщик видел
     «Импортировать поступлений: 4», строку «Крупа гречневая — 4 ящик» в превью, а потом тост
     «Импортировано: 3»: какая из четырёх не прошла — нигде. Теперь пропуски названы поимённо
     и до нажатия «Импортировать». */
  const pre = _impPreflight(allRows);
  const valid = pre.ok;
  if(!valid.length){
    const why = pre.skipped.length
      ? `Ни одна строка не подходит для импорта (всего: ${allRows.length}).\n` +
        pre.skipped.slice(0,8).map(s=>`• ${s.name} — ${s.why}`).join("\n") +
        (pre.skipped.length>8 ? `\n…и ещё ${pre.skipped.length-8}` : "")
      : `Не найдено строк с наименованием и количеством > 0 (всего: ${allRows.length}).`;
    if(out()) out().textContent = why; return;
  }

  const filesLine = meta.map(m=>{
    const d = m.date ? m.date.split("-").reverse().join(".") : "";
    const tag = m.format==="upd" ? ` (УПД${d?`, ${d}`:""})` : "";
    return `• ${m.name}: ${m.n} поз.${tag}`;
  }).join("\n");
  const preview = valid.slice(0,8).map(r=>{
    const u = _impMapUnit(r.unit) || (String(r.unit||"").trim() || "?");
    const d = _impParseDate(r.receiptDate);
    // раздел показываем только для не-продуктов: файл с хозкой/инструментом теперь ложится
    // не в «Продукты», и это должно быть видно ДО подтверждения
    const t = (_impRowType(r).type) || "product";
    const tl = t==="product" ? "" : ` · ${typeMeta(t).short}`;
    return `• ${cleanNameImport(r.name).slice(0,48)} — ${fmtQty(roundQty(parseNum(r.qty)))} ${u}${tl}${d?` · ${d.split("-").reverse().join(".")}`:""}`;
  }).join("\n");
  const skipLine = pre.skipped.length
    ? `\n\nНе пойдёт в импорт (${pre.skipped.length}):\n` +
      pre.skipped.slice(0,6).map(s=>`• ${s.name} — ${s.why}`).join("\n") +
      (pre.skipped.length>6 ? `\n…и ещё ${pre.skipped.length-6}` : "")
    : "";
  /* Предупреждение про вторую карточку с тем же именем. Сливать «Сахар-песок 20 кг» со строкой
     «Сахар-песок 5 шт» нельзя — это разный товар, — но и молчать нельзя: в списке склада имя
     задвоится, и это читается как ошибка приложения. */
  const dupLine = pre.dups.length
    ? `\n\nЗаведётся ОТДЕЛЬНАЯ карточка — на складе то же имя в других единицах (${pre.dups.length}):\n` +
      pre.dups.slice(0,6).map(d=>`• ${d.name} — в файле ${d.unit}, на складе ${d.have}`).join("\n") +
      (pre.dups.length>6 ? `\n…и ещё ${pre.dups.length-6}` : "")
    : "";
  /* Повтор одной и той же накладной — рядовая беда: экран не отозвался и файл выбрали дважды,
     либо один УПД прислали и кладовщику, и начальнику. Говорим об этом ПЕРВОЙ строкой, но не
     запрещаем: повторный приход бывает и настоящим (см. _impLooksReloaded). */
  const again = _impLooksReloaded(pre.keys);
  // «1 позиция / 2 позиции / 5 позиций» — иначе предупреждение о потере денег выглядит опечаткой
  const _pos = (n)=>{ const a=n%100, b=n%10;
    return (a>=11 && a<=14) ? "позиций" : b===1 ? "позиция" : (b>=2 && b<=4) ? "позиции" : "позиций"; };
  const againLine = again
    ? `\n\n⚠ ПОХОЖЕ, ЭТУ НАКЛАДНУЮ УЖЕ ЗАГРУЖАЛИ${again.when?` — ${again.when}`:""}.\n`
      + `${again.matched} из ${again.total} ${_pos(again.matched)} уже есть в журнале поступлений с теми же количествами. `
      + `Если приход настоящий (привезли ещё раз) — продолжайте, количества сложатся.`
    : "";
  const go = await confirmSheet(
    `Импортировать поступлений: ${valid.length}${againLine}\n\nФайлы:\n${filesLine}\n\n${preview}${valid.length>8?`\n…и ещё ${valid.length-8}`:""}${skipLine}${dupLine}`,
    { yes:"Импортировать", no:"Отмена", title:"Подтверждение импорта" }
  );
  if(!go) return;
  let ok = 0, unitSkip = 0;
  for(const r of valid){
    try{
      const res = recordReceiptRow(r);
      if(res) ok++;
      /* Сухой прогон повторяет все отказы recordReceiptRow, поэтому здесь ждать нечего.
         Счётчик оставлен как сторож: если он вырос — прогон и боевой цикл разошлись
         (например, в recordReceiptRow добавили условие и забыли про _impPreflight). */
      else { unitSkip++; console.warn("import: строка отсеяна после сухого прогона", r); }
    }catch(e){ console.warn("recordReceiptRow", e); unitSkip++; }
  }
  /* Потолок журнала поступлений. Раньше здесь стоял голый `slice(0,3000)` — единственное
     усечение журнала во всём приложении, которое шло МИМО _trimJournalKeepPending. Три беды
     сразу: (1) выбрасывались и записи, которых в облаке ещё нет, — а это их единственная копия,
     и остаток склада их уже учёл (applyStockDelta), то есть склад и журнал расходились навсегда;
     (2) не ставился journalsTrunc, поэтому сверка продолжала считать журнал ПОЛНЫМ ledger-ом и
     правила остатки по обрезку, а бэкап называл себя полным; (3) всё это молча, а следом идущий
     logOp → saveState тут же клал обрезок на диск. Плюс свой потолок 3000 при общем 5000.
     Теперь — общее правило: тот же помощник, тот же предел, честный флаг и явное сообщение. */
  let jrTrimmed = 0;
  const _upl = _uploadedJrIds();   // null — облака нет либо снимок подписей ещё не собран
  /* Режем ТОЛЬКО когда архив заведомо лежит не только здесь. Без облака (или до первой
     синхронизации) телефон — единственная копия, и правило кодовой базы прямое: «Локальная
     база без облака не урезается вовсе». Переполнение памяти там разбирает _saveStateTrimmed,
     и разбирает громко. Усечение надгробий не ставит, значит из облака ничего не удаляется. */
  if(_upl && Array.isArray(state.journals.receipt) && state.journals.receipt.length > JOURNAL_LOCAL_CAP){
    const was = state.journals.receipt.length;
    state.journals.receipt = _trimJournalKeepPending(state.journals.receipt, JOURNAL_LOCAL_CAP, _upl, "receipt");
    jrTrimmed = was - state.journals.receipt.length;
    if(jrTrimmed) state.journalsTrunc = true;
  }
  logOp("IMPORT", `Поступление из Excel: ${ok} поз. (${list.length} файл.)${jrTrimmed?` · журнал урезан на ${jrTrimmed}`:""}`);
  try{ render(); }catch(_){}
  /* Пропуски уже перечислены поимённо в диалоге, до подтверждения, — в тосте хватит числа.
     unitSkip держим отдельной строкой: он теперь означает не «строка с плохой единицей»,
     а расхождение сухого прогона с боевым циклом, и молчать о нём нельзя. */
  const skipParts = [];
  if(pre.skipped.length) skipParts.push(`не подошло: ${pre.skipped.length}`);
  if(unitSkip) skipParts.push(`сбой: ${unitSkip}`);
  toast(`Импортировано: ${ok}${skipParts.length?` · ${skipParts.join(" · ")}`:""}`);
  // тост живёт 1.8 с и его перебьёт следующий — про урезание журнала говорим в самом листе, где текст остаётся
  if(jrTrimmed && out()) out().textContent =
    `Импортировано: ${ok}. В журнале поступлений накопилось больше ${JOURNAL_LOCAL_CAP} записей — ${jrTrimmed} самых старых убрано с телефона. Они уже в общей базе и вернутся при синхронизации.`;
}

/* ===================== ОПИСЬ СКЛАДА (ИНВЕНТАРИЗАЦИЯ ФАЙЛОМ) =====================
   Зачем. Раз в вахту склад пересчитывают руками, на бумаге, а потом кто-то вбивает сотни цифр
   в телефон по одной. Опись — тот же пересчёт, но файлом: скачал бланк, заполнил на компьютере,
   залил обратно.

   ЧЕМ ЭТО НЕ ИМПОРТ НАКЛАДНОЙ. Приход ДОБАВЛЯЕТ к остатку, опись ЗАДАЁТ остаток: в файле стоит
   то, что реально лежит на полке. Раз операция переписывает остатки пачкой, все правила ниже —
   в сторону осторожности:
     • строки НЕТ в файле — значит «не проверяли», а не «ноль»: такие позиции не трогаются вовсе.
       Обнуление есть, но это отдельная галочка с отдельным предупреждением, по умолчанию снятая,
       и действует она только в тех разделах склада, которые в файле реально были;
     • позиция НИКОГДА не удаляется — даже обнулённая карточка остаётся в каталоге со своими
       минимальным запасом, категорией и местом;
     • два шага: сперва разбор и предпросмотр с числами, и только потом отдельное подтверждение.
       До нажатия «Применить» в базу не уходит ни одной цифры;
     • одна кривая строка не валит весь файл — она попадает в список непринятых с причиной,
       остальные принимаются;
     • совпадение с карточкой — только по ТОЧНОМУ имени (регистр и лишние пробелы не в счёт).
       Никакого «похоже на»: в приходе ошибка сопоставления даёт лишнюю карточку, а в описи —
       переписанный не тому товару остаток;
     • позиции с партиями (срок годности) опись не трогает: у них остаток — сумма партий, и
       переписать его одним числом значит потерять сроки. Тот же запрет, что в «Сверке склада».

   ЖУРНАЛ. Каждое изменение — обычная запись «Поступление» или «Списание» с пометкой
   «Опись ДД.ММ.ГГГГ #МЕТКА». Пачка ищется по метке, разбирается по строкам и откатывается
   штатным удалением записи журнала. Отдельной сущности «опись» в базе НЕТ намеренно: на
   телефонах и в APK стоят сборки постарше, они читают ту же базу и о новых сущностях не знают,
   а записи журнала понимают все.

   ПРАВА — как у «Сверки склада»: операция того же веса. На общей базе это начальник участка и
   выше (canManageBase), на локальной — тот, кто её правит: там человек сам себе начальник.
   Кнопки роли без права не показываются вовсе (см. renderFiles), но каждая точка входа
   проверяет право ещё раз — разметку видно из консоли. */
function canInventoryStock(){
  if(!canEditStock()) return false;
  if(!activeCloudId()) return true;   // локальная база — правило уровня телефона
  return canManageBase();             // общая база: начальник участка и выше
}
/* Заголовки бланка описи. Отдельно от _IMP_HEADER_MAP: там «Количество» значит «сколько
   пришло», здесь — «сколько лежит», и мешать эти два смысла в одном словаре нельзя. */
const _INV_HEADER_MAP = {
  name:     ["наименование","название","товар","номенклатура","позиция","name","item","product"],
  qty:      ["фактическийостаток","фактическийостатокшт","фактостаток","факт","фактически","фактическоеколичество",
             "остаток","количество","колво","кол","факт(остаток)","qty","quantity","stock","fact","actual"],
  unit:     ["едизм","ед","единица","единицаизмерения","unit","uom"],
  type:     ["тип","типпозиции","типсклада","раздел","type","kind"],
  category: ["категория","группа","category","group"],
  expiry:   ["срокгодности","срок","годендо","expiry","expirydate","bestbefore"],
  location: ["место","локация","ячейка","location","place"],
  note:     ["примечание","коммент","комментарий","note","comment"],
};
/* Шапка не обязана быть первой строкой: в распечатанной описи сверху бывает «Опись склада от…»,
   номер участка и пустые строки. Ищем строку, где есть И наименование, И фактический остаток. */
function _invParseAoa(aoa){
  let hdr = -1, hmap = null;
  for(let r=0; r<Math.min(15, aoa.length); r++){
    const m = _impMapHeaders((aoa[r]||[]).map(x=>String(x)), _INV_HEADER_MAP);
    const f = Object.values(m);
    if(f.includes("name") && f.includes("qty")){ hdr = r; hmap = m; break; }
  }
  if(hdr < 0) return { rows:[], error:"Не найдены столбцы «Наименование» и «Фактический остаток». Скачайте бланк описи и заполните его." };
  const idxOf = {};
  (aoa[hdr]||[]).forEach((h,i)=>{ const f = hmap[String(h)]; if(f && idxOf[f]==null) idxOf[f] = i; });
  const rows = [];
  for(let r=hdr+1; r<aoa.length; r++){
    const arr = aoa[r]; if(!arr || !arr.length) continue;
    const get = (f)=> idxOf[f]!=null ? arr[idxOf[f]] : "";
    const nm = String(get("name")??"").trim();
    if(!nm) continue;                       // пустая строка-разделитель — не ошибка, молча мимо
    if(/^итого|^всего/i.test(nm)) continue; // подытоги распечатанной описи
    rows.push({
      name:nm, qty:get("qty"), unit:get("unit"), type:get("type"), category:get("category"),
      expiry:get("expiry"), location:get("location"), note:get("note"),
      rowNo: r+1,                           // номер строки как её видит человек в Excel
    });
  }
  return { rows };
}
/* Ключ имени для описи. От stockNormName отличается тем, что СХЛОПЫВАЕТ пробелы — в том числе
   неразрывный, который Excel любит подставлять сам. Иначе карточка «Мука␣␣пшеничная в/с»
   (два пробела — так набирают руками) и строка файла «Мука пшеничная в/с» считались разными
   товарами: заводилась вторая карточка, а первая шла под обнуление как «которой нет в файле». */
const _invNameKey = (s)=> String(s==null?"":s).replace(/[\s ]+/g," ").trim().toLowerCase().replace(/ё/g,"е");
/* Поиск карточки под строку описи. Строго по имени; тип — как в приходе: сперва свой раздел,
   потом остальные разрешённые роли (тот же товар, заведённый когда-то не в тот раздел, лучше
   найти, чем задвоить). В своём разделе несовпадение единицы и двойник — ОТКАЗ строки с
   причиной; в чужих разделах это просто «не нашли», иначе чужая карточка с тем же именем
   мешала бы завести позицию в своём разделе. */
function _invFindStock(pool, name, type, unitKey){
  const n = stockNormName(name);
  const allowed = allowedTypeKeys();
  const order = allowed.includes(type) ? [[type], allowed.filter(x=> x!==type)] : [allowed];
  for(let i=0; i<order.length; i++){
    const strict = (i===0);
    const types = order[i];
    if(!types.length) continue;
    let c = pool.filter(s=> types.includes(s.type) && stockNormName(s.name)===n);
    if(!c.length) continue;
    if(unitKey){
      const same = c.filter(s=> _impUnitKey(s.unit)===unitKey);
      if(!same.length){
        if(strict) return { why:`единица «${unitKey}» не сходится с карточкой «${c[0].unit||"шт"}»` };
        continue;
      }
      c = same;
    }
    if(c.length > 1){
      if(strict) return { why:"на складе несколько карточек с таким названием — сначала объедините дубли" };
      continue;
    }
    return { item:c[0] };
  }
  return { item:null };
}
/* РАЗБОР БЕЗ ЕДИНОЙ ПРАВКИ. Возвращает план: что добавится, что вырастет, что уменьшится, что
   совпало и что не принято. Порядок строк важен так же, как в _impPreflight: строка, заводящая
   новую позицию, должна быть видна следующим строкам того же файла — поэтому в pool кладётся
   заглушка, а повторная строка про ту же позицию отбивается как «уже встречалась» (иначе две
   строки на один товар молча дали бы два разных «фактических» остатка, и победил бы последний). */
function _invPlan(rows){
  const plan = { rows, add:[], up:[], down:[], same:[], bad:[], empty:[], types:new Set() };
  const pool = (state.stock||[]).slice();
  const seen = new Set();
  for(const row of rows){
    const name = cleanNameImport(row.name);
    const bad = (why)=> plan.bad.push({
      name: (name || String(row.name||"").trim()).slice(0,44) || "(без наименования)",
      why, at: row.rowNo ? `стр. ${row.rowNo}` : "",
    });
    if(!name){ bad("нет наименования"); continue; }
    const t = _impRowType(row);
    if(t.why){ bad(t.why); continue; }
    const type = t.type;
    const rawU = String(row.unit||"").trim();
    const u = rawU ? _impMapUnit(rawU) : null;
    /* ПУСТАЯ КЛЕТКА «ФАКТИЧЕСКИЙ ОСТАТОК» — ЭТО «НЕ СЧИТАЛИ»: не ноль и не ошибка. В бланке
       описи заранее стоит весь склад, и незаполненных строк там больше всего — ругаться на
       каждую значит утопить настоящие ошибки в списке из трёхсот «претензий». Карточку при
       этом всё равно ищем: чтобы галочка «обнулить отсутствующих» не сочла эту позицию
       отсутствующей — строка в файле есть, её просто не пересчитали. */
    const rawQty = String(row.qty==null ? "" : row.qty).trim();
    if(rawQty===""){
      const f = _invFindStock(pool, name, type, u ? _impUnitKey(u) : null);
      plan.empty.push({ name, product: f.item || null });
      continue;
    }
    if(rawU && u == null){ bad(`непонятная единица «${rawU.slice(0,16)}»`); continue; }
    /* parseNum на любом мусоре («нет», «—», «ок») честно отдаёт 0, а ноль здесь означает
       «пусто на полке» — то есть списание в ноль. Поэтому сначала смотрим, число ли это. */
    if(typeof row.qty !== "number" && !/^[+-]?[\d\s .,]+$/.test(rawQty)){
      bad(`количество не число: «${rawQty.slice(0,16)}»`); continue;
    }
    const fact = roundQty(parseNum(row.qty));
    if(!(fact >= 0)){ bad("количество меньше нуля"); continue; }
    const found = _invFindStock(pool, name, type, u ? _impUnitKey(u) : null);
    if(found.why){ bad(found.why); continue; }
    const product = found.item;
    if(!product){
      // новой позиции единица нужна: карточка без единицы потом не сойдётся ни с одной накладной
      if(!u){ bad("новой позиции нужна единица измерения"); continue; }
      const stub = { id:"_inv_"+pool.length, type, name, unit:u, qty:fact, batches:[] };
      pool.push(stub); seen.add(stub.id);
      plan.types.add(type);
      plan.add.push({ name, type, unit:u, was:0, now:fact, delta:fact, product:null, row });
      continue;
    }
    if(seen.has(product.id)){ bad("эта позиция в файле уже была выше"); continue; }
    seen.add(product.id);
    if(hasBatches(product)){ bad("позиция с партиями (срок годности) — правится вручную"); continue; }
    const was = totalQtyOf(product);
    plan.types.add(product.type);
    const e = { name:product.name, type:product.type, unit:product.unit||u||"", was, now:fact,
                delta:roundQty(fact - was), product, row };
    if(Math.abs(e.delta) < 1e-9) plan.same.push(e);
    else if(e.delta > 0) plan.up.push(e);
    else plan.down.push(e);
  }
  return plan;
}
/* Кандидаты на обнуление — только при явной галочке. Ограничены разделами, которые в файле
   РЕАЛЬНО были: опись продуктов не должна обнулять инструменты, которых в ней и не было.
   Партийные позиции и здесь не трогаем, а нулевые в кандидаты не идут — списывать нечего. */
function _invZeroCandidates(plan){
  const inFile = new Set();
  // строки без отметки (plan.empty) — тоже «в файле»: их не считали, обнулять их нельзя
  for(const e of plan.add.concat(plan.up, plan.down, plan.same, plan.empty)) if(e.product) inFile.add(e.product.id);
  const allowed = allowedTypeKeys();
  return (state.stock||[]).filter(s=> s && plan.types.has(s.type) && allowed.includes(s.type)
                                   && !inFile.has(s.id) && !hasBatches(s) && totalQtyOf(s) > 0);
}
/* ОТПЕЧАТОК ПЛАНА — ровно те числа, которые человеку показали в диалоге. Перед самой записью
   план пересчитывается заново, и отпечатки сверяются: разошлись — не пишем НИЧЕГО.
   Зачем это нужно. Между «Применить опись» и записью стоят два await (два листа подтверждения),
   а за это время склад успевает измениться: realtime дёргает cloudPull на любую правку напарника,
   и state.stock пересоздаётся целиком. Поймано вживую трижды: (1) напарник выдал 5 кг, пока висел
   лист, — применялась старая дельта, остаток уходил в минус; (2) pull приносил четыре новые
   позиции — под галочку «обнулить отсутствующих» попадали и они, вместо обещанной одной позиции
   обнулялось пять; (3) после pull объекты карточек в плане становились «сиротами» — склад не
   менялся вовсе, а записи в журнал уходили, и расхождение уезжало в облако.
   В отпечаток входит и список обнуления: без него именно случай (2) проходил как «свежий план». */
function _invFingerprint(plan, zeroList){
  const one = (x)=> `${x.product ? x.product.id : "+"+_invNameKey(x.name)}:${x.was}>${x.now}`;
  return JSON.stringify({
    add:  plan.add.map(x=> `${_invNameKey(x.name)}|${x.type}|${x.unit}|${x.now}`).sort(),
    up:   plan.up.map(one).sort(),
    down: plan.down.map(one).sort(),
    same: plan.same.length, empty: plan.empty.length, bad: plan.bad.length,
    zero: (zeroList||[]).map(s=> `${s.id}:${totalQtyOf(s)}`).sort(),
  });
}
/* ПРИМЕНЕНИЕ. Единственное место, которое что-то меняет, и зовётся оно только из applyInventory —
   после предпросмотра, подтверждения и сверки отпечатка, ОДНИМ синхронным куском без await внутри.
   Разница «факт − учёт» проводится обычным движением: плюс → «Поступление», минус → «Списание»,
   обе записи с одной пометкой описи. */
function _invApply(plan, zeroList){
  const day = todayStr();
  const human = day.split("-").reverse().join(".");
  const tag = String(uid()).replace(/[^0-9a-z]/gi,"").slice(-4).toUpperCase();
  const note = `Опись ${human} #${tag}`;
  const ts = new Date().toISOString();
  let added = 0, raised = 0, lowered = 0, zeroed = 0;
  const move = (product, type, delta)=>{
    if(!delta) return;
    const kind = delta > 0 ? "receipt" : "writeoff";
    const op = {
      id:uid(), ts, productId:product.id, productName:product.name,
      qty: roundQty(Math.abs(delta)), unit: product.unit||"", note,
      stockType: journalStockType(product, type),
    };
    applyStockDelta(product, delta > 0 ? 1 : -1, Math.abs(delta), note, op);
    state.journals[kind] = state.journals[kind] || [];
    state.journals[kind].unshift(op);
  };
  for(const e of plan.add){
    const p = createCatalogStockItem(e.type, e.name, e.unit);
    const cat = cleanCatName(e.row && e.row.category);
    if(cat){
      state.categories[e.type] = state.categories[e.type] || [];
      if(!state.categories[e.type].includes(cat)) state.categories[e.type].push(cat);
      p.category = cat;
    }
    const loc = cleanCatName(e.row && e.row.location); if(loc) p.location = loc;
    const exp = _impParseDate(e.row && e.row.expiry);  if(exp) p.expiry = exp;
    state.stock.push(p);
    added++;
    move(p, e.type, e.now);   // 0 — карточка просто заводится, движения нет
  }
  for(const e of plan.up.concat(plan.down)){
    const p = e.product;
    // место и срок из описи ДОПОЛНЯЮТ карточку, но не затирают: опись считает штуки, а не сроки
    const loc = cleanCatName(e.row && e.row.location); if(loc && !p.location) p.location = loc;
    const exp = _impParseDate(e.row && e.row.expiry);  if(exp && !p.expiry)  p.expiry = exp;
    /* ДЕЛЬТА СЧИТАЕТСЯ ОТ ЖИВОЙ КАРТОЧКИ, а не берётся из плана. Опись ЗАДАЁТ остаток, значит
       после записи он обязан равняться ровно `now` — при любом раскладе. Это последний рубеж
       против «применилось дважды»: план говорил «20 → 5», два нажатия подряд давали −15 и ещё
       −15, остаток −10 и две пачки в журнале. Теперь второй проход видит на карточке уже 5,
       считает дельту 0 и не пишет ничего. Отрицательным остаток стать не может по построению. */
    const delta = roundQty(e.now - totalQtyOf(p));
    if(!delta) continue;
    move(p, e.type, delta);
    if(delta > 0) raised++; else lowered++;
  }
  for(const s of (zeroList||[])){ move(s, s.type, -totalQtyOf(s)); zeroed++; }
  /* Потолок журнала — тот же общий помощник и тот же предел, что у импорта накладной:
     режем только то, что заведомо уже лежит в облаке, и честно ставим journalsTrunc. */
  let jrTrimmed = 0;
  const _upl = _uploadedJrIds();
  if(_upl){
    for(const k of ["receipt","writeoff"]){
      if(!Array.isArray(state.journals[k]) || state.journals[k].length <= JOURNAL_LOCAL_CAP) continue;
      const was = state.journals[k].length;
      state.journals[k] = _trimJournalKeepPending(state.journals[k], JOURNAL_LOCAL_CAP, _upl, k);
      jrTrimmed += was - state.journals[k].length;
    }
    if(jrTrimmed) state.journalsTrunc = true;
  }
  logOp("INVENTORY", `Опись ${human} #${tag}: новых ${added}, больше ${raised}, меньше ${lowered}`
        + (zeroed ? `, обнулено ${zeroed}` : "") + (jrTrimmed ? ` · журнал урезан на ${jrTrimmed}` : ""));   // logOp сам зовёт saveState
  try{ cloudMaybePush(); }catch(_){}
  try{ render(); }catch(_){}
  return { added, raised, lowered, zeroed, tag, note, human, jrTrimmed };
}

/* ---------- Опись: экран в разделе «Файлы» ---------- */
/* Разобранный файл, ждущий подтверждения. Живёт до применения или до «Отмены»; в базе от него
   ничего нет. renderFiles перерисовывает по нему предпросмотр — иначе пришедший в этот момент
   pull из облака стирал бы с экрана то, что человек читает, оставляя план невидимым. */
let _invPending = null;
const _invEl = ()=> document.getElementById("invOut");
function _invSay(html){ const el = _invEl(); if(el) el.innerHTML = html; }
async function downloadInventoryTemplate(){
  if(!canInventoryStock()){ toast("Опись доступна начальнику участка и выше"); return; }
  let XLSX; try{ XLSX = await ensureXlsx(); }catch(e){ toast("Не удалось загрузить Excel-модуль (нужна сеть в первый раз)"); return; }
  /* В бланк подставлен ТЕКУЩИЙ склад с ПУСТОЙ клеткой «Фактический остаток». Так и задумано:
     пустая клетка означает «не проверяли» и ничего не меняет, зато наименования и единицы уже
     стоят точь-в-точь как в базе — человеку остаётся вписать посчитанное. Набирать названия
     руками — главный источник дублей: одна опечатка заводит новую карточку вместо правки старой.
     Первой строкой идёт пример: он показывает, что писать. Наименование у примера НАРОЧНО
     не похоже на товар — забытая строка-пример должна бросаться в глаза в предпросмотре
     («новая позиция ПРИМЕР…»), а не тихо переписать остаток настоящей манной крупы. */
  const rows = [{
    "Тип":"Продукты", "Наименование":"ПРИМЕР (удалите эту строку)", "Ед. изм.":"кг", "Фактический остаток":12.5,
    "Место":"Склад А", "Срок годности":"", "Примечание":"так выглядит заполненная строка: пишем то, что реально посчитали",
  }];
  const allowed = allowedTypeKeys();
  for(const s of sortedStock((state.stock||[]).filter(x=> allowed.includes(x.type))).slice(0, IMP_MAX_ROWS-1)){
    rows.push({
      "Тип": typeMeta(s.type).label, "Наименование": s.name, "Ед. изм.": s.unit||"",
      "Фактический остаток":"",                       // заполняет человек; пусто = не проверяли
      "Место": locationsOf(s).join("; "), "Срок годности": nearestExpiryOf(s)||"",
      "Примечание": hasBatches(s) ? "позиция с партиями — опись её не меняет" : "",
    });
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [{wch:12},{wch:40},{wch:10},{wch:20},{wch:18},{wch:14},{wch:34}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Опись");
  saveXlsx(wb, `vahtahoz-опись-${todayStr()}.xlsx`, "Бланк описи сохранён");
}
// строчка предпросмотра «было → стало»
const _invLine = (e)=> `<div class="text-xs opacity-80 truncate">• ${esc(e.name)}: ${esc(fmtQty(e.was))} → <b>${esc(fmtQty(e.now))}</b> ${esc(e.unit||"")}</div>`;
function _invPreviewHtml(plan){
  const zeroCand = _invZeroCandidates(plan);
  const touched = plan.add.length + plan.up.length + plan.down.length;
  /* Запоминаем отпечаток ИМЕННО ТЕХ чисел, которые сейчас окажутся на экране. По нему
     applyInventory проверит, что человек нажимает «Применить» под тем, что прочитал: между
     разбором файла и нажатием мог прийти pull, и тогда предпросмотр обещает «обнулится 1»,
     а обнулилось бы 6. Перерисовка (render после pull) обновит и числа, и отпечаток разом. */
  plan.shownFp = _invFingerprint(plan, zeroCand);
  const list = (title, arr, render, max)=> !arr.length ? "" : `
    <div class="mt-2"><div class="text-sm font-bold">${esc(title)}: ${arr.length}</div>
    ${arr.slice(0,max||6).map(render).join("")}
    ${arr.length>(max||6)?`<div class="text-xs opacity-60">…и ещё ${arr.length-(max||6)}</div>`:""}</div>`;
  return `
    <div class="text-sm"><b>Разобрано: ${esc(plan.file||"файл")}</b></div>
    <div class="text-sm">Строк с отметкой: ${touched + plan.same.length} · без отметки (не проверяли): ${plan.empty.length} · не принято: ${plan.bad.length}</div>
    ${list("Новых позиций", plan.add, e=>`<div class="text-xs opacity-80 truncate">• ${esc(e.name)} — ${esc(fmtQty(e.now))} ${esc(e.unit)} (${esc(typeMeta(e.type).short)})</div>`)}
    ${list("Станет больше", plan.up, _invLine)}
    ${list("Станет меньше", plan.down, _invLine)}
    ${plan.same.length?`<div class="text-sm mt-2">Совпало с учётом: ${plan.same.length}</div>`:""}
    ${list("Не принято", plan.bad, b=>`<div class="text-xs opacity-80">• ${esc(b.name)}${b.at?` (${esc(b.at)})`:""} — ${esc(b.why)}</div>`, 10)}
    <div class="text-xs opacity-70 mt-2">Позиций склада, которых в файле нет: ${zeroCand.length}. По умолчанию они <b>не меняются</b> — «нет строки» значит «не проверяли».</div>
    ${zeroCand.length?`<label class="flex items-start gap-2 text-xs mt-2"><input type="checkbox" id="invZero"><span>Обнулить те, которых нет в файле (${zeroCand.length} поз.) — только в разделах из этого файла. Остаток спишется в ноль, карточки останутся.</span></label>`:""}
    <div class="flex gap-2 mt-3">
      <button class="btn btn-ghost flex-1" onclick="cancelInventory()">Отмена</button>
      <button class="btn btn-primary flex-1" id="invApplyBtn" onclick="applyInventory()" ${touched?"":"disabled"}>Применить опись</button>
    </div>
    ${touched?"":`<div class="text-xs opacity-70 mt-2">Менять нечего: ни одной строки с расхождением.</div>`}`;
}
/* ШАГ 1 — разбор и предпросмотр. Ничего не пишет: только читает файл и складывает план в
   _invPending. Второй шаг — applyInventory по отдельной кнопке. */
async function importInventoryExcel(ev){
  const inputEl = ev.target;
  const f = (inputEl.files && inputEl.files[0]) || null;
  inputEl.value = "";                                   // чтобы тот же файл можно было выбрать снова
  if(!f) return;
  if(!canInventoryStock()){ toast("Опись доступна начальнику участка и выше"); return; }
  _invPending = null;
  if(f.size > IMP_MAX_BYTES){ _invSay(`Файл слишком большой (макс. ${Math.round(IMP_MAX_BYTES/1024/1024)} МБ).`); return; }
  _invSay("Чтение файла…");
  let XLSX;
  try{ XLSX = await ensureXlsx(); }
  catch(e){ _invSay("Не удалось загрузить Excel-модуль (нужна сеть в первый раз)."); return; }
  let buf;
  try{
    buf = await new Promise((resolve,reject)=>{
      const rd = new FileReader();
      rd.onload = ()=> resolve(new Uint8Array(rd.result));
      rd.onerror = ()=> reject(new Error("read"));
      rd.readAsArrayBuffer(f);
    });
  }catch(e){ _invSay("Ошибка чтения файла."); return; }
  let read;
  try{ read = _impReadAoa(XLSX, buf, f.name); }
  catch(e){ console.warn("опись: разбор", f.name, e); _invSay(`Не удалось прочитать «${esc(f.name)}».`); return; }
  if(read.error){ _invSay(esc(read.error)); return; }
  const parsed = _invParseAoa(read.aoa);
  if(parsed.error){ _invSay(esc(parsed.error)); return; }
  if(!parsed.rows.length){ _invSay("В файле нет строк с наименованием."); return; }
  const plan = _invPlan(parsed.rows);
  plan.file = f.name;
  _invPending = plan;
  _invSay(_invPreviewHtml(plan));
}
function cancelInventory(){ _invPending = null; _invSay(""); toast("Опись отменена — ничего не изменилось"); }
/* Опись уже применяется — второй вход запрещён. Между нажатием и записью стоят два листа
   подтверждения (два await), и всё это время кнопка оставалась живой: два нажатия подряд —
   дребезг тача на морозе, «не сработало, нажму ещё раз» — давали ДВЕ пачки в журнале и остаток
   ниже нуля. Флага мало (он снимается в finally), поэтому кнопку ещё и гасим в разметке. */
let _invBusy = false;
/* ШАГ 2 — подтверждение и применение. */
async function applyInventory(){
  if(_invBusy){ toast("Опись уже применяется — подождите"); return; }
  const p = _invPending;
  if(!p){ toast("Сначала выберите файл описи"); return; }
  if(!canInventoryStock()){ toast("Опись доступна начальнику участка и выше"); return; }
  _invBusy = true;
  const btn = document.getElementById("invApplyBtn");
  if(btn) btn.disabled = true;
  try{
    const zeroOn = !!(document.getElementById("invZero") || {}).checked;
    /* Числа для диалога считаем ЗДЕСЬ И СЕЙЧАС, а не берём из предпросмотра на экране: между
       разбором файла и нажатием мог пройти pull. То, что человек прочтёт в листе подтверждения,
       всегда соответствует складу на момент нажатия. */
    const shown = _invPlan(p.rows);
    shown.file = p.file;
    const shownAll = _invZeroCandidates(shown);
    /* СНАЧАЛА сверяем с тем, что человек ВИДЕЛ на экране. Если склад успел измениться между
       разбором файла и нажатием (pull, выдача с другого телефона), диалог не показываем вовсе:
       обновляем разбор и просим посмотреть заново. Иначе выходило самое неприятное — предпросмотр
       обещал обнулить одну позицию, а под нож шло шесть, и «подтверждение» человек давал не тому,
       что читал. */
    if(p.shownFp && _invFingerprint(shown, shownAll) !== p.shownFp){
      _invPending = shown;
      _invSay(_invPreviewHtml(shown));
      toast("Склад изменился — проверьте числа и нажмите снова");
      return;
    }
    const shownZero = zeroOn ? shownAll : [];
    const fp = _invFingerprint(shown, shownZero);
    _invPending = shown;
    const nothing = !(shown.add.length || shown.up.length || shown.down.length || shownZero.length);
    if(nothing){ _invSay(_invPreviewHtml(shown)); toast("Менять нечего: расхождений нет"); return; }
    const day = todayStr().split("-").reverse().join(".");
    const go = await confirmSheet(
      `Файл: ${shown.file}\n\n`
      + `Новых позиций: ${shown.add.length}\n`
      + `Остаток вырастет: ${shown.up.length}\n`
      + `Остаток уменьшится: ${shown.down.length}\n`
      + `Совпало с учётом: ${shown.same.length}\n`
      + `Строк без отметки (не проверяли): ${shown.empty.length}\n`
      + `Не принято строк: ${shown.bad.length}\n\n`
      + `Позиции, которых в файле нет, ${zeroOn ? `будут ОБНУЛЕНЫ — ${shownZero.length} поз. (см. следующий шаг)` : "останутся как есть"}.\n`
      + `Записи уйдут в журнал с пометкой «Опись ${day}» — по ней их можно найти и отменить.`,
      { yes:"Применить опись", no:"Отмена", title:"Подтверждение описи" }
    );
    if(!go) return;
    if(shownZero.length){
      const sum = shownZero.reduce((s,x)=> s + totalQtyOf(x), 0);
      const names = shownZero.slice(0,6).map(s=>`• ${s.name} — ${fmtQty(totalQtyOf(s))} ${s.unit||""}`).join("\n");
      const ok2 = await confirmSheet(
        `Списать в ноль ${shownZero.length} поз., которых нет в файле (всего ${fmtQty(sum)} ед.)?\n\n`
        + `${names}${shownZero.length>6?`\n…и ещё ${shownZero.length-6}`:""}\n\n`
        + `Отсутствие строки в файле обычно значит «не считали», а не «пусто». Обнуляйте, только если опись СПЛОШНАЯ — пересчитан весь раздел целиком.\n`
        + `Позиции останутся в каталоге. Отменить одной кнопкой нельзя — только разбором журнала.`,
        { yes:"Да, обнулить", no:"Не обнулять", title:"Обнуление отсутствующих", danger:true }
      );
      if(!ok2) return;
    }
    /* ЗАПИСЬ — ОДНИМ СИНХРОННЫМ КУСКОМ, БЕЗ AWAIT ВНУТРИ. Пересчитываем план по тем же строкам
       файла (заодно берём ЖИВЫЕ объекты карточек — прежние могли осиротеть после pull) и сверяем
       отпечаток с тем, что человек подтвердил. Разошлось хоть в одном числе — не пишем ничего и
       показываем новый разбор: пусть решает заново, глядя на правду. */
    const fresh = _invPlan(p.rows);
    fresh.file = p.file;
    const zeroList = zeroOn ? _invZeroCandidates(fresh) : [];
    if(_invFingerprint(fresh, zeroList) !== fp){
      _invPending = fresh;
      _invSay(_invPreviewHtml(fresh));
      toast("Склад изменился, пока вы подтверждали — ничего не записано");
      return;
    }
    // план гасим ДО применения: _invApply перерисовывает экран, и живой _invPending вернул бы
    // на него предпросмотр уже применённой описи — как будто её надо применить ещё раз
    _invPending = null;
    const r = _invApply(fresh, zeroList);
    const parts = [`новых ${r.added}`, `больше ${r.raised}`, `меньше ${r.lowered}`];
    if(r.zeroed) parts.push(`обнулено ${r.zeroed}`);
    toast(`Опись применена: ${parts.join(" · ")}`);
    // тост живёт 1.8 с — метку пачки оставляем на экране: по ней ищут записи в журнале
    _invSay(`<div class="text-sm">Опись применена. Метка в журнале: <b>${esc(r.note)}</b>.</div>
      <div class="text-xs opacity-70 mt-1">Новых позиций: ${r.added} · стало больше: ${r.raised} · стало меньше: ${r.lowered}${r.zeroed?` · обнулено: ${r.zeroed}`:""}. Не принято строк: ${fresh.bad.length}.</div>
      ${r.jrTrimmed?`<div class="text-xs opacity-70 mt-1">В журнале накопилось больше ${JOURNAL_LOCAL_CAP} записей — ${r.jrTrimmed} самых старых убрано с телефона. Они уже в общей базе и вернутся при синхронизации.</div>`:""}`);
  } finally {
    _invBusy = false;
    const b2 = document.getElementById("invApplyBtn");
    if(b2) b2.disabled = false;
  }
}

function orderReceive(opId){
  if(!ensureCanEdit()) return;
  const op = state.journals.order.find(o=>o.id===opId); if(!op) return;
  if(op.status==="received") return;
  // СНАЧАЛА резолвим товар — иначе при сбое заказ останется «Принят» без поступления на склад
  let product = resolveIncomingProduct({ productId: op.productId, manualName: op.productName, unit: op.unit, type:"product" });
  if(!product){ toast("Не удалось определить товар заказа"); return; }
  op.status = "received";
  op.receivedAt = new Date().toISOString();
  op.productId = product.id;
  op.stockType = journalStockType(product, op.stockType || "product");
  const receiptId = uid();
  op.receiptId = receiptId;
  const _st = journalStockType(product, "product");
  if(hasBatches(product)){
    // приём в карточку с партиями — добавляем новую партию (без срока/места, можно отредактировать вручную)
    const newB = { id: uid(), qty: roundQty(op.qty||0), expiry:"", location:"", note: orderNote(op), createdAt:new Date().toISOString() };
    product.batches = product.batches || [];
    product.batches.push(newB);
    op.batchId = newB.id; // привязка заказа к созданной партии — иначе откат в deleteOp создаст вторую партию вместо снятия
    syncItemFromBatches(product);
    state.journals.receipt.unshift({
      id: receiptId, ts: new Date().toISOString(),
      productId: product.id, productName: op.productName,
      qty: op.qty, unit: op.unit, stockType: _st,
      batchId: newB.id, batchLocation: "", batchExpiry: "",
      note: orderNote(op, "(новая партия)"),
    });
  } else {
    product.qty = roundQty(Number(product.qty||0) + Number(op.qty||0));
    product.updatedAt = new Date().toISOString();
    state.journals.receipt.unshift({
      id: receiptId, ts: new Date().toISOString(),
      productId: product?.id || "", productName: op.productName,
      qty: op.qty, unit: op.unit, stockType: _st,
      note: orderNote(op),
    });
  }
  logOp("ORDER_RECEIVE", `${op.productName} +${fmtQty(op.qty)} ${op.unit||""}`);
  saveState(); render();
  toast("Принято на склад");
}

// позиция осиротела (qty=0 и нигде в журналах не упоминается, кроме записи exceptOpId) →
// спрашиваем удалить (тихо не удаляем — может быть каталожной: ценны minStock/категория).
// Был продублирован в deleteOp и saveOpEdit.
async function maybeDropOrphanProduct(prod, exceptOpId){
  if(!prod) return;
  const hasOther = JOURNAL_KEYS.some(k=>
    (state.journals[k]||[]).some(r=>r.productId===prod.id && r.id!==exceptOpId)
  );
  if(!hasOther && await confirmSheet(`«${prod.name}» на складе = 0 и больше не упоминается. Удалить позицию?`,{yes:"Удалить",no:"Оставить"})){
    state.stock = state.stock.filter(s=>s.id!==prod.id);
  }
}

async function deleteOp(kind, opId){
  if(!ensureCanEdit()) return;
  const op = (state.journals[kind]||[]).find(o=>o.id===opId);
  if(!op) return;
  // зеркальная receipt-запись принятого заказа: удалять только через сам заказ,
  // иначе двойной откат склада (здесь и потом при удалении заказа)
  if(kind==="receipt" && (state.journals.order||[]).some(o=>o.receiptId===opId)){
    toast("Эта запись из заказа — удаляйте сам заказ во вкладке «Заказы»");
    return;
  }
  const m = JOURNAL_META[kind];
  // эффективный знак для отката (order влияет на склад только при status==="received", знак +1)
  const effectiveSign = kind==="order"
    ? (op.status==="received" ? +1 : 0)
    : m.sign;
  let revert = false;
  const product = op.productId ? state.stock.find(s=>s.id===op.productId) : null;

  if(effectiveSign!==0 && product){
    const choice = await chooseSheet(
      `Удалить запись?\n${op.productName} — ${fmtQty(op.qty)} ${op.unit||""}`,
      [
        { label:"Удалить и ОТКАТИТЬ склад", value:"revert", color:"btn-warn" },
        { label:"Удалить только запись", value:"keep", color:"btn-danger" },
      ]
    );
    if(!choice) return;
    // другая вкладка могла подменить state во время await — перепроверяем по живым ссылкам,
    // иначе откат мутировал бы осиротевший объект, а saveState() записал бы новый state без него
    if(!(state.journals[kind]||[]).some(o=>o.id===opId)){ toast("Запись изменилась на другом устройстве"); return; }
    const liveProduct = op.productId ? state.stock.find(s=>s.id===op.productId) : null;
    if(liveProduct && liveProduct!==product){ toast("Данные обновились на другом устройстве — повторите"); return; }
    revert = choice==="revert";
    if(revert){
      // batches-режим: пытаемся вернуть/списать в исходную партию по batchId
      if(hasBatches(product)){
        const tb = op.batchId ? (product.batches||[]).find(b=>b.id===op.batchId) : null;
        if(tb){
          const next = roundQty(Number(tb.qty||0) - effectiveSign*Number(op.qty||0));
          if(next<0){ toast("Нельзя откатить: в партии меньше"); return; }
          tb.qty = next;
          // нулевую партию убираем при любом знаке отката — иначе остаётся фантомное место/срок
          if(next===0) product.batches = product.batches.filter(b=>b.id!==tb.id);
          finalizeBatchMutation(product);
        } else {
          // исходной партии нет (удалена/не привязана). Откат прихода = СНЯТЬ qty, но мы не знаем
          // из какой партии — а «восстановить» партию было бы двойным учётом (qty уже учтён где-то).
          toast("Партия этой записи не найдена — точный откат невозможен. Удалите запись без отката.");
          return;
        }
      } else {
        // карточка стала legacy. Если запись отвязана от удалённой партии — откат «в воздух» раздул бы qty
        if(/\[партия удалена\]/.test(op.note||"")){
          toast("Запись отвязана от удалённой партии — откат недоступен. Удалите запись без отката.");
          return;
        }
        const _wasQty = Number(product.qty||0);
        const next = _wasQty - effectiveSign*Number(op.qty||0);
        if(next<0){ toast("Нельзя откатить: на складе меньше"); return; }
        product.qty = roundQty(next); product.updatedAt = new Date().toISOString();
        clearExpiryOnZero(product, _wasQty);   // откат обнулил остаток — срок и место тоже
      }
      // если принятый заказ — удалить парную запись в Поступлении по точному id (fallback: по совпадению)
      if(kind==="order"){
        if(op.receiptId){
          tombJr(op.receiptId);   // надгробие парной записи «Поступление» — чтобы не воскресла pull-ом
          state.journals.receipt = (state.journals.receipt||[]).filter(r=>r.id!==op.receiptId);
        } else {
          // старые записи без receiptId — фолбэк на эвристику (снесёт только одну первую совпадающую)
          const arr = state.journals.receipt||[];
          const idx = arr.findIndex(r=>r.productId===product.id && Number(r.qty)===Number(op.qty) && (r.note||"").startsWith("Из заказа"));
          if(idx>=0){ tombJr(arr[idx].id); arr.splice(idx,1); }
        }
      }
      // если позиция была авто-создана (qty=0 и нет других журнальных записей) — предложить удалить.
      // saveState() ДО интерактивного подтверждения фиксирует откат склада и ставит dirty →
      // pull во время диалога заблокирован и не затрёт нашу правку «осиротевшим» объектом.
      if(product.qty===0){ saveState(); await maybeDropOrphanProduct(product, opId); }
    }
  } else {
    if(!await confirmSheet(`Удалить запись?\n${op.productName} — ${fmtQty(op.qty)} ${op.unit||""}`,{danger:true,yes:"Удалить"})) return;
  }
  tombJr(opId);   // надгробие удаляемой записи — удаление доедет до облака, pull её не вернёт
  state.journals[kind] = state.journals[kind].filter(o=>o.id!==opId);
  logOp("OP_DEL", `${kind} ${op.productName} ${fmtQty(op.qty)}${revert?" (откат)":""}`);
  saveState(); render();
}

/* Редактирование записи журнала: дата/время, продукт, количество, примечание.
   Откат старого эффекта на склад → применение нового. Для принятого заказа — синхронизация
   парной записи в receipt по receiptId. */
function editOp(kind, opId){
  const op = (state.journals[kind]||[]).find(o=>o.id===opId);
  if(!op) return;
  // блок: зеркальная запись принятого заказа — редактировать через order, иначе рассинхрон.
  // Определяем по связи receiptId (надёжно), а не по тексту примечания (его можно изменить).
  if(kind==="receipt" && (state.journals.order||[]).some(o=>o.receiptId===op.id)){
    toast("Эта запись из заказа — редактируйте сам заказ во вкладке «Заказы»");
    return;
  }
  const m = JOURNAL_META[kind];
  // dt-local: YYYY-MM-DDTHH:MM (без секунд, локальное время)
  let d = new Date(op.ts); if(isNaN(d)) d = new Date();   // битый ts → текущее время, чтобы форма не сломалась
  const pad = n=>String(n).padStart(2,"0");
  const dtLocal = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  openSheet(`
    <div class="font-bold text-xl mb-3">${ico("edit",20)} Изменить запись — ${m.label}</div>
    <div class="space-y-3">
      <div>
        <div class="text-sm opacity-70 mb-1">Дата и время</div>
        <input type="datetime-local" class="input" id="eopTs" value="${dtLocal}" />
      </div>
      <div>
        <div class="text-sm opacity-70 mb-1">Сменить позицию (опц.)</div>
        <input class="input" id="eopSearch" placeholder="Поиск по складу…" autocomplete="off" />
        <div id="eopList" class="mt-2 space-y-1 max-h-72 overflow-y-auto list-box"></div>
        <div class="text-xs opacity-60 mt-1" id="eopSel">Текущая: ${esc(op.productName)}${op.productId?" (привязана к складу)":" (вручную)"}</div>
        <input type="hidden" id="eopProdId" value="${esc(op.productId||"")}" />
      </div>
      <input class="input" id="eopName" placeholder="Название вручную (если нет на складе)" value="${esc(op.productName||"")}" />
      <div class="grid grid-cols-2 gap-2">
        <input class="input" id="eopQty" type="text" inputmode="decimal" value="${esc(fmtQty(op.qty))}" />
        <select class="input" id="eopUnit">${UNITS.map(u=>`<option ${u===op.unit?"selected":""}>${u}</option>`).join("")}</select>
      </div>
      <textarea class="input" id="eopNote" rows="2">${esc(op.note||"")}</textarea>
      <div class="flex gap-2 pt-2 sheet-actions">
        <button class="btn btn-ghost flex-1" data-close>Отмена</button>
        <button class="btn btn-primary flex-1" onclick="saveOpEdit('${kind}','${opId}')">Сохранить</button>
      </div>
    </div>
  `);
  wireStockPicker({ prefix:"eop", emptyHint:"Введите 2+ символа", notFoundText:"Не найдено", nameOnPick:true });
}

async function saveOpEdit(kind, opId){
  if(!ensureCanEdit()) return;
  const op = (state.journals[kind]||[]).find(o=>o.id===opId); if(!op) return;
  const m = JOURNAL_META[kind];
  const body = document.getElementById("sheetBody");
  const dtVal = body.querySelector("#eopTs").value;
  const newProdId = body.querySelector("#eopProdId").value;
  const newName = body.querySelector("#eopName").value.trim();
  const newQty = parseNum(body.querySelector("#eopQty").value);
  const newUnit = body.querySelector("#eopUnit").value;
  const newNote = body.querySelector("#eopNote").value.trim();
  if(!Number.isFinite(newQty) || newQty<=0){ toast("Количество должно быть > 0"); return; }
  if(!newName && !newProdId){ toast("Укажите название или выберите товар"); return; }

  // эффективный знак (order влияет на склад только если received)
  const effSign = kind==="order" ? (op.status==="received" ? +1 : 0) : m.sign;

  const oldProd = op.productId ? state.stock.find(s=>s.id===op.productId) : null;
  let newProd = newProdId ? state.stock.find(s=>s.id===newProdId) : null;
  /* Приход по ручному имени без выбранной позиции: карточку надо найти или завести, иначе
     поступление осталось бы «в воздухе» (запись есть, остаток не вырос). Для расхода — нельзя
     (ниже отдельный гард).

     ЗДЕСЬ ТОЛЬКО ПОИСК. Заведение карточки — ниже, ПОСЛЕ всех проверок, и это не стиль.
     resolveIncomingProduct не просто возвращает карточку: он тут же делает state.stock.push и
     propagateName, а та СИНХРОННО пишет слоты всех остальных баз телефона и ставит им метку
     «не синхронизировано». Стоял он раньше прямо тут, до пяти проверок с голым return
     (привязанный продукт удалён; у позиции есть партии; «[партия удалена]»; дата в будущем;
     нельзя откатить — на складе меньше старого количества), а restore() про созданную карточку
     не знал и откатить её не мог.
     Сценарий в одно действие: кладовщик правит запись, вписывает новый товар, по ошибке ставит
     дату следующего месяца, жмёт «Сохранить». Получает «Дата не может быть в будущем» — и уверен,
     что ничего не произошло. А фантомная карточка уже в складе активной базы и уже записана в
     слот второй базы, и та помечена несинхронизированной: фантом уедет в общую базу бригады при
     следующем же действии. Поиск существующей карточки ничего не мутирует, поэтому проверка
     «у позиции есть партии» ниже по-прежнему видит настоящего кандидата. */
  const _effSignEarly = kind==="order" ? (op.status==="received" ? +1 : 0) : m.sign;
  let _needCreateProd = false;
  if(!newProd && _effSignEarly>0 && newName){
    newProd = findStockByName(newName, (oldProd?.type||"product"), newUnit) || null;
    if(!newProd) _needCreateProd = true;
  }

  // если запись имела привязку к складу, но продукт удалён — нельзя корректно откатить старый эффект
  if(effSign!==0 && op.productId && !oldProd){
    toast("Привязанный продукт не найден на складе — откат невозможен");
    return;
  }
  // запрет редактирования количества для batches-карточек (рассинхрон с партиями)
  if(effSign!==0 && ((oldProd && hasBatches(oldProd)) || (newProd && hasBatches(newProd)))){
    toast("У позиции есть партии — отредактируйте/удалите запись и проведите движение через ＋/− на карточке");
    return;
  }
  // запись отвязана от удалённой партии: откат «в воздух» раздул бы qty legacy-карточки
  if(effSign!==0 && /\[партия удалена\]/.test(op.note||"")){
    toast("Запись отвязана от удалённой партии — правка склада недоступна. Удалите запись без отката.");
    return;
  }

  // блок будущей даты для движений склада (нельзя «выдать»/«принять» в будущем)
  const newTs = dtVal ? new Date(dtVal).toISOString() : op.ts;
  if(effSign!==0 && new Date(newTs).getTime() > Date.now() + 60_000){
    toast("Дата не может быть в будущем для движений склада");
    return;
  }

  // расход обязан быть привязан к складской позиции — иначе журнал скажет «выдано»,
  // а склад не уменьшится (рассинхрон)
  if(effSign<0 && !newProd){
    toast("Для расхода выберите позицию со склада");
    return;
  }

  // снимок qty ДО любых мутаций — для надёжного отката при ошибке
  const oldProdQtyBefore = oldProd ? Number(oldProd.qty||0) : null;
  const newProdQtyBefore = (newProd && newProd!==oldProd) ? Number(newProd.qty||0) : null;
  const restore = () => {
    if(oldProd && oldProdQtyBefore!==null) oldProd.qty = oldProdQtyBefore;
    if(newProd && newProd!==oldProd && newProdQtyBefore!==null) newProd.qty = newProdQtyBefore;
  };

  // 1) откатить старый эффект
  if(effSign!==0 && oldProd){
    const reverted = Number(oldProd.qty||0) - effSign*Number(op.qty||0);
    if(reverted < 0){ toast("Нельзя откатить: на складе меньше старого количества"); return; }
    oldProd.qty = roundQty(reverted); oldProd.updatedAt = new Date().toISOString();
  }
  /* НОВАЯ КАРТОЧКА ЗАВОДИТСЯ ТОЛЬКО ЗДЕСЬ — ПОСЛЕ ВСЕХ ПРОВЕРОК И ВСЕХ return (см. поиск выше).
     Ниже возврата, который оставил бы её сиротой, уже нет ни одного: единственный оставшийся
     («не хватает на складе для нового количества») возможен только на расходе, а заводим мы
     карточку исключительно на приходе (_effSignEarly > 0). */
  if(_needCreateProd){
    newProd = resolveIncomingProduct({ manualName:newName, unit:newUnit, type:(oldProd?.type||"product") });
    if(!newProd){ restore(); toast("Не удалось завести позицию на складе"); return; }
  }
  // 2) применить новый эффект
  if(effSign!==0 && newProd){
    if(effSign<0 && Number(newProd.qty||0) < newQty){
      restore();
      toast("Не хватает на складе для нового количества"); return;
    }
    newProd.qty = roundQty(Number(newProd.qty||0) + effSign*newQty);
    newProd.updatedAt = new Date().toISOString();
  }
  // правка увела остаток в ноль — срок и место уходят вместе с ним (снимки qty сняты ДО мутаций;
  // если товар один и тот же, newProdQtyBefore===null и достаточно одной проверки по итогу)
  clearExpiryOnZero(oldProd, oldProdQtyBefore);
  if(newProd && newProd!==oldProd) clearExpiryOnZero(newProd, newProdQtyBefore);

  // 3) обновить саму запись
  op.ts = newTs;
  op.productId = newProd?.id || "";
  op.productName = newProd?.name || newName;
  op.qty = roundQty(newQty);
  op.unit = newProd?.unit || newUnit;
  op.note = newNote;
  op.stockType = journalStockType(newProd, op.stockType || "product");

  // 4) для принятого заказа — синхронизируем парную запись в receipt
  if(kind==="order" && op.status==="received" && op.receiptId){
    const r = (state.journals.receipt||[]).find(x=>x.id===op.receiptId);
    if(r){
      r.ts = newTs;
      r.productId = op.productId;
      r.productName = op.productName;
      r.qty = op.qty;
      r.unit = op.unit;
      r.note = orderNote(op);
      r.stockType = op.stockType;
    }
  }

  // если старый продукт после отвязки/перепривязки осиротел (qty=0 и больше нигде не упоминается) —
  // спрашиваем, а не удаляем тихо: позиция может быть каталожной (minStock/категория ценны)
  if(oldProd && oldProd!==newProd && Number(oldProd.qty||0)===0 && !hasBatches(oldProd)){
    saveState();   // фиксируем правки склада ДО интерактивного orphan-подтверждения (dirty блокирует pull в окне диалога)
    await maybeDropOrphanProduct(oldProd, op.id);
  }

  logOp("OP_EDIT", `${kind} ${op.productName} ${fmtQty(op.qty)} ${op.unit||""}`);
  saveState(); closeSheet(); render();
  toast("Запись обновлена");
}

function stockRow(it){
  const st = stockStatus(it);
  const out = !!st.out;
  const badge = out
    ? `<span class="badge badge-gray">${esc(st.text)}</span>`
    : st.color==="red" ? `<span class="badge badge-red">${esc(st.text)}</span>`
    : st.color==="yellow" ? `<span class="badge badge-yellow">${esc(st.text)}</span>` : "";
  const icon = ico(typeMeta(it.type).icon, 22);
  const totalQ = totalQtyOf(it);
  const left = `${fmtQty(totalQ)} ${esc(it.unit||"")}`;
  const qtyBadge = out ? `<span class="badge badge-gray">${left}</span>` : `<span class="badge badge-green">${left}</span>`;
  const locs = locationsOf(it);
  const loc = locs.length===0 ? ""
    : locs.length===1 ? `<span class="badge badge-gray">${ico("pin",13)} ${esc(locs[0])}</span>`
    : `<span class="badge badge-gray">${ico("pin",13)} ${locs.length} мест</span>`;
  const cat = it.category?`<span class="badge badge-gray">${esc(it.category)}</span>`:"";
  // показываем ближайший срок (агрегат по партиям); при нескольких партиях добавляем "+N"
  const bCnt = batchesOf(it).length;
  const nearestExp = nearestExpiryOf(it);
  const expExtra = bCnt>1 ? ` +${bCnt-1}` : "";
  // срок не показываем у позиции без остатка (qty=0): нет товара — нет срока
  const exp = (nearestExp && inStock(it))?`<span class="badge badge-gray">${ico("clock",13)} ${fmtDate(nearestExp)}${expExtra}</span>`:"";
  // раскрывающаяся панель партий — показывается, если их ≥ 2
  const batchPanel = bCnt>=2 ? `
    <details class="mt-2" onclick="event.stopPropagation()">
      <summary class="text-xs opacity-70 cursor-pointer select-none">Партии (${bCnt}) ${ico("chevDown",13)}</summary>
      <div class="mt-2 space-y-1">
        ${batchesOf(it).slice().sort(byExpiry).map(b=>{
          const d = b.expiry?daysLeft(b.expiry):null;
          const cls = d===null?"badge-gray":(d<0?"badge-red":(d<=3?"badge-red":(d<=14?"badge-yellow":"badge-gray")));
          return `<div class="text-xs flex flex-wrap gap-1 items-center pl-2 border-l-2 border-gray-700">
            ${batchQtyBadge(b, it)}
            ${b.location?`<span class="badge badge-gray">${ico("pin",13)} ${esc(b.location)}</span>`:""}
            ${b.expiry?`<span class="badge ${cls}">${ico("clock",13)} ${fmtDate(b.expiry)}</span>`:""}
            ${b.note?`<span class="opacity-60">${esc(b.note)}</span>`:""}
          </div>`;
        }).join("")}
      </div>
    </details>` : "";
  return `
    <div class="card${out?" opacity-60":""}">
      <div class="flex items-start gap-3">
        <div class="${out?"opacity-40":""}">${icon}</div>
        <div class="flex-1 min-w-0" onclick="openStockEdit('${it.id}')">
          <div class="font-semibold break-words${out?" line-through opacity-80":""}">${esc(it.name)}</div>
          <div class="text-xs opacity-70 mt-1 flex flex-wrap gap-2 items-center">
            ${qtyBadge}
            ${cat} ${loc} ${exp} ${badge}
          </div>
          ${batchPanel}
        </div>
      </div>
      <div class="grid ${out?"":"grid-cols-2"} gap-2 mt-3">
        <button class="btn btn-success" onclick="quickAdjust('${it.id}',+1)">＋ Приход${out?" (вернуть в наличие)":""}</button>
        ${out?"":`<button class="btn btn-danger" onclick="quickAdjust('${it.id}',-1)">− Расход…</button>`}
      </div>
    </div>`;
}

async function quickAdjust(id, sign){
  if(!ensureCanEdit()) return;
  const it = state.stock.find(s=>s.id===id); if(!it) return;
  // для расхода — спрашиваем тип движения: выдача персоналу или списание (порча/просрочка/бой)
  let kind, label, title, opNote;
  if(sign>0){
    kind = "receipt"; label = "Сколько пришло?"; title = "Приход"; opNote = "(быстрая правка)";
  } else {
    const choice = await chooseSheet(
      `${it.name}\nКуда списать?`,
      [
        { label:"Выдача (кому-то)",      value:"issue",    color:"btn-danger" },
        { label:"Списание (порча/срок)", value:"writeoff", color:"btn-warn"   },
      ]
    );
    if(!choice) return;
    kind = choice;
    label = kind==="issue" ? "Сколько выдано?" : "Сколько списать?";
    title = kind==="issue" ? "Выдача" : "Списание";
    opNote = kind==="issue" ? "(быстрая выдача)" : "(быстрое списание)";
  }

  // === МНОГО-ПАРТИЙНАЯ ВЕТКА ===
  if(hasBatches(it)){
    const batches = batchesOf(it);
    let targetBatch = null;

    if(sign>0){
      // приход: выбрать существующую партию или создать новую
      const opts = batches.slice().sort(byExpiry).map(b=>({
        label: `${fmtQty(b.qty)} ${it.unit||""}${b.location?" · 📍 "+b.location:""}${b.expiry?" · ⏰ "+fmtDate(b.expiry):""}`,
        value: b.id, color: "btn-success"
      }));
      opts.push({ label: "➕ Новая партия (свой срок/место)", value: "__new__", color: "btn-primary" });
      const choice = await chooseSheet(`${it.name}\nКуда добавить?`, opts);
      if(!choice) return;
      if(choice==="__new__"){
        // спросим срок/место (короткая форма через 2 prompts)
        const expVal = await promptSheet(`${it.name}\nСрок годности новой партии (ГГГГ-ММ-ДД, пусто — без срока)`, "", {title:"Новая партия"});
        if(expVal===null) return;
        // кривой формат сломал бы daysLeft() (NaN → партия не подсветится и не спишется по сроку)
        if(expVal.trim() && !/^\d{4}-\d{2}-\d{2}$/.test(expVal.trim())){ toast("Срок: формат ГГГГ-ММ-ДД"); return; }
        const locVal = await promptSheet(`${it.name}\nМесто хранения (пусто — без места)`, locationsOf(it)[0]||"", {title:"Новая партия"});
        if(locVal===null) return;
        const val = await promptSheet(`${it.name}\n${label}`, "1", {numeric:true,title});
        if(val===null) return;
        const n = roundQty(parseNum(val));
        if(!Number.isFinite(n) || n<=0){ toast("Не число"); return; }
        if(state.stock.find(s=>s.id===id)!==it){ toast("Данные обновились — повторите операцию"); render(); return; }   // pull/смена базы во время диалога пересоздал объект → не теряем правку на «осиротевшем»
        const newB = { id:uid(), qty:n, expiry:expVal.trim(), location:cleanName40(locVal), note:"", createdAt:new Date().toISOString() };
        it.batches.push(newB);
        syncItemFromBatches(it);
        state.journals.receipt = state.journals.receipt || [];
        state.journals.receipt.unshift({ id:uid(), ts:new Date().toISOString(), productId:it.id, productName:it.name, qty:n, unit:it.unit||"", stockType:journalStockType(it), batchId:newB.id, batchLocation:newB.location||"", batchExpiry:newB.expiry||"", note:`Новая партия${newB.expiry?` (срок ${fmtDate(newB.expiry)})`:""}${newB.location?` в «${newB.location}»`:""}` });
        logOp("IN", `${it.name} +${fmtQty(n)} ${it.unit||""} [новая партия]`);
        saveState(); render(); return;
      }
      targetBatch = batches.find(b=>b.id===choice);
    } else {
      // расход: обязателен выбор партии
      const opts = batches.filter(b=>roundQty(b.qty||0)>0).slice().sort(byExpiry).map(b=>({
        label: `${fmtQty(b.qty)} ${it.unit||""}${b.location?" · 📍 "+b.location:""}${b.expiry?" · ⏰ "+fmtDate(b.expiry):""}`,
        value: b.id, color: kind==="issue"?"btn-danger":"btn-warn"
      }));
      if(!opts.length){ toast("Нет партий с остатком"); return; }
      const choice = await chooseSheet(`${it.name}\nС какой партии?`, opts);
      if(!choice) return;
      targetBatch = batches.find(b=>b.id===choice);
    }

    if(!targetBatch){ toast("Партия не найдена"); return; }
    const val = await promptSheet(`${it.name}\n${label}\n(в партии ${fmtQty(targetBatch.qty)} ${it.unit||""}${targetBatch.location?", 📍 "+targetBatch.location:""})`, "1", {numeric:true,title});
    if(val===null) return;
    const n = roundQty(parseNum(val));
    if(!Number.isFinite(n) || n<=0){ toast("Не число"); return; }
    if(state.stock.find(s=>s.id===id)!==it){ toast("Данные обновились — повторите операцию"); render(); return; }   // объект пересоздан pull-ом во время диалога → targetBatch тоже устарел, не мутируем
    const nextBatch = roundQty(Number(targetBatch.qty||0) + sign*n);
    if(nextBatch<0){ toast("Не хватает в этой партии"); return; }
    targetBatch.qty = nextBatch;
    // партию с qty=0 убираем (но только при расходе)
    if(sign<0 && nextBatch===0) it.batches = it.batches.filter(b=>b.id!==targetBatch.id);
    finalizeBatchMutation(it);

    state.journals[kind] = state.journals[kind]||[];
    const noteParts = [];
    if(targetBatch.location) noteParts.push(`📍 ${targetBatch.location}`);
    if(targetBatch.expiry)   noteParts.push(`⏰ ${fmtDate(targetBatch.expiry)}`);
    state.journals[kind].unshift({
      id:uid(), ts:new Date().toISOString(), productId:it.id, productName:it.name,
      qty:n, unit:it.unit||"", stockType: journalStockType(it),
      batchId: targetBatch.id, batchLocation: targetBatch.location||"", batchExpiry: targetBatch.expiry||"",
      note: opNote + (noteParts.length?` ${noteParts.join(" · ")}`:"")
    });
    const tag = opTag(kind);
    logOp(tag, `${it.name} ${sign>0?"+":"-"}${fmtQty(n)} ${it.unit||""}${noteParts.length?` [${noteParts.join(" · ")}]`:""}`);
    saveState(); render(); return;
  }

  // === LEGACY ВЕТКА (без партий) ===
  const val = await promptSheet(`${it.name}\n${label} (сейчас ${fmtQty(it.qty)} ${it.unit||""})`, "1", {numeric:true,title});
  if(val===null) return;
  const n = roundQty(parseNum(val));
  if(!Number.isFinite(n) || n<=0){ toast("Не число"); return; }
  if(state.stock.find(s=>s.id===id)!==it){ toast("Данные обновились — повторите операцию"); render(); return; }   // объект пересоздан pull-ом во время диалога → не теряем правку
  const next = roundQty(Number(it.qty||0) + sign*n);
  if(next<0){ toast("Не хватает на складе"); return; }
  const _wasQty = Number(it.qty||0);
  it.qty = next; it.updatedAt = new Date().toISOString();
  clearExpiryOnZero(it, _wasQty);   // «−» до нуля — срок и место уходят вместе с остатком
  state.journals[kind] = state.journals[kind]||[];
  state.journals[kind].unshift({
    id:uid(), ts:new Date().toISOString(), productId:it.id, productName:it.name,
    qty:n, unit:it.unit||"", stockType: journalStockType(it), note:opNote
  });
  const tag = opTag(kind);
  logOp(tag, `${it.name} ${sign>0?"+":"-"}${fmtQty(n)} ${it.unit||""}`);
  saveState(); render();
}


function openStockEdit(id, typeDefault){
  if(!id && typeDefault && !allowedTypeKeys().includes(typeDefault)) typeDefault = allowedTypeKeys()[0] || "product";   // роль не может создавать недоступный тип
  const it = id ? state.stock.find(s=>s.id===id)
               : { id:"", type:typeDefault||"product", name:"", qty:"", unit:"шт", minStock:"", expiry:"", location:"", category:"", note:"" };
  if(id && !it){ toast("Позиция изменилась на другом устройстве"); render(); return; }   // удалена/синкнута, пока вкладка была открыта → не падаем на it.type
  const tk = it.type;
  const isProd = tk==="product";
  const expiryLabel = isProd ? "Срок годности" : (tk==="tool" ? "Срок/гарантия (опц.)" : "Срок годности (опц.)");
  const bList = id ? batchesOf(it) : [];
  /* ФОРМА ОБЯЗАНА ПОКАЗЫВАТЬ ТО ЖЕ, ЧТО КАРТОЧКА СКЛАДА. Карточка рисуется агрегаторами
     (totalQtyOf / nearestExpiryOf / locationsOf), а форма читала СЫРЫЕ легаси-поля it.qty/it.expiry/
     it.location. Стоит им разойтись (слияние перед выгрузкой подменяло партии и количество,
     не пересчитывая агрегаты) — и человек видел на карточке «4 кг, до 02.08», а в форме правки той
     же позиции «6, до 04.08». Два разных числа за два тапа. Берём агрегаты. */
  const batched = bList.length>0;
  const vLocs = locationsOf(it);
  const vQty  = batched ? totalQtyOf(it) : it.qty;
  const vExp  = batched ? (nearestExpiryOf(it)||"") : (it.expiry||"");
  const vLoc  = batched ? (vLocs.length===1 ? vLocs[0] : "") : (it.location||"");
  /* И НЕ ПРИТВОРЯЕМСЯ, ЧТО ПОЛЕ РЕДАКТИРУЕТСЯ. У позиции с партиями saveStock эти три значения
     отбрасывает (они производные) — а поля выглядели рабочими: белый текст, курсор, календарь.
     Человек стирал дату системной кнопкой «Сбросить» в календаре телефона, жал «Сохранить»,
     получал подтверждение — и ничего не менялось. Теперь поля отключены и рядом написано, где
     срок и место правятся на самом деле. */
  const batchNote = batched
    ? `<div class="text-xs opacity-70" style="margin-top:-6px">Количество, срок и место у этой позиции считаются ПО ПАРТИЯМ. Правьте их в нужной партии — ${ico("edit",18)} в списке партий ниже.</div>`
    : "";
  const batchesSection = (id && bList.length>0) ? `
    <div class="border-t border-gray-700 pt-3">
      <div class="text-sm opacity-70 mb-2">Партии (${bList.length}) — qty/срок/место карточки считаются автоматически</div>
      <div class="space-y-1">
        ${bList.slice().sort(byExpiry).map(b=>`
          <div class="flex flex-wrap items-center gap-2 text-xs">
            ${batchQtyBadge(b, it)}
            ${b.location?`<span class="badge badge-gray">${ico("pin",13)} ${esc(b.location)}</span>`:`<span class="badge badge-gray opacity-50">без места</span>`}
            ${b.expiry?`<span class="badge badge-gray">${ico("clock",13)} ${fmtDate(b.expiry)}</span>`:`<span class="badge badge-gray opacity-50">без срока</span>`}
            <span class="flex-1"></span>
            <button class="btn btn-ghost text-xs px-2" onclick="openMove('${id}','${b.id}')" aria-label="Перенести партию на другое место">${ico("move",18)}</button>
            <button class="btn btn-ghost text-xs px-2" onclick="openBatchEdit('${id}','${b.id}')" aria-label="Редактировать партию">${ico("edit")}</button>
            <button class="btn btn-ghost text-xs px-2" onclick="deleteBatch('${id}','${b.id}')" aria-label="Удалить партию">${ico("trash")}</button>
          </div>
        `).join("")}
      </div>
    </div>` : "";
  openSheet(`
    <div class="flex items-center justify-between gap-2 mb-3">
      <!-- min-w-0 + truncate: заголовок «Редактировать продукт» рядом с кнопкой «Партия» (shrink-0)
           не помещался на 360 px и выдавливал ряд за край листа -->
      <div class="font-bold text-xl min-w-0 truncate">${id?"Редактировать":"Новый"} ${esc(typeMeta(tk).addLabel.toLowerCase())}</div>
      ${id?`<div class="flex gap-2 shrink-0">
        ${(!hasBatches(it) && roundQty(it.qty||0)>0)?`<button class="btn btn-ghost" onclick="openMove('${id}','')" aria-label="Перенести на другое место">${ico("move",18)}</button>`:""}
        <button class="btn btn-warn" onclick="openBatchAdd('${id}')">${ico("plus",18)} Партия</button>
      </div>`:""}
    </div>
    <div class="space-y-3">

function saveStock(id, type){
  if(!ensureCanEdit()) return;
  const body = document.getElementById("sheetBody");
  const name = body.querySelector("#sn").value.trim();
  if(!name){ toast("Название обязательно"); return; }
  const qty = Math.max(0, roundQty(parseNum(body.querySelector("#sq").value)));   // ручной ввод: отрицательное/мусор → 0 (нет смысла в минусовом остатке)
  const unit = body.querySelector("#su").value;
  const _smRaw = body.querySelector("#sm").value.trim(), _smN = parseNum(_smRaw);
  /* Поле стало type=text (у type=number desktop-Chrome вырезал запятую из «0,5»), и браузер больше НЕ
     подчищает мусор сам — раньше «abc» превращалось в value="" и minStock становился "". Повторяем это
     здесь явно: не-числовой ввод → "" (сравнение «низкий запас» выключено), а не 0.
     ЦИФРА ОБЯЗАТЕЛЬНА: фильтр по набору символов пропускал строку из одних разделителей («,,,,», «..»,
     « , . »), а parseNum для них возвращает 0 — получался minStock=0, и бейдж «низкий запас» загорался
     у позиции с нулевым остатком, то есть у любой пустой карточки. Проверка !Number.isFinite(_smN)
     тут была мёртвой: parseNum всегда возвращает число (мусор → 0). */
  const minStock = (_smRaw===""||!/^[0-9 \u00A0.,]+$/.test(_smRaw)||!/\d/.test(_smRaw)) ? "" : _smN;
  const expiry = body.querySelector("#se")?.value || "";
  const note = body.querySelector("#sno").value.trim();
  const category = body.querySelector(".chip.active[data-cat]")?.dataset.cat || "";
  const location = body.querySelector(".chip.active[data-loc]")?.dataset.loc || "";
  let propType=type, propOld=null;
  if(id){
    const it = state.stock.find(s=>s.id===id);
    if(!it){ toast("Позиция изменилась на другом устройстве"); closeSheet(); render(); return; }   // удалена/синкнута, пока форма была открыта → не падаем на Object.assign(undefined)
    const oldName = it.name;
    const _prevQty = Number(it.qty||0), _prevExpiry = it.expiry||"";   // снимки ДО Object.assign
    propType = it.type;
    if(hasBatches(it)){
      /* В режиме партий qty/expiry/location — производные, перезаписывать вручную нельзя. Форма их
         показывает отключёнными (см. openStockEdit), но лист мог быть открыт до обновления версии
         или значения подставит автозаполнение. МОЛЧА ОТБРАСЫВАТЬ НЕЛЬЗЯ: раньше человек стирал дату,
         жал «Сохранить», получал закрытый лист — и ничего не менялось. Место в сравнение не берём:
         у партийной карточки чипов мест в форме нет вовсе, и оно всегда придёт пустым. */
      const ignored = roundQty(qty)!==roundQty(totalQtyOf(it)) || (expiry||"")!==(nearestExpiryOf(it)||"");
      Object.assign(it,{name,unit,minStock,category,note,updatedAt:new Date().toISOString()});
      syncItemFromBatches(it);
      if(ignored) setTimeout(()=>toast("Количество, срок и место берутся из партий — измените их в нужной партии (карандаш в списке партий)"), 60);
    } else {
      Object.assign(it,{name,qty:roundQty(qty),unit,minStock,expiry,location,category,note,updatedAt:new Date().toISOString()});
      // остаток стал нулём вручную — срок и место уходят вместе с ним (см. clearExpiryOnZero).
      // НЕ трогаем, если человек в этом же сохранении задал НОВУЮ дату: это осознанный ввод.
      if((expiry||"")===_prevExpiry && clearExpiryOnZero(it, _prevQty)) setTimeout(()=>toast("Остаток 0 — срок и место очищены"), 60);
      /* ОТКАЧЕНО (было в v206): запись корректирующего списания в журнал при занижении остатка.
         Идея была закрыть «post-pull raise молча возвращает старый остаток», но реализация
         небезопасна принципиально, и адверсарная проверка это показала:
         1) Дельта считалась по ledgerQtyForProduct на ЛОКАЛЬНОМ журнале, а он после cloud pull —
            хвост ≤500 записей НА ВИД. journalLooksIncomplete() возвращает true для ЛЮБОЙ облачной
            базы, то есть проверять было нечего: на «Детрине» (issue>500) старые выдачи срезаны,
            ledger завышен, и правка 80→50 писала в ОБЩИЙ журнал фантомное списание на сотни единиц.
            Это ровно нарушение инварианта «при journalLooksIncomplete не верить ledger».
         2) Вместе с 3-way merge давало ДВОЙНОЕ списание: если второй телефон уже провёл выдачу,
            merged = local + cloud − snap и так занижает qty, а прежний raise это лечил; корректировка
            подгоняла ledger под занижение и лечение отключалось навсегда.
         3) После v207 (единица не обязательна для legacy-записей без unit) смена ед. вместе с qty
            писала фиктивную корректировку в новых единицах (718 «кор» вместо 718 шт).
         Условие корректности — ПОЛНЫЙ журнал локально (пункт Deferred «journal без усечения 500»).
         До этого проблема остаётся открытой в бэклоге: raise по-прежнему может вернуть остаток,
         но это предсказуемо и не портит общий журнал фантомными проводками. */
    }
    logOp("STOCK_EDIT", name);
    if(oldName && oldName!==name) propOld = oldName;   // переименование — распространим
  } else {
    state.stock.push({id:uid(),type,name,qty:roundQty(qty),unit,minStock,expiry,location,category,note,createdAt:new Date().toISOString()});
    logOp("STOCK_ADD", `${name} +${qty} ${unit}`);
  }
  // общий каталог: новое имя / переименование → в остальные базы (qty 0)
  try{ propagateName(propType, name, unit, propOld); }catch(e){ console.warn("propagateName", e); }
  saveState(); closeSheet(); render();
}

      <div>

function saveBatch(id){
  if(!ensureCanEdit()) return;
  const body = document.getElementById("sheetBody");
  const it = state.stock.find(s=>s.id===id); if(!it){ closeSheet(); return; }
  const qty = roundQty(parseNum(body.querySelector("#bq").value));
  const expiry = body.querySelector("#be").value || "";
  const location = body.querySelector(".chip.active[data-loc]")?.dataset.loc || "";
  const note = body.querySelector("#bnote")?.value.trim() || "";
  if(!(qty>0)){ toast("Количество должно быть > 0"); return; }
  it.batches = it.batches || [];
  // если у карточки был legacy qty без партий — конвертируем в первую партию
  if(it.batches.length===0 && roundQty(it.qty||0) > 0){
    it.batches.push({
      id: uid(), qty: roundQty(it.qty||0),
      expiry: it.expiry||"", location: it.location||"",
      note: "Перенос исходного остатка", createdAt: it.createdAt||new Date().toISOString()
    });
  }
  const newB = { id:uid(), qty, expiry, location, note, createdAt:new Date().toISOString() };
  it.batches.push(newB);
  syncItemFromBatches(it);
  state.journals = state.journals || emptyJournals();
  state.journals.receipt = state.journals.receipt || [];
  state.journals.receipt.unshift({
    id: uid(), ts: new Date().toISOString(), productId: it.id, productName: it.name,
    qty, unit: it.unit||"", stockType: journalStockType(it),
    batchId: newB.id, batchLocation: location, batchExpiry: expiry,
    note: `Новая партия${expiry?` (срок ${fmtDate(expiry)})`:""}${location?` в «${location}»`:""}`
  });
  logOp("BATCH_ADD", `${it.name} +${fmtQty(qty)} ${it.unit||""}${location?` в «${location}»`:""}${expiry?` до ${fmtDate(expiry)}`:""}`);
  saveState(); closeSheet(); render();
  toast("Партия добавлена");
}
