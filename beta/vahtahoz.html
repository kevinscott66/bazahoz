        <div class="text-xs opacity-70">Позиций: ${total} · в наличии: ${inStk}</div></div>
      <button class="btn btn-ghost px-2" aria-label="Excel по этой базе" onclick="exportOneBaseXlsx('${b.id}')">${ico("chart",18)}</button>
    </div>`;
  }).join("") : `<div class="opacity-70 text-sm">Баз нет.</div>`;
  const totalItems=data.reduce((a,b)=>a+((b.rows||[]).length),0);
  const anyLoaded=data.some(b=>Array.isArray(b.rows));
  const at=new Date(_allBasesAt).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  openSheet(`<div class="font-bold text-xl mb-3">${ico("calc",20)} Сводка по всем базам</div>
    <div class="text-xs opacity-70 mb-2">Баз: ${data.length} · позиций всего: ${totalItems} · снимок в ${at}</div>
    <div class="space-y-2 max-h-72 overflow-y-auto pr-1">${rowsHtml}</div>
    ${anyLoaded?`<button class="btn btn-success w-full mt-3" onclick="exportAllBasesXlsx()">${ico("chart",18)} Выгрузить ВСЕ базы в Excel</button>`:""}
    <div class="text-xs opacity-60 mt-2">Остатки по всем базам на момент снимка (только чтение). Кнопка с диаграммой у базы — одна база; зелёная — все базы одним файлом. Для бухгалтерии и директоров.</div>
    <div class="flex gap-2 mt-3">
      <button class="btn btn-ghost flex-1" onclick="openAllBasesSheet()">${ico("refresh",18)} Обновить</button>
      <button class="btn btn-ghost flex-1" data-close>Закрыть</button>
    </div>`);
}
// бухгалтерский лист: наличие/количество/срок/мин-остаток БЕЗ столбца «Склады»/место. Несколько сроков из
// партий — через «;». Отдельный лист на каждую базу (разделение по базам, не монолит одним листом).
const _ACCT_COLS=[{wch:38},{wch:20},{wch:12},{wch:10},{wch:12},{wch:24}];
function _rowExpiry(r){
  const b=Array.isArray(r.batches)?r.batches:[];
  const ex = b.length ? [...new Set(b.map(x=>(x&&x.expiry)||"").filter(Boolean))].sort() : (r.expiry?[r.expiry]:[]);
  return ex.map(fmtDate).join("; ");
}
function _acctRow(r){ return {
  "Наименование": r.name, "Категория": r.category||"", "Количество": _rowQty(r),
  "Ед. изм.": r.unit||"", "Мин. запас": _xlNum(r.min_stock), "Срок годности": _rowExpiry(r) }; }
function _sheetName(name, used){
  let s = String(name||"База").replace(/[\[\]\*\?\/\\:]/g,"").trim().slice(0,28) || "База";
  let bs=s, i=2; while(used.has(s.toLowerCase())){ s=bs.slice(0,25)+" "+i; i++; } used.add(s.toLowerCase()); return s;
}
async function exportAllBasesXlsx(){
  if(!_allBasesCache){ toast("Сначала откройте сводку"); return; }
  toast("Подготовка файла…");
  let XLSX; try{ XLSX=await ensureXlsx(); }catch(e){ toast("Не удалось сделать Excel"); return; }
  const wb=XLSX.utils.book_new(); const used=new Set();
  _allBasesCache.forEach(b=>{
    if(b.rows===null) return;   // недоступную базу пропускаем
    const rows=(b.rows||[]).map(_acctRow);
    const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"Наименование":""}]); ws["!cols"]=_ACCT_COLS;
    XLSX.utils.book_append_sheet(wb, ws, _sheetName(b.name, used));   // лист на базу
  });
  // ни одной доступной базы — файл с единственной ячейкой «Нет данных» только путал: не сохраняем
  if(!wb.SheetNames.length){ toast("Нет доступных баз — сохранять нечего"); return; }
  saveXlsx(wb, `vahtahoz-по-базам-${todayStr()}.xlsx`, "Excel по базам сохранён");
}
async function exportOneBaseXlsx(baseId){
  const b=(_allBasesCache||[]).find(x=>x.id===baseId); if(!b||!b.rows){ toast("Нет данных по базе"); return; }
  let XLSX; try{ XLSX=await ensureXlsx(); }catch(e){ toast("Не удалось сделать Excel"); return; }
  const rows=b.rows.map(_acctRow);
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"Наименование":""}]); ws["!cols"]=_ACCT_COLS;
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, _sheetName(b.name, new Set()));
  saveXlsx(wb, `vahtahoz-${_fileSafe(b.name)}-${todayStr()}.xlsx`, "Excel сохранён");
}
const cloudDirtyKey = (cid)=>`${NS}vahtahoz_dirty_${cid}`;
// удалить все sync-маркеры базы (dirty + снимки подписей) — при удалении/замене базы, чтобы не копить мусор
function clearBaseSyncKeys(cid){ if(!cid) return; _jrSigCache=null; try{ localStorage.removeItem(cloudDirtyKey(cid)); for(const k of ["stock","stockCounts","stockVals","stockAllowed","jr","jrAllowed","settings"]) localStorage.removeItem(`${NS}vahtahoz_sig_${k}_${cid}`); try{ localStorage.removeItem(`${NS}vahtahoz_viewonly_bak_${cid}`); localStorage.removeItem(`${NS}vahtahoz_typerestrict_bak_${cid}`); }catch(_){} }catch(_){} }
// navigator.onLine на iOS standalone-PWA часто ЛОЖНО false сразу после загрузки (пока не пошёл первый
// запрос), и событие "online" не срабатывает → статус залипал в «офлайн» при живой сети. Поэтому online
// считаем подтверждённым, если ЛИБО navigator.onLine!==false, ЛИБО реальный запрос долетел (_netConfirmed).
let _netConfirmed = false;
function cloudOnline(){ return _netConfirmed || navigator.onLine!==false; }
// лёгкая проба сети: любой ДОЛЕТЕВШИЙ ответ (даже 4xx) = сеть есть; только сетевой сбой/таймаут = нет.
async function netProbe(){
  try{
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),6000);
    try{ await fetch(`${CLOUD_CFG.url}/rest/v1/`, { method:"GET", headers:{ apikey:CLOUD_CFG.anon }, signal:ctrl.signal }); return true; }
    finally{ clearTimeout(to); }
  }catch(e){ return false; }
}
/* «ограниченный» пользователь — вошёл в облако и НЕ имеет права на задачи:
   base_members ИЛИ org_roles (бухгалтер без членства базы всё равно не видит задачи). */
function isRestrictedUser(){
  const m = activeMember();
  if(m) return !m.can_view_tasks;
  if(cloud.profile && cloud.profile.is_admin) return false;
  if(cloud.ready && (cloud.orgRoles||[]).some(o=>o.active!==false)){
    const cid=activeCloudId(); const partyId=(cloud._baseParty||{})[cid];
    const roles=(cloud.orgRoles||[]).filter(o=>o.active!==false && (o.party_id==null || o.party_id===partyId));
    if(roles.length) return !roles.some(o=>o.can_view_tasks);
  }
  return false;
}
// Кухня нужна повару и управляющим (надзор). Скрываем у хозрабочего/механика/бухгалтерии.
// Локальная/офлайн база без облачных ролей — показываем (одиночный режим).
function canSeeKitchen(){
  if(cloud.profile && cloud.profile.is_admin) return true;
  if(canManageBase()) return true;                        // нач.участка+/партийные/глоб. управляющие
  const m = activeMember();
  if(m && m.role==="cook") return true;                   // повар
  const hasCloudRole = !!m || (cloud.orgRoles||[]).some(o=>o.active!==false);
  return !hasCloudRole;                                    // есть облачная роль, но не повар/управляющий → скрыть
}
// блокировка управления базами: либо роль ограничена, либо роль ЕЩЁ НЕ ИЗВЕСТНА (есть сохранённая сессия,
// но cloud.members не загрузились) → fail-safe: до выяснения роли не даём переключать/плодить базы,
// иначе на холодном старте начальник успел бы переключиться на локальную базу в обход ограничений.
function roleBaseLocked(){
  try{
    if(isRestrictedUser()) return true;
    if(!loadCloudSess() || cloud.ready) return false;
    /* РОЛИ ЕЩЁ НЕ ПРИЕХАЛИ. Раньше здесь стоял безусловный запрет — и на слабом канале он держался
       до 25 секунд (столько ждёт общий таймаут загрузки профиля/членств), а человек всё это время
       получал «Переключение баз недоступно для вашей роли»: неправдой про роль на ровном месте.
       Между тем ответ уже есть: cloudGateTasks сохраняет раскладку прошлого запуска ПО uid и
       пишет её только когда права были известны по-настоящему. Берём её — переключение становится
       мгновенным и офлайн, и на «стухшей» связи. Запрет остаётся там, где о человеке неизвестно
       ничего (первый вход на этом телефоне): fail-safe важнее удобства ровно один раз.
       Это не ослабление доступа: сами данные закрыты политиками на сервере, а локальная база
       никаких облачных прав не даёт. */
    const h = loadGateHints();
    return h ? !!h.t : true;
  }catch(_){ return isRestrictedUser(); }
}
function visibleLog(){
  if(!isRestrictedUser()) return state.log;
  return (state.log||[]).filter(l => !String(l.action||"").toUpperCase().startsWith("TASK"));
}

/* статус-бар синхронизации: syncing | offline | synced | error | hidden */
let _syncHideT = null;
function setSyncStatus(kind, text){
  const bar = document.getElementById("syncBar"); const chip = document.getElementById("syncChip");
  if(!bar || !chip) return;
  clearTimeout(_syncHideT);
  if(kind==="hidden" || !cloud.ready || !activeCloudId()){ bar.classList.add("hidden"); bar.classList.remove("busy"); chip.classList.add("hidden"); return; }
  const M = {
    syncing:{ bg:"#0E7C86", icon:"refresh", chip:"refresh", txt:text||"Сохранение в облако…", lbl:"Идёт синхронизация с облаком" },
    offline:{ bg:"#92400e", icon:"cloudOff", chip:"cloudOff", txt:text||"Нет интернета — данные уйдут в облако, когда он появится", lbl:"Нет интернета — нажмите, чтобы повторить синхронизацию" },   /* #b45309 (~4.0:1) → #92400e (~5.9:1): AA для мелкого (12px) текста syncBar, как у .badge-yellow */
    synced: { bg:"#15803d", icon:"check", chip:"check", txt:text||"Сохранено в облаке", lbl:"Сохранено в облаке — нажмите, чтобы синхронизировать" },
    error:  { bg:"#b91c1c", icon:"alert", chip:"alert", txt:text||"Не удалось сохранить — пробуем снова", lbl:"Ошибка синхронизации — нажмите, чтобы повторить" },
  };
  const m = M[kind] || M.syncing;
  bar.style.background = m.bg; bar.innerHTML = `${ico(m.icon,14)} ${esc(m.txt)}`;
  chip.innerHTML = ico(m.chip,14); chip.classList.remove("hidden");
  // подпись значка зависит от состояния: глиф меняется (↻/⏳/✓/⚠), а «нажмите, чтобы повторить» должно быть слышно всегда
  chip.title = m.lbl || "Синхронизация с облаком"; chip.setAttribute("aria-label", m.lbl || "Синхронизация с облаком");
  bar.classList.remove("hidden");
  bar.classList.toggle("busy", kind==="syncing");   // анимированный прогресс-бар только при активной синхронизации
  if(kind==="synced"){
    _syncHideT = setTimeout(()=>{ bar.classList.add("hidden"); chip.classList.add("hidden"); }, 1800);
  }
}

async function cloudInit(){
  if(window._recoveryMode) return;   // идёт сброс пароля по ссылке — не трогаем сессию/гейт
  if(cloud._initDone) return; cloud._initDone = true;   // защита от повторного запуска (дубль listener)
  // авто-пуш/синхронизация при возврате сети
  window.addEventListener("online", async ()=>{
    _netConfirmed = true;   // браузер сообщил о сети — снимаем возможный ложный офлайн
    if((cloud.session || loadCloudSess()) && cloud.basesLoaded!==true){
      // базы не загрузились — продлеваем токен при необходимости и дозагружаем базы
      try{
        let s = loadCloudSess() || cloud.session;
        if(s && s.refresh_token && (!s.expires_at || s.expires_at<=Date.now()+60000)){
          cloud.session = s;   // через cloudDoRefresh (single-flight) — не плодим вторую ротацию параллельно реактивному 401-рефрешу
          if(await cloudDoRefresh()) s = loadCloudSess();
        }
        if(s && s.access_token) await cloudOnLogin({ access_token:s.access_token, refresh_token:s.refresh_token, user:s.user });
      }catch(e){
        console.warn("online-reload", e);
        // постоянный отказ токена (пароль сменили/аккаунт удалён) — иначе вечный тупик «ждём сеть» при живой сети
        if(e && e.permanent && cloudOnline()) cloudSessionExpired("Вход устарел — войдите снова");
      }
      return;
    }
    if(cloud.ready){
      // членство — ДО проверки активной базы (см. cloudSyncNow): пока не было связи, человека могли
      // вернуть на смену, а до этого RLS не отдавал ему ни одной базы и acid был null
      await cloudRefreshMyMembership();
      await cloudRelinkIfNeeded();   // дотянуть привязку локальных баз, если вход прошёл, но autolink не отработал
      const acid=activeCloudId();
      if(acid){ setSyncStatus("syncing","Сеть появилась — синхронизация…"); cloudActivate(acid); }
      // задачи: до-выгружаем отложенные правки и пере-синкаем (не зависят от базы)
      if(localStorage.getItem(TASKS_DIRTY)) cloudPushTasksNow().catch(()=>{}); else cloudSyncTasks().catch(()=>{});
    }
  });
  window.addEventListener("offline", ()=>{ _netConfirmed = false; if(cloud.ready && activeCloudId()) setSyncStatus("offline"); });
  try{
    await ensureSB();   // клиент нужен для realtime/setSession ниже
    // iOS ложно-offline при старте: если браузер говорит «нет сети», НЕ блокируем запуск, а фоном пробуем
    // достучаться. Долетело → сеть есть: снимаем офлайн и до-запускаем синк (как по событию online).
    if(navigator.onLine===false){
      (async()=>{
        for(let i=0;i<3 && !_netConfirmed;i++){   // до 3 попыток: холодный старт бэкенда мог не уложиться в 6с
          if(await netProbe()){ if(!_netConfirmed){ _netConfirmed=true; try{ renderHeader(); }catch(_){}; window.dispatchEvent(new Event("online")); } break; }
          await new Promise(r=>setTimeout(r, 4000));
        }
      })().catch(()=>{});
    }
    let s = loadCloudSess();
    // access-токен живёт ~1ч. Если истёк/истекает в ближайшую минуту — продлеваем ПРЯМЫМ fetch
    // по refresh-токену (не зависим от supabase-клиента, который в standalone мог висеть).
    if(s && s.refresh_token && (!s.expires_at || s.expires_at <= Date.now()+60000)){
      cloud.session = s;   // cloudDoRefresh берёт refresh-токен из cloud.session и идёт под single-flight (без двойной ротации цепочки)
      try{
        if(await cloudDoRefresh()) s = loadCloudSess();   // внутри свой 15с-таймаут; единый путь ротации
      }catch(e){
        // Экран входа — ТОЛЬКО при ПОСТОЯННОМ отказе (токен отозван/аккаунт удалён/пароль сменили).
        // Временный сбой (холодный старт дольше 15с, моргнувшая сеть) сессию НЕ стирает: входим со
        // старым токеном — реактивный 401-рефреш в cloudRest продлит позже. Иначе после одной
        // авторизации людям снова выскакивал логин/пароль без их выхода.
        if(e && e.permanent && cloudOnline()){ s = null; clearCloudSess(); }
      }
    }
    if(s && s.access_token && s.user && s.user.id){
      hideLoginGate();
      // фоновый setSession — для realtime/autoRefresh; не блокирует восстановление (промис не ждём)
      ensureSB().then(sb=>Promise.race([
        sb.auth.setSession({ access_token:s.access_token, refresh_token:s.refresh_token }).catch(()=>{}),   // свой catch: реджект ПОСЛЕ таймаута race не станет unhandled
        new Promise(res=>setTimeout(res,4000))
      ])).catch(()=>{});
      await cloudOnLogin({ access_token:s.access_token, refresh_token:s.refresh_token, user:s.user });
    } else {
      // нет сохранённой/продлеваемой сессии → вход обязателен (режим «без облака» убран).
      // НО cloudInit асинхронный, а gateEarly показал гейт сразу — за время cloudInit пользователь мог УЖЕ войти.
      // Перечитываем сессию (и смотрим cloud.session): иначе повторно перекрыли бы успешный вход панелью логина
      // (баг: окно логина всплывало сразу после входа и исчезало лишь после перезахода).
      const fresh = loadCloudSess();
      if((fresh && fresh.access_token && fresh.user) || (cloud.session && cloud.session.access_token)) hideLoginGate();
      else showLoginGate();
    }
  }catch(e){ console.warn("cloudInit", e); }
  finally{ hideSplash(); }   // роли уже пришли (или сессии нет вовсе) — состав кнопок окончателен
}
/* ---- Полноэкранный логин-гейт ---- */
/* ---------- Восстановление пароля по почте (Supabase recovery) ----------
   Работает, когда домен логина (LOGIN_DOMAIN) реально принимает почту (catch-all на своём домене).
   1) «Забыли пароль?» → recover-письмо со ссылкой на приложение;
   2) ссылка открывает приложение с #type=recovery&access_token=… → экран нового пароля. */
// вызов Edge Function БЕЗ токена — только публичные действия восстановления (юзер не залогинен)
async function cloudCallFnPublic(action, payload){
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), 35000);
  let r;
  try{ r = await fetch(`${CLOUD_CFG.url}/functions/v1/manage-user`, { method:"POST", signal:ctrl.signal, headers:{ apikey:CLOUD_CFG.anon, "Content-Type":"application/json" }, body: JSON.stringify(Object.assign({ action }, payload)) }); }
  catch(_){ clearTimeout(to); throw new Error("Сервер недоступен. Проверьте интернет"); }
  clearTimeout(to);
  const d = await r.json().catch(()=>({}));
  if(!r.ok || d.error) throw new Error(d.error || ("Ошибка "+r.status));
  return d;
}
function _recErr(m){ return m==="wrong_code"?"Неверный код":m==="expired"?"Код истёк — запросите заново":m==="too_many"?"Слишком много попыток, подождите":m==="wait"?"Подождите минуту перед повтором":m; }
async function cloudRefreshRecoveryProfile(){
  if(!cloud.session?.access_token || !cloud.profile?.id) return null;
  try{
    // через definer-RPC: колоночный SELECT на recovery_* отозван (чужую резервную почту не видно никому)
    const raw = await cloudRest(`rpc/my_recovery_email`, cloud.session.access_token);
    const prof = Array.isArray(raw) ? raw[0] : raw;   // rpc отдаёт json-объект (страховка и от массива)
    if(prof && typeof prof==="object"){
      cloud.profile.recovery_email = prof.recovery_email;
      cloud.profile.recovery_email_verified = !!prof.recovery_email_verified;
      return prof;
    }
  }catch(e){ console.warn("cloudRefreshRecoveryProfile", e); }
  return null;
}
function cloudApplyRecoveryProfile(src){

  if("recovery_email" in src) cloud.profile.recovery_email = src.recovery_email;
  if("recovery_email_verified" in src) cloud.profile.recovery_email_verified = !!src.recovery_email_verified;
}

           человека запрашивать новую ссылку по кругу — с тем же паролем и тем же отказом. */
        let msg = "";

        if(/password/i.test(msg) && /at least|too short|length/i.test(msg)) throw new Error("Пароль не короче 8 символов");

  };

function showLoginGate(){
  const g = document.getElementById("loginGate"); if(!g) return;
  hideSplash();   // вход закрывает интерфейс сам — держать поверх него ещё и заставку незачем
  // Открытый лист лежит ВЫШЕ гейта (.sheet z-index 100 против 90 — сделано ради юр-страниц до входа),
  // поэтому при принудительном разлогине (истекла сессия, удалили аккаунт) карточка позиции или список
  // участников оставались видимыми и интерактивными поверх экрана входа. Телефон передают следующему —
  // он видел чужие данные вместо чистого входа.
  try{ closeSheet(); }catch(_){}
  g.classList.remove("hidden"); g.style.display="flex";  // инлайн display перебивает .hidden — синхронизируем явно
  /* Гейт только НАКРЫВАЛ интерфейс: содержимое #app оставалось в DOM, в порядке табуляции и
     доступно скринридеру, а гейт стоит ПОСЛЕДНИМ элементом документа — Tab с поля пароля уходил
     на кнопки склада. Телефон передают следующей смене, и с экрана входа читались наименования,
     остатки и места прошлой смены. inert убирает поддерево из фокуса, кликов и а11y-дерева. */
  _gateInert(true);
  const go = document.getElementById("lgGo"),
        em = document.getElementById("lgEmail"), pw = document.getElementById("lgPwd"),
        err = document.getElementById("lgErr");
  if(!go) return;
  const doLogin = async ()=>{
    const e=(em.value||"").trim(), p=pw.value||"";
    if(!e||!p){ err.textContent="Введите логин и пароль"; return; }
    go.disabled=true; go.textContent="Вход…"; err.textContent="";
    // бэкенд на бесплатном тарифе может «просыпаться» 20-30с — подсказка, чтобы не выглядело зависшим
    const hint = setTimeout(()=>{ err.textContent="Подключаемся, это займёт несколько секунд…"; }, 5000);
    const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error("превышено время ожидания сети")),55000));
    try{ await Promise.race([cloudLogin(e,p), timeout]); hideLoginGate(); }
    catch(ex){ go.disabled=false; go.textContent="Войти"; err.textContent="Не удалось войти — проверьте логин, пароль и интернет"; }
    finally{ clearTimeout(hint); }
  };
  // прямое присваивание (а не addEventListener) — обработчик гарантированно стоит при каждом показе, без дублей
  go.onclick = doLogin;
  pw.onkeydown = ev=>{ if(ev.key==="Enter") doLogin(); };
  try{ em.focus(); }catch(_){}
}
/* inert поддерживают все целевые движки (Safari 15.5+, Chrome 102+); в старых свойство просто
   игнорируется, поэтому дублируем aria-hidden для скринридеров. */
function _gateInert(on){
  for(const id of ["app","navbar"]){
    const el = document.getElementById(id); if(!el) continue;
    try{ el.inert = !!on; }catch(_){}
    if(on) el.setAttribute("aria-hidden","true"); else el.removeAttribute("aria-hidden");
  }
}
function hideLoginGate(){
  const g = document.getElementById("loginGate"); if(g){ g.classList.add("hidden"); g.style.display="none"; }  // .hidden не перебьёт инлайн display — гасим явно
  _gateInert(false);
}
async function cloudLogin(email, password){
  const sb = await ensureSB();
  // Токен получаем ПРЯМЫМ запросом (быстро, как обычный fetch) — это обходит зависания
  // auth-клиента Supabase на navigator.locks в Safari/standalone-PWA, из-за которых
  // штатный signInWithPassword мог висеть. Таймаут запроса — 35с (бэкенд на free-тарифе
  // может «холодно стартовать» ~20-30с после простоя; короткий таймаут рвал первый вход).
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 35000);
  // логин можно вводить без домена: «worker» → worker + LOGIN_DOMAIN
  const raw = (email||"").trim();
  const hasAt = raw.includes("@");
  const primary = hasAt ? raw : raw + LOGIN_DOMAIN;
  async function _attempt(em){
    const r = await fetch(`${CLOUD_CFG.url}/auth/v1/token?grant_type=password`, {
      method:"POST", signal:ctrl.signal,
      headers:{ "apikey":CLOUD_CFG.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ email:em, password })
    });
    const dd = await r.json().catch(()=>({}));
    return { ok: !!(r.ok && dd.access_token), d: dd };
  }
  let d;
  try{
    let res = await _attempt(primary);
    // толерантность к домену на время миграции @bazahoz.app→@razvedchick.ru: если логин без @ не прошёл
    // на новом домене — пробуем старый (аккаунт мог быть ещё не мигрирован). Порядок миграции не важен.
    if(!res.ok && !hasAt && LEGACY_LOGIN_DOMAIN!==LOGIN_DOMAIN){
      const alt = await _attempt(raw + LEGACY_LOGIN_DOMAIN);
      if(alt.ok) res = alt;
    }
    if(!res.ok) throw new Error("Неверный логин или пароль");
    d = res.d;
  }catch(e){
    if(e.name==="AbortError") throw new Error("превышено время ожидания сети");
    throw e;
  }finally{ clearTimeout(t); }
  // Токен уже получен — вход СЧИТАЕТСЯ успешным здесь. Дальше идут операции через
  // auth-клиент Supabase (setSession) и PostgREST (sb.from в cloudOnLogin), которые в
  // Safari/standalone-PWA могут подвисать. Их НЕЛЬЗЯ ждать блокирующе, иначе кнопка
  // «Вход…» висит до общего 55-секундного таймаута. Поэтому каждую — со своим таймаутом.
  cloud.session = { access_token:d.access_token, refresh_token:d.refresh_token, user:d.user };
  saveCloudSess(d);   // СИНХРОННО: переживёт reload от cloudAutoLink (один вход, не повторный)
  // Общий вахтовый телефон: если облачными базами на этом устройстве владел ДРУГОЙ человек (предыдущий не вышел
  // кнопкой, его сессия истекла → показался гейт, входит новый) — вычищаем чужие облачные профили/склады ДО загрузки,
  // иначе новый увидит/экспортирует чужой склад из localStorage (до RLS). Тот же uid (сам переистёк, вошёл собой) —
  // НЕ трогаем (офлайн-правки целы). Сессия уже сохранена → reload даёт cloudInit восстановить НОВОГО начисто.
  try{
    const prevOwner = localStorage.getItem(NS+"vahtahoz_cloud_owner");
    localStorage.setItem(NS+"vahtahoz_cloud_owner", d.user.id);
    // ВАЖНО: учитываем и КОПИИ облачной базы (fromCloudId). Если облачных профилей на устройстве
    // уже нет, а копии остались (профиль удалили из списка / базы не загрузились), прежнее условие
    // не срабатывало и чужой склад доставался следующему вошедшему — ровно та дыра, ради которой
    // копии и помечаются.
    if(prevOwner && prevOwner !== d.user.id && profiles.list.some(p=>p.cloudId || p.fromCloudId)){ purgeCloudProfiles(true); location.reload(); return; }
  }catch(_){}

  Promise.race([
    sb.auth.setSession({ access_token:d.access_token, refresh_token:d.refresh_token }).catch(e=>console.warn("setSession", e)),   // свой catch: поздний реджект не станет unhandled
    new Promise(res=>setTimeout(res,4000))
  ]).catch(()=>{});

    cloudOnLogin({ access_token:d.access_token, refresh_token:d.refresh_token, user:d.user }),
    new Promise(res=>setTimeout(res,8000))
  ]);
}

  // множили бы перекрывающиеся цепочки (каждая со сбросом attempt=0) → шторм запросов.

    if(cloud._basesLoading) return;

    cloud._basesLoading = true;
  }

    cloud.session = session;

    // Общий таймаут 25с: зависший PostgREST-запрос не должен оставлять загрузку висеть вечно.
    const tok = session.access_token;

      Promise.all([
        cloudRest(`profiles?select=id,username,display_name,is_admin&id=eq.${encodeURIComponent(uidv)}`, tok),   // явные колонки: SELECT на recovery_* отозван, select=* упал бы с 403
        cloudRest(`base_members?select=*&user_id=eq.${encodeURIComponent(uidv)}`, tok),   // ТОЛЬКО мои членства: RLS теперь даёт менеджеру видеть и чужие строки, но cloud.members = «мои права»
        cloudRest(`bases?select=id,name,party_id`, tok),
        cloudRest(`org_roles?select=*&user_id=eq.${encodeURIComponent(uidv)}`, tok).catch(()=>[]),   // территориальные/глобальные роли (может отсутствовать на старом бэке → [] )

    // ПОСЛЕ cloud.bases: разбор членств называет базы по именам, а до этой строки их ещё нет.

    // НЕ блокируя вход — иначе кнопка «Вход…» висит до конца первой выгрузки.

    if(!cloud.session){ cloud._basesLoading=false; clearTimeout(cloud._basesRetryT); return; }

    // Токен валиден → пользователь АУТЕНТИФИЦИРОВАН, даже если профиль/базы не загрузились

    // состоявшимся с фолбэком и догружаем данные ретраем (3с/5с/7с… до 20с).

  }

// Удаляет с устройства ЛОКАЛЬНЫЕ профили/слоты/подписи ОБЛАЧНЫХ баз (их данные привязаны к аккаунту).

// из STORE_KEY/слотов ДО RLS → новый увидел бы чужой склад. Тот же uid НЕ трогаем (не теряем офлайн-правки).
/* alsoCopies=true — сносим и КОПИИ облачной базы. Так чистим только при входе ДРУГОГО аккаунта.
   При обычном выходе своего же пользователя копии ОСТАЮТСЯ: они создаются ровно тогда, когда данные
   НЕ попали в облако (конфликт «телефон vs общая база», view-only бэкап, копия до смены роли), то есть
   это единственный носитель непрошедших правок — стирать его без предупреждения нельзя.
   Утечка при этом закрыта: метка vahtahoz_cloud_owner не сбрасывается при выходе, поэтому вход
   другого uid всё равно попадёт на гард выше и вызовет purgeCloudProfiles(true). */
function purgeCloudProfiles(alsoCopies){
  try{
    // ВАЖНО: чистим не только профили с cloudId, но и КОПИИ облачной базы (fromCloudId).
    // Копии создаются при конфликте «телефон vs общая база», при view-only бэкапе и перед сменой
    // роли — это ПОЛНЫЙ склад и журнал базы, лежащий в обычном слоте. Раньше они не имели cloudId,
    // попадали в `locals` и оставались на устройстве: следующий вошедший видел их в списке баз,
    // открывал и правил чужой склад, а «Экспорт всех баз» выгружал его в файл.
    // LEGACY: копии, созданные ПРЕЖНИМИ сборками, метки fromCloudId не имеют — опознаём по имени
    // (именно так они и создавались). Иначе у давнего прод-пользователя чужой склад остался бы
    // на устройстве при передаче телефона, хотя новые копии уже чистятся.
    const LEGACY_COPY_RE = /\((локальная копия|копия до смены роли)\)\s*$/;
    const isCopy = p => !p.cloudId && (!!p.fromCloudId || LEGACY_COPY_RE.test(String(p.name||"")));
    const doomed = p => !!p.cloudId || (alsoCopies && isCopy(p));
    const cloudProfs = profiles.list.filter(doomed);
    if(!cloudProfs.length) return;
    const activeWasCloud = cloudProfs.some(p=>p.id===profiles.activeId);
    // clearBaseSyncKeys ТОЛЬКО по своему cloudId: для копии её fromCloudId — это id ЖИВОЙ облачной
    // базы, и чистка снесла бы dirty/подписи реального профиля (маркер «не синхронизировано»).
    cloudProfs.forEach(p=>{ try{ localStorage.removeItem(slotKey(p.id)); if(p.cloudId) clearBaseSyncKeys(p.cloudId); }catch(_){} });
    let locals = profiles.list.filter(p=>!doomed(p));
    if(!locals.length){ locals = [{ id: uid(), name: "База 1" }]; }
    const newActive = activeWasCloud ? locals[0].id : profiles.activeId;
    /* Порядок важен: СНАЧАЛА список баз, ПОТОМ живой STORE_KEY. Раньше было наоборот и всё
       молча глоталось общим catch: если saveProfiles не проходил (квота/приватный режим),
       на диске оставался старый список — с облачными базами, чьи слоты уже снесены, и с
       activeId облачной базы, — а STORE_KEY уже держал данные ЛОКАЛЬНОЙ базы. При следующем
       запуске локальный склад открывался ПОД ИМЕНЕМ облачной базы и мог уехать в неё push-ом. */
    const next = { activeId: newActive, list: locals };
    let saved=false;
    for(let i=0;i<3 && !saved;i++) saved = saveProfiles(next);

    if(saved){
      if(activeWasCloud){ const raw = localStorage.getItem(slotKey(newActive)); localStorage.setItem(STORE_KEY, raw || JSON.stringify(freshProfileState())); }
    }else{
      // Список не записался. Главное сделано — слоты облачных баз удалены; осталось не оставить
      // чужие данные в STORE_KEY. Пустой STORE_KEY при старте даёт чистое состояние, а не чужой склад.
      console.error("purgeCloudProfiles: список баз не сохранён");
      if(activeWasCloud){ try{ localStorage.removeItem(STORE_KEY); }catch(_){} }
      try{ toast("Не удалось сохранить список баз — проверьте место в памяти телефона"); }catch(_){}
    }
  }catch(e){ console.error("purgeCloudProfiles", e); }
}
/* Что на этом телефоне ещё НЕ уехало в общую базу. Список имён баз + признак задач. */
function cloudPendingWork(){
  const bases=[];
  try{
    for(const p of profiles.list){
      if(p.cloudId && localStorage.getItem(cloudDirtyKey(p.cloudId))) bases.push(p.name||"без имени");
    }
  }catch(_){}
  let tasks=false; try{ tasks = !!localStorage.getItem(TASKS_DIRTY); }catch(_){}
  return { bases, tasks, any: bases.length>0 || tasks };
}

     БЕЗ ЕДИНОГО ВОПРОСА прямо по тапу «Выйти». Типовая вахтовая ситуация: день без интернета,
     приходы и выдачи копятся локально, вечером телефон передают сменщику и жмут «Выйти» —
     день работы исчезал молча и безвозвратно, dirty-маркер стирался вместе с данными. */

  if(pend.any){
    const what = [pend.bases.length?`базы: ${pend.bases.join(", ")}`:"", pend.tasks?"задачи":""].filter(Boolean).join("; ");
    const opts = [];
    if(cloud.ready && cloudOnline()) opts.push({label:"Синхронизировать и выйти", value:"sync"});
    opts.push({label:"Сначала сделать экспорт", value:"export"});
    opts.push({label:"Выйти и потерять несохранённое", value:"drop", color:"btn-danger"});
    const ans = await chooseSheet(`Не отправлено в общую базу — ${what}.\nПри выходе эти данные будут удалены с телефона.`, opts);
    if(ans===null) return;                       // отмена — выход не выполняем
    if(ans==="export"){
      try{ if(typeof exportData==="function") exportData({localOnly:true}); }catch(_){}
      toast("Файл сохранён. Выйдите ещё раз, когда убедитесь, что он на месте");
      return;                                    // намеренно НЕ выходим: пусть человек проверит файл
    }
    if(ans==="sync"){
      setSyncStatus("syncing","Отправка изменений перед выходом…");
      try{ await cloudPushNow(); }catch(_){}
      try{ if(typeof cloudPushTasksNow==="function") await cloudPushTasksNow(); }catch(_){}
      if(cloudPendingWork().any){
        const go = await confirmSheet("Отправить всё не удалось — часть данных осталась только на телефоне. Всё равно выйти и потерять их?",
                                      { yes:"Выйти и потерять", no:"Остаться", danger:true, title:"Не всё отправлено" });

  cloud.tasksChannel=null; cloud.tasksSubUid=null; cloud.tasksBusy=false; cloud.basesLoaded=false; cloud.membersLoaded=false;   // сброс задач: иначе после входа другим юзером realtime молчит

  // иначе следующий вошедший (другой человек на общем телефоне) увидит/откроет чужую базу и её данные из

  location.reload();

     не обновлялся никогда: владелец переименовывал базу у себя, а на телефонах бригады висело
     старое имя до полного пересоздания профиля. Облако тут источник истины (то же правило, что и
     для данных), поэтому подтягиваем. Санитайзим, как и при создании: имя пишет другой участник. */
  for(const p of profiles.list){
    if(!p.cloudId) continue;
    const cn = cloud.bases[p.cloudId];
    if(!cn || cn===p.name) continue;
    const clean = cleanName40(cn);
    if(clean && clean!==p.name){ p.name = clean; changed = true; }
  }
  if(changed) saveProfiles(profiles);
  if(switchTo && !activeCloudId()){ switchProfile(switchTo, true); return true; }   // true = автопривязка, в обход роль-гарда
  // ДЕАДЛОК ограниченной роли: активная — локальная «База 1» (создаётся по умолчанию), а привязанная к членству
  // база уже есть в списке (создана прошлым входом) → switchTo пуст, переключения не было, а UI смены базы у
  // ограниченных ролей скрыт → работник навсегда видит «База 1». У не-владельца активной должна быть ЕГО
  // облачная база — переключаемся сами.
  if(!activeCloudId() && !(cloud.profile && cloud.profile.is_admin)){
    const linked = profiles.list.find(x=>x.cloudId && myBases.includes(x.cloudId));
    if(linked && profiles.activeId!==linked.id){ switchProfile(linked.id, true); return true; }
  }
  return false;
}
// ДОТЯГИВАЕМ привязку: если вход прошёл, но cloudAutoLink не отработал (упала загрузка баз на слабой сети),
// локальные базы остаются cloudId=None и список оседает мимо облака. Здесь — при ручном ↻ / возврате сети —
// привязываем локальную базу к облачной с ТЕМ ЖЕ именем (cloudAutoLink идемпотентен и при совпадении имени только
// проставит cloudId, без создания дубля и reload). Это рычаг восстановления для застрявших на cloudId=None.
async function cloudRelinkIfNeeded(){
  if(!cloud.basesLoaded || !cloud.ready) return false;
  const cloudNames = Object.values(cloud.bases||{});
  // дотягиваем привязку только при ОДНОЗНАЧНОМ совпадении имени (имя облачной базы встречается ровно раз) —
  // иначе можно привязать не к той одноимённой базе.
  const hasUnlinkedMatch = profiles.list.some(x=>!x.cloudId && cloudNames.filter(n=>n===x.name).length===1);
  /* ещё один повод сходить в cloudAutoLink: имя привязанной базы разъехалось с облачным
     (владелец переименовал её с другого устройства) — тянем новое имя сюда.
     СРАВНИВАЕМ ОЧИЩЕННОЕ. Локально кладётся cleanName40(облачное имя), поэтому сравнение с «сырым»
     облачным именем на любом «нечистом» имени (длиннее 40 символов, с кавычками, угловыми скобками
     или амперсандом) не сходилось НИКОГДА: каждое ручное обновление, возврат сети и обновление
     членства впустую звали привязку и перезапись профилей. */
  const nameDrift = profiles.list.some(x=>{
    if(!x.cloudId) return false;
    const cn = cloud.bases[x.cloudId];
    if(!cn) return false;
    const clean = cleanName40(cn);
    return !!clean && clean!==x.name;
  });
  if(hasUnlinkedMatch || nameDrift){ await cloudAutoLink(); return true; }
  return false;
}
/* активация облачной базы: первичная выгрузка / подтягивание / разрешение офлайн-правок */
async function cloudActivate(cid, attempt){
  attempt = attempt||0;
  if(!cid || !cloud.ready) return;
  if(!cloudOnline()){ setSyncStatus("offline"); return; }
  if(isOffShift(cid)){   // нет доступа по RLS → не пушим/пуллим (без «REST 403»)
    // вахта: если есть НЕсинхронизированные правки (копил офлайн, а на сервере сняли со смены) — явно предупреждаем
    // о риске потери и советуем экспорт, а не молчим. RLS всё равно не примет его записи (403).
    const hasDirty = !!localStorage.getItem(cloudDirtyKey(cid));
    // Права просто НЕ загрузились (офлайн-старт) — это НЕ «сняли со смены». Ложное сообщение
    // пугало вахту и выглядело как потеря доступа, хотя достаточно дождаться связи.
    if(membershipUnknown()){
      setSyncStatus("offline", hasDirty
        ? "Права не загрузились — работаем локально. Изменения сохранены и уйдут в общую базу, как появится связь"
        : "Права не загрузились — работаем локально, синхронизируем при связи");
      return;
    }
    setSyncStatus("error", hasDirty
      ? "Вы сняты со смены. Несохранённые операции НЕ уйдут в общую базу — сделайте экспорт (⚙️ → Экспорт данных) и передайте начальнику"
      : "Вы сейчас не на смене на этой базе — изменения в общую базу не уйдут");
    return;
  }
  if(cloud.busy) return;          // уже идёт синхронизация/диалог конфликта — второй заход НЕ запускаем
  cloud.busy=true;                // ставим ДО await: иначе pull во время открытого диалога конфликта затёр бы локальное
  try{
    await ensureSB(); const perm = activeMember();   // ВНУТРИ try: сбой ensureSB не должен оставить cloud.busy=true навсегда (иначе весь синк залипает до перезапуска)
    setSyncStatus("syncing","Проверка облака…");
    const dirty = localStorage.getItem(cloudDirtyKey(cid));
    // count через прямой fetch (не sb.from — он висел в standalone). cloudRest кинет исключение при ошибке.
    const tok = cloud.session && cloud.session.access_token;
    const cIds = await cloudRest(`stock_items?select=id&base_id=eq.${encodeURIComponent(cid)}&limit=1`, tok, {timeout:45000});   // нужно лишь «пусто ли облако» → 1 строка (а не сотни), на слабом интернете не рвётся
    const cloudEmpty = !(Array.isArray(cIds) && cIds.length);
    // решение «выгружать» — по складу/журналам (задачи не синкаются и тут не учитываются)
    const localHasData = (state.stock&&state.stock.length) ||
      JOURNAL_KEYS.some(k=>(state.journals?.[k]||[]).length);
    // КОНФЛИКТ «Войти позже → Войти»: в локальной базе есть данные И в облаке есть данные,
    // и база ещё ни разу не синхронизировалась (нет снимка). Раньше тихо делали PULL —
    // локальная офлайн-работа терялась. Теперь спрашиваем, без молчаливой потери.
    const neverSynced = !Object.keys(loadSyncSig(cid,"stock")).length && !Object.keys(loadSyncSig(cid,"jr")).length;
    cloud._conflictAsked = cloud._conflictAsked || {};
    // view-only участник (нет прав на правку) с локальными офлайн-данными на ещё не привязанной базе:
    // диалог ему не показываем (правки всё равно не выгружаются), но НЕ теряем данные молча — сохраняем копией перед pull.
    if(!dirty && !cloudEmpty && localHasData && neverSynced && !canEditStock() && !cloud._conflictAsked[cid]){
      cloud._conflictAsked[cid] = true;
      // Копия ОБЯЗАТЕЛЬНА: сразу за этим блоком идёт pull, который перезапишет локальные данные.
      // Раньше сбой записи глотался `catch(_){}` и офлайн-работа исчезала молча.
      if(!_backupLocalBeforePull(cid)){
        cloud._conflictAsked[cid] = false;   // дать повторную попытку, когда место освободится
        setSyncStatus("error","Не удалось сохранить копию данных телефона — облако не загружаем");
        return;
      }
      // дальше — обычный pull ниже (для view-only облако источник истины)
    }
    if(!dirty && !cloudEmpty && localHasData && neverSynced && canEditStock() && !cloud._conflictAsked[cid]){
      cloud._conflictAsked[cid] = true;
      const choice = await chooseSheet(
        `В базе «${cloud.bases[cid]||"облачная"}» есть данные и на этом телефоне, и в общей базе бригады. Какие оставить главными?`,
        [ { label:"Оставить общую базу бригады (данные с телефона сохраним копией)", value:"cloud", color:"btn-primary" },
          { label:"Отправить данные с телефона (станут общими для бригады)", value:"local", color:"btn-ghost" } ]);
      if(choice==="local"){
        // снимок = id из облака → push удалит cloud-only; иначе пустой prevSig не чистит сирот
        try{
          const tok = cloud.session && cloud.session.access_token;
          const cSt = await cloudRestAll(`stock_items?select=id&base_id=eq.${encodeURIComponent(cid)}&order=id`, tok, {timeout:120000});
          const fakeSt={}; (cSt||[]).forEach(r=>{ if(r&&r.id) fakeSt[r.id]="0"; });
          saveStockSig(cid, fakeSt);
          saveSyncSig(cid,"stockAllowed", fakeSt);
          const cJr = await cloudRestAll(`journal_entries?select=id,kind&base_id=eq.${encodeURIComponent(cid)}&order=id`, tok, {timeout:90000});
          const fakeJ={}; (cJr||[]).forEach(r=>{ if(r&&r.id) fakeJ[r.id]="0"; });
          saveSyncSig(cid,"jr",fakeJ); saveSyncSig(cid,"jrAllowed",fakeJ);
        }catch(_){ saveStockSig(cid,{}); saveSyncSig(cid,"jr",{}); }
        markDirty(cid);
        await cloudPushNow();
        return;
      }
      // "Облачные" ИЛИ отмена → НЕ теряем локальное: сохраняем его отдельной локальной базой, затем тянем облако.
      // Диалог выше прямо обещает «данные с телефона сохраним копией» — если копия не легла,
      // pull делать нельзя, иначе обещание нарушено молча.
      if(!_backupLocalBeforePull(cid)){
        cloud._conflictAsked[cid] = false;
        setSyncStatus("error","Не удалось сохранить копию данных телефона — облако не загружаем");
        return;
      }
      await cloudPull(cid);
      return;
    }
    if((dirty || (cloudEmpty && localHasData)) && canEditStock()){
      // локальное — источник (первый раз или были офлайн-правки).
      // dirty снимает САМ cloudPushNow и ТОЛЬКО при успехе — здесь снимать нельзя,
      // иначе при сбое выгрузки маркер «не синхронизировано» потеряется и pull затрёт правки.
      if(cloudEmpty){ saveStockSig(cid,{}); saveSyncSig(cid,"jr",{}); markDirty(cid); }   // облако пусто → ПОЛНАЯ выгрузка; dirty ДО push: при сбое сети маркер «не синхронизировано» не потеряется (push повторится)
      await cloudPushNow();
    } else {
      await cloudPull(cid);
    }
  }catch(e){
    console.warn("cloudActivate", e); setSyncStatus("error", "Не удалось сохранить — проверьте интернет");
    // транзиентная ошибка (сессия не успела зарегистрироваться и т.п.) → повтор с backoff, чтобы синк состоялся
    if(cloudOnline() && attempt < 6) setTimeout(()=>{ cloudActivate(cid, attempt+1).catch(()=>{}); }, Math.min(3000+attempt*2000, 15000));
  }
  finally{ cloud.busy=false; cloudSubscribe(cid); }
}
/* Копия локальных данных отдельной локальной базой ПЕРЕД pull-ом, который их перезапишет.
   Возвращает УСПЕХ. Вызывающий обязан отказаться от pull при false — иначе офлайн-работа
   исчезает молча, хотя приложение обещало «данные с телефона сохраним копией».
   При частичном сбое (слот записан, список баз нет) слот удаляется — не оставляем мусор. */
function _backupLocalBeforePull(cid){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(_){ return false; }
  if(!raw) return true;                     // нечего сохранять
  const bkId = uid();
  try{ localStorage.setItem(slotKey(bkId), raw); }
  catch(e){ console.warn("backup before pull: слот", e); return false; }
  profiles.list.push({ id:bkId, fromCloudId: cid, name: cleanName40((cloud.bases[cid]||"База")+" (локальная копия)") });
  if(!saveProfiles(profiles)){
    profiles.list = profiles.list.filter(x=>x.id!==bkId);
    try{ localStorage.removeItem(slotKey(bkId)); }catch(_){}
    return false;
  }
  try{ toast("Данные с телефона сохранены копией"); }catch(_){}
  return true;
}
/* Возвращает true ТОЛЬКО если облачные данные реально применены. Все ранние выходы (офлайн,
   снят со смены, есть несинхронизированное локальное) и любая ошибка дают undefined: вызывающий
   обязан отличать «загрузили» от «не стали/не смогли» — см. cloudResolveWipe. Ошибку наружу не
   бросаем (её обрабатывает catch ниже), поэтому признак успеха и нужен возвращаемым значением. */
async function cloudPull(cid){
  if(!cid || !cloudOnline()) return;
  if(isOffShift(cid)) return;   // снят со смены: RLS вернёт пусто — НЕ затираем локальные данные пустотой
  // dirty без прав редактирования: push невозможен → иначе pull навсегда no-op (бухгалтер/демоут).
  // Снимаем dirty ТОЛЬКО после успешного backup — иначе правки теряются без копии (QuotaExceeded и т.п.).
  // Один слот на cloudId — не плодим профили при каждом pull.
  if(localStorage.getItem(cloudDirtyKey(cid)) && typeof canEditStock==="function" && !canEditStock()){
    let backed = false;
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw){ backed = true; }   // нечего сохранять
      else {
        const bkTag = `${NS}vahtahoz_viewonly_bak_${cid}`;
        let bkId = null;
        try{ bkId = localStorage.getItem(bkTag); }catch(_){}
        if(!bkId || !profiles.list.some(p=>p.id===bkId)){
          bkId = uid();
          profiles.list.push({ id:bkId, fromCloudId: cid, name: cleanName40((cloud.bases[cid]||"База")+" (локальная копия)") });
          try{ localStorage.setItem(bkTag, bkId); }catch(_){}
        } else {
          const p = profiles.list.find(x=>x.id===bkId);
          if(p) p.name = cleanName40((cloud.bases[cid]||"База")+" (локальная копия)");
        }
        localStorage.setItem(slotKey(bkId), raw);
        saveProfiles(profiles);
        backed = true;
        toast("Локальные правки сохранены копией — прав на выгрузку нет, загружаем облако");
      }
    }catch(e){ console.warn("view-only backup", e); backed = false; }
    if(backed){ try{ localStorage.removeItem(cloudDirtyKey(cid)); }catch(_){} }
    else {
      setSyncStatus("error","Нет прав на выгрузку и не удалось сохранить копию — облако не затираем");
      return;
    }
  }
  /* защита: не затирать НЕсинхронизированные локальные правки облачными данными.
     ИСКЛЮЧЕНИЕ — локально пусто. Реальный случай на вахте: база открылась пустой (снимок на
     телефоне не сохранился), а метка «есть несинхронизированное» осталась. Дальше замкнутый круг:
     pull не идёт, потому что метка, а push не идёт, потому что защита от обнуления не выпускает
     пустой склад в общую базу. Человек видел пустую базу и не мог ничего сделать.
     Когда локально нет НИ позиций, НИ журналов, ни надгробий — защищать нечего, грузим облако. */
  if(cloud.pushPending || localStorage.getItem(cloudDirtyKey(cid))){
    const _emptyLocal = (()=>{
      try{
        if((state.stock||[]).length) return false;
        for(const k of JOURNAL_KEYS){ if((state.journals?.[k]||[]).length) return false; }
        if((state.delJr||[]).length) return false;
        for(const k of STOCK_TYPE_KEYS){ if((state.delLoc?.[k]||[]).length || (state.delCat?.[k]||[]).length) return false; }
        return true;
      }catch(_){ return false; }
    })();
    if(!(_emptyLocal && !cloud.pushPending)){ cloudMaybePush(); return; }
    console.warn("cloudPull: локально пусто при метке несинхронизированного — грузим из облака");
    try{ localStorage.removeItem(cloudDirtyKey(cid)); }catch(_){}
  }
  const perm = activeMember();
  cloud.applying=true;
  setSyncStatus("syncing","Загрузка из облака…");
  try{
    // ПРЯМОЙ fetch с токеном (cloudRest) — не зависит от регистрации сессии в supabase-клиенте,
    // который в iOS standalone-PWA мог ВИСНУТЬ без таймаута («Загрузка из облака» навсегда).
    // cloudRest кидает исключение при ошибке/таймауте → попадём в catch и НЕ затрём локальное пустым.
    const tok = cloud.session && cloud.session.access_token;
    // пагинация обязательна: иначе PostgREST обрезает на 1000 и локальный склад «прыгает»
    const items = await cloudRestAll(`stock_items?select=*&base_id=eq.${encodeURIComponent(cid)}&order=id`, tok, {timeout:120000});
    const jr    = await cloudRestAll(`journal_entries?select=*&base_id=eq.${encodeURIComponent(cid)}&order=id`, tok, {timeout:90000});
    const baseArr = await cloudRest(`bases?select=settings&id=eq.${encodeURIComponent(cid)}`, tok);
    const base = Array.isArray(baseArr) ? baseArr[0] : null;
    // ЗАЩИТА ОТ ГОНКИ: пока шла загрузка (долгие await выше), пользователь мог
    // успеть отредактировать данные → cloudMaybePush уже выставил dirty. НЕ затираем
    // его правку облачными данными — выходим, finally до-выгрузит локальное (push).
    if(localStorage.getItem(cloudDirtyKey(cid))){
      setSyncStatus("syncing","Отправка изменений в облако…");
      return;
    }
    // ошибок нет → применяем (только теперь перезаписываем локальные данные)
    // id из БД проходят safeId (защита inline-onclick на случай порчи данных в облаке)
    state.stock = (items||[]).map(rowToStock).map(s=>{
      s.id = safeId(s.id);
      return normalizeStockItem(s);   // та же чистка, что при импорте: type-whitelist (XSS), партии, пересчёт qty из партий
    });
    const J=emptyJournals();
    const _delJrSet = new Set(Array.isArray(state.delJr)?state.delJr:[]);   // не воскрешаем явно удалённые (если облачное удаление ещё не доехало / чужой re-push)
    /* ts тоже санитайзим: data пишет любой участник с edit_stock, и после ужесточения monthKeyOf
       запись с мусорным ts не попадала НИ в один месяц — её нельзя было ни увидеть, ни удалить из UI,
       но она продолжала влиять на ledger, сумму по единицам и post-pull raise. Невалидный ts сводим
       к эпохе: движение станет видно под чипом «янв 1970», и его можно будет удалить. */
    const _fixTs = (v)=>{
      const s = String(v||"");
      if(/^\d{4}-\d{2}-\d{2}(T.*)?$/.test(s) && !isNaN(new Date(s))) return s;
      return new Date(0).toISOString();
    };
    (jr||[]).forEach(r=>{ const rid=safeId(r.id); if(_delJrSet.has(rid)) return; if(J[r.kind]) J[r.kind].push({ ...(r.data||{}), id:rid, ts:_fixTs((r.data||{}).ts) }); });
    for(const k in J) J[k] = J[k].sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
    state.journals = J;
    // снимок подписей/qty/jr — ПО СЫРЫМ облачным данным (ДО сверки/relink).
    // Иначе: (1) stockVals после raise → 3-way откатывает qty; (2) jr sig после relink → productId-фиксы не upsert.
    const pulledStSig = {}; const pulledVals = {};
    state.stock.forEach(s=>{ pulledStSig[s.id]=_sigOf(stockToRow(s,cid)); pulledVals[s.id]=Number(s.qty)||0; });
    const pulledJSig={}; for(const k of JOURNAL_KEYS) for(const op of (J[k]||[])) pulledJSig[op.id]=_sigOf({kind:k,data:op});
    // После pull: только безопасный подъём остатков / создание orphan-карточек.
    // НЕ вызываем mergeDuplicateStockByName здесь: слияние дублей + dirty→push удаляло «лишние»
    // id из облака и резко роняло счётчик «в наличии» (дубли с qty схлопывались).
    let _reconChanged = false;
    if(AUTO_RECONCILE && canEditStock()){
      try{
        const relinked = relinkJournalOpsToCanonical();
        const created = ensureProductsFromJournalLedger();
        const rec = reconcileLegacyQtyFromJournal(false);
        _reconChanged = !!(rec.fixed || created || relinked);
      }catch(e){ console.warn("post-pull stock reconcile", e); }
    }

       главный страховочный бэкап, — содержал 500 последних записей вместо всей истории движений.
       Теперь оставляем всё, что пришло; урезание живёт там, где ему и место, — в аварийном
       _saveStateTrimmed при переполнении localStorage (уровни 2000 и 500 записей). */

    if(base && base.settings){

      ensureTomb();

      const cs = base.settings;
      for(const k of STOCK_TYPE_KEYS){
        // надгробия из облака — источник; вычитаем их из применяемых списков (удаление распространилось)
        const tL = Array.isArray(cs.deletedLocations?.[k]) ? clean(cs.deletedLocations[k]) : [];
        const tC = Array.isArray(cs.deletedCategories?.[k]) ? clean(cs.deletedCategories[k]) : [];
        state.delLoc[k]=tL; state.delCat[k]=tC;
        if(Array.isArray(cs.locations?.[k]) && cs.locations[k].length) state.locations[k]=applyTomb(clean(cs.locations[k]), tL);
        else if(tL.length) state.locations[k]=applyTomb(state.locations[k]||[], tL);   // надгробия применяем даже при пустом облачном списке (иначе удаление не вступит в силу в этой сессии)
        if(Array.isArray(cs.categories?.[k]) && cs.categories[k].length) state.categories[k]=applyTomb(clean(cs.categories[k]), tC);
        else if(tC.length) state.categories[k]=applyTomb(state.categories[k]||[], tC);

    /* СНИМОК ПОДПИСЕЙ ПИШЕТСЯ ДО СОХРАНЕНИЯ НА ДИСК, А НЕ ПОСЛЕ. Порядок был обратный, и это

       снимком 394 095. При типовой квоте телефона в 5 МБ это ровно то «⛔ Память телефона

       Смысл _pullSaving перестановка не меняет: его читает только cloudMaybePush (чтобы

       то есть ровно прежнее поведение. */
    try{
      saveStockSig(cid, pulledStSig, pulledVals);

      // delete ждёт stockAllowed с push и после pull удаления не уходят в облако)
      const _restricted = allowedTypeKeys().length < STOCK_TYPE_KEYS.length;
      saveAllowedSig(cid, "stockAllowed", pulledStSig, _restricted);
      saveSyncSig(cid,"jr",pulledJSig);
      saveAllowedSig(cid,"jrAllowed",pulledJSig,_restricted);
    }catch(_){}
    cloud._pullSaving = true;
    try{ saveState(); }finally{ cloud._pullSaving = false; }   // без ложного dirty от saveState
    // исправления сверки (только у редакторов) — помечаем к выгрузке, чтобы облако тоже обновилось
    if(_reconChanged){ markDirty(cid); }

    return true;   // единственная точка успеха: облако применено к state и сохранено
  }catch(e){
    console.warn("cloudPull", e);
    setSyncStatus("error", "Не удалось загрузить — проверьте интернет и нажмите значок синхронизации вверху справа");
    // слабая сеть/таймаут → повторим (мягкий backoff), пока онлайн
    if(cloudOnline()){ clearTimeout(cloud.pullRetryT); cloud.pullRetryT=setTimeout(()=>{ if(cloud.ready && cloud.session && !cloud.busy && activeCloudId()===cid) cloudPull(cid).catch(()=>{}); }, 8000); }  // handle хранится → отменяется при выходе; не тянем после logout/смены профиля
  }

    cloud.applying=false;

    if(localStorage.getItem(cloudDirtyKey(cid))) cloudMaybePush();
    else cloudDrainRemoteMissed();
    render();
  }
}
function cloudMaybePush(){
  if(!cloud.ready) return;
  if(cloud._pullSaving) return;   // saveState из cloudPull — dirty только через _reconChanged
  const cid = activeCloudId(); if(!cid) return;
  // РОЛИ ТОЛЬКО ДЛЯ ПРОСМОТРА (бухгалтер / снят со смены): пушить нечего и НЕЛЬЗЯ по RLS.
  // НЕ ставим dirty — иначе saveState() после pull пометил бы базу «грязной», push вышел бы
  // без снятия флага, и следующий cloudPull молча пропускал бы обновления (view-only «залипал»).
  if(typeof canEditStock==="function" && !canEditStock()) return;
  // помечаем «не синхронизировано» СРАЗУ — флаг снимется только после успешной выгрузки.
  // Так переключение базы/перезагрузка не теряет отложенные правки: при возврате
  // cloudActivate увидит dirty и выгрузит локальное, а не затрёт его pull-ом.
  // ВАЖНО: dirty ставим ДО проверки cloud.applying — если прямо сейчас идёт cloudPull,
  // правка пользователя в это окно иначе осталась бы непомеченной и была бы затёрта.
  markDirty(cid);
  if(cloud.applying) return;   // идёт pull — он сам увидит dirty, НЕ затрёт правку и до-выгрузит её
  if(!cloudOnline()){ setSyncStatus("offline"); return; }   // ждём сеть — уйдёт по событию "online"
  cloud.pushPending = true;                  // есть ожидающая выгрузка — realtime-pull её не затрёт
  setSyncStatus("syncing","Сохранение в облако…");
  clearTimeout(cloud.pushTimer);
  cloud.pushTimer = setTimeout(()=>cloudPushNow(), 600);
}
// --- ДЕЛЬТА-СИНХРОНИЗАЦИЯ: шлём только изменённые/удалённые строки, прямым fetch ---
// стабильная подпись строки (порядок ключей не важен) — для сравнения «изменилось ли»
function _stableStr(o){
  if(Array.isArray(o)) return "["+o.map(_stableStr).join(",")+"]";
  if(o && typeof o==="object") return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+_stableStr(o[k])).join(",")+"}";
  return JSON.stringify(o);
}
function _sigOf(obj){ const s=_stableStr(obj); let h1=0x811c9dc5, h2=0; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=(h1^c)>>>0; h1=Math.imul(h1,0x01000193)>>>0; h2=(h2*131+c)|0; } return h1.toString(36)+h2.toString(36)+":"+s.length; }
function loadSyncSig(cid, kind){ try{ return JSON.parse(localStorage.getItem(`${NS}vahtahoz_sig_${kind}_${cid}`)||"{}"); }catch(_){ return {}; } }
/* Снимок подписей — best-effort, но сбой записи больше не немой. Без снимка следующий push
   считает изменённым ВЕСЬ склад: на базе в три тысячи позиций каждая правка одной строки гонит
   полную выгрузку — десятки секунд и мобильный трафик на вахтовом интернете. Причина при этом
   («на телефоне кончилось место») была не видна ни в интерфейсе, ни в консоли. */
function saveSyncSig(cid, kind, map){
  if(kind==="jr") _jrSigCache=null;
  try{ localStorage.setItem(`${NS}vahtahoz_sig_${kind}_${cid}`, JSON.stringify(map)); }
  catch(e){
    console.warn("saveSyncSig: снимок подписей не сохранён ("+kind+")", e);
    if(isQuotaErr(e)) _quotaBlock();
  }
}
/* Allowed-снимок читает РОВНО одна роль — ограниченная по типам (Механик/Повар): только она
   рискует снести из облака чужие типы, и только у неё эти снимки участвуют в решении (см.
   prevAllowed/prevJrAllowed в cloudPushNow). У всех остальных он побайтово повторял основной
   снимок — и это была не мелочь: замер на базе вахтового размера (278 позиций, 3500 записей
   журнала) дал jr 403 КБ и ровно столько же jrAllowed, то есть около 450 КБ на базу впустую.
   При двух базах на телефоне это почти пятая часть всей памяти, которую браузер даёт сайту (5 МБ),
   и ровно она доводила до «Данные не сохранены». Полному доступу снимок не пишем, старый удаляем.
   СОВМЕСТИМОСТЬ. Ключ и формат не меняются. Отсутствие ключа — состояние, которое код умел и
   раньше (haveAllowed=false): так выглядит база, ни разу не выгружавшаяся ограниченной ролью,
   поэтому старая сборка из кэша ведёт себя ровно как всегда.
   ЦЕНА, ЧЕСТНО. Если роль СТАНЕТ ограниченной, первый push после этого удалит из облака только
   то, что сам успел записать в allowed-снимок; остальные удаления уедут следующим циклом — id
   остаются в prevSig, надгробия в state.delJr. Сдвиг на один цикл, а не потеря. */
function saveAllowedSig(cid, kind, map, restricted){
  if(restricted){ saveSyncSig(cid, kind, map); return; }
  try{ localStorage.removeItem(`${NS}vahtahoz_sig_${kind}_${cid}`); }catch(_){}
}
// счётчики позиций склада ПО ТИПАМ — чтобы suspectWipe работал и для ограниченных ролей (Механик/Повар):
// сравниваем с ожиданием ПО ДОСТУПНЫМ типам (per-type корректно даже если снимок от прежней, более широкой роли).
function stockTypeCounts(){ const c={}; for(const k of STOCK_TYPE_KEYS) c[k]=0; for(const s of (state.stock||[])){ if(c[s.type]!=null) c[s.type]++; } return c; }

function stockValsSnap(){ const v={}; for(const s of (state.stock||[])) v[s.id]=Number(s.qty)||0; return v; }

// state.stock так, чтобы конкурентные списания с двух устройств складывались (merged = local + cloud − снимок).
// Только позиции БЕЗ партий; партийные при расхождении не трогаем (qty=Σпартий) — предупреждаем о ручной сверке.
/* Санитайз облачных партий РОВНО ОДИН раз на строку и одно значение в оба назначения.
   safeId()/createdAt при мусорных данных генерируют НОВОЕ на каждый вызов, поэтому два отдельных
   вызова давали РАЗНЫЕ id партий в выгружаемой строке (r) и в state.stock (it): подпись curSig
   не совпадала с тем, что построит следующий push (лишний цикл выгрузки), а op.batchId в журнале
   ссылался на исчезнувший id. Кэшируем результат по объекту облачной строки. */
const _cloudBatchesCache = new WeakMap();
function cloudBatchesOnce(cr){
  if(!cr || !Array.isArray(cr.batches)) return null;
  if(!_cloudBatchesCache.has(cr)) _cloudBatchesCache.set(cr, sanitizeBatches(cr.batches));
  return _cloudBatchesCache.get(cr);
}
/* Держим инвариант «qty = сумма партий»: если санитайз что-то отбросил (нечисловой/нулевой qty,
   не-объект), то cloudQty перестаёт равняться сумме, и в облако уехала бы самопротиворечивая строка. */
function qtyFromCloudBatches(cleaned, cloudQty){
  if(!cleaned || !cleaned.length) return cloudQty;
  return roundQty(cleaned.reduce((a,b)=>a+roundQty(b.qty||0), 0));
}
/* ПОСЛЕ ПОДМЕНЫ ПАРТИЙ/КОЛИЧЕСТВА ОБЛАЧНЫМИ — ПЕРЕСЧЁТ АГРЕГАТОВ КАРТОЧКИ.
   qty/срок/место позиции С ПАРТИЯМИ — производные (см. модель партий). Слияние перед выгрузкой
   писало it.qty и it.batches, а expiry/location оставляло прежними: карточка жила со сроком и местом
   ИСЧЕЗНУВШЕЙ партии. А когда у облачной строки колонки batches нет вовсе (cr.batches === null,
   строка старого клиента), количество бралось облачное и переставало равняться сумме локальных
   партий. Обе поломки видны глазами: карточка склада считается агрегаторами и показывает
   «4 кг, до 02.08», а форма правки ТОЙ ЖЕ позиции — «6, до 04.08». И это не косметика:
   рассогласованные значения уезжали в облако вместе с upsert-строкой (stockToRow берёт их как есть).
   Восстанавливаем инвариант «qty/срок/место = функция от партий» и приводим upsert-строку к тому же
   виду. Если партий не осталось совсем (облако прислало пустой список) — срок и место были
   производными от них и уходят вместе с ними. Звать ДО _sigOf(r), иначе подпись разойдётся с тем,
   что реально уедет в облако. */
function applyCloudBatchAggregates(r, it, cleaned){
  if(it && hasBatches(it)) syncItemFromBatches(it);
  else if(it && Array.isArray(cleaned) && !cleaned.length && (it.expiry || it.location)){
    it.expiry=""; it.location=""; it.updatedAt=new Date().toISOString();

  if(!r) return;
  if(it){
    r.qty = roundQty(it.qty||0); r.expiry = it.expiry||""; r.location = it.location||"";
    r.batches = Array.isArray(it.batches) ? it.batches : [];
  } else if(Array.isArray(cleaned) && cleaned.length){
    r.expiry = nearestExpiryOf({ batches: cleaned }) || "";
    const locs = locationsOf({ batches: cleaned });
    r.location = locs.length===1 ? locs[0] : "";   // несколько мест → карточное поле пустое (как в syncItemFromBatches)
    r.qty = qtyFromCloudBatches(cleaned, r.qty);
  }
}
/* Тянем облачные остатки по списку id. Чанкуем id=in.(...) — иначе длинный URL режется
   прокси/PostgREST. Один и тот же запрос нужен и основному 3-way слиянию, и его fail-closed
   повтору в catch: держим в одном месте, чтобы размер чанка и набор полей не разъехались. */
async function fetchCloudStockByIds(cid, tok, ids){
  const cloudById={};
  const size=100;
  for(let i=0;i<ids.length;i+=size){
    const chunk = ids.slice(i,i+size);
    const cloudRows = await cloudRest(`stock_items?select=id,qty,batches&base_id=eq.${encodeURIComponent(cid)}&id=in.(${chunk.map(encodeURIComponent).join(",")})`, tok);
    if(Array.isArray(cloudRows)) cloudRows.forEach(cr=>cloudById[cr.id]=cr);
  }
  return cloudById;
}
async function mergeStockQtyBeforePush(cid, tok, upsert, curSig){

    }

    if(conflictBatched){ try{ toast(`Расхождение остатков по ${conflictBatched} позиц. с партиями — проверьте вручную и при необходимости сверьте экспортом`); }catch(_){} }
  }catch(e){

      let localChanged=false;

        if(it){

  }
}
// ОБЪЕДИНЕНИЕ настроек (места/категории) с облаком — union списков по каждому типу.
// Так одновременная выгрузка двух устройств НЕ затирает чужие добавления (последний-победил
// заменился бы на сложение). Удаление РАСПРОСТРАНЯЕТСЯ через надгробия (deletedLocations/Categories):
// union имён минус актуальные надгробия. Повторное добавление имени снимает надгробие (revive).
function mergeSettings(cloudSet, localSet){
  const out={ locations:{}, categories:{}, deletedLocations:{}, deletedCategories:{} };
  const u = unionClean;
  for(const k of STOCK_TYPE_KEYS){
    const lLoc=(localSet.locations&&localSet.locations[k])||[], lCat=(localSet.categories&&localSet.categories[k])||[];
    // надгробия объединяем, НО имя, присутствующее в локальном списке (т.е. заново добавленное),
    // из надгробий исключаем — иначе повторное добавление удалённого имени не приживалось бы.
    const tL=u(cloudSet.deletedLocations&&cloudSet.deletedLocations[k], localSet.deletedLocations&&localSet.deletedLocations[k]).filter(n=>!lLoc.includes(n));
    const tC=u(cloudSet.deletedCategories&&cloudSet.deletedCategories[k], localSet.deletedCategories&&localSet.deletedCategories[k]).filter(n=>!lCat.includes(n));
    out.deletedLocations[k]=tL; out.deletedCategories[k]=tC;
    // из union'а имён вычитаем актуальные надгробия → удаление распространяется, имя не воскресает
    out.locations[k]=applyTomb(u(cloudSet.locations&&cloudSet.locations[k], lLoc), tL);
    out.categories[k]=applyTomb(u(cloudSet.categories&&cloudSet.categories[k], lCat), tC);
  }
  return out;
}
// upsert пачками прямым fetch (merge по первичному ключу id)
async function cloudRestUpsert(table, rows, tok, onProgress){
  const size=100;
  for(let i=0;i<rows.length;i+=size){
    await cloudRest(table, tok, { method:"POST", returnResponse:true, timeout:60000,
      headers:{ "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows.slice(i,i+size)) });
    if(onProgress) onProgress(Math.min(i+size,rows.length), rows.length);
  }
}
// удаление пачками прямым fetch (id=in.(...))
async function cloudRestDelete(table, ids, tok){
  const size=100;
  for(let i=0;i<ids.length;i+=size){
    const inList = ids.slice(i,i+size).map(id=>encodeURIComponent(id)).join(",");
    await cloudRest(`${table}?id=in.(${inList})`, tok, { method:"DELETE", returnResponse:true, timeout:45000, headers:{ "Prefer":"return=minimal" } });
  }
}
/* Пометка «не синхронизировано» + СЧЁТЧИК ПОКОЛЕНИЯ правок.
   Поколение нужно push-у: он делает снимок rows в начале, а дальше десятки await
   (delete/merge/upsert чанками — на 3000 позиций это десятки секунд). Правка, сделанная
   пользователем в это окно, в снимок не попадает, но раньше push всё равно БЕЗУСЛОВНО снимал
   dirty в конце → если следующий push падал по сети, retry не запускался (он смотрит на dirty),
   а очередной pull затирал правку облачными данными. Молча, без сообщения.
   Теперь dirty снимается только если поколение не изменилось. */
let _dirtyGen = 0;
function markDirty(cid){
  if(!cid) return;
  try{ localStorage.setItem(cloudDirtyKey(cid),"1"); }
  catch(e){
    // Маркер несинхронизации не менее важен, чем сами данные: без него после перезагрузки
    // cloudActivate уйдёт в cloudPull и затрёт правки облачными молча. В пределах сессии
    // спасает pushPending (его снимает finally самого push — залипнуть не может).
    try{ cloud.pushPending = true; }catch(_){}
    _quotaBlock();
  }
  // Поколение считаем ТОЛЬКО для правок пользователя. Внутри самой выгрузки push оборачивает свои
  // saveState() (мердж настроек, 3-way) в cloud.applying=true, а saveState зовёт cloudMaybePush →
  // markDirty. Учитывать это как «данные изменились» означало бы никогда не снимать dirty и гонять
  // полный push каждые 600 мс — при двух активных устройствах это самоподдерживающийся цикл.
  // Условие узкое (_pushing И applying), поэтому обычная правка во время push всё равно учитывается.
  if(!(cloud._pushing && cloud.applying)) _dirtyGen++;
}

      const curSig = {}; rows.forEach(r=>{ curSig[r.id]=_sigOf(r); });
