async function cloudLogin(email, password){
  const sb = await ensureSB();
  // Токен получаем ПРЯМЫМ запросом (быстро, как обычный fetch) — это обходит зависания
  // auth-клиента Supabase на navigator.locks в Safari/standalone-PWA, из-за которых
  // штатный signInWithPassword мог висеть. Таймаут запроса — 35с (бэкенд на free-тарифе
  // может «холодно стартовать» ~20-30с после простоя; короткий таймаут рвал первый вход).
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 35000);
  // логин можно вводить без домена: «worker» → worker + LOGIN_DOMAIN
  const raw = (email||"").trim();
  const hasAt = raw.includes("@");
  const primary = hasAt ? raw : raw + LOGIN_DOMAIN;
  async function _attempt(em){
    const r = await fetch(`${CLOUD_CFG.url}/auth/v1/token?grant_type=password`, {
      method:"POST", signal:ctrl.signal,
      headers:{ "apikey":CLOUD_CFG.anon, "Content-Type":"application/json" },
      body: JSON.stringify({ email:em, password })
    });
    const dd = await r.json().catch(()=>({}));
    return { ok: !!(r.ok && dd.access_token), d: dd };
  }
  let d;
  try{
    let res = await _attempt(primary);
    // толерантность к домену на время миграции @bazahoz.app→@razvedchick.ru: если логин без @ не прошёл
    // на новом домене — пробуем старый (аккаунт мог быть ещё не мигрирован). Порядок миграции не важен.
    if(!res.ok && !hasAt && LEGACY_LOGIN_DOMAIN!==LOGIN_DOMAIN){
      const alt = await _attempt(raw + LEGACY_LOGIN_DOMAIN);
      if(alt.ok) res = alt;
    }
    if(!res.ok) throw new Error("Неверный логин или пароль");
    d = res.d;
  }catch(e){
    if(e.name==="AbortError") throw new Error("превышено время ожидания сети");
    throw e;
  }finally{ clearTimeout(t); }
  // Токен уже получен — вход СЧИТАЕТСЯ успешным здесь. Дальше идут операции через
  // auth-клиент Supabase (setSession) и PostgREST (sb.from в cloudOnLogin), которые в
  // Safari/standalone-PWA могут подвисать. Их НЕЛЬЗЯ ждать блокирующе, иначе кнопка
  // «Вход…» висит до общего 55-секундного таймаута. Поэтому каждую — со своим таймаутом.
  cloud.session = { access_token:d.access_token, refresh_token:d.refresh_token, user:d.user };
  saveCloudSess(d);   // СИНХРОННО: переживёт reload от cloudAutoLink (один вход, не повторный)
  // Общий вахтовый телефон: если облачными базами на этом устройстве владел ДРУГОЙ человек (предыдущий не вышел
  // кнопкой, его сессия истекла → показался гейт, входит новый) — вычищаем чужие облачные профили/склады ДО загрузки,
  // иначе новый увидит/экспортирует чужой склад из localStorage (до RLS). Тот же uid (сам переистёк, вошёл собой) —
  // НЕ трогаем (офлайн-правки целы). Сессия уже сохранена → reload даёт cloudInit восстановить НОВОГО начисто.
  try{
    const prevOwner = localStorage.getItem(NS+"vahtahoz_cloud_owner");
    localStorage.setItem(NS+"vahtahoz_cloud_owner", d.user.id);
    if(prevOwner && prevOwner !== d.user.id && profiles.list.some(p=>p.cloudId)){ purgeCloudProfiles(); location.reload(); return; }
  }catch(_){}
  // setSession (для прав и realtime) — в фоне, не держим кнопку (промис нигде не ждём)
  Promise.race([
    sb.auth.setSession({ access_token:d.access_token, refresh_token:d.refresh_token }).catch(e=>console.warn("setSession", e)),   // свой catch: поздний реджект не станет unhandled
    new Promise(res=>setTimeout(res,4000))
  ]).catch(()=>{});
  // загрузку профиля/баз ждём, но не дольше 8с — после этого вход всё равно завершается,
  // а cloudOnLogin при необходимости дозагрузит данные в фоне
  await Promise.race([
    cloudOnLogin({ access_token:d.access_token, refresh_token:d.refresh_token, user:d.user }),
    new Promise(res=>setTimeout(res,8000))
  ]);
}
async function cloudOnLogin(session, attempt){
  attempt = attempt||0;
  // SINGLE-FLIGHT загрузки баз: новый цикл (attempt=0 — из online-события, ↻ или повторного входа)
  // НЕ плодит параллельные ретраи поверх уже идущего. Иначе на нестабильной сети online-события
  // множили бы перекрывающиеся цепочки (каждая со сбросом attempt=0) → шторм запросов.
  if(attempt===0){
    if(cloud._basesLoading) return;
    clearTimeout(cloud._basesRetryT);
    cloud._basesLoading = true;
  }
  let uidv;
  try{
    cloud.session = session;
    await ensureSB();                  // клиент нужен для setSession/realtime; запросы ниже — прямым fetch
    uidv = session.user.id;            // ВНУТРИ try: сбой ensureSB/нет user.id уйдёт в catch → ретрай, а не вечный _basesLoading
    // Фиксируем владельца облачных баз, если ещё не записан (напр. восстановление сессии после обновления, где ключа
    // не было): тогда последующий вход ДРУГИМ uid через cloudLogin увидит смену владельца и вычистит чужой склад.
    try{ if(!localStorage.getItem(NS+"vahtahoz_cloud_owner")) localStorage.setItem(NS+"vahtahoz_cloud_owner", uidv); }catch(_){}
    // 3 независимых запроса — ПАРАЛЛЕЛЬНО (последовательно было бы ~3× дольше на медленной сети).
    // Общий таймаут 25с: зависший PostgREST-запрос не должен оставлять загрузку висеть вечно.
    const tok = session.access_token;
    const [prof, mem, bs, orgs] = await Promise.race([
      Promise.all([
        cloudRest(`profiles?select=id,username,display_name,is_admin&id=eq.${encodeURIComponent(uidv)}`, tok),   // явные колонки: SELECT на recovery_* отозван, select=* упал бы с 403
        cloudRest(`base_members?select=*&user_id=eq.${encodeURIComponent(uidv)}`, tok),   // ТОЛЬКО мои членства: RLS теперь даёт менеджеру видеть и чужие строки, но cloud.members = «мои права»
        cloudRest(`bases?select=id,name,party_id`, tok),
        cloudRest(`org_roles?select=*&user_id=eq.${encodeURIComponent(uidv)}`, tok).catch(()=>[]),   // территориальные/глобальные роли (может отсутствовать на старом бэке → [] )
      ]),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("превышено время ожидания облака")),25000))   // запас под слабый канал/дальний маршрут
    ]);
    cloud.profile = (Array.isArray(prof) && prof[0]) || { id:uidv, username:session.user.email };
    cloud.members = Array.isArray(mem) ? mem : [];
    cloud.orgRoles = Array.isArray(orgs) ? orgs : [];
    cloud.bases = {}; cloud._baseParty = {}; (Array.isArray(bs)?bs:[]).forEach(b=>{ cloud.bases[b.id]=b.name; cloud._baseParty[b.id]=b.party_id||null; });
    cloud.ready = true; cloud.basesLoaded = true;   // базы реально получены из облака
    cloud._basesLoading = false; clearTimeout(cloud._basesRetryT);   // цикл загрузки баз завершён успехом
    hideLoginGate();                           // успешный вход — прячем полноэкранный гейт
    const reloaded = await cloudAutoLink();
    if(reloaded) return;                       // switchProfile перезагрузит страницу
    renderHeader(); render();
    toast(`Вы вошли: ${cloud.profile.username||session.user.email}`);
    // Тяжёлую синхронизацию (выгрузка/подтягивание сотен позиций) запускаем В ФОНЕ,
    // НЕ блокируя вход — иначе кнопка «Вход…» висит до конца первой выгрузки.
    const cid = activeCloudId();
    if(cid){ setTimeout(()=>{ cloudActivate(cid).catch(e=>console.warn("bg sync",e)); }, 50); }
    // задачи синкаем отдельно (scope по владельцу, не по базе) — в фоне, не блокируя вход
    setTimeout(()=>{ cloudSyncTasks().catch(e=>console.warn("tasks sync",e)); cloudSubscribeTasks(); }, 80);
  }catch(e){
    console.warn("cloudOnLogin", e);
    // Если ПОКА мы грузились cloudSessionExpired разлогинил (permanent-отказ токена) — cloud.session
    // занулён. НЕ воскрешаем мёртвую сессию ретраем, НЕ прячем показанный гейт, НЕ ставим ready.
    if(!cloud.session){ cloud._basesLoading=false; clearTimeout(cloud._basesRetryT); return; }
    uidv = uidv || (session.user && session.user.id) || "";   // фолбэк, если упали до присвоения uidv
    // Токен валиден → пользователь АУТЕНТИФИЦИРОВАН, даже если профиль/базы не загрузились
    // (медленная сеть / зависший запрос в standalone-PWA). НЕ показываем «Войти» — помечаем вход
    // состоявшимся с фолбэком и догружаем данные ретраем (3с/5с/7с… до 20с).
    const uemail = (session.user && session.user.email) || "";   // guard: не бросаем повторно в catch, если session.user пуст
    if(!cloud.profile) cloud.profile = { id:uidv, username:uemail.split("@")[0] };
    cloud.ready = true; cloud.basesLoaded = false;   // базы НЕ загрузились
    hideLoginGate();
    renderHeader(); render();
    if(attempt===0) toast("Вход выполнен, загружаем базы…");
    // НАСТОЙЧИВО грузим базы — НЕ оставляем пользователя с «ничего». Пока онлайн — ретраим с backoff,
    // но НЕ бесконечно: после 8 попыток показываем понятный статус с ручным повтором (тап по ↻).
    if(cloudOnline() && attempt < 8){
      setSyncStatus("syncing","Загрузка баз из облака… (попытка "+(attempt+1)+" из 8)");
      const delay = Math.min(3000 + attempt*2000, 20000);   // 3,5,7,… до 20с
      // handle сохраняем → single-flight: новый цикл/online/↻ погасит этот хвост (флаг остаётся — цикл продолжается)
      clearTimeout(cloud._basesRetryT);
      cloud._basesRetryT = setTimeout(()=>{ cloudOnLogin(session, attempt+1).catch(()=>{}); }, delay);
    } else if(cloudOnline()){
      cloud._basesLoading = false;   // 8 попыток исчерпано — цикл закончен, ждём ручной повтор (↻) или online
      setSyncStatus("error","Базы не загрузились. Нажмите ↻ вверху, чтобы повторить");
    } else {
      cloud._basesLoading = false;   // оффлайн — цикл закончен, перезапустится по событию online
      setSyncStatus("offline","Нет сети — базы загрузятся при подключении");
    }
  }
}
// Удаляет с устройства ЛОКАЛЬНЫЕ профили/слоты/подписи ОБЛАЧНЫХ баз (их данные привязаны к аккаунту).
// Нужна и при выходе, и при входе ДРУГИМ человеком на общем вахтовом телефоне: иначе рендер/экспорт идёт
// из STORE_KEY/слотов ДО RLS → новый увидел бы чужой склад. Тот же uid НЕ трогаем (не теряем офлайн-правки).
function purgeCloudProfiles(){
  try{
    const cloudProfs = profiles.list.filter(p=>p.cloudId);
    if(!cloudProfs.length) return;
    const activeWasCloud = cloudProfs.some(p=>p.id===profiles.activeId);
    cloudProfs.forEach(p=>{ try{ localStorage.removeItem(slotKey(p.id)); clearBaseSyncKeys(p.cloudId); }catch(_){} });
    let locals = profiles.list.filter(p=>!p.cloudId);
    if(!locals.length){ locals = [{ id: uid(), name: "База 1" }]; }
    const newActive = activeWasCloud ? locals[0].id : profiles.activeId;
    if(activeWasCloud){ const raw = localStorage.getItem(slotKey(newActive)); localStorage.setItem(STORE_KEY, raw || JSON.stringify(freshProfileState())); }
    profiles = { activeId: newActive, list: locals };
    saveProfiles(profiles);
  }catch(_){}
}
async function cloudLogout(){
  try{ if(cloud.channel) await cloud.sb.removeChannel(cloud.channel); }catch(e){}
  try{ if(cloud.tasksChannel) await cloud.sb.removeChannel(cloud.tasksChannel); }catch(e){}   // снимаем и канал задач
  try{ if(cloud.sb) await cloud.sb.auth.signOut({ scope:"local" }); }catch(e){}   // ТОЛЬКО это устройство: без scope — глобальный logout, разлогинил бы и другие устройства юзера
  clearTimeout(cloud.tasksTimer); clearTimeout(cloud.tasksRetry); clearTimeout(cloud.tasksPullTimer);
  clearTimeout(cloud.pushTimer); clearTimeout(cloud.retryTimer); clearTimeout(cloud.pullTimer); clearTimeout(cloud.pullRetryT);   // отложенные склад-операции не должны срабатывать после выхода
  // задачи привязаны к аккаунту (owner) — при выходе НЕ оставляем их локально, иначе следующий юзер их увидит/выгрузит
  state.tasks=[]; try{ localStorage.removeItem(TASKS_KEY); localStorage.removeItem(TASKS_DIRTY); }catch(e){}
  cloud.session=null; cloud.profile=null; cloud.members=[]; cloud.orgRoles=[]; cloud.channel=null; cloud.subscribedBase=null; cloud.ready=false;
  cloud.tasksChannel=null; cloud.tasksSubUid=null; cloud.tasksBusy=false; cloud.basesLoaded=false;   // сброс задач: иначе после входа другим юзером realtime молчит
  cloud._conflictAsked={};   // сброс «спрашивали ли про конфликт данных» — для следующего входа на этом устройстве
  clearAllBasesCache();   // снимок остатков всех баз не должен пережить выход (утечка на общем устройстве)
  // ОБЛАЧНЫЕ БАЗЫ привязаны к аккаунту: при выходе удаляем их локальные профили и КЭШ СКЛАДА с устройства —
  // иначе следующий вошедший (другой человек на общем телефоне) увидит/откроет чужую базу и её данные из
  // localStorage (рендер идёт из STORE_KEY/слотов, до RLS). Симметрично очистке задач выше.
  purgeCloudProfiles();
  clearCloudSess();   // чистим своё хранилище сессии, иначе при запуске восстановит вход
  // снимаем флаг «без облака» — при следующем запуске снова покажется вход (нет сессии → гейт)
  // перезагрузка: гарантирует чистое состояние из STORE_KEY (как switchProfile) и показ логин-гейта без остатков
  location.reload();
}
/* привязываем облачные базы к локальным (по имени) или создаём новые; для одной базы — переключаемся */
async function cloudAutoLink(){
  // видимые базы = cloud.bases (уже отфильтрован RLS ровно под роль: участник → своя база; нач.партии → базы
  // своего региона; директор/бухгалтерия/владелец → все). Берём ИХ, а не cloud.members — иначе органичные роли
  // (нач.партии/директор/бухгалтерия, у которых НЕТ base_members) не получали бы базы вовсе, а участник одной
  // базы не получит чужие (их нет в его cloud.bases).
  let myBases = Object.keys(cloud.bases||{});
  cloud.members.forEach(m=>{ if(m.base_id && !myBases.includes(m.base_id)) myBases.push(m.base_id); });   // подстраховка
  myBases.sort((a,b)=>String(cloud.bases[a]||"").localeCompare(String(cloud.bases[b]||""),"ru"));   // стабильный порядок → предсказуемая база по умолчанию (напр. у нач.партии с 2 базами)
  let changed=false, switchTo=null;
  for(const cid of myBases){
    if(profiles.list.some(x=>x.cloudId===cid)) continue;
    const name = cloud.bases[cid] || "Облачная база";
    // привязываем по имени ТОЛЬКО если имя облачной базы уникально. Иначе (две облачные базы с одним именем)
    // нельзя угадать, к какой привязать локальную → не привязываем молча (создадим новую), чтобы выбор
    // «оставить мои» в диалоге конфликта не залил локальное ПОВЕРХ чужой одноимённой базы.
    const nameUnique = Object.values(cloud.bases).filter(n=>n===name).length<=1;
    const exist = nameUnique ? profiles.list.find(x=>!x.cloudId && x.name===name) : null;
    if(exist){
      exist.cloudId=cid; changed=true;
      // НЕ помечаем dirty при авто-привязке: ОБЛАКО — источник истины.
      // Раньше свежезасеянная локальная база метилась «к выгрузке» и при активации
      // ПУШИЛА сид ПОВЕРХ облака (потеря данных после чистки кэша). Теперь:
      //  • облако непусто → cloudActivate сделает PULL (облако победит сид);
      //  • облако пусто → cloudActivate сам выгрузит локальное (cloudEmpty && localHasData);
      //  • реальные офлайн-правки помечаются dirty обычным путём (cloudMaybePush) — не теряются.
    }
    else {
      const id=uid();
      try{ localStorage.setItem(slotKey(id), JSON.stringify(freshProfileState())); }catch(e){}
      profiles.list.push({ id, name, cloudId:cid }); changed=true;
      if(!switchTo) switchTo=id;
    }
  }
  if(changed) saveProfiles(profiles);
  if(switchTo && !activeCloudId()){ switchProfile(switchTo, true); return true; }   // true = автопривязка, в обход роль-гарда
  // ДЕАДЛОК ограниченной роли: активная — локальная «База 1» (создаётся по умолчанию), а привязанная к членству
  // база уже есть в списке (создана прошлым входом) → switchTo пуст, переключения не было, а UI смены базы у
  // ограниченных ролей скрыт → работник навсегда видит «База 1». У не-владельца активной должна быть ЕГО
  // облачная база — переключаемся сами.
  if(!activeCloudId() && !(cloud.profile && cloud.profile.is_admin)){
    const linked = profiles.list.find(x=>x.cloudId && myBases.includes(x.cloudId));
    if(linked && profiles.activeId!==linked.id){ switchProfile(linked.id, true); return true; }
  }
  return false;
}
// ДОТЯГИВАЕМ привязку: если вход прошёл, но cloudAutoLink не отработал (упала загрузка баз на слабой сети),
// локальные базы остаются cloudId=None и список оседает мимо облака. Здесь — при ручном ↻ / возврате сети —
// привязываем локальную базу к облачной с ТЕМ ЖЕ именем (cloudAutoLink идемпотентен и при совпадении имени только
// проставит cloudId, без создания дубля и reload). Это рычаг восстановления для застрявших на cloudId=None.
async function cloudRelinkIfNeeded(){
  if(!cloud.basesLoaded || !cloud.ready) return false;
  const cloudNames = Object.values(cloud.bases||{});
  // дотягиваем привязку только при ОДНОЗНАЧНОМ совпадении имени (имя облачной базы встречается ровно раз) —
  // иначе можно привязать не к той одноимённой базе.
  const hasUnlinkedMatch = profiles.list.some(x=>!x.cloudId && cloudNames.filter(n=>n===x.name).length===1);
  if(hasUnlinkedMatch){ await cloudAutoLink(); return true; }
  return false;
}
/* активация облачной базы: первичная выгрузка / подтягивание / разрешение оффлайн-правок */
async function cloudActivate(cid, attempt){
  attempt = attempt||0;
  if(!cid || !cloud.ready) return;
  if(!cloudOnline()){ setSyncStatus("offline"); return; }
  if(isOffShift(cid)){   // нет доступа по RLS → не пушим/пуллим (без «REST 403»)
    // вахта: если есть НЕсинхронизированные правки (копил офлайн, а на сервере сняли со смены) — явно предупреждаем
    // о риске потери и советуем экспорт, а не молчим. RLS всё равно не примет его записи (403).
    const hasDirty = !!localStorage.getItem(cloudDirtyKey(cid));
    setSyncStatus("error", hasDirty
      ? "Вы сняты со смены. Несохранённые операции НЕ уйдут в общую базу — сделайте экспорт (⚙️ → Экспорт данных) и передайте начальнику"
      : "Вы сейчас не на смене на этой базе — изменения в общую базу не уйдут");
    return;
  }
  if(cloud.busy) return;          // уже идёт синхронизация/диалог конфликта — второй заход НЕ запускаем
  cloud.busy=true;                // ставим ДО await: иначе pull во время открытого диалога конфликта затёр бы локальное
  try{
    await ensureSB(); const perm = activeMember();   // ВНУТРИ try: сбой ensureSB не должен оставить cloud.busy=true навсегда (иначе весь синк залипает до перезапуска)
    setSyncStatus("syncing","Проверка облака…");
    const dirty = localStorage.getItem(cloudDirtyKey(cid));
    // count через прямой fetch (не sb.from — он висел в standalone). cloudRest кинет исключение при ошибке.
    const tok = cloud.session && cloud.session.access_token;
    const cIds = await cloudRest(`stock_items?select=id&base_id=eq.${encodeURIComponent(cid)}&limit=1`, tok, {timeout:45000});   // нужно лишь «пусто ли облако» → 1 строка (а не сотни), на слабом интернете не рвётся
    const cloudEmpty = !(Array.isArray(cIds) && cIds.length);
    // решение «выгружать» — по складу/журналам (задачи не синкаются и тут не учитываются)
    const localHasData = (state.stock&&state.stock.length) ||
      JOURNAL_KEYS.some(k=>(state.journals?.[k]||[]).length);
    // КОНФЛИКТ «Войти позже → Войти»: в локальной базе есть данные И в облаке есть данные,
    // и база ещё ни разу не синхронизировалась (нет снимка). Раньше тихо делали PULL —
    // локальная офлайн-работа терялась. Теперь спрашиваем, без молчаливой потери.
    const neverSynced = !Object.keys(loadSyncSig(cid,"stock")).length && !Object.keys(loadSyncSig(cid,"jr")).length;
    cloud._conflictAsked = cloud._conflictAsked || {};
    // view-only участник (нет прав на правку) с локальными офлайн-данными на ещё не привязанной базе:
    // диалог ему не показываем (правки всё равно не выгружаются), но НЕ теряем данные молча — сохраняем копией перед pull.
    if(!dirty && !cloudEmpty && localHasData && neverSynced && (!perm || !perm.can_edit_stock) && !cloud._conflictAsked[cid]){
      cloud._conflictAsked[cid] = true;
      try{
        const raw = localStorage.getItem(STORE_KEY);
        if(raw){ const bkId=uid(); localStorage.setItem(slotKey(bkId), raw); profiles.list.push({ id:bkId, name: cleanName40((cloud.bases[cid]||"База")+" (локальная копия)") }); saveProfiles(profiles); toast("Данные с телефона сохранены копией"); }
      }catch(_){}
      // дальше — обычный pull ниже (для view-only облако источник истины)
    }
    if(!dirty && !cloudEmpty && localHasData && neverSynced && perm && perm.can_edit_stock && !cloud._conflictAsked[cid]){
      cloud._conflictAsked[cid] = true;
      const choice = await chooseSheet(
        `В базе «${cloud.bases[cid]||"облачная"}» есть данные и на этом телефоне, и в общей базе бригады. Какие оставить главными?`,
        [ { label:"Оставить общую базу бригады (данные с телефона сохраним копией)", value:"cloud", color:"btn-primary" },
          { label:"Отправить данные с телефона (станут общими для бригады)", value:"local", color:"btn-ghost" } ]);
      if(choice==="local"){
        saveStockSig(cid,{}); saveSyncSig(cid,"jr",{});   // локальное — источник: полная выгрузка поверх облака
        try{ localStorage.setItem(cloudDirtyKey(cid),"1"); }catch(_){}   // dirty ДО push: при сбое выгрузки pull не затрёт выбранное юзером локальное (как в ветке ниже)
        await cloudPushNow();
        return;
      }
      // "Облачные" ИЛИ отмена → НЕ теряем локальное: сохраняем его отдельной локальной базой, затем тянем облако
      try{
        const raw = localStorage.getItem(STORE_KEY);
        if(raw){
          const bkId = uid();
          localStorage.setItem(slotKey(bkId), raw);
          profiles.list.push({ id:bkId, name: cleanName40((cloud.bases[cid]||"База")+" (локальная копия)") });
          saveProfiles(profiles);
          toast("Данные с телефона сохранены копией");
        }
      }catch(_){}
      await cloudPull(cid);
      return;
    }
    if((dirty || (cloudEmpty && localHasData)) && perm && perm.can_edit_stock){
      // локальное — источник (первый раз или были оффлайн-правки).
      // dirty снимает САМ cloudPushNow и ТОЛЬКО при успехе — здесь снимать нельзя,
      // иначе при сбое выгрузки маркер «не синхронизировано» потеряется и pull затрёт правки.
      if(cloudEmpty){ saveStockSig(cid,{}); saveSyncSig(cid,"jr",{}); try{ localStorage.setItem(cloudDirtyKey(cid),"1"); }catch(_){} }   // облако пусто → ПОЛНАЯ выгрузка; dirty ДО push: при сбое сети маркер «не синхронизировано» не потеряется (push повторится)
      await cloudPushNow();
    } else {
      await cloudPull(cid);
    }
  }catch(e){
    console.warn("cloudActivate", e); setSyncStatus("error", "Не удалось сохранить — проверьте интернет");
    // транзиентная ошибка (сессия не успела зарегистрироваться и т.п.) → повтор с backoff, чтобы синк состоялся
    if(cloudOnline() && attempt < 6) setTimeout(()=>{ cloudActivate(cid, attempt+1).catch(()=>{}); }, Math.min(3000+attempt*2000, 15000));
  }
  finally{ cloud.busy=false; cloudSubscribe(cid); }
}
async function cloudPull(cid){
  if(!cid || !cloudOnline()) return;
  if(isOffShift(cid)) return;   // снят со смены: RLS вернёт пусто — НЕ затираем локальные данные пустотой
  // dirty без прав редактирования: push невозможен → иначе pull навсегда no-op (бухгалтер/демоут).
  // Снимаем dirty ТОЛЬКО после успешного backup — иначе правки теряются без копии (QuotaExceeded и т.п.).
  // Один слот на cloudId — не плодим профили при каждом pull.
  if(localStorage.getItem(cloudDirtyKey(cid)) && typeof canEditStock==="function" && !canEditStock()){
    let backed = false;
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw){ backed = true; }   // нечего сохранять
      else {
        const bkTag = `${NS}vahtahoz_viewonly_bak_${cid}`;
        let bkId = null;
        try{ bkId = localStorage.getItem(bkTag); }catch(_){}
        if(!bkId || !profiles.list.some(p=>p.id===bkId)){
          bkId = uid();
          profiles.list.push({ id:bkId, name: cleanName40((cloud.bases[cid]||"База")+" (локальная копия)") });
          try{ localStorage.setItem(bkTag, bkId); }catch(_){}
        } else {
          const p = profiles.list.find(x=>x.id===bkId);
          if(p) p.name = cleanName40((cloud.bases[cid]||"База")+" (локальная копия)");
        }
        localStorage.setItem(slotKey(bkId), raw);
        saveProfiles(profiles);
        backed = true;
        toast("Локальные правки сохранены копией — прав на выгрузку нет, загружаем облако");
      }
    }catch(e){ console.warn("view-only backup", e); backed = false; }
    if(backed){ try{ localStorage.removeItem(cloudDirtyKey(cid)); }catch(_){} }
    else {
      setSyncStatus("error","Нет прав на выгрузку и не удалось сохранить копию — облако не затираем");
      return;
    }
  }
  // защита: не затирать НЕсинхронизированные локальные правки облачными данными
  if(cloud.pushPending || localStorage.getItem(cloudDirtyKey(cid))){ cloudMaybePush(); return; }
  const perm = activeMember();
  cloud.applying=true;
  setSyncStatus("syncing","Загрузка из облака…");
  try{
    // ПРЯМОЙ fetch с токеном (cloudRest) — не зависит от регистрации сессии в supabase-клиенте,
    // который в iOS standalone-PWA мог ВИСНУТЬ без таймаута («Загрузка из облака» навсегда).
    // cloudRest кидает исключение при ошибке/таймауте → попадём в catch и НЕ затрём локальное пустым.
    const tok = cloud.session && cloud.session.access_token;
    // пагинация обязательна: иначе PostgREST обрезает на 1000 и локальный склад «прыгает»
    const items = await cloudRestAll(`stock_items?select=*&base_id=eq.${encodeURIComponent(cid)}&order=id`, tok, {timeout:120000});
    const jr    = await cloudRestAll(`journal_entries?select=*&base_id=eq.${encodeURIComponent(cid)}&order=id`, tok, {timeout:90000});
    const baseArr = await cloudRest(`bases?select=settings&id=eq.${encodeURIComponent(cid)}`, tok);
    const base = Array.isArray(baseArr) ? baseArr[0] : null;
    // ЗАЩИТА ОТ ГОНКИ: пока шла загрузка (долгие await выше), пользователь мог
    // успеть отредактировать данные → cloudMaybePush уже выставил dirty. НЕ затираем
    // его правку облачными данными — выходим, finally до-выгрузит локальное (push).
    if(localStorage.getItem(cloudDirtyKey(cid))){
      setSyncStatus("syncing","Отправка изменений в облако…");
      return;
    }
    // ошибок нет → применяем (только теперь перезаписываем локальные данные)
    // id из БД проходят safeId (защита inline-onclick на случай порчи данных в облаке)
    state.stock = (items||[]).map(rowToStock).map(s=>{
      s.id = safeId(s.id);
      return normalizeStockItem(s);   // та же чистка, что при импорте: type-whitelist (XSS), партии, пересчёт qty из партий
    });
    const J=emptyJournals();
    const _delJrSet = new Set(Array.isArray(state.delJr)?state.delJr:[]);   // не воскрешаем явно удалённые (если облачное удаление ещё не доехало / чужой re-push)
    (jr||[]).forEach(r=>{ const rid=safeId(r.id); if(_delJrSet.has(rid)) return; if(J[r.kind]) J[r.kind].push({ ...(r.data||{}), id:rid }); });
    for(const k in J) J[k] = J[k].sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
    state.journals = J;
    // снимок подписей строим ПО СЫРЫМ облачным данным (ДО сверки) — тогда, если сверка что-то
    // поправит, дельта-push увидит расхождение и выгрузит исправление в облако.
    const pulledStSig = {}; state.stock.forEach(s=>{ pulledStSig[s.id]=_sigOf(stockToRow(s,cid)); });
    // После pull: только безопасный подъём остатков / создание orphan-карточек.
    // НЕ вызываем mergeDuplicateStockByName здесь: слияние дублей + dirty→push удаляло «лишние»
    // id из облака и резко роняло счётчик «в наличии» (дубли с qty схлопывались).
    let _reconChanged = false;
    if(canEditStock()){
      try{
        relinkJournalOpsToCanonical();
        const created = ensureProductsFromJournalLedger();
        const rec = reconcileLegacyQtyFromJournal(false);
        _reconChanged = !!(rec.fixed || created);
      }catch(e){ console.warn("post-pull stock reconcile", e); }
    }
    for(const k in J) J[k] = J[k].slice(0,500);
    state.journals = J;
    // ЗАДАЧИ НЕ ТЯНЕМ из облака — они общие-локальные (одно расписание на все базы),
    // не зависят от базы и не видны начальнику. state.tasks остаётся как есть (из loadGlobalTasks).
    if(base && base.settings){
      // санитайзим имена из облака (их мог задать любой участник с edit_stock) — как при локальной загрузке
      ensureTomb();
      const clean = uniqClean;
      const cs = base.settings;
      for(const k of STOCK_TYPE_KEYS){
        // надгробия из облака — источник; вычитаем их из применяемых списков (удаление распространилось)
        const tL = Array.isArray(cs.deletedLocations?.[k]) ? clean(cs.deletedLocations[k]) : [];
        const tC = Array.isArray(cs.deletedCategories?.[k]) ? clean(cs.deletedCategories[k]) : [];
        state.delLoc[k]=tL; state.delCat[k]=tC;
        if(Array.isArray(cs.locations?.[k]) && cs.locations[k].length) state.locations[k]=applyTomb(clean(cs.locations[k]), tL);
        else if(tL.length) state.locations[k]=applyTomb(state.locations[k]||[], tL);   // надгробия применяем даже при пустом облачном списке (иначе удаление не вступит в силу в этой сессии)
        if(Array.isArray(cs.categories?.[k]) && cs.categories[k].length) state.categories[k]=applyTomb(clean(cs.categories[k]), tC);
        else if(tC.length) state.categories[k]=applyTomb(state.categories[k]||[], tC);
      }
      // подпись настроек = только что загруженное → не будем зря пере-выгружать на следующем push
      try{ saveSyncSig(cid,"settings",{ v:_sigOf({ locations:state.locations, categories:state.categories, deletedLocations:state.delLoc, deletedCategories:state.delCat }) }); }catch(_){}
    }
    saveState();                              // cloud.applying=true → push не сработает (без эха)
    // снимок подписей = СЫРОЕ облачное (до сверки) → если сверка исправила остаток,
    // следующий push увидит дельту и выгрузит исправление; иначе — пусто, лишнего трафика нет.
    try{
      saveStockSig(cid, pulledStSig);
      // allowed-снимки = то, что RLS реально отдал этой роли (иначе type-restricted
      // delete ждёт stockAllowed с push и после pull удаления не уходят в облако)
      saveSyncSig(cid, "stockAllowed", pulledStSig);
      const jSig={}; for(const k of JOURNAL_KEYS) for(const op of (state.journals[k]||[])) jSig[op.id]=_sigOf({kind:k,data:op});
      saveSyncSig(cid,"jr",jSig);
      saveSyncSig(cid,"jrAllowed",jSig);
    }catch(_){}
    // исправления сверки (только у редакторов) — помечаем к выгрузке, чтобы облако тоже обновилось
    if(_reconChanged){ try{ localStorage.setItem(cloudDirtyKey(cid),"1"); }catch(_){} }
    setSyncStatus("synced","Загружено из облака");
  }catch(e){
    console.warn("cloudPull", e);
    setSyncStatus("error", "Не удалось загрузить — проверьте интернет и нажмите ↻ (обновить) вверху");
    // слабая сеть/таймаут → повторим (мягкий backoff), пока онлайн
    if(cloudOnline()){ clearTimeout(cloud.pullRetryT); cloud.pullRetryT=setTimeout(()=>{ if(cloud.ready && cloud.session && !cloud.busy && activeCloudId()===cid) cloudPull(cid).catch(()=>{}); }, 8000); }  // handle хранится → отменяется при выходе; не тянем после logout/смены профиля
  }
  finally{
    cloud.applying=false;
    // если во время загрузки появилась несинхронизированная правка — до-выгружаем её
    if(localStorage.getItem(cloudDirtyKey(cid))) cloudMaybePush();
    render();
  }
}
function cloudMaybePush(){
  if(!cloud.ready) return;
  const cid = activeCloudId(); if(!cid) return;
  // РОЛИ ТОЛЬКО ДЛЯ ПРОСМОТРА (бухгалтер / снят со смены): пушить нечего и НЕЛЬЗЯ по RLS.
  // НЕ ставим dirty — иначе saveState() после pull пометил бы базу «грязной», push вышел бы
  // без снятия флага, и следующий cloudPull молча пропускал бы обновления (view-only «залипал»).
  if(typeof canEditStock==="function" && !canEditStock()) return;
  // помечаем «не синхронизировано» СРАЗУ — флаг снимется только после успешной выгрузки.
  // Так переключение базы/перезагрузка не теряет отложенные правки: при возврате
  // cloudActivate увидит dirty и выгрузит локальное, а не затрёт его pull-ом.
  // ВАЖНО: dirty ставим ДО проверки cloud.applying — если прямо сейчас идёт cloudPull,
  // правка пользователя в это окно иначе осталась бы непомеченной и была бы затёрта.
  try{ localStorage.setItem(cloudDirtyKey(cid),"1"); }catch(e){}
  if(cloud.applying) return;   // идёт pull — он сам увидит dirty, НЕ затрёт правку и до-выгрузит её
  if(!cloudOnline()){ setSyncStatus("offline"); return; }   // ждём сеть — уйдёт по событию "online"
  cloud.pushPending = true;                  // есть ожидающая выгрузка — realtime-pull её не затрёт
  setSyncStatus("syncing","Сохранение в облако…");
  clearTimeout(cloud.pushTimer);
  cloud.pushTimer = setTimeout(()=>cloudPushNow(), 600);
}
// --- ДЕЛЬТА-СИНХРОНИЗАЦИЯ: шлём только изменённые/удалённые строки, прямым fetch ---
// стабильная подпись строки (порядок ключей не важен) — для сравнения «изменилось ли»
function _stableStr(o){
  if(Array.isArray(o)) return "["+o.map(_stableStr).join(",")+"]";
  if(o && typeof o==="object") return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+_stableStr(o[k])).join(",")+"}";
  return JSON.stringify(o);
}
function _sigOf(obj){ const s=_stableStr(obj); let h1=0x811c9dc5, h2=0; for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); h1=(h1^c)>>>0; h1=Math.imul(h1,0x01000193)>>>0; h2=(h2*131+c)|0; } return h1.toString(36)+h2.toString(36)+":"+s.length; }
function loadSyncSig(cid, kind){ try{ return JSON.parse(localStorage.getItem(`${NS}vahtahoz_sig_${kind}_${cid}`)||"{}"); }catch(_){ return {}; } }
function saveSyncSig(cid, kind, map){ try{ localStorage.setItem(`${NS}vahtahoz_sig_${kind}_${cid}`, JSON.stringify(map)); }catch(_){} }
// счётчики позиций склада ПО ТИПАМ — чтобы suspectWipe работал и для ограниченных ролей (Механик/Повар):
// сравниваем с ожиданием ПО ДОСТУПНЫМ типам (per-type корректно даже если снимок от прежней, более широкой роли).
function stockTypeCounts(){ const c={}; for(const k of STOCK_TYPE_KEYS) c[k]=0; for(const s of (state.stock||[])){ if(c[s.type]!=null) c[s.type]++; } return c; }
// снимок КОЛИЧЕСТВ по позициям (id→qty) на момент синка — база для 3-стороннего слияния (STOCK_MERGE).
function stockValsSnap(){ const v={}; for(const s of (state.stock||[])) v[s.id]=Number(s.qty)||0; return v; }
function saveStockSig(cid, map){ saveSyncSig(cid,"stock",map); saveSyncSig(cid,"stockCounts", stockTypeCounts()); saveSyncSig(cid,"stockVals", stockValsSnap()); }
// 3-стороннее слияние количества ПЕРЕД выгрузкой изменённых позиций: правит upsert-строки, curSig и локальный
// state.stock так, чтобы конкурентные списания с двух устройств складывались (merged = local + cloud − снимок).
// Только позиции БЕЗ партий; партийные при расхождении не трогаем (qty=Σпартий) — предупреждаем о ручной сверке.
async function mergeStockQtyBeforePush(cid, tok, upsert, curSig){
  try{
    const ids = upsert.map(r=>r.id); if(!ids.length) return;
    // чанкуем id=in.(...) — иначе длинный URL режется прокси/PostgREST
    const cloudById={};
    const size=100;
    for(let i=0;i<ids.length;i+=size){
      const chunk = ids.slice(i,i+size);
      const cloudRows = await cloudRest(`stock_items?select=id,qty,batches&base_id=eq.${encodeURIComponent(cid)}&id=in.(${chunk.map(encodeURIComponent).join(",")})`, tok);
      if(Array.isArray(cloudRows)) cloudRows.forEach(cr=>cloudById[cr.id]=cr);
    }
    if(!Object.keys(cloudById).length) return;
    const snap = loadSyncSig(cid,"stockVals");   // {id: qty} на момент последнего синка
    let localChanged=false, conflictBatched=0;
    for(const r of upsert){
      const cr=cloudById[r.id]; if(!cr) continue;                          // в облаке нет — новая позиция
      const cloudQty=Number(cr.qty)||0;
      const snapQty=Number(snap[r.id]);
      if(!isFinite(snapQty)){
        // нет базы 3-way — не LWW; партийные: qty+batches из cloud (иначе qty облака + локальные партии)
        const batched = (Array.isArray(r.batches)&&r.batches.length) || (Array.isArray(cr.batches)&&cr.batches.length);
        if(batched){
          conflictBatched++;
          r.qty = cloudQty;
          if(Array.isArray(cr.batches)) r.batches = cr.batches;
          curSig[r.id]=_sigOf(r);
          const it=state.stock.find(s=>s.id===r.id);
          if(it){ it.qty=cloudQty; if(Array.isArray(cr.batches)) it.batches=cr.batches; localChanged=true; }
        } else if(cloudQty !== (Number(r.qty)||0)){
          r.qty = cloudQty; curSig[r.id]=_sigOf(r);
          const it=state.stock.find(s=>s.id===r.id); if(it && Number(it.qty)!==cloudQty){ it.qty=cloudQty; localChanged=true; }
        }
        continue;
      }
      if(cloudQty===snapQty) continue;                                     // облако не менялось с снимка → конфликта нет, local победит
      // НЕ пропускаем «local не менял qty, cloud упал»: иначе правка имени/заметки на офлайн-устройстве
      // заливала бы старый qty поверх чужого списания (воскрешение остатка). 3-way даёт cloud при
      // local===snap. Оптовое обнуление облака ловит suspectWipe выше по push.
      const batched = (Array.isArray(r.batches)&&r.batches.length) || (Array.isArray(cr.batches)&&cr.batches.length);
      if(batched){
        // не LWW: при расхождении партий берём облако (иначе локальный upsert воскресит старые партии)
        conflictBatched++;
        r.qty = cloudQty;
        if(Array.isArray(cr.batches)) r.batches = cr.batches;
        curSig[r.id]=_sigOf(r);
        const it=state.stock.find(s=>s.id===r.id);
        if(it){
          if(Number(it.qty)!==cloudQty){ it.qty=cloudQty; localChanged=true; }
          if(Array.isArray(cr.batches)){ it.batches = cr.batches; localChanged=true; }
        }
        continue;
      }
      const merged = Math.max(0, roundQty((Number(r.qty)||0) + cloudQty - snapQty));   // 3-way CRDT-счётчик
      r.qty = merged; curSig[r.id]=_sigOf(r);                              // упсертим merged; снимок = merged (local сойдётся с cloud)
      const it=state.stock.find(s=>s.id===r.id); if(it && Number(it.qty)!==merged){ it.qty=merged; localChanged=true; }
    }
    if(localChanged){ const _w=cloud.applying; cloud.applying=true; try{ saveState(); }finally{ cloud.applying=_w; } try{ render(); }catch(_){} }
    if(conflictBatched){ try{ toast(`Расхождение остатков по ${conflictBatched} позиц. с партиями — проверьте вручную и при необходимости сверьте экспортом`); }catch(_){} }
  }catch(e){ console.warn("stock 3-way merge → без слияния (прежнее LWW)", e); }   // при сбое — прежнее поведение, без потери доступности
}
// ОБЪЕДИНЕНИЕ настроек (места/категории) с облаком — union списков по каждому типу.
// Так одновременная выгрузка двух устройств НЕ затирает чужие добавления (последний-победил
// заменился бы на сложение). Удаление РАСПРОСТРАНЯЕТСЯ через надгробия (deletedLocations/Categories):
// union имён минус актуальные надгробия. Повторное добавление имени снимает надгробие (revive).
function mergeSettings(cloudSet, localSet){
  const out={ locations:{}, categories:{}, deletedLocations:{}, deletedCategories:{} };
  const u = unionClean;
  for(const k of STOCK_TYPE_KEYS){
    const lLoc=(localSet.locations&&localSet.locations[k])||[], lCat=(localSet.categories&&localSet.categories[k])||[];
    // надгробия объединяем, НО имя, присутствующее в локальном списке (т.е. заново добавленное),
    // из надгробий исключаем — иначе повторное добавление удалённого имени не приживалось бы.
    const tL=u(cloudSet.deletedLocations&&cloudSet.deletedLocations[k], localSet.deletedLocations&&localSet.deletedLocations[k]).filter(n=>!lLoc.includes(n));
    const tC=u(cloudSet.deletedCategories&&cloudSet.deletedCategories[k], localSet.deletedCategories&&localSet.deletedCategories[k]).filter(n=>!lCat.includes(n));
    out.deletedLocations[k]=tL; out.deletedCategories[k]=tC;
    // из union'а имён вычитаем актуальные надгробия → удаление распространяется, имя не воскресает
    out.locations[k]=applyTomb(u(cloudSet.locations&&cloudSet.locations[k], lLoc), tL);
    out.categories[k]=applyTomb(u(cloudSet.categories&&cloudSet.categories[k], lCat), tC);
  }
  return out;
}
// upsert пачками прямым fetch (merge по первичному ключу id)
async function cloudRestUpsert(table, rows, tok, onProgress){
  const size=100;
  for(let i=0;i<rows.length;i+=size){
    await cloudRest(table, tok, { method:"POST", returnResponse:true, timeout:60000,
      headers:{ "Content-Type":"application/json", "Prefer":"resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows.slice(i,i+size)) });
    if(onProgress) onProgress(Math.min(i+size,rows.length), rows.length);
  }
}
// удаление пачками прямым fetch (id=in.(...))
async function cloudRestDelete(table, ids, tok){
  const size=100;
  for(let i=0;i<ids.length;i+=size){
    const inList = ids.slice(i,i+size).map(id=>encodeURIComponent(id)).join(",");
    await cloudRest(`${table}?id=in.(${inList})`, tok, { method:"DELETE", returnResponse:true, timeout:45000, headers:{ "Prefer":"return=minimal" } });
  }
}

        del.forEach(id=>{ delete mergedSig[id]; });
        saveStockSig(cid, mergedSig);
        saveSyncSig(cid, "stockAllowed", curSig);
        // === НАСТРОЙКИ (места/категории) — СВОЯ дельта, НЕ на каждое изменение склада ===
        // Шлём ТОЛЬКО если списки реально менялись (иначе смена количества зря переписывала
        // блоб и могла затереть чужие правки). При выгрузке ОБЪЕДИНЯЕМ с облаком (union) —
        // одновременная выгрузка двух устройств не теряет добавления ни одного из них.
        ensureTomb();
        const setObj={ locations:state.locations, categories:state.categories, deletedLocations:state.delLoc, deletedCategories:state.delCat };
        const setSig=_sigOf(setObj);
        const prevSet=loadSyncSig(cid,"settings");
        if(setSig !== prevSet.v){
          try{
            const cur=await cloudRest(`bases?select=settings&id=eq.${encodeURIComponent(cid)}`, tok);
            const cloudSet=(Array.isArray(cur)&&cur[0]&&cur[0].settings)||{};
            const merged=mergeSettings(cloudSet, setObj);
            await cloudRest(`bases?id=eq.${encodeURIComponent(cid)}`, tok, { method:"PATCH", returnResponse:true,
              headers:{ "Content-Type":"application/json", "Prefer":"return=minimal" },
              body: JSON.stringify({ settings: merged }) });
            // в облако ушёл merged (объединение). Применяем его И локально, чтобы локальное == облако,
            // и сохраняем подпись MERGED. Иначе локальная подпись (≠ merged) расходится с облаком →
            // следующий push снова считает настройки «изменёнными» и шлёт PATCH каждый раз (лишний трафик).
            state.locations=merged.locations; state.categories=merged.categories;
            state.delLoc=merged.deletedLocations; state.delCat=merged.deletedCategories;
            const _wasApplying=cloud.applying; cloud.applying=true; try{ saveState(); }finally{ cloud.applying=_wasApplying; }   // пишем merged в localStorage (память↔диск), applying — чтобы saveState не дёрнул новый push
            saveSyncSig(cid,"settings",{ v:_sigOf(merged) });
          }catch(e){ console.warn("settings push", e); }
        }
      }
      // === ЖУРНАЛЫ (дельта upsert; удаление — только явное, под порогом архива) ===
      // как склад: пушим только типы, видимые роли (иначе RLS-403 → push в retry, sync залипает)
      const _jrType = (op)=>{
        if(op && STOCK_TYPE_KEYS.includes(op.stockType)) return op.stockType;
        if(op && op.productId){ const s=state.stock.find(x=>x.id===op.productId); if(s && s.type) return s.type; }
        return "product";
      };
      const jrows=[]; const curJSig={};
      for(const k of JOURNAL_KEYS) for(const op of (state.journals?.[k]||[])){
        if(!_at.includes(_jrType(op))) continue;
        jrows.push({id:op.id,base_id:cid,kind:k,data:op}); curJSig[op.id]=_sigOf({kind:k,data:op});
      }
      const prevJSig = loadSyncSig(cid,"jr");
      // УСЕЧЕНИЕ по квоте (slice 500) НЕ удаляет из облака — архив полный (нет надгробия).
      // ЯВНОЕ удаление пользователя (deleteOp → tombJr) удаляет из облака — иначе pull воскрешал бы запись.
      // Удаляем только надгробленные id, которые РЕАЛЬНО были в облаке (есть в prevJSig) — по одному разу.
      // БЕЗ .catch у DELETE: сбой должен уйти в общий catch push-а (dirty останется, ретрай повторит) —
      // иначе подпись сохранялась без удаления, и запись жила в облаке вечно.
      // type-restricted: надгробия только по записям, которые эта роль могла выгружать (иначе снесём чужой тип)
      const prevJrAllowed = loadSyncSig(cid,"jrAllowed");
      const haveJrAllowed = prevJrAllowed && Object.keys(prevJrAllowed).length>0;
      const jrToDel = (Array.isArray(state.delJr)?state.delJr:[]).filter(id=>{
        if(prevJSig[id]===undefined) return false;
        if(!_typeRestricted) return true;
        return haveJrAllowed && prevJrAllowed[id]!==undefined;
      });
      if(!(jrows.length===0 && Object.keys(prevJSig).length>0)){
        const jup = jrows.filter(r=> curJSig[r.id]!==prevJSig[r.id]);
        if(jup.length) await cloudRestUpsert("journal_entries", jup, tok);
        if(jrToDel.length){ await cloudRestDelete("journal_entries", jrToDel, tok); dropDeliveredTombstones(jrToDel); }
        // merge: скрытые ops остаются в подписи (не считаются «удалёнными» при следующем push)
        const mergedJ = _typeRestricted ? { ...prevJSig } : {};
        Object.keys(curJSig).forEach(id=>{ mergedJ[id]=curJSig[id]; });
        jrToDel.forEach(id=>{ delete mergedJ[id]; });
        saveSyncSig(cid,"jr",mergedJ);
        saveSyncSig(cid,"jrAllowed",curJSig);
      } else if(jrToDel.length){
        // wipe-защита пропустила выгрузку (журнал локально «опустел»), но ЯВНЫЕ надгробия всё равно
        // доставляем: пользователь удалил последние записи — они должны уйти и из облака.
        await cloudRestDelete("journal_entries", jrToDel, tok);
        dropDeliveredTombstones(jrToDel);
        const trimmed = { ...prevJSig }; jrToDel.forEach(id=>{ delete trimmed[id]; });
        saveSyncSig(cid,"jr",trimmed);
        if(_typeRestricted){
          const ta = { ...prevJrAllowed }; jrToDel.forEach(id=>{ delete ta[id]; });
          saveSyncSig(cid,"jrAllowed",ta);
        }
      }
    }
    // ЗАДАЧИ НЕ ВЫГРУЖАЕМ — они общие-локальные (одно расписание на все базы устройства).
    if(_suspectWipe){
      // склад выглядит повреждённым: НЕ снимаем dirty (чтобы при восстановлении не потерять маркер) и зовём обновить из облака
      setSyncStatus("error","Склад выглядит повреждённым — нажмите ↻ (обновить) вверху, чтобы восстановить из облака");
    } else {
      try{ localStorage.removeItem(cloudDirtyKey(cid)); }catch(e){}
      setSyncStatus("synced");
    }
  }catch(e){
    console.warn("cloudPushNow", e);
    if(!cloudOnline()){ setSyncStatus("offline"); }   // ждём сеть → событие "online" доpush-ит
    else {
      setSyncStatus("error");
      // транзиентная ошибка — авто-повтор пока есть несинхронизированное и сеть
      clearTimeout(cloud.retryTimer);
      cloud.retryTimer = setTimeout(()=>{ if(localStorage.getItem(cloudDirtyKey(activeCloudId()))) cloudPushNow(); }, 6000);
    }
  }
  finally{ cloud.busy=_outerBusy; cloud.pushPending=false; }   // восстанавливаем прежнее: вложенный вызов оставит busy=true до finally самого cloudActivate
}
// ===================== ЗАДАЧИ В ОБЛАКЕ (scope по владельцу, не по базе) =====================
// Задачи — ОБЩИЕ для всех баз устройства (одно расписание у хоза). В облаке хранятся
// в таблице tasks, привязанной к owner_id = uid пользователя (RLS: видишь только свои).
// Не зависят от активной базы; синкаются отдельно от склада/журналов. Дельта, как у склада.
const TASKS_DIRTY = NS+"vahtahoz_tasks_dirty";
const TASKS_OWNER = NS+"vahtahoz_tasks_owner";   // uid владельца локальных задач — защита от утечки при смене аккаунта на устройстве
function activeUid(){ return (cloud.session && cloud.session.user && cloud.session.user.id) || null; }
function _tasksSigMap(){ const m={}; for(const t of (state.tasks||[])){ if(t && t.id!=null) m[String(t.id)]=_sigOf({data:t}); } return m; }
function tasksChangedVsCloud(uid){
  const cur=_tasksSigMap(); const prev=loadSyncSig(uid,"tasks");
  const ck=Object.keys(cur), pk=Object.keys(prev);
  if(ck.length!==pk.length) return true;
  for(const k of ck){ if(cur[k]!==prev[k]) return true; }
  return false;
}
// помечаем задачи к выгрузке и планируем push — но ТОЛЬКО при реальном изменении задач
// (saveGlobalTasks зовётся на каждом saveState, в т.ч. при правках склада — там задачи не менялись)
function cloudMaybePushTasks(){
  if(!cloud.ready) return;
  const uid=activeUid(); if(!uid) return;
  if(!tasksChangedVsCloud(uid)) return;       // задачи не изменились — тихо выходим
  try{ localStorage.setItem(TASKS_DIRTY,"1"); }catch(e){}
  if(!cloudOnline()) return;                   // уйдёт по событию online
  clearTimeout(cloud.tasksTimer);
  cloud.tasksTimer=setTimeout(()=>cloudPushTasksNow(), 700);
}
async function cloudPushTasksNow(){
  const uid=activeUid(); if(!uid || !cloud.ready || !cloudOnline()) return;
  cloud.tasksBusy=true;                       // своя выгрузка идёт — realtime-эхо не должно дёргать pull
  try{
    const tok=cloud.session.access_token;
    const rows=(state.tasks||[]).filter(t=>t&&t.id!=null).map(t=>({ id:String(t.id), owner_id:uid, data:t }));
    const curSig={}; rows.forEach(r=>{ curSig[r.id]=_sigOf({data:r.data}); });
    const prevSig=loadSyncSig(uid,"tasks");
    const upsert=rows.filter(r=> curSig[r.id]!==prevSig[r.id]);
    const del=Object.keys(prevSig).filter(id=> !(id in curSig));
    // ЗАЩИТА: пустой локальный список НЕ стирает облако (порча слота / частичная загрузка),
    // как у склада. Если задач реально 0, удаление не шлём — облако переживёт, восстановится pull-ом.
    if(del.length && rows.length>0) await cloudRestDelete("tasks", del, tok);
    if(upsert.length) await cloudRestUpsert("tasks", upsert, tok);
    saveSyncSig(uid,"tasks",curSig);
    try{ localStorage.removeItem(TASKS_DIRTY); localStorage.setItem(TASKS_OWNER, uid); }catch(e){}
  }catch(e){
    console.warn("cloudPushTasks", e);
    if(cloudOnline()){ clearTimeout(cloud.tasksRetry); cloud.tasksRetry=setTimeout(()=>{ if(localStorage.getItem(TASKS_DIRTY)) cloudPushTasksNow(); }, 6000); }
  }
  finally{ cloud.tasksBusy=false; }
}
async function cloudPullTasks(){
  const uid=activeUid(); if(!uid || !cloudOnline()) return;
  if(localStorage.getItem(TASKS_DIRTY)){ cloudMaybePushTasks(); return; }   // есть несинхр. правки — не затираем
  try{
    const tok=cloud.session.access_token;
    const rows=await cloudRestAll(`tasks?select=*&owner_id=eq.${encodeURIComponent(uid)}`, tok, {timeout:30000});
    if(localStorage.getItem(TASKS_DIRTY)) return;                            // успел отредактировать во время загрузки → не затираем
    // САНИТАЙЗ: id задачи И id пунктов чек-листа — оба идут из облака (jsonb от любого участника)
    // и подставляются в inline-onclick (toggleTaskItem). Без safeId на items[].id — XSS-вектор.
    state.tasks=(rows||[]).map(r=>{
      const t={ ...(r.data||{}), id:safeId(r.id) };
      if(Array.isArray(t.items)) t.items=t.items.map(i=>({ id:safeId(i&&i.id), text:String((i&&i.text)||"").slice(0,200), done:!!(i&&i.done) }));
      return t;
    });
    sanitizeIds(state.tasks);
    try{ localStorage.setItem(TASKS_KEY, JSON.stringify(state.tasks)); }catch(e){}   // прямо в localStorage, БЕЗ повторного push
    saveSyncSig(uid,"tasks",_tasksSigMap());
    try{ localStorage.setItem(TASKS_OWNER, uid); }catch(e){}
    if(currentView==="tasks") render();
  }catch(e){ console.warn("cloudPullTasks", e); }
}
// решает: выгрузить локальные задачи (первая миграция) или подтянуть облачные (восстановление)
async function cloudSyncTasks(){
  const uid=activeUid(); if(!uid || !cloudOnline()) return;
  if(localStorage.getItem(TASKS_DIRTY)){ cloudMaybePushTasks(); return; }
  // ЗАЩИТА ОТ УТЕЧКИ: если локальные задачи принадлежат ДРУГОМУ пользователю (вход другим аккаунтом
  // на этом устройстве) — чистим их, чтобы не выгрузить чужие задачи в облако текущего юзера.
  const owner=localStorage.getItem(TASKS_OWNER);
  if(owner && owner!==uid){
    state.tasks=[]; try{ localStorage.setItem(TASKS_KEY,"[]"); }catch(_){}
    saveSyncSig(uid,"tasks",{});
    if(currentView==="tasks") render();
  }
  try{
    const tok=cloud.session.access_token;
    const ids=await cloudRest(`tasks?select=id&owner_id=eq.${encodeURIComponent(uid)}`, tok);
    const cloudEmpty=!(Array.isArray(ids)&&ids.length);
    const localHas=(state.tasks||[]).length>0;
    const neverSynced=Object.keys(loadSyncSig(uid,"tasks")).length===0;
    if(cloudEmpty && localHas && neverSynced){
      // первый раз: облако пусто, локально есть задачи → выгружаем (НЕ затираем локальное!)
      saveSyncSig(uid,"tasks",{});            // дельта против пустого снимка = всё
      await cloudPushTasksNow();
    } else {
      await cloudPullTasks();                  // облачные задачи — источник (в т.ч. после чистки кэша)
    }
  }catch(e){ console.warn("cloudSyncTasks", e); }
}
/* realtime: на любое изменение в облаке — отложенный пере-pull активной базы */
function cloudSubscribe(cid){
  if(!cid || cloud.subscribedBase===cid) return;
  cloudUnsubscribe();
  try{
    const sb = cloud.sb;
    cloud.channel = sb.channel("base-"+cid)
      .on("postgres_changes",{event:"*",schema:"public",table:"stock_items",filter:"base_id=eq."+cid}, cloudOnRemote)
      .on("postgres_changes",{event:"*",schema:"public",table:"journal_entries",filter:"base_id=eq."+cid}, cloudOnRemote)
      .subscribe();
    cloud.subscribedBase = cid;
  }catch(e){ console.warn("cloudSubscribe", e); }
}
function cloudUnsubscribe(){
  try{ if(cloud.channel) cloud.sb.removeChannel(cloud.channel); }catch(e){}
  cloud.channel=null; cloud.subscribedBase=null;
}
// realtime для задач — отдельный канал по владельцу (не зависит от активной базы, не пересоздаётся при смене базы)
function cloudSubscribeTasks(){
  const uid=activeUid(); if(!uid || cloud.tasksSubUid===uid) return;
  try{
    if(cloud.tasksChannel) cloud.sb.removeChannel(cloud.tasksChannel);
    cloud.tasksChannel = cloud.sb.channel("tasks-"+uid)
      .on("postgres_changes",{event:"*",schema:"public",table:"tasks",filter:"owner_id=eq."+uid}, ()=>{
        clearTimeout(cloud.tasksPullTimer);
        if(cloud.tasksBusy) return;                                              // эхо собственной выгрузки — игнор
        if(localStorage.getItem(TASKS_DIRTY)){ cloudMaybePushTasks(); return; }   // свои правки важнее — не затираем
        cloud.tasksPullTimer=setTimeout(()=>cloudPullTasks(), 400);
      })
      .subscribe();
    cloud.tasksSubUid=uid;
  }catch(e){ console.warn("cloudSubscribeTasks", e); }
}
function cloudOnRemote(){
  clearTimeout(cloud.pullTimer);               // всегда гасим прежний отложенный pull, иначе он сработает после dirty и затрёт правки
  if(cloud.busy || cloud.pushPending || cloud.applying) return;  // push/pull в полёте — не стартуем второй pull
  // есть несинхронизированные локальные правки → не тянем (затёрли бы своё); сначала выгрузим их
  const cid0 = activeCloudId();
  if(cid0 && localStorage.getItem(cloudDirtyKey(cid0))){ cloudMaybePush(); return; }
  cloud.pullTimer = setTimeout(()=>{ const cid=activeCloudId(); if(cid) cloudPull(cid); }, 400);
}

// перечитать ТОЛЬКО свои членства (active/права) — чтобы возврат/снятие со смены подхватились без перезахода
async function cloudRefreshMyMembership(){
  try{
    if(cloud.busy) return;   // не переписываем cloud.members посреди идущего синка (push/pull читают права)
    const tok=cloud.session && cloud.session.access_token; const uid=cloud.profile && cloud.profile.id;
    if(!tok || !uid) return;
    // тянем членства + территориальные роли + карту база→партия одним заходом (иначе canManageBase/myRank
    // рассинхронятся: партийный управляющий мог бы «потерять» доступ к базе, отсутствующей в _baseParty).
    const [mem, orgs, bs] = await Promise.all([
      cloudRest(`base_members?select=*&user_id=eq.${encodeURIComponent(uid)}`, tok, {timeout:20000}),
      cloudRest(`org_roles?select=*&user_id=eq.${encodeURIComponent(uid)}`, tok, {timeout:20000}).catch(()=>null),
      cloudRest(`bases?select=id,name,party_id`, tok, {timeout:20000}).catch(()=>null),
    ]);
    if(Array.isArray(mem)) cloud.members=mem;
    if(Array.isArray(orgs)) cloud.orgRoles=orgs;
    if(Array.isArray(bs)){ cloud.bases={}; cloud._baseParty={}; bs.forEach(b=>{ cloud.bases[b.id]=b.name; cloud._baseParty[b.id]=b.party_id||null; }); }
    // если появились новые видимые базы (выдали орг-роль/добавили в базу пока сидел в приложении) — привяжем их,
    // иначе пользователь не увидит новые базы до перезахода (org_roles/base_members без реалтайма).
    if(Array.isArray(bs)){
      const linked = new Set(profiles.list.filter(x=>x.cloudId).map(x=>x.cloudId));
      if(Object.keys(cloud.bases).some(cid=>!linked.has(cid))) await cloudAutoLink();
    }
    renderHeader();
  }catch(_){}
}

(function seedFromEmbedded(){
  if(state.seededAt) return;                 // уже сидили (в т.ч. после wipeAll)
  // облачная база (привязана к облаку): источник истины — облако. Локальный seed после очистки кэша
  // мог бы запушиться поверх облака до первого pull → НЕ сидим, ждём загрузку из облака.
  try{ if(typeof activeCloudId==="function" && activeCloudId()){ state.seededAt=new Date().toISOString(); saveState(); return; } }catch(_){}
  if(state.stock && state.stock.length) { state.seededAt = new Date().toISOString(); saveState(); return; }
  const el = document.getElementById("seedData");
  if(!el) return;
  try{
    const seed = JSON.parse(el.textContent);
    if(seed.categories){
      for(const k of STOCK_TYPE_KEYS){
        state.categories[k] = Array.from(new Set([...(state.categories[k]||[]), ...(seed.categories[k]||[])]));
      }
    }
    state.stock = (seed.stock||[]).map(s=>({ ...s, id: safeId(s.id) }));
    if(Array.isArray(seed.tasks) && seed.tasks.length && !(state.tasks||[]).length){
      // активным задачам ставим СЕГОДНЯШНЮЮ дату установки — иначе фиксированная дата из seed
      // на свежей установке показалась бы просроченной
      state.tasks = seed.tasks.map(t=>({
        ...t,
        id: safeId(t.id),
        due: (!t.done && t.due) ? todayStr() : t.due,
        items: Array.isArray(t.items) ? t.items.map(i=>({ id: safeId(i.id), text: String(i.text||"").slice(0,200), done: !!i.done })) : undefined,
      }));
    }
    state.seededAt = new Date().toISOString();
    saveState();
    setTimeout(()=>toast(`Загружено ${state.stock.length} позиций`), 300);
  }catch(e){ console.warn("seed failed",e); }
})();

/* ============================================================
   PWA: регистрация service worker (внешний sw.js)
   manifest подключён в <head> отдельным файлом.
   ============================================================ */

if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(e=>console.warn("SW reg failed",e));
  });
  // когда новый SW взял управление — перезагружаем страницу, чтобы подхватить свежие ассеты.
  // ЖДЁМ завершение идущего продления токена: reload посреди ротации refresh-токена терял НОВЫЙ токен
  // (ответ не долетал), после перезагрузки старый токен = «повторно использован» → разлогин при каждом обновлении версии.
  let _swReloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(_swReloaded) return; _swReloaded = true;
    try{
      if(cloud && cloud._refreshing){ cloud._refreshing.catch(()=>{}).finally(()=>setTimeout(()=>location.reload(),100)); return; }
    }catch(_){}
    location.reload();
  });
}

/* Многовкладочность: если другая вкладка сохранила состояние — подтягиваем его,
   иначе последующий saveState() из этой вкладки молча откатил бы чужие изменения. */
// идемпотентная нормализация формы state — после ПОВТОРНОГО присвоения state (storage-событие с другого
// устройства, импорт). Стартовый блок нормализации выполняется один раз и при переприсвоении не повторяется,
// из-за чего битая/старая схема могла уронить render. Дублирует ключевые shape-гарды + чистку позиций (всё идемпотентно).
function normalizeState(){
  if(!Array.isArray(state.stock)) state.stock = [];
  if(!Array.isArray(state.tasks)) state.tasks = [];
  if(!Array.isArray(state.log))   state.log   = [];
  if(!state.journals || typeof state.journals!=="object" || Array.isArray(state.journals)) state.journals = emptyJournals();
  for(const k of JOURNAL_KEYS) if(!Array.isArray(state.journals[k])) state.journals[k] = [];
  if(!state.categories || typeof state.categories!=="object" || Array.isArray(state.categories)) state.categories = { product:[], household:[], tool:[] };
  for(const k of STOCK_TYPE_KEYS) if(!Array.isArray(state.categories[k])) state.categories[k] = (DEFAULT_CATEGORIES[k]||[]).slice();
  if(!state.locations || typeof state.locations!=="object" || Array.isArray(state.locations)){ state.locations={}; for(const k of STOCK_TYPE_KEYS) state.locations[k]=DEFAULT_LOCATIONS[k].slice(); }
  for(const k of STOCK_TYPE_KEYS){ if(!Array.isArray(state.locations[k])) state.locations[k]=[]; state.locations[k]=uniqClean(state.locations[k]); }   // пустой список мест валиден (места у каждой базы свои)
  ensureTomb();
  // вычитаем надгробия после ре-сида дефолтов — иначе ранее удалённые дефолтные места/категории
  // воскресли бы при storage-событии/импорте (как и в стартовом блоке нормализации)
  for(const k of STOCK_TYPE_KEYS){
    if(state.delLoc[k].length) state.locations[k] = applyTomb(state.locations[k], state.delLoc[k]);
    if(state.delCat[k].length && Array.isArray(state.categories[k])) state.categories[k] = applyTomb(state.categories[k], state.delCat[k]);
  }
  for(const s of state.stock) normalizeStockItem(s);
}
window.addEventListener("storage", (e)=>{
  // переключение базы на другом устройстве — пересинхронизируем метаданные профилей
  if(e.key===PROFILES_KEY && e.newValue){
    const p = loadProfiles();
    if(p){ profiles = p; renderHeader(); }
    return;
  }
  if(e.key===TASKS_KEY && e.newValue){
    // общие задачи изменились на другом устройстве/базе
    try{ loadGlobalTasks(); if(currentView==="tasks") render(); }catch(err){}
    return;
  }
  if(e.key===STORE_KEY && e.newValue){
    if(cloud.applying || cloud.busy) return;   // идёт pull/push в этой вкладке — не подменяем state под ногами (своё сохранение перепишет ключ)
    try{
      state = loadState(); normalizeState();   // битая/старая схема с другого устройства не должна ронять render
      loadGlobalTasks();                 // задачи общие — накладываем поверх per-base
      applyTheme(); render();
      toast("Данные обновлены на другом устройстве");
    }catch(err){ console.warn("storage sync failed", err); }
  }
});
